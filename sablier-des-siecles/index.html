<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="theme-color" content="#1f3a5f">
  <title>Le Sablier des Siècles</title>
  <meta name="description" content="Le Sablier des Siècles — jeu de société d'histoire pour les 5-15 ans : présentation, boutique et pages de découverte des grandes époques.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --papier: #fbf3e2;
      --carte: #ffffff;
      --encre: #1f2a37;
      --doux: #5b6573;
      --bleu: #1f3a5f;
      --orange: #e07a2e;
      --vert: #2f8f5b;
      --rouge: #c0392b;
      --bord: #e6d9bd;
      --tab-h: 64px;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
    }
    body {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      background: var(--papier); color: var(--encre);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    button, a { touch-action: manipulation; font: inherit; }
    button { cursor: pointer; }

    /* ---------- En-tête ---------- */
    header {
      flex: none; display: flex; align-items: center; gap: 10px;
      padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
      background: var(--bleu); color: #fff;
    }
    header .logo { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; color: #fff; text-decoration: none; }
    header .logo b { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .logo small { display: block; font-size: 11px; opacity: .75; font-weight: 400; }
    .icon-btn {
      position: relative; flex: none; width: 42px; height: 42px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35); background: transparent; color: #fff; font-size: 18px;
    }
    .badge {
      position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px;
      border-radius: 10px; background: var(--orange); color: #fff; font-size: 12px; font-weight: 700;
      line-height: 20px; text-align: center;
    }
    .badge[hidden] { display: none; }

    /* ---------- Zone de contenu (seule partie qui défile) ---------- */
    main {
      flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .page { max-width: 760px; margin: 0 auto; padding: 18px 16px 32px; }
    h1 { font-size: 26px; line-height: 1.2; margin: 6px 0 10px; color: var(--bleu); }
    h2 { font-size: 20px; margin: 26px 0 10px; color: var(--bleu); }
    h3 { font-size: 17px; margin: 0 0 6px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--doux); font-size: 14px; }
    .card {
      background: var(--carte); border: 2px solid var(--bord); border-radius: 16px; padding: 16px;
      margin-bottom: 12px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 48px; padding: 0 20px; border-radius: 24px; border: 0;
      background: var(--orange); color: #fff; font-weight: 700; text-decoration: none;
    }
    .btn.sec { background: transparent; color: var(--bleu); border: 2px solid var(--bleu); }
    .btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; }
    .btn:disabled { opacity: .45; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

    .hero {
      background: var(--bleu); color: #fff; border-radius: 20px; padding: 20px; margin-bottom: 18px;
      display: flex; gap: 16px; align-items: center;
    }
    .hero h1 { color: #fff; margin-top: 0; }
    .hero p { opacity: .9; }
    .hero svg { flex: none; width: 96px; height: 128px; }
    @media (max-width: 420px) { .hero { flex-direction: column; text-align: center; } .hero .row { justify-content: center; } }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
    .tag { padding: 3px 10px; border-radius: 12px; background: rgba(255,255,255,.15); font-size: 13px; }
    .card .tag { background: var(--papier); border: 1px solid var(--bord); }

    .steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
    .steps li { counter-increment: s; position: relative; padding: 0 0 14px 46px; }
    .steps li::before {
      content: counter(s); position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%;
      background: var(--orange); color: #fff; font-weight: 700; display: grid; place-items: center;
    }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .modes { grid-template-columns: 1fr; } }
    .mode { border-left: 6px solid var(--vert); }
    .mode.rouge { border-left-color: var(--rouge); }

    /* ---------- Boutique ---------- */
    .demo {
      background: #fff4d6; border: 2px dashed var(--orange); border-radius: 12px; padding: 10px 12px;
      font-size: 14px; margin-bottom: 14px;
    }
    .product { display: flex; gap: 14px; align-items: flex-start; }
    .product .vis {
      flex: none; width: 72px; height: 72px; border-radius: 14px; display: grid; place-items: center;
      font-size: 34px; background: var(--papier); border: 2px solid var(--bord);
    }
    .product .info { flex: 1; min-width: 0; }
    .price { font-size: 20px; font-weight: 800; color: var(--bleu); }
    .qty { display: inline-flex; align-items: center; gap: 8px; }
    .qty button {
      width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--bleu); background: #fff;
      color: var(--bleu); font-size: 20px; font-weight: 700; line-height: 1;
    }
    .qty span { min-width: 22px; text-align: center; font-weight: 700; }
    .line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; }
    .line.total { border-top: 2px solid var(--bord); margin-top: 6px; padding-top: 10px; font-weight: 800; font-size: 18px; }

    /* ---------- Découvrir ---------- */
    .epoque-tile {
      display: block; text-align: left; width: 100%; padding: 14px; border-radius: 16px;
      border: 2px solid var(--bord); background: var(--carte); color: var(--encre);
    }
    .epoque-tile .emo { font-size: 32px; display: block; }
    .epoque-tile b { display: block; margin-top: 4px; }
    .epoque-tile small { color: var(--doux); }
    .epoque-tile.fait { border-color: var(--vert); }
    .epoque-tile.fait b::after { content: " ✓"; color: var(--vert); }
    .frise { display: flex; gap: 4px; margin: 6px 0 16px; }
    .frise i { flex: 1; height: 8px; border-radius: 4px; background: var(--bord); }
    .frise i.on { background: var(--vert); }
    .fact { display: flex; gap: 10px; }
    .fact .n { flex: none; font-size: 22px; }
    .quiz-q { font-weight: 700; margin-bottom: 8px; }
    .quiz-opts { display: grid; gap: 8px; margin-bottom: 14px; }
    .quiz-opts button {
      text-align: left; min-height: 46px; padding: 8px 14px; border-radius: 12px;
      border: 2px solid var(--bord); background: #fff; color: var(--encre);
    }
    .quiz-opts button.ok { border-color: var(--vert); background: #e3f4ea; }
    .quiz-opts button.ko { border-color: var(--rouge); background: #fbe5e2; }
    .quiz-opts button:disabled { cursor: default; }
    .back { background: none; border: 0; color: var(--bleu); font-weight: 700; padding: 6px 0; }

    /* ---------- Barre d'onglets ---------- */
    nav.tabs {
      flex: none; display: flex; background: #fff; border-top: 2px solid var(--bord);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav.tabs a {
      flex: 1; height: var(--tab-h); display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px; color: var(--doux); text-decoration: none; font-size: 12px; font-weight: 600;
    }
    nav.tabs a span { font-size: 22px; line-height: 1; }
    nav.tabs a.on { color: var(--orange); }

    /* ---------- Fenêtre (Historique) ---------- */
    .modal {
      position: fixed; inset: 0; background: rgba(15,25,40,.55); display: flex; align-items: flex-end;
      justify-content: center; z-index: 10;
    }
    .modal[hidden] { display: none; }
    .modal .sheet {
      width: 100%; max-width: 560px; max-height: 80%; overflow-y: auto; overscroll-behavior: contain;
      background: var(--papier); border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    }
    .toast {
      position: fixed; left: 50%; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));
      transform: translateX(-50%); background: var(--encre); color: #fff; padding: 10px 16px; border-radius: 20px;
      font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#jeu" aria-label="Accueil">
      <svg width="28" height="36" viewBox="0 0 24 32" aria-hidden="true">
        <path d="M3 2h18M3 30h18M5 2c0 9 14 9 14 14S5 21 5 30M19 2c0 9-14 9-14 14s14 5 14 14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 27l4-4 4 4z" fill="#e07a2e"/>
      </svg>
      <b>Le Sablier des Siècles<small id="versionLabel">Version v1</small></b>
    </a>
    <button class="icon-btn" id="infoBtn" aria-label="Historique des versions">ⓘ</button>
    <button class="icon-btn" id="cartBtn" aria-label="Panier">🛒<span class="badge" id="cartBadge" hidden>0</span></button>
  </header>

  <main id="main"><div class="page" id="view"></div></main>

  <nav class="tabs" aria-label="Navigation principale">
    <a href="#jeu" data-tab="jeu"><span>🎲</span>Le jeu</a>
    <a href="#boutique" data-tab="boutique"><span>🛍️</span>Boutique</a>
    <a href="#decouvrir" data-tab="decouvrir"><span>🧭</span>Découvrir</a>
  </nav>

  <div class="modal" id="histModal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="histTitle">
      <h2 id="histTitle" style="margin-top:0">Historique</h2>
      <div id="histList"></div>
      <button class="btn sec" id="histClose" style="margin-top:12px">Fermer</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    // ---------- Historique des versions (la première entrée donne le numéro affiché) ----------
    var HISTORY = [
      { v: "v1", d: "2026-10-27", t: "Première version : présentation du jeu, boutique de démonstration avec panier, 12 époques à découvrir avec quiz." }
    ];

    // ---------- Catalogue (boutique de démonstration) ----------
    var PRODUCTS = [
      { id: "base", emo: "⏳", name: "Le Sablier des Siècles — boîte de base",
        desc: "Plateau frise, 240 cartes (120 vertes, 120 rouges), 6 pions voyageurs, 1 sablier, livret de règles.", price: 34.90 },
      { id: "ext-inventeurs", emo: "💡", name: "Extension « Inventeurs et inventions »",
        desc: "80 cartes en plus : de la roue à Internet. Nécessite la boîte de base.", price: 14.90 },
      { id: "ext-femmes", emo: "👑", name: "Extension « Elles ont fait l'Histoire »",
        desc: "80 cartes sur des femmes célèbres, de Cléopâtre à Marie Curie. Nécessite la boîte de base.", price: 14.90 },
      { id: "frise", emo: "🗺️", name: "Poster frise chronologique",
        desc: "Grand poster 60 × 90 cm des 12 époques du jeu, pour la chambre ou la classe.", price: 9.90 }
    ];
    var SHIPPING = 4.90, FREE_FROM = 40;

    // ---------- Les époques (partie non marchande) ----------
    // Faits vérifiés sur des sources encyclopédiques ; dates arrondies quand
    // les historiens donnent une fourchette.
    var EPOQUES = [
      { id: "prehistoire", emo: "🦣", nom: "La Préhistoire", quand: "Jusqu'à l'invention de l'écriture (vers 3300 av. J.-C.)",
        intro: "Avant l'écriture, les humains vivaient de chasse, de pêche et de cueillette, puis ont appris à cultiver et à élever des animaux.",
        faits: [
          "Les peintures de la grotte de Lascaux ont environ 17 000 ans. Elles ont été découvertes en 1940 par quatre adolescents.",
          "Les derniers mammouths vivaient encore sur l'île Wrangel (Russie) il y a environ 4 000 ans : les pyramides d'Égypte existaient déjà !",
          "Les humains maîtrisent le feu depuis plusieurs centaines de milliers d'années : il sert à se chauffer, cuire et éloigner les animaux."
        ],
        quiz: [
          { q: "Qui a découvert la grotte de Lascaux en 1940 ?", o: ["Des adolescents", "Un roi", "Des astronautes"], a: 0 },
          { q: "Qu'est-ce qui marque la fin de la Préhistoire ?", o: ["L'invention de la roue", "L'invention de l'écriture", "La disparition des dinosaures"], a: 1 }
        ] },
      { id: "egypte", emo: "🏺", nom: "L'Égypte antique", quand: "Vers 3100 av. J.-C. – 30 av. J.-C.",
        intro: "Le long du Nil, les pharaons ont régné pendant près de 3 000 ans et fait construire temples et pyramides.",
        faits: [
          "La grande pyramide de Khéops (vers 2560 av. J.-C.) mesurait environ 146 m. Elle est restée le plus haut monument humain pendant près de 4 000 ans.",
          "Les hiéroglyphes ont été déchiffrés en 1822 par le Français Champollion, grâce à la pierre de Rosette.",
          "Cléopâtre a vécu plus près de nous (et des premiers pas sur la Lune) que de la construction de la pyramide de Khéops !"
        ],
        quiz: [
          { q: "Quel fleuve traverse l'Égypte ?", o: ["La Loire", "Le Nil", "L'Amazone"], a: 1 },
          { q: "Qui a déchiffré les hiéroglyphes ?", o: ["Champollion", "Napoléon", "Toutânkhamon"], a: 0 }
        ] },
      { id: "grece", emo: "🏛️", nom: "La Grèce antique", quand: "Vers 800 av. J.-C. – 146 av. J.-C.",

        faits: [
          "Les premiers Jeux olympiques connus ont eu lieu en 776 av. J.-C. à Olympie.",
          "À Athènes, vers 500 av. J.-C., les citoyens votent eux-mêmes les lois : c'est la démocratie (mais femmes et esclaves n'avaient pas le droit de voter).",

        ],
        quiz: [
          { q: "Où ont eu lieu les premiers Jeux olympiques ?", o: ["À Rome", "À Olympie", "À Paris"], a: 1 },
          { q: "Que veut dire « démocratie » ?", o: ["Le pouvoir du peuple", "Le pouvoir du roi", "Le pouvoir des dieux"], a: 0 }
        ] },
      { id: "rome", emo: "🛡️", nom: "La Rome antique", quand: "753 av. J.-C. (légende) – 476 apr. J.-C.",
        intro: "Une petite ville d'Italie devient un immense empire, relié par des routes et des aqueducs.",
        faits: [
          "Selon la légende, Rome a été fondée en 753 av. J.-C. par les jumeaux Romulus et Rémus, élevés par une louve.",
          "Le Colisée, inauguré en 80 apr. J.-C., pouvait accueillir environ 50 000 spectateurs.",
          "La coupole du Panthéon de Rome, vieille de près de 2 000 ans, est toujours la plus grande du monde en béton non armé."
        ],
        quiz: [
          { q: "Qui a fondé Rome selon la légende ?", o: ["Astérix et Obélix", "Romulus et Rémus", "Jules César"], a: 1 },
          { q: "Combien de spectateurs le Colisée pouvait-il accueillir ?", o: ["Environ 500", "Environ 50 000", "Environ 5 millions"], a: 1 }
        ] },
      { id: "chine", emo: "🐉", nom: "La Chine impériale", quand: "221 av. J.-C. – 1912",
        intro: "Pendant plus de 2 000 ans, des empereurs ont gouverné la Chine, berceau de grandes inventions.",
        faits: [
          "Le papier a été perfectionné en Chine vers l'an 105 ; la tradition l'attribue à un fonctionnaire nommé Cai Lun.",
          "La boussole, la poudre et l'imprimerie à caractères mobiles sont aussi des inventions chinoises.",
          "Contrairement à une idée reçue, la Grande Muraille n'est pas visible à l'œil nu depuis la Lune."
        ],
        quiz: [
          { q: "Laquelle de ces inventions vient de Chine ?", o: ["Le papier", "Le téléphone", "La machine à vapeur"], a: 0 },
          { q: "Voit-on la Grande Muraille à l'œil nu depuis la Lune ?", o: ["Oui, facilement", "Non"], a: 1 }
        ] },
      { id: "vikings", emo: "⛵", nom: "Les Vikings", quand: "Vers 793 – 1066",
        intro: "Venus de Scandinavie, les Vikings étaient marins, commerçants, pillards et explorateurs.",
        faits: [

          "La Normandie doit son nom aux « hommes du Nord » (les Normands), installés là au Xe siècle."
        ],
        quiz: [
          { q: "Les Vikings portaient-ils des casques à cornes ?", o: ["Oui, toujours", "Non, c'est une légende"], a: 1 },
          { q: "Quelle région française doit son nom aux Vikings ?", o: ["La Bretagne", "La Normandie", "La Provence"], a: 1 }
        ] },
      { id: "moyen-age", emo: "🏰", nom: "Le Moyen Âge", quand: "476 – 1492",
        intro: "Le temps des châteaux forts, des chevaliers, des cathédrales et des moines copistes.",
        faits: [
          "Charlemagne a été couronné empereur à Rome le jour de Noël de l'an 800.",

        ],
        quiz: [
          { q: "En quelle année Charlemagne devient-il empereur ?", o: ["En 800", "En 1515", "En 1789"], a: 0 },

      { id: "renaissance", emo: "🎨", nom: "La Renaissance", quand: "XVe – XVIe siècle",

      { id: "explorations", emo: "🧭", nom: "Les grandes explorations", quand: "XVe – XVIe siècle",
        intro: "Des navigateurs européens traversent les océans et rencontrent des peuples et des continents.",
        faits: [

      { id: "espace", emo: "🚀", nom: "La conquête spatiale", quand: "Depuis 1957",
        intro: "Satellites, astronautes et robots partent explorer l'espace autour de la Terre et au-delà.",

          "En 1957, le satellite soviétique Spoutnik 1 est le premier objet humain mis en orbite autour de la Terre.",
          "Le 12 avril 1961, Youri Gagarine devient le premier humain à voyager dans l'espace.",
          "En juillet 1969, Neil Armstrong et Buzz Aldrin (mission Apollo 11) sont les premiers humains à marcher sur la Lune."
        ],
        quiz: [
          { q: "Qui est le premier humain allé dans l'espace ?", o: ["Neil Armstrong", "Youri Gagarine", "Thomas Pesquet"], a: 1 },
          { q: "En quelle année a-t-on marché sur la Lune pour la première fois ?", o: ["1969", "1492", "2001"], a: 0 }
        ] }
    ];

    // ---------- Stockage local (namespacé, toujours protégé) ----------
    var NS = "sablier_";
    function load(k, def) { try { var v = localStorage.getItem(NS + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
    function save(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} }
    var cart = load("cart", {});      // { idProduit: quantité }
    var done = load("quiz", {});      // { idEpoque: meilleur score }
    // On ne garde que des entrées connues (protège contre une sauvegarde abîmée)
    (function () {
      var c = {};
      PRODUCTS.forEach(function (p) { var q = Math.floor(Number(cart[p.id]) || 0); if (q > 0 && q < 100) c[p.id] = q; });
      cart = c;
    })();

    // ---------- Outils ----------
    var view = document.getElementById("view");
    var main = document.getElementById("main");
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function euros(n) { return n.toFixed(2).replace(".", ",") + " €"; }
    function product(id) { return PRODUCTS.filter(function (p) { return p.id === id; })[0]; }
    function cartCount() { var n = 0; for (var k in cart) n += cart[k]; return n; }
    function subtotal() { var s = 0; for (var k in cart) s += product(k).price * cart[k]; return s; }
    var toastTimer;
    function toast(msg) {
      var t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
    }
    function updateBadge() {
      var b = document.getElementById("cartBadge"), n = cartCount();
      b.textContent = n; b.hidden = n === 0;
    }
    function setQty(id, q) {
      q = Math.max(0, Math.min(99, q));
      if (q === 0) delete cart[id]; else cart[id] = q;
      save("cart", cart); updateBadge();
    }

    var HOURGLASS = '<svg viewBox="0 0 24 32" aria-hidden="true"><path d="M3 2h18M3 30h18M5 2c0 9 14 9 14 14S5 21 5 30M19 2c0 9-14 9-14 14s14 5 14 14" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M8 6h8l-4 6z" fill="#e07a2e"/><path d="M7.5 27.5l4.5-4 4.5 4z" fill="#e07a2e"/><path d="M12 13v9" stroke="#e07a2e" stroke-width="1" stroke-dasharray="1 1.5"/></svg>';

    // ---------- Pages ----------
    function pageJeu() {
      return '' +
        '<section class="hero">' + HOURGLASS +
          '<div><h1>Le Sablier des Siècles</h1>' +
          '<p>Le grand sablier du Temps s\'est brisé ! Ses grains sont éparpillés dans 12 époques. Voyagez de la Préhistoire à la conquête spatiale pour les rapporter avant que le dernier grain ne tombe.</p>' +
          '<div class="tags"><span class="tag">👧 5 à 15 ans</span><span class="tag">👥 2 à 6 joueurs</span><span class="tag">⏱️ 30 min</span><span class="tag">🤝 coopératif ou en équipes</span></div>' +
          '<div class="row"><a class="btn" href="#boutique">Acheter le jeu</a><a class="btn sec" style="color:#fff;border-color:#fff" href="#decouvrir">Découvrir les époques</a></div></div>' +
        '</section>' +

        '<h2>Comment on joue ?</h2>' +
        '<div class="card"><ol class="steps">' +
          '<li><b>Lance le dé</b> et avance ton pion sur la frise du Temps.</li>' +
          '<li><b>Pioche une carte</b> de l\'époque où tu arrives : un personnage, une invention ou un événement.</li>' +
          '<li><b>Place-la au bon endroit</b> sur la frise : avant ou après les cartes déjà posées ?</li>' +
          '<li><b>Bien placée ?</b> Tu gagnes un grain de sable. L\'équipe qui remplit le sablier la première gagne !</li>' +
        '</ol></div>' +

        '<h2>Un jeu, deux niveaux</h2>' +
        '<div class="modes">' +
          '<div class="card mode"><h3>🟢 Cartes vertes · 5-8 ans</h3><p class="muted">De grandes images, peu de texte. On classe « avant / après » : les dinosaures, les châteaux, les fusées… Parfait pour ceux qui ne lisent pas encore bien.</p></div>' +
          '<div class="card mode rouge"><h3>🔴 Cartes rouges · 9-15 ans</h3><p class="muted">Des dates, des personnages et des défis « vrai ou faux ». Assez costaud pour faire réfléchir les grands… et les parents.</p></div>' +
        '</div>' +
        '<p class="muted">Petits et grands jouent ensemble à la même table : chacun pioche dans la couleur de son niveau.</p>' +

        '<h2>Dans la boîte</h2>' +
        '<div class="card"><div class="grid">' +
          '<div>🗺️ 1 plateau frise</div><div>🃏 240 cartes</div><div>♟️ 6 pions voyageurs</div><div>⏳ 1 sablier</div><div>🎲 1 dé</div><div>📖 1 livret de règles</div>' +
        '</div></div>' +

        '<h2>Pourquoi ce jeu ?</h2>' +
        '<div class="card"><p>Comprendre l\'Histoire, c\'est d\'abord savoir <b>ce qui vient avant quoi</b>. En jouant, les enfants construisent leur propre frise dans la tête, sans s\'en rendre compte.</p>' +
        '<p class="muted" style="margin:0">Et pour aller plus loin, chaque époque du jeu a sa page de découverte gratuite sur ce site, avec des anecdotes et un mini-quiz.</p></div>' +
        '<div class="row" style="margin-top:16px"><a class="btn" href="#boutique">Voir la boutique</a><a class="btn sec" href="#decouvrir">Explorer les époques</a></div>';
    }

    function pageBoutique() {
      var h = '<h1>Boutique</h1>' +
        '<div class="demo">🧪 <b>Boutique de démonstration</b> : ce site est une maquette. Aucun paiement n\'est demandé ni effectué.</div>';
      PRODUCTS.forEach(function (p) {
        var q = cart[p.id] || 0;
        h += '<div class="card product"><div class="vis">' + p.emo + '</div><div class="info">' +
          '<h3>' + esc(p.name) + '</h3><p class="muted">' + esc(p.desc) + '</p>' +
          '<div class="row" style="align-items:center;justify-content:space-between"><span class="price">' + euros(p.price) + '</span>' +
          (q ? '<span class="qty"><button data-dec="' + p.id + '" aria-label="Retirer un">−</button><span>' + q + '</span><button data-inc="' + p.id + '" aria-label="Ajouter un">+</button></span>'
             : '<button class="btn small" data-inc="' + p.id + '">Ajouter au panier</button>') +
          '</div></div></div>';
      });
      h += '<p class="muted">Livraison ' + euros(SHIPPING) + ', offerte dès ' + euros(FREE_FROM) + ' d\'achat.</p>';
      if (cartCount()) h += '<a class="btn" href="#panier" style="width:100%">Voir mon panier (' + cartCount() + ')</a>';
      return h;
    }

    function pagePanier() {
      var h = '<button class="back" data-go="#boutique">← Boutique</button><h1>Mon panier</h1>';
      if (!cartCount()) return h + '<div class="card"><p>Ton panier est vide.</p><a class="btn" href="#boutique">Aller à la boutique</a></div>';
      h += '<div class="card">';
      for (var id in cart) {
        var p = product(id);
        h += '<div class="line"><span>' + esc(p.name) + '<br><span class="qty"><button data-dec="' + id + '" aria-label="Retirer un">−</button><span>' + cart[id] + '</span><button data-inc="' + id + '" aria-label="Ajouter un">+</button></span></span><b>' + euros(p.price * cart[id]) + '</b></div>';
      }
      var st = subtotal(), ship = st >= FREE_FROM ? 0 : SHIPPING;
      h += '<div class="line"><span>Sous-total</span><span>' + euros(st) + '</span></div>' +
        '<div class="line"><span>Livraison</span><span>' + (ship ? euros(ship) : 'offerte') + '</span></div>' +
        '<div class="line total"><span>Total</span><span>' + euros(st + ship) + '</span></div></div>';
      if (ship) h += '<p class="muted">Plus que ' + euros(FREE_FROM - st) + ' pour la livraison offerte.</p>';
      h += '<div class="demo">🧪 Démonstration : valider ne déclenche aucun paiement et n\'envoie aucune donnée.</div>' +
        '<button class="btn" id="checkout" style="width:100%">Valider la commande (démo)</button>';
      return h;
    }

    function pageMerci() {
      return '<h1>Merci ! 🎉</h1><div class="card"><p>Ta commande de démonstration est enregistrée.</p>' +
        '<p class="muted">Rappel : ce site est une maquette, aucun paiement n\'a été effectué et rien ne sera livré.</p>' +
        '<a class="btn" href="#decouvrir">En attendant, explore les époques</a></div>';
    }

    function pageDecouvrir() {
      var n = 0; EPOQUES.forEach(function (e) { if (done[e.id] != null) n++; });
      var h = '<h1>Découvrir les époques</h1>' +
        '<p>Douze périodes de l\'Histoire, comme dans le jeu. Chacune a ses anecdotes et son mini-quiz. Ici, tout est gratuit !</p>' +
        '<p class="muted">' + n + ' / ' + EPOQUES.length + ' époques explorées</p><div class="frise">';
      EPOQUES.forEach(function (e) { h += '<i class="' + (done[e.id] != null ? 'on' : '') + '"></i>'; });
      h += '</div><div class="grid">';
      EPOQUES.forEach(function (e) {
        h += '<button class="epoque-tile' + (done[e.id] != null ? ' fait' : '') + '" data-go="#epoque/' + e.id + '"><span class="emo">' + e.emo + '</span><b>' + esc(e.nom) + '</b><small>' + esc(e.quand) + '</small></button>';
      });
      return h + '</div>';
    }

    function pageEpoque(id) {
      var i = -1; EPOQUES.forEach(function (e, k) { if (e.id === id) i = k; });
      if (i < 0) return pageDecouvrir();
      var e = EPOQUES[i];
      var h = '<button class="back" data-go="#decouvrir">← Toutes les époques</button>' +
        '<h1>' + e.emo + ' ' + esc(e.nom) + '</h1><p class="muted">' + esc(e.quand) + '</p><p>' + esc(e.intro) + '</p>' +
        '<h2>Le savais-tu ?</h2>';
      e.faits.forEach(function (f, k) { h += '<div class="card fact"><span class="n">' + ['💡', '🔎', '😮'][k % 3] + '</span><p style="margin:0">' + esc(f) + '</p></div>'; });
      h += '<h2>Mini-quiz</h2><div class="card" id="quiz">';
      e.quiz.forEach(function (q, k) {
        h += '<div class="quiz-q">' + (k + 1) + '. ' + esc(q.q) + '</div><div class="quiz-opts" data-q="' + k + '">';
        q.o.forEach(function (o, j) { h += '<button data-ans="' + j + '">' + esc(o) + '</button>'; });
        h += '</div>';
      });
      h += '<p id="score" class="muted" style="margin:0">Réponds aux questions !</p></div>';
      var prev = EPOQUES[i - 1], next = EPOQUES[i + 1];
      h += '<div class="row" style="justify-content:space-between;margin-top:8px">' +
        (prev ? '<button class="btn sec small" data-go="#epoque/' + prev.id + '">← ' + esc(prev.nom) + '</button>' : '<span></span>') +
        (next ? '<button class="btn sec small" data-go="#epoque/' + next.id + '">' + esc(next.nom) + ' →</button>' : '') + '</div>' +
        '<div class="card" style="margin-top:16px"><p style="margin:0 0 10px">Envie de jouer avec cette époque en famille ou en classe ?</p><a class="btn small" href="#boutique">Le jeu dans la boutique</a></div>';
      return h;
    }

    // ---------- Routage par ancre (#jeu, #boutique, #epoque/rome…) ----------
    var current = null;
    function route() {
      var hash = location.hash.slice(1) || "jeu";
      var parts = hash.split("/"), tab = parts[0];
      current = parts;
      var html;
      if (tab === "boutique") html = pageBoutique();
      else if (tab === "panier") html = pagePanier();
      else if (tab === "merci") html = pageMerci();
      else if (tab === "decouvrir") html = pageDecouvrir();
      else if (tab === "epoque") html = pageEpoque(parts[1]);
      else { tab = "jeu"; html = pageJeu(); }
      view.innerHTML = html;
      var active = (tab === "panier" || tab === "merci") ? "boutique" : (tab === "epoque" ? "decouvrir" : tab);
      document.querySelectorAll("nav.tabs a").forEach(function (a) { a.classList.toggle("on", a.dataset.tab === active); });
      updateBadge();
    }
    function rerender() { var y = main.scrollTop; route(); main.scrollTop = y; }
    window.addEventListener("hashchange", function () { route(); main.scrollTop = 0; });

    // ---------- Interactions ----------
    view.addEventListener("click", function (ev) {
      var t = ev.target.closest("button");
      if (!t) return;
      if (t.dataset.go) { location.hash = t.dataset.go; return; }
      if (t.dataset.inc) {
        var wasEmpty = !cart[t.dataset.inc];
        setQty(t.dataset.inc, (cart[t.dataset.inc] || 0) + 1);
        if (wasEmpty) toast("Ajouté au panier ✓");
        rerender(); return;
      }
      if (t.dataset.dec) { setQty(t.dataset.dec, (cart[t.dataset.dec] || 0) - 1); rerender(); return; }
      if (t.id === "checkout") { cart = {}; save("cart", cart); location.hash = "#merci"; return; }
      if (t.dataset.ans != null) answer(t);
    });

    function answer(btn) {
      var box = btn.parentNode, qi = Number(box.dataset.q);
      var ep = EPOQUES.filter(function (e) { return e.id === current[1]; })[0];
      if (!ep || box.dataset.done) return;
      var good = ep.quiz[qi].a, pick = Number(btn.dataset.ans);
      box.dataset.done = pick === good ? "ok" : "ko";
      box.querySelectorAll("button").forEach(function (b, j) {
        b.disabled = true;
        if (j === good) b.classList.add("ok");
        else if (j === pick) b.classList.add("ko");
      });
      var boxes = document.querySelectorAll("#quiz .quiz-opts"), answered = 0, score = 0;
      boxes.forEach(function (b) { if (b.dataset.done) { answered++; if (b.dataset.done === "ok") score++; } });
      var s = document.getElementById("score");
      if (answered < boxes.length) { s.textContent = pick === good ? "Bravo ! 👍" : "Presque ! La bonne réponse est en vert."; return; }
      s.textContent = "Score : " + score + " / " + boxes.length + (score === boxes.length ? " — parfait, grain de sable gagné ! ⏳" : " — tu peux relire les anecdotes et réessayer.");
      done[ep.id] = Math.max(done[ep.id] || 0, score); save("quiz", done);
      if (score < boxes.length) {
        var again = document.createElement("button");
        again.className = "btn sec small"; again.style.marginTop = "10px"; again.textContent = "Réessayer";
        again.addEventListener("click", rerender);
        s.parentNode.appendChild(again);
      }
    }

    document.getElementById("cartBtn").addEventListener("click", function () { location.hash = "#panier"; });

    // ---------- Historique ----------
    document.getElementById("versionLabel").textContent = "Version " + HISTORY[0].v;
    var modal = document.getElementById("histModal");
    document.getElementById("histList").innerHTML = HISTORY.map(function (h) {
      return '<div class="card"><b>' + esc(h.v) + '</b> <span class="muted">' + esc(h.d) + '</span><p style="margin:4px 0 0">' + esc(h.t) + '</p></div>';
    }).join("");
    document.getElementById("infoBtn").addEventListener("click", function () { modal.hidden = false; });
    document.getElementById("histClose").addEventListener("click", function () { modal.hidden = true; });
    modal.addEventListener("click", function (e) { if (e.target === modal) modal.hidden = true; });

    // ---------- Écran figé : pas de zoom ni de tirage de page ----------
    // On laisse défiler uniquement la zone de contenu (et la fenêtre Historique).
    document.addEventListener("touchmove", function (e) {
      if (e.touches.length > 1 || !e.target.closest("main, .sheet")) e.preventDefault();
    }, { passive: false });
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
      document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
    });

    route();
  </script>

  <script>
    // Mise à jour automatique, copiée de la page d'accueil : vérification
    // légère via ETag/Last-Modified, clés namespacées au nom du projet.
    // Le paramètre anti-cache est nécessaire : `cache: 'no-store'` ne
    // contourne pas le CDN devant GitHub Pages.
    (function () {
      var PAGE = "sablier-des-siecles";
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return; // évite les rafales de clics
        lastCheck = now0;
        try {
          var url = (location.pathname || "index.html") + "?_cb=" + now0;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          var tag = res.headers.get("etag") || res.headers.get("last-modified");
          if (!tag) return;
          var key = "pm_pageVersion_" + PAGE;
          var stored = localStorage.getItem(key);
          if (stored === null) { localStorage.setItem(key, tag); return; }
          if (tag !== stored) {
            var now = Date.now();
            var guard = "pm_lastUpdateReload_" + PAGE;
            var lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem(guard)) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try {
              localStorage.setItem(key, tag);
              sessionStorage.setItem(guard, String(now));
            } catch (e) {}
            location.replace(location.pathname + "?_r=" + now + location.hash);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>
</body>

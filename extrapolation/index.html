<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>Extrapolation</title>
  <meta name="theme-color" content="#12161d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Extrapolation">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    html, body, #root { height: 100%; margin: 0; }
    * { box-sizing: border-box; }
    /* Pas de zoom ni de loupe iOS : double-tap, pincement, sélection, appui long */
    html, body {
      background: #0b0e13;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    /* Sur tablette / ordinateur : affiché tel quel, format téléphone centré */
    #root { max-width: 480px; margin: 0 auto; }
  </style>
  <script type="module" crossorigin src="./assets/index-dXNtDWXX.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    // iOS ignore user-scalable=no pour le pincement : on l'arrête à la main.
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
      document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
    });

    // Mise à jour automatique (copiée de la page d'accueil du portfolio) :
    // pas de service worker, vérification légère via ETag/Last-Modified.
    // Clés namespacées « extrapolation_ » pour ne pas croiser les autres
    // pages du domaine. L'état (courbe dessinée, réglages) est sauvegardé à
    // part et survit au rechargement.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
        .catch(function () {});
    }
    var lastCheck = 0;
    async function checkForUpdate() {
      var now0 = Date.now();
      if (now0 - lastCheck < 1500) return;
      lastCheck = now0;
      try {
        var res = await fetch((location.pathname || 'index.html') + '?_cb=' + now0, { cache: 'no-store' });
        if (!res.ok) return;
        var tag = res.headers.get('etag') || res.headers.get('last-modified');
        if (!tag) return;
        var stored = localStorage.getItem('extrapolation_pageVersion');
        if (stored === null) { localStorage.setItem('extrapolation_pageVersion', tag); return; }
        if (tag !== stored) {
          var now = Date.now();
          var lastReload = 0;
          try { lastReload = Number(sessionStorage.getItem('extrapolation_lastUpdateReload')) || 0; } catch (e) { /* ignore */ }
          if (now - lastReload < 10000) return; // garde-fou anti-boucle
          try {
            localStorage.setItem('extrapolation_pageVersion', tag);
            sessionStorage.setItem('extrapolation_lastUpdateReload', String(now));
          } catch (e) { /* ignore */ }
          location.replace(location.pathname + '?_r=' + now);
        }
      } catch (e) { /* hors-ligne — on retentera plus tard */ }
    }
    checkForUpdate();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) checkForUpdate(); });
    document.addEventListener('pointerdown', checkForUpdate, { passive: true });
  </script>
</body>
</html>

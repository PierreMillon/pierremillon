<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
  <title>Palais — choix des formules</title>
  <meta name="theme-color" content="#0c0c0b">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <style>
    /* Même esthétique que le palais : papier type Canson texturé, encre,
       traits tirés à la règle, cases tracées à la main. */
    :root { --bg: #0c0c0b; --paper: #efede6; --ink: #141412; --soft: #6f6c63; }
    * { box-sizing: border-box; touch-action: manipulation; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0; margin: 0; background: var(--bg); color: var(--ink);
      display: flex; justify-content: center; align-items: stretch;
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    }
    .col {
      width: min(100% - 16px, 560px); margin: calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 8px);
      display: flex; flex-direction: column; background-color: var(--paper); background-size: cover; position: relative;
      padding: 14px 0 12px;
    }
    header { padding: 4px 22px 0; }
    header h1 { margin: 0; font-weight: normal; letter-spacing: 0.35em; font-size: 1.45rem; }
    header p { margin: 6px 0 4px; font-size: 0.86rem; color: var(--soft); font-style: italic; }
    header .ver { float: right; font-size: 0.66rem; letter-spacing: 0.22em; color: var(--soft); cursor: pointer; margin-top: 8px; }
    svg.rule { display: block; width: 100%; height: 10px; overflow: visible; }
    .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; padding: 0 22px 24px; }
    h2 { font-weight: normal; letter-spacing: 0.28em; text-transform: uppercase; font-size: 0.82rem; margin: 24px 0 2px; display: flex; justify-content: space-between; align-items: baseline; }
    h2 button { font: inherit; font-size: 0.66rem; letter-spacing: 0.08em; text-transform: none; font-style: italic; background: none; border: none; color: var(--soft); cursor: pointer; padding: 0; }
    label.item { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 11px 0 9px; cursor: pointer; position: relative; }
    label.item + label.item { border-top: 1px dotted rgba(20, 20, 18, 0.28); }
    label.item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .box { width: 22px; height: 22px; margin-top: 3px; border: 2px solid var(--ink); border-radius: 3px 2px 4px 2px; position: relative; }
    .box::after { content: ""; position: absolute; left: -3px; top: -9px; font-size: 1.7rem; line-height: 1; color: var(--ink); font-style: italic; }
    label.item input:checked + .box::after { content: "✗"; }
    label.item input:focus-visible + .box { outline: 1px dotted var(--ink); outline-offset: 3px; }
    .nm { font-style: italic; font-size: 1.06rem; }
    .fm { font-size: 1rem; margin-top: 5px; line-height: 1.9; word-break: break-word; }
    .fm .ln { display: block; }
    .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.86em; line-height: 1.15; margin: 0 2px; }
    .frac > span:first-child { border-bottom: 1.4px solid var(--ink); padding: 0 3px; }
    .off .nm::after { content: " · chapitre pas encore débloqué"; font-size: 0.7rem; color: var(--soft); font-style: normal; }
    footer { padding: 0 22px; display: flex; flex-direction: column; gap: 8px; }
    footer .row { display: flex; gap: 8px; align-items: center; }
    footer button { font: inherit; background: var(--ink); color: var(--paper); border: none; padding: 0.6rem 1rem; cursor: pointer; border-radius: 3px 2px 4px 2px; }
    footer button.ghost { background: none; color: var(--ink); border: 1.6px solid var(--ink); }
    #count { flex: 1; font-size: 0.88rem; font-style: italic; }
    textarea {
      width: 100%; height: 7.5em; font: 0.8rem "Courier New", monospace; border: 1.6px solid var(--ink); background: rgba(255,255,255,0.35); padding: 6px;
      -webkit-user-select: text; user-select: text; resize: none; border-radius: 2px 4px 2px 3px;
    }
    textarea[hidden] { display: none; }
    #msg { font-size: 0.8rem; color: var(--soft); min-height: 1em; font-style: italic; }
    .blot { position: absolute; pointer-events: none; }
    .overlay { position: fixed; inset: 0; background: rgba(12,12,11,0.95); color: #ecebe6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; }
    .overlay[hidden] { display: none; }
    .overlay ul { list-style: none; padding: 0; margin: 0; max-width: 30em; font-size: 0.85rem; line-height: 1.45; }
    .overlay button { background: none; color: #ecebe6; border: 1px solid #ecebe6; padding: 0.5rem 1.2rem; font: inherit; }
  </style>
</head>
<body>
  <div class="col">
    <header>
      <span class="ver" id="ver"></span>
      <h1>FORMULES</h1>
      <p>Coche celles à ranger dans le palais, puis « Copier le résultat » et colle-le à Claude.</p>
      <div class="rulewrap"></div>
    </header>
    <div class="list" id="list"></div>
    <footer>
      <div class="rulewrap"></div>
      <div class="row"><span id="count"></span><button class="ghost" id="bNone">Tout décocher</button><button id="bCopy">Copier le résultat</button></div>
      <textarea id="out" readonly hidden></textarea>
      <div id="msg"></div>
    </footer>
  </div>
  <div class="overlay" id="hist" hidden><ul id="histList"></ul><button id="histClose">Fermer</button><a href="./" style="color:#9a988f;font-size:0.8rem">← Palais</a></div>

  <script>
    (function () {

        ["Calculus", "Somme et différence de deux cubes", "a³ − b³ = (a − b)(a² + ab + b²) ¶ a³ + b³ = (a + b)(a² − ab + b²)", true],

        ["Algèbre", "Forme exponentielle d'un complexe", "z = ρ eⁱᶿ avec ρ = |z|, θ = arg z (z ≠ 0) ¶ i = e^(iπ/2) ; −1 = e^(iπ)", true],
        ["Algèbre", "Formule d'Euler pour cos t", "cos t = [eⁱᵗ + e⁻ⁱᵗ]/[2]", true],

        ["Algèbre", "Racines n-ièmes de l'unité", "Zⁿ = 1 ⇔ Z = e^(2ikπ/n), k ∈ {0, …, n − 1}", true],
        ["Algèbre linéaire", "Caractérisation d'un sous-espace vectoriel", "0_E ∈ F et ∀u, v ∈ F, ∀λ, μ ∈ ℝ : λu + μv ∈ F", false],
        ["Algèbre linéaire", "Théorème du rang", "dim E = dim Ker f + dim Im f", false],

        ["Analyse", "Définition de la limite d'une fonction", "lim(x→a) f(x) = l ⇔ ∀ε > 0, ∃α > 0, ∀x, |x − a| < α ⇒ |f(x) − l| < ε", false],
        ["Analyse", "Nombre dérivé", "f'(a) = lim(x→a) [f(x) − f(a)]/[x − a]", false],

        ["Analyse", "Développements limités usuels en 0", "eˣ = 1 + x + [x²]/[2] + o(x²) ; ln(1 + x) = x − [x²]/[2] + o(x²) ¶ sin x = x − [x³]/[6] + o(x³) ; cos x = 1 − [x²]/[2] + o(x²)", false],
        ["Analyse", "Primitive d'une puissance", "∫ xᵅ dx = [xᵅ⁺¹]/[α + 1] + C (α ≠ −1) ¶ ∫ [1]/[x] dx = ln|x| + C", false],
        ["Analyse", "Théorème fondamental de l'analyse", "f continue : F(x) = ∫ₐˣ f(t) dt vérifie F' = f ¶ ∫ₐᵇ f(t) dt = Φ(b) − Φ(a), Φ primitive de f", false],
        ["Analyse", "Théorème des gendarmes", "vₙ ≤ uₙ ≤ wₙ et vₙ → l, wₙ → l ⇒ uₙ → l", false],
        ["Analyse", "Croissances comparées", "lim(x→+∞) [ln x]/[x] = 0 ; lim(x→+∞) [eˣ]/[xⁿ] = +∞ ¶ ln x ≪ xᵃ ≪ eˣ (a > 0)", false],
        ["Analyse", "Série géométrique", "∑ ρⁿ converge ⇔ |ρ| < 1 ¶ et alors ∑ₙ₌₀^∞ ρⁿ = [1]/[1 − ρ]", false],
        ["Analyse", "Série de Riemann", "∑ [1]/[nᵅ] converge ⇔ α > 1", false],
        ["Analyse", "Passage à la limite dans une inégalité", "f(x) ≤ g(x) près de a ⇒ lim f ≤ lim g ¶ (une inégalité stricte devient large : < devient ≤)", false],
        ["Analyse", "Fonctions équivalentes", "f ∼ₐ g ⇔ lim(x→a) [f(x)]/[g(x)] = 1", false],
        ["Analyse", "Théorème des bornes atteintes", "f continue sur un segment [a, b] ¶ ⇒ f est bornée et atteint son minimum et son maximum", false],
        ["Analyse", "Dérivable implique continue", "f dérivable en a ⇒ f continue en a (réciproque fausse : |x| en 0)", false],
        ["Analyse", "Arccos et arcsin", "arccos x + arcsin x = [π]/[2] pour x ∈ [−1, 1]", false],
        ["Analyse", "Dérivée de arctan", "(arctan x)' = [1]/[1 + x²] sur ℝ", false],
        ["Analyse", "Développement limité de eˣ à l'ordre n", "eˣ = 1 + x + [x²]/[2!] + … + [xⁿ]/[n!] + o(xⁿ)", false],
        ["Analyse", "Développement limité à l'ordre 1", "f(x) = f(a) + f'(a)(x − a) + o(x − a)", false],
        ["Analyse", "Relation de Chasles", "∫ de a à b + ∫ de b à c = ∫ de a à c (de f(t) dt)", false],

        ["Analyse", "Deux primitives d'une même fonction", "F' = G' = f sur un intervalle I ⇒ F − G est constante sur I", false],
        ["Analyse", "Théorème de convergence monotone", "suite croissante et majorée ⇒ converge ¶ suite décroissante et minorée ⇒ converge", false],
        ["Analyse", "Limite d'une suite géométrique", "ρⁿ → 0 si |ρ| < 1 ; ρⁿ = 1 si ρ = 1 ¶ (ρⁿ) diverge sinon (ex. ρ = −1)", false],
        ["Analyse", "Suites extraites (paire et impaire)", "u₂ₙ → l et u₂ₙ₊₁ → l ⇔ uₙ → l ¶ deux limites différentes ⇒ (uₙ) diverge", false],

        ["Analyse", "Suites équivalentes et négligeables", "uₙ ∼ vₙ ⇔ [uₙ]/[vₙ] → 1 ; uₙ = o(vₙ) ⇔ [uₙ]/[vₙ] → 0", false],

      function id(it) { return it[0] + " | " + it[1]; }

      // Formule : une ligne par « ¶ », fractions [a]/[b] en vraie fraction
      function fillFormula(el, txt) {
        txt.split(" ¶ ").forEach(function (line) {
          var ln = document.createElement("span"); ln.className = "ln";
          var re = /\[([^\]]*)\]\/\[([^\]]*)\]/g, last = 0, m;
          while ((m = re.exec(line))) {
            if (m.index > last) ln.appendChild(document.createTextNode(line.slice(last, m.index)));
            var fr = document.createElement("span"); fr.className = "frac";
            var nu = document.createElement("span"); nu.textContent = m[1];
            var de = document.createElement("span"); de.textContent = m[2];
            fr.appendChild(nu); fr.appendChild(de); ln.appendChild(fr); last = re.lastIndex;
          }
          if (last < line.length) ln.appendChild(document.createTextNode(line.slice(last)));
          el.appendChild(ln);
        });
      }
      // Trait tiré à la règle : presque droit, épaisseur qui varie, encre accumulée aux bouts
      var SVGNS = "http://www.w3.org/2000/svg";
      function inkRule(w) {
        var svg = document.createElementNS(SVGNS, "svg"); svg.setAttribute("class", "rule"); svg.setAttribute("viewBox", "0 0 100 10"); svg.setAttribute("preserveAspectRatio", "none");
        var top = [], bot = [], n = 24, y0 = 5 + (Math.random() - 0.5) * 0.8, tilt = (Math.random() - 0.5) * 0.8;
        for (var i = 0; i <= n; i++) {
          var x = i / n * 100, y = y0 + tilt * i / n + (Math.random() - 0.5) * 0.15, th = w * (0.75 + 0.5 * Math.random()) * (i === 0 || i === n ? 1.5 : 1);
          top.push(x.toFixed(2) + "," + (y - th / 2).toFixed(2)); bot.unshift(x.toFixed(2) + "," + (y + th / 2).toFixed(2));
        }
        var poly = document.createElementNS(SVGNS, "polygon"); poly.setAttribute("points", top.concat(bot).join(" ")); poly.setAttribute("fill", "#141412");
        svg.appendChild(poly); return svg;
      }
      Array.prototype.forEach.call(document.querySelectorAll(".rulewrap"), function (r) { r.appendChild(inkRule(2)); });
      // Feuille de papier : grain, fibres, marbrures, bords plus sombres, déchirée
      (function () {
        try {
          var w = 360, h = 640, cnv = document.createElement("canvas"); cnv.width = w; cnv.height = h;
          var c = cnv.getContext("2d"); c.fillStyle = "#efede6"; c.fillRect(0, 0, w, h);
          var img = c.getImageData(0, 0, w, h), d = img.data;
          for (var i = 0; i < d.length; i += 4) { var v = -Math.pow(Math.random(), 3) * 26; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
          c.putImageData(img, 0, 0);
          for (var m = 0; m < 40; m++) { var mx = Math.random() * w, my = Math.random() * h, mr = 20 + Math.random() * 70, gr = c.createRadialGradient(mx, my, 0, mx, my, mr); gr.addColorStop(0, "rgba(70,62,45," + (0.03 + Math.random() * 0.05) + ")"); gr.addColorStop(1, "rgba(70,62,45,0)"); c.fillStyle = gr; c.fillRect(mx - mr, my - mr, mr * 2, mr * 2); }
          c.strokeStyle = "rgba(40,36,28,0.12)"; c.lineWidth = 0.5;
          for (var f = 0; f < 240; f++) { var fx = Math.random() * w, fy = Math.random() * h, an = Math.random() * 6.283, l = 3 + Math.random() * 10; c.beginPath(); c.moveTo(fx, fy); c.quadraticCurveTo(fx + Math.cos(an + 0.8) * l / 2, fy + Math.sin(an + 0.8) * l / 2, fx + Math.cos(an) * l, fy + Math.sin(an) * l); c.stroke(); }
          var ed = c.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, h * 0.62); ed.addColorStop(0, "rgba(0,0,0,0)"); ed.addColorStop(1, "rgba(50,40,20,0.25)"); c.fillStyle = ed; c.fillRect(0, 0, w, h);
          var col = document.querySelector(".col"); col.style.backgroundImage = "url(" + cnv.toDataURL("image/png") + ")";
          var pts = [], k;
          for (k = 0; k <= 20; k++) pts.push((k * 5) + "% " + (Math.random() * 0.7).toFixed(2) + "%");
          for (k = 0; k <= 30; k++) pts.push((100 - Math.random() * 1.6).toFixed(2) + "% " + (k * 100 / 30).toFixed(2) + "%");
          for (k = 20; k >= 0; k--) pts.push((k * 5) + "% " + (100 - Math.random() * 0.7).toFixed(2) + "%");
          for (k = 30; k >= 0; k--) pts.push((Math.random() * 1.6).toFixed(2) + "% " + (k * 100 / 30).toFixed(2) + "%");
          col.style.clipPath = "polygon(" + pts.join(",") + ")";
          // quelques taches d'encre dans les marges
          for (var b = 0; b < 4; b++) {
            var s2 = document.createElementNS(SVGNS, "svg"), r = 1.4 + Math.random() * 1.5, sz = r * 5.5;
            s2.setAttribute("class", "blot"); s2.setAttribute("width", sz); s2.setAttribute("height", sz); s2.setAttribute("viewBox", "0 0 " + sz + " " + sz);
            var path = "", cx = sz / 2;
            for (var q = 0; q <= 12; q++) { var a = q / 12 * 6.283, rr = r * (0.75 + Math.random() * 0.45); path += (q ? "L" : "M") + (cx + Math.cos(a) * rr).toFixed(1) + " " + (cx + Math.sin(a) * rr).toFixed(1); }
            var pe = document.createElementNS(SVGNS, "path"); pe.setAttribute("d", path + "Z"); pe.setAttribute("fill", "#141412"); s2.appendChild(pe);
            for (var dd = 0; dd < 4; dd++) { var ci = document.createElementNS(SVGNS, "circle"), aa = Math.random() * 6.283, di = r * (1.5 + Math.random() * 1.3); ci.setAttribute("cx", cx + Math.cos(aa) * di); ci.setAttribute("cy", cx + Math.sin(aa) * di); ci.setAttribute("r", 0.4 + Math.random() * r * 0.25); ci.setAttribute("fill", "#141412"); s2.appendChild(ci); }
            s2.style.left = (b % 2 ? "calc(100% - " + (sz + 2) + "px)" : "2px"); s2.style.top = (12 + Math.random() * 76).toFixed(1) + "%";
            col.appendChild(s2);
          }
        } catch (e) {}
      })();
      var list = document.getElementById("list"), lastC = null, groups = {};
      DATA.forEach(function (it) {
        if (it[0] !== lastC) {
          lastC = it[0];
          var h = document.createElement("h2"); var sp = document.createElement("span"); sp.textContent = it[0]; h.appendChild(sp);
          var b = document.createElement("button"); b.textContent = "tout cocher"; var cname = it[0];
          b.addEventListener("click", function () { (groups[cname] || []).forEach(function (cb) { cb.checked = true; picked[cb.dataset.k] = true; }); save(); refresh(); });
          h.appendChild(b); list.appendChild(h); list.appendChild(inkRule(1.4)); groups[cname] = [];
        }
        var lab = document.createElement("label"); lab.className = "item" + (it[3] === false ? " off" : "");
        var cb = document.createElement("input"); cb.type = "checkbox"; cb.dataset.k = id(it); cb.checked = !!picked[id(it)];
        var box = document.createElement("span"); box.className = "box"; box.style.transform = "rotate(" + (Math.random() * 6 - 3).toFixed(1) + "deg)";
        cb.addEventListener("change", function () { if (cb.checked) picked[cb.dataset.k] = true; else delete picked[cb.dataset.k]; save(); refresh(); });
        groups[it[0]].push(cb);
        var txt = document.createElement("div");
        var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = it[1];
        var fm = document.createElement("div"); fm.className = "fm"; fillFormula(fm, it[2]);
        txt.appendChild(nm); txt.appendChild(fm); lab.appendChild(cb); lab.appendChild(box); lab.appendChild(txt); list.appendChild(lab);
      });

      function result() {
        var lines = ["Formules choisies pour le palais (" + Object.keys(picked).length + ") :"];
        DATA.forEach(function (it) { if (picked[id(it)]) lines.push("- [" + it[0] + "] " + it[1] + " : " + it[2].replace(/ ¶ /g, " / ")); });
        return lines.join("\n");
      }
      function refresh() {
        var n = Object.keys(picked).filter(function (k) { return DATA.some(function (it) { return id(it) === k; }); }).length;
        document.getElementById("count").textContent = n + " / " + DATA.length + " cochées";
        var out = document.getElementById("out"); if (!out.hidden) out.value = result();
      }
      document.getElementById("bNone").addEventListener("click", function () {
        picked = {}; save(); Array.prototype.forEach.call(document.querySelectorAll("label.item input"), function (cb) { cb.checked = false; }); refresh();
      });
      document.getElementById("bCopy").addEventListener("click", function () {
        var out = document.getElementById("out"), msg = document.getElementById("msg");
        out.hidden = false; out.value = result();
        function fallback() { out.focus(); out.select(); try { document.execCommand("copy"); msg.textContent = "Copié. Colle-le à Claude."; } catch (e) { msg.textContent = "Sélectionne le texte ci-dessus et copie-le."; } }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.value).then(function () { msg.textContent = "Copié. Colle-le à Claude."; }, fallback);
        else fallback();
      });

      document.getElementById("ver").textContent = "VERSION " + VERSIONS[0].v;
      document.getElementById("ver").addEventListener("click", function () {
        var ul = document.getElementById("histList"); ul.textContent = "";
        VERSIONS.forEach(function (v) { var li = document.createElement("li"), b = document.createElement("b"); b.textContent = v.v + " "; li.appendChild(b); li.appendChild(document.createTextNode(v.text)); ul.appendChild(li); });
        document.getElementById("hist").hidden = false;
      });
      document.getElementById("histClose").addEventListener("click", function () { document.getElementById("hist").hidden = true; });

      // Écran figé : seule la liste défile
      document.addEventListener("touchmove", function (e) { if (e.target.closest && e.target.closest(".list, textarea")) return; e.preventDefault(); }, { passive: false });
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (ty) { document.addEventListener(ty, function (e) { e.preventDefault(); }, { passive: false }); });
      refresh();
    })();
  </script>

  <script>
    // Mise à jour automatique (même principe que la page d'accueil du portfolio)
    (function () {
      var PAGE = "palais-formules";
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return;
        lastCheck = now0;
        try {
          var res = await fetch((location.pathname || "formules.html") + "?_cb=" + now0, { cache: "no-store" });
          if (!res.ok) return;
          var tag = res.headers.get("etag") || res.headers.get("last-modified");
          if (!tag) return;
          var key = "pm_pageVersion_" + PAGE;
          var stored = localStorage.getItem(key);
          if (stored === null) { localStorage.setItem(key, tag); return; }
          if (tag !== stored) {
            var now = Date.now(), guard = "pm_lastUpdateReload_" + PAGE, lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem(guard)) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try { localStorage.setItem(key, tag); sessionStorage.setItem(guard, String(now)); } catch (e) {}
            location.replace(location.pathname + "?_r=" + now);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>

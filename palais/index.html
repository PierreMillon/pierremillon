<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
  <title>Palais — essai</title>
  <meta name="theme-color" content="#0c0c0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Palais">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <style>
    /* Page d'essai du rendu « encre » inspiré de Helix: Descent N Ascent
       (planche de manga noir et blanc, vue de dessus, mur du fond vu de
       face). Écart assumé au vert phosphore par défaut, demandé par Pierre. */
    :root { --bg: #0c0c0b; --ink: #ecebe6; --soft: #8e8c85; }
    * { box-sizing: border-box; touch-action: manipulation; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0; margin: 0; background: var(--bg); color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    }
    #stage { position: relative; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; transition: filter 0.35s; }
    canvas.inv { filter: invert(1); }
    /* Grappe de quatre cercles, comme l'interface de Helix */
    .pad { position: absolute; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); width: 104px; height: 104px; }
    .pad button {
      position: absolute; width: 44px; height: 44px; border-radius: 50%;
      background: #f2f1ec; color: #111; border: 2px solid #111; font: 600 0.8rem Georgia, serif;
      display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
      box-shadow: 0 0 0 2px #f2f1ec;
    }
    .pad .t { left: 30px; top: 0; } .pad .l { left: 0; top: 30px; } .pad .r { left: 60px; top: 30px; } .pad .b { left: 30px; top: 60px; }
    .pad button.on { background: #111; color: #f2f1ec; }
    .scrap {
      position: absolute; left: 50%; top: 14%; transform: translateX(-50%) rotate(-1.5deg);
      width: 78%; background: #f4f2ea; color: #111; border: 2px solid #111; padding: 14px 16px 16px;
      box-shadow: 6px 6px 0 #111; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s;
    }
    .scrap.show { opacity: 1; transform: translateX(-50%) rotate(-1.5deg) translateY(4px); }
    .scrap small { display: block; font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: #555; margin-bottom: 6px; }
    .scrap .f { font-family: "Courier New", monospace; font-size: 1.05rem; line-height: 1.45; }
    .scrap .hid { color: transparent; border-bottom: 2px dotted #111; }
    .overlay {
      position: absolute; inset: 0; background: rgba(12, 12, 11, 0.95); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; padding: 24px 18px; text-align: center;
    }
    .overlay[hidden] { display: none; }
    .overlay h1 { font-weight: normal; letter-spacing: 0.35em; margin: 0; padding-left: 0.35em; font-size: 2rem; }
    .overlay p { margin: 0; color: var(--soft); font-size: 0.85rem; line-height: 1.5; max-width: 30em; }
    .overlay ul { list-style: none; padding: 0; margin: 0; text-align: left; max-width: 30em; font-size: 0.85rem; line-height: 1.45; }
    .overlay li b { margin-right: 8px; }
    .overlay button { background: var(--bg); color: var(--ink); border: 1px solid var(--ink); padding: 0.5rem 1.2rem; font: inherit; }
    .ver { font-size: 0.7rem; letter-spacing: 0.25em; color: var(--soft); }
    .lab { position: absolute; left: 10px; top: calc(env(safe-area-inset-top) + 8px); font-size: 0.7rem; letter-spacing: 0.25em; color: #111; background: #f2f1ec; border: 2px solid #111; padding: 3px 8px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="lab" id="lab"></div>
    <div class="scrap" id="scrap"><small id="scrapWho"></small><div class="f" id="scrapTxt"></div></div>
    <div class="pad">
      <button class="t" id="bVar" aria-label="Variante">A</button>
      <button class="l" id="bInfo" aria-label="Historique">i</button>
      <button class="r" id="bInv" aria-label="Inverser">◐</button>
      <button class="b" id="bRedo" aria-label="Redessiner">↻</button>
    </div>
    <div class="overlay" id="info" hidden>
      <h1>PALAIS</h1>
      <div class="ver" id="ver"></div>
      <p>Page d'essai du rendu, avant le jeu. Touche le sol pour marcher ; marche sur une plaque ◇ pour lire ce qu'elle garde. ◐ inverse le noir et le blanc : la ligne cachée apparaît. A / B : deux densités de dessin. ↻ : retirer les détails au hasard.</p>
      <ul id="hist"></ul>
      <button id="infoClose">Fermer</button>
      <a href="../" style="color:#8e8c85;font-size:0.8rem">← Portfolio</a>
    </div>
  </div>

  <script type="module">
    // three.js (MIT, licence dans vendor/) copié dans le projet : hors ligne
    import * as THREE from "./vendor/three-0.170.0.module.min.js";
    (function () {
      "use strict";
      var VERSIONS = [
        { v: "v3", text: "Le personnage change de tenue : robe raccourcie (on voit les jambes), coupe au carré noire avec frange droite et reflets en traits blancs, et un ras-de-cou noir, à la manière de Mathilda dans Léon. Il garde ses deux pointes, qui sortent des cheveux." },
        { v: "v2", text: "Variante B (sobre) par défaut, choisie par Pierre. Dessin plus « fait main » : traits au pinceau effilés aux deux bouts qui débordent aux coins, joints de dalles qui ploient, hachures irrégulières, éclaboussures d'encre, pinceau sec au bord des masses noires, fibres du papier. Le personnage devient un vrai modèle 3D rendu à l'encre — blanc à la lumière, trame de points dans la demi-teinte, hachures dans l'ombre, contour noir — qui se tourne vers où il va et marche (jambes, bras, tête qui balance)." },
        { v: "v1", text: "Page d'essai du rendu, avant le jeu : une salle en portrait, vue de dessus avec le mur du fond vu de face, dessinée à l'encre par le code à la manière de Helix — dallage fissuré, plaques ◇, mur de briques à arche et niches, tuyaux à brides, gaine annelée, colonnes, spirale gravée, ronces à épines, ombres en traits horizontaux, voile gris et vignettage. Petite créature blanche qui marche avec des bouffées de fumée. Plaques ◇ : un bout de papier avec une phrase de cours ; ◐ inverse noir et blanc et révèle la ligne cachée. Variantes A (dense) et B (sobre), ↻ pour redessiner." }
      ];
      var VERSION = VERSIONS[0].v;

      // ---------- Dimensions : salle en portrait, unités logiques 360 × 640 ----------
      var LW = 360, LH = 640;
      var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
      var stage = document.getElementById("stage");
      var scale = 1, dpr = 1, bg = null;
      var variant = "B", seed = 7, inverted = false;
      try { var st = JSON.parse(localStorage.getItem("palais_essai_v1") || "null"); if (st) { if (st.variant === "A") variant = "A"; if (Number.isInteger(st.seed)) seed = st.seed; } } catch (e) {}
      function saveSt() { try { localStorage.setItem("palais_essai_v1", JSON.stringify({ variant: variant, seed: seed })); } catch (e) {} }

      // Hasard reproductible : la même salle à chaque ouverture
      var rnd;
      function seedRnd(s) {
        var a = s >>> 0;
        rnd = function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      }
      function R(a, b) { return a + (b - a) * rnd(); }

      var PAPER = "#efede6", INK = "#141412";
      var dense = function () { return variant === "A"; };

      // ---------- Outils d'encre ----------
      var g; // contexte de la planche
      // Trait au pinceau : forme pleine, effilée aux deux bouts, épaisseur
      // qui respire le long du trait — et qui déborde un peu aux extrémités
      function brush(pts, w) {
        var n = pts.length; if (n < 2) return;
        var L = [], Rt = [], ph = R(0, 6.28), fq = R(2, 5), prev = g.fillStyle;
        for (var i = 0; i < n; i++) {
          var a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
          var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, t = i / (n - 1);
          var ww = w * 0.5 * Math.pow(Math.sin(Math.PI * (0.06 + 0.88 * t)), 0.45) * (0.8 + 0.4 * (0.5 + 0.5 * Math.sin(t * fq + ph)));
          L.push([pts[i][0] - dy / l * ww, pts[i][1] + dx / l * ww]); Rt.push([pts[i][0] + dy / l * ww, pts[i][1] - dx / l * ww]);
        }
        g.fillStyle = g.strokeStyle; g.beginPath(); g.moveTo(L[0][0], L[0][1]);
        for (var k = 1; k < n; k++) g.lineTo(L[k][0], L[k][1]);
        for (var m = n - 1; m >= 0; m--) g.lineTo(Rt[m][0], Rt[m][1]);
        g.closePath(); g.fill(); g.fillStyle = prev;
      }
      function jline(x1, y1, x2, y2, w, jit) {
        var len = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / len, uy = (y2 - y1) / len;
        var o1 = w >= 1 ? R(0, 1.6) : R(0, 0.6), o2 = w >= 1 ? R(0, 1.6) : R(0, 0.6);
        x1 -= ux * o1; y1 -= uy * o1; x2 += ux * o2; y2 += uy * o2; len += o1 + o2;
        var n = Math.max(3, Math.round(len / 5)), nx = -uy, ny = ux, j = jit === undefined ? 0.4 : jit, bow = R(-0.7, 0.7) * Math.min(1, len / 40);
        var pts = [];
        for (var i = 0; i <= n; i++) {
          var t = i / n, off = Math.sin(Math.PI * t) * bow + R(-j, j) * 0.6;
          pts.push([x1 + (x2 - x1) * t + nx * off, y1 + (y2 - y1) * t + ny * off]);
        }
        brush(pts, w * 1.15);
      }
      function jrect(x, y, w, h, lw, jit) { jline(x, y, x + w, y, lw, jit); jline(x + w, y, x + w, y + h, lw, jit); jline(x + w, y + h, x, y + h, lw, jit); jline(x, y + h, x, y, lw, jit); }
      function stipple(x, y, w, h, n, rmax) {
        g.fillStyle = INK;
        for (var i = 0; i < n; i++) { g.beginPath(); g.arc(x + rnd() * w, y + rnd() * h, R(0.25, rmax || 0.8), 0, 7); g.fill(); }
      }
      // Ombre portée en traits horizontaux serrés, bords effilochés (signature de Helix)
      function hshadow(x, y, w, h, side, gap) {
        gap = gap || 2.2;
        for (var yy = y; yy < y + h; yy += gap * R(0.85, 1.15)) {
          var L = w * R(0.5, 1), sl = R(-0.35, 0.35);
          if (side === "right") jline(x, yy, x + L, yy + sl, 0.85, 0.12);
          else if (side === "left") jline(x + w, yy, x + w - L, yy + sl, 0.85, 0.12);
          else { var c = x + R(0, w * 0.12); jline(c, yy, c + w * R(0.7, 0.95), yy + sl, 0.8, 0.12); }
        }
      }
      // Éclaboussure d'encre : tache et gouttelettes
      function splat(x, y, r) {
        g.fillStyle = INK; g.beginPath();
        for (var i = 0; i < 10; i++) { var a = i / 10 * 6.283, rr = r * R(0.6, 1.2); if (i === 0) g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
        g.closePath(); g.fill();
        for (var k = 0; k < 6; k++) { var a2 = R(0, 6.283), d = r * R(1.4, 3.2); g.beginPath(); g.arc(x + Math.cos(a2) * d, y + Math.sin(a2) * d, R(0.3, r * 0.3), 0, 7); g.fill(); }
      }
      // Pinceau sec : touches effilées qui partent du bord d'une masse noire
      function dryBrush(cx, cy, r, n) {
        g.strokeStyle = INK;
        for (var i = 0; i < n; i++) {
          var a = R(0, 6.283), r0 = r * R(0.7, 0.95), L = R(4, 12), b = a + R(-0.25, 0.25);
          jline(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(b) * (r0 + L), cy + Math.sin(b) * (r0 + L), R(0.6, 1.6), 0.3);
        }
      }
      // Fibres et grain du papier
      function paper() {
        g.fillStyle = "rgba(20,20,18,0.18)";
        for (var i = 0; i < 1600; i++) g.fillRect(rnd() * LW, rnd() * LH, 0.5, 0.5);
        g.strokeStyle = "rgba(20,20,18,0.12)"; g.lineWidth = 0.35;
        for (var k = 0; k < 140; k++) { var x = rnd() * LW, y = rnd() * LH, a = R(0, 6.283), l = R(3, 9); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.6) * l * 0.5, y + Math.sin(a + 0.6) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
        g.strokeStyle = INK;
      }
      function scratches(x, y, w, h, n) {
        g.lineWidth = 0.6;
        for (var i = 0; i < n; i++) {
          var px = x + rnd() * w, py = y + rnd() * h, a = R(-0.6, 0.6), l = R(2, 5);
          g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); g.stroke();
        }
      }

      // ---------- Éléments ----------
      function floorTiles(x0, y0, x1, y1, s) {
        // dalles carrées, joints tremblés, quelques fissures, éclats et poussière
        g.strokeStyle = INK;
        for (var x = x0; x <= x1 + 0.1; x += s) jline(x, y0, x, y1, 1.1, 0.6);
        for (var y = y0; y <= y1 + 0.1; y += s) jline(x0, y, x1, y, 1.1, 0.6);
        for (var ty = y0; ty < y1 - 1; ty += s) for (var tx = x0; tx < x1 - 1; tx += s) {
          var r = rnd();
          if (r < 0.16) { // fissure
            g.lineWidth = 0.8; g.beginPath();
            var px = tx + R(0, s), py = ty, k = 0;
            g.moveTo(px, py);
            while (py < ty + s && k++ < 8) { px += R(-4, 4); py += R(2, 6); g.lineTo(Math.max(tx, Math.min(tx + s, px)), Math.min(ty + s, py)); }
            g.stroke();
          } else if (r < 0.26) { // coin ébréché, rempli d'ombre
            g.fillStyle = INK; g.beginPath();
            var cx = rnd() < 0.5 ? tx : tx + s, cy = rnd() < 0.5 ? ty : ty + s, e = R(3, 7);
            g.moveTo(cx, cy); g.lineTo(cx + (cx === tx ? e : -e), cy); g.lineTo(cx, cy + (cy === ty ? e : -e)); g.closePath(); g.fill();
          } else if (r < 0.42 && dense()) stipple(tx + 2, ty + 2, s - 4, s - 4, 26, 0.7);
          if (dense() && rnd() < 0.5) scratches(tx + 2, ty + 2, s - 4, s - 4, 3);
        }
      }
      function plate(cx, cy, s) {
        // plaque à activer : carré, losange noir épais, petit carré au centre
        g.fillStyle = PAPER; g.fillRect(cx - s / 2, cy - s / 2, s, s);
        g.strokeStyle = INK; jrect(cx - s / 2, cy - s / 2, s, s, 1.6, 0.3); jrect(cx - s / 2 + 3, cy - s / 2 + 3, s - 6, s - 6, 0.7, 0.2);
        var d = s * 0.36;
        g.lineWidth = s * 0.12; g.lineJoin = "miter";
        g.beginPath(); g.moveTo(cx, cy - d); g.lineTo(cx + d, cy); g.lineTo(cx, cy + d); g.lineTo(cx - d, cy); g.closePath(); g.stroke();
        g.lineJoin = "round";
        g.lineWidth = 1; g.strokeRect(cx - 2.5, cy - 2.5, 5, 5);
      }
      function grate(cx, cy, s) {
        g.fillStyle = PAPER; g.fillRect(cx - s / 2, cy - s / 2, s, s);
        g.strokeStyle = INK; jrect(cx - s / 2, cy - s / 2, s, s, 1.4, 0.3);
        for (var x = cx - s / 2 + 3; x < cx + s / 2 - 2; x += 2.6) jline(x, cy - s / 2 + 3, x, cy + s / 2 - 3, 0.9, 0.2);
      }
      function spiral(cx, cy, r) {
        // spirale gravée au sol — la « Helix »
        g.strokeStyle = INK; g.lineWidth = 0.9; g.beginPath();
        for (var a = 0; a < Math.PI * 10; a += 0.08) {
          var rr = r * a / (Math.PI * 10), x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * 0.92;
          if (a === 0) g.moveTo(x, y); else g.lineTo(x + R(-0.25, 0.25), y + R(-0.25, 0.25));
        }
        g.stroke();
        g.beginPath(); g.arc(cx, cy, r + 4, 0, 7); g.lineWidth = 1.4; g.stroke();
        g.beginPath(); g.arc(cx, cy, r + 7, 0, 7); g.lineWidth = 0.7; g.stroke();
      }
      function column(cx, cy, r) {
        // colonne vue de dessus : ombre à droite, chapiteau à denticules
        g.save(); g.beginPath(); g.rect(cx, cy - r - 2, r * 2.6, r * 2 + 6); g.clip();
        g.strokeStyle = INK; hshadow(cx, cy - r + 2, r * 2.4, r * 2 + 2, "right", 2.1); g.restore();
        g.fillStyle = PAPER; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
        g.strokeStyle = INK; g.lineWidth = 2.2; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
        g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, r * 0.72, 0, 7); g.stroke();
        for (var a = 0; a < Math.PI * 2; a += Math.PI / 10) jline(cx + Math.cos(a) * r * 0.74, cy + Math.sin(a) * r * 0.74, cx + Math.cos(a) * r * 0.95, cy + Math.sin(a) * r * 0.95, 0.9, 0.1);
        g.save(); g.beginPath(); g.arc(cx, cy, r * 0.7, 0, 7); g.clip();
        for (var y = cy - r; y < cy + r; y += 2.4) jline(cx + r * R(0.05, 0.25), y, cx + r, y + R(-0.3, 0.3), 0.75, 0.1);
        g.restore();
        g.beginPath(); g.arc(cx - r * 0.25, cy - r * 0.25, r * 0.18, 0, 7); g.fillStyle = PAPER; g.fill();
      }
      function pipe(pts, r) {
        // tuyau vu de dessus : corps clair, deux bords, reflet, brides aux jonctions
        g.lineCap = "butt";
        g.strokeStyle = INK; g.lineWidth = r * 2 + 3.2; poly(pts); g.stroke();
        g.strokeStyle = PAPER; g.lineWidth = r * 2 - 1.2; poly(pts); g.stroke();
        g.strokeStyle = INK; g.lineWidth = 0.8; g.setLineDash([R(6, 12), R(3, 6)]);
        polyOffset(pts, r * 0.45); g.stroke(); g.setLineDash([]);
        g.lineCap = "round";
        for (var i = 0; i < pts.length; i++) {
          var p = pts[i], q = pts[Math.min(i + 1, pts.length - 1)], o = pts[Math.max(i - 1, 0)];
          var dx = (q[0] - o[0]), dy = (q[1] - o[1]), L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
          flange(p[0], p[1], dx, dy, r);
          if (i < pts.length - 1) {
            var mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, sl = Math.hypot(q[0] - p[0], q[1] - p[1]);
            if (sl > 80) { flange(mx, my, (q[0] - p[0]) / sl, (q[1] - p[1]) / sl, r); }
            // petites hachures en « ʌʌ » de reflet
            var hx = p[0] + (q[0] - p[0]) * 0.3, hy = p[1] + (q[1] - p[1]) * 0.3, ux = (q[0] - p[0]) / sl, uy = (q[1] - p[1]) / sl;
            g.lineWidth = 0.7;
            for (var k = 0; k < 4; k++) { var bx = hx + ux * k * 3 - uy * r * 0.2, by = hy + uy * k * 3 + ux * r * 0.2; g.beginPath(); g.moveTo(bx - uy * 3, by + ux * 3); g.lineTo(bx + ux * 1.5, by + uy * 1.5); g.lineTo(bx + uy * 3 + ux * 3, by - ux * 3 + uy * 3); g.stroke(); }
          }
        }
      }
      function flange(x, y, dx, dy, r) {
        var nx = -dy, ny = dx, w = r + 3.5, d = 3.2;
        g.fillStyle = PAPER; g.strokeStyle = INK; g.lineWidth = 1.6;
        g.beginPath();
        g.moveTo(x + nx * w - dx * d, y + ny * w - dy * d); g.lineTo(x + nx * w + dx * d, y + ny * w + dy * d);
        g.lineTo(x - nx * w + dx * d, y - ny * w + dy * d); g.lineTo(x - nx * w - dx * d, y - ny * w - dy * d); g.closePath();
        g.fill(); g.stroke();
        g.lineWidth = 0.7; g.beginPath(); g.moveTo(x + nx * w, y + ny * w); g.lineTo(x - nx * w, y - ny * w); g.stroke();
      }
      function poly(pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
      function polyOffset(pts, o) {

            var leg = part(new THREE.CapsuleGeometry(0.072, 0.38, 6, 12), null, hip); leg.position.y = -0.26;
            var sh = new THREE.Group(); sh.position.set(sd * 0.27, 0.78, 0); bodyG.add(sh);
            var arm = part(new THREE.CapsuleGeometry(0.06, 0.24, 6, 12), null, sh); arm.position.y = -0.17; sh.rotation.z = sd * 0.35;
            limbs[sd] = { hip: hip, sh: sh };
          });
          // pied au sol : où tombe l'origine dans l'image
          var foot = new THREE.Vector3(0, 0, 0).project(cam);
          H3 = { r: renderer, scene: scene, cam: cam, root: root, body: bodyG, head: head, limbs: limbs, yaw: 0, footY: (1 - foot.y) / 2, ink: ink };
          return true;
        } catch (e) { H3 = null; return false; }
      }
      function renderHero3D() {
        var w = hero.walk, mv = hero.moving ? 1 : 0, sw = Math.sin(w * 11) * 0.7 * mv;
        // se tourner vers où l'on va (vers le bas de l'écran = face à nous)
        var target = hero.yawT === undefined ? 0 : hero.yawT, dyw = target - H3.yaw;
        while (dyw > Math.PI) dyw -= 2 * Math.PI; while (dyw < -Math.PI) dyw += 2 * Math.PI;
        H3.yaw += dyw * 0.25; H3.root.rotation.y = H3.yaw;
        H3.limbs[-1].hip.rotation.x = sw; H3.limbs[1].hip.rotation.x = -sw;
        H3.limbs[-1].sh.rotation.x = -sw * 0.8; H3.limbs[1].sh.rotation.x = sw * 0.8;
        H3.body.position.y = Math.abs(Math.cos(w * 11)) * 0.05 * mv;
        H3.head.rotation.z = Math.sin(w * 5.5) * 0.08 * mv;
        H3.body.rotation.x = 0.12 * mv;
        H3.r.render(H3.scene, H3.cam);
        return H3.r.domElement;
      }
      function drawPuffs(c) {
        c.strokeStyle = INK; c.fillStyle = "#f7f6f1"; c.lineWidth = 1;
        puffs.forEach(function (p) {
          c.globalAlpha = Math.max(0, p.life);
          c.beginPath(); c.arc(p.x, p.y, Math.max(0.2, p.r), 0, 7); c.fill(); c.stroke();
        });
        c.globalAlpha = 1;
      }

      // ---------- Mise à l'échelle et rendu ----------
      function layout() {
        var vw = window.innerWidth, vh = window.innerHeight;
        scale = Math.min(vw / LW, vh / LH);
        var w = Math.floor(LW * scale), h = Math.floor(LH * scale);
        stage.style.width = w + "px"; stage.style.height = h + "px";
        dpr = Math.min(window.devicePixelRatio || 1, 3);
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        bg = document.createElement("canvas"); bg.width = cv.width; bg.height = cv.height;
        g = bg.getContext("2d"); g.setTransform(cv.width / LW, 0, 0, cv.height / LH, 0, 0);
        drawRoom();
        draw();
      }
      function draw() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(bg, 0, 0);
        ctx.setTransform(cv.width / LW, 0, 0, cv.height / LH, 0, 0);
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        drawPuffs(ctx);
        if (H3) {
          var x = hero.x, y = hero.y;
          ctx.strokeStyle = INK; ctx.lineWidth = 0.8;
          for (var k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(x - 12 + Math.abs(k) * 3, y + 2 + k * 1.7); ctx.lineTo(x + 12 - Math.abs(k) * 3, y + 2 + k * 1.7); ctx.stroke(); }
          ctx.drawImage(renderHero3D(), x - HS / 2, y - HS * H3.footY + 2, HS, HS);
        } else drawHero(ctx);
      }

      // ---------- Boucle (seulement quand quelque chose bouge) ----------
      var running = false, last = 0;
      function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); } }
      function tick(now) {
        var dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
        var dx = hero.tx - hero.x, dy = hero.ty - hero.y, d = Math.hypot(dx, dy), sp = 70 * dt;
        hero.moving = d > 0.5;
        if (hero.moving) {
          var k = Math.min(1, sp / d); hero.x += dx * k; hero.y += dy * k; hero.walk += dt;
          if (Math.abs(dx) > 1) hero.face = dx > 0 ? 1 : -1;
          hero.yawT = Math.atan2(dx, dy);
          hero.puffT = (hero.puffT || 0) - dt;
          if (hero.puffT <= 0) { hero.puffT = 0.16; puffs.push({ x: hero.x + R(-6, 6), y: hero.y + 13, r: R(1.5, 2.6), life: 1 }); step(); }
        }
        // arrivé (ou presque) : la plaque sous les pieds parle
        if (Math.hypot(hero.tx - hero.x, hero.ty - hero.y) < 0.6) checkPlate(); else if (current >= 0) { current = -1; scrap.classList.remove("show"); }
        puffs.forEach(function (p) { p.r += dt * 6; p.y -= dt * 4; p.life -= dt * 1.6; });
        puffs = puffs.filter(function (p) { return p.life > 0; });
        draw();
        running = false;
        var turning = H3 && hero.yawT !== undefined && Math.abs(Math.atan2(Math.sin(hero.yawT - H3.yaw), Math.cos(hero.yawT - H3.yaw))) > 0.01;
        if (hero.moving || puffs.length || turning) kick();
      }

      // ---------- Plaques : une phrase de cours ----------
      var scrap = document.getElementById("scrap"), current = -1;
      function checkPlate() {
        var hit = -1;
        PLATES.forEach(function (p, i) { if (Math.abs(hero.x - p.x) < 15 && Math.abs(hero.y - p.y) < 18) hit = i; });
        if (hit === current) return;
        current = hit;
        if (hit < 0) { scrap.classList.remove("show"); return; }
        var p = PLATES[hit];
        document.getElementById("scrapWho").textContent = "— " + p.who;
        renderScrap();
        scrap.classList.add("show"); chime();
      }
      function renderScrap() {
        if (current < 0) return;
        var p = PLATES[current], box = document.getElementById("scrapTxt");
        box.textContent = "";
        p.txt.forEach(function (line, i) {
          var d = document.createElement("div");
          d.textContent = line;
          // la dernière ligne reste cachée tant qu'on n'a pas inversé
          if (i === p.txt.length - 1 && !inverted) d.className = "hid";
          box.appendChild(d);
        });
      }

      // ---------- Son (court, débloqué au premier geste) ----------
      var AC = null;
      function audio() { if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      function blip(f, d, v, type) {
        if (!AC) return; var t = AC.currentTime, o = AC.createOscillator(), gg = AC.createGain();
        o.type = type || "sine"; o.frequency.value = f; gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(v, t + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(gg); gg.connect(AC.destination); o.start(t); o.stop(t + d + 0.05);
      }
      var alt = false;
      function step() { alt = !alt; blip(alt ? 180 : 150, 0.06, 0.05, "triangle"); }
      function chime() { blip(392, 0.8, 0.06); blip(587, 1, 0.05); }

      // ---------- Gestes ----------
      cv.addEventListener("pointerdown", function (e) {
        audio();
        var r = cv.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width * LW, y = (e.clientY - r.top) / r.height * LH;
        hero.tx = Math.max(FLOOR.x0 + 16, Math.min(FLOOR.x1 - 16, x));
        hero.ty = Math.max(FLOOR.y0 + 22, Math.min(FLOOR.y1 - 8, y));
        kick();
      });
      function refreshPad() {
        document.getElementById("bVar").textContent = variant;
        document.getElementById("bInv").className = "r" + (inverted ? " on" : "");
        document.getElementById("lab").textContent = "ESSAI · " + VERSION + " · " + variant;
      }
      document.getElementById("bVar").addEventListener("click", function () { variant = variant === "A" ? "B" : "A"; saveSt(); refreshPad(); layout(); });
      document.getElementById("bRedo").addEventListener("click", function () { seed = (seed * 9301 + 49297) % 233280; saveSt(); layout(); });
      document.getElementById("bInv").addEventListener("click", function () {
        audio(); inverted = !inverted; cv.classList.toggle("inv", inverted); refreshPad(); renderScrap();
        blip(inverted ? 110 : 165, 0.5, 0.07, "triangle");
      });
      document.getElementById("bInfo").addEventListener("click", function () {
        document.getElementById("ver").textContent = "VERSION " + VERSION;
        var ul = document.getElementById("hist"); ul.textContent = "";
        VERSIONS.forEach(function (v) { var li = document.createElement("li"), b = document.createElement("b"); b.textContent = v.v; li.appendChild(b); li.appendChild(document.createTextNode(v.text)); ul.appendChild(li); });
        document.getElementById("info").hidden = false;
      });
      document.getElementById("infoClose").addEventListener("click", function () { document.getElementById("info").hidden = true; });

      // ---------- Écran figé ----------
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (ty) { document.addEventListener(ty, function (e) { e.preventDefault(); }, { passive: false }); });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });

      var rt = 0;
      window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 150); });
      makeHero3D();
      refreshPad(); layout();
      if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
    })();
  </script>

  <script>
    // Mise à jour automatique (même principe que la page d'accueil du portfolio)
    (function () {
      var PAGE = "palais";
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return;
        lastCheck = now0;
        try {
          var url = (location.pathname || "index.html") + "?_cb=" + now0;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          var tag = res.headers.get("etag") || res.headers.get("last-modified");
          if (!tag) return;
          var key = "pm_pageVersion_" + PAGE;
          var stored = localStorage.getItem(key);
          if (stored === null) { localStorage.setItem(key, tag); return; }
          if (tag !== stored) {
            var now = Date.now();
            var guard = "pm_lastUpdateReload_" + PAGE;
            var lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem(guard)) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try {
              localStorage.setItem(key, tag);
              sessionStorage.setItem(guard, String(now));
            } catch (e) {}
            location.replace(location.pathname + "?_r=" + now);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>

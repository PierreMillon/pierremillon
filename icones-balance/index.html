  <style>
    /* Planche d'essai : 50 icônes « balance » pour le badge de Pas à Pas.
       Même trait que les badges (vert phosphore, fond noir). */
    :root { --ink: #5ef0a0; --soft: #2f8f5c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0; margin: 0;
      background: #050d09; color: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      display: flex; flex-direction: column;
      padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    header { display: flex; align-items: center; justify-content: space-between; font-size: 12px; letter-spacing: 0.12em; color: var(--soft); }
    header button { font: inherit; color: var(--soft); background: none; border: 1px solid var(--soft); border-radius: 999px; padding: 4px 10px; touch-action: manipulation; }
    .big { flex: none; height: 26%; display: flex; align-items: center; justify-content: center; gap: 24px; }
    .big .ring { height: 78%; aspect-ratio: 1; border: 1.5px solid var(--soft); border-radius: 50%; display: grid; place-items: center; }
    .big .ring svg { width: 62%; }
    .big .small { width: 34px; height: 34px; border: 1px solid var(--soft); border-radius: 50%; display: grid; place-items: center; }
    .big .small svg { width: 62%; }
    .big .num { font-size: 28px; min-width: 2.2em; text-align: center; }
    .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 6px; }
    .cell { position: relative; background: none; border: 1px solid #143324; border-radius: 10px; padding: 0; display: grid; place-items: center; touch-action: manipulation; }
    .cell.sel { border-color: var(--ink); }
    .cell svg { width: 58%; max-height: 70%; }
    .cell span { position: absolute; left: 4px; top: 2px; font-size: 9px; color: var(--soft); }
    svg { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; z-index: 5; }
    .overlay[hidden] { display: none; }
    .overlay ul { list-style: none; margin: 0; padding: 0; max-width: 22rem; font-size: 13px; line-height: 1.5; }
    .overlay li { border-top: 1px solid #143324; padding: 8px 0; }
    .overlay b { display: block; }
    .overlay button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--ink); border-radius: 999px; padding: 8px 20px; }
  </style>
</head>

  <div class="overlay" id="hist" hidden><ul id="histList"></ul><button id="histClose">Fermer</button></div>
  <script>
    (function () {
      var VERSIONS = [
        { v: "v1", text: "50 propositions d'icône « balance » pour le badge de Pas à Pas ; un toucher l'affiche en grand et à la taille réelle d'un badge." }
      ];
      var ver = document.getElementById("ver");
      ver.textContent = "Version " + VERSIONS[0].v;
      document.getElementById("histList").innerHTML = VERSIONS.map(function (v) { return "<li><b>" + v.v + "</b>" + v.text + "</li>"; }).join("");
      ver.addEventListener("click", function () { document.getElementById("hist").hidden = false; });
      document.getElementById("histClose").addEventListener("click", function () { document.getElementById("hist").hidden = true; });
      function pick(c) {
        document.querySelectorAll(".cell.sel").forEach(function (e) { e.classList.remove("sel"); });
        c.classList.add("sel");
        var svg = c.querySelector("svg").outerHTML;
        document.getElementById("bigA").innerHTML = svg;
        document.getElementById("bigB").innerHTML = svg;
        document.getElementById("num").textContent = "n° " + c.dataset.n;
      }
      document.querySelectorAll(".cell").forEach(function (c) { c.addEventListener("click", function () { pick(c); }); });
      pick(document.querySelector(".cell"));
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }); });
    })();
    // Mise à jour automatique (copiée de la page d'accueil, clés propres à
    // ce projet) : comparaison d'ETag, rechargement silencieux
    (function () {
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return;
        lastCheck = now0;
        try {
          var res = await fetch((location.pathname || "index.html") + "?_cb=" + now0, { cache: "no-store" });
          if (!res.ok) return;
          var tag = res.headers.get("etag") || res.headers.get("last-modified");
          if (!tag) return;
          var stored = localStorage.getItem("balances_pageVersion");
          if (stored === null) { localStorage.setItem("balances_pageVersion", tag); return; }
          if (tag !== stored) {
            var now = Date.now(), lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem("balances_lastUpdateReload")) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try { localStorage.setItem("balances_pageVersion", tag); sessionStorage.setItem("balances_lastUpdateReload", String(now)); } catch (e) {}
            location.replace(location.pathname + "?_r=" + now);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>

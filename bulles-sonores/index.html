<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>Bulles Sonores</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05100a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bulles">
  <link rel="modulepreload" href="vendor/rapier2d-compat-0.14.0.js">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Oscilloscope / vieux moniteur — palette fixe, jamais d'ivoire ici
       (voir REGLES-JEUX.md : esthétique par défaut du catalogue) */
    :root {
      --bg: #05100a;
      --bg-soft: #0a1a12;
      --ink: #3be08a;
      --ink-soft: #2a8f5c;
      --hairline: #123322;
      --accent: #6dffb0;
      --accent-soft: rgba(61, 224, 138, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    /* Pas une fenêtre qui représente un oscilloscope : tout l'écran EST
       l'oscilloscope. Le fond, c'est directement l'arène, plein cadre. */
    body {
      position: fixed;
      inset: 0;
      margin: 0;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    /* Téléphone : plein écran. Pliant carré : plein écran aussi. Plus
       large que carré (tablette, ordinateur) : l'arène reste carrée au
       centre, bandes noires sur les côtés (letterbox, REGLES-JEUX.md). */
    .arena, .topbar {
      margin: 0 auto;
      max-width: 100vh;
      max-width: 100dvh;
    }

    /* Interface cachée : juste un ⓘ discret dans le coin, le reste est
       dans le menu. La barre ne capte pas les doigts (les bulles passent
       dessous). */
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: 0.6rem 10px 0;
      display: flex;
      justify-content: flex-end;
      pointer-events: none;
    }

    .info-btn {
      pointer-events: auto;
      font-family: inherit;
      font-size: 1.1rem;
      color: var(--ink-soft);
      background: none;
      border: none;
      padding: 0.4rem 0.5rem;
      cursor: pointer;
      opacity: 0.6;
      touch-action: manipulation;
    }

    .info-btn:hover { color: var(--accent); opacity: 1; }

    .menu-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn.small {
      font-size: 0.66rem;
      padding: 0.55rem 1rem;
      text-decoration: none;
    }

    .label {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-top: 0.4rem;
    }

    .hist-list {
      width: 100%;
      max-width: 22rem;
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
    }

    .hist-list li {
      padding: 0.7rem 0;
      border-top: 1px solid var(--hairline);
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--ink-soft);
    }

    .hist-list li:last-child { border-bottom: 1px solid var(--hairline); }

    .hist-list b {
      display: block;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 0.1rem;
    }

    .arena {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 0 0 1px var(--hairline);
    }

    .arena::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--hairline) 1px, transparent 1px),
        linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* Oscilloscope : les bulles sont des contours seuls, vert phosphore,
       sans remplissage (voir REGLES-JEUX.md), dessinés sur un canvas qui
       garde une traînée (persistance du phosphore). */
    .field {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
      background: rgba(5, 16, 10, 0.94);
      z-index: 6;
    }

    .overlay[hidden] { display: none; }

    .overlay p {
      margin: 0;
      max-width: 22rem;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--ink-soft);
    }

    .overlay .big {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 300;
      font-size: 1.8rem;
      color: var(--ink);
    }

    .btn {
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
    }

    .hint {
      margin-top: 0.8rem;
      font-size: 0.68rem;
      color: var(--ink-soft);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="arena" id="arena"></div>

  <div class="topbar">
    <button class="info-btn" id="infoBtn" aria-label="Menu">ⓘ</button>
  </div>

  <div class="overlay" id="menu" hidden>
    <div class="big" data-t="title">Bulles Sonores</div>
    <div class="menu-row">
      <a class="btn small" href="../" data-t="back">← Portfolio</a>
      <button class="btn small" id="langBtn">EN</button>
      <button class="btn small" id="muteBtn">Son</button>
    </div>
    <div class="label" data-t="history">Historique</div>
    <ul class="hist-list" id="histList"></ul>
    <button class="btn" id="menuClose" data-t="close">Fermer</button>
  </div>

  <script type="module">
    // Physique : Rapier (moteur Rust compilé en WebAssembly, choix de
    // Pierre). Copie locale de @dimforge/rapier2d-compat 0.14.0 (fichier
    // identique à celui de jsDelivr, licence Apache-2.0 dans vendor/) :
    // servie par GitHub Pages et mise en cache par le service worker, le
    // prototype marche hors ligne.
    import RAPIER from "./vendor/rapier2d-compat-0.14.0.js";

    // ---------- Langue (français / anglais) ----------

    var TEXTS = {
      fr: { title: "Bulles Sonores", back: "← Portfolio", history: "Historique", close: "Fermer", other: "EN",
            soundOn: "Son : oui", soundOff: "Son : non",
            noEngine: "Moteur physique introuvable — recharge la page avec du réseau." },
      en: { title: "Sound Bubbles", back: "← Portfolio", history: "History", close: "Close", other: "FR",
            soundOn: "Sound: on", soundOff: "Sound: off",
            noEngine: "Physics engine not found — reload the page while online." }
    };
    var lang = "fr";
    try { lang = localStorage.getItem("bulles-sonores-lang") || ""; } catch (e) { lang = ""; }
    if (!TEXTS[lang]) lang = /^fr\b/i.test(navigator.language || "fr") ? "fr" : "en";
    var muted = false;
    try { muted = localStorage.getItem("bulles-sonores-muted") === "1"; } catch (e) {}

    function applyTexts() {
      var t = TEXTS[lang];
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.dataset.t]; });
      document.getElementById("langBtn").textContent = t.other;
      document.getElementById("muteBtn").textContent = muted ? t.soundOff : t.soundOn;
    }
    applyTexts();

    try {
      await RAPIER.init();
    } catch (e) {
      var msg = document.createElement("p");
      msg.className = "hint";
      msg.style.cssText = "position:fixed;left:0;right:0;top:45%;";
      msg.textContent = TEXTS[lang].noEngine;
      document.body.appendChild(msg);
      throw e;
    }

    (function () {
      // Bulles molles « bille d'eau / bulle de savon » : chaque bulle est un
      // anneau de petits points (corps Rapier) reliés par des ressorts, gonflé
      // par une pression interne qui défend son volume (modèle de Matyka,
      // « How to implement a pressure soft body model »), plus un léger
      // rappel vers la forme ronde (tension de surface, façon JellyCar).
      // Le volume se conserve : couper partage la surface, fusionner
      // l'additionne, aspirer la transfère d'une bulle à l'autre, et rien
      // n'apparaît jamais tout seul.

      // ---------- Réglages ----------

      var MAX_BUBBLES = 14;      // groupes de collision Rapier : 16 au plus
      var NODES = 20;            // points par bulle
      var SPLIT_HOLD_MS = 650;   // appui simple maintenu -> la bulle se coupe en deux
      var DOUBLE_TAP_MS = 320;   // fenêtre pour qu'un deuxième tap compte comme double-tap
      var TAP_MAX_MS = 220;      // au-delà, un appui n'est plus un "tap" mais un maintien
      var JITTER_PX = 10;        // tolérance de mouvement pour rester "stationnaire"
      var SPLIT_STRETCH = 2.2;   // écart des doigts (× rayon) au-delà duquel la bulle cède
      var MERGE_CONTACT_MS = 700; // deux bulles restées collées -> fusion (gouttes d'eau)
      var MERGE_SPEED = 220;     // px/s : un choc plus rapide que ça fusionne tout de suite
      var SPLIT_COOLDOWN_MS = 1500; // deux moitiés tout juste coupées ne refusionnent pas
      var COHESION_RANGE = 14;   // px : deux gouttes plus proches que ça s'attirent
      var COHESION = 260;        // px/s² : force de cette attraction
      var SIP_SHARE = 0.3;       // double-tap bref : gorgée = 30 % de la voisine
      var SIP_RATE = 0.8;        // double-tap maintenu : surface aspirée par s (× surface de la preneuse)
      var SIP_REACH = 1.2;       // portée d'aspiration (× rayon) : on boit une voisine proche, comme à la paille
      var MIN_R = 14;            // en dessous, une bulle aspirée disparaît
      var ICE_DAMPING = 0.32;    // freinage de glisse (par seconde) — faible = glace

      // Matière : gelée d'eau — s'écrase et tremble, un peu plus tenue qu'en v8
      var K_EDGE = 546;          // ressorts du contour (+30 % après essai)
      var C_EDGE = 10;           // amortissement des ressorts du contour
      var K_PRESS = 910;         // pression interne (défend le volume)
      var K_SHAPE = 29;          // rappel doux vers le rond
      var C_WOBBLE = 1.6;        // les tremblements s'éteignent en ~1 s
      var DRIVE_K = 220;         // ressort doigt -> bulle
      var DRIVE_C = 28;          // amortissement du ressort doigt (~critique)
      var MAX_DRIVE = 8000;      // px/s², plafond : la bulle suit vite sans se froisser
      var BUBBLE_FRICTION = 0.4; // frotter une bulle contre une autre l'entraîne
      var WALL_BOUNCE = 0.3;
      var MAX_SPEED = 1600;      // px/s

      var PX_PER_METER = 50;
      var WALL_THICK = 200;
      var STEP = 1 / 60;

      // Note libre, fixée par la taille : fréquence inversement
      // proportionnelle au rayon (comme une vraie cavité qui résonne).
      var REF_R = 40, REF_FREQ = 220;
      function noteFor(r) { return clamp(REF_FREQ * REF_R / r, 70, 900); }

      var arena = document.getElementById("arena");
      var canvas = document.createElement("canvas");
      canvas.className = "field";
      arena.appendChild(canvas);
      var ctx = canvas.getContext("2d");
      var dpr = 1;
      var INK = "#3be08a", ACCENT = "#6dffb0";

      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

      var bubbles = [];
      var nextId = 1;
      var lastTime = 0;
      var effects = [];             // anneaux, ponts de matière, éclaboussures
      var pointerOwner = {};        // pointerId -> bulle tenue

      // ---------- Monde Rapier ----------

      var world = new RAPIER.World({ x: 0, y: 0 });
      world.timestep = STEP;
      if ("lengthUnit" in world) world.lengthUnit = PX_PER_METER;
      var events = new RAPIER.EventQueue(true);
      var nodeOwner = new Map();    // handle de collider -> bulle
      var walls = [];
      var wallSet = new Set();
      var wallBody = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
      var pairs = new Map();        // "idA:idB" -> { n, since, lastNote, start, pad }
      var accumulator = 0;
      var quietUntil = 0;           // pas de sons juste après un redimensionnement
      var usedGroups = 0;           // bits de groupe de collision pris

      function arenaSize() { return { w: arena.clientWidth, h: arena.clientHeight }; }

      function fitCanvas() {
        var s = arenaSize();
        dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(s.w * dpr);
        canvas.height = Math.round(s.h * dpr);
        canvas.style.width = s.w + "px";
        canvas.style.height = s.h + "px";
      }

      function buildWalls() {
        walls.forEach(function (c) { wallSet.delete(c.handle); world.removeCollider(c, false); });
        walls = [];
        var s = arenaSize(), t = WALL_THICK;
        [
          [-t / 2, s.h / 2, t / 2, s.h / 2 + t],
          [s.w + t / 2, s.h / 2, t / 2, s.h / 2 + t],
          [s.w / 2, -t / 2, s.w / 2 + t, t / 2],
          [s.w / 2, s.h + t / 2, s.w / 2 + t, t / 2]
        ].forEach(function (w) {
          var c = world.createCollider(
            RAPIER.ColliderDesc.cuboid(w[2], w[3])
              .setTranslation(w[0], w[1])
              .setFriction(0.05)
              .setRestitution(WALL_BOUNCE)
              .setRestitutionCombineRule(RAPIER.CoefficientCombineRule.Max),
            wallBody
          );
          wallSet.add(c.handle);
          walls.push(c);
        });
      }

      // ---------- Son ----------

      var audio = null;
      var master = null;   // volume général : coupé net quand on quitte ou en muet

      function masterLevel() { return muted || document.hidden ? 0 : 1; }

      function initAudio() {
        if (!audio) {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) {
            audio = new Ctx();
            master = audio.createGain();
            master.connect(audio.destination);
            startPulse();
          }
        }
        if (audio && audio.state === "suspended") audio.resume();
        setMaster();
      }

      function setMaster() {
        if (!master) return;
        master.gain.cancelScheduledValues(audio.currentTime);
        master.gain.setValueAtTime(masterLevel(), audio.currentTime);
      }
      window.onMuteChange = function () { setMaster(); if (muted) stopAllTones(); };

      function soundOk() { return audio && !muted && !document.hidden && performance.now() >= quietUntil; }

      // Timbre « goutte d'eau » : sinus rond, léger glissé vers la note, et
      // un partiel aigu très court pour l'attaque (façon marimba).
      function playNote(freq, gain) {
        if (!soundOk()) return;
        var t = audio.currentTime;
        var g = audio.createGain();
        g.connect(master);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        var o = audio.createOscillator();
        o.type = "sine";
        o.frequency.setValueAtTime(freq * 0.94, t);
        o.frequency.exponentialRampToValueAtTime(freq, t + 0.04);
        o.connect(g);
        o.start(t);
        o.stop(t + 0.95);

        var g2 = audio.createGain();
        g2.connect(master);
        g2.gain.setValueAtTime(0.0001, t);
        g2.gain.exponentialRampToValueAtTime(gain * 0.35, t + 0.005);
        g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        var o2 = audio.createOscillator();
        o2.type = "sine";
        o2.frequency.setValueAtTime(freq * 3.9, t);
        o2.connect(g2);
        o2.start(t);
        o2.stop(t + 0.15);
      }

      function sing(b, gain) {
        var now = performance.now();
        b.singAmp = Math.max(b.singAmp, clamp(gain * 6, 0.15, 1));
        wake();
        if (now - b.lastNote < 90) return;
        b.lastNote = now;
        playNote(noteFor(b.r), gain);
      }

      // Son tenu : une voix douce (sinus + vibrato) qui suit une fréquence.
      function startTone(freq, gain) {
        if (!audio) return null;
        var t = audio.currentTime;
        var g = audio.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.25);
        g.connect(master);
        var o = audio.createOscillator();
        o.type = "sine";
        o.frequency.setValueAtTime(freq, t);
        var lfo = audio.createOscillator();
        lfo.frequency.value = 5.5;
        var depth = audio.createGain();
        depth.gain.value = 0;
        lfo.connect(depth);
        depth.connect(o.frequency);
        o.connect(g);
        o.start(t);
        lfo.start(t);
        return { o: o, g: g, lfo: lfo, depth: depth, gain: gain };
      }

      function tuneTone(tone, freq, vibrato) {
        if (!tone || !audio) return;
        var t = audio.currentTime;
        tone.o.frequency.setTargetAtTime(freq, t, 0.05);
        tone.depth.gain.setTargetAtTime(freq * vibrato, t, 0.08);
      }

      function stopTone(tone) {
        if (!tone || !audio) return;
        var t = audio.currentTime;
        try {
          tone.g.gain.cancelScheduledValues(t);
          tone.g.gain.setTargetAtTime(0.0001, t, 0.12);
          tone.o.stop(t + 0.6);
          tone.lfo.stop(t + 0.6);
        } catch (e) {}
      }

      function stopAllTones() {
        bubbles.forEach(function (b) { stopTone(b.tone); b.tone = null; });
        pairs.forEach(function (p) { if (p.pad) { p.pad.forEach(stopTone); p.pad = null; } });
      }

      // Pulsation de fond : un battement grave et doux, qui accélère quand
      // il y a du mouvement (lent au repos, ~50/min ; jusqu'à ~110/min).
      var pulseTimer = null, nextBeat = 0;
      function activity() {
        var sp = 0, held = 0;
        bubbles.forEach(function (b) { sp += Math.hypot(b.vx, b.vy); if (isHeld(b)) held++; });
        return clamp(sp / 900 + held * 0.25, 0, 1);
      }
      function startPulse() {
        if (pulseTimer) return;
        nextBeat = audio.currentTime + 0.2;
        pulseTimer = setInterval(function () {
          if (!audio || document.hidden) return;
          var bpm = 50 + 60 * activity();
          while (nextBeat < audio.currentTime + 0.25) {
            if (!muted && nextBeat > audio.currentTime) thump(nextBeat);
            nextBeat += 60 / bpm;
          }
        }, 100);
      }
      function thump(t) {
        var g = audio.createGain();
        g.connect(master);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.07, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        var o = audio.createOscillator();
        o.type = "sine";
        o.frequency.setValueAtTime(62, t);
        o.frequency.exponentialRampToValueAtTime(44, t + 0.3);
        o.connect(g);
        o.start(t);
        o.stop(t + 0.4);
      }

      // Si l'appli passe en arrière-plan, on coupe le volume général net
      // (plus de son parasite en quittant).
      function silenceNow() {
        quietUntil = performance.now() + 800;
        if (master) {
          try {
            master.gain.cancelScheduledValues(audio.currentTime);
            master.gain.setValueAtTime(0, audio.currentTime);
          } catch (e) {}
        }
        if (audio && audio.state === "running") {
          try { audio.suspend(); } catch (e) {}
        }
      }
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) silenceNow();
        else { quietUntil = performance.now() + 800; wake(); }
      });
      window.addEventListener("pagehide", silenceNow);
      window.addEventListener("blur", silenceNow);

      // ---------- Bulles (anneaux de points) ----------

      function ringGeometry(r) {
        var nodeR = r * 0.17;                       // les points voisins se chevauchent : pas de trou
        var rc = r - nodeR;                         // rayon des centres des points
        var edge = 2 * rc * Math.sin(Math.PI / NODES);
        var area = 0.5 * NODES * rc * rc * Math.sin(2 * Math.PI / NODES);
        return { nodeR: nodeR, rc: rc, edge: edge, area: area };
      }

      function takeGroup() {
        for (var g = 0; g < 16; g++) if (!(usedGroups & (1 << g))) { usedGroups |= 1 << g; return g; }
        return -1;
      }

      function spawnBubble(x, y, r, vx, vy) {
        var s = arenaSize();
        if (x === undefined) {
          var tries = 0;
          do {
            x = r + Math.random() * Math.max(1, s.w - 2 * r);
            y = r + Math.random() * Math.max(1, s.h - 2 * r);
            tries++;
          } while (tries < 80 && bubbles.some(function (o) { return Math.hypot(o.x - x, o.y - y) < o.r + r + 6; }));
        }
        if (vx === undefined) {
          var angle = Math.random() * Math.PI * 2;
          var speed = 40 + Math.random() * 60;
          vx = Math.cos(angle) * speed;
          vy = Math.sin(angle) * speed;
        }
        var group = takeGroup();
        if (group < 0) return null;

        var b = {
          id: nextId++,
          group: group,
          r: r,
          geo: ringGeometry(r),
          nodes: [],
          x: x, y: y, vx: vx, vy: vy,
          touches: {},
          dragTX: x, dragTY: y,
          grabOff: { x: 0, y: 0 },
          pinch: null,               // { ids: [idA, idB], sides: [0/1 par point] }
          history: [],
          pressStart: 0, pressPos: null, pressMoved: false,
          isSecondTap: false, sipping: false, splitTriggered: false,
          lastReleaseTime: 0, lastNote: 0, noMergeUntil: 0,
          singAmp: 0, charge: 0, tone: null, sipFrom: null,
          phase: Math.random() * 6.28
        };

        var groups = ((1 << group) << 16) | (0xffff & ~(1 << group)); // pas de contact avec ses propres points
        for (var i = 0; i < NODES; i++) {
          var th = (i / NODES) * Math.PI * 2;
          var body = world.createRigidBody(
            RAPIER.RigidBodyDesc.dynamic()
              .setTranslation(x + Math.cos(th) * b.geo.rc, y + Math.sin(th) * b.geo.rc)
              .setLinvel(vx, vy)
              .setLinearDamping(ICE_DAMPING)
              .lockRotations()
              .setCanSleep(false)
              .setCcdEnabled(true)
          );
          var col = world.createCollider(
            RAPIER.ColliderDesc.ball(b.geo.nodeR)
              .setDensity(1)
              .setFriction(BUBBLE_FRICTION)
              .setRestitution(0)
              .setCollisionGroups(groups)
              .setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS),
            body
          );
          nodeOwner.set(col.handle, b);
          b.nodes.push({ body: body, col: col, th: th, x: 0, y: 0, vx: vx, vy: vy });
        }

        bubbles.push(b);
        readNodes(b);
        wake();
        return b;
      }

      function removeBubble(b) {
        var i = bubbles.indexOf(b);
        if (i >= 0) bubbles.splice(i, 1);
        stopTone(b.tone);
        b.tone = null;
        b.nodes.forEach(function (n) { nodeOwner.delete(n.col.handle); world.removeRigidBody(n.body); });
        usedGroups &= ~(1 << b.group);
        pairs.forEach(function (p, key) {
          var ids = key.split(":").map(Number);
          if (ids[0] === b.id || ids[1] === b.id) { if (p.pad) p.pad.forEach(stopTone); pairs.delete(key); }
        });
        Object.keys(pointerOwner).forEach(function (id) { if (pointerOwner[id] === b) delete pointerOwner[id]; });
      }

      // Change la taille de repos : la pression regonfle (ou dégonfle) la
      // bulle en douceur.
      function setRadius(b, r) {
        b.r = clamp(r, MIN_R, maxRadius());
        b.geo = ringGeometry(b.r);
        b.nodes.forEach(function (n) { n.col.setRadius(b.geo.nodeR); });
      }

      function maxRadius() {
        var s = arenaSize();
        return Math.min(s.w, s.h) * 0.42;
      }

      function readNodes(b) {
        var cx = 0, cy = 0, vx = 0, vy = 0;
        b.nodes.forEach(function (n) {
          var t = n.body.translation(), v = n.body.linvel();
          n.x = t.x; n.y = t.y; n.vx = v.x; n.vy = v.y;
          cx += t.x; cy += t.y; vx += v.x; vy += v.y;
        });
        var k = 1 / b.nodes.length;
        b.x = cx * k; b.y = cy * k; b.vx = vx * k; b.vy = vy * k;
      }

      // ---------- Forces internes : ressorts + pression + rond + doigts ----------

      function polygonArea(nodes) {
        var a = 0;
        for (var i = 0; i < nodes.length; i++) {
          var p = nodes[i], q = nodes[(i + 1) % nodes.length];
          a += p.x * q.y - q.x * p.y;
        }
        return a / 2;
      }

      function applyInternal(b) {
        var N = b.nodes.length, g = b.geo;
        var ax = new Array(N).fill(0), ay = new Array(N).fill(0);
        var i, n;

        // Ressorts du contour (point i <-> i+1)
        for (i = 0; i < N; i++) {
          var p = b.nodes[i], q = b.nodes[(i + 1) % N];
          var dx = q.x - p.x, dy = q.y - p.y;
          var d = Math.hypot(dx, dy) || 0.001;
          var ux = dx / d, uy = dy / d;
          var rel = (q.vx - p.vx) * ux + (q.vy - p.vy) * uy;
          var f = K_EDGE * (d - g.edge) + C_EDGE * rel;
          ax[i] += f * ux; ay[i] += f * uy;
          ax[(i + 1) % N] -= f * ux; ay[(i + 1) % N] -= f * uy;
        }

        // Pression : pousse chaque arête vers l'extérieur tant que la surface
        // est plus petite que la surface de repos (et tire si elle est plus grande).
        var area = polygonArea(b.nodes);
        var press = K_PRESS * (g.area - area) / g.area;
        for (i = 0; i < N; i++) {
          var a = b.nodes[i], c = b.nodes[(i + 1) % N];
          var nx = c.y - a.y, ny = -(c.x - a.x); // normale sortante de l'arête
          ax[i] += press * nx * 0.5; ay[i] += press * ny * 0.5;
          ax[(i + 1) % N] += press * nx * 0.5; ay[(i + 1) % N] += press * ny * 0.5;
        }

        // Rappel doux vers le rond, qui tourne avec la bulle (tension de surface)
        var sc = 0, ss = 0;
        for (i = 0; i < N; i++) {
          n = b.nodes[i];
          var rx = n.x - b.x, ry = n.y - b.y;
          var ex = Math.cos(n.th), ey = Math.sin(n.th);
          sc += rx * ex + ry * ey;
          ss += ex * ry - ey * rx;
        }
        var rot = Math.atan2(ss, sc);
        var cr = Math.cos(rot), sr = Math.sin(rot);
        for (i = 0; i < N; i++) {
          n = b.nodes[i];
          var ix = b.x + g.rc * (Math.cos(n.th) * cr - Math.sin(n.th) * sr);
          var iy = b.y + g.rc * (Math.cos(n.th) * sr + Math.sin(n.th) * cr);
          ax[i] += K_SHAPE * (ix - n.x) - C_WOBBLE * (n.vx - b.vx);
          ay[i] += K_SHAPE * (iy - n.y) - C_WOBBLE * (n.vy - b.vy);
        }

        // Doigts : un ressort amorti tire la bulle. À un doigt, un peu plus
        // les points proches de l'endroit saisi (le reste suit avec un léger
        // retard, comme un objet mou). À deux doigts, chaque moitié suit son
        // doigt : la bulle s'étire réellement.
        var ids = Object.keys(b.touches);
        if (ids.length === 1) {
          var s = arenaSize();
          var gx = b.x + b.grabOff.x, gy = b.y + b.grabOff.y;
          var tx = clamp(b.dragTX, b.r + b.grabOff.x, s.w - b.r + b.grabOff.x);
          var ty = clamp(b.dragTY, b.r + b.grabOff.y, s.h - b.r + b.grabOff.y);
          var wSum = 0, w = new Array(N);
          for (i = 0; i < N; i++) {
            var dd = Math.hypot(b.nodes[i].x - gx, b.nodes[i].y - gy) / b.r;
            w[i] = 0.6 + 0.4 * Math.exp(-dd * dd * 1.5);
            wSum += w[i];
          }
          var fx = DRIVE_K * (tx - gx) - DRIVE_C * b.vx;
          var fy = DRIVE_K * (ty - gy) - DRIVE_C * b.vy;
          var fl = Math.hypot(fx, fy);
          if (fl > MAX_DRIVE) { fx *= MAX_DRIVE / fl; fy *= MAX_DRIVE / fl; }
          for (i = 0; i < N; i++) {
            ax[i] += fx * w[i] * N / wSum;
            ay[i] += fy * w[i] * N / wSum;
          }
        } else if (ids.length >= 2 && b.pinch) {
          for (var side = 0; side < 2; side++) {
            var f0 = b.touches[b.pinch.ids[side]];
            if (!f0) continue;
            var cx = 0, cy = 0, cvx = 0, cvy = 0, cnt = 0;
            for (i = 0; i < N; i++) if (b.pinch.sides[i] === side) {
              cx += b.nodes[i].x; cy += b.nodes[i].y; cvx += b.nodes[i].vx; cvy += b.nodes[i].vy; cnt++;
            }
            if (!cnt) continue;
            cx /= cnt; cy /= cnt; cvx /= cnt; cvy /= cnt;
            var px = DRIVE_K * (f0.x - cx) - DRIVE_C * cvx;
            var py = DRIVE_K * (f0.y - cy) - DRIVE_C * cvy;
            var pl = Math.hypot(px, py);
            if (pl > MAX_DRIVE) { px *= MAX_DRIVE / pl; py *= MAX_DRIVE / pl; }
            for (i = 0; i < N; i++) if (b.pinch.sides[i] === side) { ax[i] += px; ay[i] += py; }
          }
        }

        for (i = 0; i < N; i++) {
          n = b.nodes[i];
          var vx = n.vx + ax[i] * STEP, vy = n.vy + ay[i] * STEP;
          var sp = Math.hypot(vx, vy);
          if (sp > MAX_SPEED) { vx *= MAX_SPEED / sp; vy *= MAX_SPEED / sp; }
          n.body.setLinvel({ x: vx, y: vy }, true);
        }
      }

      // ---------- Contacts : notes, nappes, fusion ----------

      function pairKey(a, c) { return Math.min(a.id, c.id) + ":" + Math.max(a.id, c.id); }

      function onContact(h1, h2, started) {
        var a = nodeOwner.get(h1), c = nodeOwner.get(h2);
        if (a && c) {
          if (a === c) return;
          var key = pairKey(a, c);
          var p = pairs.get(key);
          if (started) {
            if (!p) { p = { n: 0, lastNote: 0, start: performance.now(), fast: false, pad: null }; pairs.set(key, p); }
            p.n++;
            if (p.n === 1) {
              // Premier contact : les deux bulles résonnent, chacune sa note
              var speed = Math.hypot(a.vx - c.vx, a.vy - c.vy);
              if (speed > MERGE_SPEED) p.fast = true;
              var gain = clamp(0.03 + speed / 2500, 0.03, 0.16);
              sing(a, gain);
              sing(c, gain * 0.8);
              p.lastNote = performance.now();
            }
          } else if (p) {
            p.n = Math.max(0, p.n - 1);
            if (p.n === 0) { if (p.pad) p.pad.forEach(stopTone); pairs.delete(key); }
          }
          return;
        }
        // Contre un bord : la bulle sonne seule, plus doucement
        var bub = a || c, other = a ? h2 : h1;
        if (bub && started && wallSet.has(other)) {
          var sp = Math.hypot(bub.vx, bub.vy);
          if (sp > 60) sing(bub, clamp(sp / 4000, 0.02, 0.08));
        }
      }

      function bubbleById(id) {
        for (var i = 0; i < bubbles.length; i++) if (bubbles[i].id === id) return bubbles[i];
        return null;
      }

      function isHeld(b) { return Object.keys(b.touches).length > 0; }

      // Musique continue : deux bulles qui restent collées tiennent un
      // accord doux (leurs deux notes) ; les frotter les fait chanter.
      function contactMusic() {
        var now = performance.now();
        var pads = 0;
        pairs.forEach(function (p, key) {
          var ids = key.split(":").map(Number);
          var a = bubbleById(ids[0]), c = bubbleById(ids[1]);
          if (!a || !c) return;
          var rel = Math.hypot(a.vx - c.vx, a.vy - c.vy);
          if (rel > 35 && now - p.lastNote > 320) {
            p.lastNote = now;
            var g = clamp(rel / 5000, 0.015, 0.06);
            sing(a, g);
            sing(c, g * 0.8);
          }
          if (soundOk() && !p.pad && now - p.start > 250 && pads < 5) {
            p.pad = [startTone(noteFor(a.r), 0.014), startTone(noteFor(c.r), 0.012)];
          }
          if (p.pad) {
            pads++;
            tuneTone(p.pad[0], noteFor(a.r), 0);
            tuneTone(p.pad[1], noteFor(c.r), 0);
          }
        });
      }

      // Note tenue quand on tient une bulle ; vibrato quand on la secoue.
      function heldMusic() {
        bubbles.forEach(function (b) {
          if (isHeld(b) && soundOk()) {
            if (!b.tone) b.tone = startTone(noteFor(b.r), 0.018);
            var wob = 0;
            b.nodes.forEach(function (n) { wob += Math.hypot(n.vx - b.vx, n.vy - b.vy); });
            wob /= b.nodes.length;
            tuneTone(b.tone, noteFor(b.r), clamp(wob / 4000 + Math.hypot(b.vx, b.vy) / 40000, 0.001, 0.015));
            b.singAmp = Math.max(b.singAmp, 0.25);
          } else if (b.tone) {
            stopTone(b.tone);
            b.tone = null;
          }
        });
      }

      // Comme deux gouttes d'eau : deux bulles qui se cognent assez vite, ou
      // qui restent collées un moment, ne font plus qu'une. Pas besoin de
      // geste. (Sauf pendant une aspiration, et juste après une coupe.)
      function checkMerges() {
        var now = performance.now();
        var todo = [];
        pairs.forEach(function (p, key) {
          var ids = key.split(":").map(Number);
          var a = bubbleById(ids[0]), c = bubbleById(ids[1]);
          if (!a || !c || a.sipping || c.sipping) return;
          if (now < a.noMergeUntil || now < c.noMergeUntil) { p.start = now; p.fast = false; return; }
          if (p.fast || now - p.start > MERGE_CONTACT_MS) todo.push([a, c]);
        });
        todo.forEach(function (pair) {
          if (bubbles.indexOf(pair[0]) >= 0 && bubbles.indexOf(pair[1]) >= 0) mergeBubbles(pair[0], pair[1]);
        });
      }

      // Fusion : une seule bulle, surface = somme des deux (le volume se
      // conserve), au centre de gravité, avec l'élan des deux. Les doigts qui
      // tenaient l'une ou l'autre tiennent la nouvelle.
      function mergeBubbles(a, c) {
        var A = a.r * a.r + c.r * c.r;
        var r = Math.sqrt(A);
        if (r > maxRadius()) return;
        var wa = a.r * a.r / A, wc = c.r * c.r / A;
        var x = a.x * wa + c.x * wc, y = a.y * wa + c.y * wc;
        var vx = a.vx * wa + c.vx * wc, vy = a.vy * wa + c.vy * wc;
        var touches = {};
        [a, c].forEach(function (o) { Object.keys(o.touches).forEach(function (id) { touches[id] = o.touches[id]; }); });
        var ax = a.x, ay = a.y, cx = c.x, cy = c.y;
        removeBubble(a);
        removeBubble(c);
        var m = spawnBubble(x, y, r, vx, vy);
        if (!m) return;
        adoptTouches(m, touches);
        m.noMergeUntil = performance.now() + 250;
        sing(m, 0.18);
        addRing(m.x, m.y, m.r);
        addBridge(ax, ay, cx, cy, Math.min(a.r, c.r) * 0.7, "merge");
        addSplash(x, y, m.r, 10);
      }

      function adoptTouches(b, touches) {
        var ids = Object.keys(touches);
        ids.forEach(function (id) {
          pointerOwner[id] = b;
          b.touches[id] = touches[id];
        });
        if (ids.length === 1) {
          var t = touches[ids[0]];
          b.dragTX = t.x; b.dragTY = t.y;
          b.grabOff = { x: t.x - b.x, y: t.y - b.y };
          b.pressMoved = true;
          b.history = [];
        } else if (ids.length >= 2) {
          startPinch(b);
        }
      }

      // Coupe la bulle en deux moitiés de même surface (volume conservé),
      // chacune au centre de sa moitié, avec la vitesse de sa moitié.
      function splitBubble(b, sides, pushX, pushY) {
        var r2 = b.r / Math.SQRT2;
        if (r2 < MIN_R || bubbles.length >= MAX_BUBBLES) return null;
        var halves = [0, 1].map(function (side) {
          var cx = 0, cy = 0, vx = 0, vy = 0, n = 0;
          b.nodes.forEach(function (node, i) {
            if (sides[i] !== side) return;
            cx += node.x; cy += node.y; vx += node.vx; vy += node.vy; n++;
          });
          n = n || 1;
          return { x: cx / n, y: cy / n, vx: vx / n, vy: vy / n };
        });
        // écarte les centres pour que les deux moitiés ne se chevauchent pas
        var dx = halves[1].x - halves[0].x, dy = halves[1].y - halves[0].y;
        var d = Math.hypot(dx, dy) || 1;
        var need = 2 * r2 + 2;
        if (d < need) {
          var mx = (halves[0].x + halves[1].x) / 2, my = (halves[0].y + halves[1].y) / 2;
          halves[0].x = mx - dx / d * need / 2; halves[0].y = my - dy / d * need / 2;
          halves[1].x = mx + dx / d * need / 2; halves[1].y = my + dy / d * need / 2;
        }
        var ox = b.x, oy = b.y;
        removeBubble(b);
        addBridge(halves[0].x, halves[0].y, halves[1].x, halves[1].y, r2 * 0.7, "split");
        addSplash(ox, oy, r2, 12);
        return halves.map(function (h, k) {
          var sgn = k === 0 ? -1 : 1;
          var nb = spawnBubble(h.x, h.y, r2, h.vx + sgn * (pushX || 0), h.vy + sgn * (pushY || 0));
          if (nb) { nb.noMergeUntil = performance.now() + SPLIT_COOLDOWN_MS; sing(nb, 0.13); addRing(nb.x, nb.y, nb.r); }
          return nb;
        });
      }

      // ---------- Aspirer : une bulle boit le volume d'une voisine ----------

      function neighbourFor(b) {
        var best = null, bestD = Infinity;
        bubbles.forEach(function (o) {
          if (o === b) return;
          var gap = Math.hypot(o.x - b.x, o.y - b.y) - o.r - b.r;
          var touching = pairs.has(pairKey(b, o)) || gap < b.r * SIP_REACH;
          if (touching && gap < bestD) { best = o; bestD = gap; }
        });
        return best;
      }

      // Transfère une surface de « from » vers « to ». Si « from » devient
      // trop petite, elle est bue entièrement et disparaît.
      function transfer(to, from, dA) {
        var room = maxRadius() * maxRadius() - to.r * to.r;
        dA = Math.min(dA, room, from.r * from.r);
        if (dA <= 0) return false;
        var left = from.r * from.r - dA;
        if (left < MIN_R * MIN_R * 1.2) {
          // bue jusqu'au bout
          var all = from.r * from.r;
          if (all > room) return false;
          var fx = from.x, fy = from.y;
          removeBubble(from);
          setRadius(to, Math.sqrt(to.r * to.r + all));
          addSplash(fx, fy, MIN_R * 1.5, 8);
          playNote(noteFor(MIN_R) * 1.5, 0.08);
          sing(to, 0.12);
          return true;
        }
        setRadius(from, Math.sqrt(left));
        setRadius(to, Math.sqrt(to.r * to.r + dA));
        return true;
      }

      function sipOnce(b) {
        var o = neighbourFor(b);
        if (!o) { b.singAmp = Math.max(b.singAmp, 0.3); return; }
        transfer(b, o, o.r * o.r * SIP_SHARE);
        addBridge(o.x, o.y, b.x, b.y, Math.min(o.r, b.r) * 0.35, "sip");
        sing(b, 0.14);
        addRing(b.x, b.y, b.r);
      }

      function sipContinuous(b, dt) {
        var o = neighbourFor(b);
        b.sipFrom = o;
        if (!o) return;
        transfer(b, o, SIP_RATE * b.r * b.r * dt);
      }

      // ---------- Effets : anneau, pont de matière, éclaboussure ----------

      function addRing(x, y, r) { effects.push({ kind: "ring", x: x, y: y, r: r, t: 0, life: 0.5 }); wake(); }

      function addBridge(x1, y1, x2, y2, w, mode) {
        effects.push({ kind: "bridge", x1: x1, y1: y1, x2: x2, y2: y2, w: w, mode: mode, t: 0, life: 0.35 });
        wake();
      }

      function addSplash(x, y, r, n) {
        for (var i = 0; i < n; i++) {
          var a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 180;
          effects.push({ kind: "drop", x: x + Math.cos(a) * r * 0.8, y: y + Math.sin(a) * r * 0.8,
                         vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: 1.5 + Math.random() * 2.5, t: 0, life: 0.45 + Math.random() * 0.25 });
        }
        wake();
      }

      // ---------- Dessin (canvas, persistance phosphore) ----------

      function outline(b, time) {
        var N = b.nodes.length, nr = b.geo.nodeR;
        var pts = [];
        var k = Math.max(2, Math.round(noteFor(b.r) / 70)); // plus aiguë = ondule plus serré
        var vib = b.singAmp * b.r * 0.06;
        for (var i = 0; i < N; i++) {
          var p = b.nodes[(i + N - 1) % N], c = b.nodes[i], q = b.nodes[(i + 1) % N];
          var tx = q.x - p.x, ty = q.y - p.y;
          var tl = Math.hypot(tx, ty) || 1;
          // décalé vers l'extérieur du rayon des points : le trait = le bord réel,
          // plus une vibration quand la bulle chante
          var off = nr + vib * Math.sin(k * c.th + time * 18 + b.phase);
          pts.push({ x: c.x + (ty / tl) * off, y: c.y - (tx / tl) * off });
        }
        return pts;
      }

      function tracePath(pts) {
        var N = pts.length;
        ctx.beginPath();
        var last = pts[N - 1];
        ctx.moveTo((last.x + pts[0].x) / 2, (last.y + pts[0].y) / 2);
        for (var i = 0; i < N; i++) {
          var a = pts[i], z = pts[(i + 1) % N];
          ctx.quadraticCurveTo(a.x, a.y, (a.x + z.x) / 2, (a.y + z.y) / 2);
        }
        ctx.closePath();
      }

      function render(dt, time) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // Persistance phosphore : l'image précédente s'efface lentement au
        // lieu de disparaître d'un coup — le tracé laisse une traînée.
        ctx.globalCompositeOperation = "destination-out";
        ctx.fillStyle = "rgba(0,0,0," + (reduced ? 1 : 0.3) + ")";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = "source-over";
        ctx.lineJoin = "round";

        bubbles.forEach(function (b) {
          var pts = outline(b, time);
          var col = isHeld(b) ? ACCENT : INK;

          // Onde à l'intérieur : une sinusoïde à la fréquence (visuelle) de
          // sa note, qui s'anime quand la bulle chante.
          ctx.save();
          tracePath(pts);
          ctx.clip();
          var cycles = clamp(noteFor(b.r) / 90, 1.2, 7);
          var amp = b.r * (0.06 + 0.22 * b.singAmp);
          ctx.beginPath();
          for (var x = -b.r; x <= b.r; x += 3) {
            var y = Math.sin((x / (2 * b.r)) * cycles * Math.PI * 2 + time * 6 + b.phase) * amp;
            if (x === -b.r) ctx.moveTo(b.x + x, b.y + y); else ctx.lineTo(b.x + x, b.y + y);
          }
          ctx.strokeStyle = col;
          ctx.globalAlpha = 0.35 + 0.5 * b.singAmp;
          ctx.lineWidth = 1.2;
          ctx.stroke();
          ctx.restore();

          // Contour : halo large et pâle + trait fin
          tracePath(pts);
          ctx.strokeStyle = col;
          ctx.globalAlpha = 0.18;
          ctx.lineWidth = 6;
          ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.lineWidth = 2;
          ctx.stroke();

          // Maintien pour couper : un cercle qui grandit au centre
          if (b.charge > 0) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, Math.max(1, b.r * 0.85 * b.charge), 0, Math.PI * 2);
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }

          // Aspiration en cours : un filet de matière vers la voisine
          if (b.sipping && b.sipFrom && bubbles.indexOf(b.sipFrom) >= 0) {
            var o = b.sipFrom;
            ctx.beginPath();
            ctx.moveTo(o.x, o.y);
            var mx = (o.x + b.x) / 2 + Math.sin(time * 20) * 4, my = (o.y + b.y) / 2 + Math.cos(time * 20) * 4;
            ctx.quadraticCurveTo(mx, my, b.x, b.y);
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 1.5 + Math.min(o.r, b.r) * 0.08;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        });

        // Effets
        effects = effects.filter(function (e) {
          e.t += dt;
          var k = e.t / e.life;
          if (k >= 1) return false;
          ctx.strokeStyle = INK;
          ctx.fillStyle = INK;
          if (e.kind === "ring") {
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.r * (1 + 0.6 * k), 0, Math.PI * 2);
            ctx.globalAlpha = 0.6 * (1 - k);
            ctx.lineWidth = 2;
            ctx.stroke();
          } else if (e.kind === "bridge") {
            // coupe : le filament s'amincit puis casse au milieu ;
            // fusion / aspiration : il s'épaissit puis se résorbe
            var w = e.mode === "split" ? e.w * (1 - k) : e.w * Math.sin(k * Math.PI);
            var gap = e.mode === "split" ? k * 0.5 : 0;
            ctx.globalAlpha = 0.8 * (1 - k * 0.6);
            ctx.lineWidth = Math.max(1, w * 0.4);
            ctx.lineCap = "round";
            var mx = (e.x1 + e.x2) / 2, my = (e.y1 + e.y2) / 2;
            ctx.beginPath();
            ctx.moveTo(e.x1, e.y1);
            ctx.lineTo(mx + (e.x1 - mx) * gap, my + (e.y1 - my) * gap);
            ctx.moveTo(e.x2, e.y2);
            ctx.lineTo(mx + (e.x2 - mx) * gap, my + (e.y2 - my) * gap);
            ctx.stroke();
            ctx.lineCap = "butt";
          } else if (e.kind === "drop") {
            e.x += e.vx * dt; e.y += e.vy * dt;
            e.vx *= 0.9; e.vy *= 0.9;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.s * (1 - k * 0.5), 0, Math.PI * 2);
            ctx.globalAlpha = 1 - k;
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
          return true;
        });
      }

      // Image nette (sans traînée) : quand l'animation s'arrête au repos
      function renderClean(time) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        render(0, time);
      }

      // ---------- Pointeur : glisser / pincer / tap / maintien ----------

      function localPos(ev) {
        var rect = arena.getBoundingClientRect();
        return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
      }

      function inside(b, p) {
        // point dans le contour (points + leur rayon), test par rayons croisés
        var nodes = b.nodes, N = nodes.length, hit = false;
        for (var i = 0, j = N - 1; i < N; j = i++) {
          var a = nodes[i], c = nodes[j];
          if (((a.y > p.y) !== (c.y > p.y)) && (p.x < (c.x - a.x) * (p.y - a.y) / (c.y - a.y) + a.x)) hit = !hit;
        }
        return hit || Math.hypot(p.x - b.x, p.y - b.y) < b.r;
      }

      function startPinch(b) {
        var ids = Object.keys(b.touches).slice(0, 2);
        var A = b.touches[ids[0]], C = b.touches[ids[1]];
        var ax = C.x - A.x, ay = C.y - A.y;
        var mx = (A.x + C.x) / 2, my = (A.y + C.y) / 2;
        b.pinch = {
          ids: ids,
          sides: b.nodes.map(function (n) { return ((n.x - mx) * ax + (n.y - my) * ay) < 0 ? 0 : 1; })
        };
        b.pressStart = 0;
        b.charge = 0;
      }

      arena.addEventListener("pointerdown", function (ev) {
        var p = localPos(ev);
        var hit = null, best = Infinity;
        bubbles.forEach(function (o) {
          var d = Math.hypot(p.x - o.x, p.y - o.y);
          if (inside(o, p) && d < best) { hit = o; best = d; }
        });
        // Deuxième doigt posé à côté d'une bulle déjà tenue : on le rattache
        // quand même à elle pour pincer.
        if (!hit) {
          bubbles.forEach(function (o) {
            if (Object.keys(o.touches).length !== 1) return;
            var d = Math.hypot(p.x - o.x, p.y - o.y);
            if (d < o.r * 3.5 && d < best) { hit = o; best = d; }
          });
        }
        initAudio();
        if (!hit) return;
        try { arena.setPointerCapture(ev.pointerId); } catch (e) {}
        pointerOwner[ev.pointerId] = hit;
        onDown(ev, hit, p);
      });
      arena.addEventListener("pointermove", function (ev) {
        var b = pointerOwner[ev.pointerId];
        if (b) onMove(ev, b, localPos(ev));
      });
      function release(ev) {
        var b = pointerOwner[ev.pointerId];
        delete pointerOwner[ev.pointerId];
        if (b) onUp(ev, b);
      }
      arena.addEventListener("pointerup", release);
      arena.addEventListener("pointercancel", release);

      function onDown(ev, b, p) {
        wake();
        ev.preventDefault();
        b.touches[ev.pointerId] = p;

        var count = Object.keys(b.touches).length;
        if (count === 1) {
          var now = performance.now();
          b.dragTX = p.x; b.dragTY = p.y;
          b.grabOff = { x: p.x - b.x, y: p.y - b.y };
          b.history = [{ t: now, x: p.x, y: p.y }];
          b.pressStart = now;
          b.pressPos = p;
          b.pressMoved = false;
          b.splitTriggered = false;
          b.sipping = false;
          // Double-tap bref (une gorgée) ou maintenu (aspire en continu) :
          // ça se tranche à la relâche, ou dans la boucle.
          b.isSecondTap = (now - b.lastReleaseTime) < DOUBLE_TAP_MS;
          sing(b, 0.06);
        } else if (count === 2) {
          startPinch(b);
        }
      }

      function onMove(ev, b, p) {
        if (!b.touches[ev.pointerId]) return;
        b.touches[ev.pointerId] = p;
        var ids = Object.keys(b.touches);

        if (ids.length === 1) {
          b.dragTX = p.x; b.dragTY = p.y;
          var now = performance.now();
          b.history.push({ t: now, x: p.x, y: p.y });
          while (b.history.length > 8) b.history.shift();
          if (!b.pressMoved && b.pressPos && Math.hypot(p.x - b.pressPos.x, p.y - b.pressPos.y) > JITTER_PX) {
            b.pressMoved = true;
          }
        } else if (ids.length >= 2 && b.pinch) {
          var A = b.touches[b.pinch.ids[0]], C = b.touches[b.pinch.ids[1]];
          if (A && C && Math.hypot(C.x - A.x, C.y - A.y) > b.r * SPLIT_STRETCH * 2) {
            // La bulle cède : chaque moitié reste sous son doigt
            var halves = splitBubble(b, b.pinch.sides, 0, 0);
            if (halves) {
              var t0 = {}, t1 = {};
              t0[b.pinch.ids[0]] = A;
              t1[b.pinch.ids[1]] = C;
              if (halves[0]) adoptTouches(halves[0], t0);
              if (halves[1]) adoptTouches(halves[1], t1);
            }
          }
        }
      }

      function onUp(ev, b) {
        if (!b.touches[ev.pointerId]) return;
        delete b.touches[ev.pointerId];
        var ids = Object.keys(b.touches);
        var now = performance.now();

        if (ids.length === 0) {
          b.charge = 0;
          b.pinch = null;
          var held = b.pressStart ? now - b.pressStart : 999;
          var quickTap = b.pressStart && !b.pressMoved && held < TAP_MAX_MS && !b.splitTriggered && !b.sipping;

          // Vitesse de lâcher : mesurée sur les derniers points du geste, pas
          // juste la dernière image — le geste garde son élan. Les
          // tremblements internes de la bulle sont conservés.
          if (b.history.length >= 2) {
            var first = b.history[0], last = b.history[b.history.length - 1];
            var dt = Math.max(16, last.t - first.t) / 1000;
            var vx = clamp((last.x - first.x) / dt, -900, 900);
            var vy = clamp((last.y - first.y) / dt, -900, 900);
            b.nodes.forEach(function (n) {
              n.body.setLinvel({ x: n.vx - b.vx + vx, y: n.vy - b.vy + vy }, true);
            });
          }

          if (b.sipping) {
            b.lastReleaseTime = 0;
          } else if (quickTap) {
            if (b.isSecondTap) {
              sipOnce(b);
              b.lastReleaseTime = 0;
            } else {
              b.lastReleaseTime = now;
            }
          } else {
            b.lastReleaseTime = 0;
          }
          b.sipping = false;
          b.sipFrom = null;
          b.pressStart = 0;
        } else if (ids.length === 1) {
          b.pinch = null;
          var rest = b.touches[ids[0]];
          b.dragTX = rest.x; b.dragTY = rest.y;
          b.grabOff = { x: rest.x - b.x, y: rest.y - b.y };
        }
      }

      // Appui simple maintenu sans bouger : la bulle se coupe en deux le long
      // d'un axe au hasard, les deux moitiés s'écartent doucement.
      function splitInPlace(b) {
        b.splitTriggered = true;
        var ang = Math.random() * Math.PI;
        var ux = Math.cos(ang), uy = Math.sin(ang);
        var sides = b.nodes.map(function (n) { return ((n.x - b.x) * ux + (n.y - b.y) * uy) < 0 ? 0 : 1; });
        b.touches = {};
        splitBubble(b, sides, ux * 70, uy * 70);
      }

      // ---------- Boucle ----------

      // Deux gouttes presque en contact s'attirent (tension de surface) :
      // même lentement, elles finissent par se coller puis fusionner.
      function cohesion() {
        var now = performance.now();
        for (var i = 0; i < bubbles.length; i++) {
          for (var j = i + 1; j < bubbles.length; j++) {
            var a = bubbles[i], c = bubbles[j];
            if (now < a.noMergeUntil || now < c.noMergeUntil || a.sipping || c.sipping) continue;
            var dx = c.x - a.x, dy = c.y - a.y;
            var d = Math.hypot(dx, dy) || 1;
            var gap = d - a.r - c.r;
            if (gap > COHESION_RANGE) continue;
            var k = COHESION * STEP * (1 - Math.max(0, gap) / COHESION_RANGE);
            var ux = dx / d * k, uy = dy / d * k;
            a.nodes.forEach(function (n) { var v = n.body.linvel(); n.body.setLinvel({ x: v.x + ux, y: v.y + uy }, true); });
            c.nodes.forEach(function (n) { var v = n.body.linvel(); n.body.setLinvel({ x: v.x - ux, y: v.y - uy }, true); });
          }
        }
      }

      function stepPhysics(dt) {
        accumulator = Math.min(accumulator + dt, STEP * 4);
        while (accumulator >= STEP) {
          bubbles.forEach(function (b) { readNodes(b); applyInternal(b); });
          cohesion();
          world.step(events);
          accumulator -= STEP;
          events.drainCollisionEvents(onContact);
        }
        var s = arenaSize();
        bubbles.forEach(function (b) {
          readNodes(b);
          // Filet de sécurité (redimensionnement) : jamais hors de l'écran
          var ox = clamp(b.x, b.r, s.w - b.r) - b.x, oy = clamp(b.y, b.r, s.h - b.r) - b.y;
          if (Math.abs(ox) > b.r || Math.abs(oy) > b.r) {
            b.nodes.forEach(function (n) { n.body.setTranslation({ x: n.x + ox, y: n.y + oy }, true); });
            readNodes(b);
          }
        });
      }

      function update(dt, time) {
        stepPhysics(dt);
        checkMerges();
        contactMusic();
        heldMusic();

        bubbles.slice().forEach(function (b) {
          if (bubbles.indexOf(b) < 0) return;
          b.singAmp *= Math.max(0, 1 - dt * 3);
          if (b.pressStart && Object.keys(b.touches).length === 1 && !b.pressMoved) {
            var held = performance.now() - b.pressStart;
            if (b.isSecondTap) {
              // Passé le seuil d'un tap franc sans relâcher : double-tap
              // maintenu, la bulle aspire en continu sa voisine.
              if (held > TAP_MAX_MS) b.sipping = true;
              if (b.sipping) sipContinuous(b, dt);
              b.charge = 0;
            } else {
              b.charge = clamp(held / SPLIT_HOLD_MS, 0.05, 1);
              if (held > SPLIT_HOLD_MS && !b.splitTriggered) splitInPlace(b);
            }
          } else {
            b.charge = 0;
          }
        });
        render(dt, time);
      }

      // Batterie : la boucle s'arrête quand plus rien ne bouge (ou que
      // l'appli passe en arrière-plan) et repart au premier toucher, à un
      // son ou au retour sur l'appli. La pulsation continue, elle, en fond.
      var looping = false;
      var restSince = 0;

      function atRest() {
        if (effects.length) return false;
        return bubbles.every(function (b) {
          if (isHeld(b) || b.singAmp > 0.02) return false;
          if (Math.hypot(b.vx, b.vy) > 4) return false;
          return b.nodes.every(function (n) { return Math.hypot(n.vx - b.vx, n.vy - b.vy) < 4; });
        });
      }

      function wake() {
        if (looping || document.hidden) return;
        looping = true;
        restSince = 0;
        accumulator = 0;
        requestAnimationFrame(function (t) { lastTime = t; requestAnimationFrame(loop); });
      }

      function loop(time) {
        if (document.hidden) { looping = false; return; }
        if (time - lastSave > 2000) { lastSave = time; save(); }
        var dt = Math.min(0.05, (time - lastTime) / 1000 || 0);
        lastTime = time;
        update(dt, time / 1000);
        if (atRest()) {
          if (!restSince) restSince = time;
          else if (time - restSince > 1500) {
            bubbles.forEach(function (b) { b.nodes.forEach(function (n) { n.body.setLinvel({ x: 0, y: 0 }, true); }); });
            renderClean(time / 1000);
            save();
            looping = false;
            return;
          }
        } else {
          restSince = 0;
        }
        requestAnimationFrame(loop);
      }

      // ---------- Menu ⓘ : portfolio, langue, son, historique ----------

      var VERSIONS = [
        { v: "v9",

      var menu = document.getElementById("menu");
      var histList = document.getElementById("histList");

      function renderHistory() {
        histList.textContent = "";
        VERSIONS.forEach(function (entry) {
          var li = document.createElement("li");
          var bEl = document.createElement("b");
          bEl.textContent = entry.v;
          li.appendChild(bEl);
          li.appendChild(document.createTextNode(entry[lang]));
          histList.appendChild(li);
        });
      }
      renderHistory();

      document.getElementById("infoBtn").addEventListener("click", function () { menu.hidden = false; });
      document.getElementById("menuClose").addEventListener("click", function () { menu.hidden = true; });
      document.getElementById("langBtn").addEventListener("click", function () {
        lang = lang === "fr" ? "en" : "fr";
        try { localStorage.setItem("bulles-sonores-lang", lang); } catch (e) {}
        applyTexts();
        renderHistory();
      });
      document.getElementById("muteBtn").addEventListener("click", function () {
        muted = !muted;
        try { localStorage.setItem("bulles-sonores-muted", muted ? "1" : "0"); } catch (e) {}
        applyTexts();
        initAudio();
        window.onMuteChange();
      });

      window.addEventListener("resize", function () {
        // Quitter l'appli redimensionne l'écran sur iPhone : les bulles se
        // retrouvent collées d'un coup — pas de rafale de sons.
        quietUntil = performance.now() + 800;
        fitCanvas();
        buildWalls();
        wake();
      });

      // Écran figé façon application : iOS ignore user-scalable=no pour le
      // pincement, et tirer la page ferait rebondir l'écran.
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
        document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
      });
      // Loupe iOS au double-tap (et appui long) : seul un preventDefault sur
      // les événements tactiles bruts l'empêche vraiment. Les événements
      // pointer, eux, continuent d'arriver : tous les gestes restent.
      ["touchstart", "touchend"].forEach(function (type) {
        arena.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
      });
      arena.addEventListener("dblclick", function (e) { e.preventDefault(); });
      arena.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      document.addEventListener("touchmove", function (e) {
        if (e.target.closest && e.target.closest(".hist-list")) return; // la liste d'historique défile
        e.preventDefault();
      }, { passive: false });

      // ---------- Démarrage ----------
      // Pas d'écran d'accueil : ça commence tout de suite. Des bulles de
      // tailles variées (donc des notes variées), et plus jamais de nouvelle
      // bulle tombée du ciel : tout vient de celles-là.

      // Sonde en lecture seule pour les tests automatiques (Playwright)
      window.__bulles = function () {
        return bubbles.map(function (b) { return { x: b.x, y: b.y, r: b.r, held: isHeld(b), touches: Object.keys(b.touches).length, pinch: !!b.pinch }; });
      };

      fitCanvas();
      buildWalls();
      // Sauvegarde locale de la partie (positions et tailles), pour qu'un
      // rechargement — mise à jour, iOS qui libère la mémoire, appli fermée —
      // ne remette pas tout à zéro. Relue avec méfiance : que des nombres
      // bornés, jamais interprétés autrement (REGLES-JEUX.md, sécurité).
      var SAVE_KEY = "bulles-sonores-etat";
      var lastSave = 0;
      function save() {
        var s = arenaSize();
        if (!s.w || !s.h) return;
        var data = { v: 1, b: bubbles.map(function (b) {
          return [+(b.x / s.w).toFixed(4), +(b.y / s.h).toFixed(4), +b.r.toFixed(2)];
        }) };
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
      }
      window.__bullesSave = save;
      function restore() {
        var raw = null;
        try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
        if (!raw || raw.length > 4000) return false;
        var data;
        try { data = JSON.parse(raw); } catch (e) { return false; }
        if (!data || data.v !== 1 || !Array.isArray(data.b) || !data.b.length || data.b.length > MAX_BUBBLES) return false;
        var s = arenaSize();
        var list = [];
        for (var i = 0; i < data.b.length; i++) {
          var e = data.b[i];
          if (!Array.isArray(e) || e.length !== 3) return false;
          var fx = Number(e[0]), fy = Number(e[1]), r = Number(e[2]);
          if (!isFinite(fx) || !isFinite(fy) || !isFinite(r)) return false;
          list.push([clamp(fx, 0, 1) * s.w, clamp(fy, 0, 1) * s.h, clamp(r, MIN_R, maxRadius())]);
        }
        list.forEach(function (e) {
          spawnBubble(clamp(e[0], e[2], s.w - e[2]), clamp(e[1], e[2], s.h - e[2]), e[2], 0, 0);
        });
        return bubbles.length > 0;
      }
      document.addEventListener("visibilitychange", function () { if (document.hidden) save(); });
      window.addEventListener("pagehide", save);

      if (!restore()) (function () {
        var s = arenaSize();
        var unit = clamp(Math.sqrt((s.w * s.h) / (5 * Math.PI)) * 0.4, 26, 40); // taille moyenne selon l'écran
        var count = 4 + Math.floor(Math.random() * 4);
        for (var i = 0; i < count; i++) {
          spawnBubble(undefined, undefined, clamp(unit * (0.6 + Math.random() * 0.75), 18, 52));
        }
      })();
      wake();
    })();
  </script>


  <script>
    // Mise à jour automatique (même principe que la page d'accueil du
    // portfolio) : aucune partie n'est sauvegardée entre les sessions ici,
    // donc rien à perdre en rechargeant dès qu'une nouvelle version est en
    // ligne. Le paramètre anti-cache dans l'URL de vérification est
    // nécessaire : un simple `cache: 'no-store'` n'empêche que la mise en
    // cache locale du navigateur, pas celle du CDN devant GitHub Pages, qui
    // peut renvoyer une réponse périmée même à une requête "no-store".
    // Installable (PWA) : manifeste + service worker « réseau d'abord »,
    // comme pas-a-pas/ — la mise à jour automatique ci-dessous reste maître.
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }

    (function () {
      var PAGE = "bulles-sonores";
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return; // évite les rafales de clics
        lastCheck = now0;
        try {
          var url = (location.pathname || "index.html") + "?_cb=" + now0;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          // Empreinte du contenu, pas l'ETag : les serveurs de GitHub Pages
          // ne donnent pas tous le même ETag pour la même page, ce qui
          // rechargeait l'appli en pleine partie sans raison.
          var text = await res.text();
          var h = 2166136261;
          for (var i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
          var tag = "h" + (h >>> 0).toString(36) + "-" + text.length;
          var key = "pm_pageHash_" + PAGE;
          var stored = localStorage.getItem(key);
          if (stored === null) { localStorage.setItem(key, tag); return; }
          if (tag !== stored) {
            var now = Date.now();
            var guard = "pm_lastUpdateReload_" + PAGE;
            var lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem(guard)) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try {
              localStorage.setItem(key, tag);
              sessionStorage.setItem(guard, String(now));
            } catch (e) {}
            if (window.__bullesSave) window.__bullesSave(); // la partie survit à la mise à jour
            location.replace(location.pathname + "?_r=" + now);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      // Un clic ou un toucher, même en pleine session, redéclenche la
      // vérification — plus besoin de fermer/rouvrir l'appli pour voir
      // une mise à jour.
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>

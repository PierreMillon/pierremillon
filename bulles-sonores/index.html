<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>Bulles Sonores</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Oscilloscope / vieux moniteur — palette fixe, jamais d'ivoire ici
       (voir REGLES-JEUX.md : esthétique par défaut du catalogue) */
    :root {
      --bg: #05100a;
      --bg-soft: #0a1a12;
      --ink: #3be08a;
      --ink-soft: #2a8f5c;
      --hairline: #123322;
      --accent: #6dffb0;
      --accent-soft: rgba(61, 224, 138, 0.16);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    /* Pas une fenêtre qui représente un oscilloscope : tout l'écran EST
       l'oscilloscope. Le fond, c'est directement l'arène, plein cadre. */
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: 1rem 16px 0;
    }

    header {
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .back {
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .back:hover { color: var(--accent); }

    .subline {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-top: 0.3rem;
    }

    .hist-btn {
      font-family: inherit;
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .hist-btn:hover { color: var(--accent); }

    .hist-list {
      width: 100%;
      max-width: 22rem;
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
    }

    .hist-list li {
      padding: 0.7rem 0;
      border-top: 1px solid var(--hairline);
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--ink-soft);
    }

    .hist-list li:last-child { border-bottom: 1px solid var(--hairline); }

    .hist-list b {
      display: block;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 0.1rem;
    }

    h1 {
      margin: 0;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 300;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      letter-spacing: 0.06em;
    }

    .styles {
      width: 100%;
      display: flex;
      gap: 0.4rem;
      margin: 0.8rem 0 0;
    }

    .style-btn {
      flex: 1;
      font-family: inherit;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.5rem 0.3rem;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    .style-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); }

    .arena {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      touch-action: none;
    }

    .arena::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--hairline) 1px, transparent 1px),
        linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.3;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      padding: 0;
      margin: 0;
      cursor: grab;
      touch-action: none;
      will-change: transform;
      background: var(--c);
      border: 2px solid var(--ink);
    }

    .bubble.dragging { cursor: grabbing; z-index: 5; }

    .bubble.spawn { animation: spawnIn 0.35s cubic-bezier(.3, 1.4, .5, 1) both; }
    @keyframes spawnIn { from { opacity: 0; } to { opacity: 1; } }

    /* Style « Gel mou » : remplissage plein, se déforme et reste mou au contact */
    .arena[data-style="gel"] .bubble { box-shadow: inset 0 -6px 10px rgba(0,0,0,0.08); }

    /* Style « Bulle de savon » : membrane fine, vibre, irise */
    .arena[data-style="soap"] .bubble {
      background: radial-gradient(circle at 34% 30%, rgba(160,255,210,0.55), transparent 45%), var(--c);
      opacity: 0.72;
      border-width: 1.5px;
    }

    /* Style « Rebond simple » : plein et net, rebondit sans rester déformé */
    .arena[data-style="bounce"] .bubble { box-shadow: none; }

    /* Style « Oscilloscope » : contour seul, sans remplissage — la page
       entière est déjà noir/vert phosphore (voir REGLES-JEUX.md), ce style
       ne change que le tracé, pas la couleur */
    .arena[data-style="wire"] .bubble {
      background: transparent;
      box-shadow: 0 0 7px rgba(61, 224, 138, 0.5), inset 0 0 7px rgba(61, 224, 138, 0.22);
    }

    .charge-ring {
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      opacity: 0;
      transform: scale(0.3);
      transition: opacity 0.08s linear;
    }

    .bubble.charging .charge-ring { opacity: 0.55; }

    .particle {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    .ring {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      border: 2px solid var(--ink);
      pointer-events: none;
      opacity: 0.7;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
      background: rgba(5, 16, 10, 0.94);
      z-index: 6;
    }

    .overlay[hidden] { display: none; }

    .overlay p {
      margin: 0;
      max-width: 22rem;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--ink-soft);
    }

    .overlay .big {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 300;
      font-size: 1.8rem;
      color: var(--ink);
    }

    .btn {
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
    }

    .hint {
      margin-top: 0.8rem;
      font-size: 0.68rem;
      color: var(--ink-soft);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="arena" id="arena" data-style="wire"></div>

  <div class="topbar">
    <header>
      <a class="back" href="../">← Portfolio</a>
      <h1>Bulles Sonores</h1>
    </header>

    <div class="subline">
      <button class="hist-btn" id="histBtn">Historique</button>
    </div>

    <div class="styles" id="styles" role="tablist" aria-label="Style visuel"></div>
  </div>

  <div class="overlay" id="histOverlay" hidden>
    <div class="big">Historique</div>
    <ul class="hist-list" id="histList"></ul>
    <button class="btn" id="histClose">Fermer</button>
  </div>

  <script>
    (function () {
      // Physique maison (pas de librairie externe — comme les autres jeux
      // du catalogue) : glissé "sur glace" via un amortissement exponentiel
      // faible, collisions cercle-cercle classiques, tout recalculé chaque
      // image à partir des positions/rayons courants.

      // ---------- Réglages ----------

      var TARGET_COUNT = 5;
      var MAX_COUNT = 8;
      var RESPAWN_DELAY = [900, 2200]; // ms, borne min/max
      var SPLIT_HOLD_MS = 650;   // appui simple maintenu -> la bulle se coupe en deux
      var DOUBLE_TAP_MS = 320;   // fenêtre pour qu'un deuxième tap compte comme double-tap
      var TAP_MAX_MS = 220;      // au-delà, un appui n'est plus un "tap" mais un maintien
      var JITTER_PX = 10;        // tolérance de mouvement pour rester "stationnaire"
      var SPLIT_DIST_FACTOR = 2.3; // distance (× rayon) entre deux doigts qui déclenche la séparation
      var GROW_BUMP = 1.18;      // grossissement instantané au double-tap rapide
      var GROW_RATE = 0.55;      // grossissement continu (rayon/s) en double-tap + maintien
      var MAX_R_FACTOR = 2.2;    // ne grossit pas au-delà de ce multiple du rayon de départ
      var MIN_R = 16;
      var ICE_DAMPING = 0.32;    // amortissement par seconde — faible = glisse longtemps
      var WALL_BOUNCE = 0.62;
      // Monochrome vert phosphore — plusieurs intensités, jamais une autre teinte
      var COLORS = ["#3be08a", "#2fd17d", "#54e8a0", "#26c46f", "#6dffb0"];

      // "wire" (oscilloscope) est le style par défaut du catalogue —
      // voir REGLES-JEUX.md. Les trois autres restent en option.
      var STYLES = [
        { id: "wire", label: "Oscilloscope" },
        { id: "gel", label: "Gel mou" },
        { id: "soap", label: "Bulle de savon" },
        { id: "bounce", label: "Rebond simple" }
      ];

      var arena = document.getElementById("arena");
      var stylesEl = document.getElementById("styles");

      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var SPEED = reduced ? 0.05 : 1;
      function ms(n) { return n * SPEED; }
      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

      var bubbles = [];
      var nextId = 1;
      var running = true;
      var lastTime = 0;
      var style = "wire";

      try { style = localStorage.getItem("bulles-sonores-style") || "wire"; } catch (e) {}
      arena.dataset.style = style;

      // ---------- Style ----------

      STYLES.forEach(function (s) {
        var btn = document.createElement("button");
        btn.className = "style-btn";
        btn.textContent = s.label;
        btn.setAttribute("aria-pressed", s.id === style ? "true" : "false");
        btn.addEventListener("click", function () {
          style = s.id;
          arena.dataset.style = style;
          stylesEl.querySelectorAll(".style-btn").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
          btn.setAttribute("aria-pressed", "true");
          try { localStorage.setItem("bulles-sonores-style", style); } catch (e) {}
        });
        stylesEl.appendChild(btn);
      });

      // ---------- Son (une octave plus bas : les aigus précédents étaient
      // jugés "chelou") ----------

      var audio = null;
      var theremin = null; // { osc, gain }

      function initAudio() {
        if (!audio) {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audio = new Ctx();
        }
        if (audio && audio.state === "suspended") audio.resume();
      }

      function playTone(freq, duration, gainPeak, type) {
        if (!audio) return;
        var t = audio.currentTime;
        var gain = audio.createGain();
        gain.connect(audio.destination);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(gainPeak || 0.2, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        var osc = audio.createOscillator();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t);
        osc.connect(gain);
        osc.start(t);
        osc.stop(t + duration + 0.03);
      }

      function thereminStart() {
        if (!audio || theremin) return;
        var gain = audio.createGain();
        gain.gain.setValueAtTime(0.0001, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.09, audio.currentTime + 0.08);
        gain.connect(audio.destination);
        var osc = audio.createOscillator();
        osc.type = "triangle";
        osc.frequency.value = 200;
        osc.connect(gain);
        osc.start();
        theremin = { osc: osc, gain: gain };
      }

      function thereminUpdate(freq) {
        if (!theremin || !audio) return;
        theremin.osc.frequency.setTargetAtTime(freq, audio.currentTime, 0.05);
      }

      function thereminStop() {
        if (!theremin || !audio) return;
        var t = audio.currentTime;
        theremin.gain.gain.setTargetAtTime(0.0001, t, 0.05);
        var osc = theremin.osc;
        setTimeout(function () { try { osc.stop(); } catch (e) {} }, 220);
        theremin = null;
      }

      // Si l'onglet se ferme ou passe en arrière-plan en plein geste, le
      // thérémin continue de jouer : couper net le contexte audio produit
      // un petit "clic" désagréable. On coupe proprement avant.
      function silenceNow() {
        if (theremin) {
          try {
            theremin.gain.gain.cancelScheduledValues(audio.currentTime);
            theremin.gain.gain.value = 0;
            theremin.osc.stop();
          } catch (e) {}
          theremin = null;
        }
        if (audio && audio.state === "running") {
          try { audio.suspend(); } catch (e) {}
        }
      }
      document.addEventListener("visibilitychange", function () { if (document.hidden) silenceNow(); });
      window.addEventListener("pagehide", silenceNow);

      // ---------- Bulles ----------

      function arenaSize() { return { w: arena.clientWidth, h: arena.clientHeight }; }

      function baseRadius() {
        var s = arenaSize();
        return Math.max(28, Math.min(46, Math.sqrt((s.w * s.h) / (TARGET_COUNT * Math.PI)) * 0.4));
      }

      function spawnBubble(x, y, r, vx, vy, animate) {
        r = r || baseRadius();
        var s = arenaSize();
        if (x === undefined) {
          var tries = 0;
          do {
            x = r + Math.random() * Math.max(1, s.w - 2 * r);
            y = r + Math.random() * Math.max(1, s.h - 2 * r);
            tries++;
          } while (tries < 40 && bubbles.some(function (o) { return Math.hypot(o.x - x, o.y - y) < o.r + r + 4; }));
        }
        if (vx === undefined) {
          var angle = Math.random() * Math.PI * 2;
          var speed = 60 + Math.random() * 90; // vif au départ : la glace le laisse filer
          vx = Math.cos(angle) * speed;
          vy = Math.sin(angle) * speed;
        }

        var el = document.createElement("button");
        el.className = "bubble" + (animate ? " spawn" : "");
        el.style.setProperty("--c", COLORS[Math.floor(Math.random() * COLORS.length)]);
        el.style.width = el.style.height = (r * 2) + "px";
        var chargeRing = document.createElement("span");
        chargeRing.className = "charge-ring";
        el.appendChild(chargeRing);

        var b = {
          id: nextId++,
          el: el,
          x: x, y: y, r: r, r0: r,
          vx: vx, vy: vy,
          touches: {},         // pointerId -> { x, y } dans le repère de l'arène
          dragTX: x, dragTY: y,
          history: [],         // derniers points {t,x,y} pendant un glisser, pour la vitesse de lâcher
          pressStart: 0,
          pressPos: null,
          pressMoved: false,
          isSecondTap: false,
          growingContinuous: false,
          splitTriggered: false,
          lastReleaseTime: 0,
          impactAmp: 0,
          impactAngle: 0,
          wobble: 0,
          _touch: null
        };

        el.addEventListener("pointerdown", function (ev) { onDown(ev, b); });
        el.addEventListener("pointermove", function (ev) { onMove(ev, b); });
        el.addEventListener("pointerup", function (ev) { onUp(ev, b); });
        el.addEventListener("pointercancel", function (ev) { onUp(ev, b); });

        arena.appendChild(el);
        bubbles.push(b);
        applyTransform(b);
        return b;
      }

      function removeBubble(b) {
        var i = bubbles.indexOf(b);
        if (i >= 0) bubbles.splice(i, 1);
        b.el.remove();
        maybeRespawn();
      }

      function maybeRespawn() {
        if (!running) return;
        if (bubbles.length >= TARGET_COUNT) return;
        var delay = RESPAWN_DELAY[0] + Math.random() * (RESPAWN_DELAY[1] - RESPAWN_DELAY[0]);
        setTimeout(function () {
          if (running && bubbles.length < TARGET_COUNT) spawnBubble(undefined, undefined, undefined, undefined, undefined, true);
        }, ms(delay));
      }

      function burst(x, y, color, n) {
        for (var i = 0; i < n; i++) {
          var p = document.createElement("span");
          p.className = "particle";
          var size = 4 + Math.random() * 6;
          p.style.width = p.style.height = size + "px";
          p.style.background = color;
          p.style.left = x + "px";
          p.style.top = y + "px";
          arena.appendChild(p);
          var angle = Math.random() * Math.PI * 2;
          var dist = 22 + Math.random() * 36;
          var dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;
          var a = p.animate([
            { transform: "translate(-50%,-50%) translate(0,0) scale(1)", opacity: 1 },
            { transform: "translate(-50%,-50%) translate(" + dx + "px," + dy + "px) scale(0.2)", opacity: 0 }
          ], { duration: ms(420 + Math.random() * 180), easing: "ease-out", fill: "forwards" });
          a.finished.catch(function () {}).then(function () { p.remove(); });
        }
      }

      function ringAt(x, y, r, color) {
        var ring = document.createElement("div");
        ring.className = "ring";
        ring.style.borderColor = color || "var(--ink)";
        ring.style.width = ring.style.height = (r * 2) + "px";
        ring.style.left = (x - r) + "px";
        ring.style.top = (y - r) + "px";
        arena.appendChild(ring);
        var a = ring.animate([
          { opacity: 0.75, transform: "scale(1)" },
          { opacity: 0, transform: "scale(1.8)" }
        ], { duration: ms(500), easing: "ease-out", fill: "forwards" });
        a.finished.catch(function () {}).then(function () { ring.remove(); });
      }

      // ---------- Rendu (déformation par style) ----------

      function applyTransform(b) {
        var amp = b.impactAmp;
        var angle = b.impactAngle;
        var sx = 1, sy = 1;

        if (style === "soap") {
          var w = 1 + Math.sin(b.wobble) * amp * 0.5;
          sx = w; sy = w;
        } else {
          var flat = Math.min(0.22, amp);
          sx = 1 - flat;
          sy = 1 + flat;
        }

        var pinchScale = "";
        if (b.pinch) {
          pinchScale = " scale(" + b.pinch.sx.toFixed(3) + "," + b.pinch.sy.toFixed(3) + ") rotate(" + b.pinch.angle.toFixed(2) + "rad)";
          b.el.style.transform = "translate(" + (b.x - b.r) + "px," + (b.y - b.r) + "px)" + pinchScale;
        } else {
          b.el.style.transform =
            "translate(" + (b.x - b.r) + "px," + (b.y - b.r) + "px) rotate(" + angle.toFixed(3) + "rad) scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ") rotate(" + (-angle).toFixed(3) + "rad)";
        }
      }

      function kick(b, amp, angle) {
        if (!b) return;
        if (amp > b.impactAmp) { b.impactAmp = amp; b.impactAngle = angle; }
        b.wobble = 0;
      }

      function setRadius(b, r) {
        r = clamp(r, MIN_R, b.r0 * MAX_R_FACTOR);
        b.r = r;
        b.el.style.width = b.el.style.height = (r * 2) + "px";
      }

      // ---------- Pointeur : glisser / coller / écarter / tap / maintien ----------

      function localPos(ev) {
        var rect = arena.getBoundingClientRect();
        return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
      }

      function onDown(ev, b) {
        if (!running) return;
        initAudio();
        ev.preventDefault();
        try { b.el.setPointerCapture(ev.pointerId); } catch (e) {}
        var p = localPos(ev);
        b.touches[ev.pointerId] = p;

        var count = Object.keys(b.touches).length;
        if (count === 1) {
          var now = performance.now();
          b.el.classList.add("dragging");
          b.dragTX = b.x; b.dragTY = b.y;
          b.history = [{ t: now, x: p.x, y: p.y }];
          b.pressStart = now;
          b.pressPos = p;
          b.pressMoved = false;
          b.splitTriggered = false;
          b.growingContinuous = false;
          // Ce doigt arrive-t-il juste après un tap rapide ? On ne décide
          // pas encore s'il s'agit d'un double-tap bref (grossit d'un coup)
          // ou d'un double-tap maintenu (grossit en continu) — ça se
          // tranche à la relâche, ou dans la boucle s'il reste appuyé.
          b.isSecondTap = (now - b.lastReleaseTime) < DOUBLE_TAP_MS;
          thereminStart();
        } else if (count === 2) {
          // Un deuxième doigt arrive sur la même bulle : on annule le
          // maintien en cours et on entre en mode « écarter ».
          b.pressStart = 0;
          b.el.classList.remove("charging");
        }
      }

      function onMove(ev, b) {
        if (!b.touches[ev.pointerId]) return;
        var p = localPos(ev);
        b.touches[ev.pointerId] = p;
        var ids = Object.keys(b.touches);

        if (ids.length === 1) {
          b.dragTX = p.x; b.dragTY = p.y;
          var now = performance.now();
          b.history.push({ t: now, x: p.x, y: p.y });
          while (b.history.length > 8) b.history.shift();
          if (!b.pressMoved && b.pressPos && Math.hypot(p.x - b.pressPos.x, p.y - b.pressPos.y) > JITTER_PX) {
            b.pressMoved = true;
          }
          thereminUpdate(110 + (1 - clamp(p.y / arenaSize().h, 0, 1)) * 240);
        } else if (ids.length === 2) {
          var a = b.touches[ids[0]], c = b.touches[ids[1]];
          var dx = c.x - a.x, dy = c.y - a.y;
          var dist = Math.hypot(dx, dy);
          b.x = (a.x + c.x) / 2;
          b.y = (a.y + c.y) / 2;
          var stretch = clamp(dist / (b.r * 2), 1, SPLIT_DIST_FACTOR + 0.4);
          b.pinch = { sx: 1 / Math.sqrt(stretch), sy: stretch, angle: Math.atan2(dy, dx) };
          if (dist > b.r * 2 * SPLIT_DIST_FACTOR) splitBubble(b, a, c, ids[0], ids[1]);
        }
      }

      function onUp(ev, b) {
        if (!b.touches[ev.pointerId]) return;
        delete b.touches[ev.pointerId];
        var ids = Object.keys(b.touches);
        var now = performance.now();

        if (ids.length === 0) {
          b.el.classList.remove("dragging", "charging");
          var held = b.pressStart ? now - b.pressStart : 999;
          var quickTap = b.pressStart && !b.pressMoved && held < TAP_MAX_MS && !b.splitTriggered && !b.growingContinuous;

          // Vitesse de lâcher : mesurée sur les tout derniers points, pas
          // juste la dernière frame — le geste garde son élan.
          var vx = 0, vy = 0;
          if (b.history.length >= 2) {
            var first = b.history[0], last = b.history[b.history.length - 1];
            var dt = Math.max(16, last.t - first.t) / 1000;
            vx = (last.x - first.x) / dt;
            vy = (last.y - first.y) / dt;
          }
          b.vx = clamp(vx, -900, 900);
          b.vy = clamp(vy, -900, 900);
          thereminStop();

          if (b.growingContinuous) {
            // On a grossi en continu : le geste est déjà accompli, pas de
            // tap à enchaîner derrière.
            b.lastReleaseTime = 0;
          } else if (quickTap) {
            if (b.isSecondTap) {
              growBump(b);
              b.lastReleaseTime = 0;
            } else {
              b.lastReleaseTime = now;
            }
          } else {
            b.lastReleaseTime = 0;
          }
          b.growingContinuous = false;
          b.pressStart = 0;
        } else if (ids.length === 1) {
          b.pinch = null;
          var rest = b.touches[ids[0]];
          b.dragTX = rest.x; b.dragTY = rest.y;
        }
      }

      function growBump(b) {
        setRadius(b, b.r * GROW_BUMP);
        playTone(260, 0.12, 0.14, "triangle");
        ringAt(b.x, b.y, b.r, "var(--ink)");
      }

      function splitBubble(b, posA, posC, idA, idC) {
        var r2 = Math.max(MIN_R, b.r / Math.SQRT2);
        delete b.touches[idA];
        delete b.touches[idC];
        removeBubble(b);
        var one = spawnBubble(posA.x, posA.y, r2, b.vx * 0.5, b.vy * 0.5, true);
        var two = spawnBubble(posC.x, posC.y, r2, b.vx * 0.5, b.vy * 0.5, true);
        one.el.style.setProperty("--c", b.el.style.getPropertyValue("--c"));
        two.el.style.setProperty("--c", b.el.style.getPropertyValue("--c"));
        [[one, idA, posA], [two, idC, posC]].forEach(function (pair) {
          var bub = pair[0], id = pair[1], pos = pair[2];
          try { bub.el.setPointerCapture(Number(id)); } catch (e) {}
          bub.touches[id] = pos;
          bub.dragTX = pos.x; bub.dragTY = pos.y;
          bub.el.classList.add("dragging");
        });
        playTone(280, 0.16, 0.15, "sawtooth");
        playTone(350, 0.13, 0.11, "sawtooth");
        ringAt(posA.x, posA.y, r2, "var(--ink)");
        ringAt(posC.x, posC.y, r2, "var(--ink)");
      }

      // Appui simple maintenu sans bouger : la bulle se coupe en deux,
      // chacune s'éloignant de l'axe où le doigt appuyait.
      function splitInPlace(b) {
        b.splitTriggered = true;
        var angle = Math.random() * Math.PI * 2;
        var off = b.r * 0.45;
        var posA = { x: b.x + Math.cos(angle) * off, y: b.y + Math.sin(angle) * off };
        var posC = { x: b.x - Math.cos(angle) * off, y: b.y - Math.sin(angle) * off };
        var r2 = Math.max(MIN_R, b.r / Math.SQRT2);
        var kickSpeed = 90;
        var id = Object.keys(b.touches)[0];
        delete b.touches[id];
        removeBubble(b);
        var one = spawnBubble(posA.x, posA.y, r2, Math.cos(angle) * kickSpeed, Math.sin(angle) * kickSpeed, true);
        var two = spawnBubble(posC.x, posC.y, r2, -Math.cos(angle) * kickSpeed, -Math.sin(angle) * kickSpeed, true);
        one.el.style.setProperty("--c", b.el.style.getPropertyValue("--c"));
        two.el.style.setProperty("--c", b.el.style.getPropertyValue("--c"));
        playTone(280, 0.16, 0.15, "sawtooth");
        playTone(350, 0.13, 0.11, "sawtooth");
        ringAt(posA.x, posA.y, r2, "var(--ink)");
        ringAt(posC.x, posC.y, r2, "var(--ink)");
      }

      // ---------- Boucle physique ----------

      function update(dt) {
        var s = arenaSize();
        var iceFactor = Math.exp(-ICE_DAMPING * dt); // amortissement doux, façon glace

        bubbles.forEach(function (b) {
          var ids = Object.keys(b.touches);
          if (ids.length === 1 && !b.pinch) {
            // Suivi direct du doigt — pas de délai à la prise en main.
            b.x = b.dragTX;
            b.y = b.dragTY;
          } else if (ids.length === 0) {
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            var bounced = false, angle = 0;
            if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * WALL_BOUNCE; bounced = true; angle = 0; }
            if (b.x > s.w - b.r) { b.x = s.w - b.r; b.vx = -Math.abs(b.vx) * WALL_BOUNCE; bounced = true; angle = 0; }
            if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * WALL_BOUNCE; bounced = true; angle = Math.PI / 2; }
            if (b.y > s.h - b.r) { b.y = s.h - b.r; b.vy = -Math.abs(b.vy) * WALL_BOUNCE; bounced = true; angle = Math.PI / 2; }
            if (bounced) kick(b, 0.12, angle);
            b.vx *= iceFactor;
            b.vy *= iceFactor;
          }
        });

        // Contacts entre bulles : on les repousse et on les déforme.
        for (var i = 0; i < bubbles.length; i++) {
          for (var j = i + 1; j < bubbles.length; j++) {
            var a = bubbles[i], c = bubbles[j];
            var dx = c.x - a.x, dy = c.y - a.y;
            var dist = Math.hypot(dx, dy) || 0.001;
            var min = a.r + c.r;
            if (dist < min) {
              var nx = dx / dist, ny = dy / dist;
              var overlap = (min - dist);
              var wasTouching = a._touch === c;
              if (!wasTouching) {
                var speed = Math.hypot(a.vx - c.vx, a.vy - c.vy);
                var impact = clamp(0.05 + speed / 700, 0.05, 0.22);
                var ang = Math.atan2(ny, nx);
                kick(a, impact, ang);
                kick(c, impact, ang);
                if (running) playTone(85 + Math.random() * 15, 0.11, clamp(0.04 + speed / 2000, 0.03, 0.13));
                // Échange d'élan façon billard, atténué (pas un choc parfait)
                var rvx = a.vx - c.vx, rvy = a.vy - c.vy;
                var rel = rvx * nx + rvy * ny;
                if (rel > 0) {
                  var imp = rel * 0.5;
                  a.vx -= imp * nx; a.vy -= imp * ny;
                  c.vx += imp * nx; c.vy += imp * ny;
                }
              }
              a._touch = c; c._touch = a;
              var aFree = Object.keys(a.touches).length === 0;
              var cFree = Object.keys(c.touches).length === 0;
              var push = overlap / (aFree && cFree ? 2 : 1);
              if (aFree) { a.x -= nx * push; a.y -= ny * push; }
              if (cFree) { c.x += nx * push; c.y += ny * push; }
              // Style gel : reste visuellement écrasé tant que le contact dure
              if (style === "gel") {
                var live = clamp(overlap / min, 0, 0.4);
                if (live > a.impactAmp) { a.impactAmp = live; a.impactAngle = Math.atan2(ny, nx); }
                if (live > c.impactAmp) { c.impactAmp = live; c.impactAngle = Math.atan2(ny, nx); }
              }
            } else {
              if (a._touch === c) { a._touch = null; c._touch = null; }
            }
          }
        }

        bubbles.forEach(function (b) {
          b.x = clamp(b.x, b.r, s.w - b.r);
          b.y = clamp(b.y, b.r, s.h - b.r);
          if (style !== "gel" || (Object.keys(b.touches).length === 0 && !b._touch)) {
            b.impactAmp *= Math.max(0, 1 - dt * 9);
          }
          b.wobble += dt * (reduced ? 2 : 16);

          if (b.pressStart && Object.keys(b.touches).length === 1 && !b.pressMoved) {
            var held = performance.now() - b.pressStart;
            if (b.isSecondTap) {
              // Passé le seuil d'un tap franc sans relâcher : c'est un
              // double-tap maintenu, on bascule en grossissement continu.
              if (held > TAP_MAX_MS) b.growingContinuous = true;
              if (b.growingContinuous) {
                setRadius(b, b.r + GROW_RATE * b.r0 * dt);
                b.el.classList.add("charging");
                var gring = b.el.querySelector(".charge-ring");
                if (gring) gring.style.transform = "scale(" + (0.7 + 0.3 * Math.sin(performance.now() / 110)) + ")";
              }
            } else {
              b.el.classList.add("charging");
              var ring = b.el.querySelector(".charge-ring");
              if (ring) ring.style.transform = "scale(" + clamp(held / SPLIT_HOLD_MS, 0, 1).toFixed(2) + ")";
              if (held > SPLIT_HOLD_MS && !b.splitTriggered) splitInPlace(b);
            }
          } else {
            b.el.classList.remove("charging");
          }

          applyTransform(b);
        });
      }

      function loop(time) {
        var dt = Math.min(0.05, (time - lastTime) / 1000 || 0);
        lastTime = time;
        if (running) update(dt);
        requestAnimationFrame(loop);
      }

      // ---------- Historique ----------

      var VERSIONS = [
        { v: "v5", text: "Glissé façon glace (amortissement plus faible), vitesse de lâcher fidèle au geste. Appui maintenu = la bulle se coupe en deux (avant : elle éclatait). Double-tap = grossit ; double-tap maintenu = grossit en continu. Sons descendus d'une octave. Écran d'accueil retiré, plein écran (l'oscilloscope, c'est tout l'écran, pas une fenêtre)." },
        { v: "v4", text: "Prototype de sensation affiné : moins de bulles à l'écran, contacts plus doux, correction du double-comptage au démarrage. Style « Oscilloscope » (fond noir, vert phosphore) par défaut." },
        { v: "v3", text: "Refonte en prototype de sensation, sans but : glisser une bulle, en coller deux l'une contre l'autre, en écarter une à deux doigts, rester appuyé pour éclater. Quatre styles visuels au choix." },
        { v: "v2", text: "Jeu de fusion (deux bulles de même note qui fusionnent, but : boucler une octave) — mis de côté au profit du prototype de sensation." },
        { v: "v1", text: "Premier prototype : mémoriser une mélodie jouée par le jeu et la rejouer dans l'ordre, façon Simon." }
      ];

      var histBtn = document.getElementById("histBtn");
      var histOverlay = document.getElementById("histOverlay");
      var histList = document.getElementById("histList");
      var histClose = document.getElementById("histClose");

      VERSIONS.forEach(function (entry) {
        var li = document.createElement("li");
        var bEl = document.createElement("b");
        bEl.textContent = entry.v;
        li.appendChild(bEl);
        li.appendChild(document.createTextNode(entry.text));
        histList.appendChild(li);
      });

      histBtn.addEventListener("click", function () { histOverlay.hidden = false; });
      histClose.addEventListener("click", function () { histOverlay.hidden = true; });

      window.addEventListener("resize", function () {
        var s = arenaSize();
        bubbles.forEach(function (b) {
          b.x = clamp(b.x, b.r, s.w - b.r);
          b.y = clamp(b.y, b.r, s.h - b.r);
        });
      });

      // ---------- Démarrage ----------
      // Pas d'écran d'accueil : ça commence tout de suite (un seul joueur,
      // qui connaît déjà le prototype — inutile de le lui réexpliquer).

      for (var i = 0; i < TARGET_COUNT; i++) spawnBubble();
      requestAnimationFrame(function (t) { lastTime = t; requestAnimationFrame(loop); });
    })();
  </script>


  <script>
    // Mise à jour automatique (même principe que la page d'accueil du
    // portfolio) : aucune partie n'est sauvegardée entre les sessions ici,
    // donc rien à perdre en rechargeant dès qu'une nouvelle version est en
    // ligne. Le paramètre anti-cache dans l'URL de vérification est
    // nécessaire : un simple `cache: 'no-store'` n'empêche que la mise en
    // cache locale du navigateur, pas celle du CDN devant GitHub Pages, qui
    // peut renvoyer une réponse périmée même à une requête "no-store".
    (function () {
      var PAGE = "bulles-sonores";
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return; // évite les rafales de clics
        lastCheck = now0;
        try {
          var url = (location.pathname || "index.html") + "?_cb=" + now0;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          var tag = res.headers.get("etag") || res.headers.get("last-modified");
          if (!tag) return;
          var key = "pm_pageVersion_" + PAGE;
          var stored = localStorage.getItem(key);
          if (stored === null) { localStorage.setItem(key, tag); return; }
          if (tag !== stored) {
            var now = Date.now();
            var guard = "pm_lastUpdateReload_" + PAGE;
            var lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem(guard)) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try {
              localStorage.setItem(key, tag);
              sessionStorage.setItem(guard, String(now));
            } catch (e) {}
            location.replace(location.pathname + "?_r=" + now);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      // Un clic ou un toucher, même en pleine session, redéclenche la
      // vérification — plus besoin de fermer/rouvrir l'appli pour voir
      // une mise à jour.
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>

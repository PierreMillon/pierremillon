        b.addEventListener("pointerleave", function () { if (timer) { clearTimeout(timer); timer = null; } });
        b.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
        document.getElementById(e.row === 1 ? "ensRow1" : "ensRow2").appendChild(b);
        ensBoxes.push(b);
      });

      function ensShowTip(e, b) {
        ensTip.textContent = LANG === "en" ? e.defEn : e.def;
        ensTip.hidden = false;
        var rs = ensEl.getBoundingClientRect(), rb = b.getBoundingClientRect();
        var rows = document.querySelector(".ens-rows").getBoundingClientRect();
        ensTip.style.left = Math.max(4, Math.min(rs.width - ensTip.offsetWidth - 4, rb.left - rs.left + rb.width / 2 - ensTip.offsetWidth / 2)) + "px";
        ensTip.style.top = (rows.top - rs.top - ensTip.offsetHeight - 8) + "px";
      }
      document.addEventListener("pointerdown", function (ev) {
        if (!ensTip.hidden && !ev.target.closest(".ens-box")) ensTip.hidden = true;
      });

      function ensStart() {
        // Seuls les nombres et les cases des ensembles cochés dans le menu
        ensBoxes.forEach(function (b) {
          b.hidden = !sets[b._e.base];
          b.classList.remove("in", "bad", "hover");
        });
        var pool = NUMS.filter(function (z) { return sets[smallestBase(z)]; });
        if (!pool.length) pool = NUMS.filter(function (z) { return smallestBase(z) === "N"; });
        var z = pool[Math.floor(Math.random() * pool.length)];
        if (ensState && ensState.z === z && pool.length > 1) z = pool[(pool.indexOf(z) + 1) % pool.length];
        ensState = { z: z, ready: false };
        ensNum.textContent = z.t;
        ensNum.classList.remove("drag");
        ensNum.style.left = ensNum.style.top = "";
        ensMsg.textContent = "";
        ensScoreEl.textContent = ensScore.n ? ensScore.ok + " / " + ensScore.n : "";
        nextBtn.disabled = true;
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
        ensNum.animate([{ opacity: 0, transform: "scale(0.6)" }, { opacity: 1, transform: "scale(1)" }],
          { duration: ms(450), easing: "cubic-bezier(.3,1.4,.5,1)" });
      }

      function ensAnswer(b) {
        if (!ensState || ensState.ready || b.hidden) return;
        ensState.ready = true;
        var z = ensState.z, ok = b._e.has(z);
        ensScore.n++;
        if (ok) { ensScore.ok++; ensStreak++; SND.ok(); } else { ensStreak = 0; SND.bad(); }
        if (ensStreak >= 3) markDone("Ensembles");
        // Toutes les cases qui contiennent le nombre s'allument, une à une
        ensBoxes.forEach(function (bb, k) {
          if (bb.hidden || !bb._e.has(z)) return;
          setTimeout(function () { bb.classList.add("in"); }, ms(ok && bb === b ? 0 : 250 + k * 90));
        });
        if (!ok) {
          b.classList.add("bad");
          b.animate([{ transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "none" }], { duration: ms(300) });
        }
        var list = ensBoxes.filter(function (bb) { return !bb.hidden && bb._e.has(z); }).map(function (bb) { return bb._e.sym; }).join("  ");
        ensMsg.textContent = (ok ? "✓ " : "✗ ") + z.t + " ∈ " + list;
        ensScoreEl.textContent = ensScore.ok + " / " + ensScore.n;
        nextBtn.disabled = false;
      }

      // Glisser le nombre sur une case
      (function () {
        var drag = null;
        ensNum.addEventListener("pointerdown", function (e) {
          if (!ensState || ensState.ready) return;
          e.preventDefault();
          ensNum.setPointerCapture(e.pointerId);
          drag = { x: e.clientX, y: e.clientY, moved: false };
        });
        function boxAt(x, y) {
          return ensBoxes.find(function (b) {
            if (b.hidden) return false;
            var r = b.getBoundingClientRect();
            return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
          });
        }
        ensNum.addEventListener("pointermove", function (e) {
          if (!drag) return;
          if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
          drag.moved = true;
          ensNum.classList.add("drag");
          ensNum.style.left = e.clientX + "px";
          ensNum.style.top = e.clientY + "px";
          var over = boxAt(e.clientX, e.clientY);
          ensBoxes.forEach(function (b) { b.classList.toggle("hover", b === over); });
        });
        function up(e) {
          if (!drag) return;
          var d = drag;
          drag = null;
          ensBoxes.forEach(function (b) { b.classList.remove("hover"); });
          var target = d.moved ? boxAt(e.clientX, e.clientY) : null;
          ensNum.classList.remove("drag");
          ensNum.style.left = ensNum.style.top = "";
          ensNum.animate([{ transform: "scale(0.85)" }, { transform: "scale(1)" }], { duration: ms(350), easing: "cubic-bezier(.3,1.4,.5,1)" });
          if (target) ensAnswer(target);
        }
        ensNum.addEventListener("pointerup", up);
        ensNum.addEventListener("pointercancel", up);
      })();

      // ---------- Écran figé ----------
      // Aucun glissement de page, aucun zoom (iOS ignore user-scalable=no
      // pour le pincement : on bloque aussi ses événements « gesture »).
      document.addEventListener("touchmove", function (e) {
        if (e.target.closest && e.target.closest(".hist-list")) return;

      // Ellipses verticales, dans le sens de l'écran ; chaque lettre au
      // milieu de sa bande, sur l'axe vertical en haut.
      var MAP_CX = 150, MAP_CY = 212, STEP = 21;
      var ZONES = RINGS.map(function (k, i) {
        var ry = 206 - i * STEP, rx = ry * 0.66;
        var inner = i < RINGS.length - 1 ? ry - STEP : 0;
        return { k: k, rx: rx, ry: ry, lab: LABS[k], lx: MAP_CX, ly: MAP_CY - (ry + inner) / 2 + 5 };
      });
      ZONES[ZONES.length - 1].ly = MAP_CY + 8; // ℕ au centre
      function renderHome() {
        homeMap.innerHTML = "";
        ZONES.forEach(function (z) {
          var e = svgEl("ellipse", { cx: MAP_CX, cy: MAP_CY, rx: z.rx, ry: z.ry }, homeMap);
          var tease = !!TEASE[z.k];
          var isLock = tease || !unlocked(z.k);
          if (isLock) e.classList.add("lock");
          if (!tease && setDone(z.k)) e.classList.add("done");
          if (z.k === homeSel) e.classList.add("sel");
          var t = svgEl("text", { x: z.lx, y: z.k === "N" ? z.ly + 3 : z.ly, class: (isLock ? "lock" : "") + (z.k === "N" ? " big" : "") }, homeMap);
          t.textContent = z.lab;
        });
        var info = document.getElementById("homeInfo"), list = document.getElementById("homeList");
        list.innerHTML = "";
        if (TEASE[homeSel]) {
          info.textContent = TEASE[homeSel][LANG === "en" ? 1 : 0] + (LANG === "en" ? " — coming soon." : " — bientôt.");
          return;
        }
        var open = unlocked(homeSel);
        var prevK = UNIV[UNIV.indexOf(homeSel) - 1];
        info.textContent = open ? SYM_OF[homeSel] : (LANG === "en" ? "Locked — pass every chapter of " : "Verrouillé — réussis tous les chapitres de ") + SYM_OF[prevK];
        chaptersOf(homeSel).forEach(function (d) {
          var b = document.createElement("button");
          b.textContent = tr(d.title);
          if (/[()²]/.test(d.title)) b.style.textTransform = "none";
          if (doneMap[d.title]) { b.classList.add("done"); b.textContent = "✓ " + b.textContent; }
          else if (!d.custom && runs[d.title]) {
            var sm = document.createElement("small");
            sm.textContent = runs[d.title] + "/3";
            b.appendChild(sm);
          }
          b.disabled = !open;
          b.addEventListener("click", function () {
            // L'univers de travail monte au moins jusqu'à l'ensemble du chapitre
            if (UNIV.indexOf(universe) < UNIV.indexOf(homeSel)) {
              universe = homeSel;
              try { localStorage.setItem("pasapas_universe", universe); } catch (e) {}
              computeSets(); renderUniv(); applySets();
            }
            selectDemo(DEMOS.indexOf(d));
          });
          list.appendChild(b);
        });
      }
      // Toucher ou glisser sur la carte : l'ensemble sous le doigt est
      // sélectionné en continu (l'ellipse la plus intérieure qui contient
      // le point).
      function zoneAt(ev) {
        var pt = homeMap.createSVGPoint();
        pt.x = ev.clientX; pt.y = ev.clientY;
        var m = homeMap.getScreenCTM();
        if (!m) return null;
        var p = pt.matrixTransform(m.inverse());
        var hit = null;
        ZONES.forEach(function (z) {
          var dx = (p.x - MAP_CX) / z.rx, dy = (p.y - MAP_CY) / z.ry;
          if (dx * dx + dy * dy <= 1) hit = z.k; // les suivantes sont plus intérieures
        });
        return hit;
      }
      var mapDrag = false;
      function mapPick(ev) {
        var k = zoneAt(ev);
        if (k && k !== homeSel) { homeSel = k; SND.tick(); renderHome(); }
      }
      homeMap.addEventListener("pointerdown", function (ev) {
        ev.preventDefault();
        mapDrag = true;
        try { homeMap.setPointerCapture(ev.pointerId); } catch (e) {}
        mapPick(ev);
      });
      homeMap.addEventListener("pointermove", function (ev) { if (mapDrag) mapPick(ev); });
      ["pointerup", "pointercancel"].forEach(function (t) {
        homeMap.addEventListener(t, function () { mapDrag = false; });
      });

      function showHome() {
        calcRun++;
        closeChoice();
        [sgEl, pfEl, ensEl, solEl, calcEl, fusEl, stageWrap, document.getElementById("controls")].forEach(function (e) { e.hidden = true; });
        univEl.hidden = true;
        homeEl.hidden = false;
        document.getElementById("title").textContent = "Pas à Pas";
        try { localStorage.setItem("pasapas_demo", ""); } catch (e) {}
        renderHome();
      }
      function hideHome() {
        if (!homeEl.hidden) { homeEl.hidden = true; univEl.hidden = false; }
      }
      document.getElementById("homeBtn").addEventListener("click", function () { if (!busy) showHome(); });

      var profBtn = document.getElementById("profBtn");
      var soundBtn = document.getElementById("soundBtn");
      function renderToggles() {
        profBtn.textContent = (LANG === "en" ? "Teacher mode: " : "Mode prof : ") + (prof ? "✓" : "—");
        soundBtn.textContent = (LANG === "en" ? "Sound: " : "Son : ") + (soundOn ? "✓" : "—");
      }
      profBtn.addEventListener("click", function () {
        prof = !prof;
        try { localStorage.setItem("pasapas_prof", prof ? "1" : "0"); } catch (e) {}
        renderToggles(); renderUniv(); applySets();
        if (!homeEl.hidden) renderHome();
      });
      soundBtn.addEventListener("click", function () {
        soundOn = !soundOn;
        try { localStorage.setItem("pasapas_sound", soundOn ? "1" : "0"); } catch (e) {}
        renderToggles();
        SND.tick();
      });
      document.getElementById("langBtn").addEventListener("click", function () { renderToggles(); if (!homeEl.hidden) renderHome(); });
      renderToggles();

      // Reprend là où on s'était arrêté (même démo qu'à la dernière visite)
      var startDemo = 0;
      try {
        var savedTitle = localStorage.getItem("pasapas_demo");
        DEMOS.forEach(function (d, k) { if (d.title === savedTitle) startDemo = k; });
      } catch (e) {}
      computeSets(); renderUniv();
      var hadDemo = false;
      try { hadDemo = !!localStorage.getItem("pasapas_demo"); } catch (e) {}
      if (!sets[setOf(DEMOS[startDemo])]) hadDemo = false;
      selectDemo(startDemo);
      applySets();
      if (!hadDemo) showHome();

      // Installable (PWA) : manifeste + service worker « réseau d'abord » —
      // toujours la version en ligne si possible, la copie locale hors ligne
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
    })();
  </script>

  <script>
    // Mise à jour automatique (même principe que la page d'accueil du
    // portfolio) : aucune progression n'est encore sauvegardée ici, donc
    // rien à perdre en rechargeant dès qu'une nouvelle version est en ligne.
    // Le paramètre anti-cache dans l'URL de vérification est nécessaire :
    // un simple `cache: 'no-store'` n'empêche que la mise en cache locale
    // du navigateur, pas celle du CDN devant GitHub Pages, qui peut renvoyer
    // une réponse périmée même à une requête "no-store".
    (function () {
      var PAGE = "pas-a-pas";
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return; // évite les rafales de clics
        lastCheck = now0;
        try {
          var url = (location.pathname || "index.html") + "?_cb=" + now0;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          var tag = res.headers.get("etag") || res.headers.get("last-modified");
          if (!tag) return;
          var key = "pm_pageVersion_" + PAGE;
          var stored = localStorage.getItem(key);
          if (stored === null) { localStorage.setItem(key, tag); return; }
          if (tag !== stored) {
            var now = Date.now();
            var guard = "pm_lastUpdateReload_" + PAGE;
            var lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem(guard)) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try {
              localStorage.setItem(key, tag);
              sessionStorage.setItem(guard, String(now));
            } catch (e) {}
            location.replace(location.pathname + "?_r=" + now);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>

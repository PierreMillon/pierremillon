<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>Pas à Pas</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05100a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Oscilloscope / vieux moniteur — palette fixe, jamais d'ivoire ici
       (voir REGLES-JEUX.md : esthétique par défaut du catalogue) */
    :root {
      --bg: #05100a;
      --bg-soft: #0a1a12;
      --ink: #3be08a;
      --ink-soft: #2a8f5c;
      --hairline: #123322;
      --accent: #6dffb0;
      --accent-soft: rgba(61, 224, 138, 0.16);
      --sign: #ffd166;
    }

    * { box-sizing: border-box; }

    /* Comportement d'application : la page tient exactement dans l'écran,
       ne défile pas, ne rebondit pas, ne se tire pas vers le bas. */
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      margin: 0;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, var(--bg-soft), var(--bg) 60%);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: max(0.8rem, env(safe-area-inset-top)) 16px max(0.8rem, env(safe-area-inset-bottom));
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    main {
      width: 100%;
      max-width: 640px;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .menu-btn {
      width: 2.1rem;
      height: 2.1rem;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      cursor: pointer;
    }

    .menu-btn:hover, .menu-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

    .menu-panel {
      position: absolute;
      top: 3rem;
      left: 0;
      z-index: 15;
      display: flex;
      flex-direction: column;
      min-width: 10rem;
      background: var(--bg);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      overflow: hidden;
    }

    .menu-item {
      display: block;
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: left;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--hairline);
      padding: 0.8rem 1rem;
      cursor: pointer;
    }

    .menu-item:last-child { border-bottom: none; }

    /* Barre des ensembles, toujours visible : ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ */
    .univ {
      flex: none;
      display: flex;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }

    .univ button {
      flex: 1;
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.35rem 0;
      cursor: pointer;
    }

    .univ button.on { color: var(--ink); border-color: var(--ink-soft); background: var(--accent-soft); }
    .univ button.cur { color: var(--accent); border-color: var(--accent); }
    .menu-item:hover, .menu-item:focus-visible { color: var(--accent); }
    .menu-panel[hidden] { display: none; }

    .back {
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .back:hover { color: var(--accent); }

    .subline {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.3rem;
    }

    .hist-btn {
      font-family: inherit;
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .hist-btn:hover { color: var(--accent); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
      background: rgba(5, 16, 10, 0.95);
    }

    .overlay[hidden] { display: none; }

    .overlay .big {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 300;
      font-size: 1.8rem;
      color: var(--ink);
    }

    .hist-list {
      width: 100%;
      max-width: 22rem;
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
    }

    .hist-list li {
      padding: 0.7rem 0;
      border-top: 1px solid var(--hairline);
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--ink-soft);
    }

    .hist-list li:last-child { border-bottom: 1px solid var(--hairline); }

    .hist-list b {
      display: block;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 0.1rem;
    }

    .btn {
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
    }

    .btn:hover, .btn:focus-visible { background: var(--accent); color: var(--bg); }

    h1 {
      margin: 0;
      font-family: inherit;
      font-weight: 400;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0.7rem 0 0.2rem;
      flex: none;
    }

    .tab {
      font-family: inherit;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { border-color: var(--accent); color: var(--ink); }

    .stage-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: 0.6rem;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
    }

    .stage-top {
      position: relative;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex: none;
      min-height: 100px;
      padding: 1.4rem 0.5rem 0.6rem;
      overflow: hidden;
    }

    .stage-wrap.split .stage-top { display: flex; }

    .stage-divider {
      display: none;
      height: 1px;
      background: var(--hairline);
      margin: 0 1.2rem;
    }

    .stage-wrap.split .stage-divider { display: block; }

    /* Dernière étape : plus de séparateur entre les deux rangées — on
       montre directement départ = résultat, même objet, même fond. */
    .stage-wrap.final .stage-divider {
      background: none;
      height: auto;
      margin: 0.2rem 0;
      display: flex;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--accent);
    }
    .stage-wrap.final .stage-divider::after { content: attr(data-sign); }

    .stage-bottom {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.4rem 0.5rem;
      overflow: hidden;
    }

    .stage-wrap.split .stage {
      min-height: 130px;
      padding: 1.4rem 0.5rem 1.8rem;
    }

    .row-tag {
      position: absolute;
      top: 0.5rem;
      left: 0.7rem;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .stage-wrap.split .row-tag { opacity: 0.65; }

    .dots {
      display: none;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }

    .stage-wrap.split .dots { display: flex; }

    .dots span {
      width: 6px;
      height: 6px;
      border: 1px solid var(--hairline);
      background: transparent;
    }

    .dots span.done { background: var(--ink-soft); border-color: var(--ink-soft); }
    .dots span.now { background: var(--accent); border-color: var(--accent); }
    .dots span.anchor { border-color: var(--accent); }

    .magic {
      margin: 0;
      min-height: 2.4em;
      line-height: 1.35;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--ink-soft);
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .magic.show { opacity: 1; }

    .expr {
      display: flex;
      flex-wrap: nowrap;
      white-space: nowrap;
      align-items: center;
      justify-content: center;
      gap: 0.1em;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 3rem);
      line-height: 1;
      transform-origin: center center;
    }

    .tok {
      display: inline-block;
      padding: 0.08em 0.1em;
      border-radius: 0.2em;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .tok .in { display: inline-block; }
    .tok i { font-style: italic; }
    .tok.op { padding: 0.08em 0.22em; }
    .tok.par { font-weight: 300; }
    .tok.dot { padding: 0.08em 0.05em; }
    .tok.sup { font-size: 0.55em; align-self: flex-start; padding: 0; margin-left: -0.2em; }

    .tok.hl {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tok.sign-hl { color: var(--sign); }

    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .frac .row {
      display: flex;
      align-items: center;
      gap: 0.05em;
      padding: 0.05em 0.2em;
    }

    .frac .bar {
      align-self: stretch;
      height: 2px;
      background: var(--ink);
      margin: 0.08em 0;
    }

    /* Soustraction posée : un terme au-dessus de son opposé, une barre,
       comme à l'école — avant de disparaître, on voit d'où vient le 0 */
    .cancel {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      margin: 0 0.12em;
    }

    .cancel .crow {
      display: flex;
      align-items: center;
      gap: 0.05em;
      padding: 0.02em 0.1em;
    }

    .cancel .ceq { margin-right: 0.3em; }

    .cancel .cbar {
      align-self: stretch;
      height: 2px;
      background: var(--ink);
      margin: 0.06em 0;
    }

    /* Droite des réels : une flèche de 0 vers la valeur. Multiplier par
       −1 la fait tourner d'un demi-tour autour de 0 (démo −×−). */
    .stage.has-line { align-items: flex-start; padding-top: 1rem; }

    .numsvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .nl-axis { stroke: var(--ink-soft); stroke-width: 1; }
    .nl-lab { fill: var(--ink-soft); font-size: 10px; text-anchor: middle; font-family: inherit; }
    .nl-deg { fill: var(--sign); font-size: 12px; text-anchor: middle; font-family: inherit; }
    .nl-trace { fill: none; stroke: var(--sign); stroke-width: 1.5; stroke-dasharray: 4 5; opacity: 0.55; }
    .nl-trace.live { opacity: 0.9; }
    .nl-vec line { stroke: var(--sign); stroke-width: 3; stroke-linecap: round; }
    .nl-vec path, .nl-vec circle { fill: var(--sign); }

    .numline {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 12px;
      height: 44px;
      pointer-events: none;
    }

    .numline .axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 14px;
      height: 1px;
      background: var(--ink-soft);
    }

    .numline .tick {
      position: absolute;
      top: 10px;
      width: 1px;
      height: 9px;
      background: var(--ink-soft);
    }

    .numline .lab {
      position: absolute;
      top: 24px;
      transform: translateX(-50%);
      font-size: 0.62rem;
      color: var(--ink-soft);
    }

    .numline .vec {
      position: absolute;
      left: 50%;
      top: 13px;
      height: 3px;
      background: var(--sign);
      transform-origin: 0 50%;
    }

    .numline .vec::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -5px;
      border-left: 9px solid var(--sign);
      border-top: 6.5px solid transparent;
      border-bottom: 6.5px solid transparent;
    }

    svg.arcs {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    svg.arcs path {
      fill: none;
      stroke: var(--sign);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .verify-warn {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 30;
      padding: 0.5rem 0.7rem;
      font-size: 0.7rem;
      color: #ff8a7a;
      border: 1px solid #ff8a7a;
      border-radius: 8px;
      background: rgba(20, 5, 5, 0.9);
    }

    /* Mode jeu : deux propositions pour l'étape suivante */
    .stage-wrap { position: relative; }

    .choices {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0.6rem;
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0 0.4rem;
    }

    .choice {
      display: flex;
      justify-content: center;
      overflow: hidden;
      padding: 0.5rem 0.4rem;
      background: var(--bg);
      border: 1px solid var(--ink-soft);
      border-radius: 12px;
      cursor: pointer;
      color: var(--ink);
    }

    .choice .expr { font-size: clamp(1.1rem, 5vw, 1.6rem); }
    .choice.good { border-color: var(--accent); background: var(--accent-soft); }
    .choice.bad { border-color: #ff8a7a; color: #ff8a7a; }

    .summary {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.35rem;
      transform-origin: center center;
    }

    .summary .expr { font-size: clamp(1.4rem, 6vw, 2.2rem); justify-content: flex-start; }
    .sum-row { display: flex; align-items: center; gap: 0.5rem; }

    .sum-eq {
      width: 1.2em;
      font-size: clamp(1.4rem, 6vw, 2.2rem);
      color: var(--accent);
      text-align: center;
    }

    .shape {
      width: 0.72em;
      height: 0.72em;
      vertical-align: -0.04em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
    }

    .ghost {
      position: absolute;
      margin: 0;
      pointer-events: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 3rem);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ghost.traveller { color: var(--sign); z-index: 3; }

    /* Méthode de Singapour : cadre de dix (2 × 5 cases), un jeton rond par unité.
       Tracé fin, jamais plein (charte oscilloscope). Négatif = jaune. */
    .cell {
      position: absolute;
      border: 1px solid var(--ink-soft);
      margin: 0 -1px -1px 0;
      pointer-events: none;
      z-index: 1;
    }

    .unit {
      position: absolute;
      border: 1.5px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .blocks-cap {
      position: absolute;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.95rem;
      color: var(--sign);
      pointer-events: none;
    }

    .unit {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
    }

    .unit.neg { color: var(--sign); }
    .unit.neg {
      border-color: var(--sign);
      background: rgba(255, 209, 102, 0.12);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
      height: 3.6rem;
      margin-top: 0.4rem;
    }

    .arrow-btn {
      width: 3.2rem;
      height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease, opacity 0.25s ease;
    }

    .arrow-btn.text {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
    }

    .arrow-btn:hover:not(:disabled),
    .arrow-btn:focus-visible { border-color: var(--accent); color: var(--accent); }

    .arrow-btn:disabled { opacity: 0.3; cursor: default; }

    [hidden] { display: none !important; }

    /* Écrans bas (téléphone couché) : tout se resserre pour tenir */
    @media (max-height: 480px) {
      .stage-top { min-height: 0; padding: 0.9rem 0.5rem 0.2rem; gap: 0.2rem; }
      .stage-top .expr { font-size: 1.4rem; }
      .magic { min-height: 0; font-size: 0.75rem; }
      .stage, .stage-wrap.split .stage { min-height: 80px; padding: 0.8rem 0.5rem; }
      .expr, .ghost { font-size: clamp(1.3rem, 5vh, 2rem); }
      .controls { height: 2.8rem; }
      .arrow-btn { width: 2.6rem; height: 2.6rem; }
    }

    .badges {
      margin-left: auto;
      display: flex;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .badge {
      font: inherit;
      background: none;
      cursor: pointer;
      touch-action: manipulation;
      white-space: nowrap;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
    }

    /* Chapitre Singapour : défi « faire 10 » avec de vrais jetons à glisser */
    .sg {
      flex: 1;
      min-height: 0;
      margin-top: 0.6rem;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      padding: 1rem 0 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .sg-eq {
      min-height: 1.2em;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      line-height: 1.2;
      color: var(--ink);
    }

    .sg-board {
      position: relative;
      width: 100%;
      max-width: 360px;
      flex: 1;
      min-height: 0;
      touch-action: none;
    }

    .sg-cell {
      position: absolute;
      border: 1px solid var(--ink-soft);
      margin: 0 -1px -1px 0;
    }

    .sg-cell.warn { border-color: var(--sign); }

    .sg-dot {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--accent-soft);
      z-index: 2;
    }

    .sg-dot.given { border-color: var(--ink-soft); background: transparent; }
    .sg-dot.free { cursor: grab; touch-action: none; z-index: 3; }
    .sg-dot.drag { z-index: 5; transform: scale(1.15); }
    .sg-dot.out { opacity: 0.35; border-style: dashed; }

    .sg-actions { align-self: stretch; display: flex; gap: 0.5rem; justify-content: flex-start; }

    .sg-act {
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }

    .sg-act:hover { color: var(--accent); border-color: var(--accent); }

    .sg-rules {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 3rem;
      z-index: 12;
      padding: 0.8rem 1rem;
      font-size: 0.8rem;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
    }

    .sg-rules p { margin: 0.25rem 0; }
    #sg { position: relative; }

    .sg-streak { display: flex; gap: 0.4rem; }

    /* Accueil : les ensembles emboîtés, on touche une zone */
    .home {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .home-map { width: 100%; max-width: 420px; flex: none; height: min(56vh, 130vw, 520px); touch-action: none; }
    .home-map ellipse { fill: rgba(61, 224, 138, 0.04); stroke: var(--ink-soft); stroke-width: 1.2; cursor: pointer; }
    .home-map ellipse.sel { stroke: var(--accent); stroke-width: 2; fill: rgba(61, 224, 138, 0.1); }
    .home-map ellipse.lock { stroke-dasharray: 4 5; fill: transparent; }
    .home-map ellipse.done { stroke: var(--accent); }
    .home-map text { fill: var(--ink); font-family: inherit; font-size: 13px; pointer-events: none; text-anchor: middle; }
    .home-map text.lock { fill: var(--ink-soft); }
    .home-map text.big { font-size: 22px; }
    .home-info { margin: 0; font-size: 0.76rem; line-height: 1.45; color: var(--ink-soft); text-align: center; height: 4.4em; flex: none; }

    .home-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      flex: 1;
      min-height: 0;
      align-content: flex-start;
      overflow: hidden;
    }

    .home-list button {
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink-soft);
      border-radius: 999px;
      padding: 0.5rem 0.8rem;
      cursor: pointer;
    }

    .home-list button.done { border-color: var(--accent); color: var(--accent); }
    .home-list button:disabled { opacity: 0.35; cursor: default; }
    .home-list small { opacity: 0.7; margin-left: 0.35rem; }

    .power-unlock { z-index: 45; }
    .pu-title { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sign); }

    .pu-btn {
      font-family: inherit;
      font-size: 1.05rem;
      color: var(--sign);
      background: rgba(255, 209, 102, 0.08);
      border: 1.5px solid var(--sign);
      border-radius: 999px;
      padding: 0.9rem 1.4rem;
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.25);
      cursor: pointer;
    }

    .pu-desc { max-width: 20rem; margin: 0; font-size: 0.8rem; line-height: 1.55; color: var(--ink-soft); text-align: center; }

    /* Premiers : le nombre du haut se touche pour en saisir un autre */
    .pf-eq { cursor: pointer; }
    .pf-eq input {
      width: 6ch;
      font-family: inherit;
      font-size: max(16px, 1em);
      text-align: center;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--accent);
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(8.5rem + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 40;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      color: var(--bg);
      background: var(--accent);
      border-radius: 999px;
      pointer-events: none;
    }

    .univ button:disabled { opacity: 0.3; }
    .tabs { display: none !important; }

    /* Chapitre Pascal : triangle construit sous nos yeux, exploré au doigt */
    .pas-info { min-height: 5.4rem; display: flex; flex-direction: column; align-items: center; gap: 0.35rem; text-align: center; }
    .pas-info .l1 { font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    .pas-info .l2 { font-size: 0.85rem; color: var(--ink-soft); }
    .pas-info .l3 { font-size: 0.8rem; color: var(--ink-soft); }
    .pas-info .hot { color: var(--accent); }
    .pas-info .sym { color: var(--sign); }

    .binom { display: inline-flex; align-items: center; }
    .binom .par { font-size: 2.1em; font-weight: 300; line-height: 1; }
    .binom .stk { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; font-size: 0.85em; }

    .pas-board { position: relative; flex: 1; min-height: 0; width: 100%; touch-action: none; }

    .pas-cell {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1.5px solid var(--ink-soft);
      background: radial-gradient(circle at 35% 30%, rgba(109, 255, 176, 0.12), transparent 70%);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      pointer-events: none;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .pas-cell.sel { border-color: var(--accent); background: var(--accent); color: var(--bg); box-shadow: 0 0 14px rgba(109, 255, 176, 0.6); }
    .pas-cell.par { border-color: var(--accent); background: var(--accent-soft); }
    .pas-cell.sym { border-color: var(--sign); color: var(--sign); background: rgba(255, 209, 102, 0.1); }
    .pas-ghost { position: absolute; transform: translate(-50%, -50%); color: var(--accent); font-weight: 500; pointer-events: none; }

    /* Chapitre Fusion : on déplace des bulles, elles fusionnent */
    .fus-goal { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--ink-soft); text-align: center; }
    .fus-goal b { color: var(--ink); font-weight: 500; font-size: 1.1rem; letter-spacing: 0; }

    .fus-board {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      align-items: center;
      gap: 0.5rem 0.35rem;
      touch-action: none;
    }

    .fus-sep { font-size: 1.3rem; color: var(--ink-soft); }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.1em;
      padding: 0.45rem 0.85rem;
      font-size: clamp(1.2rem, 5.5vw, 1.6rem);
      font-weight: 500;
      color: var(--ink);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      background: radial-gradient(circle at 35% 30%, rgba(109, 255, 176, 0.22), rgba(61, 224, 138, 0.06) 70%);
      box-shadow: 0 0 12px rgba(61, 224, 138, 0.18);
      touch-action: none;
      cursor: grab;
    }

    .chip.sel { border-color: var(--sign); box-shadow: 0 0 14px rgba(255, 209, 102, 0.35); }
    .chip.drag { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) scale(1.12); }
    .chip.target { background: var(--accent-soft); transform: scale(1.08); }
    .chip.ghost-slot { opacity: 0.25; }
    .chip .fr {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.78em;
      line-height: 1.15;
    }

    .chip .fr > span:first-child { padding: 0 0.2em 0.05em; }
    .chip .fr > span:last-child { border-top: 2px solid currentColor; width: 100%; text-align: center; padding-top: 0.05em; }

    .fus-powers { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; min-height: 2.4rem; }

    .fus-powers button {
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--sign);
      background: transparent;
      border: 1px solid var(--sign);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
    }

    .fus-powers button:disabled { color: var(--ink-soft); border-color: var(--hairline); opacity: 0.6; }

    /* Chapitre Calcul : calcul mental animé en continu */
    .calc-eq {
      min-height: 1.3em;
      font-size: clamp(1.5rem, 7vw, 2.3rem);
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }

    .calc-scene { position: relative; width: 100%; max-width: 380px; flex: 1; min-height: 0; }

    .cm-rod {
      position: absolute;
      border: 1.5px solid var(--accent);
      border-radius: 3px;
      background:
        repeating-linear-gradient(180deg, transparent 0 calc(10% - 1px), var(--accent-soft) calc(10% - 1px) 10%);
    }

    .cm-dot {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      background: var(--accent-soft);
    }

    .cm-dot.b { border-color: var(--sign); background: rgba(255, 209, 102, 0.14); }
    .cm-dot.gone { opacity: 0; }

    /* Chapitre Solutions : la réponse dépend de l'ensemble choisi */
    #sol { justify-content: center; gap: 1.2rem; }
    .sol-q { font-size: clamp(1.8rem, 9vw, 2.8rem); font-weight: 500; }
    .sol-in { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
    .sol-a { font-size: clamp(1.6rem, 8vw, 2.4rem); color: var(--accent); min-height: 1.3em; text-align: center; }
    .sol-a.empty { color: var(--sign); }

    /* Chapitre Ensembles : ranger un nombre dans un ensemble */
    #ens { position: relative; justify-content: space-between; }
    .ens-top { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }

    .ens-num {
      display: inline-block;
      padding: 0.4rem 1.1rem;
      font-size: clamp(1.8rem, 9vw, 2.8rem);
      font-weight: 500;
      color: var(--ink);
      border: 1px solid var(--accent);
      border-radius: 14px;
      background: var(--accent-soft);
      touch-action: none;
      cursor: grab;
    }

    .ens-num.drag { position: fixed; z-index: 20; transform: translate(-50%, -50%) scale(1.05); pointer-events: none; }
    .ens-rows { width: 100%; display: flex; flex-direction: column; gap: 0.45rem; }
    .ens-row { display: flex; gap: 0.35rem; justify-content: center; }

    .ens-box {
      flex: 1;
      max-width: 4.2rem;
      height: 3.2rem;
      font-family: inherit;
      font-size: 1.25rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink-soft);
      border-radius: 10px;
      cursor: pointer;
      touch-action: none;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    .ens-row + .ens-row .ens-box { font-size: 1rem; border-style: dashed; }
    .ens-box.hover { background: var(--accent-soft); }
    .ens-box sup, #ensMsg sup, #ensTip sup { font-size: 0.6em; vertical-align: super; margin-left: 0.05em; }
    .ens-box.in { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); border-style: solid; }
    .ens-box.bad { border-color: var(--sign); color: var(--sign); }
    .ens-score { font-size: 0.75rem; color: var(--ink-soft); letter-spacing: 0.1em; min-height: 1em; }

    /* Chapitre Premiers : arbre de facteurs */
    .pf-eq { font-size: clamp(1.4rem, 6.5vw, 2.2rem); text-align: center; }

    .pf-board svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pf-board line { stroke: var(--ink-soft); stroke-width: 1.5; }

    /* Chaque nombre de l'arbre est une bulle ronde, le nombre au centre */
    .pf-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 1.15rem;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      border: 1.5px solid var(--ink-soft);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(109, 255, 176, 0.14), transparent 70%);
      cursor: pointer;
    }

    .pf-node.split { opacity: 0.55; cursor: default; }
    .pf-node.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 12px rgba(61, 224, 138, 0.3); }
    .pf-node.prime { color: var(--sign); border-color: var(--sign); background: radial-gradient(circle at 35% 30%, rgba(255, 209, 102, 0.14), transparent 70%); cursor: default; }

    .pf-morph {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 3;
      white-space: nowrap;
      font-weight: 500;
      font-size: 1.15rem;
      color: var(--accent);
      pointer-events: none;
    }

    /* Au-dessus des diviseurs : le nombre en cours, écrit des trois façons
       (fraction, barre oblique, ÷), avec la case du diviseur qui respire */
    .pf-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      align-self: stretch;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .pf-wheel {
      display: flex;
      align-self: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-x;
      padding: 0.2rem 0;
    }

    .pf-wheel::-webkit-scrollbar { display: none; }

    .pf-item {
      flex: 0 0 46%;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;
      font-size: clamp(1.3rem, 6.2vw, 1.8rem);
      white-space: nowrap;
      transition: opacity 0.1s linear;
    }

    .pf-item:first-child { margin-left: 27%; }
    .pf-item:last-child { margin-right: 27%; }

    .potence { display: inline-flex; align-items: flex-start; }
    .potence .dvd { padding: 0.1em 0.4em 0.9em 0; }
    .potence .dvs { padding: 0.1em 0.2em 0.35em 0.4em; border-left: 2px solid var(--ink-soft); border-bottom: 2px solid var(--ink-soft); }

    .pf-dots { display: flex; justify-content: center; gap: 0.35rem; }
    .pf-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--hairline); }
    .pf-dots span.on { background: var(--accent); }
    .pf-head .n { display: inline-flex; align-items: center; gap: 0.2rem; }
    .pf-head .eqs { color: var(--ink-soft); margin: 0 0.1rem; }
    .pf-head.drop { outline: 1.5px dashed var(--accent); outline-offset: 6px; border-radius: 10px; }
    .pf-head sup { font-size: 0.65em; margin-left: -0.15rem; align-self: flex-start; }
    .pf-head .op { color: var(--ink-soft); }

    .pf-head .fracv { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; }
    .pf-head .fracv .bar { align-self: stretch; height: 2px; background: var(--ink-soft); }

    /* Case du diviseur : zone pleine qui luit comme un écran de phosphore,
       s'allume puis s'éteint lentement (rémanence) */
    .pf-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75em;
      height: 1.75em;
      padding: 0;
      font-size: 0.9em;
      font-weight: 500;
      border-radius: 50%;
      color: var(--bg);
      background: var(--ink);
      animation: phosphor 2.6s ease-out infinite;
    }

    .pf-slot.ok { color: var(--bg); background: var(--accent); box-shadow: 0 0 14px rgba(109, 255, 176, 0.7); animation: none; }
    .pf-slot.no { color: var(--bg); background: var(--sign); box-shadow: 0 0 14px rgba(255, 209, 102, 0.6); animation: none; }

    @keyframes phosphor {
      0% { opacity: 0.95; box-shadow: 0 0 16px rgba(61, 224, 138, 0.8); }
      12% { opacity: 1; box-shadow: 0 0 22px rgba(109, 255, 176, 0.9); }
      100% { opacity: 0.18; box-shadow: 0 0 2px rgba(61, 224, 138, 0.1); }
    }

    @media (prefers-reduced-motion: reduce) { .pf-slot { animation: none; } }

    .pf-primes {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.35rem;
      width: 100%;
      max-width: 400px;
    }

    #pf { position: relative; }

    .pf-tip {
      position: absolute;
      z-index: 10;
      max-width: min(20rem, 92%);
      padding: 0.6rem 0.8rem;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .pf-tip[hidden] { display: none; }

    /* Explication : grand panneau, écrit gros et aéré, qui peut couvrir
       l'arbre (il disparaît au prochain toucher) */
    #pfTip {
      left: 0 !important;
      right: 0;
      max-width: none;
      padding: 1.5rem 1.4rem;
      font-size: 1.02rem;
      border-radius: 16px;
      background: var(--bg);
    }
    .tip-rule { color: var(--ink); font-size: 1.08rem; line-height: 1.6; }
    .tip-ex {
      margin-top: 1.3rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--hairline);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      font-size: clamp(1.1rem, 5vw, 1.35rem);
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    .tip-v { margin-top: 1.3rem; font-size: clamp(1.2rem, 5.6vw, 1.5rem); font-weight: 500; }
    .tip-v.ok { color: var(--accent); }
    .tip-v.no { color: var(--sign); }

    .pf-primes button {
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hairline);
      /* Cercle parfait : même largeur et même hauteur */
      border-radius: 50%;
      width: min(100%, 2.8rem);
      aspect-ratio: 1 / 1;
      height: auto;
      justify-self: center;
      padding: 0;
      cursor: pointer;
      border-color: var(--accent);
      font-size: 0.85rem;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    .pf-primes button.can {
      color: var(--bg);
      background: var(--ink);
      border-color: var(--ink);
      font-weight: 500;
      box-shadow: 0 0 10px rgba(61, 224, 138, 0.35);
    }

    .pf-primes button.drag-clone { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) scale(1.15); width: 2.8rem; }

    .pf-isprime {
      align-self: stretch;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sign);
      background: transparent;
      border: 1.5px solid var(--sign);
      border-radius: 999px;
      padding: 0.55rem;
      cursor: pointer;
    }

    .pf-primes button.dim {
      color: var(--ink-soft);
      border-color: var(--hairline);
      opacity: 0.45;
    }

    .pf-primes button:disabled { opacity: 0.3; }

    .sg-streak span {
      width: 10px;
      height: 10px;
      border: 1px solid var(--hairline);
    }

    .sg-streak span.on { background: var(--accent); border-color: var(--accent); }

    .sg-msg {
      margin: 0;
      min-height: 1.4em;
      font-size: 0.8rem;
      text-align: center;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
      <button class="menu-btn" id="homeBtn" aria-label="Accueil">⌂</button>
      <h1 id="title">Pas à Pas</h1>
      <span class="badges">
        <button class="badge" id="badgeChip" title="Badge cadre de dix" hidden>✦ 10</button>
        <button class="badge" id="badgeMM" title="Badge moins par moins" hidden>✦ (−1)·(−1)</button>
      </span>
    </header>

    <div class="menu-panel" id="menuPanel" hidden>
      <a class="menu-item" href="../">← Portfolio</a>
      <a class="menu-item" href="fiche.html" data-tr="Fiche des règles">Fiche des règles</a>
      <button class="menu-item" id="histBtn" data-tr="Historique">Historique</button>
      <button class="menu-item" id="badgeReset" data-tr="Effacer le badge">Effacer le badge</button>
      <button class="menu-item" id="langBtn" data-tr="English">English</button>
      <button class="menu-item" id="gameBtn"></button>
      <button class="menu-item" id="soundBtn"></button>
      <button class="menu-item" id="profBtn"></button>
    </div>

    <div class="overlay" id="histOverlay" hidden>
      <div class="big">Historique</div>
      <ul class="hist-list" id="histList"></ul>
      <button class="btn" id="histClose">Fermer</button>
    </div>

    <div class="tabs" role="tablist" id="tabs"></div>

    <section class="sg" id="sg" hidden>
      <div class="sg-eq" id="sgEq"></div>
      <div class="sg-board" id="sgBoard"></div>
      <div class="sg-streak" id="sgStreak"><span></span><span></span><span></span></div>
      <div class="sg-actions">
        <button class="sg-act" id="sgSolve" data-tr="Voir la solution">Voir la solution</button>
        <button class="sg-act" id="sgRules" data-tr="Règles">Règles</button>
      </div>
      <div class="sg-rules" id="sgRulesBox" hidden></div>
      <p class="sg-msg" id="sgMsg"></p>
    </section>

    <section class="sg" id="pf" hidden>
      <div class="sg-eq pf-eq" id="pfEq"></div>
      <div class="sg-board pf-board" id="pfBoard"></div>
      <div class="pf-head" id="pfHead" aria-label="diviser par"></div>
      <div class="pf-primes" id="pfPrimes"></div>
      <button class="pf-isprime" id="pfIsPrime" data-tr="est premier">est premier</button>

  <script>
    (function () {
      // ---------- Données ----------
      // Un jeton : { id, t: contenu HTML, k: classe, from: ids d'origine }
      // Une fraction : { frac: true, num: [jetons], den: [jetons] }
      // fx : animation jouée en arrivant sur l'étape (en avançant seulement)

      function T(id, t, k, from) { return { id: id, t: t, k: k || "", from: from || null }; }
      function F(num, den) { return { frac: true, num: num, den: den }; }
      function V(top, bottom, eq) { return { cancel: true, top: top, bottom: bottom, eq: eq || null }; }

      var X = "<i>x</i>";
      var A = "<i>a</i>", B = "<i>b</i>", I = "<i>i</i>";

      var DEMOS = [
        { title: "Singapour", custom: "sg", steps: [{ expr: [] }] },
        { title: "Premiers", custom: "pf", steps: [{ expr: [] }] },
        { title: "Ensembles", custom: "ens", steps: [{ expr: [] }] },
        { title: "Solutions", custom: "sol", steps: [{ expr: [] }] },
        { title: "Calcul", custom: "calc", steps: [{ expr: [] }] },
        { title: "Fusion", custom: "fus", set: "R", steps: [{ expr: [] }] },
        { title: "Pascal", custom: "pas", set: "R", steps: [{ expr: [] }] },
        {
          title: "−( … )",
          split: true,
          steps: [
            {
              top: true,
              expr: [T("m", "−", "op"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              hl: ["m"],
              magic: "« On change les signes à l'intérieur de la parenthèse. »",
              note: "Point de départ, réduit à ce qui compte pour cet exercice : un signe <b>−</b> devant une parenthèse. C'est ici qu'on se trompe le plus souvent."
            },
            {
              expr: [T("m", "(−1)"), T("dot", "·", "op dot"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              hl: ["m"],
              note: "Soustraire, c'est ajouter l'opposé : <b>− ( … )</b> veut dire <b>+ (−1) · ( … )</b>."
            },
            {
              fx: { type: "arc", src: "m", to: ["a"] },
              arcs: [["a"]],
              signs: ["a"],
              expr: [T("m", "(−1)"), T("dot", "·", "op dot"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              note: "Le (−1) va toucher le premier terme : 2<i>x</i>."
            },
            {
              fx: { type: "arc", src: "m", to: ["sb", "b"] },
              arcs: [["a"], ["sb", "b"]],
              signs: ["a", "sb", "b"],
              expr: [T("m", "(−1)"), T("dot", "·", "op dot"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              note: "Puis le deuxième : −3, avec son signe."
            },
            {
              fx: { type: "arc", src: "m", to: ["c"] },
              arcs: [["a"], ["sb", "b"], ["c"]],
              signs: ["a", "sb", "b", "c"],
              expr: [T("m", "(−1)"), T("dot", "·", "op dot"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              note: "Puis le troisième : <i>x</i>. Chaque terme a été touché une fois."
            },
            {
              // Écrit groupe par groupe, dans l'ordre des arcs
              stagger: { d1: 0, lpA: 0, rpA: 0, q1: 1600, m2: 1600, d2: 1600, lpB: 1600, rpB: 1600, q2: 3200, m3: 3200, d3: 3200, lpC: 3200, rpC: 3200 },
              expr: [
                T("m", "(−1)"), T("d1", "·", "op dot"), T("lpA", "(", "par"), T("a", "2" + X), T("rpA", ")", "par"),
                T("q1", "+", "op"), T("m2", "(−1)"), T("d2", "·", "op dot"), T("lpB", "(", "par"), T("sb", "−", "op"), T("b", "3"), T("rpB", ")", "par"),
                T("q2", "+", "op"), T("m3", "(−1)"), T("d3", "·", "op dot"), T("lpC", "(", "par"), T("c", X), T("rpC", ")", "par")
              ],
              note: "On écrit chaque produit en toutes lettres, un par un, sans encore le calculer. Ce n'est pas encore simplifié, juste réparti."
            },
            {
              top: true,
              expr: [T("sa", "−", "op", ["m"]), T("a", "2" + X), T("sb", "+", "op"), T("b", "3"), T("sc", "−", "op", ["m3"]), T("c", X)],
              hl: ["sa", "sb", "sc"],
              note: "Chaque produit se calcule : (−1)·2<i>x</i> = −2<i>x</i>, (−1)·(−3) = +3, (−1)·<i>x</i> = −<i>x</i>. C'est là que la phrase magique prend racine — vraie comme résultat, pas comme méthode."
            },
            {
              expr: [T("sa", "−", "op"), T("a", "2" + X), T("sc", "−", "op"), T("c", X), T("sb", "+", "op"), T("b", "3")],
              hl: ["sa", "a", "sc", "c"],
              note: "On regroupe les <i>x</i> ensemble. Chaque terme voyage <b>avec son signe</b>."
            },
            {
              expr: [T("sa", "−", "op"), T("a", "2" + X), T("sc", "−", "op"), T("c", "1" + X), T("sb", "+", "op"), T("b", "3")],
              hl: ["a", "c"],
              note: "<i>x</i> tout seul, c'est <b>1</b><i>x</i> : le facteur devant <i>x</i> est bien 1, même quand on ne l'écrit pas. Ce sont ces deux facteurs, 2 et 1, qu'on va combiner."
            },
            {
              expr: [T("lp2", "(", "par"), T("sa2", "−", "op"), T("n2", "2"), T("sc2", "−", "op"), T("n1", "1"), T("rp2", ")", "par"), T("xf", X, "", ["a", "c"]), T("sb", "+", "op"), T("b", "3")],
              hl: ["sa2", "n2", "sc2", "n1"],
              note: "On sort <i>x</i> en facteur commun : −2<i>x</i> − 1<i>x</i> = (−2 − 1)·<i>x</i>. Il ne reste plus qu'une addition de deux nombres négatifs à faire."
            },
            {
              top: true,
              fx: { type: "meet", ids: ["sa2", "n2", "sc2", "n1"], blocks: [{ id: "n2", n: -2 }, { id: "n1", n: -1 }] },
              expr: [T("m3", "−3", "", ["sa2", "n2", "sc2", "n1"]), T("xf", X), T("sb", "+", "op"), T("b", "3")],
              magic: "« On regroupe et on calcule. »",
              note: "(−2) + (−1) = −3. Résultat : <b>−3<i>x</i> + 3</b>, sans sauter d'étape."
            }
          ]
        },
        {
          title: "Opposés",
          steps: [
            {
              expr: [T("a", "3" + X), T("sb", "+", "op"), T("b", "7"), T("sc", "−", "op"), T("c", "3" + X), T("sd", "+", "op"), T("d", "5")],
              note: "Point de départ."
            },
            {
              expr: [T("a", "3" + X), T("sb", "+", "op"), T("b", "7"), T("sc", "−", "op"), T("c", "3" + X), T("sd", "+", "op"), T("d", "5")],
              hl: ["a", "sc", "c"],
              note: "+3<i>x</i> et −3<i>x</i> sont <b>opposés</b> : même valeur, signes contraires."
            },
            {
              expr: [T("a", "3" + X), T("sc", "−", "op"), T("c", "3" + X), T("sb", "+", "op"), T("b", "7"), T("sd", "+", "op"), T("d", "5")],
              hl: ["a", "sc", "c"],
              note: "On les rapproche. L'ordre d'une somme ne change rien, tant que chacun garde son signe."
            },
            {
              expr: [V([T("a", "3" + X)], [T("sc", "−", "op"), T("c", "3" + X)], [T("z", "0")]), T("sb", "+", "op"), T("b", "7"), T("sd", "+", "op"), T("d", "5")],
              hl: ["z"],
              note: "Posé comme une soustraction, comme à l'école : 3<i>x</i> au-dessus, −3<i>x</i> en dessous, une barre — ça fait 0."
            },
            {
              expr: [T("z", "0", "", ["a", "sc", "c"]), T("sb", "+", "op"), T("b", "7"), T("sd", "+", "op"), T("d", "5")],
              hl: ["z"],
              note: "3<i>x</i> − 3<i>x</i> = 0. Ils se touchent et s'annulent."
            },
            {
              expr: [T("b", "7"), T("sd", "+", "op"), T("d", "5")],
              note: "0 est neutre pour l'addition : 0 + 7 = 7. On peut l'effacer."
            },
            {
              fx: { type: "meet", ids: ["b", "sd", "d"], blocks: [{ id: "b", n: 7 }, { id: "d", n: 5 }] },
              expr: [T("n7", "12", "", ["b", "sd", "d"])],
              note: "7 + 5 : on complète la dizaine (7 + 3), il reste 2 — 10 + 2 = <b>12</b>."
            }
          ]
        },
        {
          title: "Fraction",
          steps: [
            {
              expr: [F([T("n6", "6"), T("nx", X)], [T("d9", "9")])],
              note: "Point de départ : 6<i>x</i> sur 9."
            },
            {
              expr: [F(
                [T("n2", "2", "", ["n6"]), T("o1", "·", "op dot", ["n6"]), T("n3", "3", "", ["n6"]), T("o2", "·", "op dot"), T("nx", X)],
                [T("d3", "3", "", ["d9"]), T("o3", "·", "op dot", ["d9"]), T("d3b", "3", "", ["d9"])]
              )],
              note: "On écrit chaque nombre comme un <b>produit de facteurs</b> : 6 = 2 · 3 et 9 = 3 · 3."
            },
            {
              expr: [F(
                [T("n2", "2"), T("o1", "·", "op dot"), T("n3", "3"), T("o2", "·", "op dot"), T("nx", X)],
                [T("d3", "3"), T("o3", "·", "op dot"), T("d3b", "3")]
              )],
              hl: ["n3", "d3"],
              note: "Le facteur 3 est présent <b>en haut et en bas</b>."
            },
            {
              fx: { type: "meet", ids: ["n3", "d3"] },
              expr: [F(
                [T("n2", "2"), T("o2", "·", "op dot"), T("nx", X)],
                [T("d3b", "3")]
              )],
              note: "3 ÷ 3 = 1. Diviser le haut et le bas par le même facteur non nul ne change pas la valeur."
            },
            {
              expr: [F([T("n2", "2"), T("nx", X)], [T("d3b", "3")])],
              note: "Résultat : <b>2<i>x</i> sur 3</b>. Attention : on simplifie des <b>facteurs</b> (liés par ×), jamais des termes d'une somme. (<i>x</i> + 3) sur 3 n'est pas <i>x</i>."
            }
          ]
        },
        {
          title: "Piège",
          steps: [
            {
              expr: [F([T("nx", X), T("p", "+", "op"), T("n3", "3")], [T("d3", "3")])],
              note: "Point de départ : (<i>x</i> + 3) sur 3. Tentation : barrer les deux 3."
            },
            {
              expr: [F([T("nx", X), T("p", "+", "op"), T("n3", "3")], [T("d3", "3")])],
              hl: ["n3", "d3"],
              note: "Le 3 du haut est un <b>terme</b> d'une somme, pas un facteur : on n'a pas le droit de le barrer."
            },
            {
              expr: [F([T("nx", X)], [T("d3", "3")]), T("p", "+", "op"), F([T("n3", "3")], [T("d3b", "3", "", ["d3"])])],
              note: "Diviser une somme, c'est diviser <b>chaque terme</b> : (<i>x</i> + 3)/3 = <i>x</i>/3 + 3/3."
            },
            {
              fx: { type: "meet", ids: ["n3", "d3b"] },
              expr: [F([T("nx", X)], [T("d3", "3")]), T("p", "+", "op"), T("one", "1", "", ["n3", "d3b"])],
              note: "3/3 = 1 : là, oui, c'est un vrai facteur commun."
            },
            {
              expr: [F([T("nx", X)], [T("d3", "3")]), T("p", "+", "op"), T("one", "1"), T("ne", "≠", "op"), T("wx", X)],
              hl: ["ne"],
              note: "Résultat : <i>x</i>/3 + 1, pas <i>x</i>. Vérifie avec <i>x</i> = 3 : (3 + 3)/3 = 2, alors que « <i>x</i> » donnerait 3."
            }
          ]
        },
        {
          title: "−×−",
          // Un nombre différent à chaque passage, de plus en plus grand : le
          // demi-tour ne dépend pas de la taille du nombre
          gen: function () { return rotSteps(nextRot()); },
          steps: []
        },
        {
          title: "Distribuer",
          steps: [
            {
              expr: [T("n2", "2"), T("lp", "(", "par"), T("oa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>"), T("pa", "+", "op"), T("qa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>"), T("rp", ")", "par")]
            },
            {
              expr: [T("lp", "(", "par"), T("oa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>"), T("pa", "+", "op"), T("qa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>"), T("rp", ")", "par"), T("pm", "+", "op", ["n2"]),
                     T("lp2", "(", "par", ["n2"]), T("ob", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>", "", ["n2"]), T("pb", "+", "op", ["n2"]), T("qb", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>", "", ["n2"]), T("rp2", ")", "par", ["n2"])]
            },
            {
              expr: [T("oa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>"), T("pm", "+", "op"), T("ob", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>"), T("pa", "+", "op"), T("qa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>"), T("pb", "+", "op"), T("qb", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>")],
              hl: ["oa", "ob"]
            },
            {
              expr: [T("k1", "2", "", ["ob"]), T("oa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>"), T("pa", "+", "op"), T("k2", "2", "", ["qb"]), T("qa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>")]
            },
            {
              summary: true
            }
          ]
        },
        {
          title: "Factoriser",
          steps: [
            {
              expr: [T("k1", "2"), T("oa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>"), T("pa", "+", "op"), T("k2", "2"), T("qa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>")]
            },
            {
              expr: [T("oa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>"), T("pm", "+", "op", ["k1"]), T("ob", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>", "", ["k1"]), T("pa", "+", "op"), T("qa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>"), T("pb", "+", "op", ["k2"]), T("qb", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>", "", ["k2"])]
            },
            {
              expr: [T("lp", "(", "par"), T("oa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>"), T("pa", "+", "op"), T("qa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>"), T("rp", ")", "par"), T("pm", "+", "op"),
                     T("lp2", "(", "par"), T("ob", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>"), T("pb", "+", "op"), T("qb", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>"), T("rp2", ")", "par")],
              hl: ["oa", "qa", "ob", "qb"]
            },
            {
              fx: { type: "meet", ids: ["lp2", "ob", "pb", "qb", "rp2", "pm"] },
              expr: [T("n2", "2", "", ["lp2", "ob", "pb", "qb", "rp2", "pm"]), T("lp", "(", "par"), T("oa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><circle cx=\"5\" cy=\"5\" r=\"4\"/></svg>"), T("pa", "+", "op"), T("qa", "<svg class=\"shape\" viewBox=\"0 0 10 10\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\"/></svg>"), T("rp", ")", "par")]
            },
            {
              summary: true
            }
          ]
        },
        {
          title: "Double",
          steps: [
            {
              expr: [T("l1", "(", "par"), T("x1", X), T("p1", "+", "op"), T("o1", "1"), T("r1", ")", "par"), T("l2", "(", "par"), T("x2", X), T("p2", "+", "op"), T("t2", "2"), T("r2", ")", "par")],
              note: "Deux parenthèses côte à côte : un produit."
            },
            {
              expr: [T("l1", "(", "par"), T("x1", X), T("p1", "+", "op"), T("o1", "1"), T("r1", ")", "par"), T("l2", "(", "par"), T("x2", X), T("p2", "+", "op"), T("t2", "2"), T("r2", ")", "par")],
              hl: ["x1", "o1"],
              note: "Chaque terme de la première parenthèse va multiplier toute la seconde."
            },
            {
              expr: [T("x1", X), T("la", "(", "par"), T("x2", X), T("p2", "+", "op"), T("t2", "2"), T("ra", ")", "par"), T("p1", "+", "op"), T("o1", "1"), T("lb", "(", "par"), T("x2b", X, "", ["x2"]), T("p2b", "+", "op", ["p2"]), T("t2b", "2", "", ["t2"]), T("rb", ")", "par")],
              stagger: { la: 0, ra: 0, lb: 1400, x2b: 1400, p2b: 1400, t2b: 1400, rb: 1400 },
              note: "<i>x</i>(<i>x</i> + 2) + 1(<i>x</i> + 2) : la seconde parenthèse est recopiée pour chacun."
            },
            {
              expr: [T("x1", X), T("m1", "·", "op dot"), T("x2", X), T("p2", "+", "op"), T("x1b", X, "", ["x1"]), T("m2", "·", "op dot"), T("t2", "2"), T("p1", "+", "op"), T("o1", "1"), T("m3", "·", "op dot"), T("x2b", X), T("p2b", "+", "op"), T("o1b", "1", "", ["o1"]), T("m4", "·", "op dot"), T("t2b", "2")],
              stagger: { m1: 0, x1b: 1200, m2: 1200, m3: 2400, o1b: 3600, m4: 3600 },
              note: "Puis chaque parenthèse simple se distribue : quatre produits en tout."

            { expr: E, hl: ["m"], note: "<b>− ( … )</b> veut dire <b>+ (−1) · ( … )</b>." },
            { fx: { type: "arc", src: "m", to: ["a"] }, arcs: [["a"]], signs: ["a"], expr: E, note: "Le (−1) touche le premier terme : " + a + "<i>x</i>." },
            { fx: { type: "arc", src: "m", to: ["sb", "b"] }, arcs: [["a"], ["sb", "b"]], signs: ["a", "sb", "b"], expr: E, note: "Puis le deuxième : −" + b + ", avec son signe." },
            { fx: { type: "arc", src: "m", to: ["c"] }, arcs: [["a"], ["sb", "b"], ["c"]], signs: ["a", "sb", "b", "c"], expr: E, note: "Puis le troisième : " + c + "<i>x</i>." },
            { stagger: { d1: 0, lpA: 0, rpA: 0, q1: 1600, m2: 1600, d2: 1600, lpB: 1600, rpB: 1600, q2: 3200, m3: 3200, d3: 3200, lpC: 3200, rpC: 3200 },
              expr: [T("m", "(−1)"), T("d1", "·", "op dot"), T("lpA", "(", "par"), T("a", a + X), T("rpA", ")", "par"),
                     T("q1", "+", "op"), T("m2", "(−1)"), T("d2", "·", "op dot"), T("lpB", "(", "par"), T("sb", "−", "op"), T("b", s(b)), T("rpB", ")", "par"),
                     T("q2", "+", "op"), T("m3", "(−1)"), T("d3", "·", "op dot"), T("lpC", "(", "par"), T("c", c + X), T("rpC", ")", "par")],
              note: "Chaque produit en toutes lettres, un par un." },
            { top: true, expr: [T("sa", "−", "op", ["m"]), T("a", a + X), T("sb", "+", "op"), T("b", s(b)), T("sc", "−", "op", ["m3"]), T("c", c + X)],
              hl: ["sa", "sb", "sc"], note: "(−1)·" + a + "<i>x</i> = −" + a + "<i>x</i>, (−1)·(−" + b + ") = +" + b + ", (−1)·" + c + "<i>x</i> = −" + c + "<i>x</i>." },
            { expr: [T("sa", "−", "op"), T("a", a + X), T("sc", "−", "op"), T("c", c + X), T("sb", "+", "op"), T("b", s(b))], hl: ["sa", "a", "sc", "c"],
              note: "On regroupe les <i>x</i>, chacun <b>avec son signe</b>." },
            { expr: [T("lp2", "(", "par"), T("sa2", "−", "op"), T("n2", s(a)), T("sc2", "−", "op"), T("n1", s(c)), T("rp2", ")", "par"), T("xf", X, "", ["a", "c"]), T("sb", "+", "op"), T("b", s(b))],
              hl: ["sa2", "n2", "sc2", "n1"], note: "<i>x</i> en facteur commun : (−" + a + " − " + c + ")·<i>x</i>." },
            { top: true, fx: { type: "meet", ids: ["sa2", "n2", "sc2", "n1"], blocks: [{ id: "n2", n: -a }, { id: "n1", n: -c }] },
              expr: [T("m3", "−" + (a + c), "", ["sa2", "n2", "sc2", "n1"]), T("xf", X), T("sb", "+", "op"), T("b", s(b))],
              magic: "« On regroupe et on calcule. »", note: "(−" + a + ") + (−" + c + ") = −" + (a + c) + ". Résultat : <b>−" + (a + c) + "<i>x</i> + " + b + "</b>." }
          ];
        }

        // k·x + p − k·x + q
        function opposites(k, p, q) {
          var E0 = [T("a", k + X), T("sb", "+", "op"), T("b", s(p)), T("sc", "−", "op"), T("c", k + X), T("sd", "+", "op"), T("d", s(q))];
          return [
            { expr: E0, note: "Point de départ." },
            { expr: E0, hl: ["a", "sc", "c"], note: "+" + k + "<i>x</i> et −" + k + "<i>x</i> sont <b>opposés</b>." },
            { expr: [T("a", k + X), T("sc", "−", "op"), T("c", k + X), T("sb", "+", "op"), T("b", s(p)), T("sd", "+", "op"), T("d", s(q))], hl: ["a", "sc", "c"], note: "On les rapproche, chacun avec son signe." },
            { expr: [V([T("a", k + X)], [T("sc", "−", "op"), T("c", k + X)], [T("z", "0")]), T("sb", "+", "op"), T("b", s(p)), T("sd", "+", "op"), T("d", s(q))], hl: ["z"],
              note: "Posé comme une soustraction : ça fait 0." },
            { expr: [T("z", "0", "", ["a", "sc", "c"]), T("sb", "+", "op"), T("b", s(p)), T("sd", "+", "op"), T("d", s(q))], hl: ["z"], note: k + "<i>x</i> − " + k + "<i>x</i> = 0." },
            { expr: [T("b", s(p)), T("sd", "+", "op"), T("d", s(q))], note: "0 est neutre pour l'addition : on l'efface." },
            { fx: { type: "meet", ids: ["b", "sd", "d"], blocks: [{ id: "b", n: p }, { id: "d", n: q }] },
              expr: [T("n7", s(p + q), "", ["b", "sd", "d"])], note: tens(p, q) }
          ];
        }

        // ℕ : k1·x + p + k2·x + q
        function regroup(k1, k2, p, q) {
          var E0 = [T("a", k1 + X), T("sb", "+", "op"), T("b", s(p)), T("sc", "+", "op"), T("c", k2 + X), T("sd", "+", "op"), T("d", s(q))];
          return [
            { expr: E0 },
            { expr: E0, hl: ["a", "c"] },
            { expr: [T("a", k1 + X), T("sc", "+", "op"), T("c", k2 + X), T("sb", "+", "op"), T("b", s(p)), T("sd", "+", "op"), T("d", s(q))], hl: ["a", "c"] },
            { expr: [T("lp", "(", "par"), T("n3", s(k1), "", ["a"]), T("pl", "+", "op", ["sc"]), T("n2", s(k2), "", ["c"]), T("rp", ")", "par"), T("xf", X, "", ["a", "c"]), T("sb", "+", "op"), T("b", s(p)), T("sd", "+", "op"), T("d", s(q))] },
            { fx: { type: "meet", ids: ["n3", "pl", "n2"], blocks: [{ id: "n3", n: k1 }, { id: "n2", n: k2 }] },
              expr: [T("n5", s(k1 + k2), "", ["n3", "pl", "n2"]), T("xf", X), T("sb", "+", "op"), T("b", s(p)), T("sd", "+", "op"), T("d", s(q))] },
            { fx: { type: "meet", ids: ["b", "sd", "d"], blocks: [{ id: "b", n: p }, { id: "d", n: q }] },
              expr: [T("n5", s(k1 + k2)), T("xf", X), T("sb", "+", "op"), T("n12", s(p + q), "", ["b", "sd", "d"])], note: tens(p, q) }
          ];
        }

        // ℕ : m·(a·x + b + c·x)
        function timesParen(m, a, b, c) {
          var PRE = [T("m", s(m)), T("dot", "·", "op dot"), T("lp", "(", "par"), T("a", a + X), T("sb", "+", "op"), T("b", s(b)), T("sc", "+", "op"), T("c", c + X), T("rp", ")", "par")];
          return [
            { top: true, expr: PRE, hl: ["m"], magic: "« On multiplie chaque terme par " + m + ". »" },
            { fx: { type: "arc", src: "m", to: ["a"] }, arcs: [["a"]], signs: ["a"], expr: PRE },
            { fx: { type: "arc", src: "m", to: ["b"] }, arcs: [["a"], ["b"]], signs: ["a", "b"], expr: PRE },
            { fx: { type: "arc", src: "m", to: ["c"] }, arcs: [["a"], ["b"], ["c"]], signs: ["a", "b", "c"], expr: PRE },
            { stagger: { d1: 0, lpA: 0, rpA: 0, q1: 1600, m2: 1600, d2: 1600, lpB: 1600, rpB: 1600, q2: 3200, m3: 3200, d3: 3200, lpC: 3200, rpC: 3200 },
              expr: [T("m", s(m)), T("d1", "·", "op dot"), T("lpA", "(", "par"), T("a", a + X), T("rpA", ")", "par"),
                     T("q1", "+", "op"), T("m2", s(m)), T("d2", "·", "op dot"), T("lpB", "(", "par"), T("b", s(b)), T("rpB", ")", "par"),
                     T("q2", "+", "op"), T("m3", s(m)), T("d3", "·", "op dot"), T("lpC", "(", "par"), T("c", c + X), T("rpC", ")", "par")] },
            { top: true, expr: [T("pa", (m * a) + X, "", ["m", "d1", "lpA", "a", "rpA"]), T("q1", "+", "op"), T("pb", s(m * b), "", ["m2", "d2", "lpB", "b", "rpB"]), T("q2", "+", "op"), T("pc", (m * c) + X, "", ["m3", "d3", "lpC", "c", "rpC"])], magic: "« On regroupe les x. »" },
            { expr: [T("pa", (m * a) + X), T("q2", "+", "op"), T("pc", (m * c) + X), T("q1", "+", "op"), T("pb", s(m * b))], hl: ["pa", "pc"] },
            { expr: [T("lp2", "(", "par"), T("n6", s(m * a), "", ["pa"]), T("pl", "+", "op", ["q2"]), T("n3", s(m * c), "", ["pc"]), T("rp2", ")", "par"), T("xf", X, "", ["pa", "pc"]), T("q1", "+", "op"), T("pb", s(m * b))] },
            { top: true, fx: { type: "meet", ids: ["n6", "pl", "n3"], blocks: [{ id: "n6", n: m * a }, { id: "n3", n: m * c }] },
              expr: [T("n9", s(m * (a + c)), "", ["n6", "pl", "n3"]), T("xf", X), T("q1", "+", "op"), T("pb", s(m * b))] }
          ];
        }

        // (p·c)·x / (c·q)
        function fraction(p, c, q) {
          return [
            { expr: [F([T("n6", s(p * c)), T("nx", X)], [T("d9", s(c * q))])], note: "Point de départ : " + (p * c) + "<i>x</i> sur " + (c * q) + "." },
            { expr: [F([T("n2", s(p), "", ["n6"]), T("o1", "·", "op dot", ["n6"]), T("n3", s(c), "", ["n6"]), T("o2", "·", "op dot"), T("nx", X)],
                       [T("d3", s(c), "", ["d9"]), T("o3", "·", "op dot", ["d9"]), T("d3b", s(q), "", ["d9"])])],
              note: "Chaque nombre en <b>produit de facteurs</b> : " + (p * c) + " = " + p + " · " + c + " et " + (c * q) + " = " + c + " · " + q + "." },
            { expr: [F([T("n2", s(p)), T("o1", "·", "op dot"), T("n3", s(c)), T("o2", "·", "op dot"), T("nx", X)], [T("d3", s(c)), T("o3", "·", "op dot"), T("d3b", s(q))])],
              hl: ["n3", "d3"], note: "Le facteur " + c + " est présent <b>en haut et en bas</b>." },
            { fx: { type: "meet", ids: ["n3", "d3"] }, expr: [F([T("n2", s(p)), T("o2", "·", "op dot"), T("nx", X)], [T("d3b", s(q))])],
              note: c + " ÷ " + c + " = 1 : on divise le haut et le bas par le même facteur." },
            { expr: [F([T("n2", s(p)), T("nx", X)], [T("d3b", s(q))])], note: "Résultat : <b>" + p + "<i>x</i> sur " + q + "</b>." }
          ];
        }

        // (x + n) / n
        function trap(n) {
          return [
            { expr: [F([T("nx", X), T("p", "+", "op"), T("n3", s(n))], [T("d3", s(n))])], note: "(<i>x</i> + " + n + ") sur " + n + ". Tentation : barrer les deux " + n + "." },
            { expr: [F([T("nx", X), T("p", "+", "op"), T("n3", s(n))], [T("d3", s(n))])], hl: ["n3", "d3"], note: "Le " + n + " du haut est un <b>terme</b> d'une somme, pas un facteur." },
            { expr: [F([T("nx", X)], [T("d3", s(n))]), T("p", "+", "op"), F([T("n3", s(n))], [T("d3b", s(n), "", ["d3"])])], note: "Diviser une somme, c'est diviser <b>chaque terme</b>." },
            { fx: { type: "meet", ids: ["n3", "d3b"] }, expr: [F([T("nx", X)], [T("d3", s(n))]), T("p", "+", "op"), T("one", "1", "", ["n3", "d3b"])], note: n + "/" + n + " = 1." },
            { expr: [F([T("nx", X)], [T("d3", s(n))]), T("p", "+", "op"), T("one", "1"), T("ne", "≠", "op"), T("wx", X)], hl: ["ne"],
              note: "Résultat : <i>x</i>/" + n + " + 1, pas <i>x</i>. Avec <i>x</i> = " + n + " : (" + n + " + " + n + ")/" + n + " = 2, pas " + n + "." }
          ];
        }

        // (x + p)(x + q), p ≥ 2
        function double(p, q) {
          return [
            { expr: [T("l1", "(", "par"), T("x1", X), T("p1", "+", "op"), T("o1", s(p)), T("r1", ")", "par"), T("l2", "(", "par"), T("x2", X), T("p2", "+", "op"), T("t2", s(q)), T("r2", ")", "par")], note: "Deux parenthèses côte à côte : un produit." },
            { expr: [T("l1", "(", "par"), T("x1", X), T("p1", "+", "op"), T("o1", s(p)), T("r1", ")", "par"), T("l2", "(", "par"), T("x2", X), T("p2", "+", "op"), T("t2", s(q)), T("r2", ")", "par")], hl: ["x1", "o1"],
              note: "Chaque terme de la première parenthèse multiplie toute la seconde." },
            { expr: [T("x1", X), T("la", "(", "par"), T("x2", X), T("p2", "+", "op"), T("t2", s(q)), T("ra", ")", "par"), T("p1", "+", "op"), T("o1", s(p)), T("lb", "(", "par"), T("x2b", X, "", ["x2"]), T("p2b", "+", "op", ["p2"]), T("t2b", s(q), "", ["t2"]), T("rb", ")", "par")],
              stagger: { la: 0, ra: 0, lb: 1400, x2b: 1400, p2b: 1400, t2b: 1400, rb: 1400 }, note: "La seconde parenthèse est recopiée pour chacun." },
            { expr: [T("x1", X), T("m1", "·", "op dot"), T("x2", X), T("p2", "+", "op"), T("x1b", X, "", ["x1"]), T("m2", "·", "op dot"), T("t2", s(q)), T("p1", "+", "op"), T("o1", s(p)), T("m3", "·", "op dot"), T("x2b", X), T("p2b", "+", "op"), T("o1b", s(p), "", ["o1"]), T("m4", "·", "op dot"), T("t2b", s(q))],
              stagger: { m1: 0, x1b: 1200, m2: 1200, m3: 2400, o1b: 3600, m4: 3600 }, note: "Quatre produits en tout." },
            { expr: [T("sq", X + "²", "", ["x1", "m1", "x2"]), T("p2", "+", "op"), T("dx", q + X, "", ["x1b", "m2", "t2"]), T("p1", "+", "op"), T("ox", p + X, "", ["o1", "m3", "x2b"]), T("p2b", "+", "op"), T("two", s(p * q), "", ["o1b", "m4", "t2b"])],
              note: "<i>x</i>·<i>x</i> = <i>x</i>², <i>x</i>·" + q + " = " + q + "<i>x</i>, " + p + "·<i>x</i> = " + p + "<i>x</i>, " + p + "·" + q + " = " + (p * q) + "." },
            { fx: { type: "meet", ids: ["dx", "p1", "ox"] }, expr: [T("sq", X + "²"), T("p2", "+", "op"), T("tx", (p + q) + X, "", ["dx", "p1", "ox"]), T("p2b", "+", "op"), T("two", s(p * q))],
              note: q + "<i>x</i> + " + p + "<i>x</i> = " + (p + q) + "<i>x</i>. Résultat : <b><i>x</i>² + " + (p + q) + "<i>x</i> + " + (p * q) + "</b>." },
            { summary: true }
          ];
        }

        // a·x + b = c
        function equation(a, b, c) {
          var r = c - b, x = r / a;
          var m1 = "« On passe le " + b + " de l'autre côté en changeant son signe. »", m2 = "« On passe le " + a + " de l'autre côté en divisant. »";
          EN[m1] = "“Move the " + b + " to the other side and flip its sign.”";
          EN[m2] = "“Move the " + a + " to the other side by dividing.”";
          return [
            { top: true, expr: [T("a", a + X), T("p", "+", "op"), T("b", s(b)), T("eq", "=", "op"), T("c", s(c))], magic: m1 },
            { expr: [T("a", a + X), T("p", "+", "op"), T("b", s(b)), T("m1", "−", "op"), T("b1", s(b)), T("eq", "=", "op"), T("c", s(c)), T("m2", "−", "op"), T("b2", s(b))], hl: ["m1", "b1", "m2", "b2"],
              note: "On retire " + b + " <b>des deux côtés</b>, l'égalité reste vraie." },
            { expr: [T("a", a + X), T("p", "+", "op"), T("z", "0", "", ["b", "m1", "b1"]), T("eq", "=", "op"), T("c", s(c)), T("m2", "−", "op"), T("b2", s(b))], hl: ["z"] },
            { top: true, fx: { type: "meet", ids: ["c", "m2", "b2"] }, expr: [T("a", a + X), T("eq", "=", "op"), T("r4", s(r), "", ["c", "m2", "b2"])], magic: m2 },
            { expr: [F([T("a", a + X)], [T("q1", s(a))]), T("eq", "=", "op"), F([T("r4", s(r))], [T("q2", s(a))])], hl: ["q1", "q2"], note: "On divise <b>les deux côtés</b> par " + a + "." },
            { top: true, fx: { type: "meet", ids: ["r4", "q2"] }, expr: [T("xx", X, "", ["a", "q1"]), T("eq", "=", "op"), T("r2", s(x), "", ["r4", "q2"])] }
          ];
        }

        // k·(A + B) → k copies → kA + kB (formes)
        // Les trois écritures : k·(A + B), k copies de (A + B), les A puis les B
        function shapeRows(k, A, B, from) {
          var copies = [], sorted = [], os = [], qs = [], rest = [];
          for (var i = 0; i < k; i++) {
            var f = i && from ? ["n2"] : null;
            if (i) { copies.push(T("pm" + i, "+", "op", f)); rest.push("pm" + i); }
            copies.push(T("lp" + i, "(", "par", f), T("o" + i, A, "", f), T("pq" + i, "+", "op", f), T("q" + i, B, "", f), T("rp" + i, ")", "par", f));
            if (i) { sorted.push(T("pm" + i, "+", "op")); rest.push("lp" + i, "o" + i, "pq" + i, "q" + i, "rp" + i); }
            sorted.push(T("o" + i, A)); os.push("o" + i); qs.push("q" + i);
          }
          qs.forEach(function (id, i) { sorted.push(T(i ? "sq" + i : "pq0", "+", "op")); sorted.push(T(id, B)); });
          return { copies: copies, sorted: sorted, os: os, qs: qs, rest: rest,
                   start: [T("n2", s(k)), T("lp0", "(", "par"), T("o0", A), T("pq0", "+", "op"), T("q0", B), T("rp0", ")", "par")] };
        }
        function distribute(k, A, B) {
          var R = shapeRows(k, A, B, true);
          return [
            { expr: R.start },
            { expr: R.copies },
            { expr: R.sorted, hl: R.os },
            { expr: [T("k1", s(k), "", R.os.slice(1)), T("o0", A), T("pq0", "+", "op"), T("k2", s(k), "", R.qs.slice(1)), T("q0", B)] },
            { summary: true }
          ];
        }
        function factor(k, A, B) {
          var R = shapeRows(k, A, B, false);
          var sorted = R.sorted.map(function (t) {
            var n = Number(t.id.slice(1));
            return n && /^[oq]\d/.test(t.id) ? T(t.id, t.t, t.k, [t.id[0] === "o" ? "k1" : "k2"]) : t;
          });
          return [
            { expr: [T("k1", s(k)), T("o0", A), T("pq0", "+", "op"), T("k2", s(k)), T("q0", B)] },
            { expr: sorted },
            { expr: R.copies, hl: R.os.concat(R.qs) },
            { fx: { type: "meet", ids: R.rest }, expr: [T("n2", s(k), "", R.rest)].concat(R.start.slice(1)) },
            { summary: true }
          ];
        }

        // (x ± n)² et (x + n)(x − n) : la formule, sur des nombres
        function square(sign, n) {
          var m = sign === "+" ? "+" : "−", nn = s(n), ab = nn + X;
          return [
            { top: true, expr: [T("l", "(", "par"), T("a1", X), T("p", m, "op"), T("b1", nn), T("r", ")", "par"), T("sq", "2", "sup")],
              magic: sign === "+" ? "« (a + b)² = a² + 2ab + b² »" : "« (a − b)² = a² − 2ab + b² »" },
            { expr: [T("l", "(", "par"), T("a1", X), T("p", m, "op"), T("b1", nn), T("r", ")", "par"), T("l2", "(", "par", ["sq"]), T("a2", X, "", ["sq"]), T("p2", m, "op", ["sq"]), T("b2", nn, "", ["sq"]), T("r2", ")", "par", ["sq"])],
              note: "Au carré : multiplié par lui-même." },
            { expr: [T("a1", X), T("m1", "·", "op dot"), T("a2", X), T("p", m, "op"), T("a1b", X, "", ["a1"]), T("m2", "·", "op dot"), T("b2", nn), T("p2", m, "op"), T("b1", nn), T("m3", "·", "op dot"), T("a2b", X, "", ["a2"]), T("p3", "+", "op"), T("b1b", nn, "", ["b1"]), T("m4", "·", "op dot"), T("b2b", nn, "", ["b2"])],
              stagger: { m1: 0, a1b: 1200, m2: 1200, m3: 2400, a2b: 2400, p3: 3600, b1b: 3600, m4: 3600, b2b: 3600 }, hl: sign === "+" ? undefined : ["p3"],
              note: sign === "+" ? "Quatre produits." : "(−" + n + ")·(−" + n + ") = +" + (n * n) + " : moins par moins donne plus." },
            { expr: [T("aa", X, "", ["a1", "m1", "a2"]), T("aa2", "2", "sup"), T("p", m, "op"), T("ab", ab, "", ["a1b", "m2", "b2"]), T("p2", m, "op"), T("ba", ab, "", ["b1", "m3", "a2b"]), T("p3", "+", "op"), T("bb", s(n * n), "", ["b1b", "m4", "b2b"])],

              note: m + n + "<i>x</i> " + m + " " + n + "<i>x</i> = " + (m === "+" ? "" : "−") + (2 * n) + "<i>x</i> : <b><i>x</i>² " + m + " " + (2 * n) + "<i>x</i> + " + (n * n) + "</b>." },
            { summary: true }
          ];
        }
        function conj(n) {

          return [
            { top: true, expr: [T("l", "(", "par"), T("a1", X), T("p", "+", "op"), T("b1", nn), T("r", ")", "par"), T("l2", "(", "par"), T("a2", X), T("p2", "−", "op"), T("b2", nn), T("r2", ")", "par")], magic: "« (a + b)(a − b) = a² − b² »" },
            { expr: [T("a1", X), T("m1", "·", "op dot"), T("a2", X), T("p2", "−", "op"), T("a1b", X, "", ["a1"]), T("m2", "·", "op dot"), T("b2", nn), T("p", "+", "op"), T("b1", nn), T("m3", "·", "op dot"), T("a2b", X, "", ["a2"]), T("p3", "−", "op"), T("b1b", nn, "", ["b1"]), T("m4", "·", "op dot"), T("b2b", nn, "", ["b2"])],
              stagger: { m1: 0, a1b: 1200, m2: 1200, m3: 2400, a2b: 2400, p3: 3600, b1b: 3600, m4: 3600, b2b: 3600 } },
            { expr: [T("aa", X, "", ["a1", "m1", "a2"]), T("aa2", "2", "sup"), T("p2", "−", "op"), T("ab", ab, "", ["a1b", "m2", "b2"]), T("p", "+", "op"), T("ba", ab, "", ["b1", "m3", "a2b"]), T("p3", "−", "op"), T("bb", s(n * n), "", ["b1b", "m4", "b2b"])],
              hl: ["p2", "ab", "p", "ba"], note: "−" + n + "<i>x</i> et +" + n + "<i>x</i> sont opposés." },
            { top: true, fx: { type: "meet", ids: ["p2", "ab", "p", "ba"] }, expr: [T("aa", X), T("aa2", "2", "sup"), T("p3", "−", "op"), T("bb", s(n * n))],
              note: "Ils s'annulent : <b><i>x</i>² − " + (n * n) + "</b>." },
            { summary: true }
          ];
        }
        function cplx(n) {
          var nn = s(n), ni = nn + I, nix = nn + I + X;
          return [
            { top: true, expr: [T("l", "(", "par"), T("a1", X), T("p", "+", "op"), T("i1", ni), T("r", ")", "par"), T("l2", "(", "par"), T("a2", X), T("p2", "−", "op"), T("i2", ni), T("r2", ")", "par")],

              stagger: { m1: 0, a1b: 1200, m2: 1200, m3: 2400, a2b: 2400, p3: 3600, i1b: 3600, m4: 3600, i2b: 3600 } },
            { expr: [T("aa", X, "", ["a1", "m1", "a2"]), T("aa2", "2", "sup"), T("p2", "−", "op"), T("ab", nix, "", ["a1b", "m2", "i2"]), T("p", "+", "op"), T("ba", nix, "", ["i1", "m3", "a2b"]), T("p3", "−", "op"), T("bb", s(n * n), "", ["i1b", "m4", "i2b"]), T("ii", I, "", ["i1b", "m4", "i2b"]), T("ii2", "2", "sup")],
              hl: ["p2", "ab", "p", "ba"], note: "Les termes du milieu sont opposés ; (" + n + "<i>i</i>)·(" + n + "<i>i</i>) = " + (n * n) + "<i>i</i>²." },
            { fx: { type: "meet", ids: ["p2", "ab", "p", "ba"] }, expr: [T("aa", X), T("aa2", "2", "sup"), T("p3", "−", "op"), T("bb", s(n * n)), T("ii", I), T("ii2", "2", "sup")] },

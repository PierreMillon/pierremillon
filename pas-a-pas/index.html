<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>Pas à Pas</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05100a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Oscilloscope / vieux moniteur — palette fixe, jamais d'ivoire ici
       (voir REGLES-JEUX.md : esthétique par défaut du catalogue) */
    :root {
      --bg: #05100a;
      --bg-soft: #0a1a12;
      --ink: #3be08a;
      --ink-soft: #2a8f5c;
      --hairline: #123322;
      --accent: #6dffb0;
      --accent-soft: rgba(61, 224, 138, 0.16);
      --sign: #ffd166;
    }

    * { box-sizing: border-box; }

    /* Comportement d'application : la page tient exactement dans l'écran,
       ne défile pas, ne rebondit pas, ne se tire pas vers le bas. */
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      margin: 0;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, var(--bg-soft), var(--bg) 60%);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: max(0.8rem, env(safe-area-inset-top)) 16px max(0.8rem, env(safe-area-inset-bottom));
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    main {
      width: 100%;
      max-width: 640px;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .menu-btn {
      width: 2.1rem;
      height: 2.1rem;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      cursor: pointer;
    }

    .menu-btn:hover, .menu-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

    .menu-panel {
      position: absolute;
      top: 3rem;
      left: 0;
      z-index: 15;
      display: flex;
      flex-direction: column;
      min-width: 10rem;
      background: var(--bg);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      overflow: hidden;
    }

    .menu-item {
      display: block;
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: left;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--hairline);
      padding: 0.8rem 1rem;
      cursor: pointer;
    }

    .menu-item:last-child { border-bottom: none; }

    /* Barre des ensembles, toujours visible : ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ */
    .univ {
      flex: none;
      display: flex;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }

    .univ button {
      flex: 1;
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.35rem 0;
      cursor: pointer;
    }

    .univ button.on { color: var(--ink); border-color: var(--ink-soft); background: var(--accent-soft); }
    .univ button.cur { color: var(--accent); border-color: var(--accent); }
    .menu-item:hover, .menu-item:focus-visible { color: var(--accent); }
    .menu-panel[hidden] { display: none; }

    .back {
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .back:hover { color: var(--accent); }

    .subline {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.3rem;
    }

    .hist-btn {
      font-family: inherit;
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .hist-btn:hover { color: var(--accent); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
      background: rgba(5, 16, 10, 0.95);
    }

    .overlay[hidden] { display: none; }

    .overlay .big {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 300;
      font-size: 1.8rem;
      color: var(--ink);
    }

    .hist-list {
      width: 100%;
      max-width: 22rem;
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
    }

    .hist-list li {
      padding: 0.7rem 0;
      border-top: 1px solid var(--hairline);
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--ink-soft);
    }

    .hist-list li:last-child { border-bottom: 1px solid var(--hairline); }

    .hist-list b {
      display: block;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 0.1rem;
    }

    .btn {
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
    }

    .btn:hover, .btn:focus-visible { background: var(--accent); color: var(--bg); }

    h1 {
      margin: 0;
      font-family: inherit;
      font-weight: 400;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0.7rem 0 0.2rem;
      flex: none;
    }

    .tab {
      font-family: inherit;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { border-color: var(--accent); color: var(--ink); }

    .stage-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: 0.6rem;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
    }

    .stage-top {
      position: relative;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex: none;
      min-height: 100px;
      padding: 1.4rem 0.5rem 0.6rem;
      overflow: hidden;
    }

    .stage-wrap.split .stage-top { display: flex; }

    .stage-divider {
      display: none;
      height: 1px;
      background: var(--hairline);
      margin: 0 1.2rem;
    }

    .stage-wrap.split .stage-divider { display: block; }

    /* Dernière étape : plus de séparateur entre les deux rangées — on
       montre directement départ = résultat, même objet, même fond. */
    .stage-wrap.final .stage-divider {
      background: none;
      height: auto;
      margin: 0.2rem 0;
      display: flex;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--accent);
    }
    .stage-wrap.final .stage-divider::after { content: attr(data-sign); }

    .stage-bottom {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.4rem 0.5rem;
      overflow: hidden;
    }

    .stage-wrap.split .stage {
      min-height: 130px;
      padding: 1.4rem 0.5rem 1.8rem;
    }

    .row-tag {
      position: absolute;
      top: 0.5rem;
      left: 0.7rem;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .stage-wrap.split .row-tag { opacity: 0.65; }

    .dots {
      display: none;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }

    .stage-wrap.split .dots { display: flex; }

    .dots span {
      width: 6px;
      height: 6px;
      border: 1px solid var(--hairline);
      background: transparent;
    }

    .dots span.done { background: var(--ink-soft); border-color: var(--ink-soft); }
    .dots span.now { background: var(--accent); border-color: var(--accent); }
    .dots span.anchor { border-color: var(--accent); }

    .magic {
      margin: 0;
      min-height: 2.4em;
      line-height: 1.35;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--ink-soft);
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .magic.show { opacity: 1; }

    .expr {
      display: flex;
      flex-wrap: nowrap;
      white-space: nowrap;
      align-items: center;
      justify-content: center;
      gap: 0.1em;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 3rem);
      line-height: 1;
      transform-origin: center center;
    }

    .tok {
      display: inline-block;
      padding: 0.08em 0.1em;
      border-radius: 0.2em;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .tok .in { display: inline-block; }
    .tok i { font-style: italic; }
    .tok.op { padding: 0.08em 0.22em; }
    .tok.par { font-weight: 300; }
    .tok.dot { padding: 0.08em 0.05em; }
    .tok.sup { font-size: 0.55em; align-self: flex-start; padding: 0; margin-left: -0.2em; }

    .tok.hl {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tok.sign-hl { color: var(--sign); }

    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .frac .row {
      display: flex;
      align-items: center;
      gap: 0.05em;
      padding: 0.05em 0.2em;
    }

    .frac .bar {
      align-self: stretch;
      height: 2px;
      background: var(--ink);
      margin: 0.08em 0;
    }

    /* Soustraction posée : un terme au-dessus de son opposé, une barre,
       comme à l'école — avant de disparaître, on voit d'où vient le 0 */
    .cancel {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      margin: 0 0.12em;
    }

    .cancel .crow {
      display: flex;
      align-items: center;
      gap: 0.05em;
      padding: 0.02em 0.1em;
    }

    .cancel .cbar {
      align-self: stretch;
      height: 2px;
      background: var(--ink);
      margin: 0.06em 0;
    }

    /* Droite des réels : une flèche de 0 vers la valeur. Multiplier par
       −1 la fait tourner d'un demi-tour autour de 0 (démo −×−). */
    .stage.has-line { align-items: flex-start; padding-top: 1rem; }

    .numsvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .nl-axis { stroke: var(--ink-soft); stroke-width: 1; }
    .nl-lab { fill: var(--ink-soft); font-size: 10px; text-anchor: middle; font-family: inherit; }
    .nl-deg { fill: var(--sign); font-size: 12px; text-anchor: middle; font-family: inherit; }
    .nl-trace { fill: none; stroke: var(--sign); stroke-width: 1.5; stroke-dasharray: 4 5; opacity: 0.55; }
    .nl-trace.live { opacity: 0.9; }
    .nl-vec line { stroke: var(--sign); stroke-width: 3; stroke-linecap: round; }
    .nl-vec path, .nl-vec circle { fill: var(--sign); }

    .numline {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 12px;
      height: 44px;
      pointer-events: none;
    }

    .numline .axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 14px;
      height: 1px;
      background: var(--ink-soft);
    }

    .numline .tick {
      position: absolute;
      top: 10px;
      width: 1px;
      height: 9px;
      background: var(--ink-soft);
    }

    .numline .lab {
      position: absolute;
      top: 24px;
      transform: translateX(-50%);
      font-size: 0.62rem;
      color: var(--ink-soft);
    }

    .numline .vec {
      position: absolute;
      left: 50%;
      top: 13px;
      height: 3px;
      background: var(--sign);
      transform-origin: 0 50%;
    }

    .numline .vec::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -5px;
      border-left: 9px solid var(--sign);
      border-top: 6.5px solid transparent;
      border-bottom: 6.5px solid transparent;
    }

    svg.arcs {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    svg.arcs path {
      fill: none;
      stroke: var(--sign);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .verify-warn {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 30;
      padding: 0.5rem 0.7rem;
      font-size: 0.7rem;
      color: #ff8a7a;
      border: 1px solid #ff8a7a;
      border-radius: 8px;
      background: rgba(20, 5, 5, 0.9);
    }

    /* Mode jeu : deux propositions pour l'étape suivante */
    .stage-wrap { position: relative; }

    .choices {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0.6rem;
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0 0.4rem;
    }

    .choice {
      display: flex;
      justify-content: center;
      overflow: hidden;
      padding: 0.5rem 0.4rem;
      background: var(--bg);
      border: 1px solid var(--ink-soft);
      border-radius: 12px;
      cursor: pointer;
      color: var(--ink);
    }

    .choice .expr { font-size: clamp(1.1rem, 5vw, 1.6rem); }
    .choice.good { border-color: var(--accent); background: var(--accent-soft); }
    .choice.bad { border-color: #ff8a7a; color: #ff8a7a; }

    .summary {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.35rem;
      transform-origin: center center;
    }

    .summary .expr { font-size: clamp(1.4rem, 6vw, 2.2rem); justify-content: flex-start; }
    .sum-row { display: flex; align-items: center; gap: 0.5rem; }

    .sum-eq {
      width: 1.2em;
      font-size: clamp(1.4rem, 6vw, 2.2rem);
      color: var(--accent);
      text-align: center;
    }

    .shape {
      width: 0.72em;
      height: 0.72em;
      vertical-align: -0.04em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
    }

    .ghost {
      position: absolute;
      margin: 0;
      pointer-events: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 3rem);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ghost.traveller { color: var(--sign); z-index: 3; }

    /* Méthode de Singapour : cadre de dix (2 × 5 cases), un jeton rond par unité.
       Tracé fin, jamais plein (charte oscilloscope). Négatif = jaune. */
    .cell {
      position: absolute;
      border: 1px solid var(--ink-soft);
      margin: 0 -1px -1px 0;
      pointer-events: none;
      z-index: 1;
    }

    .unit {
      position: absolute;
      border: 1.5px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .unit.neg {
      border-color: var(--sign);
      background: rgba(255, 209, 102, 0.12);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
      height: 3.6rem;
      margin-top: 0.4rem;
    }

    .arrow-btn {
      width: 3.2rem;
      height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease, opacity 0.25s ease;
    }

    .arrow-btn.text {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
    }

    .arrow-btn:hover:not(:disabled),
    .arrow-btn:focus-visible { border-color: var(--accent); color: var(--accent); }

    .arrow-btn:disabled { opacity: 0.3; cursor: default; }

    [hidden] { display: none !important; }

    /* Écrans bas (téléphone couché) : tout se resserre pour tenir */
    @media (max-height: 480px) {
      .stage-top { min-height: 0; padding: 0.9rem 0.5rem 0.2rem; gap: 0.2rem; }
      .stage-top .expr { font-size: 1.4rem; }
      .magic { min-height: 0; font-size: 0.75rem; }
      .stage, .stage-wrap.split .stage { min-height: 80px; padding: 0.8rem 0.5rem; }
      .expr, .ghost { font-size: clamp(1.3rem, 5vh, 2rem); }
      .controls { height: 2.8rem; }
      .arrow-btn { width: 2.6rem; height: 2.6rem; }
    }

    .badge {
      margin-left: auto;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
    }

    /* Chapitre Singapour : défi « faire 10 » avec de vrais jetons à glisser */
    .sg {
      flex: 1;
      min-height: 0;
      margin-top: 0.6rem;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      padding: 1rem 0 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .sg-eq {
      min-height: 1.2em;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      line-height: 1.2;
      color: var(--ink);
    }

    .sg-board {
      position: relative;
      width: 100%;
      max-width: 360px;
      flex: 1;
      min-height: 0;
      touch-action: none;
    }

    .sg-cell {
      position: absolute;
      border: 1px solid var(--ink-soft);
      margin: 0 -1px -1px 0;
    }

    .sg-cell.warn { border-color: var(--sign); }

    .sg-dot {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--accent-soft);
      z-index: 2;
    }

    .sg-dot.given { border-color: var(--ink-soft); background: transparent; }
    .sg-dot.free { cursor: grab; touch-action: none; z-index: 3; }
    .sg-dot.drag { z-index: 5; transform: scale(1.15); }
    .sg-dot.out { opacity: 0.35; border-style: dashed; }

    .sg-actions { align-self: stretch; display: flex; gap: 0.5rem; justify-content: flex-start; }

    .sg-act {
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }

    .sg-act:hover { color: var(--accent); border-color: var(--accent); }

    .sg-rules {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 3rem;
      z-index: 12;
      padding: 0.8rem 1rem;
      font-size: 0.8rem;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
    }

    .sg-rules p { margin: 0.25rem 0; }
    #sg { position: relative; }

    .sg-streak { display: flex; gap: 0.4rem; }

    /* Accueil : les ensembles emboîtés, on touche une zone */
    .home {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .home-map { width: 100%; max-width: 420px; flex: none; height: min(56vh, 130vw, 520px); touch-action: none; }
    .home-map ellipse { fill: rgba(61, 224, 138, 0.04); stroke: var(--ink-soft); stroke-width: 1.2; cursor: pointer; }
    .home-map ellipse.sel { stroke: var(--accent); stroke-width: 2; fill: rgba(61, 224, 138, 0.1); }
    .home-map ellipse.lock { stroke-dasharray: 4 5; fill: transparent; }
    .home-map ellipse.done { stroke: var(--accent); }
    .home-map text { fill: var(--ink); font-family: inherit; font-size: 13px; pointer-events: none; text-anchor: middle; }
    .home-map text.lock { fill: var(--ink-soft); }
    .home-map text.big { font-size: 22px; }
    .home-info { margin: 0; font-size: 0.76rem; line-height: 1.45; color: var(--ink-soft); text-align: center; height: 4.4em; flex: none; }

    .home-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      flex: 1;
      min-height: 0;
      align-content: flex-start;
      overflow: hidden;
    }

    .home-list button {
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink-soft);
      border-radius: 999px;
      padding: 0.5rem 0.8rem;
      cursor: pointer;
    }

    .home-list button.done { border-color: var(--accent); color: var(--accent); }
    .home-list button:disabled { opacity: 0.35; cursor: default; }
    .home-list small { opacity: 0.7; margin-left: 0.35rem; }

    .power-unlock { z-index: 45; }
    .pu-title { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sign); }

    .pu-btn {
      font-family: inherit;
      font-size: 1.05rem;
      color: var(--sign);
      background: rgba(255, 209, 102, 0.08);
      border: 1.5px solid var(--sign);
      border-radius: 999px;
      padding: 0.9rem 1.4rem;
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.25);
      cursor: pointer;
    }

    .pu-desc { max-width: 20rem; margin: 0; font-size: 0.8rem; line-height: 1.55; color: var(--ink-soft); text-align: center; }

    /* Premiers : le nombre du haut se touche pour en saisir un autre */
    .pf-eq { cursor: pointer; }
    .pf-eq input {
      width: 6ch;
      font-family: inherit;
      font-size: max(16px, 1em);
      text-align: center;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--accent);
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(8.5rem + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 40;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      color: var(--bg);
      background: var(--accent);
      border-radius: 999px;
      pointer-events: none;
    }

    .univ button:disabled { opacity: 0.3; }
    .tabs { display: none !important; }

    /* Chapitre Fusion : on déplace des bulles, elles fusionnent */
    .fus-goal { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--ink-soft); text-align: center; }
    .fus-goal b { color: var(--ink); font-weight: 500; font-size: 1.1rem; letter-spacing: 0; }

    .fus-board {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      align-items: center;
      gap: 0.5rem 0.35rem;
      touch-action: none;
    }

    .fus-sep { font-size: 1.3rem; color: var(--ink-soft); }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.1em;
      padding: 0.45rem 0.85rem;
      font-size: clamp(1.2rem, 5.5vw, 1.6rem);
      font-weight: 500;
      color: var(--ink);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      background: radial-gradient(circle at 35% 30%, rgba(109, 255, 176, 0.22), rgba(61, 224, 138, 0.06) 70%);
      box-shadow: 0 0 12px rgba(61, 224, 138, 0.18);
      touch-action: none;
      cursor: grab;
    }

    .chip.sel { border-color: var(--sign); box-shadow: 0 0 14px rgba(255, 209, 102, 0.35); }
    .chip.drag { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) scale(1.12); }
    .chip.target { background: var(--accent-soft); transform: scale(1.08); }
    .chip.ghost-slot { opacity: 0.25; }
    .chip .fr {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.78em;
      line-height: 1.15;
    }

    .chip .fr > span:first-child { padding: 0 0.2em 0.05em; }
    .chip .fr > span:last-child { border-top: 2px solid currentColor; width: 100%; text-align: center; padding-top: 0.05em; }

    .fus-powers { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; min-height: 2.4rem; }

    .fus-powers button {
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--sign);
      background: transparent;
      border: 1px solid var(--sign);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
    }

    .fus-powers button:disabled { color: var(--ink-soft); border-color: var(--hairline); opacity: 0.6; }

    /* Chapitre Calcul : calcul mental animé en continu */
    .calc-eq {
      min-height: 1.3em;
      font-size: clamp(1.5rem, 7vw, 2.3rem);
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }

    .calc-scene { position: relative; width: 100%; max-width: 380px; flex: 1; min-height: 0; }

    .cm-rod {
      position: absolute;
      border: 1.5px solid var(--accent);
      border-radius: 3px;
      background:
        repeating-linear-gradient(180deg, transparent 0 calc(10% - 1px), var(--accent-soft) calc(10% - 1px) 10%);
    }

    .cm-dot {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      background: var(--accent-soft);
    }

    .cm-dot.b { border-color: var(--sign); background: rgba(255, 209, 102, 0.14); }
    .cm-dot.gone { opacity: 0; }

    /* Chapitre Solutions : la réponse dépend de l'ensemble choisi */
    #sol { justify-content: center; gap: 1.2rem; }
    .sol-q { font-size: clamp(1.8rem, 9vw, 2.8rem); font-weight: 500; }
    .sol-in { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
    .sol-a { font-size: clamp(1.6rem, 8vw, 2.4rem); color: var(--accent); min-height: 1.3em; text-align: center; }
    .sol-a.empty { color: var(--sign); }

    /* Chapitre Ensembles : ranger un nombre dans un ensemble */
    #ens { position: relative; justify-content: space-between; }
    .ens-top { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }

    .ens-num {
      display: inline-block;
      padding: 0.4rem 1.1rem;
      font-size: clamp(1.8rem, 9vw, 2.8rem);
      font-weight: 500;
      color: var(--ink);
      border: 1px solid var(--accent);
      border-radius: 14px;
      background: var(--accent-soft);
      touch-action: none;
      cursor: grab;
    }

    .ens-num.drag { position: fixed; z-index: 20; transform: translate(-50%, -50%) scale(1.05); pointer-events: none; }
    .ens-rows { width: 100%; display: flex; flex-direction: column; gap: 0.45rem; }
    .ens-row { display: flex; gap: 0.35rem; justify-content: center; }

    .ens-box {
      flex: 1;
      max-width: 4.2rem;
      height: 3.2rem;
      font-family: inherit;
      font-size: 1.25rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink-soft);
      border-radius: 10px;
      cursor: pointer;
      touch-action: none;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    .ens-row + .ens-row .ens-box { font-size: 1rem; border-style: dashed; }
    .ens-box.hover { background: var(--accent-soft); }
    .ens-box.in { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); border-style: solid; }
    .ens-box.bad { border-color: var(--sign); color: var(--sign); }
    .ens-score { font-size: 0.75rem; color: var(--ink-soft); letter-spacing: 0.1em; min-height: 1em; }

    /* Chapitre Premiers : arbre de facteurs */
    .pf-eq { font-size: clamp(1.4rem, 6.5vw, 2.2rem); text-align: center; }

    .pf-board svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pf-board line { stroke: var(--ink-soft); stroke-width: 1.5; }

    /* Chaque nombre de l'arbre est une bulle ronde, le nombre au centre */
    .pf-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 1.15rem;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      border: 1.5px solid var(--ink-soft);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(109, 255, 176, 0.14), transparent 70%);
      cursor: pointer;
    }

    .pf-node.split { opacity: 0.55; cursor: default; }
    .pf-node.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 12px rgba(61, 224, 138, 0.3); }
    .pf-node.prime { color: var(--sign); border-color: var(--sign); background: radial-gradient(circle at 35% 30%, rgba(255, 209, 102, 0.14), transparent 70%); cursor: default; }

    .pf-morph {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 3;
      white-space: nowrap;
      font-weight: 500;
      font-size: 1.15rem;
      color: var(--accent);
      pointer-events: none;
    }

    /* Au-dessus des diviseurs : le nombre en cours, écrit des trois façons
       (fraction, barre oblique, ÷), avec la case du diviseur qui respire */
    .pf-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      align-self: stretch;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .pf-head .row { display: flex; align-items: center; justify-content: center; gap: 1.8rem; }
    .pf-head .n { display: inline-flex; align-items: center; gap: 0.35rem; }
    .pf-head sup { font-size: 0.65em; margin-left: -0.15rem; align-self: flex-start; }
    .pf-head .op { color: var(--ink-soft); }

    .pf-head .fracv { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; }
    .pf-head .fracv .bar { align-self: stretch; height: 2px; background: var(--ink-soft); }

    .pf-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.9em;
      height: 1.5em;
      padding: 0 0.2em;
      border: 1.5px dashed var(--ink-soft);
      border-radius: 6px;
      color: var(--ink-soft);
      animation: breathe 2.4s ease-in-out infinite;
    }

    .pf-slot.ok { border-style: solid; border-color: var(--accent); color: var(--accent); animation: none; }
    .pf-slot.no { border-style: solid; border-color: var(--sign); color: var(--sign); animation: none; }

    @keyframes breathe {
      0%, 100% { opacity: 0.45; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    @media (prefers-reduced-motion: reduce) { .pf-slot { animation: none; } }

    .pf-primes {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.35rem;
      width: 100%;
      max-width: 400px;
    }

    #pf { position: relative; }

    .pf-tip {
      position: absolute;
      z-index: 10;
      max-width: min(20rem, 92%);
      padding: 0.6rem 0.8rem;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .pf-tip[hidden] { display: none; }

    .pf-primes button {
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hairline);
      /* Cercle parfait : même largeur et même hauteur */
      border-radius: 50%;
      width: min(100%, 2.8rem);
      aspect-ratio: 1 / 1;
      height: auto;
      justify-self: center;
      padding: 0;
      cursor: pointer;
      border-color: var(--accent);
      font-size: 0.85rem;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    .pf-primes button.dim {
      color: var(--ink-soft);
      border-color: var(--hairline);
      opacity: 0.45;
    }

    .pf-primes button:disabled { opacity: 0.3; }

    .sg-streak span {
      width: 10px;
      height: 10px;
      border: 1px solid var(--hairline);
    }

    .sg-streak span.on { background: var(--accent); border-color: var(--accent); }

    .sg-msg {
      margin: 0;
      min-height: 1.4em;
      font-size: 0.8rem;
      text-align: center;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <main>

  <script>
    (function () {
      // ---------- Données ----------
      // Un jeton : { id, t: contenu HTML, k: classe, from: ids d'origine }
      // Une fraction : { frac: true, num: [jetons], den: [jetons] }
      // fx : animation jouée en arrivant sur l'étape (en avançant seulement)

      function T(id, t, k, from) { return { id: id, t: t, k: k || "", from: from || null }; }
      function F(num, den) { return { frac: true, num: num, den: den }; }
      function V(top, bottom, eq) { return { cancel: true, top: top, bottom: bottom, eq: eq || null }; }

      var X = "<i>x</i>";
      var A = "<i>a</i>", B = "<i>b</i>", I = "<i>i</i>";

      var DEMOS = [
        { title: "Singapour", custom: "sg", steps: [{ expr: [] }] },
        { title: "Premiers", custom: "pf", steps: [{ expr: [] }] },
        { title: "Ensembles", custom: "ens", steps: [{ expr: [] }] },
        { title: "Solutions", custom: "sol", steps: [{ expr: [] }] },
        { title: "Calcul", custom: "calc", steps: [{ expr: [] }] },
        { title: "Fusion", custom: "fus", set: "R", steps: [{ expr: [] }] },
        {
          title: "−( … )",
          split: true,
          steps: [
            {
              top: true,
              expr: [T("m", "−", "op"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              hl: ["m"],
              magic: "« On change les signes à l'intérieur de la parenthèse. »",
              note: "Point de départ, réduit à ce qui compte pour cet exercice : un signe <b>−</b> devant une parenthèse. C'est ici qu'on se trompe le plus souvent."
            },
            {
              expr: [T("m", "(−1)"), T("dot", "·", "op dot"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              hl: ["m"],
              note: "Soustraire, c'est ajouter l'opposé : <b>− ( … )</b> veut dire <b>+ (−1) · ( … )</b>."
            },
            {
              fx: { type: "arc", src: "m", to: ["a"] },
              arcs: [["a"]],
              signs: ["a"],
              expr: [T("m", "(−1)"), T("dot", "·", "op dot"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              note: "Le (−1) va toucher le premier terme : 2<i>x</i>."
            },
            {
              fx: { type: "arc", src: "m", to: ["sb", "b"] },
              arcs: [["a"], ["sb", "b"]],
              signs: ["a", "sb", "b"],
              expr: [T("m", "(−1)"), T("dot", "·", "op dot"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              note: "Puis le deuxième : −3, avec son signe."
            },
            {
              fx: { type: "arc", src: "m", to: ["c"] },
              arcs: [["a"], ["sb", "b"], ["c"]],
              signs: ["a", "sb", "b", "c"],
              expr: [T("m", "(−1)"), T("dot", "·", "op dot"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              note: "Puis le troisième : <i>x</i>. Chaque terme a été touché une fois."
            },
            {
              // Écrit groupe par groupe, dans l'ordre des arcs

      // ---------- Langue (FR / EN) ----------
      // Le français est la langue de référence ; EN traduit l'interface, les
      // onglets, les phrases magiques et les règles de divisibilité.
      var LANG = "fr";
      try { if (localStorage.getItem("pasapas_lang") === "en") LANG = "en"; } catch (e) {}
      var EN = {
        "Singapour": "Singapore", "Premiers": "Primes", "Opposés": "Opposites", "Piège": "Trap",
        "Distribuer": "Distribute", "Factoriser": "Factor", "Identité": "Identity", "Équation": "Equation",
        "« On change les signes à l'intérieur de la parenthèse. »": "“Change the signs inside the brackets.”",
        "« On regroupe et on calcule. »": "“Group and compute.”",
        "« On passe le 3 de l'autre côté en changeant son signe. »": "“Move the 3 to the other side and flip its sign.”",

        "« (a + b)² = a² + 2ab + b² »": "“(a + b)² = a² + 2ab + b²”",

      // ---------- Écriture usuelle ----------
      // Pendant les calculs, tous les produits ont leur point (2·x). À la
      // fin, une étape de plus revient à l'écriture habituelle (2x) : même
      // objet, écrit plus court.
      function needsDots(list) {
        return list.some(function (it, i) {
          if (it.frac) return needsDots(it.num) || needsDots(it.den);
          if (it.cancel) return false;
          if (/\bsup\b/.test(it.k)) return false;
          if (/(\d)(<i>|<svg)|(<\/i>)(<i>)/.test(it.t)) return true;
          return i > 0 && isFactorEnd(list[i - 1]) && isFactorStart(it);
        });
      }
      DEMOS.forEach(function (d) {
        if (d.custom) return;
        var k = d.steps.length - 1;
        while (k >= 0 && (!d.steps[k].expr || d.steps[k].summary)) k--;
        if (k < 0 || !needsDots(d.steps[k].expr)) return;
        var last = d.steps[k];
        d.steps.splice(k + 1, 0, {
          expr: last.expr, implicit: true, line: last.line, trace: last.trace,
          note: "Écriture usuelle : le point de multiplication ne s'écrit plus, c'est le même produit."
        });
      });

      // ---------- Vérification des calculs ----------
      // Chaque étape de chaque démo est recalculée avec des valeurs au hasard
      // pour x, ○ et □ : une expression doit garder la même valeur d'une
      // étape à l'autre ; une équation doit garder la même solution. Une
      // erreur de saisie (signe oublié, mauvais nombre) est donc repérée
      // dès le chargement au lieu d'être découverte à l'écran.

      function tokText(t) {
        return t.t
          .replace(/<svg[^>]*><circle[^>]*\/><\/svg>/g, "O")
          .replace(/<svg[^>]*><rect[^>]*\/><\/svg>/g, "Q")
          .replace(/<[^>]+>/g, "")
          .replace(/i/g, "I")
          .replace(/−/g, "-").replace(/·/g, "*").replace(/²/g, "^2");
      }

      function exprText(list) {
        return list.map(function (it) {
          if (it.frac) return "(" + exprText(it.num) + ")/(" + exprText(it.den) + ")";
          if (it.cancel) return "(" + exprText(it.top) + exprText(it.bottom) + ")";
          if (/\bsup\b/.test(it.k)) return "^" + tokText(it);
          return tokText(it);
        }).join("");
      }

      function evalExpr(str, env) {
        // Multiplication implicite : 2x, 2(…), )(…, x(…
        var js = str.replace(/\s+/g, "")
          .replace(/([0-9xOQabI)])(?=[xOQabI(])/g, "$1*")
          .replace(/\^(\d)/g, "**$1");
        if (!/^[0-9xOQabI+\-*\/().]*$/.test(js)) throw new Error("caractère inattendu : " + str);
        return Function("x", "O", "Q", "a", "b", "I", "return (" + js + ");")(env.x, env.O, env.Q, env.a, env.b, env.I || 0);
      }

      // Valeur complexe [réel, imaginaire] : l'expression est un polynôme
      // de degré ≤ 2 en i ; on le reconstruit par 3 évaluations (i = 0, 1,
      // −1) puis on remplace i² par −1.
      function evalC(str, env) {
        function f(t) { var e = Object.assign({}, env, { I: t }); return evalExpr(str, e); }
        var c0 = f(0), p1 = f(1), m1 = f(-1);
        var c1 = (p1 - m1) / 2, c2 = (p1 + m1) / 2 - c0;
        return [c0 - c2, c1];
      }

      function verifyDemos() {
        var issues = [];
        var envs = [{ x: 1.7, O: 2.3, Q: -0.9, a: 1.3, b: -2.2 }, { x: -3.1, O: 0.6, Q: 4.2, a: -0.7, b: 3.4 }];
        DEMOS.forEach(function (demo) {
          if (demo.custom) return;
          var ref = null, root = null;
          demo.steps.forEach(function (st, i) {
            if (!st.expr || st.summary) return;
            var txt = exprText(st.expr);
            // Sous-expressions posées : le résultat sous la barre doit être juste
            st.expr.forEach(function (it) {
              if (it.cancel && it.eq) {
                envs.forEach(function (env) {
                  var a = evalExpr(exprText(it.top) + exprText(it.bottom), env), b = evalExpr(exprText(it.eq), env);
                  if (Math.abs(a - b) > 1e-9) issues.push(demo.title + " étape " + (i + 1) + " : résultat posé faux");
                });
              }
            });
            if (/[≠]/.test(txt)) return;
            try {
              if (txt.indexOf("=") >= 0) {
                var sides = txt.split("=");
                var f = function (x) { return evalExpr(sides[0], { x: x, O: 0, Q: 0 }) - evalExpr(sides[1], { x: x, O: 0, Q: 0 }); };
                if (root === null) { var f0 = f(0), f1 = f(1); root = -f0 / (f1 - f0); }
                if (Math.abs(f(root)) > 1e-9 || Math.abs(f(root + 1.7)) < 1e-9)
                  issues.push(demo.title + " étape " + (i + 1) + " : « " + txt + " » n'a plus la même solution");
              } else {
                var vals = envs.map(function (env) { return evalC(txt, env); });
                if (ref === null || st.fresh) ref = vals;
                else if (vals.some(function (v, k) { return Math.abs(v[0] - ref[k][0]) > 1e-9 || Math.abs(v[1] - ref[k][1]) > 1e-9; }))
                  issues.push(demo.title + " étape " + (i + 1) + " : « " + txt + " » ne vaut plus l'expression de départ");
              }
            } catch (e) {
              issues.push(demo.title + " étape " + (i + 1) + " : illisible (" + e.message + ")");
            }
          });
        });
        return issues;
      }

      var ISSUES = verifyDemos();
      window.pasAPasIssues = ISSUES;
      if (ISSUES.length) {
        console.error("Pas à Pas — étapes incohérentes :\n" + ISSUES.join("\n"));

      // ---------- Éléments ----------

      function ms(n) { return n * SPEED; }
      function wait(n) { return new Promise(function (r) { setTimeout(r, ms(n)); }); }
      function done(anim) { return anim.finished.catch(function () {}); }

      // ---------- Rendu ----------

      function tokenEl(tok, step) {
        var el = document.createElement("span");
        el.className = "tok " + tok.k;
        el.dataset.id = tok.id;
        if (tok.from) el.dataset.from = tok.from.join(",");
        if (step.hl && step.hl.indexOf(tok.id) >= 0) el.classList.add("hl");
        if (step.signs && step.signs.indexOf(tok.id) >= 0) el.classList.add("sign-hl");
        var inner = document.createElement("span");
        inner.className = "in";
        // Point explicite à l'intérieur d'un jeton : 2x → 2·x, ab → a·b
        inner.innerHTML = step.implicit || /\bsup\b/.test(tok.k) ? tok.t
          : tok.t.replace(/(\d)(<i>|<svg)/g, "$1·$2").replace(/(<\/i>)(<i>)/g, "$1·$2");
        el.appendChild(inner);
        return el;
      }

      // plain = true : rendu simple sans surbrillance (utilisé en haut,
      // "écrit normalement" — l'accent visuel appartient au détail du bas)
      // Ne coupe jamais une expression sur deux lignes (illisible) : elle
      // reste sur une seule ligne et se rétrécit dynamiquement, mesurée
      // une fois posée dans la page, pour tenir exactement dans la largeur
      // disponible.
      function fitOneLine(expr, container) {
        expr.style.transform = "scale(1)";
        var avail = container.clientWidth - 16; // petite marge de sécurité
        var w = expr.scrollWidth;
        if (avail > 0 && w > avail) {
          var scale = Math.max(0.42, avail / w);
          expr.style.transform = "scale(" + scale.toFixed(3) + ")";
        }
      }

      // Produits implicites entre jetons : 2(…), x(…), )(…, x²(… → un point
      // « · » explicite est inséré, sauf à l'étape « écriture usuelle ».
      function isFactorEnd(t) {
        if (!t || t.frac || t.cancel || /\bop\b/.test(t.k)) return false;
        return /(\d|<\/i>|\)|<\/svg>)$/.test(t.t) || /\bsup\b/.test(t.k);
      }
      function isFactorStart(t) {
        if (!t || t.frac || t.cancel || /\bop\b|\bsup\b/.test(t.k)) return false;
        return /^(\(|<i>|<svg)/.test(t.t);
      }
      function withDots(list, implicit) {
        if (implicit) return list;
        var out = [];
        list.forEach(function (it, i) {
          var prev = list[i - 1];
          if (i > 0 && isFactorEnd(prev) && isFactorStart(it)) out.push(T("auto-" + prev.id + "-" + it.id, "·", "op dot"));
          out.push(it);
        });
        return out;
      }

      function buildExprEl(step, plain) {
        var expr = document.createElement("div");
        expr.className = "expr";
        var forStep = plain ? { implicit: step.implicit } : step;
        withDots(step.expr, step.implicit).forEach(function (item) {
          if (item.cancel) {
            var cv = document.createElement("span");
            cv.className = "cancel";
            var topRow = document.createElement("span");
            topRow.className = "crow";
            item.top.forEach(function (t) { topRow.appendChild(tokenEl(t, forStep)); });
            var cbar = document.createElement("span");
            cbar.className = "cbar";
            var botRow = document.createElement("span");
            botRow.className = "crow";
            item.bottom.forEach(function (t) { botRow.appendChild(tokenEl(t, forStep)); });
            // Posé en colonne, comme à l'école : les deux termes l'un sous
            // l'autre, la barre, puis le résultat sous la barre (pas à
            // côté : sinon on croirait lire une fraction)
            cv.appendChild(topRow);
            cv.appendChild(botRow);
            cv.appendChild(cbar);
            if (item.eq) {
              var resRow = document.createElement("span");
              resRow.className = "crow";
              item.eq.forEach(function (t) { resRow.appendChild(tokenEl(t, forStep)); });
              cv.appendChild(resRow);
            }
            expr.appendChild(cv);
          } else if (item.frac) {
            var f = document.createElement("span");
            f.className = "frac";
            var num = document.createElement("span");
            num.className = "row";
            withDots(item.num, step.implicit).forEach(function (t) { num.appendChild(tokenEl(t, forStep)); });
            var bar = document.createElement("span");
            bar.className = "bar";
            var den = document.createElement("span");
            den.className = "row";
            withDots(item.den, step.implicit).forEach(function (t) { den.appendChild(tokenEl(t, forStep)); });
            f.appendChild(num);
            f.appendChild(bar);
            f.appendChild(den);
            expr.appendChild(f);
          } else {
            expr.appendChild(tokenEl(item, forStep));
          }
        });
        return expr;
      }

      // Droite des réels en SVG, sous l'expression. La flèche va de 0 à la
      // valeur ; multiplier par −1 la fait tourner d'un demi-tour autour de
      // 0, et la pointe laisse la trace de son demi-cercle (au-dessus pour
      // le 1er demi-tour, en dessous pour le 2e : un tour complet à la fin).
      var SVGNS = "http://www.w3.org/2000/svg";
      function svgEl(tag, attrs, parent) {
        var e = document.createElementNS(SVGNS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      }

      function arcPath(g, a1, a2) {
        var d = "";
        for (var i = 0; i <= 48; i++) {
          var t = (a1 + (a2 - a1) * i / 48) * Math.PI / 180;
          d += (i ? " L" : "M") + (g.cx + g.r * Math.cos(t)).toFixed(1) + "," + (g.cy - g.r * Math.sin(t)).toFixed(1);
        }
        return d;
      }

      function drawNumLine(step) {
        var W = stage.clientWidth, H = stage.clientHeight;
        var expr = stage.querySelector(".expr");
        var top = expr ? expr.getBoundingClientRect().bottom - stage.getBoundingClientRect().top + 10 : 20;
        var avail = H - top - 24;
        var u = Math.max(8, Math.min(W * 0.84 / 8, avail / 6.8));
        var L = Math.abs(step.line) * u;
        var g = { cx: W / 2, cy: top + 3 * u + 0.4 * u, u: u, r: L };
        var svg = svgEl("svg", { class: "numsvg" });
        stage.appendChild(svg);
        svgEl("line", { x1: g.cx - 4.3 * u, y1: g.cy, x2: g.cx + 4.3 * u, y2: g.cy, class: "nl-axis" }, svg);
        for (var k = -4; k <= 4; k++) {
          var x = g.cx + k * u;
          svgEl("line", { x1: x, y1: g.cy - 4, x2: x, y2: g.cy + 4, class: "nl-axis" }, svg);
          if (k % 2 === 0 || Math.abs(k) === 3) {
            var t = svgEl("text", { x: x, y: g.cy + 16, class: "nl-lab" }, svg);
            t.textContent = k < 0 ? "−" + (-k) : String(k);
          }
        }
        (step.trace || []).forEach(function (tr) {
          svgEl("path", { d: arcPath(g, tr[0], tr[1]), class: "nl-trace" }, svg);
          var mid = (tr[0] + tr[1]) / 2 * Math.PI / 180;
          var lab = svgEl("text", { x: g.cx + (g.r + 12) * Math.cos(mid), y: g.cy - (g.r + 12) * Math.sin(mid) + 4, class: "nl-deg" }, svg);
          lab.textContent = "180°";
        });
        var vec = svgEl("g", { class: "nl-vec" }, svg);
        svgEl("line", { x1: g.cx, y1: g.cy, x2: g.cx + L - 6, y2: g.cy }, vec);
        svgEl("path", { d: "M" + (g.cx + L) + "," + g.cy + " l-10,-6 l0,12 z" }, vec);
        svgEl("circle", { cx: g.cx, cy: g.cy, r: 3 }, vec);
        var ang = step.line < 0 ? 180 : 0;
        vec.setAttribute("transform", "rotate(" + (-ang) + " " + g.cx + " " + g.cy + ")");
        stage._nl = { svg: svg, vec: vec, g: g };
      }

      // Récapitulatif : toutes les écritures de la démo sur une seule page,
      // l'une sous l'autre, reliées par « = » — on voit d'un coup que c'est
      // le même objet écrit de plusieurs façons.
      function buildSummary() {
        var col = document.createElement("div");
        col.className = "summary";
        var prev = "";
        DEMOS[demoIndex].steps.forEach(function (st) {
          if (!st.expr) return;
          var e = buildExprEl(st, true);
          var key = e.textContent.replace(/\s+/g, "");
          if (key === prev) return;
          var row = document.createElement("div");
          row.className = "sum-row";
          var eq = document.createElement("span");
          eq.className = "sum-eq";
          eq.textContent = prev ? "=" : "";
          row.appendChild(eq);
          // Pas d'identifiants : ces jetons ne participent pas aux glissements
          e.querySelectorAll("[data-id]").forEach(function (t) { t.removeAttribute("data-id"); });
          row.appendChild(e);
          col.appendChild(row);
          prev = key;
        });
        stage.appendChild(col);
        var avail = stage.clientHeight - 16, hgt = col.scrollHeight;
        var wAvail = stage.clientWidth - 16, wid = col.scrollWidth;
        var k = Math.min(1, avail / hgt, wAvail / wid);
        col.style.transform = "scale(" + k.toFixed(3) + ")";
        col.querySelectorAll(".sum-row").forEach(function (r, i) {
          r.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }],
            { duration: ms(500), delay: ms(300 + i * 450), easing: "ease-out", fill: "backwards" });
        });
      }

      function build(step) {
        stage.innerHTML = "";
        if (step.summary) { buildSummary(); return; }
        var expr = buildExprEl(step, false);
        stage.appendChild(expr);
        fitOneLine(expr, stage);
        stage.classList.toggle("has-line", step.line !== undefined);
        if (step.line !== undefined) drawNumLine(step);
        if (step.arcs) drawArcs(step.arcs, false);
      }

      // Flèches en arc, comme on les dessine à la main : du (−1) vers chaque
      // terme qu'il touche. Le dernier arc d'une étape se trace lentement,
      // puis reste affiché aux étapes suivantes.
      function arcGeom(srcId, toIds) {
        var base = stage.getBoundingClientRect();
        var src = stage.querySelector('.tok[data-id="' + srcId + '"]');
        if (!src) return null;
        var rs = src.getBoundingClientRect();
        var l = Infinity, r = -Infinity, t = Infinity;
        toIds.forEach(function (id) {
          var el = stage.querySelector('.tok[data-id="' + id + '"]');
          if (!el) return;
          var b = el.getBoundingClientRect();
          l = Math.min(l, b.left); r = Math.max(r, b.right); t = Math.min(t, b.top);
        });
        if (!isFinite(l)) return null;
        var x1 = rs.left + rs.width / 2 - base.left, y1 = rs.top - base.top + 2;
        var x2 = (l + r) / 2 - base.left, y2 = t - base.top + 2;
        var lift = Math.min(y1 - 6, 22 + Math.abs(x2 - x1) * 0.28);
        var cy = Math.min(y1, y2) - lift * 2;
        return "M" + x1 + "," + y1 + " Q" + (x1 + x2) / 2 + "," + cy + " " + x2 + "," + y2;
      }

      function arcSvg() {
        var svg = stage.querySelector("svg.arcs");
        if (!svg) {
          svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "arcs");
          svg.innerHTML = '<defs><marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--sign)"/></marker></defs>';
          stage.appendChild(svg);
        }
        return svg;
      }

      function addArc(d) {
        var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("marker-end", "url(#arrowHead)");
        arcSvg().appendChild(path);
        return path;
      }

      function drawArcs(list, skipLast) {
        list.forEach(function (to, i) {
          if (skipLast && i === list.length - 1) return;
          var d = arcGeom("m", to);
          if (d) addArc(d);
        });
      }

      function fxArc(fx) {
        var d = arcGeom(fx.src, fx.to);
        if (!d) return Promise.resolve();
        var path = addArc(d);
        var len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        path.setAttribute("marker-end", "");
        return done(path.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
          { duration: ms(1800), easing: "cubic-bezier(.4,0,.3,1)", fill: "forwards" })).then(function () {
          path.setAttribute("marker-end", "url(#arrowHead)");
          fx.to.forEach(function (id) {
            var el = stage.querySelector('.tok[data-id="' + id + '"]');
            if (el) done(el.animate([{ transform: "scale(1)" }, { transform: "scale(1.25)" }, { transform: "scale(1)" }],
              { duration: ms(700), easing: "ease-out" }));
          });
          return wait(700);
        });
      }

      // Multiplier par −1 : la flèche tourne d'un demi-tour autour de 0,
      // lentement, dans le plan — elle ne « saute » pas de 3 à −3.
      // La flèche tourne vraiment, dans le plan : la pointe trace son
      // demi-cercle en direct, l'angle parcouru s'affiche en dessous.
      function fxRotate(fx) {
        var nl = stage._nl;
        if (!nl) return Promise.resolve();
        var g = nl.g;
        var live = svgEl("path", { class: "nl-trace live", d: "" }, nl.svg);
        var deg = svgEl("text", { x: g.cx, y: fx.to > 180 ? g.cy + g.r + 30 : g.cy - g.r - 10, class: "nl-deg" }, nl.svg);
        return wait(500).then(function () {
          return new Promise(function (res) {
            var dur = ms(3200), t0 = performance.now();
            function step(now) {
              var p = Math.min(1, (now - t0) / (dur || 1));
              var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
              var a = fx.from + (fx.to - fx.from) * e;
              nl.vec.setAttribute("transform", "rotate(" + (-a) + " " + g.cx + " " + g.cy + ")");
              live.setAttribute("d", arcPath(g, fx.from, a));
              deg.textContent = Math.round(a - fx.from) + "°";
              if (p < 1) requestAnimationFrame(step); else res();
            }
            requestAnimationFrame(step);
          });
        }).then(function () { return wait(600); });
      }

      // ---------- Rangée du haut ("écrit normalement") ----------

      var magicEl = document.getElementById("magic");

      function renderTop(step, animate) {
        var old = stageTop.querySelector(".expr");
        var expr = buildExprEl(step, true);
        if (animate && old) {
          stageTop.insertBefore(expr, magicEl);
          fitOneLine(expr, stageTop);
          var target = expr.style.transform || "scale(1)";
          expr.style.opacity = "0";
          var outA = old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(200), easing: "ease-in", fill: "forwards" });
          done(outA).then(function () { old.remove(); });
          requestAnimationFrame(function () {
            done(expr.animate([
              { opacity: 0, transform: target + " translateY(6px)" },
              { opacity: 1, transform: target + " translateY(0)" }
            ], { duration: ms(380), delay: ms(160), easing: "ease-out", fill: "both" }));
          });
        } else {
          if (old) old.remove();
          stageTop.insertBefore(expr, magicEl);
          fitOneLine(expr, stageTop);
        }

        // La « phrase magique » : ce qu'on entend classiquement, pas
        // rigoureux, contrasté avec le détail sans raccourci en dessous.
        magicEl.classList.remove("show");
        setTimeout(function () {
          magicEl.innerHTML = tr(step.magic || "");
          if (step.magic) magicEl.classList.add("show");
        }, animate ? ms(200) : 0);
      }

      function topAnchorStep(demo, to) {
        var anchor = demo.steps[0];
        for (var i = 0; i <= to && i < demo.steps.length; i++) {
          if (demo.steps[i].top) anchor = demo.steps[i];
        }
        return anchor;
      }

      var stageDivider = document.querySelector(".stage-divider");
      var stageTopTag = document.querySelector(".stage-top .row-tag");
      var stageBottomTag = document.querySelector(".stage-bottom .row-tag");

      function updateRowTags(isFinal) {
        if (stageTopTag) stageTopTag.textContent = tr(isFinal ? "départ" : "sauter des étapes");
        if (stageBottomTag) stageBottomTag.textContent = tr(isFinal ? "résultat" : "pas à pas");
      }

      // Aligne la rangée du haut sur l'étape-ancre la plus proche : elle ne
      // bouge qu'à certaines étapes, pendant que le bas détaille tout. À la
      // toute dernière étape, plus de séparateur : le haut revient montrer
      // la formule de départ, le bas montre le résultat — même objet.
      function syncTop(animate) {
        var demo = DEMOS[demoIndex];
        // Page récapitulative : elle contient déjà le départ, pas de rangée du haut
        stageWrap.classList.toggle("split", !!demo.split && !demo.steps[cur].summary);
        if (!demo.split) { stageWrap.classList.remove("final"); return; }
        var isFinal = cur === demo.steps.length - 1;
        stageWrap.classList.toggle("final", isFinal);
        // Une équation n'est pas égale à sa solution : elle lui est
        // équivalente (mêmes solutions), d'où ⇔ plutôt que =.
        stageDivider.dataset.sign = demo.finalSign || "=";
        updateRowTags(isFinal);
        var anchor = isFinal ? demo.steps[0] : topAnchorStep(demo, cur);
        if (anchor !== lastTopStep) {
          renderTop(anchor, animate);
          lastTopStep = anchor;
        }
      }

      function snapshot() {
        var base = stage.getBoundingClientRect();
        var map = {};
        stage.querySelectorAll(".tok").forEach(function (el) {
          var r = el.getBoundingClientRect();
          map[el.dataset.id] = {
            el: el,
            x: r.left - base.left,
            y: r.top - base.top,
            w: r.width,
            h: r.height,
            html: el.querySelector(".in").innerHTML
          };
        });
        return map;
      }

      function center(s) { return { x: s.x + s.w / 2, y: s.y + s.h / 2 }; }

      function ghostOf(s, extraClass) {
        var g = document.createElement("span");
        g.className = "ghost " + (extraClass || "");
        g.style.left = s.x + "px";
        g.style.top = s.y + "px";
        g.style.width = s.w + "px";
        g.style.height = s.h + "px";
        g.innerHTML = s.html;
        stage.appendChild(g);
        return g;
      }

      // ---------- Effets ----------

      // Le premier exemplaire du signe garde l'identifiant "m" : il migre
      // tout seul via le repositionnement normal (l'étape suivante le place
      // déjà au bon endroit, avec le temps que ça prend). On ne fait donc
      // voyager ici que les copies supplémentaires — une par une, chacune
      // restant posée à l'endroit où elle atterrit, pas de disparition.
      function fxTouch(fx) {
        var snap = snapshot();
        var src = snap[fx.src];
        if (!src) return Promise.resolve();

        // Très lent, volontairement : c'est la troisième fois que la
        // vitesse de cette animation est signalée trop rapide. Chaque −1
        // doit se voir clairement se développer et voyager, pas juste
        // clignoter d'un état à l'autre.
        var extraTargets = fx.targets.slice(1);
        var chain = wait(700);
        extraTargets.forEach(function (id) {
          var t = snap[id];
          if (!t) return;
          chain = chain.then(function () {
            var g = ghostOf(src, "traveller");
            g.innerHTML = "−1";
            var to = {
              x: center(t).x - center(src).x,
              y: t.y - src.y - src.h * 0.75
            };
            var mid = { x: to.x * 0.5, y: Math.min(0, to.y) - 44 };
            var a = g.animate([
              { transform: "translate(0,0) scale(0.7)" },
              { transform: "translate(" + mid.x + "px," + mid.y + "px) scale(0.7)" },
              { transform: "translate(" + to.x + "px," + to.y + "px) scale(0.7)" }
            ], { duration: ms(2200), easing: "ease-in-out", fill: "forwards" });
            // Le fantôme reste affiché, posé à l'arrivée — il ne s'efface
            // pas : c'est lui qui deviendra visuellement le jeton final.
            return done(a).then(function () {
              var hit = t.el.animate([
                { transform: "scale(1)", color: "var(--ink)" },
                { transform: "scale(1.3)", color: "var(--sign)" },
                { transform: "scale(1)", color: "var(--sign)" }
              ], { duration: ms(700), easing: "ease-out", fill: "forwards" });
              return done(hit);
            }).then(function () { return wait(800); });
          });
        });

        return chain.then(function () { return wait(250); });
      }

      // Méthode de Singapour (programme MOE, P1) : addition par le « cadre
      // de dix » — deux rangées de 5 cases. Chaque nombre part de son jeton
      // en jetons ronds qui remplissent les cases, dans l'ordre ; le second
      // nombre vient compléter les cases vides (« faire 10 » quand ça
      // déborde, cadre suivant). La structure 5 + 5 se lit sans compter.
      // Ne gère que des nombres de même signe (pas d'annulation ici).
      function fxBlocks(blocks, snap, cx, units) {
        var cell = 22, dot = 14, apart = 12;
        var rows = blocks.map(function (b) { return { b: b, p: snap[b.id] }; })
          .filter(function (r) { return r.p; });
        if (!rows.length) return Promise.resolve();

        var total = 0;
        rows.forEach(function (r) { total += Math.abs(r.b.n); });
        var frames = Math.max(1, Math.ceil(total / 10));
        var fw = cell * 5;
        var left0 = cx - (frames * fw + (frames - 1) * apart) / 2;
        var y0 = 0;
        rows.forEach(function (r) { y0 = Math.max(y0, r.p.y + r.p.h); });
        var top = y0 + 18;

        function slot(k) {
          var f = Math.floor(k / 10), r = Math.floor((k % 10) / 5), c = k % 5;
          return { x: left0 + f * (fw + apart) + c * cell + cell / 2, y: top + r * cell + cell / 2 };
        }

        // 1. Le cadre apparaît, vide
        var appear = [];
        for (var k = 0; k < frames * 10; k++) {
          var s = slot(k);
          var c = document.createElement("span");
          c.className = "cell";
          c.style.left = (s.x - cell / 2) + "px";
          c.style.top = (s.y - cell / 2) + "px";
          c.style.width = cell + "px";
          c.style.height = cell + "px";
          stage.appendChild(c);
          units.push({ el: c, x: s.x, y: s.y, at: "translate(0,0)" });
          appear.push(done(c.animate([{ opacity: 0 }, { opacity: 1 }],
            { duration: ms(500), easing: "ease-out", fill: "backwards" })));
        }

        // 2. Chaque nombre part de son jeton et remplit les cases suivantes
        var next = 0;
        var chain = Promise.all(appear).then(function () { return wait(300); });
        rows.forEach(function (r) {
          var n = Math.abs(r.b.n);
          var first = next;
          next += n;
          chain = chain.then(function () {
            var from = center(r.p);
            var flights = [];
            for (var i = 0; i < n; i++) {
              var s = slot(first + i);
              var el = document.createElement("span");
              el.className = "unit" + (r.b.n < 0 ? " neg" : "");
              el.style.left = (s.x - dot / 2) + "px";
              el.style.top = (s.y - dot / 2) + "px";
              el.style.width = dot + "px";
              el.style.height = dot + "px";
              stage.appendChild(el);
              units.push({ el: el, x: s.x, y: s.y, at: "translate(0,0)" });
              flights.push(done(el.animate([
                { transform: "translate(" + (from.x - s.x) + "px," + (from.y - s.y) + "px) scale(0.3)", opacity: 0 },
                { transform: "translate(0,0) scale(1)", opacity: 1 }
              ], { duration: ms(700), delay: ms(320 * i), easing: "cubic-bezier(.3,1.2,.5,1)", fill: "backwards" })));
            }
            return Promise.all(flights).then(function () { return wait(600); });
          });
        });

        return chain.then(function () { return wait(900); });
      }

      function fxMeet(fx, vanished) {
        setTimeout(SND.meet, ms(900));
        var snap = snapshot();
        var parts = fx.ids.map(function (id) { return snap[id]; }).filter(Boolean);
        if (!parts.length) return Promise.resolve();
        var cx = 0, cy = 0;
        parts.forEach(function (p) { var c = center(p); cx += c.x; cy += c.y; });
        cx /= parts.length; cy /= parts.length;

        parts.forEach(function (p) { p.el.classList.add("hl"); });

        var units = [];
        var pre = wait(350);
        if (fx.blocks && hasBadge()) pre = pre.then(function () { return fxBlocks(fx.blocks, snap, cx, units); });

        return pre.then(function () {
          // Les carrés rejoignent le point de fusion en même temps que les
          // jetons : c'est de là que sort le résultat.
          units.forEach(function (u) {
            var a = u.el.animate([
              { transform: u.at, opacity: 1 },
              { transform: "translate(" + (cx - u.x) + "px," + (cy - u.y) + "px) scale(0.2)", opacity: 0 }
            ], { duration: ms(650), easing: "ease-in", fill: "forwards" });
            done(a).then(function () { u.el.remove(); });
          });
          var anims = parts.map(function (p) {
            var c = center(p);
            vanished[p.el.dataset.id] = true;
            return done(p.el.animate([
              { transform: "translate(0,0) scale(1)", opacity: 1 },
              { transform: "translate(" + (cx - c.x) * 0.85 + "px," + (cy - c.y) * 0.85 + "px) scale(0.9)", opacity: 1, offset: 0.7 },
              { transform: "translate(" + (cx - c.x) + "px," + (cy - c.y) + "px) scale(0.3)", opacity: 0 }
            ], { duration: ms(650), easing: "ease-in", fill: "forwards" }));
          });
          return Promise.all(anims);
        });
      }

      // ---------- Transition entre deux étapes ----------

      function transition(to, forward) {
        var demo = DEMOS[demoIndex];
        var step = demo.steps[to];
        var vanished = {};
        var pre = Promise.resolve();

        if (forward && step.fx) {
          if (step.fx.type === "touch") pre = fxTouch(step.fx);
          if (step.fx.type === "meet") pre = fxMeet(step.fx, vanished);
          if (step.fx.type === "rotate") pre = fxRotate(step.fx);
          if (step.fx.type === "arc") pre = fxArc(step.fx);
        }

        return pre.then(function () {
          var old = snapshot();
          build(step);
          // Les fantômes du glissement du signe restent posés jusqu'ici :
          // le vrai jeton est maintenant en place au même endroit, donc on
          // les retire sans qu'aucune image double soit jamais visible.
          stage.querySelectorAll(".ghost.traveller").forEach(function (g) { g.remove(); });
          var neu = snapshot();
          var anims = [];

          Object.keys(neu).forEach(function (id) {
            var n = neu[id];
            var o = old[id];
            if (o && !vanished[id]) {
              var dx = o.x - n.x, dy = o.y - n.y;
              if (Math.abs(dx) > 30) {
                // Changement de place : le jeton décrit un demi-cercle. Vers
                // la droite il passe au-dessus, vers la gauche en dessous —
                // deux termes qui s'échangent se croisent sans se heurter.
                var lift = Math.min(70, Math.abs(dx) * 0.45) * (dx < 0 ? -1 : 1);
                var kf = [];
                for (var q = 0; q <= 8; q++) {
                  var t = q / 8, sn = Math.sin(Math.PI * t);
                  kf.push({ transform: "translate(" + (dx * (1 - t)) + "px," + (dy * (1 - t) + lift * sn) + "px) scale(" + (1 + 0.12 * sn) + ")" });
                }
                anims.push(done(n.el.animate(kf, { duration: ms(1100), easing: "cubic-bezier(.45,0,.3,1)" })));
              } else if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                anims.push(done(n.el.animate([
                  { transform: "translate(" + dx + "px," + dy + "px)" },
                  { transform: "translate(0,0)" }
                ], { duration: ms(650), easing: "cubic-bezier(.5,0,.2,1)" })));
              }
              if (o.html !== n.html) {
                anims.push(done(n.el.querySelector(".in").animate([
                  { transform: "rotateX(90deg)", opacity: 0.2 },
                  { transform: "rotateX(0deg)", opacity: 1 }
                ], { duration: ms(450), easing: "ease-out" })));
              }
            } else if (step.instant && step.instant.indexOf(id) >= 0) {
              // Déjà amené en place par le glissement du signe (ghost) :
              // apparaît directement, sans reprendre une deuxième animation.
            } else {
              var from = forward && n.el.dataset.from
                ? n.el.dataset.from.split(",").map(function (f) { return old[f]; }).filter(Boolean)
                : [];
              if (from.length) {
                var fx = 0, fy = 0;
                from.forEach(function (f) { var c = center(f); fx += c.x; fy += c.y; });
                fx /= from.length; fy /= from.length;
                var c = center(n);
                anims.push(done(n.el.animate([
                  { transform: "translate(" + (fx - c.x) + "px," + (fy - c.y) + "px) scale(0.4)", opacity: 0 },
                  { transform: "translate(0,0) scale(1)", opacity: 1 }
                ], { duration: ms(600), easing: "cubic-bezier(.3,1.4,.5,1)" })));
              } else {
                anims.push(done(n.el.animate([
                  { transform: "scale(0.5)", opacity: 0 },
                  { transform: "scale(1)", opacity: 1 }
                ], { duration: ms(step.stagger ? 700 : 450), delay: ms(step.stagger && forward ? (step.stagger[id] || 0) + 300 : 200), easing: "ease-out", fill: "backwards" })));
              }
            }
          });

          // Jetons qui disparaissent sans effet : fondu sur place
          Object.keys(old).forEach(function (id) {
            if (neu[id] || vanished[id]) return;
            var g = ghostOf(old[id]);
            anims.push(done(g.animate([
              { transform: "scale(1)", opacity: 1 },
              { transform: "scale(0.6)", opacity: 0 }
            ], { duration: ms(400), easing: "ease-in", fill: "forwards" })).then(function () { g.remove(); }));
          });

          return Promise.all(anims);
        });
      }

      // ---------- Navigation ----------

      var dotsTopEl = document.getElementById("dotsTop");
      var dotsBottomEl = document.getElementById("dotsBottom");

      function buildDots(demo) {
        dotsBottomEl.innerHTML = "";
        demo.steps.forEach(function (s) {
          var d = document.createElement("span");
          if (s.top) d.classList.add("anchor");
          dotsBottomEl.appendChild(d);
        });
        dotsTopEl.innerHTML = "";
        demo.steps.forEach(function (s) {
          if (!s.top) return;
          dotsTopEl.appendChild(document.createElement("span"));
        });
      }

      function updateDots(demo, to) {
        var bDots = dotsBottomEl.children;
        for (var i = 0; i < bDots.length; i++) {
          bDots[i].classList.toggle("done", i < to);
          bDots[i].classList.toggle("now", i === to);
        }
        var anchorIdx = -1, seen = 0;
        for (var j = 0; j <= to && j < demo.steps.length; j++) {
          if (demo.steps[j].top) { anchorIdx = seen; seen++; }
        }
        var tDots = dotsTopEl.children;
        for (var k = 0; k < tDots.length; k++) {
          tDots[k].classList.toggle("done", k < anchorIdx);
          tDots[k].classList.toggle("now", k === anchorIdx);
        }
      }

      function refreshUi() {
        var demo = DEMOS[demoIndex];
        var last = demo.steps.length - 1;
        // Jamais désactivées : ← au tout début boucle vers la fin, → à la
        // fin boucle vers le début — de quoi comparer départ/résultat en
        // aller-retour sans rester bloqué à un bout.
        if (demo.custom) return;
        prevBtn.disabled = busy;
        nextBtn.disabled = busy;
        nextBtn.textContent = cur === last ? "FIN" : "→";
        nextBtn.classList.toggle("text", cur === last);
        nextBtn.setAttribute("aria-label", cur === last ? "Revenir au début" : "Suivant");
        if (demo.split) updateDots(demo, cur);
      }

      function go(to) {
        var demo = DEMOS[demoIndex];
        if (busy || to < 0 || to >= demo.steps.length || to === cur) return;
        var forward = to === cur + 1;
        busy = true;
        cur = to;
        refreshUi();
        syncTop(true);
        transition(to, forward).then(function () {
          busy = false;
          refreshUi();
          // Démo parcourue jusqu'au bout en mode jeu, sans faute : une réussite
          var st = demo.steps;
          var lastExpr = st.length - 1;
          while (lastExpr > 0 && st[lastExpr].summary) lastExpr--;
          if (gameMode && to >= lastExpr && gameRun.demo === demo.title && !gameRun.counted) {
            gameRun.counted = true;
            if (gameRun.faults === 0) progressDemo(demo.title);
          }
        });
      }

      function next() {
        if (DEMOS[demoIndex].custom) {
          // Singapour : la flèche lance la manche suivante, une fois le
          // résultat affiché
          if (DEMOS[demoIndex].custom === "pf") { if (pfState && pfState.ready) pfStart(); return; }
          if (DEMOS[demoIndex].custom === "ens") { if (ensState && ensState.ready) ensStart(); return; }
          if (DEMOS[demoIndex].custom === "calc") { calcStart(); return; }
          if (DEMOS[demoIndex].custom === "fus") { if (fus.won) { fus.level = (fus.level + 1) % FUS_LEVELS.length; fusStart(); } return; }
          if (DEMOS[demoIndex].custom === "sol") { solIndex = (solIndex + 1) % SOL.length; solRender(false); return; }
          if (sgState && sgState.ready) sgStart();
          return;
        }
        var last = DEMOS[demoIndex].steps.length - 1;
        if (gameMode && cur < last && !busy && !choiceEl && gameChoice(cur + 1)) return;
        if (cur === last) {
          if (busy) return;
          gameRun = { demo: DEMOS[demoIndex].title, faults: 0, counted: false };
          cur = 0;
          build(DEMOS[demoIndex].steps[0]);
          refreshUi();
          syncTop(true);
        } else {
          go(cur + 1);
        }
      }

      // ---------- Bips (style oscilloscope) ----------
      // Sons courts synthétisés : fusion, juste, faux, badge. Débloqués au
      // premier geste (règle des navigateurs), coupables dans le menu.
      var soundOn = true;
      try { soundOn = localStorage.getItem("pasapas_sound") !== "0"; } catch (e) {}
      var actx = null;
      function bip(freq, dur, type, when, vol) {
        if (!soundOn) return;
        try {
          if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
          if (actx.state === "suspended") actx.resume();
          var t0 = actx.currentTime + (when || 0);
          var o = actx.createOscillator(), g = actx.createGain();
          o.type = type || "square";
          o.frequency.setValueAtTime(freq, t0);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.12));
          o.connect(g).connect(actx.destination);
          o.start(t0);
          o.stop(t0 + (dur || 0.12) + 0.02);
        } catch (e) {}
      }
      var SND = {
        meet: function () { bip(330, 0.09, "sine", 0, 0.08); bip(495, 0.12, "sine", 0.08, 0.06); },

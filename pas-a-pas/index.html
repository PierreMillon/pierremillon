        { v: "v109", text: "Le son d'une réponse est un coup sourd, comme frapper du bois à travers un chiffon : grave, sec, sans résonance (un coup si c'est juste, deux plus bas sinon)." },
        { v: "v108", text: "Fractions : le facteur commun sort de la fraction (3/3 · le reste), devient 1, puis disparaît. Nouveau badge a/a = 1 (débloqué par Piège, à partir de ℚ) et badge facteurs premiers (débloqué par Premiers). Menu ☰ : « Recommencer » le chapitre ouvert, ou « Tout recommencer » (deux appuis pour confirmer). Premiers : en examen, 0, 1, 4, 6… restent grisés ; et l'ordre est libre (21 : 3 ou 7 d'abord, puis l'autre se divise aussi directement). Examen Fraction : il y a enfin des réponses à choisir (produit ou somme ? 1 ou 0 ?), et en examen un badge bien utilisé compte comme une bonne réponse. Appui long sur un badge : un petit son, et un toucher n'importe où ferme l'explication. " + "Chapitres à étapes : les badges marchent aussi hors du chemin de l'explication. Sur (−1)·(2x − 3 + x), Regrouper range d'abord dans la parenthèse : l'expression devient manipulable « à ta façon » (toucher, glisser, badges), le badge (−1)·(−1) distribue le −1 quand tu veux. ← revient à l'explication." },
        { v: "v107", text: "Les badges ne s'affichent plus là où ils ne servent à rien (Ensembles, Venn, Structures, Solutions, Premiers, Singapour, Calcul, Pascal, Fusion, Exp / ln) : seulement dans les chapitres à étapes et Regrouper. Dans ℕ, le badge (−1)·(−1) est caché (pas de −1 dans ℕ). Le numéro de version est écrit en bas du menu ☰." },
        { v: "v106", text: "Nouveau chapitre Exp / ln (dans ℝ), sur le thème du TD 3 : simplifier (ln(e²ˣ + eˣ) = x + ln(eˣ + 1), e^(3 ln x) = x³, log(5 × 10⁻³)…), résoudre (eˣ = −1, e²ˣ + eˣ − 2 = 0 avec X = eˣ…), limites (croissances comparées, x ln x en 0, (1 + 1/x)ˣ → e). Trois réponses, puis le geste qui y mène." },
        { v: "v105", text: "Bouton Examen sous le titre (le titre du chapitre prend toute la ligne). Structures, réduit à la définition du cours : un groupe = loi interne, associative, élément neutre, symétriques. Construire (la commutativité est un piège) et « (ℤ, −) est-il un groupe ? » oui / non, puis les propriétés ✓ / ✗ avec la façon dont on sort de la structure (3 − 5 = −2 ∉ ℕ ; l'inverse de 2 serait 1/2 ∉ ℤ…). Toucher la flèche annule le passage automatique à la question suivante (plus de question sautée)." },
        { v: "v104", text: "Deux badges bien distincts. Regrouper rapproche : les x côte à côte à gauche, les nombres à droite (entre parenthèses, c'est une somme à calculer). x en facteur fait (3 + 1)·x — il faut avoir réussi son chapitre. Dans Regrouper : Regrouper, puis x en facteur, puis le badge 10." },
        { v: "v103", text: "Le badge Regrouper agissait aussi sur les mises en facteur (retiré en v104 : c'est le rôle du badge x en facteur)." },
        { v: "v102", text: "En-tête : « Validé ✓ » tout court, le titre du chapitre garde sa place." },
        { v: "v101", text: "Nouvelles icônes : Regrouper = des parenthèses ( + ), x en facteur = x devant une parenthèse x( ). Dans le chapitre Regrouper, le badge Regrouper luit quand on peut regrouper et range tout d'un coup (x à gauche dans une parenthèse, nombres à droite) ; ensuite le badge 10 luit pour calculer." },
        { v: "v100", text: "Badges : un appui court agit ; si l'action n'est pas possible, une étiquette jaune dit pourquoi (« Regroupe d'abord : pas encore de parenthèse à calculer », « Pas de (−1) à calculer ici »…). Un appui long montre l'explication complète du badge." },
        { v: "v99", text: "Regrouper, avec le badge 10 : un toucher sur une parenthèse la calcule directement, et le badge calcule toutes les parenthèses d'un coup. Sans le badge : deux touchers sur la parenthèse." },
        { v: "v98", text: "Regrouper : deux termes en x associés partent directement tout à gauche, deux nombres tout à droite (et leur parenthèse aussi)." },
        { v: "v97", text: "Regrouper : le cadre de sélection entoure seulement le terme ou la parenthèse, le signe + / − reste devant, à l'extérieur." },
        { v: "v96", text: "Les badges restent disponibles en examen : ce sont des capacités gagnées (le badge 10 calcule une parenthèse dans Regrouper, etc.). Le bouton Examen reste sur la ligne du titre." },
        { v: "v95", text: "Regrouper se fait à la main : chaque terme (avec son signe) se touche. Toucher un terme puis un terme semblable, ou glisser l'un sur l'autre : ils se rapprochent et la ligne se réarrange en douceur. Côte à côte, 3x et 2x deviennent (3 + 2)·x, 5 et 7 deviennent (5 + 7). Toucher la parenthèse puis le badge 10 (ou la retoucher) fait le calcul. Fini quand il reste un terme en x puis un nombre." },
        { v: "v94", text: "Bonne réponse : la question suivante arrive seule après un court instant (Venn, Structures, Ensembles, Solutions). Après une erreur, on reste sur la correction ; la flèche fait passer." },
        { v: "v93", text: "Venn : plus de cadre autour, hachures plus fines, chaque lettre d'ensemble écrite à l'intérieur de sa zone (plus sur le trait). Une légende dit ce que sont 2ℕ, 3ℕ, 𝔻, ℝ₊, iℝ… (pas en examen). Un nombre hors des deux cercles s'écrit −√2 ∉ ℤ ∪ ℝ₊." },
        { v: "v92", text: "Nouveau chapitre Structures : un cercle (E, loi). Construire — coche les propriétés d'un magma, d'un monoïde, d'un groupe, d'un groupe abélien, elles s'inscrivent dans le cercle. Reconnaître — (ℕ, +), (ℤ, −), (ℚ*, ×), (ℤ, +, ×)… avec leurs propriétés : magma, monoïde, groupe, anneau, corps ? En examen, les propriétés ne sont pas écrites." },
        { v: "v91", text: "Accueil : dans un ensemble encore verrouillé, aucun chapitre n'apparaît comme réussi (plus de ✓ ni de « 1/1 »)." },
        { v: "v90", text: "Nouveau chapitre Venn (dans ℕ) : deux cercles, l'un dans l'autre ou qui se croisent. À tour de rôle : lire une zone hachurée et choisir son écriture (ℕ ∖ {0} = ℕ*, 2ℕ ∩ 3ℕ = 6ℕ, ℂ ∖ ℕ, 𝔻 = { a/10ⁿ }…) ou placer un nombre dans la bonne zone. Les questions suivent les ensembles ouverts. Il a son examen." },
        { v: "v89", text: "Accueil : la zone du bas (texte et chapitres) a une hauteur fixe ; changer d'ensemble ne fait plus bouger les anneaux." },
        { v: "v88", text: "Accueil : les anneaux sont centrés dans la place libre (autant de noir au-dessus qu'en dessous), les chapitres sont tout en bas, en entier ; un chapitre validé porte un ✓. Examen : un chapitre validé affiche « Validé ✓ » au lieu du compteur ; le compteur est gardé chapitre par chapitre (aller voir ailleurs ne le remet plus à 0, seule une erreur)." },
        { v: "v87", text: "Examen : 3 réponses justes d'affilée suffisent pour valider un chapitre (au lieu de 9)." },
        { v: "v86", text: "Calcul : plus rien n'avance tout seul. Chaque étape s'arrête avec une phrase qui dit ce qui se passe (dizaines et unités, 6 = 5 + 1, il manque 3 pour faire 10…) ; la flèche passe à l'étape suivante, puis à un autre calcul." },
        { v: "v85", text: "Ensembles : des nombres écrits avec une fonction (ln 1, cos π, √16, sin(π/6), ln 2, e, √(−9)…) et deux questions qui alternent — un ensemble qui le contient, ou le plus petit ensemble qui le contient. Solutions devient un quiz sans changer d'ensemble : « une solution dans ℕ ? » oui / non, puis « le plus petit ensemble avec une solution ? ». Les deux chapitres ont leur examen." },
        { v: "v84", text: "Mode examen : un bouton « Examen » en haut. Plus aucune aide : pas de surlignage ni de cadre de dix, badges masqués, propositions toujours là ; dans Premiers, tous les diviseurs ont la même couleur et pas d'explication ; dans Ensembles, pas de définitions. C'est l'examen qui valide un chapitre : 9 réponses justes d'affilée (3 manches sans erreur pour Singapour), une erreur remet à 0. L'entraînement, lui, garde toutes les aides." },
        { v: "v83", text: "Premiers : la barre des ensembles et les badges du bas sont masqués, ils n'y servent pas." },
        { v: "v82", text: "Fiche des règles, « Faire apparaître » : nouveau geste « Un coefficient sans tout développer » — le coefficient de xᵏ d'un produit = somme des produits de coefficients dont les exposants font k ; le reste part dans xⁿP(x)." },
        { v: "v81", text: "Regrouper et x en facteur passent dans ℕ (exemples sans signe moins ; leurs badges servent aussi dans ℤ). Accueil : ℕ en petite boule en bas, les lettres dans les bandes du haut ; plus de lettre qui flotte sous les anneaux. Chapitres de l'accueil sur deux lignes, boutons resserrés." },
        { v: "v80", text: "Mode jeu : les deux propositions apparaissent d'elles-mêmes à chaque étape, dès le début du chapitre et après une étape sans question — plus besoin de toucher la flèche. En revenant en arrière, rien ne s'affiche : on relit." },
        { v: "v79", text: "Deux chapitres dans ℤ, chacun avec son badge : Regrouper (−2x + 3 − x → −2x − x + 3, chaque terme voyage avec son signe) et x en facteur (−2x − x → (−2 − 1)·x → −3x). Les badges agissent partout : quand leur icône luit, un appui regroupe ou factorise d'un coup. Le badge 10 aussi : il luit avant une addition au cadre de dix et donne le résultat directement (même face aux deux propositions du mode jeu). L'ancienne version ℕ d'Opposés s'appelle Rassembler. Le nom du badge flotte au-dessus de lui quand il agit." },
        { v: "v78", text: "Fiche des règles, « Faire apparaître » : nouveau geste « Comparer des racines : comparer les carrés » — α − β = (α² − β²)/(α + β), avec l'exemple de la récurrence sur la somme des racines (α² − β² = 1)." },
        { v: "v77", text: "Le badge (−1)·(−1) agit : à une étape où des (−1) multiplient encore (ex. (−1)·(2x) + (−1)·(−3) + (−1)·(x)), il luit ; un appui fait tourner les (−1) et calcule tous les signes d'un coup : −2x + 3 − x. Ailleurs, un appui l'explique." },
        { v: "v76", text: "Titre du chapitre de retour sur la ligne des boutons ☰ ⌂. Badges rangés entre les flèches ← → : plus de rangée en plus, tous les boutons du bas tiennent à l'écran. Accueil : anneaux presque ronds, chacun remonte un peu vers le haut — ℕ en petite boule en haut, les lettres ℤ ℚ ℝ ℂ… dans les bandes plus larges du bas." },
        { v: "v75", text: "Mode jeu : la fausse proposition garde les mêmes chiffres. Elle se trompe sur ce que fait l'étape : l'opération inverse (7 + 5 → 2, (−2) + (−1) → −1) ou le signe qui vient de changer (moins par moins laissé en moins). Plus de réponse absurde qui se repère au premier coup d'œil." },
        { v: "v74", text: "Fiche des règles : racines redessinées (le signe √ et sa barre forment un seul bloc, qui s'étire sur une fraction et ne se coupe plus en fin de ligne). Une égalité a = b n'est plus coupée au milieu : on passe à la ligne entre deux égalités, et une égalité trop longue ne se coupe qu'à un signe =." },
        { v: "v73", text: "Une seule réussite sans faute suffit pour valider un chapitre et gagner son badge (au lieu de 3). Rejouer donne toujours un autre exercice." },
        { v: "v72", text: "Badges : plus de pastilles en haut ni de ✦. Chaque badge est une petite icône au trait (cadre de dix, deux demi-tours) rangée sous la barre des ensembles ; un appui explique le badge." },
        { v: "v71", text: "Titre du chapitre en entier, sur sa propre ligne sous les boutons. Expression trop longue : une seule ligne, écrite plus petit, jamais hors de l'écran." },
        { v: "v70", text: "Décompositions écrites : sous le cadre de dix (8 = 5 + 3, 5 = 2 + 3, et 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13) et à la fin des manches de Singapour." },
        { v: "v69", text: "Fusion : les 4 derniers pouvoirs de la fiche. Compléter le carré « + c − c » (gagné avec (a+b)²), puissances 2ⁿ⁺¹ = 2·2ⁿ (Pascal), quantité conjuguée 1/(√2 − 1) = √2 + 1 ((a+b)(a−b)), télescopage 1/(k(k+1)) = 1/k − 1/(k+1) (Piège). 16 buts en tout." },
        { v: "v68", text: "Fusion : deux pouvoirs de plus. « Développer » k·(a + b) → k·a + k·b (gagné avec Distribuer) et « découper un nombre » 7 → 5 + 2 pour faire apparaître un facteur (gagné avec Calcul). Deux buts en plus ; 5·x + 5 fusionne en 5·(x + 1)." },
        { v: "v67", text: "Trois passages, trois exercices différents : chaque chapitre du jeu (−( … ), Opposés, Fraction, Piège, Distribuer, Factoriser, Double, identités, ℂ, Équation, et leurs versions ℕ) change de nombres à chaque passage ; le premier reste l'exemple d'origine." },
        { v: "v66", text: "Cadre de dix : il reste affiché, c'est la flèche qui lance le résultat. Soustraction posée : « = 0 » sous la barre. Badges en haut : un appui explique ce qu'ils veulent dire (✦ 10, ✦ (−1)·(−1))." },
        { v: "v65", text: "−×− : un nombre différent à chaque passage, de plus en plus grand (3, 5, 8, 12, 25, 47, 100, 365, 1000) ; la droite se met à l'échelle. Réussir le chapitre débloque le badge « moins par moins » : (−1)·(−1) = 1." },
        { v: "v64", text: "Les chapitres s'adaptent à l'ensemble choisi au lieu de disparaître : dans ℕ, −( … ) devient 3·(2x + 4 + x) (on distribue puis on regroupe, 9x + 12) et Opposés devient Regrouper (3x + 7 + 2x + 5 = 5x + 12)." },
        { v: "v63", text: "Mode jeu : après une réponse, la question suivante s'affiche d'elle-même, sans appuyer sur la flèche." },
        { v: "v62", text: "Cadre de dix pour les négatifs, plus clair et plus lent : chaque jeton jaune porte un « − » (il vaut −1), et une légende écrit le calcul sous le cadre, (−2) + (−1) = −(2 + 1) = −3." },
        { v: "v61", text: "Correctif : avec « Réduire les animations » activé sur l'iPhone, tout défilait 100 fois trop vite (le calcul mental comme un film en accéléré). Maintenant le mouvement est supprimé mais le rythme de lecture reste normal." },
        { v: "v60", text: "Ensembles : l'étoile de ℕ* est en exposant, en haut à droite." },
        { v: "v59", text: "Singapour : liberté totale — on peut retirer n'importe quel jeton, même ceux du départ. On peint au doigt : parti d'un jeton, on efface tout ce qu'on survole ; parti d'une case vide, on remplit tout ce qu'on survole. La manche finit quand le compte est bon ; le badge ne compte que les manches bien rangées." },
        { v: "v58", text: "Premiers : quand le nombre en cours est lui-même un premier du clavier (13), son bouton est vert — le diviser par lui-même est une bonne réponse. La dernière division tentée reste affichée ; flèche ← pour revenir en arrière." },
        { v: "v57", text: "Premiers : flèche ← pour revenir en arrière d'une étape (division ou « est premier »), même après avoir fini." },
        { v: "v56", text: "Premiers : la dernière division tentée reste affichée sur le bandeau (en jaune si elle ne tombe pas juste, en vert sinon, pendant que la décomposition se met à jour en haut) jusqu'à la prochaine action." },
        { v: "v55", text: "Nouveau chapitre Pascal (ℝ) : le triangle se construit ligne par ligne, chaque nombre naît de ses deux parents qui glissent et fusionnent. Ensuite on glisse le doigt dessus : « k parmi n » avec sa formule n!/(k!(n−k)!), ses deux parents, son symétrique (n−k parmi n) et, pour les petites lignes, le développement de (a + b)ⁿ." },
        { v: "v54", text: "Sons : plus aucun son négatif. Une erreur joue deux notes douces, comme un encouragement." },
        { v: "v53", text: "Premiers : quand « est premier » est faux, le message (91 = 7 × 13 — pas premier) reste affiché jusqu'au prochain toucher ailleurs." },
        { v: "v52", text: "Premiers : au départ, le nombre du haut descend dans la bulle de l'arbre (c'est le même nombre) ; ensuite la ligne du haut suit la décomposition, 117 → 117 = 3 · 39 → 117 = 3 · 3 · 13." },
        { v: "v51", text: "Premiers : en vert plein, seulement les diviseurs qui divisent vraiment le nombre en cours (pour 90 : 2, 3, 5 — pas 13). La fenêtre d'explication n'apparaît que pendant l'appui long et disparaît au relâcher." },
        { v: "v50", text: "Premiers : septième écriture sur le bandeau, la division posée (potence). Un nombre premier reconnu affiche « 97 est premier »." },
        { v: "v49", text: "Premiers : bouton « est premier » — les nombres premiers ne sont plus entourés d'office, c'est à toi de les reconnaître (ou de les diviser par eux-mêmes). Certaines questions sont elles-mêmes des nombres premiers, petits ou grands (97, 101…). Se tromper montre un diviseur (91 = 7 × 13)." },
        { v: "v48", text: "Premiers : les écritures de la division sont sur un bandeau coulissant, comme la roue du réveil iPhone à l'horizontale — une en grand au centre, on glisse pour choisir, elle s'aimante et le choix est retenu." },
        { v: "v47", text: "Premiers : sixième écriture de la division, avec le deux-points « : »." },
        { v: "v46", text: "Premiers : les cinq écritures de la division sur une seule ligne, reliées par « = ». La case du diviseur est un cercle, comme les boutons ; les diviseurs premiers sont pleins verts avec le chiffre en noir. On peut glisser un diviseur sur les écritures pour l'appliquer." },
        { v: "v45", text: "Premiers : l'explication est plus grande, écrite gros et aérée (règle, exemple ligne par ligne, verdict), au-dessus des écritures de la division." },
        { v: "v44", text: "Premiers : la case du diviseur est une zone pleine qui luit et s'éteint lentement, comme un écran d'oscilloscope. L'explication est un panneau clair et aéré : la règle en haut, puis l'exemple sur le nombre de l'exercice, une étape par ligne, puis le verdict." },
        { v: "v43", text: "Premiers : l'appui long sur un diviseur applique la règle au nombre de l'exercice (98 et 7 : 9 − 2 × 8 = −7, dans la table de 7 ✓ → 98 = 7 × 14), répétée si le nombre est grand, avec la division écrite à la fin." },
        { v: "v42", text: "Premiers : deux écritures de plus de la division, sur une deuxième ligne — 163 · ▢⁻¹ et 163 · 1/▢. Un nombre premier tapé soi-même affiche directement « est premier »." },
        { v: "v41", text: "Premiers : au-dessus des diviseurs, centré, le nombre en cours écrit des trois façons — en fraction, avec / et avec ÷ — et une case qui respire à la place du diviseur. Le diviseur touché s'y inscrit (vert s'il divise, jaune sinon)." },
        { v: "v40", text: "Premiers : les boutons des diviseurs sont des cercles parfaits." },
        { v: "v39", text: "Premiers : chaque nombre de l'arbre est une bulle ronde, le nombre bien centré, les traits s'arrêtent au bord des bulles. Quand un diviseur marche, la bulle devient d'abord le produit « 5 · 11 » en s'étirant, puis se scinde en deux bulles qui rebondissent à leur place." },
        { v: "v38", text: "Premiers : un petit titre au-dessus des diviseurs montre les trois écritures de la division (÷, /, barre de fraction) ; les boutons ne portent plus que le nombre. Division par 0 : on rappelle qu'elle devient possible dans ℝ ∪ {∞} ou ℂ ∪ {∞} (x ÷ 0 = ∞, x ≠ 0)." },
        { v: "v37", text: "Premiers : explications en appui long réduites à l'essentiel (÷2 : se termine par un chiffre pair ; ÷3 : somme des chiffres dans la table de 3…)." },
        { v: "v36", text: "Premiers : un mauvais diviseur affiche pourquoi, avec la règle appliquée au nombre (91 se termine par 1, pas par 0, 2, 4, 6 ou 8) et le reste de la division (91 = 2 × 45 + 1). Un nombre tapé soi-même ne compte pas pour le chapitre." },
        { v: "v35", text: "Pouvoirs : réussir Premiers affiche « ✦ Pouvoir débloqué — n → 2·3·… Décomposer en facteurs premiers » (de même Fraction → 1 → c/c). Dans Fusion, deux niveaux de plus : 12·x + 18 = 6·(2·x + 3), 15·a + 10·b = 5·(3·a + 2·b). Premiers : toucher le nombre du haut pour taper son propre nombre (un bouton ÷p apparaît si un facteur dépasse 13)." },
        { v: "v34", text: "Accueil : ellipses verticales, dans le sens de l'écran. On glisse le doigt sur la carte et l'ensemble sélectionné suit en continu." },
        { v: "v33", text: "Singapour : le nombre n'est plus cliquable (c'était caché). À la place, deux boutons calés à gauche : « Voir la solution » (la manche est jouée pour toi, ne compte pas) et « Règles »." },
        { v: "v32", text: "Singapour : à la fin d'une manche, les jetons restants se regroupent dans un seul cadre, par colonnes de 2 (4 = un carré 2 × 2) ; les jetons retirés et le cadre vide s'effacent." },
        { v: "v31", text: "Accueil : la carte des ensembles ne bouge plus quand on change d'ensemble. Au-delà de ℂ, en teaser verrouillé : ℍ (quaternions, dim 4), 𝕆 (octonions, dim 8), 𝕊 (sédénions, dim 16), 𝕋 (trigintaduonions, dim 32) — chacun avec la propriété qu'il perd." },
        { v: "v30", text: "Nouveau chapitre Fusion (ℝ) : les termes sont des bulles qu'on déplace au doigt. Lâchées l'une sur l'autre, elles fusionnent si une règle le permet : a + a → 2·a, 2·a + 2·b → 2·(a + b), 3·x − 3·x → disparaît, fractions de même dénominateur. Pouvoir « 1 → c/c » (gagné avec le chapitre Fraction). 8 niveaux, ↺ pour recommencer." },
        { v: "v29", text: "Menu ☰ → Fiche des règles : toutes les règles de calcul jusqu'en terminale, et les gestes d'exercice (écrire 1 = c/c, ajouter et retrancher, découper 25 = 24 + 1, quantité conjuguée, facteur dominant…)." },
        { v: "v28", text: "Les termes qui changent de place décrivent un demi-cercle (vers la droite par-dessus, vers la gauche par-dessous) : on les voit se croiser au lieu de glisser en ligne droite." },
        { v: "v27", text: "Écran d'accueil (⌂) : les ensembles emboîtés ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ, on touche une zone pour voir ses chapitres. Déblocage : tous les chapitres d'un ensemble réussis ouvrent le suivant (démo animée = 3 fois sans faute en mode jeu). Mode prof dans le menu : tout ouvert. ℍ en teaser verrouillé. Petits bips (fusion, juste, faux, badge), coupables dans le menu." },
        { v: "v26", text: "Nouveau chapitre Calcul : calcul mental animé en continu, sans clics. Dizaines en barres, unités en jetons rangés par 5. 16 + 27 → 10 + 6 + 20 + 7 → 5 + 1 et 5 + 2 → les deux 5 font une dizaine → 40 + 3 → 43. Si un seul nombre dépasse 5 : complément à 10. Enchaîne tout seul ; → pour passer au suivant." },
        { v: "v25", text: "Notation : pendant les calculs, chaque produit a son point (2·x, a·b, 2·(○ + □)) ; une dernière étape passe à l'écriture usuelle (2x, ab, 2(○ + □)) — le même produit, écrit plus court." },
        { v: "v24", text: "Mode jeu (menu ☰) : à chaque étape qui change l'écriture, deux propositions — la vraie étape et une fausse (un signe ou un nombre changé, vérifiée fausse par le calcul). Bonne réponse : l'animation continue ; erreur : la bonne réponse s'allume." },
        { v: "v23", text: "Barre des ensembles toujours visible en bas : ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ, on choisit où l'on travaille (tout ce qui est plus petit est inclus). Nouveau chapitre Solutions : la réponse dépend de l'ensemble — 2 − 3 donne ∅ dans ℕ et { −1 } dans ℤ ; x² = 4 donne { 2 } dans ℕ et { −2 ; 2 } dans ℤ ; x² = −1 n'a de solution que dans ℂ." },
        { v: "v22", text: "Nouveau chapitre Ensembles : un nombre s'affiche, on le glisse (ou on touche) dans un ensemble — ℕ*, ℕ, ℤ, ℚ, ℝ, ℂ en première ligne ; 𝔻, ℝ∖ℚ, ℝ₊, iℝ, 𝕌 en seconde. Toute case qui le contient est juste ; la réponse allume toutes ses cases. Appui long : définition de l'ensemble. Les cases et les nombres suivent les ensembles cochés dans le menu." },
        { v: "v21", text: "Identités remarquables sous leur forme générale : (a + b)² = a² + 2ab + b², (a − b)² = a² − 2ab + b², (a + b)(a − b) = a² − b². Nouveau chapitre ℂ : a² + b² = (a + ib)(a − ib), grâce à i² = −1. Menu ☰ : on coche les ensembles ℕ ℤ ℚ ℝ ℂ, les chapitres suivent (ℂ décoché au départ). Tient aussi sur téléphone couché. Le vérificateur calcule aussi avec a, b et i." },
        { v: "v20", text: "Reprend sur la dernière démo ouverte. Anglais disponible (menu ☰ → English). Installable comme une application (ajouter à l'écran d'accueil), fonctionne hors ligne." },
        { v: "v19", text: "Deux nouvelles démos : Double ((x + 1)(x + 2) = x² + 3x + 2, quatre produits écrits un par un) et Identité ((x + 3)² = x² + 6x + 9 : on voit d'où vient le « 2ab »). Page récapitulative à la fin de chacune." },
        { v: "v18", text: "Singapour : soustraction « retirer de 10 », une manche sur deux. 13 − 5 : on retire les jetons de la dizaine pleine, pas des 3 à côté (sinon la dizaine s'allume en jaune) → 10 − 5 + 3 → 5 + 3 → 8. Appui bref ou glisser hors des cadres pour retirer, appui sur un jeton retiré pour le remettre, appui sur le 5 pour tout retirer d'un coup." },
        { v: "v17", text: "Premiers : diviseurs de ÷0 à ÷13 — les premiers (2, 3, 5, 7, 11, 13) sont vifs, les autres estompés avec la raison (0 interdit, 1 inutile, 4 = 2 × 2, 6 = 2 × 3…). Appui long sur un diviseur : la règle de divisibilité s'affiche dans une fenêtre. Les traits de l'arbre s'arrêtent au bord des cercles. Nombres jusqu'à 200, avec parfois 11 ou 13." },
        { v: "v16", text: "Équation : le « + » manquant est rétabli (2x + 0 = 7 − 3). Nouveau : chaque étape de chaque démo est recalculée au chargement (valeurs au hasard pour x, ○, □) ; une étape fausse est signalée à l'écran." },
        { v: "v15", text: "−×− : la rotation se voit vraiment — la flèche tourne dans le plan autour de 0, sa pointe trace un demi-cercle en pointillés et l'angle défile jusqu'à 180°. Le 2e demi-tour passe en dessous : à la fin, un tour complet." },
        { v: "v14", text: "Distribuer / Factoriser : 2(○ + □) s'écrit sans le point de multiplication. Dernière étape : toutes les écritures sur une seule page, l'une sous l'autre, reliées par « = » — c'est le même objet." },
        { v: "v13", text: "Nouveau chapitre Premiers : arbre de facteurs. On touche un nombre, puis ÷2, ÷3, ÷5 ou ÷7 ; s'il divise, il se sépare en deux branches. Les premiers sont entourés. À la fin : 60 = 2 · 2 · 3 · 5 = 2² · 3 · 5, quel que soit l'ordre choisi." },
        { v: "v12", text: "Opposés : la soustraction est posée en colonne — 3x, puis −3x dessous, la barre, et le 0 sous la barre (plus de « = 0 » à côté qui faisait croire à une fraction)." },
        { v: "v11", text: "Singapour plus souple : un appui bref pose un jeton dans la bonne case (ou le retire s'il est posé), on peut aussi glisser pour poser et pour retirer, chaque déplacement rebondit un peu. Appuyer sur le 2e nombre range tous ses jetons d'un coup (manche montrée, ne compte pas pour le badge). À la fin, la somme reste affichée (7 + 9 = 16) et la flèche → passe à la suivante. Les jetons de la réserve ne se chevauchent plus." },
        { v: "v10", text: "Distribution du −1 refaite : c'est toi qui déclenches chaque étape. Le (−1) trace une flèche en arc, lentement, vers chaque terme l'un après l'autre (le terme touché passe en jaune et reste marqué). Ensuite seulement, les produits s'écrivent un par un, puis on calcule." },
        { v: "v9", text: "Comportement d'application : la page tient dans l'écran, ne défile plus, ne se tire plus vers le bas, pas de zoom. Le défi Singapour s'adapte à la hauteur de l'écran." },
        { v: "v8", text: "Chapitre Singapour : défi « faire 10 » — on glisse soi-même les jetons dans des cadres de dix, la première dizaine avant la seconde. 3 réussites de suite débloquent le badge ✦ 10, qui fait apparaître le cadre de dix sous les additions des autres démos (7 + 5 = 10 + 2 dans Opposés)." },
        { v: "v7", text: "Nouvelles démos : Piège ((x + 3)/3 ≠ x), −×− (multiplier par −1 = demi-tour sur la droite des réels), Distribuer / Factoriser avec des formes (rond, carré) sans texte, Équation (le même geste des deux côtés)." },
        { v: "v6", text: "Méthode de Singapour : au moment où deux nombres fusionnent (2 + 5, (−2) + (−1)), un cadre de dix (2 rangées de 5, comme à Singapour) apparaît et chaque nombre vient le remplir de jetons, puis tout se referme sur le résultat. Jetons jaunes = négatifs." },
        { v: "v5", text: "Distribution du −1 terme par terme, écrite en toutes lettres (−1)·(terme), avant de la simplifier. Phrases magiques sur la ligne du haut. Contrôles réduits à deux flèches." },
        { v: "v4", text: "Écran scindé écrit / détail sur la démo −( … ) : le haut montre la formule telle qu'on l'écrit à la main, le bas ne saute aucune étape. Retrait des commentaires sous l'animation." },
        { v: "v3", text: "Ajout au menu du portfolio." },
        { v: "v2", text: "Trois démos : −( … ), Opposés, Fraction." },
        { v: "v1", text: "Page d'essai créée." }
      ];

      var histBtn = document.getElementById("histBtn");
      var histOverlay = document.getElementById("histOverlay");
      var histList = document.getElementById("histList");
      var histClose = document.getElementById("histClose");

      document.getElementById("menuVersion").textContent = "Version " + VERSIONS[0].v;
      VERSIONS.forEach(function (entry) {
        var li = document.createElement("li");
        var b = document.createElement("b");
        b.textContent = entry.v;
        li.appendChild(b);
        li.appendChild(document.createTextNode(entry.text));
        histList.appendChild(li);
      });

      histBtn.addEventListener("click", function () {
        closeMenu();
        histOverlay.hidden = false;
      });
      histClose.addEventListener("click", function () { histOverlay.hidden = true; });

      // ---------- Menu (☰) ----------

      var menuBtn = document.getElementById("menuBtn");
      var menuPanel = document.getElementById("menuPanel");

      function closeMenu() {
        menuPanel.hidden = true;
        menuBtn.setAttribute("aria-expanded", "false");
      }

      menuBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = menuPanel.hidden;
        if (open) resetLabels();
        menuPanel.hidden = !open;
        menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
      });

      document.addEventListener("click", function (e) {
        if (!menuPanel.hidden && !menuPanel.contains(e.target) && e.target !== menuBtn) closeMenu();
      });

      function applyLang() {
        document.documentElement.lang = LANG;
        tabsEl.querySelectorAll(".tab").forEach(function (t) { t.textContent = tr(t.dataset.title); });
        document.querySelectorAll("[data-tr]").forEach(function (el) { el.textContent = tr(el.dataset.tr); });
        var hc = document.getElementById("histClose");
        if (hc) hc.textContent = tr("Fermer");
      }
      document.getElementById("langBtn").addEventListener("click", function () {
        closeMenu();
        LANG = LANG === "fr" ? "en" : "fr";
        try { localStorage.setItem("pasapas_lang", LANG); } catch (e) {}
        applyLang();
        lastTopStep = null;
        if (!busy) selectDemo(demoIndex);
      });
      applyLang();

      var gameBtn = document.getElementById("gameBtn");
      function renderGameBtn() {
        gameBtn.textContent = (LANG === "en" ? "Play mode: " : "Mode jeu : ") + (gameMode ? "✓" : "—");
      }
      gameBtn.addEventListener("click", function () {
        gameMode = !gameMode;
        try { localStorage.setItem("pasapas_game", gameMode ? "1" : "0"); } catch (e) {}
        renderGameBtn();
        closeChoice();
        autoChoice(400);
      });
      renderGameBtn();
      document.getElementById("langBtn").addEventListener("click", renderGameBtn);

      // ---------- Ensembles de nombres ----------
      // Chaque chapitre appartient à l'ensemble où il se passe. On coche ou
      // décoche les ensembles dans le menu : les chapitres suivent. ℂ est
      // décoché au départ (chapitre des complexes en option).
      var SET_OF = {
        "Singapour": "N", "Premiers": "N", "Ensembles": "N", "Venn": "N", "Structures": "N", "Regrouper": "N", "x en facteur": "N", "−( … )": "Z", "Opposés": "Z", "−×−": "Z",
        "Fraction": "Q", "Piège": "Q", "Équation": "Q",
        "Distribuer": "R", "Factoriser": "R", "Exp / ln": "R", "Double": "R", "Fusion": "R", "Pascal": "R",
        "B − A": "R", "Par les carrés": "R", "Tout d'un côté": "R", "Un carré": "R"
      };
      // Univers emboîtés ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ : on choisit dans quel ensemble
      // on travaille (barre toujours visible en bas). Tout ce qui est plus
      // petit est inclus. Les chapitres et les réponses suivent.
      var SET_NAMES = [["N", "ℕ"], ["Z", "ℤ"], ["Q", "ℚ"], ["R", "ℝ"], ["C", "ℂ"]];
      var UNIV = ["N", "Z", "Q", "R", "C"];
      var universe = "R";
      try { var su = localStorage.getItem("pasapas_universe"); if (UNIV.indexOf(su) >= 0) universe = su; } catch (e) {}
      var sets = {};
      function computeSets() {
        UNIV.forEach(function (k) { sets[k] = UNIV.indexOf(k) <= UNIV.indexOf(universe) && (typeof unlocked !== "function" || unlocked(k)); });
      }
      computeSets();
      function setOf(d) { return d.set || SET_OF[d.title] || "N"; }
      var univEl = document.getElementById("univ");
      SET_NAMES.forEach(function (sn) {
        var b = document.createElement("button");
        b.textContent = sn[1];
        b.dataset.k = sn[0];
        b.addEventListener("click", function () {
          if (busy) return;
          universe = sn[0];
          try { localStorage.setItem("pasapas_universe", universe); } catch (err) {}
          computeSets();
          renderUniv();
          applySets();
          b.animate([{ transform: "scale(1.2)" }, { transform: "scale(1)" }], { duration: ms(350), easing: "ease-out" });
        });
        univEl.appendChild(b);
      });
      function renderUniv() {
        univEl.querySelectorAll("button").forEach(function (b) {
          b.classList.toggle("on", sets[b.dataset.k]);
          b.classList.toggle("cur", b.dataset.k === universe);
        });
      }
      renderUniv();
      // Variante utilisée : celle du plus grand ensemble coché, si l'ensemble
      // du chapitre ne l'est pas
      function variantKey(d) {
        if (!d.variants || sets[setOf(d)]) return null;
        var key = null;
        UNIV.forEach(function (k) { if (sets[k] && d.variants[k]) key = k; });
        return key;
      }
      function available(d) { return sets[setOf(d)] || !!variantKey(d); }
      function applySets() {
        if (typeof badgeMM !== "undefined" && badgeMM) refreshBadges();
        var cur0 = DEMOS[demoIndex], before = cur0.steps;
        DEMOS.forEach(function (d) {
          if (!d.variants && !d.alts) return;
          var vk = variantKey(d);
          d.steps = curSteps(d);
          d.label = vk ? d.variants[vk].title : null;
        });
        tabsEl.querySelectorAll(".tab").forEach(function (t, k) { t.hidden = !available(DEMOS[k]); });
        if (cur0.steps !== before && !busy && homeEl && homeEl.hidden) { selectDemo(demoIndex); return; }
        var cu = DEMOS[demoIndex].custom;
        if (cu === "sol") solRender(true);
        if (cu === "ens" && ensState && !ensState.ready) ensStart();
        if (!available(DEMOS[demoIndex]) && !busy) {
          for (var k = 0; k < DEMOS.length; k++) if (available(DEMOS[k])) { selectDemo(k); break; }
        }
      }

      // ---------- Progression : déblocage des ensembles ----------
      // Un ensemble s'ouvre quand tous les chapitres du précédent sont
      // réussis. Réussir : Singapour (badge), Premiers / Ensembles (3 de
      // suite), Calcul (3 regardés), Solutions (6 vus), une démo animée
      // (WIN fois sans faute en mode jeu). Le mode prof ouvre tout.
      var doneMap = {}, runs = {}, prof = false;
      try {
        doneMap = JSON.parse(localStorage.getItem("pasapas_done") || "{}");
        runs = JSON.parse(localStorage.getItem("pasapas_runs") || "{}");
        prof = localStorage.getItem("pasapas_prof") === "1";
        // Une seule fois : Fraction avait été validé avec l'ancien examen
        // (un point par réponse, avant v111) — à repasser pour de vrai
        if (localStorage.getItem("pasapas_mig_frac") !== "1") {
          delete doneMap["Fraction"];
          var es = JSON.parse(localStorage.getItem("pasapas_examscore") || "{}") || {};
          delete es["Fraction"];
          localStorage.setItem("pasapas_examscore", JSON.stringify(es));
          if (typeof examScores !== "undefined") delete examScores["Fraction"];
          localStorage.setItem("pasapas_done", JSON.stringify(doneMap));
          localStorage.setItem("pasapas_mig_frac", "1");
        }
      } catch (e) {}
      if (hasBadge()) doneMap["Singapour"] = true;

      function chaptersOf(k) { return DEMOS.filter(function (d) { return setOf(d) === k; }); }
      function setDone(k) { return chaptersOf(k).every(function (d) { return doneMap[d.title]; }); }
      function unlocked(k) {
        if (prof || !doneMap) return true;
        var i = UNIV.indexOf(k);
        return i === 0 || (unlocked(UNIV[i - 1]) && setDone(UNIV[i - 1]));
      }
      function toast(t) {
        var el = document.getElementById("toast");
        el.textContent = t;
        el.hidden = false;
        el.animate([{ opacity: 0, transform: "translate(-50%, -8px)" }, { opacity: 1, transform: "translate(-50%, 0)" }], { duration: ms(300) });
        clearTimeout(toast._t);
        toast._t = setTimeout(function () { el.hidden = true; }, 2600);
      }
      function markDone(title) {
        if (doneMap[title]) return;
        var before = UNIV.filter(unlocked).length;
        doneMap[title] = true;
        try { localStorage.setItem("pasapas_done", JSON.stringify(doneMap)); } catch (e) {}
        var after = UNIV.filter(unlocked).length;
        SND.badge();
        computeSets(); applySets();
        if (POWERS[title]) setTimeout(function () { announcePower(title); }, ms(900));
        toast("✓ " + tr(title) + (after > before ? "  —  " + SYM_OF[UNIV[after - 1]] + (LANG === "en" ? " unlocked" : " ouvert") : ""));
        renderUniv();
      }
      // Recommencer : un chapitre (celui ouvert) ou toute la progression.
      // Un second appui confirme — rien ne s'efface par accident.
      var resetCh = document.getElementById("resetCh"), resetAll = document.getElementById("resetAll"), resetArm = null;
      function resetLabels() {
        var en = LANG === "en", onCh = homeEl.hidden;
        resetArm = null;
        resetCh.hidden = !onCh;
        resetCh.textContent = (en ? "Restart “" : "Recommencer « ") + tr(DEMOS[demoIndex].title) + (en ? "”" : " »");
        resetAll.textContent = en ? "Restart everything" : "Tout recommencer";
      }
      function resetSave() {
        try {
          localStorage.setItem("pasapas_done", JSON.stringify(doneMap));
          localStorage.setItem("pasapas_runs", JSON.stringify(runs));
          localStorage.setItem("pasapas_examscore", JSON.stringify(examScores));
        } catch (e) {}
        computeSets(); applySets(); renderUniv(); refreshBadges();
        if (homeEl.hidden) selectDemo(demoIndex);
        else if (typeof renderHome === "function") renderHome();
      }
      function resetConfirm(btn, what, fn) {
        if (resetArm !== what) {
          resetArm = what;
          btn.textContent = LANG === "en" ? "Sure? Tap again" : "Sûr ? Touche encore";
          SND.tick();
          return;
        }
        fn();
        closeMenu();
        resetLabels();
        toast(LANG === "en" ? "Restarted" : "C'est reparti de zéro");
      }
      resetCh.addEventListener("click", function (e) {
        e.stopPropagation();
        resetConfirm(resetCh, "ch", function () {
          var t = DEMOS[demoIndex].title;
          delete doneMap[t]; delete runs[t]; delete examScores[t];
          if (t === "Singapour") setBadge(false);
          resetSave();
        });
      });
      resetAll.addEventListener("click", function (e) {
        e.stopPropagation();
        resetConfirm(resetAll, "all", function () {
          doneMap = {}; runs = {}; examScores = {};
          setBadge(false);
          resetSave();
        });
      });
      // Pouvoirs gagnés en réussissant un chapitre (utilisés dans Fusion)
      var POWERS = {
        "Premiers": { btn: "n → 2·3·…", fr: ["Décomposer en facteurs premiers", "Touche une bulle nombre puis ce pouvoir : 12 = 2²·3. Dans Fusion, deux bulles au nombre différent peuvent alors se mettre en facteur : 12·x + 18 = 6·(2·x + 3)."],
                      en: ["Prime factorisation", "Tap a number bubble then this power: 12 = 2²·3. In Fusion, two bubbles with different numbers can then be factored: 12·x + 18 = 6·(2·x + 3)."] },
        "−×−": { btn: "(−1)·(−1) = 1",fr: ["Moins par moins", "Deux demi-tours font un tour complet : (−1)·(−1) = 1. Tu peux maintenant l'écrire directement, sans refaire la rotation."],
                 en: ["Minus times minus", "Two half-turns make a full turn: (−1)·(−1) = 1. You can now write it directly, without redoing the rotation."] },
        "Distribuer": { btn: "k·(a + b) → k·a + k·b", fr: ["Développer", "Dans Fusion, touche une bulle k·( … ) puis ce pouvoir : elle se développe. C'est l'inverse de factoriser. Ailleurs, le badge recopie d'un coup chaque terme (ex. dans Double)."],
                        en: ["Expand", "In Fusion, tap a k·( … ) bubble then this power: it expands. It is the reverse of factoring."] },
        "Calcul": { btn: "n → a + b", fr: ["Découper un nombre", "Comme en calcul mental (16 = 10 + 6) : dans Fusion, une bulle nombre se découpe pour faire apparaître le nombre d'une voisine. 7 = 5 + 2, puis 5·x + 5 = 5·(x + 1)."],
                    en: ["Split a number", "As in mental maths (16 = 10 + 6): in Fusion, a number bubble splits to reveal a neighbour's number. 7 = 5 + 2, then 5·x + 5 = 5·(x + 1)."] },
        "(a+b)²": { btn: "+ c − c", fr: ["Compléter le carré", "Dans Fusion, touche la bulle 6·x puis ce pouvoir : + 9 − 9 apparaît (ça vaut 0). x² + 6·x + 9 se referme alors en (x + 3)². Ailleurs, le badge développe d'un coup une parenthèse au carré."],
                    en: ["Complete the square", "In Fusion, tap the 6·x bubble then this power: + 9 − 9 appears (worth 0). x² + 6·x + 9 then closes into (x + 3)²."] },
        "Pascal": { btn: "aⁿ⁺¹ → a·aⁿ", fr: ["Puissances", "Chaque ligne du triangle double : 2ⁿ⁺¹ = 2·2ⁿ. Dans Fusion, 2ⁿ⁺¹ + 2ⁿ = 2·2ⁿ + 2ⁿ = 3·2ⁿ."],
                    en: ["Powers", "Each row of the triangle doubles: 2ⁿ⁺¹ = 2·2ⁿ. In Fusion, 2ⁿ⁺¹ + 2ⁿ = 2·2ⁿ + 2ⁿ = 3·2ⁿ."] },
        "(a+b)(a−b)": { btn: "× (√a + b)/(√a + b)", fr: ["Quantité conjuguée", "(a − b)(a + b) = a² − b² fait disparaître la racine : 1/(√2 − 1) = (√2 + 1)/(2 − 1) = √2 + 1."],
                        en: ["Conjugate", "(a − b)(a + b) = a² − b² removes the root: 1/(√2 − 1) = (√2 + 1)/(2 − 1) = √2 + 1."] },
        "Piège": { btn: "a/a = 1", fr: ["Une quantité sur elle-même", "(x + 3)/3 = x/3 + 3/3 : on divise chaque terme. Seul 3/3 se simplifie, et 3/3 = 1. Donc (x + 3)/3 = x/3 + 1. Le badge fait a/a = 1 d'un coup quand son icône luit."],
                   en: ["A quantity over itself", "(x + 3)/3 = x/3 + 3/3: divide each term. Only 3/3 simplifies, and 3/3 = 1. So (x + 3)/3 = x/3 + 1. The badge does a/a = 1 at once when its icon glows."] },
        "Regrouper": { btn: "−2x + 3 − x → −2x − x + 3", fr: ["Regrouper", "Les termes en x se rapprochent, chacun avec son signe. Quand l'icône luit, un appui regroupe d'un coup."],
                       en: ["Group", "The x terms move together, each with its sign. When the icon glows, one tap groups them at once."] },
        "x en facteur": { btn: "−2x − x → (−2 − 1)·x", fr: ["x en facteur", "On sort x : il reste les nombres devant, avec leur signe. Quand l'icône luit, un appui factorise d'un coup."],
                          en: ["Factor out x", "Take x out: the numbers in front stay, with their signs. When the icon glows, one tap factors at once."] },
        "Fraction": { btn: "1 → c/c", fr: ["Même dénominateur", "Une bulle nombre prend le dénominateur d'une fraction voisine : 1 = c/c."],
                      en: ["Same denominator", "A number bubble takes the denominator of a nearby fraction: 1 = c/c."] }
      };
      function hasPower(ch) { return prof || !!doneMap[ch]; }
      // Badges : un appui dessus rappelle ce qu'ils veulent dire
      var BADGE_INFO = {
        dix: { btn: "10", fr: ["Cadre de dix", "7 + 5 = 5 + 2 + 5 = 10 + 2 = 12 : on complète d'abord la dizaine. Le cadre de dix s'affiche sous chaque addition ; la flèche lance la suite."],

        homeMap.innerHTML = "";
        ZONES.forEach(function (z) {
          var e = svgEl("ellipse", { cx: MAP_CX, cy: z.cy, rx: z.rx, ry: z.ry }, homeMap);
          var tease = !!TEASE[z.k];
          var isLock = tease || !unlocked(z.k);
          if (isLock) e.classList.add("lock");
          if (!tease && setDone(z.k)) e.classList.add("done");
          if (z.k === homeSel) e.classList.add("sel");
          var t = svgEl("text", { x: z.lx, y: z.k === "N" ? z.ly + 3 : z.ly, class: (isLock ? "lock" : "") + (z.k === "N" ? " big" : "") }, homeMap);
          t.textContent = z.lab;
        });
        var info = document.getElementById("homeInfo"), list = document.getElementById("homeList");
        list.innerHTML = "";
        if (TEASE[homeSel]) {
          info.textContent = TEASE[homeSel][LANG === "en" ? 1 : 0] + (LANG === "en" ? " — coming soon." : " — bientôt.");
          return;
        }
        var open = unlocked(homeSel);
        var prevK = UNIV[UNIV.indexOf(homeSel) - 1];
        info.textContent = open ? "" : (LANG === "en" ? "Locked — pass every chapter of " : "Verrouillé — réussis tous les chapitres de ") + SYM_OF[prevK];
        chaptersOf(homeSel).forEach(function (d) {
          var b = document.createElement("button");
          b.textContent = tr(d.title);
          if (/[()²]/.test(d.title)) b.style.textTransform = "none";
          // Validé : ✓ et bordure vive — seulement dans un ensemble ouvert
          // (un ensemble verrouillé montre ses chapitres tous pareils)
          if (open && doneMap[d.title]) { b.classList.add("done"); b.textContent = "✓ " + b.textContent; }
          b.disabled = !open;
          b.addEventListener("click", function () {
            // L'univers de travail monte au moins jusqu'à l'ensemble du chapitre
            if (UNIV.indexOf(universe) < UNIV.indexOf(homeSel)) {
              universe = homeSel;
              try { localStorage.setItem("pasapas_universe", universe); } catch (e) {}
              computeSets(); renderUniv(); applySets();
            }
            selectDemo(DEMOS.indexOf(d));
          });
          list.appendChild(b);
        });
        // Deux lignes au plus : la largeur suit le nombre de chapitres
        var perRow = Math.max(1, Math.ceil(list.children.length / 2));
        [].forEach.call(list.children, function (b) { b.style.flexBasis = "calc(" + (100 / perRow) + "% - 0.4rem)"; });
      }
      // Toucher ou glisser sur la carte : l'ensemble sous le doigt est
      // sélectionné en continu (l'ellipse la plus intérieure qui contient
      // le point).
      function zoneAt(ev) {
        var pt = homeMap.createSVGPoint();
        pt.x = ev.clientX; pt.y = ev.clientY;
        var m = homeMap.getScreenCTM();
        if (!m) return null;
        var p = pt.matrixTransform(m.inverse());
        var hit = null;
        ZONES.forEach(function (z) {
          var dx = (p.x - MAP_CX) / z.rx, dy = (p.y - z.cy) / z.ry;
          if (dx * dx + dy * dy <= 1) hit = z.k; // les suivantes sont plus intérieures
        });
        return hit;
      }
      var mapDrag = false;
      function mapPick(ev) {
        var k = zoneAt(ev);
        if (k && k !== homeSel) { homeSel = k; SND.tick(); renderHome(); }
      }
      homeMap.addEventListener("pointerdown", function (ev) {
        ev.preventDefault();
        mapDrag = true;
        try { homeMap.setPointerCapture(ev.pointerId); } catch (e) {}
        mapPick(ev);
      });
      homeMap.addEventListener("pointermove", function (ev) { if (mapDrag) mapPick(ev); });
      ["pointerup", "pointercancel"].forEach(function (t) {
        homeMap.addEventListener(t, function () { mapDrag = false; });
      });

      function showHome() {
        calcRun++;
        examBtn.hidden = true;
        closeChoice();
        [sgEl, pfEl, ensEl, solEl, calcEl, fusEl, pasEl, vennEl, strEl, regEl, explEl, stageWrap, document.getElementById("controls")].forEach(function (e) { e.hidden = true; });
        univEl.hidden = true;
        homeEl.hidden = false;
        document.getElementById("title").textContent = "Pas à Pas";
        try { localStorage.setItem("pasapas_demo", ""); } catch (e) {}
        // On revient sur l'ensemble du chapitre qu'on quitte (dans ℚ → ℚ)
        var from = DEMOS[demoIndex] && SET_OF[DEMOS[demoIndex].title];
        if (from && UNIV.indexOf(from) >= 0) homeSel = from;
        renderHome();
      }
      function hideHome() {
        if (!homeEl.hidden) { homeEl.hidden = true; univEl.hidden = false; }
      }
      document.getElementById("homeBtn").addEventListener("click", function () { if (!busy) showHome(); });

      var profBtn = document.getElementById("profBtn");
      var soundBtn = document.getElementById("soundBtn");
      function renderToggles() {
        profBtn.textContent = (LANG === "en" ? "Teacher mode: " : "Mode prof : ") + (prof ? "✓" : "—");
        soundBtn.textContent = (LANG === "en" ? "Sound: " : "Son : ") + (soundOn ? "✓" : "—");
      }
      profBtn.addEventListener("click", function () {
        prof = !prof;
        try { localStorage.setItem("pasapas_prof", prof ? "1" : "0"); } catch (e) {}
        renderToggles(); renderUniv(); applySets();
        if (!homeEl.hidden) renderHome();
      });
      soundBtn.addEventListener("click", function () {
        soundOn = !soundOn;
        try { localStorage.setItem("pasapas_sound", soundOn ? "1" : "0"); } catch (e) {}
        renderToggles();
        SND.tick();
      });
      document.getElementById("langBtn").addEventListener("click", function () { renderToggles(); if (!homeEl.hidden) renderHome(); });
      renderToggles();

      // Reprend là où on s'était arrêté (même démo qu'à la dernière visite)
      var startDemo = 0;
      try {
        var savedTitle = localStorage.getItem("pasapas_demo");
        DEMOS.forEach(function (d, k) { if (d.title === savedTitle) startDemo = k; });
      } catch (e) {}
      computeSets(); renderUniv();
      var hadDemo = false;
      try { hadDemo = !!localStorage.getItem("pasapas_demo"); } catch (e) {}
      if (!sets[setOf(DEMOS[startDemo])]) hadDemo = false;
      selectDemo(startDemo);
      applySets();
      if (!hadDemo) showHome();

      // Installable (PWA) : manifeste + service worker « réseau d'abord » —
      // toujours la version en ligne si possible, la copie locale hors ligne
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
    })();
  </script>

  <script>
    // Mise à jour automatique (même principe que la page d'accueil du
    // portfolio) : aucune progression n'est encore sauvegardée ici, donc
    // rien à perdre en rechargeant dès qu'une nouvelle version est en ligne.
    // Le paramètre anti-cache dans l'URL de vérification est nécessaire :
    // un simple `cache: 'no-store'` n'empêche que la mise en cache locale
    // du navigateur, pas celle du CDN devant GitHub Pages, qui peut renvoyer
    // une réponse périmée même à une requête "no-store".
    (function () {
      var PAGE = "pas-a-pas";
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return; // évite les rafales de clics
        lastCheck = now0;
        try {
          var url = (location.pathname || "index.html") + "?_cb=" + now0;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          var tag = res.headers.get("etag") || res.headers.get("last-modified");
          if (!tag) return;
          var key = "pm_pageVersion_" + PAGE;
          var stored = localStorage.getItem(key);
          if (stored === null) { localStorage.setItem(key, tag); return; }
          if (tag !== stored) {
            var now = Date.now();
            var guard = "pm_lastUpdateReload_" + PAGE;
            var lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem(guard)) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try {
              localStorage.setItem(key, tag);
              sessionStorage.setItem(guard, String(now));
            } catch (e) {}
            location.replace(location.pathname + "?_r=" + now);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>

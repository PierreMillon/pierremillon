        ok: function () { bip(660, 0.08); bip(990, 0.12, "square", 0.08); },
        bad: function () { bip(150, 0.25, "sawtooth", 0, 0.04); },
        tick: function () { bip(1200, 0.03, "square", 0, 0.02); },
        badge: function () { [523, 659, 784, 1047].forEach(function (f, i) { bip(f, 0.14, "square", i * 0.1, 0.05); }); }
      };
      document.addEventListener("pointerdown", function () {
        if (soundOn && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      }, { once: true });

      // ---------- Mode jeu ----------
      // À chaque étape qui change l'écriture, deux propositions : la vraie
      // étape suivante et une fausse, fabriquée en changeant un signe ou un
      // nombre (le vérificateur garantit qu'elle est vraiment fausse). La
      // bonne réponse lance l'animation ; une erreur secoue la proposition
      // et montre la bonne.
      var gameMode = false;
      var gameRun = { demo: "", faults: 0, counted: true };
      try { gameMode = localStorage.getItem("pasapas_game") === "1"; } catch (e) {}
      var choiceEl = null;

      function sameValue(txtA, txtB) {
        var envs = [{ x: 1.7, O: 2.3, Q: -0.9, a: 1.3, b: -2.2 }, { x: -3.1, O: 0.6, Q: 4.2, a: -0.7, b: 3.4 }];
        try {
          if (txtA.indexOf("=") >= 0 || txtB.indexOf("=") >= 0) {
            function root(t) {
              var sd = t.split("=");
              var f = function (x) { return evalExpr(sd[0], { x: x, O: 0, Q: 0, a: 0, b: 0 }) - evalExpr(sd[1], { x: x, O: 0, Q: 0, a: 0, b: 0 }); };
              var f0 = f(0), f1 = f(1);
              return Math.abs(f1 - f0) < 1e-12 ? NaN : -f0 / (f1 - f0);
            }
            return Math.abs(root(txtA) - root(txtB)) < 1e-9;
          }
          return envs.every(function (env) {
            var a = evalC(txtA, env), b = evalC(txtB, env);
            return Math.abs(a[0] - b[0]) < 1e-9 && Math.abs(a[1] - b[1]) < 1e-9;
          });
        } catch (e) { return false; }
      }

      function flatTokens(list, out) {
        list.forEach(function (it) {
          if (it.frac) { flatTokens(it.num, out); flatTokens(it.den, out); }
          else if (it.cancel) { flatTokens(it.top, out); flatTokens(it.bottom, out); if (it.eq) flatTokens(it.eq, out); }
          else out.push(it);
        });
        return out;
      }

      function makeWrong(step) {
        var copy = JSON.parse(JSON.stringify(step.expr));
        var toks = flatTokens(copy, []);
        var cands = [];
        toks.forEach(function (t) {
          if (t.t === "+" || t.t === "−") cands.push(function () { var o = t.t; t.t = o === "+" ? "−" : "+"; return function () { t.t = o; }; });
          var m = /^(\(?−?)(\d+)/.exec(t.t);
          if (m) cands.push(function () { var o = t.t; t.t = t.t.replace(/\d+/, String(Number(m[2]) + 1)); return function () { t.t = o; }; });
        });
        var good = exprText(step.expr);
        for (var n = 0; n < 12 && cands.length; n++) {
          var k = Math.floor(Math.random() * cands.length);
          var undo = cands[k]();
          var txt = exprText(copy);
          if (txt !== good && !sameValue(txt, good)) return { expr: copy };
          undo();
          cands.splice(k, 1);
        }
        return null;
      }

      function gameChoice(to) {
        var st = DEMOS[demoIndex].steps[to], here = DEMOS[demoIndex].steps[cur];
        if (!st.expr || st.summary || !here.expr) return false;
        if (exprText(st.expr) === exprText(here.expr)) return false;
        var wrong = makeWrong(st);
        if (!wrong) return false;
        choiceEl = document.createElement("div");
        choiceEl.className = "choices";
        var opts = [{ step: st, ok: true }, { step: wrong, ok: false }];
        if (Math.random() < 0.5) opts.reverse();
        opts.forEach(function (o) {
          var b = document.createElement("button");
          b.className = "choice";
          b.dataset.ok = o.ok ? "1" : "0"; // pour les tests automatiques
          var e = buildExprEl(o.step, true);
          b.appendChild(e);
          b.addEventListener("click", function () {
            if (!choiceEl) return;
            if (o.ok) {
              SND.ok();
              b.classList.add("good");
              setTimeout(function () { closeChoice(); go(to); }, ms(350));
            } else {
              SND.bad();
              gameRun.faults++;
              b.classList.add("bad");
              b.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], { duration: ms(300) });
              choiceEl.querySelectorAll(".choice").forEach(function (c) { if (c !== b) c.classList.add("good"); });
              setTimeout(function () { closeChoice(); go(to); }, ms(1400));
            }
          });
          choiceEl.appendChild(b);
        });
        stageWrap.appendChild(choiceEl);
        choiceEl.querySelectorAll(".expr").forEach(function (e) { fitOneLine(e, e.parentNode); });
        choiceEl.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: ms(300) });
        return true;
      }

      function closeChoice() {
        if (choiceEl) { choiceEl.remove(); choiceEl = null; }
      }

      function prev() {
        closeChoice();
        if (DEMOS[demoIndex].custom === "fus") { fusStart(); return; }
        var demo = DEMOS[demoIndex];
        if (demo.custom) return;
        if (busy) return;
        if (cur === 0) {
          // Boucle vers la fin : voir le résultat, revenir au départ, sans
          // jamais rester coincé à une extrémité.
          go(demo.steps.length - 1);
        } else {
          go(cur - 1);
        }
      }

      function selectDemo(i) {
        if (busy) return;
        gameRun = { demo: DEMOS[i].title, faults: 0, counted: false };
        hideHome();
        document.getElementById("title").textContent = tr(DEMOS[i].title);
        demoIndex = i;
        cur = 0;
        lastTopStep = null;
        tabsEl.querySelectorAll(".tab").forEach(function (t, k) {
          t.setAttribute("aria-selected", k === i ? "true" : "false");
        });
        closeChoice();
        try { localStorage.setItem("pasapas_demo", DEMOS[i].title); } catch (e) {}
        var custom = DEMOS[i].custom;
        sgEl.hidden = custom !== "sg";
        pfEl.hidden = custom !== "pf";
        ensEl.hidden = custom !== "ens";
        solEl.hidden = custom !== "sol";
        calcEl.hidden = custom !== "calc";
        fusEl.hidden = custom !== "fus";
        if (custom !== "calc") calcRun++;
        stageWrap.hidden = !!custom;
        document.getElementById("controls").hidden = false;
        prevBtn.style.visibility = custom ? "hidden" : "";
        prevBtn.textContent = "←";
        if (custom === "sg") { sgStart(); return; }
        if (custom === "pf") { pfStart(); return; }
        if (custom === "ens") { ensStart(); return; }
        if (custom === "sol") { solStart(); return; }
        if (custom === "calc") { calcStart(); return; }
        if (custom === "fus") { fusStart(); return; }
        buildDots(DEMOS[i]);
        build(DEMOS[i].steps[0]);
        refreshUi();
        syncTop(false);
      }

      DEMOS.forEach(function (d, i) {
        var b = document.createElement("button");
        b.className = "tab";
        b.setAttribute("role", "tab");
        b.textContent = tr(d.title);
        b.dataset.title = d.title;
        // Titre mathématique : pas de majuscules (a ≠ A)
        if (/[()²]/.test(d.title)) b.style.textTransform = "none";
        b.addEventListener("click", function () { selectDemo(i); });
        tabsEl.appendChild(b);
      });

      nextBtn.addEventListener("click", next);
      prevBtn.addEventListener("click", prev);

      document.addEventListener("keydown", function (e) {
        if (DEMOS[demoIndex].custom) {
          if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
          return;
        }
        if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
        if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      });

      // ---------- Badge « cadre de dix » ----------
      // Gagné dans le chapitre Singapour. Tant qu'on ne l'a pas, les
      // additions des autres démos se font sans jetons ; une fois gagné,
      // le cadre de dix réapparaît sous chaque addition pour rappeler
      // visuellement 7 + 5 = 5 + 2 + 5 = 10 + 2.

      var BADGE_KEY = "pasapas_badge_dix";
      var badgeChip = document.getElementById("badgeChip");

      function hasBadge() {
        try { return localStorage.getItem(BADGE_KEY) === "1"; } catch (e) { return false; }
      }

      function setBadge(on) {
        try {
          if (on) localStorage.setItem(BADGE_KEY, "1");
          else localStorage.removeItem(BADGE_KEY);
        } catch (e) {}
        badgeChip.hidden = !hasBadge();
      }

      document.getElementById("badgeReset").addEventListener("click", function () {
        closeMenu();
        setBadge(false);
        sgStreakN = 0;
        sgRenderStreak();
      });

      // ---------- Chapitre Singapour : défi « faire 10 » ----------
      // Programme MOE (P1) : addition dans 20 par « make ten » sur des
      // cadres de dix. Le premier nombre est déjà posé ; on glisse soi-même
      // les jetons du second. Règle : on remplit la dizaine avant d'en
      // commencer une autre — un jeton lâché dans le 2e cadre trop tôt
      // revient. 3 réussites de suite sans erreur = badge.

      var sgEl = document.getElementById("sg");
      var sgEq = document.getElementById("sgEq");
      var sgBoard = document.getElementById("sgBoard");
      var sgMsg = document.getElementById("sgMsg");
      var SG_CELL = 36; // recalculé à chaque manche selon la place disponible
      var sgStreakN = 0;
      var sgState = null;

      function sgRenderStreak() {
        var d = document.getElementById("sgStreak").children;
        for (var i = 0; i < d.length; i++) d[i].classList.toggle("on", i < sgStreakN);
      }

      function sgSlot(k) {
        var f = Math.floor(k / 10), r = Math.floor((k % 10) / 5), c = k % 5;
        var left = (sgBoard.clientWidth - 5 * SG_CELL) / 2;
        return { x: left + c * SG_CELL + SG_CELL / 2, y: 12 + f * (2 * SG_CELL + 14) + r * SG_CELL + SG_CELL / 2 };
      }

      function sgPlace(el, x, y, size) {
        var d = size || el._size || SG_CELL - 10;
        el.style.width = d + "px";
        el.style.height = d + "px";
        el.style.left = (x - d / 2) + "px";
        el.style.top = (y - d / 2) + "px";
      }

      var sgRound = 0;
      function sgStart() {
        sgRound++;
        // Une manche sur deux : soustraction (dès la 2e manche)
        if (sgRound > 1 && sgRound % 2 === 0) { sgStartSub(); return; }
        var a = 6 + Math.floor(Math.random() * 4);           // 6..9
        var bMin = 11 - a;                                     // dépasse 10
        var b = bMin + Math.floor(Math.random() * (10 - bMin)); // ..9
        sgState = { a: a, b: b, filled: {}, placed: 0, mistake: false, done: false };
        sgBoard.innerHTML = "";
        // Deux cadres + réserve ≈ 5 cases de haut : tout doit tenir dans
        // l'écran, sans jamais défiler
        SG_CELL = Math.max(20, Math.min(44, (sgBoard.clientHeight - 50) / 5, (sgBoard.clientWidth - 10) / 5));
        sgEq.textContent = a + " + " + b;
        sgMsg.textContent = "";
        nextBtn.disabled = true;
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
        sgRenderStreak();
        badgeChip.hidden = !hasBadge();

        for (var k = 0; k < 20; k++) {
          var s = sgSlot(k);
          var c = document.createElement("span");
          c.className = "sg-cell";
          c.dataset.k = k;
          c.style.left = (s.x - SG_CELL / 2) + "px";
          c.style.top = (s.y - SG_CELL / 2) + "px";
          c.style.width = SG_CELL + "px";
          c.style.height = SG_CELL + "px";
          sgBoard.appendChild(c);
        }
        for (var i = 0; i < a; i++) {
          var g = document.createElement("span");
          g.className = "sg-dot given";
          var gs = sgSlot(i);
          sgPlace(g, gs.x, gs.y);
          sgBoard.appendChild(g);
          sgState.filled[i] = true;
        }
        // Le second nombre attend dans la réserve, sous les cadres
        var trayY = sgSlot(10).y + 2 * SG_CELL + 20;
        // Réserve : jamais de chevauchement — les jetons rétrécissent si
        // la ligne est trop longue pour la largeur de l'écran
        var gap = Math.min(SG_CELL, (sgBoard.clientWidth - 12) / b);
        var traySize = Math.min(SG_CELL - 10, gap - 5);
        var trayLeft = sgBoard.clientWidth / 2 - (b - 1) * gap / 2;
        for (var j = 0; j < b; j++) {
          var dot = document.createElement("span");
          dot.className = "sg-dot free";
          var home = { x: trayLeft + j * gap, y: trayY };
          dot._size = traySize;
          sgPlace(dot, home.x, home.y);
          sgBoard.appendChild(dot);
          sgDraggable(dot, home);
        }
      }

      // Déplacement souple : le jeton part de là où il est et rebondit
      // légèrement en arrivant (léger dépassement, puis retour)
      function sgMove(dot, x, y, delay) {
        var r0 = dot.getBoundingClientRect();
        sgPlace(dot, x, y);
        var r1 = dot.getBoundingClientRect();
        var dx = r0.left + r0.width / 2 - (r1.left + r1.width / 2);
        var dy = r0.top + r0.height / 2 - (r1.top + r1.height / 2);
        var s0 = r0.width / (r1.width || 1);
        return done(dot.animate([
          { transform: "translate(" + dx + "px," + dy + "px) scale(" + s0 + ")" },
          { transform: "translate(0,0) scale(1)" }
        ], { duration: ms(520), delay: ms(delay || 0), easing: "cubic-bezier(.3,1.5,.5,1)", fill: "backwards" }));
      }

      function sgFirstFull() {
        for (var i = 0; i < 10; i++) if (!sgState.filled[i]) return false;
        return true;
      }

      // Prochaine case libre dans le bon ordre : on finit la dizaine d'abord
      function sgNextFree() {
        for (var k = 0; k < 20; k++) if (!sgState.filled[k]) return k;
        return -1;
      }

      function sgPut(dot, k, delay) {
        var s = sgSlot(k);
        dot._size = 0;
        dot.dataset.k = k;
        sgState.filled[k] = true;
        sgState.placed++;
        return sgMove(dot, s.x, s.y, delay);
      }

      function sgTakeOut(dot) {
        var k = Number(dot.dataset.k);
        delete sgState.filled[k];
        delete dot.dataset.k;
        sgState.placed--;
        dot._size = dot._traySize;
        sgMove(dot, dot._home.x, dot._home.y);
      }

      function sgCheckWin() {
        if (sgState.placed === sgState.b && !sgState.done) sgWin();
      }

      // Un appui bref pose le jeton dans la prochaine case libre (ou le
      // retire s'il est déjà posé) ; un glissé le pose où on le lâche, ou
      // le renvoie dans la réserve si on le lâche hors des cadres.
      function sgDraggable(dot, home) {
        var start = null;
        dot._home = home;
        dot._traySize = dot._size;
        dot.addEventListener("pointerdown", function (e) {
          if (!sgState || sgState.done) return;
          e.preventDefault();
          dot.setPointerCapture(e.pointerId);
          var r = sgBoard.getBoundingClientRect();
          start = { ox: r.left, oy: r.top, x: e.clientX, y: e.clientY, moved: false };
        });
        dot.addEventListener("pointermove", function (e) {
          if (!start) return;
          if (!start.moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 8) return;
          if (!start.moved) {
            start.moved = true;
            dot.classList.add("drag");
            // Il quitte sa case dès qu'on commence à le tirer
            if (dot.dataset.k !== undefined) {
              delete sgState.filled[Number(dot.dataset.k)];
              delete dot.dataset.k;
              sgState.placed--;
            }
          }
          sgPlace(dot, e.clientX - start.ox, e.clientY - start.oy);
        });
        function drop(e) {
          if (!start) return;
          var st = start;
          start = null;
          dot.classList.remove("drag");

          if (!st.moved) {
            if (dot.dataset.k !== undefined) { sgTakeOut(dot); return; }
            var k = sgNextFree();
            if (k >= 0) sgPut(dot, k).then(sgCheckWin);
            return;
          }

          var x = e.clientX - st.ox, y = e.clientY - st.oy;
          var best = -1, bestD = SG_CELL * 0.8;
          for (var k2 = 0; k2 < 20; k2++) {
            if (sgState.filled[k2]) continue;
            var s = sgSlot(k2);
            var d = Math.hypot(s.x - x, s.y - y);
            if (d < bestD) { bestD = d; best = k2; }
          }
          if (best < 0) {
            dot._size = dot._traySize;
            sgMove(dot, home.x, home.y);
            return;
          }
          if (best >= 10 && !sgFirstFull()) {
            sgWrong();
            dot._size = dot._traySize;
            sgMove(dot, home.x, home.y);
            return;
          }
          sgPut(dot, best).then(sgCheckWin);
        }
        dot.addEventListener("pointerup", drop);
        dot.addEventListener("pointercancel", drop);
      }

      // Appui sur le 2e nombre : tous ses jetons partent se ranger d'un
      // coup, dans l'ordre (la dizaine d'abord). Manche de démonstration :
      // elle ne compte pas pour le badge.
      function sgAutoFill() {
        if (!sgState || sgState.done) return;
        sgState.auto = true;
        var dots = Array.prototype.filter.call(sgBoard.querySelectorAll(".sg-dot.free"), function (d) {
          return d.dataset.k === undefined;
        });
        var moves = dots.map(function (d, i) {
          var k = sgNextFree();
          return sgPut(d, k, i * 140);
        });
        Promise.all(moves).then(sgCheckWin);
      }

      // Jeton lâché dans la 2e dizaine alors que la 1re n'est pas pleine :
      // la 1re s'allume en jaune, le jeton revient, la série repart de 0.
      function sgWrong() {
        sgState.mistake = true;
        sgStreakN = 0;
        sgRenderStreak();
        var cells = sgBoard.querySelectorAll(".sg-cell");
        for (var i = 0; i < 10; i++) cells[i].classList.add("warn");
        setTimeout(function () {
          for (var i = 0; i < 10; i++) cells[i].classList.remove("warn");
        }, ms(900));
      }

      // ---------- Soustraction : « retirer de 10 » ----------
      // 13 − 5 : la dizaine pleine et 3 à côté. On retire 5 jetons de la
      // dizaine (pas des 3 isolés) : 10 − 5 = 5, plus les 3 → 8.
      // Retirer dans le 2e cadre = erreur (on casse d'abord la dizaine).
      function sgStartSub() {
        var u = 1 + Math.floor(Math.random() * 7);             // 1..7
        var a = 10 + u;
        var b = u + 1 + Math.floor(Math.random() * (9 - u));   // u+1..9
        sgState = { op: "-", a: a, b: b, u: u, filled: {}, removed: 0, placed: 0, mistake: false, done: false };
        sgBoard.innerHTML = "";
        SG_CELL = Math.max(20, Math.min(44, (sgBoard.clientHeight - 50) / 5, (sgBoard.clientWidth - 10) / 5));
        sgEq.textContent = a + " − " + b;
        sgMsg.textContent = "";
        nextBtn.disabled = true;
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
        sgRenderStreak();
        for (var k = 0; k < 20; k++) {
          var s = sgSlot(k);
          var c = document.createElement("span");
          c.className = "sg-cell";
          c.style.left = (s.x - SG_CELL / 2) + "px";
          c.style.top = (s.y - SG_CELL / 2) + "px";
          c.style.width = SG_CELL + "px";
          c.style.height = SG_CELL + "px";
          sgBoard.appendChild(c);
        }
        var trayY = sgSlot(10).y + 2 * SG_CELL + 20;
        var gap = Math.min(SG_CELL, (sgBoard.clientWidth - 12) / b);
        sgState.tray = { y: trayY, gap: gap, left: sgBoard.clientWidth / 2 - (b - 1) * gap / 2, size: Math.min(SG_CELL - 10, gap - 5) };
        [].concat(range(10), range(u).map(function (i) { return 10 + i; })).forEach(function (k) {
          var dot = document.createElement("span");
          dot.className = "sg-dot free";
          var sl = sgSlot(k);
          sgPlace(dot, sl.x, sl.y);
          dot.dataset.k = k;
          sgState.filled[k] = true;
          sgBoard.appendChild(dot);
          sgRemovable(dot, k);
        });
      }

      function range(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }

      function sgRemovable(dot, k) {
        var start = null;
        dot.addEventListener("pointerdown", function (e) {
          if (!sgState || sgState.done) return;
          e.preventDefault();
          dot.setPointerCapture(e.pointerId);
          var r = sgBoard.getBoundingClientRect();
          start = { ox: r.left, oy: r.top, x: e.clientX, y: e.clientY, moved: false };
        });
        dot.addEventListener("pointermove", function (e) {
          if (!start) return;
          if (!start.moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 8) return;
          start.moved = true;
          dot.classList.add("drag");
          sgPlace(dot, e.clientX - start.ox, e.clientY - start.oy);
        });
        function up(e) {
          if (!start) return;
          var st = start;
          start = null;
          dot.classList.remove("drag");
          var out = dot.classList.contains("out");
          if (out) { sgPutBack(dot, k); return; }
          if (st.moved) {
            // Lâché encore dans les cadres : il revient à sa case
            var y = e.clientY - st.oy;
            if (y < sgSlot(19).y + SG_CELL / 2) { var sl = sgSlot(k); sgMove(dot, sl.x, sl.y); return; }
          }
          sgTakeAway(dot, k);
        }
        dot.addEventListener("pointerup", up);
        dot.addEventListener("pointercancel", up);
      }

      function sgTakeAway(dot, k) {
        if (k >= 10) {
          sgWrong();
          var sl = sgSlot(k);
          sgMove(dot, sl.x, sl.y);
          return;
        }
        var t = sgState.tray, j = sgState.removed;
        delete sgState.filled[k];
        sgState.removed++;
        dot.classList.add("out");
        dot._size = t.size;
        sgMove(dot, t.left + j * t.gap, t.y).then(function () {
          if (sgState.removed === sgState.b && !sgState.done) sgWinSub();
        });
      }

      function sgPutBack(dot, k) {
        if (sgState.done) return;
        sgState.filled[k] = true;
        sgState.removed--;
        dot.classList.remove("out");
        dot._size = 0;
        var sl = sgSlot(k);
        sgMove(dot, sl.x, sl.y);
      }

      function sgAutoRemove() {
        if (!sgState || sgState.done) return;
        sgState.auto = true;
        var left = sgState.b - sgState.removed;
        for (var k = 9; k >= 0 && left > 0; k--) {
          if (!sgState.filled[k]) continue;
          (function (kk, i) {
            var dot = Array.prototype.find.call(sgBoard.querySelectorAll(".sg-dot"), function (d) { return Number(d.dataset.k) === kk && !d.classList.contains("out"); });
            setTimeout(function () { sgTakeAway(dot, kk); }, ms(i * 140));
          })(k, sgState.b - left);
          left--;
        }
      }

      function sgWinSub() {
        sgState.done = true;
        var a = sgState.a, b = sgState.b, u = sgState.u;
        var seq = [
          "10 − " + b + " + " + u,
          (10 - b) + " + " + u,
          a + " − " + b + " = " + (a - b)
        ];
        sgFinish(seq);
      }

      // Boutons « Voir la solution » et « Règles », calés à gauche
      document.getElementById("sgSolve").addEventListener("click", function () {
        if (!sgState || sgState.done) return;
        if (sgState.op === "-") sgAutoRemove(); else sgAutoFill();
      });
      var sgRulesBox = document.getElementById("sgRulesBox");
      var SG_RULES = {
        fr: ["<b>Addition</b> — pose les jetons du 2e nombre dans les cases (appui bref ou glisser). Remplis d'abord la 1re dizaine, puis la 2e : c'est « faire 10 ».",
             "<b>Soustraction</b> — retire les jetons de la dizaine pleine, pas les jetons isolés : 13 − 5 = (10 − 5) + 3.",
             "Un jeton posé se retire d'un appui. 3 réussites de suite sans erreur : badge ✦ 10.",
             "<b>Voir la solution</b> : la manche est jouée pour toi et ne compte pas."],
        en: ["<b>Addition</b> — place the counters of the 2nd number in the boxes (tap or drag). Fill the first ten, then the second: “make 10”.",
             "<b>Subtraction</b> — take counters from the full ten, not the loose ones: 13 − 5 = (10 − 5) + 3.",
             "Tap a placed counter to remove it. 3 wins in a row without a mistake: ✦ 10 badge.",
             "<b>Show solution</b>: the round is played for you and does not count."]
      };
      document.getElementById("sgRules").addEventListener("click", function (e) {
        e.stopPropagation();
        if (!sgRulesBox.hidden) { sgRulesBox.hidden = true; return; }
        sgRulesBox.innerHTML = SG_RULES[LANG].map(function (t) { return "<p>" + t + "</p>"; }).join("");
        sgRulesBox.hidden = false;
      });
      document.addEventListener("pointerdown", function (e) {
        if (!sgRulesBox.hidden && !e.target.closest("#sgRulesBox, #sgRules")) sgRulesBox.hidden = true;
      });

      function sgWin() {
        sgState.done = true;
        var a = sgState.a, b = sgState.b, fill = 10 - a, rest = b - fill;
        var seq = [
          a + " + " + fill + " + " + rest,
          "10 + " + rest,
          a + " + " + b + " = " + (a + b)
        ];
        sgFinish(seq);
      }

      function sgFinish(seq) {
        var chain = wait(500);
        seq.forEach(function (txt) {
          chain = chain.then(function () {
            sgEq.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: ms(400) });
            sgEq.textContent = txt;
            return wait(1300);
          });
        });
        // Regroupement final : les jetons qui restent se tassent dans un
        // seul cadre, par colonnes de 2 — 4 forme un carré 2 × 2, 7 trois
        // paires et 1. Les jetons retirés et le cadre vide s'effacent.
        chain = chain.then(function () {
          var keep = [], gone = [];
          sgBoard.querySelectorAll(".sg-dot").forEach(function (d) {
            (d.classList.contains("out") ? gone : keep).push(d);
          });
          keep.sort(function (a, b) { return (Number(a.dataset.k) || 0) - (Number(b.dataset.k) || 0); });
          gone.forEach(function (d) {
            d.animate([{ opacity: 0.35 }, { opacity: 0, transform: "scale(0.4)" }], { duration: ms(500), fill: "forwards" });
          });
          var moves = keep.map(function (d, j) {
            var f = Math.floor(j / 10), r = j % 10;
            var k = f * 10 + (r % 2) * 5 + Math.floor(r / 2);
            var sl = sgSlot(k);
            d._size = 0;
            return sgMove(d, sl.x, sl.y, j * 60);
          });
          if (keep.length <= 10) {
            var cells = sgBoard.querySelectorAll(".sg-cell");
            for (var i = 10; i < cells.length; i++) {
              cells[i].animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(500), fill: "forwards" });
            }
          }
          return Promise.all(moves).then(function () { return wait(400); });
        });
        // Le résultat reste affiché : on voit ce qu'on a fait. La flèche
        // en bas à droite passe à la manche suivante.
        chain.then(function () {
          if (sgState.auto) { /* manche montrée : ni gagnée ni perdue */ }
          else if (!sgState.mistake) sgStreakN = Math.min(3, sgStreakN + 1);
          sgRenderStreak();
          if (sgStreakN >= 3) markDone("Singapour");
          if (sgStreakN >= 3 && !hasBadge()) {
            SND.badge();
            setBadge(true);
            sgMsg.textContent = "✦ 10";
            badgeChip.animate([{ transform: "scale(1.6)" }, { transform: "scale(1)" }], { duration: ms(700), easing: "ease-out" });
          }
          sgState.ready = true;
          nextBtn.disabled = false;
          nextBtn.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: ms(600) });
        });
      }

      badgeChip.hidden = !hasBadge();

      // ---------- Chapitre Premiers : arbre de facteurs ----------
      // On touche un nombre de l'arbre, puis un nombre premier : s'il le
      // divise, le nombre se sépare en deux branches (le premier et le
      // quotient). Les premiers sont entourés et s'arrêtent. À la fin, le
      // produit s'écrit — et il est le même quel que soit l'ordre choisi
      // (unicité de la décomposition).

      var pfEl = document.getElementById("pf");
      var pfEq = document.getElementById("pfEq");
      var pfBoard = document.getElementById("pfBoard");
      var pfPrimes = document.getElementById("pfPrimes");
      var PRIMES = [2, 3, 5, 7, 11, 13];
      var pfState = null;
      var PF_R = 19; // rayon d'un nœud (2.4rem / 2)

      function isPrime(n) {
        if (n < 2) return false;
        for (var d = 2; d * d <= n; d++) if (n % d === 0) return false;
        return true;
      }

      // Les diviseurs de 0 à 13. Les premiers sont vifs ; les autres sont
      // estompés, avec la raison : interdit (0), inutile (1), ou pas premier
      // (déjà un produit de premiers : 4 = 2 × 2…).
      var DIV_INFO = {
        0: "Interdit : on ne divise jamais par 0 dans ℕ, ℤ, ℚ, ℝ, ℂ. Possible seulement dans des ensembles prolongés : la droite projective ℝ ∪ {∞} ou la sphère de Riemann ℂ ∪ {∞}, où x ÷ 0 = ∞ pour x ≠ 0 (0 ÷ 0 reste indéfini).",
        1: "Inutile : n ÷ 1 = n.",
        2: "Se termine par un chiffre pair.",
        3: "Somme des chiffres dans la table de 3.",
        4: "Pas premier : 4 = 2 × 2.",
        5: "Se termine par 0 ou 5.",
        6: "Pas premier : 6 = 2 × 3.",
        7: "Reste − 2 × dernier chiffre dans la table de 7.",
        8: "Pas premier : 8 = 2 × 2 × 2.",
        9: "Pas premier : 9 = 3 × 3.",
        10: "Pas premier : 10 = 2 × 5.",
        11: "Somme alternée des chiffres (+ − + …) dans la table de 11.",
        12: "Pas premier : 12 = 2 × 2 × 3.",
        13: "Reste + 4 × dernier chiffre dans la table de 13."
      };
      var DIV_INFO_EN = {
        0: "Forbidden: never divide by 0 in ℕ, ℤ, ℚ, ℝ, ℂ. Only possible in extended sets: the projective line ℝ ∪ {∞} or the Riemann sphere ℂ ∪ {∞}, where x ÷ 0 = ∞ for x ≠ 0 (0 ÷ 0 stays undefined).",
        1: "Useless: n ÷ 1 = n.",
        2: "Ends in an even digit.",
        3: "Digit sum in the 3 times table.",
        4: "Not prime: 4 = 2 × 2.",
        5: "Ends in 0 or 5.",
        6: "Not prime: 6 = 2 × 3.",
        7: "Rest − 2 × last digit in the 7 times table.",
        8: "Not prime: 8 = 2 × 2 × 2.",
        9: "Not prime: 9 = 3 × 3.",
        10: "Not prime: 10 = 2 × 5.",
        11: "Alternating digit sum (+ − + …) in the 11 times table.",
        12: "Not prime: 12 = 2 × 2 × 3.",
        13: "Rest + 4 × last digit in the 13 times table."
      };
      var pfTip = document.getElementById("pfTip");
      function pfShowTip(d, btn, text) {
        pfTip.textContent = text || (LANG === "en" ? DIV_INFO_EN : DIV_INFO)[d];
        pfTip.hidden = false;
        var rb = btn.getBoundingClientRect(), rs = pfEl.getBoundingClientRect();
        pfTip.style.left = Math.max(4, Math.min(rs.width - pfTip.offsetWidth - 4, rb.left - rs.left + rb.width / 2 - pfTip.offsetWidth / 2)) + "px";
        // Au-dessus de toute la grille des diviseurs, jamais sur un bouton
        var rg = pfPrimes.getBoundingClientRect();
        pfTip.style.top = (rg.top - rs.top - pfTip.offsetHeight - 8) + "px";
        pfTip.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: ms(220), easing: "ease-out" });
      }
      function pfHideTip() { pfTip.hidden = true; }

      // Pourquoi n n'est pas divisible par p : la règle, faite sur n
      function whyNot(n, p) {
        var en = LANG === "en", str = String(n), last = n % 10, rest = Math.floor(n / 10);
        var q = Math.floor(n / p), r = n % p;
        var why = "";
        if (p === 2) why = en ? n + " ends in " + last + ", not 0, 2, 4, 6 or 8." : n + " se termine par " + last + ", pas par 0, 2, 4, 6 ou 8.";
        else if (p === 5) why = en ? n + " ends in " + last + ", not 0 or 5." : n + " se termine par " + last + ", pas par 0 ou 5.";
        else if (p === 3) {
          var sum = str.split("").reduce(function (a, c) { return a + Number(c); }, 0);
          why = str.split("").join(" + ") + " = " + sum + (en ? ", not in the 3 times table." : ", pas dans la table de 3.");
        } else if (p === 7 && n >= 10) {
          var v7 = rest - 2 * last;
          why = rest + " − 2 × " + last + " = " + v7 + (en ? ", not in the 7 times table." : ", pas dans la table de 7.");
        } else if (p === 11 && n >= 10) {
          var alt = 0, terms = [];
          str.split("").forEach(function (c, i) { var sg = i % 2 === 0 ? 1 : -1; alt += sg * Number(c); terms.push((i ? (sg > 0 ? " + " : " − ") : "") + c); });
          why = terms.join("") + " = " + alt + (en ? ", not in the 11 times table." : ", pas dans la table de 11.");
        } else if (p === 13 && n >= 10) {
          var v13 = rest + 4 * last;
          why = rest + " + 4 × " + last + " = " + v13 + (en ? ", not in the 13 times table." : ", pas dans la table de 13.");
        }
        var rem = n + " = " + p + " × " + q + " + " + r + (en ? " : remainder " + r + " ≠ 0." : " : reste " + r + " ≠ 0.");
        return (en ? "÷" + p + " doesn't work. " : "÷" + p + " ne marche pas. ") + (why ? why + " " : "") + rem;
      }
      document.addEventListener("pointerdown", function (e) {
        if (!pfTip.hidden && !e.target.closest("#pfPrimes")) pfHideTip();
      });

      for (var dv = 0; dv <= 13; dv++) (function (d) {
        var b = document.createElement("button");
        var prime = PRIMES.indexOf(d) >= 0;
        b.textContent = String(d);
        if (!prime) b.className = "dim";
        var timer = null, longDone = false;
        // Appui long : la règle de divisibilité dans une fenêtre flottante.
        // Appui bref : divise (premiers) ou explique (les autres).
        b.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          longDone = false;
          pfHideTip();
          timer = setTimeout(function () { longDone = true; pfShowTip(d, b); }, 450);
        });
        function release() {
          if (timer) { clearTimeout(timer); timer = null; }
        }
        b.addEventListener("pointerup", function () {
          release();
          if (longDone) return;
          if (prime) pfDivide(d, b);
          else pfShowTip(d, b);
        });
        b.addEventListener("pointerleave", release);
        b.addEventListener("pointercancel", release);
        b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        pfPrimes.appendChild(b);
      })(dv);

      function pfPick() {
        var n = 1;
        while (n < 12) {
          n = 1;
          var k = 2 + Math.floor(Math.random() * 3);
          for (var i = 0; i < k; i++) {
            // Surtout 2, 3, 5, 7 ; parfois 11 ou 13
            var p = Math.random() < 0.18 ? PRIMES[4 + Math.floor(Math.random() * 2)] : PRIMES[Math.floor(Math.random() * 4)];
            if (n * p <= 200) n *= p;
          }
        }
        return n;
      }

      function pfStart(forced) {
        var n = forced || pfPick();
        pfState = { n: n, nodes: [{ v: n, parent: -1, depth: 0, side: 0 }], sel: 0, ready: false };
        pfEq.textContent = String(n);
        pfExtraDivisor(n);
        nextBtn.disabled = true;
        if (isPrime(n)) {
          // Déjà premier : rien à décomposer
          pfState.sel = -1;
          pfState.ready = true;
          setTimeout(function () {
            pfEq.textContent = n + (LANG === "en" ? " is prime" : " est premier");
            nextBtn.disabled = false;
          }, ms(300));
        }
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
        pfLayout();
      }

      // Toucher le nombre du haut : on tape son propre nombre (2 à 9999).
      pfEq.addEventListener("click", function () {
        if (!pfState || pfEq.querySelector("input")) return;
        if (pfState.nodes.length > 1 && !pfState.ready) return; // arbre commencé
        var inp = document.createElement("input");
        inp.type = "text";
        inp.inputMode = "numeric";
        inp.pattern = "[0-9]*";
        inp.value = pfState.n;
        pfEq.textContent = "";
        pfEq.appendChild(inp);
        inp.focus();
        inp.select();
        function commit() {
          var v = parseInt(inp.value, 10);
          if (!(v >= 2 && v <= 9999)) v = pfState.n;
          pfStreak = 0; // un nombre choisi ne compte pas pour le chapitre
          pfState = null;
          pfStart(v);
          pfState.custom = true;
        }
        inp.addEventListener("keydown", function (e) { if (e.key === "Enter") inp.blur(); });
        inp.addEventListener("blur", commit, { once: true });
      });

      // Si le nombre a un facteur premier > 13, son bouton ÷p apparaît
      function pfExtraDivisor(n) {
        pfPrimes.querySelectorAll(".extra").forEach(function (b) { b.remove(); });
        var m = n, d = 2, big = [];
        while (m > 1) { while (m % d === 0) { m /= d; if (d > 13 && big.indexOf(d) < 0) big.push(d); } d++; }
        big = big.filter(function (p) { return p !== n; });
        big.forEach(function (p) {
          var b = document.createElement("button");
          b.textContent = String(p);
          b.className = "extra";
          b.addEventListener("click", function () { pfDivide(p, b); });
          pfPrimes.appendChild(b);
        });
      }

      // Disposition : chaque séparation met le premier à gauche, le quotient
      // à droite, une rangée plus bas. L'arbre descend en diagonale.
      function pfLayout() {
        var w = pfBoard.clientWidth, h = pfBoard.clientHeight;
        var maxDepth = 1;
        pfState.nodes.forEach(function (nd) { maxDepth = Math.max(maxDepth, nd.depth); });
        var row = Math.max(58, Math.min(72, (h - 40) / Math.max(4, maxDepth + 1)));
        var dx = Math.min(64, w / 7);
        pfState.nodes.forEach(function (nd, i) {
          if (nd.parent < 0) { nd.x = w / 2 - dx * 1.2; nd.y = pfSize(nd.v) / 2 + 6; }
          else {
            var pa = pfState.nodes[nd.parent];
            nd.x = pa.x + nd.side * dx * 0.75;
            nd.y = pa.y + row;
          }
        });
        pfRender();
      }

      // Diamètre d'une bulle selon le nombre de chiffres (px)
      function pfSize(v) { return Math.max(40, 16 + String(v).length * 12); }

      // Titre au-dessus des diviseurs : 163 / ?, 163 ÷ ?, fraction 163 sur ?
      var pfHead = document.getElementById("pfHead");
      function pfUpdateHead(fill, ok) {
        var nd = pfState && pfState.sel >= 0 ? pfState.nodes[pfState.sel] : null;
        if (!nd) { pfHead.innerHTML = ""; return; }
        var slot = '<span class="pf-slot' + (fill !== undefined ? (ok ? " ok" : " no") : "") + '">' + (fill !== undefined ? fill : "") + "</span>";
        // Cinq écritures de la même division : fraction, /, ÷, puissance −1,
        // et multiplication par 1 sur le diviseur
        pfHead.innerHTML =
          '<div class="row">' +
          '<span class="fracv"><span>' + nd.v + '</span><span class="bar"></span>' + slot + "</span>" +
          '<span class="n">' + nd.v + ' <span class="op">/</span> ' + slot + "</span>" +
          '<span class="n">' + nd.v + ' <span class="op">÷</span> ' + slot + "</span>" +
          "</div><div class=\"row\">" +
          '<span class="n">' + nd.v + ' <span class="op">·</span> ' + slot + '<sup class="op">−1</sup></span>' +
          '<span class="n">' + nd.v + ' <span class="op">·</span> <span class="fracv"><span>1</span><span class="bar"></span>' + slot + "</span></span>" +
          "</div>";
      }

      var pfHeadHold = false;
      function pfRender() {
        if (!pfHeadHold) pfUpdateHead();
        pfBoard.innerHTML = "";
        var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        pfBoard.appendChild(svg);
        pfState.nodes.forEach(function (nd, i) {
          if (nd.parent >= 0) {
            var pa = pfState.nodes[nd.parent];
            var l = document.createElementNS("http://www.w3.org/2000/svg", "line");
            // Le trait s'arrête au bord des deux nœuds, jamais à l'intérieur
            var vx = nd.x - pa.x, vy = nd.y - pa.y, vl = Math.hypot(vx, vy) || 1;
            var r1 = pfSize(pa.v) / 2 + 2, r2 = pfSize(nd.v) / 2 + 2;
            l.setAttribute("x1", pa.x + vx / vl * r1); l.setAttribute("y1", pa.y + vy / vl * r1);
            l.setAttribute("x2", nd.x - vx / vl * r2); l.setAttribute("y2", nd.y - vy / vl * r2);
            svg.appendChild(l);
          }
          var el = document.createElement("span");
          var leaf = !pfState.nodes.some(function (c) { return c.parent === i; });
          el.className = "pf-node" + (leaf && isPrime(nd.v) ? " prime" : "") + (!leaf ? " split" : "") + (i === pfState.sel ? " sel" : "");
          el.style.left = nd.x + "px";
          el.style.top = nd.y + "px";
          el.style.width = el.style.height = pfSize(nd.v) + "px";
          el.textContent = nd.v;
          el.dataset.i = i;
          if (leaf && !isPrime(nd.v)) el.addEventListener("click", function () {
            pfState.sel = i;
            pfRender();
          });
          pfBoard.appendChild(el);
          nd.el = el;
        });
      }

      function pfDivide(p, btn) {
        if (!pfState || pfState.ready || pfState.sel < 0) return;
        var i = pfState.sel, nd = pfState.nodes[i];
        if (nd.v % p !== 0) {
          pfUpdateHead(p, false);
          setTimeout(function () { if (pfState && pfState.nodes[pfState.sel] === nd) pfUpdateHead(); }, ms(1400));
          pfState.mistake = true;
          SND.bad();
          // Ne divise pas : le bouton tremble, et la règle est appliquée à CE
          // nombre pour montrer pourquoi (avec le reste de la division)
          btn.animate([{ transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "none" }], { duration: ms(260) });
          pfShowTip(p, btn, whyNot(nd.v, p));
          if (nd.el) nd.el.animate([{ color: "var(--sign)" }, { color: "var(--ink)" }], { duration: ms(600) });
          return;
        }
        // Le bon diviseur s'inscrit dans la case, puis l'arbre se scinde
        pfUpdateHead(p, true);
        pfHeadHold = true;
        setTimeout(function () { pfHeadHold = false; pfUpdateHead(); }, ms(1000));
        var a = pfState.nodes.length;
        pfState.nodes.push({ v: p, parent: i, depth: nd.depth + 1, side: -1 });
        pfState.nodes.push({ v: nd.v / p, parent: i, depth: nd.depth + 1, side: 1 });
        // Sélection suivante : le prochain nombre qui n'est pas premier
        pfState.sel = -1;
        pfState.nodes.forEach(function (c, k) {
          var leaf = !pfState.nodes.some(function (o) { return o.parent === k; });
          if (pfState.sel < 0 && leaf && !isPrime(c.v)) pfState.sel = k;
        });
        pfLayout();
        // Transformation, façon bulles : le nombre devient d'abord le
        // produit « p · q » (la bulle s'étire), puis se scinde en deux bulles
        // qui glissent chacune à leur place en rebondissant.
        var pEl = pfBoard.querySelector('.pf-node[data-i="' + i + '"]');
        var morph = document.createElement("span");
        morph.className = "pf-morph";
        morph.style.left = nd.x + "px";
        morph.style.top = nd.y + "px";
        morph.textContent = p + " · " + (nd.v / p);
        pfBoard.appendChild(morph);
        if (pEl) pEl.animate([
          { transform: "translate(-50%,-50%) scale(1, 1)", opacity: 1 },
          { transform: "translate(-50%,-50%) scale(1.7, 0.85)", opacity: 0.9, offset: 0.45 },
          { transform: "translate(-50%,-50%) scale(1, 1)", opacity: 0.55 }
        ], { duration: ms(900), easing: "ease-in-out" });
        morph.animate([
          { opacity: 0, transform: "translate(-50%,-50%) scale(0.6)" },
          { opacity: 1, transform: "translate(-50%,-50%) scale(1)", offset: 0.3 },
          { opacity: 1, transform: "translate(-50%,-50%) scale(1)", offset: 0.7 },
          { opacity: 0, transform: "translate(-50%,-50%) scale(1.1)" }
        ], { duration: ms(1200), easing: "ease-out", fill: "forwards" });
        setTimeout(function () { morph.remove(); }, ms(1250));
        [a, a + 1].forEach(function (k, j) {
          var c = pfState.nodes[k];
          var ox = nd.x - c.x + (j ? 14 : -14), oy = nd.y - c.y;
          c.el.animate([
            { transform: "translate(" + ox + "px," + oy + "px) translate(-50%,-50%) scale(0.5)", opacity: 0 },
            { transform: "translate(" + ox + "px," + oy + "px) translate(-50%,-50%) scale(0.5)", opacity: 0, offset: 0.4 },
            { transform: "translate(" + (ox * 0.1) + "px," + (oy * 0.1) + "px) translate(-50%,-50%) scale(1.12, 0.9)", opacity: 1, offset: 0.82 },
            { transform: "translate(-50%,-50%) scale(1)", opacity: 1 }
          ], { duration: ms(1300), easing: "cubic-bezier(.3,1.1,.5,1)" });
        });
        if (pfState.sel < 0) pfFinish();
      }

      var pfStreak = 0;
      function pfFinish() {
        SND.ok();
        // Un nombre tapé soi-même ne compte pas pour réussir le chapitre
        if (!pfState.custom) pfStreak = pfState.mistake ? 0 : pfStreak + 1;
        if (pfStreak >= 3) markDone("Premiers");
        pfState.ready = true;
        var ps = [];
        pfState.nodes.forEach(function (c, k) {
          var leaf = !pfState.nodes.some(function (o) { return o.parent === k; });
          if (leaf) ps.push(c.v);
        });
        ps.sort(function (x, y) { return x - y; });
        var counts = {};
        ps.forEach(function (p) { counts[p] = (counts[p] || 0) + 1; });
        var SUP = { 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶" };
        var pow = Object.keys(counts).map(function (p) { return p + (counts[p] > 1 ? SUP[counts[p]] : ""); }).join(" · ");
        var steps = [pfState.n + " = " + ps.join(" · ")];
        if (pow !== ps.join(" · ")) steps.push(pfState.n + " = " + pow);
        var chain = wait(500);
        steps.forEach(function (t) {
          chain = chain.then(function () {
            pfEq.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: ms(400) });
            pfEq.textContent = t;
            return wait(1400);
          });
        });
        chain.then(function () {
          nextBtn.disabled = false;
          nextBtn.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: ms(600) });
        });
      }

      // ---------- Chapitre Fusion ----------
      // Les termes sont des bulles. On en lâche une sur une autre : si une
      // règle le permet, elles fusionnent en une forme plus simple.
      //   a + a → 2·a          (même lettre : on additionne les nombres)
      //   2·a + 2·b → 2·(a + b) (même nombre devant : on le met en facteur)
      //   3·x + (−3·x) → 0      (opposés : la bulle disparaît)
      //   p/c + q/c → (p + q)/c (même dénominateur)
      // Pouvoir « 1 → c/c » : une bulle nombre prend le dénominateur d'une
      // fraction voisine. Il se gagne en réussissant le chapitre Fraction.
      var fusEl = document.getElementById("fus");
      var fusBoard = document.getElementById("fusBoard");
      var fusUid = 0;
      function M(k, s) { return { t: "m", k: k, s: s || "", id: ++fusUid }; }
      // Ordre d'écriture : lettres dans l'ordre alphabétique, nombres à la fin
      function sortMonos(list) {
        return list.slice().sort(function (a, b) { return (a.s || "~") < (b.s || "~") ? -1 : (a.s || "~") > (b.s || "~") ? 1 : 0; });
      }
      function Fa(k, inner) { return { t: "f", k: k, inner: sortMonos(inner), id: ++fusUid }; }
      function Fr(num, den) { return { t: "q", num: sortMonos(num), den: den, id: ++fusUid }; }
      // Forme canonique d'une bulle, pour comparer au but sans tenir compte
      // de l'ordre des bulles (l'addition est commutative)
      function canon(c) {
        if (c.t === "m") return (c.k < 0 ? "-" : "+") + Math.abs(c.k) + "*" + c.s;
        if (c.t === "f") return "+" + c.k + "*(" + sortMonos(c.inner).map(canon).join("") + ")";
        return "+(" + sortMonos(c.num).map(canon).join("") + ")/" + c.den;
      }
      function boardKey(list) { return list.map(canon).sort().join("|"); }

      var FUS_LEVELS = [
        { chips: function () { return [M(1, "a"), M(1, "a")]; }, goal: "2·a", want: function () { return [M(2, "a")]; } },
        { chips: function () { return [M(1, "a"), M(1, "b"), M(1, "a"), M(1, "b")]; }, goal: "2·(a + b)", want: function () { return [Fa(2, [M(1, "a"), M(1, "b")])]; } },
        { chips: function () { return [M(3, "x"), M(5, "x"), M(-2, "x")]; }, goal: "6·x", want: function () { return [M(6, "x")]; } },
        { chips: function () { return [M(3, "x"), M(2), M(-3, "x"), M(5)]; }, goal: "7", want: function () { return [M(7)]; } },
        { chips: function () { return [M(2, "x"), M(3), M(4, "x"), M(1)]; }, goal: "6·x + 4", want: function () { return [M(6, "x"), M(4)]; } },
        { chips: function () { return [M(2, "a"), M(2, "b"), M(2, "c")]; }, goal: "2·(a + b + c)", want: function () { return [Fa(2, [M(1, "a"), M(1, "b"), M(1, "c")])]; } },
        { chips: function () { return [M(1), Fr([M(1)], "c")]; }, goal: "(c + 1)/c", want: function () { return [Fr([M(1, "c"), M(1)], "c")]; }, power: true },
        { chips: function () { return [M(12, "x"), M(18)]; }, goal: "6·(2·x + 3)", power: "pf", want: function () { return [Fa(6, [M(2, "x"), M(3)])]; } },
        { chips: function () { return [M(15, "a"), M(10, "b")]; }, goal: "5·(3·a + 2·b)", power: "pf", want: function () { return [Fa(5, [M(3, "a"), M(2, "b")])]; } },
        { chips: function () { return [M(2), Fr([M(3)], "c"), Fr([M(1)], "c")]; }, goal: "(2·c + 4)/c", want: function () { return [Fr([M(2, "c"), M(4)], "c")]; }, power: true }
      ];
      var fus = { level: 0, chips: [], sel: null, won: false };
      try { fus.level = Math.min(FUS_LEVELS.length - 1, Number(localStorage.getItem("pasapas_fus")) || 0); } catch (e) {}

      function monoStr(m, lead) {
        var k = m.k, a = Math.abs(k), sgn = k < 0 ? (lead ? "−" : "− ") : (lead ? "" : "+ ");
        var body = m.s ? (a === 1 ? m.s : a + "·" + m.s) : String(a);
        return sgn + body;
      }
      function sumStr(list) {
        return list.map(function (m, i) { return monoStr(m, i === 0); }).join(" ");
      }
      function chipStr(c, lead) {
        if (c.t === "m") return monoStr(c, lead);
        var pre = lead ? "" : "+ ";
        if (c.t === "f") return pre + c.k + "·(" + sumStr(c.inner) + ")";
        return pre + "(" + sumStr(c.num) + ")/" + c.den;
      }
      function boardStr() {
        return fus.chips.map(function (c, i) { return chipStr(c, i === 0); }).join(" ").replace(/^\(([^()]*)\)\//, function (m0, n) { return "(" + n + ")/"; });
      }
      // Réduit une somme de monômes (termes semblables regroupés)
      function reduce(list) {
        var out = [];
        list.forEach(function (m) {
          var same = out.find(function (o) { return o.s === m.s; });
          if (same) same.k += m.k; else out.push(M(m.k, m.s));
        });
        return out.filter(function (m) { return m.k !== 0; });
      }
      // Règles de fusion : A lâchée sur B. Renvoie la nouvelle bulle, ou
      // "zero" si elles s'annulent, ou null si aucune règle ne s'applique.
      function fuse(A, B) {
        if (A.t === "m" && B.t === "m") {
          if (A.s === B.s) { var k = A.k + B.k; return k === 0 ? "zero" : M(k, A.s); }
          // Facteur commun : même nombre devant ; avec le pouvoir « premiers »,
          // le plus grand facteur commun (PGCD) des deux nombres
          var g = gcd(Math.abs(A.k), Math.abs(B.k));
          if (A.k === B.k && Math.abs(A.k) !== 1 && A.s && B.s) return Fa(A.k, [M(1, B.s), M(1, A.s)]);
          if (hasPower("Premiers") && g > 1 && (A.s || B.s) && A.k !== B.k) return Fa(g, [M(B.k / g, B.s), M(A.k / g, A.s)]);
          return null;
        }
        if (A.t === "m" && B.t === "f" && A.s && A.k === B.k) return Fa(B.k, B.inner.concat([M(1, A.s)]));
        if (A.t === "f" && B.t === "m" && B.s && A.k === B.k) return Fa(A.k, [M(1, B.s)].concat(A.inner));
        if (A.t === "q" && B.t === "q" && A.den === B.den) return Fr(reduce(B.num.concat(A.num)), B.den);
        return null;
      }

      function gcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a; }
      function primeStr(n) {
        var out = [], d = 2, SUP = { 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
        n = Math.abs(n);
        while (n > 1) {
          var c = 0;
          while (n % d === 0) { n /= d; c++; }
          if (c) out.push(d + (c > 1 ? SUP[c] || "^" + c : ""));
          d++;
        }
        return out.join("·") || "1";
      }
      var fusPowers = document.getElementById("fusPowers");
      function powerOpen() { return hasPower("Fraction"); }

      function fusStart() {
        var L = FUS_LEVELS[fus.level];
        fus.chips = L.chips();
        fus.sel = null;
        fus.won = false;
        try { localStorage.setItem("pasapas_fus", String(fus.level)); } catch (e) {}
        document.getElementById("fusGoal").innerHTML = (LANG === "en" ? "Goal " : "But ") + (fus.level + 1) + "/" + FUS_LEVELS.length + " &nbsp; <b>" + L.goal + "</b>";
        document.getElementById("fusMsg").textContent = "";
        nextBtn.disabled = true;
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
        prevBtn.style.visibility = "";
        prevBtn.textContent = "↺";
        fusPowers.innerHTML = "";
        if (L.power === "pf") {
          var pp = document.createElement("button");
          pp.textContent = "n → 2·3·…";
          pp.disabled = !hasPower("Premiers");
          pp.addEventListener("click", function () {
            var c = fus.chips.find(function (x) { return x.id === fus.sel && x.t === "m"; });
            var msg = document.getElementById("fusMsg");
            if (!c) { SND.bad(); msg.textContent = LANG === "en" ? "Tap a bubble first." : "Touche d'abord une bulle."; return; }
            SND.ok();
            msg.textContent = Math.abs(c.k) + " = " + primeStr(c.k);
          });
          fusPowers.appendChild(pp);
          if (!hasPower("Premiers")) document.getElementById("fusMsg").textContent = LANG === "en" ? "Power locked: pass the Primes chapter." : "Pouvoir verrouillé : réussis le chapitre Premiers.";
        } else if (L.power) {
          var pb = document.createElement("button");
          pb.textContent = "1 → c/c";
          pb.disabled = !powerOpen();
          pb.title = LANG === "en" ? "Same denominator" : "Même dénominateur";
          pb.addEventListener("click", fusPower);
          fusPowers.appendChild(pb);
          if (!powerOpen()) document.getElementById("fusMsg").textContent = LANG === "en" ? "Power locked: pass the Fraction chapter." : "Pouvoir verrouillé : réussis le chapitre Fraction.";
        }
        fusRender(null);
      }

      function chipHTML(c, lead) {
        function sum(list) { return sumStr(list).replace(/([a-z])/g, "<i>$1</i>"); }
        if (c.t === "q") return (lead ? "" : "") + '<span class="fr"><span>' + sum(c.num) + "</span><span><i>" + c.den + "</i></span></span>";
        return chipStr(c, true).replace(/([a-z])/g, "<i>$1</i>");
      }

      // Rendu avec animation FLIP : chaque bulle part de son ancienne place
      // (en arc si elle change beaucoup de place), les nouvelles éclosent.
      function fusRender(bornId) {
        var old = {};
        fusBoard.querySelectorAll(".chip").forEach(function (e) { old[e.dataset.id] = e.getBoundingClientRect(); });
        fusBoard.innerHTML = "";
        fus.chips.forEach(function (c, i) {
          if (i > 0) {
            var sp = document.createElement("span");
            sp.className = "fus-sep";
            sp.textContent = (c.t === "m" && c.k < 0) ? "−" : "+";
            fusBoard.appendChild(sp);
          }
          var e = document.createElement("span");
          e.className = "chip" + (fus.sel === c.id ? " sel" : "");
          e.dataset.id = c.id;
          var cc = c.t === "m" && c.k < 0 && i > 0 ? M(-c.k, c.s) : c;
          e.innerHTML = chipHTML(cc, true);
          fusBoard.appendChild(e);
          fusDraggable(e, c);
        });
        fusBoard.querySelectorAll(".chip").forEach(function (e) {
          var r = e.getBoundingClientRect(), o = old[e.dataset.id];
          if (o && e.dataset.id !== String(bornId)) {
            var dx = o.left - r.left, dy = o.top - r.top;
            if (Math.abs(dx) + Math.abs(dy) < 1) return;
            var lift = Math.min(50, Math.abs(dx) * 0.35) * (dx < 0 ? -1 : 1), kf = [];
            for (var q = 0; q <= 8; q++) {
              var t = q / 8, sn = Math.sin(Math.PI * t);
              kf.push({ transform: "translate(" + dx * (1 - t) + "px," + (dy * (1 - t) + lift * sn) + "px)" });
            }
            e.animate(kf, { duration: ms(650), easing: "cubic-bezier(.45,0,.3,1)" });
          } else {
            e.animate([{ transform: "scale(0.3)", opacity: 0 }, { transform: "scale(1.18)", opacity: 1, offset: 0.7 }, { transform: "scale(1)" }],
              { duration: ms(520), easing: "ease-out" });
          }
        });
      }

      function fusDraggable(e, c) {
        var d = null;
        e.addEventListener("pointerdown", function (ev) {
          if (fus.won) return;
          ev.preventDefault();
          e.setPointerCapture(ev.pointerId);
          d = { x: ev.clientX, y: ev.clientY, moved: false, clone: null };
        });
        e.addEventListener("pointermove", function (ev) {
          if (!d) return;
          if (!d.moved && Math.hypot(ev.clientX - d.x, ev.clientY - d.y) < 8) return;
          if (!d.moved) {
            d.moved = true;
            d.clone = e.cloneNode(true);
            d.clone.classList.add("drag");
            document.body.appendChild(d.clone);
            e.classList.add("ghost-slot");
          }
          d.clone.style.left = ev.clientX + "px";
          d.clone.style.top = ev.clientY + "px";
          var over = chipAt(ev.clientX, ev.clientY, e);
          fusBoard.querySelectorAll(".chip").forEach(function (x) { x.classList.toggle("target", x === over); });
        });
        function up(ev) {
          if (!d) return;
          var dd = d;
          d = null;
          fusBoard.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("target"); });
          if (!dd.moved) {
            // Appui bref : sélection (pour un pouvoir)
            fus.sel = fus.sel === c.id ? null : c.id;
            SND.tick();
            fusBoard.querySelectorAll(".chip").forEach(function (x) { x.classList.toggle("sel", x.dataset.id === String(fus.sel)); });
            return;
          }
          var over = chipAt(ev.clientX, ev.clientY, e);
          var clone = dd.clone;
          e.classList.remove("ghost-slot");
          if (!over) { flyBack(clone, e); return; }
          var B = fus.chips.find(function (x) { return String(x.id) === over.dataset.id; });
          var res = fuse(c, B);
          if (!res) {
            SND.bad();
            flyBack(clone, e);
            over.animate([{ transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "none" }], { duration: ms(260) });
            return;
          }
          clone.remove();
          SND.meet();
          var iB = fus.chips.indexOf(B);
          fus.chips.splice(fus.chips.indexOf(c), 1);
          iB = fus.chips.indexOf(B);
          if (res === "zero") {
            fus.chips.splice(iB, 1);
            if (!fus.chips.length) fus.chips.push(M(0));
            over.animate([{ transform: "scale(1)", opacity: 1 }, { transform: "scale(0)", opacity: 0 }], { duration: ms(350), fill: "forwards" });
            setTimeout(function () { fusRender(null); fusCheck(); }, ms(330));
          } else {
            fus.chips.splice(iB, 1, res);
            fusRender(res.id);
            fusCheck();
          }
        }
        e.addEventListener("pointerup", up);
        e.addEventListener("pointercancel", up);
      }

      function chipAt(x, y, self) {
        var found = null;
        fusBoard.querySelectorAll(".chip").forEach(function (b) {
          if (b === self) return;
          var r = b.getBoundingClientRect();
          if (x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8) found = b;
        });
        return found;
      }

      function flyBack(clone, e) {
        var r = e.getBoundingClientRect();
        var cr = clone.getBoundingClientRect();
        var a = clone.animate([
          { left: (cr.left + cr.width / 2) + "px", top: (cr.top + cr.height / 2) + "px" },
          { left: (r.left + r.width / 2) + "px", top: (r.top + r.height / 2) + "px" }
        ], { duration: ms(380), easing: "cubic-bezier(.3,1.3,.5,1)", fill: "forwards" });
        done(a).then(function () { clone.remove(); });
      }

      function fusPower() {
        if (!powerOpen()) return;
        var c = fus.chips.find(function (x) { return x.id === fus.sel; });
        var q = fus.chips.find(function (x) { return x.t === "q"; });
        if (!c || c.t !== "m" || !q) {
          SND.bad();
          document.getElementById("fusMsg").textContent = LANG === "en" ? "Tap a number bubble first." : "Touche d'abord une bulle nombre.";
          return;
        }
        // k = k·c/c : même valeur, mais maintenant avec le dénominateur c
        var i = fus.chips.indexOf(c);
        var nf = Fr([M(c.k, c.s ? c.s + "·" + q.den : q.den)], q.den);
        nf.id = c.id;
        fus.chips.splice(i, 1, nf);
        fus.sel = null;
        SND.ok();
        document.getElementById("fusMsg").textContent = "";
        fusRender(null);
        var el = fusBoard.querySelector('.chip[data-id="' + nf.id + '"]');
        if (el) el.animate([{ transform: "rotateY(90deg)" }, { transform: "none" }], { duration: ms(500) });
      }

      function fusCheck() {
        if (boardKey(fus.chips) !== boardKey(FUS_LEVELS[fus.level].want())) return;
        fus.won = true;
        SND.badge();
        document.getElementById("fusMsg").textContent = "✓";
        nextBtn.disabled = false;
        nextBtn.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: ms(600) });
        if (fus.level === FUS_LEVELS.length - 1) markDone("Fusion");
      }

      // ---------- Chapitre Calcul : calcul mental en continu ----------
      // Pas de clics : l'animation se déroule seule, comme un raisonnement
      // qu'on regarderait au ralenti. Dizaines = barres de 10, unités =
      // jetons rangés par 5 (le cadre de dix = 2 rangées de 5).
      //   16 + 27 → 10 + 6 + 20 + 7 → 6 = 5 + 1, 7 = 5 + 2
      //   → 5 + 5 = 10 : une dizaine de plus → 40 + 3 → 43
      // Si un seul des deux dépasse 5, on « fait 10 » (complément à 10).
      var calcEl = document.getElementById("calc");
      var calcEq = document.getElementById("calcEq");
      var calcScene = document.getElementById("calcScene");
      var calcRun = 0, calcSeen = 0;

      function calcPick() {
        var r = Math.random(), t1 = 1 + Math.floor(Math.random() * 3), t2 = 1 + Math.floor(Math.random() * 3);
        var u1, u2;
        if (r < 0.6) { u1 = 5 + Math.floor(Math.random() * 5); u2 = 5 + Math.floor(Math.random() * 5); }
        else if (r < 0.85) { u1 = 6 + Math.floor(Math.random() * 4); u2 = 11 - u1 + Math.floor(Math.random() * (u1 - 6 + 1)); if (u2 >= 5) u2 = 4; if (u1 + u2 < 10) u2 = 10 - u1 + 0; }
        else { u1 = 1 + Math.floor(Math.random() * 4); u2 = 1 + Math.floor(Math.random() * (8 - u1)); }
        return { t1: t1, u1: u1, t2: t2, u2: u2 };
      }

      function cmEl(cls, x, y, w, h) {
        var e = document.createElement("div");
        e.className = cls;
        e.style.left = x + "px"; e.style.top = y + "px";
        e.style.width = w + "px"; e.style.height = h + "px";
        e._x = x; e._y = y;
        calcScene.appendChild(e);
        return e;
      }

      function cmMove(e, x, y, dur, delay) {
        var dx = e._x - x, dy = e._y - y;
        e.style.left = x + "px"; e.style.top = y + "px";
        e._x = x; e._y = y;
        return done(e.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }],
          { duration: ms(dur || 1100), delay: ms(delay || 0), easing: "cubic-bezier(.45,0,.25,1)", fill: "backwards" }));
      }

      function cmText(t) {
        calcEq.animate([{ opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }], { duration: ms(700) });
        setTimeout(function () { calcEq.textContent = t; }, ms(300));
      }

      function calcStart() {
        var run = ++calcRun;
        var p = calcPick();
        var a = 10 * p.t1 + p.u1, b = 10 * p.t2 + p.u2;
        calcScene.innerHTML = "";
        calcEq.textContent = a + " + " + b;
        nextBtn.disabled = false;
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
        var W = calcScene.clientWidth, H = calcScene.clientHeight;
        var c = Math.max(12, Math.min(22, H / 14, W / 16));   // taille d'un jeton
        var g = c * 0.25, rodW = c, rodH = c * 10 * 0.62;
        var rodY = 8, dotY = rodY + rodH + c * 0.8;
        var gx = [W * 0.27, W * 0.73];

        function rodsAt(n, cx) { var w = n * rodW + (n - 1) * g; return function (k) { return cx - w / 2 + k * (rodW + g); }; }
        function dotPos(cx, k, row) { return { x: cx - (5 * c + 4 * g) / 2 + (k % 5) * (c + g), y: dotY + (row + Math.floor(k / 5)) * (c + g) }; }

        var rods = [], dots = [[], []];
        [[p.t1, p.u1], [p.t2, p.u2]].forEach(function (tu, side) {
          var rx = rodsAt(tu[0], gx[side]);
          for (var k = 0; k < tu[0]; k++) rods.push(cmEl("cm-rod", rx(k), rodY, rodW, rodH));
          for (var j = 0; j < tu[1]; j++) {
            var q = dotPos(gx[side], j, 0);
            dots[side].push(cmEl("cm-dot" + (side ? " b" : ""), q.x, q.y, c, c));
          }
        });
        calcScene.querySelectorAll("div").forEach(function (e, i) {
          e.animate([{ opacity: 0, transform: "scale(0.6)" }, { opacity: 1, transform: "none" }], { duration: ms(500), delay: ms(i * 30), fill: "backwards" });
        });

        function alive() { return run === calcRun && DEMOS[demoIndex].custom === "calc"; }
        var u1 = p.u1, u2 = p.u2, T1 = 10 * p.t1, T2 = 10 * p.t2;
        var chain = wait(1600).then(function () {
          if (!alive()) return;
          cmText(T1 + " + " + u1 + " + " + T2 + " + " + u2);
          return wait(1800);
        });

        // Toutes les dizaines se regroupent à gauche
        function gatherRods(extra) {
          var n = rods.length;
          var rx = rodsAt(n, W * 0.3);
          return Promise.all(rods.map(function (r, k) { return cmMove(r, rx(k), rodY, 1200, k * 80); }));
        }

        // Une dizaine faite de jetons devient une barre
        function tenToRod(tenDots) {
          // Assemblée au milieu, sous les barres (place libre), puis la
          // barre de 10 naît juste au-dessus
          var cx = W / 2, y0 = dotY + 2 * (c + g) + c * 0.4;
          var moves = tenDots.map(function (d, k) {
            return cmMove(d, cx - (5 * c + 4 * g) / 2 + (k % 5) * (c + g), y0 + Math.floor(k / 5) * (c + g), 1200, k * 60);
          });
          return Promise.all(moves).then(function () { return wait(900); }).then(function () {
            if (!alive()) return;
            var rod = cmEl("cm-rod", cx - rodW / 2, rodY, rodW, rodH);
            rod.animate([{ opacity: 0, transform: "scaleY(0.2)" }, { opacity: 1, transform: "none" }], { duration: ms(700), easing: "ease-out" });
            tenDots.forEach(function (d) {
              d.animate([{ opacity: 1 }, { opacity: 0, transform: "scale(0.3)" }], { duration: ms(600), fill: "forwards" });
            });
            rods.push(rod);
            return wait(900);
          });
        }

        var left = [];
        if (u1 >= 5 && u2 >= 5) {
          chain = chain.then(function () {
            if (!alive()) return;
            cmText(T1 + " + " + T2 + " + 5 + " + (u1 - 5) + " + 5 + " + (u2 - 5));
            // Les rangées de 5 s'allument
            dots[0].slice(0, 5).concat(dots[1].slice(0, 5)).forEach(function (d) {
              d.animate([{ transform: "scale(1)" }, { transform: "scale(1.25)" }, { transform: "scale(1)" }], { duration: ms(800) });
            });
            return wait(2000);
          }).then(function () {
            if (!alive()) return;
            cmText(T1 + " + " + T2 + " + 10 + " + (u1 - 5) + " + " + (u2 - 5));
            left = dots[0].slice(5).concat(dots[1].slice(5));
            return tenToRod(dots[0].slice(0, 5).concat(dots[1].slice(0, 5)));
          });
        } else if (u1 + u2 >= 10) {
          var big = u1 >= u2 ? 0 : 1, small = 1 - big, need = 10 - Math.max(u1, u2);
          chain = chain.then(function () {
            if (!alive()) return;
            var ub = Math.max(u1, u2), us = Math.min(u1, u2);
            cmText(T1 + " + " + T2 + " + " + ub + " + " + need + " + " + (us - need));
            // Complément à 10 : on prend juste ce qu'il faut à l'autre nombre
            var give = dots[small].slice(0, need);
            var gxb = gx[big];
            return Promise.all(give.map(function (d, k) {
              var q = dotPos(gxb, dots[big].length + k, 0);
              return cmMove(d, q.x, q.y, 1300, k * 150);
            })).then(function () { return wait(1200); }).then(function () {
              if (!alive()) return;
              cmText(T1 + " + " + T2 + " + 10 + " + (us - need));
              left = dots[small].slice(need);
              return tenToRod(dots[big].concat(give));
            });
          });
        }
        chain = chain.then(function () {
          if (!alive()) return;
          if (!left.length && u1 + u2 < 10) left = dots[0].concat(dots[1]);
          return gatherRods();
        }).then(function () {
          if (!alive()) return;
          var tens = rods.length * 10, units = (a + b) % 10;
          cmText(tens + " + " + units);
          var lx = rodsAt(rods.length, W * 0.3)(rods.length - 1) + rodW + c * 1.2;
          return Promise.all(left.map(function (d, k) {
            return cmMove(d, lx + (k % 5) * (c + g), rodY + rodH - c - Math.floor(k / 5) * (c + g), 1200, k * 80);
          })).then(function () { return wait(1600); });
        }).then(function () {
          if (!alive()) return;
          cmText(a + " + " + b + " = " + (a + b));
          return wait(4500);
        }).then(function () {
          // Et on enchaîne tout seul sur un autre calcul
          if (alive()) {
            calcSeen++;
            if (calcSeen >= 3) markDone("Calcul");
            calcStart();
          }
        });
      }

      // ---------- Chapitre Solutions ----------
      // Un même problème, plusieurs réponses selon l'ensemble où on cherche :
      // 2 − 3 n'existe pas dans ℕ (∅), vaut −1 dans ℤ. On change d'ensemble
      // avec la barre du bas et la réponse se met à jour sous nos yeux.
      var solEl = document.getElementById("sol");
      var SOL = [
        { q: "x = 2 − 3", a: { N: "∅", Z: "{ −1 }" } },
        { q: "x + 5 = 2", a: { N: "∅", Z: "{ −3 }" } },
        { q: "x² = 4", a: { N: "{ 2 }", Z: "{ −2 ; 2 }" } },
        { q: "2x = 7", a: { N: "∅", Q: "{ 7/2 }" } },
        { q: "2x = 1", a: { N: "∅", Q: "{ 1/2 }" } },
        { q: "3x = −2", a: { N: "∅", Q: "{ −2/3 }" } },
        { q: "x² = 2", a: { N: "∅", R: "{ −√2 ; √2 }" } },
        { q: "x² − x − 1 = 0", a: { N: "∅", R: "{ (1 − √5)/2 ; (1 + √5)/2 }" } },
        { q: "x² = −1", a: { N: "∅", C: "{ −i ; i }" } },
        { q: "x² = −4", a: { N: "∅", C: "{ −2i ; 2i }" } },
        { q: "x³ = 8", a: { N: "{ 2 }", C: "{ 2 ; −1 − i√3 ; −1 + i√3 }" } },
        { q: "x² + 2x + 5 = 0", a: { N: "∅", C: "{ −1 − 2i ; −1 + 2i }" } }
      ];
      var solIndex = 0, solShown = "";
      var SYM = { N: "ℕ", Z: "ℤ", Q: "ℚ", R: "ℝ", C: "ℂ" };

      function solAnswer(p) {
        // La réponse valable dans le plus grand ensemble ≤ univers
        var ans = "∅";
        UNIV.forEach(function (k) { if (sets[k] && p.a[k]) ans = p.a[k]; });
        return ans;
      }

      function solStart() { solRender(false); }

      var solSeen = {};
      function solRender(animate) {
        var p = SOL[solIndex];
        solSeen[solIndex] = true;
        if (Object.keys(solSeen).length >= 6) markDone("Solutions");
        var qEl = document.getElementById("solQ"), aEl = document.getElementById("solA");
        qEl.textContent = p.q;
        document.getElementById("solIn").textContent = (LANG === "en" ? "in " : "dans ") + SYM[universe];
        var ans = "S = " + solAnswer(p);
        var changed = ans !== solShown;
        aEl.textContent = ans;
        aEl.classList.toggle("empty", solAnswer(p) === "∅");
        if (animate && changed) aEl.animate([{ transform: "rotateX(90deg)", opacity: 0.2 }, { transform: "none", opacity: 1 }], { duration: ms(500), easing: "ease-out" });
        else if (!animate) qEl.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: ms(400) });
        solShown = ans;
        // Où apparaît la première solution ?
        var first = UNIV.find(function (k) { return p.a[k] && p.a[k] !== "∅"; });
        document.getElementById("solMsg").textContent = solAnswer(p) === "∅"
          ? (LANG === "en" ? "No solution in " + SYM[universe] + " — try a bigger set." : "Pas de solution dans " + SYM[universe] + " — essaie un ensemble plus grand.")
          : "";
        nextBtn.disabled = false;
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
      }

      // ---------- Chapitre Ensembles ----------
      // Un nombre s'affiche ; on le glisse dans un ensemble (ou on touche la
      // case). Toute case qui le contient est juste : 3 est dans ℤ, mais
      // aussi dans ℂ. La réponse allume toutes les cases qui le contiennent
      // — on voit les inclusions. Appui long sur une case : sa définition.

      var ensEl = document.getElementById("ens");
      var ensNum = document.getElementById("ensNum");
      var ensMsg = document.getElementById("ensMsg");
      var ensTip = document.getElementById("ensTip");
      var ensScoreEl = document.getElementById("ensScore");
      var ensState = null, ensScore = { ok: 0, n: 0 }, ensStreak = 0;

      // Chaque case : symbole, ensemble de base (pour les cases à cocher du
      // menu), appartenance, définition.
      var ENS = [
        { id: "Ns", sym: "ℕ*", base: "N", row: 1, has: function (z) { return z.real && z.kind === "int" && z.re > 0; },
          def: "ℕ* : les entiers naturels non nuls, 1, 2, 3…", defEn: "ℕ*: non-zero natural numbers 1, 2, 3…" },
        { id: "N", sym: "ℕ", base: "N", row: 1, has: function (z) { return z.real && z.kind === "int" && z.re >= 0; },
          def: "ℕ : les entiers naturels 0, 1, 2, 3…", defEn: "ℕ: natural numbers 0, 1, 2, 3…" },
        { id: "Z", sym: "ℤ", base: "Z", row: 1, has: function (z) { return z.real && z.kind === "int"; },
          def: "ℤ : les entiers relatifs … −2, −1, 0, 1, 2…", defEn: "ℤ: integers … −2, −1, 0, 1, 2…" },
        { id: "Q", sym: "ℚ", base: "Q", row: 1, has: function (z) { return z.real && z.kind !== "irr"; },
          def: "ℚ : les rationnels, quotients p/q d'entiers (q ≠ 0).", defEn: "ℚ: rationals, quotients p/q of integers (q ≠ 0)." },
        { id: "R", sym: "ℝ", base: "R", row: 1, has: function (z) { return z.real; },
          def: "ℝ : les réels, tous les points de la droite graduée.", defEn: "ℝ: reals, every point of the number line." },
        { id: "C", sym: "ℂ", base: "C", row: 1, has: function () { return true; },
          def: "ℂ : les complexes a + ib, avec i² = −1. Contient tous les autres.", defEn: "ℂ: complex numbers a + ib, with i² = −1. Contains all the others." },
        { id: "D", sym: "𝔻", base: "Q", row: 2, has: function (z) { return z.real && (z.kind === "int" || z.kind === "dec"); },
          def: "𝔻 : les décimaux, un nombre fini de chiffres après la virgule (a/10ⁿ).", defEn: "𝔻: decimals, finitely many digits after the point (a/10ⁿ)." },
        { id: "RQ", sym: "ℝ∖ℚ", base: "R", row: 2, has: function (z) { return z.real && z.kind === "irr"; },
          def: "ℝ∖ℚ : les irrationnels, réels qui ne sont pas un quotient d'entiers (√2, π…).", defEn: "ℝ∖ℚ: irrationals, reals that are not a quotient of integers (√2, π…)." },
        { id: "Rp", sym: "ℝ₊", base: "R", row: 2, has: function (z) { return z.real && z.re >= 0; },
          def: "ℝ₊ : les réels positifs ou nuls.", defEn: "ℝ₊: non-negative reals." },
        { id: "iR", sym: "iℝ", base: "C", row: 2, has: function (z) { return Math.abs(z.re) < 1e-12; },
          def: "iℝ : les imaginaires purs ib (partie réelle nulle). 0 en fait partie.", defEn: "iℝ: pure imaginary numbers ib (zero real part). 0 belongs to it." },
        { id: "U", sym: "𝕌", base: "C", row: 2, has: function (z) { return Math.abs(Math.hypot(z.re, z.im) - 1) < 1e-9; },
          def: "𝕌 : les complexes de module 1, sur le cercle unité (e^(iθ)).", defEn: "𝕌: complex numbers of modulus 1, on the unit circle (e^(iθ))." }
      ];

      // Nombres : valeur (re, im) et nature de la partie réelle (entier,
      // décimal, rationnel, irrationnel). Quelques pièges : √9, −7/2, i².
      var R2 = Math.SQRT2;
      var NUMS = [
        { t: "3", re: 3, im: 0, kind: "int" }, { t: "0", re: 0, im: 0, kind: "int" }, { t: "−4", re: -4, im: 0, kind: "int" },
        { t: "1", re: 1, im: 0, kind: "int" }, { t: "−1", re: -1, im: 0, kind: "int" }, { t: "√9", re: 3, im: 0, kind: "int" },
        { t: "0,25", re: 0.25, im: 0, kind: "dec" }, { t: "−7/2", re: -3.5, im: 0, kind: "dec" }, { t: "10⁻³", re: 0.001, im: 0, kind: "dec" },
        { t: "1/3", re: 1 / 3, im: 0, kind: "rat" }, { t: "22/7", re: 22 / 7, im: 0, kind: "rat" }, { t: "−2/3", re: -2 / 3, im: 0, kind: "rat" },
        { t: "√2", re: R2, im: 0, kind: "irr" }, { t: "π", re: Math.PI, im: 0, kind: "irr" }, { t: "−√2", re: -R2, im: 0, kind: "irr" },
        { t: "3i", re: 0, im: 3, kind: "int" }, { t: "i", re: 0, im: 1, kind: "int" }, { t: "i²", re: -1, im: 0, kind: "int" },
        { t: "2 + i", re: 2, im: 1, kind: "int" }, { t: "e^(iπ/3)", re: 0.5, im: Math.sqrt(3) / 2, kind: "dec" },
        { t: "(1 + i)/√2", re: 1 / R2, im: 1 / R2, kind: "irr" }, { t: "−i", re: 0, im: -1, kind: "int" }
      ];
      NUMS.forEach(function (z) { z.real = Math.abs(z.im) < 1e-12; });

      function smallestBase(z) {
        if (!z.real) return "C";
        if (z.kind === "irr") return "R";
        if (z.kind === "rat" || z.kind === "dec") return "Q";
        return z.re >= 0 ? "N" : "Z";
      }

      var ensBoxes = [];
      ENS.forEach(function (e) {
        var b = document.createElement("button");
        b.className = "ens-box";
        b.textContent = e.sym;
        b._e = e;
        var timer = null, longDone = false;
        b.addEventListener("pointerdown", function (ev) {
          ev.preventDefault();
          longDone = false;
          ensTip.hidden = true;
          timer = setTimeout(function () { longDone = true; ensShowTip(e, b); }, 450);
        });
        b.addEventListener("pointerup", function () {
          if (timer) { clearTimeout(timer); timer = null; }
          if (!longDone) ensAnswer(b);
        });

            { expr: [T("aa", X), T("aa2", "2", "sup"), T("p3", "−", "op"), T("bb", s(n * n)), T("dd", "·", "op dot"), T("ii", "(−1)", "", ["ii", "ii2"])], hl: ["ii"], note: "<b><i>i</i>² = −1</b>." },
            { top: true, expr: [T("aa", X), T("aa2", "2", "sup"), T("p3", "+", "op", ["p3", "ii"]), T("bb", s(n * n))],
              note: "−" + (n * n) + "·(−1) = +" + (n * n) + " : <b><i>x</i>² + " + (n * n) + "</b>, factorisé dans ℂ." },
            { summary: true }
          ];
        }

        var GEN = {
          "−( … )": [minusParen(4, 5, 3), minusParen(5, 2, 4)],
          "Opposés": [opposites(4, 8, 6), opposites(5, 9, 4)],
          "Fraction": [fraction(2, 7, 3), fraction(3, 5, 5)],
          "Piège": [trap(5), trap(4)],
          "Distribuer": [distribute(3, SH.o, SH.q), distribute(2, SH.t, SH.o)],
          "Factoriser": [factor(3, SH.o, SH.q), factor(2, SH.t, SH.o)],
          "Double": [double(2, 3), double(3, 4)],
          "(a+b)²": [square("+", 3), square("+", 5)],
          "(a−b)²": [square("−", 4), square("−", 2)],
          "(a+b)(a−b)": [conj(3), conj(5)],
          "a²+b² ℂ": [cplx(2), cplx(3)],
          "Équation": [equation(3, 5, 17), equation(4, 1, 21)]
        };
        var GEN_V = {
          "3·( … )": [timesParen(2, 3, 5, 4), timesParen(4, 2, 3, 2)],
          "Regrouper": [regroup(4, 3, 8, 6), regroup(2, 5, 9, 4)]
        };
        DEMOS.forEach(function (d) {
          if (GEN[d.title]) d.alts = [d.steps].concat(GEN[d.title]);
          if (d.variants) Object.keys(d.variants).forEach(function (k) {
            var v = d.variants[k];
            if (GEN_V[v.title]) v.alts = [v.steps].concat(GEN_V[v.title]);
          });
        });
      })();

      // Passage courant de chaque chapitre (mémorisé) : on avance d'un cran
      // à chaque nouveau départ
      var altIdx = {};
      try { altIdx = JSON.parse(localStorage.getItem("pasapas_alt") || "{}") || {}; } catch (e) {}
      function altSource(d) { var vk = variantKey(d); return vk ? d.variants[vk] : d; }
      function curSteps(d) {
        var src = altSource(d);
        if (!src.alts) return src === d ? d.baseSteps : src.steps;
        return src.alts[(altIdx[src.title] || 0) % src.alts.length];
      }
      function renew(d) {
        if (d.custom) return;
        if (d.gen) { d.steps = d.gen(); return; }
        var src = altSource(d);
        if (src.alts) {
          // La toute première fois : l'exemple d'origine
          altIdx[src.title] = src.title in altIdx ? (altIdx[src.title] + 1) % src.alts.length : 0;
          try { localStorage.setItem("pasapas_alt", JSON.stringify(altIdx)); } catch (e) {}
        }
        d.steps = curSteps(d);
      }

      // ---------- Écriture usuelle ----------
      // Pendant les calculs, tous les produits ont leur point (2·x). À la
      // fin, une étape de plus revient à l'écriture habituelle (2x) : même
      // objet, écrit plus court.
      function needsDots(list) {
        return list.some(function (it, i) {
          if (it.frac) return needsDots(it.num) || needsDots(it.den);
          if (it.cancel) return false;
          if (/\bsup\b/.test(it.k)) return false;
          if (/(\d)(<i>|<svg)|(<\/i>)(<i>)/.test(it.t)) return true;
          return i > 0 && isFactorEnd(list[i - 1]) && isFactorStart(it);
        });
      }
      function addUsual(steps) {
        var k = steps.length - 1;
        while (k >= 0 && (!steps[k].expr || steps[k].summary)) k--;
        if (k < 0 || !needsDots(steps[k].expr)) return;
        var last = steps[k];
        steps.splice(k + 1, 0, {
          expr: last.expr, implicit: true, line: last.line, trace: last.trace,
          note: "Écriture usuelle : le point de multiplication ne s'écrit plus, c'est le même produit."
        });
      }
      DEMOS.forEach(function (d) {
        if (d.custom) return;
        (d.alts || [d.steps]).forEach(addUsual);
        if (d.variants) Object.keys(d.variants).forEach(function (k) { var v = d.variants[k]; (v.alts || [v.steps]).forEach(addUsual); });
      });

      // ---------- Vérification des calculs ----------
      // Chaque étape de chaque démo est recalculée avec des valeurs au hasard
      // pour x, ○ et □ : une expression doit garder la même valeur d'une
      // étape à l'autre ; une équation doit garder la même solution. Une
      // erreur de saisie (signe oublié, mauvais nombre) est donc repérée
      // dès le chargement au lieu d'être découverte à l'écran.

      function tokText(t) {
        return t.t
          .replace(/<svg[^>]*><circle[^>]*\/><\/svg>/g, "O")
          .replace(/<svg[^>]*><rect[^>]*\/><\/svg>/g, "Q")
          // le triangle, troisième forme, se calcule comme une lettre de plus
          .replace(/<svg[^>]*><path[^>]*\/><\/svg>/g, "a")
          .replace(/<[^>]+>/g, "")
          .replace(/i/g, "I")
          .replace(/−/g, "-").replace(/·/g, "*").replace(/²/g, "^2");
      }

      function exprText(list) {
        return list.map(function (it) {
          if (it.frac) return "(" + exprText(it.num) + ")/(" + exprText(it.den) + ")";
          if (it.cancel) return "(" + exprText(it.top) + exprText(it.bottom) + ")";
          if (/\bsup\b/.test(it.k)) return "^" + tokText(it);
          return tokText(it);
        }).join("");
      }

      function evalExpr(str, env) {
        // Multiplication implicite : 2x, 2(…), )(…, x(…
        var js = str.replace(/\s+/g, "")
          .replace(/([0-9xOQabI)])(?=[xOQabI(])/g, "$1*")
          .replace(/\^(\d)/g, "**$1");
        if (!/^[0-9xOQabI+\-*\/().]*$/.test(js)) throw new Error("caractère inattendu : " + str);
        return Function("x", "O", "Q", "a", "b", "I", "return (" + js + ");")(env.x, env.O, env.Q, env.a, env.b, env.I || 0);
      }

      // Valeur complexe [réel, imaginaire] : l'expression est un polynôme
      // de degré ≤ 2 en i ; on le reconstruit par 3 évaluations (i = 0, 1,
      // −1) puis on remplace i² par −1.
      function evalC(str, env) {
        function f(t) { var e = Object.assign({}, env, { I: t }); return evalExpr(str, e); }
        var c0 = f(0), p1 = f(1), m1 = f(-1);
        var c1 = (p1 - m1) / 2, c2 = (p1 + m1) / 2 - c0;
        return [c0 - c2, c1];
      }

      function verifyDemos() {
        var issues = [];
        var envs = [{ x: 1.7, O: 2.3, Q: -0.9, a: 1.3, b: -2.2 }, { x: -3.1, O: 0.6, Q: 4.2, a: -0.7, b: 3.4 }];
        var lists = [];
        DEMOS.forEach(function (d) {
          if (d.custom) return;
          (d.alts || [d.steps]).forEach(function (st, n) { lists.push({ title: d.title + (n ? " #" + (n + 1) : ""), steps: st }); });
          if (d.variants) Object.keys(d.variants).forEach(function (k) {
            var v = d.variants[k];
            (v.alts || [v.steps]).forEach(function (st, n) { lists.push({ title: v.title + (n ? " #" + (n + 1) : ""), steps: st }); });
          });
        });
        lists.forEach(function (demo) {
          var ref = null, root = null;
          demo.steps.forEach(function (st, i) {
            if (!st.expr || st.summary) return;
            var txt = exprText(st.expr);
            // Sous-expressions posées : le résultat sous la barre doit être juste
            st.expr.forEach(function (it) {
              if (it.cancel && it.eq) {
                envs.forEach(function (env) {
                  var a = evalExpr(exprText(it.top) + exprText(it.bottom), env), b = evalExpr(exprText(it.eq), env);
                  if (Math.abs(a - b) > 1e-9) issues.push(demo.title + " étape " + (i + 1) + " : résultat posé faux");
                });
              }
            });
            if (/[≠]/.test(txt)) return;
            try {
              if (txt.indexOf("=") >= 0) {
                var sides = txt.split("=");
                var f = function (x) { return evalExpr(sides[0], { x: x, O: 0, Q: 0 }) - evalExpr(sides[1], { x: x, O: 0, Q: 0 }); };
                if (root === null) { var f0 = f(0), f1 = f(1); root = -f0 / (f1 - f0); }
                if (Math.abs(f(root)) > 1e-9 || Math.abs(f(root + 1.7)) < 1e-9)
                  issues.push(demo.title + " étape " + (i + 1) + " : « " + txt + " » n'a plus la même solution");
              } else {
                var vals = envs.map(function (env) { return evalC(txt, env); });
                if (ref === null || st.fresh) ref = vals;
                else if (vals.some(function (v, k) { return Math.abs(v[0] - ref[k][0]) > 1e-9 || Math.abs(v[1] - ref[k][1]) > 1e-9; }))
                  issues.push(demo.title + " étape " + (i + 1) + " : « " + txt + " » ne vaut plus l'expression de départ");
              }
            } catch (e) {
              issues.push(demo.title + " étape " + (i + 1) + " : illisible (" + e.message + ")");
            }
          });
        });
        return issues;
      }

      var ISSUES = verifyDemos();
      window.pasAPasIssues = ISSUES;
      if (ISSUES.length) {
        console.error("Pas à Pas — étapes incohérentes :\n" + ISSUES.join("\n"));
        var warn = document.createElement("div");
        warn.className = "verify-warn";
        warn.textContent = "⚠ " + ISSUES.join(" · ");
        document.body.appendChild(warn);
      }

      // ---------- Éléments ----------

      var stageWrap = document.getElementById("stageWrap");
      var stageTop = document.getElementById("stageTop");
      var stage = document.getElementById("stage");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      var tabsEl = document.getElementById("tabs");

      var demoIndex = 0;
      var cur = 0;
      var busy = false;
      var lastTopStep = null;
      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      // « Réduire les animations » (iOS) : on supprime le mouvement, mais on
      // garde des temps de lecture normaux. (Avant, tout était accéléré 100
      // fois : le calcul mental défilait comme un film en accéléré.)
      var SPEED = 1;
      if (reduced && Element.prototype.animate) {
        var nativeAnimate = Element.prototype.animate;
        Element.prototype.animate = function (kf, opts) {
          if (typeof opts === "object" && opts) { opts = Object.assign({}, opts, { duration: 1, delay: 0 }); }
          else opts = 1;
          return nativeAnimate.call(this, kf, opts);
        };
      }

      function ms(n) { return n * SPEED; }
      function wait(n) { return new Promise(function (r) { setTimeout(r, ms(n)); }); }
      function done(anim) { return anim.finished.catch(function () {}); }

      // ---------- Rendu ----------

      function tokenEl(tok, step) {
        var el = document.createElement("span");
        el.className = "tok " + tok.k;
        el.dataset.id = tok.id;
        if (tok.from) el.dataset.from = tok.from.join(",");
        if (step.hl && step.hl.indexOf(tok.id) >= 0) el.classList.add("hl");
        if (step.signs && step.signs.indexOf(tok.id) >= 0) el.classList.add("sign-hl");
        var inner = document.createElement("span");
        inner.className = "in";
        // Point explicite à l'intérieur d'un jeton : 2x → 2·x, ab → a·b
        inner.innerHTML = step.implicit || /\bsup\b/.test(tok.k) ? tok.t
          : tok.t.replace(/(\d)(<i>|<svg)/g, "$1·$2").replace(/(<\/i>)(<i>)/g, "$1·$2");
        el.appendChild(inner);
        return el;
      }

      // plain = true : rendu simple sans surbrillance (utilisé en haut,
      // "écrit normalement" — l'accent visuel appartient au détail du bas)
      // Ne coupe jamais une expression sur deux lignes (illisible) : elle
      // reste sur une seule ligne et se rétrécit dynamiquement, mesurée
      // une fois posée dans la page, pour tenir exactement dans la largeur
      // disponible.
      function fitOneLine(expr, container) {
        expr.style.transform = "scale(1)";
        var avail = container.clientWidth - 16; // petite marge de sécurité
        var w = expr.scrollWidth;
        if (avail > 0 && w > avail) {
          var scale = Math.max(0.42, avail / w);
          expr.style.transform = "scale(" + scale.toFixed(3) + ")";
        }
      }

      // Produits implicites entre jetons : 2(…), x(…), )(…, x²(… → un point
      // « · » explicite est inséré, sauf à l'étape « écriture usuelle ».
      function isFactorEnd(t) {
        if (!t || t.frac || t.cancel || /\bop\b/.test(t.k)) return false;
        return /(\d|<\/i>|\)|<\/svg>)$/.test(t.t) || /\bsup\b/.test(t.k);
      }
      function isFactorStart(t) {
        if (!t || t.frac || t.cancel || /\bop\b|\bsup\b/.test(t.k)) return false;
        return /^(\(|<i>|<svg)/.test(t.t);
      }
      function withDots(list, implicit) {
        if (implicit) return list;
        var out = [];
        list.forEach(function (it, i) {
          var prev = list[i - 1];
          if (i > 0 && isFactorEnd(prev) && isFactorStart(it)) out.push(T("auto-" + prev.id + "-" + it.id, "·", "op dot"));
          out.push(it);
        });
        return out;
      }

      function buildExprEl(step, plain) {
        var expr = document.createElement("div");
        expr.className = "expr";
        var forStep = plain ? { implicit: step.implicit } : step;
        withDots(step.expr, step.implicit).forEach(function (item) {
          if (item.cancel) {
            var cv = document.createElement("span");
            cv.className = "cancel";
            var topRow = document.createElement("span");
            topRow.className = "crow";
            item.top.forEach(function (t) { topRow.appendChild(tokenEl(t, forStep)); });
            var cbar = document.createElement("span");
            cbar.className = "cbar";
            var botRow = document.createElement("span");
            botRow.className = "crow";
            item.bottom.forEach(function (t) { botRow.appendChild(tokenEl(t, forStep)); });
            // Posé en colonne, comme à l'école : les deux termes l'un sous
            // l'autre, la barre, puis le résultat sous la barre (pas à
            // côté : sinon on croirait lire une fraction)
            cv.appendChild(topRow);
            cv.appendChild(botRow);
            cv.appendChild(cbar);
            if (item.eq) {
              var resRow = document.createElement("span");
              resRow.className = "crow";
              var eqSign = document.createElement("span");
              eqSign.className = "ceq";
              eqSign.textContent = "=";
              resRow.appendChild(eqSign);
              item.eq.forEach(function (t) { resRow.appendChild(tokenEl(t, forStep)); });
              cv.appendChild(resRow);
            }
            expr.appendChild(cv);
          } else if (item.frac) {
            var f = document.createElement("span");
            f.className = "frac";
            var num = document.createElement("span");
            num.className = "row";
            withDots(item.num, step.implicit).forEach(function (t) { num.appendChild(tokenEl(t, forStep)); });
            var bar = document.createElement("span");
            bar.className = "bar";
            var den = document.createElement("span");
            den.className = "row";
            withDots(item.den, step.implicit).forEach(function (t) { den.appendChild(tokenEl(t, forStep)); });
            f.appendChild(num);
            f.appendChild(bar);
            f.appendChild(den);
            expr.appendChild(f);
          } else {
            expr.appendChild(tokenEl(item, forStep));
          }
        });
        return expr;
      }

      // Droite des réels en SVG, sous l'expression. La flèche va de 0 à la
      // valeur ; multiplier par −1 la fait tourner d'un demi-tour autour de
      // 0, et la pointe laisse la trace de son demi-cercle (au-dessus pour
      // le 1er demi-tour, en dessous pour le 2e : un tour complet à la fin).
      var SVGNS = "http://www.w3.org/2000/svg";
      function svgEl(tag, attrs, parent) {
        var e = document.createElementNS(SVGNS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      }

      function arcPath(g, a1, a2) {
        var d = "";
        for (var i = 0; i <= 48; i++) {
          var t = (a1 + (a2 - a1) * i / 48) * Math.PI / 180;
          d += (i ? " L" : "M") + (g.cx + g.r * Math.cos(t)).toFixed(1) + "," + (g.cy - g.r * Math.sin(t)).toFixed(1);
        }
        return d;
      }

      function drawNumLine(step) {
        var W = stage.clientWidth, H = stage.clientHeight;
        var expr = stage.querySelector(".expr");
        var top = expr ? expr.getBoundingClientRect().bottom - stage.getBoundingClientRect().top + 10 : 20;
        var avail = H - top - 24;
        var u = Math.max(8, Math.min(W * 0.84 / 8, avail / 6.8));
        // Échelle : la valeur est toujours dessinée à 3 graduations du 0,
        // quelle que soit sa taille (3, 25, 1000…)
        var V = Math.abs(step.line), L = 3 * u;
        var g = { cx: W / 2, cy: top + 3 * u + 0.4 * u, u: u, r: L };
        var svg = svgEl("svg", { class: "numsvg" });
        stage.appendChild(svg);
        svgEl("line", { x1: g.cx - 4.3 * u, y1: g.cy, x2: g.cx + 4.3 * u, y2: g.cy, class: "nl-axis" }, svg);
        for (var k = -4; k <= 4; k++) {
          var x = g.cx + k * u;
          svgEl("line", { x1: x, y1: g.cy - 4, x2: x, y2: g.cy + 4, class: "nl-axis" }, svg);
          if (k === 0 || Math.abs(k) === 3) {
            var t = svgEl("text", { x: x, y: g.cy + 16, class: "nl-lab" }, svg);
            t.textContent = k === 0 ? "0" : (k < 0 ? "−" : "") + V;
          }
        }
        (step.trace || []).forEach(function (tr) {
          svgEl("path", { d: arcPath(g, tr[0], tr[1]), class: "nl-trace" }, svg);
          var mid = (tr[0] + tr[1]) / 2 * Math.PI / 180;
          var lab = svgEl("text", { x: g.cx + (g.r + 12) * Math.cos(mid), y: g.cy - (g.r + 12) * Math.sin(mid) + 4, class: "nl-deg" }, svg);
          lab.textContent = "180°";
        });
        var vec = svgEl("g", { class: "nl-vec" }, svg);
        svgEl("line", { x1: g.cx, y1: g.cy, x2: g.cx + L - 6, y2: g.cy }, vec);
        svgEl("path", { d: "M" + (g.cx + L) + "," + g.cy + " l-10,-6 l0,12 z" }, vec);
        svgEl("circle", { cx: g.cx, cy: g.cy, r: 3 }, vec);
        var ang = step.line < 0 ? 180 : 0;
        vec.setAttribute("transform", "rotate(" + (-ang) + " " + g.cx + " " + g.cy + ")");
        stage._nl = { svg: svg, vec: vec, g: g };
      }

      // Récapitulatif : toutes les écritures de la démo sur une seule page,
      // l'une sous l'autre, reliées par « = » — on voit d'un coup que c'est
      // le même objet écrit de plusieurs façons.
      function buildSummary() {
        var col = document.createElement("div");
        col.className = "summary";
        var prev = "";
        DEMOS[demoIndex].steps.forEach(function (st) {
          if (!st.expr) return;
          var e = buildExprEl(st, true);
          var key = e.textContent.replace(/\s+/g, "");
          if (key === prev) return;
          var row = document.createElement("div");
          row.className = "sum-row";
          var eq = document.createElement("span");
          eq.className = "sum-eq";
          eq.textContent = prev ? "=" : "";
          row.appendChild(eq);
          // Pas d'identifiants : ces jetons ne participent pas aux glissements
          e.querySelectorAll("[data-id]").forEach(function (t) { t.removeAttribute("data-id"); });
          row.appendChild(e);
          col.appendChild(row);
          prev = key;
        });
        stage.appendChild(col);
        var avail = stage.clientHeight - 16, hgt = col.scrollHeight;
        var wAvail = stage.clientWidth - 16, wid = col.scrollWidth;
        var k = Math.min(1, avail / hgt, wAvail / wid);
        col.style.transform = "scale(" + k.toFixed(3) + ")";
        col.querySelectorAll(".sum-row").forEach(function (r, i) {
          r.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }],
            { duration: ms(500), delay: ms(300 + i * 450), easing: "ease-out", fill: "backwards" });
        });
      }

      function build(step) {
        stage.innerHTML = "";
        if (step.summary) { buildSummary(); return; }
        var expr = buildExprEl(step, false);
        stage.appendChild(expr);
        fitOneLine(expr, stage);
        stage.classList.toggle("has-line", step.line !== undefined);
        if (step.line !== undefined) drawNumLine(step);
        if (step.arcs) drawArcs(step.arcs, false);
      }

      // Flèches en arc, comme on les dessine à la main : du (−1) vers chaque
      // terme qu'il touche. Le dernier arc d'une étape se trace lentement,
      // puis reste affiché aux étapes suivantes.
      function arcGeom(srcId, toIds) {
        var base = stage.getBoundingClientRect();
        var src = stage.querySelector('.tok[data-id="' + srcId + '"]');
        if (!src) return null;
        var rs = src.getBoundingClientRect();
        var l = Infinity, r = -Infinity, t = Infinity;
        toIds.forEach(function (id) {
          var el = stage.querySelector('.tok[data-id="' + id + '"]');
          if (!el) return;
          var b = el.getBoundingClientRect();
          l = Math.min(l, b.left); r = Math.max(r, b.right); t = Math.min(t, b.top);
        });
        if (!isFinite(l)) return null;
        var x1 = rs.left + rs.width / 2 - base.left, y1 = rs.top - base.top + 2;
        var x2 = (l + r) / 2 - base.left, y2 = t - base.top + 2;
        var lift = Math.min(y1 - 6, 22 + Math.abs(x2 - x1) * 0.28);
        var cy = Math.min(y1, y2) - lift * 2;
        return "M" + x1 + "," + y1 + " Q" + (x1 + x2) / 2 + "," + cy + " " + x2 + "," + y2;
      }

      function arcSvg() {
        var svg = stage.querySelector("svg.arcs");
        if (!svg) {
          svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "arcs");
          svg.innerHTML = '<defs><marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--sign)"/></marker></defs>';
          stage.appendChild(svg);
        }
        return svg;
      }

      function addArc(d) {
        var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("marker-end", "url(#arrowHead)");
        arcSvg().appendChild(path);
        return path;
      }

      function drawArcs(list, skipLast) {
        list.forEach(function (to, i) {
          if (skipLast && i === list.length - 1) return;
          var d = arcGeom("m", to);
          if (d) addArc(d);
        });
      }

      function fxArc(fx) {
        var d = arcGeom(fx.src, fx.to);
        if (!d) return Promise.resolve();
        var path = addArc(d);
        var len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        path.setAttribute("marker-end", "");
        return done(path.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
          { duration: ms(1800), easing: "cubic-bezier(.4,0,.3,1)", fill: "forwards" })).then(function () {
          path.setAttribute("marker-end", "url(#arrowHead)");
          fx.to.forEach(function (id) {
            var el = stage.querySelector('.tok[data-id="' + id + '"]');
            if (el) done(el.animate([{ transform: "scale(1)" }, { transform: "scale(1.25)" }, { transform: "scale(1)" }],
              { duration: ms(700), easing: "ease-out" }));
          });
          return wait(700);
        });
      }

      // Multiplier par −1 : la flèche tourne d'un demi-tour autour de 0,
      // lentement, dans le plan — elle ne « saute » pas de 3 à −3.
      // La flèche tourne vraiment, dans le plan : la pointe trace son
      // demi-cercle en direct, l'angle parcouru s'affiche en dessous.
      function fxRotate(fx) {
        var nl = stage._nl;
        if (!nl) return Promise.resolve();
        var g = nl.g;
        var live = svgEl("path", { class: "nl-trace live", d: "" }, nl.svg);
        var deg = svgEl("text", { x: g.cx, y: fx.to > 180 ? g.cy + g.r + 30 : g.cy - g.r - 10, class: "nl-deg" }, nl.svg);
        return wait(500).then(function () {
          return new Promise(function (res) {
            var dur = ms(3200), t0 = performance.now();
            function step(now) {
              var p = Math.min(1, (now - t0) / (dur || 1));
              var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
              var a = fx.from + (fx.to - fx.from) * e;
              nl.vec.setAttribute("transform", "rotate(" + (-a) + " " + g.cx + " " + g.cy + ")");
              live.setAttribute("d", arcPath(g, fx.from, a));
              deg.textContent = Math.round(a - fx.from) + "°";
              if (p < 1) requestAnimationFrame(step); else res();
            }
            requestAnimationFrame(step);
          });
        }).then(function () { return wait(600); });
      }

      // ---------- Rangée du haut ("écrit normalement") ----------

      var magicEl = document.getElementById("magic");

      function renderTop(step, animate) {
        var old = stageTop.querySelector(".expr");
        var expr = buildExprEl(step, true);
        if (animate && old) {
          stageTop.insertBefore(expr, magicEl);
          fitOneLine(expr, stageTop);
          var target = expr.style.transform || "scale(1)";
          expr.style.opacity = "0";
          var outA = old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(200), easing: "ease-in", fill: "forwards" });
          done(outA).then(function () { old.remove(); });
          requestAnimationFrame(function () {
            done(expr.animate([
              { opacity: 0, transform: target + " translateY(6px)" },
              { opacity: 1, transform: target + " translateY(0)" }
            ], { duration: ms(380), delay: ms(160), easing: "ease-out", fill: "both" }));
          });
        } else {
          if (old) old.remove();
          stageTop.insertBefore(expr, magicEl);
          fitOneLine(expr, stageTop);
        }

        // La « phrase magique » : ce qu'on entend classiquement, pas
        // rigoureux, contrasté avec le détail sans raccourci en dessous.
        magicEl.classList.remove("show");
        setTimeout(function () {
          magicEl.innerHTML = tr(step.magic || "");
          if (step.magic) magicEl.classList.add("show");
        }, animate ? ms(200) : 0);
      }

      function topAnchorStep(demo, to) {
        var anchor = demo.steps[0];
        for (var i = 0; i <= to && i < demo.steps.length; i++) {
          if (demo.steps[i].top) anchor = demo.steps[i];
        }
        return anchor;
      }

      var stageDivider = document.querySelector(".stage-divider");
      var stageTopTag = document.querySelector(".stage-top .row-tag");
      var stageBottomTag = document.querySelector(".stage-bottom .row-tag");

      function updateRowTags(isFinal) {
        if (stageTopTag) stageTopTag.textContent = tr(isFinal ? "départ" : "sauter des étapes");
        if (stageBottomTag) stageBottomTag.textContent = tr(isFinal ? "résultat" : "pas à pas");
      }

      // Aligne la rangée du haut sur l'étape-ancre la plus proche : elle ne
      // bouge qu'à certaines étapes, pendant que le bas détaille tout. À la
      // toute dernière étape, plus de séparateur : le haut revient montrer
      // la formule de départ, le bas montre le résultat — même objet.
      function syncTop(animate) {
        var demo = DEMOS[demoIndex];
        // Page récapitulative : elle contient déjà le départ, pas de rangée du haut
        stageWrap.classList.toggle("split", !!demo.split && !demo.steps[cur].summary);
        if (!demo.split) { stageWrap.classList.remove("final"); return; }
        var isFinal = cur === demo.steps.length - 1;
        stageWrap.classList.toggle("final", isFinal);
        // Une équation n'est pas égale à sa solution : elle lui est
        // équivalente (mêmes solutions), d'où ⇔ plutôt que =.
        stageDivider.dataset.sign = demo.finalSign || "=";
        updateRowTags(isFinal);
        var anchor = isFinal ? demo.steps[0] : topAnchorStep(demo, cur);
        if (anchor !== lastTopStep) {
          renderTop(anchor, animate);
          lastTopStep = anchor;
        }
      }

      function snapshot() {
        var base = stage.getBoundingClientRect();
        var map = {};
        stage.querySelectorAll(".tok").forEach(function (el) {
          var r = el.getBoundingClientRect();
          map[el.dataset.id] = {
            el: el,
            x: r.left - base.left,
            y: r.top - base.top,
            w: r.width,
            h: r.height,
            html: el.querySelector(".in").innerHTML
          };
        });
        return map;
      }

      function center(s) { return { x: s.x + s.w / 2, y: s.y + s.h / 2 }; }

      function ghostOf(s, extraClass) {
        var g = document.createElement("span");
        g.className = "ghost " + (extraClass || "");
        g.style.left = s.x + "px";
        g.style.top = s.y + "px";
        g.style.width = s.w + "px";
        g.style.height = s.h + "px";
        g.innerHTML = s.html;
        stage.appendChild(g);
        return g;
      }

      // ---------- Effets ----------

      // Le premier exemplaire du signe garde l'identifiant "m" : il migre
      // tout seul via le repositionnement normal (l'étape suivante le place
      // déjà au bon endroit, avec le temps que ça prend). On ne fait donc
      // voyager ici que les copies supplémentaires — une par une, chacune
      // restant posée à l'endroit où elle atterrit, pas de disparition.
      function fxTouch(fx) {
        var snap = snapshot();
        var src = snap[fx.src];
        if (!src) return Promise.resolve();

        // Très lent, volontairement : c'est la troisième fois que la
        // vitesse de cette animation est signalée trop rapide. Chaque −1
        // doit se voir clairement se développer et voyager, pas juste
        // clignoter d'un état à l'autre.
        var extraTargets = fx.targets.slice(1);
        var chain = wait(700);
        extraTargets.forEach(function (id) {
          var t = snap[id];
          if (!t) return;
          chain = chain.then(function () {
            var g = ghostOf(src, "traveller");
            g.innerHTML = "−1";
            var to = {
              x: center(t).x - center(src).x,
              y: t.y - src.y - src.h * 0.75
            };
            var mid = { x: to.x * 0.5, y: Math.min(0, to.y) - 44 };
            var a = g.animate([
              { transform: "translate(0,0) scale(0.7)" },
              { transform: "translate(" + mid.x + "px," + mid.y + "px) scale(0.7)" },
              { transform: "translate(" + to.x + "px," + to.y + "px) scale(0.7)" }
            ], { duration: ms(2200), easing: "ease-in-out", fill: "forwards" });
            // Le fantôme reste affiché, posé à l'arrivée — il ne s'efface
            // pas : c'est lui qui deviendra visuellement le jeton final.
            return done(a).then(function () {
              var hit = t.el.animate([
                { transform: "scale(1)", color: "var(--ink)" },
                { transform: "scale(1.3)", color: "var(--sign)" },
                { transform: "scale(1)", color: "var(--sign)" }
              ], { duration: ms(700), easing: "ease-out", fill: "forwards" });
              return done(hit);
            }).then(function () { return wait(800); });
          });
        });

        return chain.then(function () { return wait(250); });
      }

      // Méthode de Singapour (programme MOE, P1) : addition par le « cadre
      // de dix » — deux rangées de 5 cases. Chaque nombre part de son jeton
      // en jetons ronds qui remplissent les cases, dans l'ordre ; le second
      // nombre vient compléter les cases vides (« faire 10 » quand ça
      // déborde, cadre suivant). La structure 5 + 5 se lit sans compter.
      // Ne gère que des nombres de même signe (pas d'annulation ici).
      function fxBlocks(blocks, snap, cx, units) {
        var cell = 24, dot = 17, apart = 12;
        var rows = blocks.map(function (b) { return { b: b, p: snap[b.id] }; })
          .filter(function (r) { return r.p; });
        if (!rows.length) return Promise.resolve();

        var total = 0;
        rows.forEach(function (r) { total += Math.abs(r.b.n); });
        var frames = Math.max(1, Math.ceil(total / 10));
        var fw = cell * 5;
        var left0 = cx - (frames * fw + (frames - 1) * apart) / 2;
        var y0 = 0;
        rows.forEach(function (r) { y0 = Math.max(y0, r.p.y + r.p.h); });
        var top = y0 + 32; // bien détaché de l'expression

        function slot(k) {
          var f = Math.floor(k / 10), r = Math.floor((k % 10) / 5), c = k % 5;
          return { x: left0 + f * (fw + apart) + c * cell + cell / 2, y: top + r * cell + cell / 2 };
        }

        // 1. Le cadre apparaît, vide
        var appear = [];
        for (var k = 0; k < frames * 10; k++) {
          var s = slot(k);
          var c = document.createElement("span");
          c.className = "cell";
          c.style.left = (s.x - cell / 2) + "px";
          c.style.top = (s.y - cell / 2) + "px";
          c.style.width = cell + "px";
          c.style.height = cell + "px";
          stage.appendChild(c);
          units.push({ el: c, x: s.x, y: s.y, at: "translate(0,0)" });
          appear.push(done(c.animate([{ opacity: 0 }, { opacity: 1 }],
            { duration: ms(700), easing: "ease-out", fill: "backwards" })));
        }

        // Légende sous le cadre : le calcul écrit en toutes lettres. Pour
        // des négatifs : (−2) + (−1) = −(2 + 1) = −3 — chaque jeton vaut −1.
        var neg = rows.every(function (r) { return r.b.n < 0; });
        var cap = document.createElement("div");
        cap.className = "blocks-cap";
        cap.style.left = cx + "px";
        cap.style.top = (top + 2 * cell + 8) + "px";
        var parts = rows.map(function (r) { return r.b.n < 0 ? "(−" + (-r.b.n) + ")" : String(r.b.n); });
        var sum = rows.reduce(function (a, r) { return a + r.b.n; }, 0);
        cap.textContent = parts.join(" + ");
        stage.appendChild(cap);
        units.push({ el: cap, x: cx, y: top + 2 * cell + 16, at: "translate(-50%,0)" });

        // 2. Chaque nombre part de son jeton et remplit les cases suivantes
        var next = 0;
        var chain = Promise.all(appear).then(function () { return wait(300); });
        rows.forEach(function (r) {
          var n = Math.abs(r.b.n);
          var first = next;
          next += n;
          chain = chain.then(function () {
            var from = center(r.p);
            var flights = [];
            for (var i = 0; i < n; i++) {
              var s = slot(first + i);
              var el = document.createElement("span");
              el.className = "unit" + (r.b.n < 0 ? " neg" : "");
              if (r.b.n < 0) el.textContent = "−"; // un jeton jaune = −1
              el.style.left = (s.x - dot / 2) + "px";
              el.style.top = (s.y - dot / 2) + "px";
              el.style.width = dot + "px";
              el.style.height = dot + "px";
              stage.appendChild(el);
              units.push({ el: el, x: s.x, y: s.y, at: "translate(0,0)" });
              flights.push(done(el.animate([
                { transform: "translate(" + (from.x - s.x) + "px," + (from.y - s.y) + "px) scale(0.3)", opacity: 0 },
                { transform: "translate(0,0) scale(1)", opacity: 1 }
              ], { duration: ms(1100), delay: ms(480 * i), easing: "cubic-bezier(.3,1.2,.5,1)", fill: "backwards" })));
            }
            return Promise.all(flights).then(function () { return wait(1000); });
          });
        });

        return chain.then(function () {
          // La légende se complète, étape par étape
          var steps = neg
            ? ["−(" + rows.map(function (r) { return -r.b.n; }).join(" + ") + ")", String(sum).replace("-", "−")]
            : [String(sum)];
          var txt = cap.textContent, c2 = Promise.resolve();
          steps.forEach(function (st) {
            c2 = c2.then(function () {
              txt += " = " + st;
              cap.textContent = txt;
              // La légende ne sort jamais de l'écran
              var half = cap.offsetWidth / 2, W = stage.clientWidth;
              cap.style.left = Math.max(half + 6, Math.min(W - half - 6, cx)) + "px";
              cap.animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: ms(400) });
              return wait(1300);
            });
          });
          return c2;
        }).then(function () { return wait(800); });
      }

      function fxMeet(fx, vanished) {
        setTimeout(SND.meet, ms(900));
        var snap = snapshot();
        var parts = fx.ids.map(function (id) { return snap[id]; }).filter(Boolean);
        if (!parts.length) return Promise.resolve();
        var cx = 0, cy = 0;
        parts.forEach(function (p) { var c = center(p); cx += c.x; cy += c.y; });
        cx /= parts.length; cy /= parts.length;

        parts.forEach(function (p) { p.el.classList.add("hl"); });

        var units = [];
        var pre = wait(350);
        if (fx.blocks && hasBadge()) pre = pre.then(function () { return fxBlocks(fx.blocks, snap, cx, units); })
          // Le cadre de dix reste affiché : on le regarde, et c'est la
          // flèche qui lance la fusion vers le résultat
          .then(function () {
            return new Promise(function (r) {
              holdResolve = r;
              nextBtn.disabled = false;
              nextBtn.textContent = "→";
              nextBtn.classList.remove("text");
              nextBtn.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: ms(500) });
            });
          });

        return pre.then(function () {
          // Les carrés rejoignent le point de fusion en même temps que les
          // jetons : c'est de là que sort le résultat.
          units.forEach(function (u) {
            var a = u.el.animate([
              { transform: u.at, opacity: 1 },
              { transform: "translate(" + (cx - u.x) + "px," + (cy - u.y) + "px) scale(0.2)", opacity: 0 }
            ], { duration: ms(650), easing: "ease-in", fill: "forwards" });
            done(a).then(function () { u.el.remove(); });
          });
          var anims = parts.map(function (p) {
            var c = center(p);
            vanished[p.el.dataset.id] = true;
            return done(p.el.animate([
              { transform: "translate(0,0) scale(1)", opacity: 1 },
              { transform: "translate(" + (cx - c.x) * 0.85 + "px," + (cy - c.y) * 0.85 + "px) scale(0.9)", opacity: 1, offset: 0.7 },
              { transform: "translate(" + (cx - c.x) + "px," + (cy - c.y) + "px) scale(0.3)", opacity: 0 }
            ], { duration: ms(650), easing: "ease-in", fill: "forwards" }));
          });
          return Promise.all(anims);
        });
      }

      // ---------- Transition entre deux étapes ----------

      function transition(to, forward) {
        var demo = DEMOS[demoIndex];
        var step = demo.steps[to];
        var vanished = {};
        var pre = Promise.resolve();

        if (forward && step.fx) {
          if (step.fx.type === "touch") pre = fxTouch(step.fx);
          if (step.fx.type === "meet") pre = fxMeet(step.fx, vanished);
          if (step.fx.type === "rotate") pre = fxRotate(step.fx);
          if (step.fx.type === "arc") pre = fxArc(step.fx);
        }

        return pre.then(function () {
          var old = snapshot();
          build(step);
          // Les fantômes du glissement du signe restent posés jusqu'ici :
          // le vrai jeton est maintenant en place au même endroit, donc on
          // les retire sans qu'aucune image double soit jamais visible.
          stage.querySelectorAll(".ghost.traveller").forEach(function (g) { g.remove(); });
          var neu = snapshot();
          var anims = [];

          Object.keys(neu).forEach(function (id) {
            var n = neu[id];
            var o = old[id];
            if (o && !vanished[id]) {
              var dx = o.x - n.x, dy = o.y - n.y;
              if (Math.abs(dx) > 30) {
                // Changement de place : le jeton décrit un demi-cercle. Vers
                // la droite il passe au-dessus, vers la gauche en dessous —
                // deux termes qui s'échangent se croisent sans se heurter.
                var lift = Math.min(70, Math.abs(dx) * 0.45) * (dx < 0 ? -1 : 1);
                var kf = [];
                for (var q = 0; q <= 8; q++) {
                  var t = q / 8, sn = Math.sin(Math.PI * t);
                  kf.push({ transform: "translate(" + (dx * (1 - t)) + "px," + (dy * (1 - t) + lift * sn) + "px) scale(" + (1 + 0.12 * sn) + ")" });
                }
                anims.push(done(n.el.animate(kf, { duration: ms(1100), easing: "cubic-bezier(.45,0,.3,1)" })));
              } else if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                anims.push(done(n.el.animate([
                  { transform: "translate(" + dx + "px," + dy + "px)" },
                  { transform: "translate(0,0)" }
                ], { duration: ms(650), easing: "cubic-bezier(.5,0,.2,1)" })));
              }
              if (o.html !== n.html) {
                anims.push(done(n.el.querySelector(".in").animate([
                  { transform: "rotateX(90deg)", opacity: 0.2 },
                  { transform: "rotateX(0deg)", opacity: 1 }
                ], { duration: ms(450), easing: "ease-out" })));
              }
            } else if (step.instant && step.instant.indexOf(id) >= 0) {
              // Déjà amené en place par le glissement du signe (ghost) :
              // apparaît directement, sans reprendre une deuxième animation.
            } else {
              var from = forward && n.el.dataset.from
                ? n.el.dataset.from.split(",").map(function (f) { return old[f]; }).filter(Boolean)
                : [];
              if (from.length) {
                var fx = 0, fy = 0;
                from.forEach(function (f) { var c = center(f); fx += c.x; fy += c.y; });
                fx /= from.length; fy /= from.length;
                var c = center(n);
                anims.push(done(n.el.animate([
                  { transform: "translate(" + (fx - c.x) + "px," + (fy - c.y) + "px) scale(0.4)", opacity: 0 },
                  { transform: "translate(0,0) scale(1)", opacity: 1 }
                ], { duration: ms(600), easing: "cubic-bezier(.3,1.4,.5,1)" })));
              } else {
                anims.push(done(n.el.animate([
                  { transform: "scale(0.5)", opacity: 0 },
                  { transform: "scale(1)", opacity: 1 }
                ], { duration: ms(step.stagger ? 700 : 450), delay: ms(step.stagger && forward ? (step.stagger[id] || 0) + 300 : 200), easing: "ease-out", fill: "backwards" })));
              }
            }
          });

          // Jetons qui disparaissent sans effet : fondu sur place
          Object.keys(old).forEach(function (id) {
            if (neu[id] || vanished[id]) return;
            var g = ghostOf(old[id]);
            anims.push(done(g.animate([
              { transform: "scale(1)", opacity: 1 },
              { transform: "scale(0.6)", opacity: 0 }
            ], { duration: ms(400), easing: "ease-in", fill: "forwards" })).then(function () { g.remove(); }));
          });

          return Promise.all(anims);
        });
      }

      // ---------- Navigation ----------

      var dotsTopEl = document.getElementById("dotsTop");
      var dotsBottomEl = document.getElementById("dotsBottom");

      function buildDots(demo) {
        dotsBottomEl.innerHTML = "";
        demo.steps.forEach(function (s) {
          var d = document.createElement("span");
          if (s.top) d.classList.add("anchor");
          dotsBottomEl.appendChild(d);
        });
        dotsTopEl.innerHTML = "";
        demo.steps.forEach(function (s) {
          if (!s.top) return;
          dotsTopEl.appendChild(document.createElement("span"));
        });
      }

      function updateDots(demo, to) {
        var bDots = dotsBottomEl.children;
        for (var i = 0; i < bDots.length; i++) {
          bDots[i].classList.toggle("done", i < to);
          bDots[i].classList.toggle("now", i === to);
        }
        var anchorIdx = -1, seen = 0;
        for (var j = 0; j <= to && j < demo.steps.length; j++) {
          if (demo.steps[j].top) { anchorIdx = seen; seen++; }
        }
        var tDots = dotsTopEl.children;
        for (var k = 0; k < tDots.length; k++) {
          tDots[k].classList.toggle("done", k < anchorIdx);
          tDots[k].classList.toggle("now", k === anchorIdx);
        }
      }

      function refreshUi() {
        var demo = DEMOS[demoIndex];
        var last = demo.steps.length - 1;
        // Jamais désactivées : ← au tout début boucle vers la fin, → à la
        // fin boucle vers le début — de quoi comparer départ/résultat en
        // aller-retour sans rester bloqué à un bout.
        if (demo.custom) return;
        prevBtn.disabled = busy;
        nextBtn.disabled = busy;
        nextBtn.textContent = cur === last ? "FIN" : "→";
        nextBtn.classList.toggle("text", cur === last);
        nextBtn.setAttribute("aria-label", cur === last ? "Revenir au début" : "Suivant");
        if (demo.split) updateDots(demo, cur);
      }

      function go(to) {
        var demo = DEMOS[demoIndex];
        if (busy || to < 0 || to >= demo.steps.length || to === cur) return;
        var forward = to === cur + 1;
        busy = true;
        cur = to;
        refreshUi();
        syncTop(true);
        transition(to, forward).then(function () {
          busy = false;
          refreshUi();
          // Démo parcourue jusqu'au bout en mode jeu, sans faute : une réussite
          var st = demo.steps;
          var lastExpr = st.length - 1;
          while (lastExpr > 0 && st[lastExpr].summary) lastExpr--;
          if (gameMode && to >= lastExpr && gameRun.demo === demo.title && !gameRun.counted) {
            gameRun.counted = true;
            if (gameRun.faults === 0) progressDemo(demo.title);
          }
          // Mode jeu : on enchaîne directement sur la question suivante,
          // sans passer par la flèche (s'il y en a une juste après)
          if (gameAuto) {
            gameAuto = false;
            if (gameMode && cur < demo.steps.length - 1) setTimeout(function () {
              if (!busy && !choiceEl && DEMOS[demoIndex] === demo && demo.steps === st && cur < st.length - 1) gameChoice(cur + 1);
            }, ms(500));
          }
        });
      }

      var holdResolve = null;
      function next() {
        if (holdResolve) { var r = holdResolve; holdResolve = null; nextBtn.disabled = true; r(); return; }
        if (DEMOS[demoIndex].custom) {
          // Singapour : la flèche lance la manche suivante, une fois le
          // résultat affiché
          if (DEMOS[demoIndex].custom === "pf") { if (pfState && pfState.ready) pfStart(); return; }
          if (DEMOS[demoIndex].custom === "ens") { if (ensState && ensState.ready) ensStart(); return; }
          if (DEMOS[demoIndex].custom === "calc") { calcStart(); return; }
          if (DEMOS[demoIndex].custom === "pas") { pasStart(); return; }
          if (DEMOS[demoIndex].custom === "fus") { if (fus.won) { fus.level = (fus.level + 1) % FUS_LEVELS.length; fusStart(); } return; }
          if (DEMOS[demoIndex].custom === "sol") { solIndex = (solIndex + 1) % SOL.length; solRender(false); return; }
          if (sgState && sgState.ready) sgStart();
          return;
        }
        var last = DEMOS[demoIndex].steps.length - 1;
        if (gameMode && cur < last && !busy && !choiceEl && gameChoice(cur + 1)) return;
        if (cur === last) {
          if (busy) return;
          gameRun = { demo: DEMOS[demoIndex].title, faults: 0, counted: false };
          renew(DEMOS[demoIndex]); buildDots(DEMOS[demoIndex]);
          cur = 0;
          build(DEMOS[demoIndex].steps[0]);
          refreshUi();
          syncTop(true);
        } else {
          go(cur + 1);
        }
      }

      // ---------- Bips (style oscilloscope) ----------
      // Sons courts synthétisés : fusion, juste, faux, badge. Débloqués au
      // premier geste (règle des navigateurs), coupables dans le menu.
      var soundOn = true;
      try { soundOn = localStorage.getItem("pasapas_sound") !== "0"; } catch (e) {}
      var actx = null;
      function bip(freq, dur, type, when, vol) {
        if (!soundOn) return;
        try {
          if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
          if (actx.state === "suspended") actx.resume();
          var t0 = actx.currentTime + (when || 0);
          var o = actx.createOscillator(), g = actx.createGain();
          o.type = type || "square";
          o.frequency.setValueAtTime(freq, t0);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.12));
          o.connect(g).connect(actx.destination);
          o.start(t0);
          o.stop(t0 + (dur || 0.12) + 0.02);
        } catch (e) {}
      }
      var SND = {
        meet: function () { bip(330, 0.09, "sine", 0, 0.08); bip(495, 0.12, "sine", 0.08, 0.06); },
        ok: function () { bip(660, 0.08); bip(990, 0.12, "square", 0.08); },
        // Même une erreur sonne doux : deux notes rondes (tierce majeure),
        // jamais de buzz — on essaie, on n'est pas puni
        bad: function () { bip(392, 0.16, "sine", 0, 0.06); bip(494, 0.22, "sine", 0.12, 0.05); },
        tick: function () { bip(1200, 0.03, "square", 0, 0.02); },
        badge: function () { [523, 659, 784, 1047].forEach(function (f, i) { bip(f, 0.14, "square", i * 0.1, 0.05); }); }
      };
      document.addEventListener("pointerdown", function () {
        if (soundOn && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      }, { once: true });

      // ---------- Mode jeu ----------
      // À chaque étape qui change l'écriture, deux propositions : la vraie
      // étape suivante et une fausse, fabriquée en changeant un signe ou un
      // nombre (le vérificateur garantit qu'elle est vraiment fausse). La
      // bonne réponse lance l'animation ; une erreur secoue la proposition
      // et montre la bonne.
      var gameMode = false;
      var gameRun = { demo: "", faults: 0, counted: true };
      var gameAuto = false; // après une réponse, la question suivante vient seule
      try { gameMode = localStorage.getItem("pasapas_game") === "1"; } catch (e) {}
      var choiceEl = null;

      function sameValue(txtA, txtB) {
        var envs = [{ x: 1.7, O: 2.3, Q: -0.9, a: 1.3, b: -2.2 }, { x: -3.1, O: 0.6, Q: 4.2, a: -0.7, b: 3.4 }];
        try {
          if (txtA.indexOf("=") >= 0 || txtB.indexOf("=") >= 0) {
            function root(t) {
              var sd = t.split("=");
              var f = function (x) { return evalExpr(sd[0], { x: x, O: 0, Q: 0, a: 0, b: 0 }) - evalExpr(sd[1], { x: x, O: 0, Q: 0, a: 0, b: 0 }); };
              var f0 = f(0), f1 = f(1);
              return Math.abs(f1 - f0) < 1e-12 ? NaN : -f0 / (f1 - f0);
            }
            return Math.abs(root(txtA) - root(txtB)) < 1e-9;
          }
          return envs.every(function (env) {
            var a = evalC(txtA, env), b = evalC(txtB, env);
            return Math.abs(a[0] - b[0]) < 1e-9 && Math.abs(a[1] - b[1]) < 1e-9;
          });
        } catch (e) { return false; }
      }

      function flatTokens(list, out) {
        list.forEach(function (it) {
          if (it.frac) { flatTokens(it.num, out); flatTokens(it.den, out); }
          else if (it.cancel) { flatTokens(it.top, out); flatTokens(it.bottom, out); if (it.eq) flatTokens(it.eq, out); }
          else out.push(it);
        });
        return out;
      }

      function makeWrong(step) {
        var copy = JSON.parse(JSON.stringify(step.expr));
        var toks = flatTokens(copy, []);
        var cands = [];
        toks.forEach(function (t) {
          if (t.t === "+" || t.t === "−") cands.push(function () { var o = t.t; t.t = o === "+" ? "−" : "+"; return function () { t.t = o; }; });
          var m = /^(\(?−?)(\d+)/.exec(t.t);
          if (m) cands.push(function () { var o = t.t; t.t = t.t.replace(/\d+/, String(Number(m[2]) + 1)); return function () { t.t = o; }; });
        });
        var good = exprText(step.expr);
        for (var n = 0; n < 12 && cands.length; n++) {
          var k = Math.floor(Math.random() * cands.length);
          var undo = cands[k]();
          var txt = exprText(copy);
          if (txt !== good && !sameValue(txt, good)) return { expr: copy };
          undo();
          cands.splice(k, 1);
        }
        return null;
      }

      function gameChoice(to) {
        var st = DEMOS[demoIndex].steps[to], here = DEMOS[demoIndex].steps[cur];
        if (!st || !here) return false;
        if (!st.expr || st.summary || !here.expr) return false;
        if (exprText(st.expr) === exprText(here.expr)) return false;
        var wrong = makeWrong(st);
        if (!wrong) return false;
        choiceEl = document.createElement("div");
        choiceEl.className = "choices";
        var opts = [{ step: st, ok: true }, { step: wrong, ok: false }];
        if (Math.random() < 0.5) opts.reverse();
        opts.forEach(function (o) {
          var b = document.createElement("button");
          b.className = "choice";
          b.dataset.ok = o.ok ? "1" : "0"; // pour les tests automatiques
          var e = buildExprEl(o.step, true);
          b.appendChild(e);
          b.addEventListener("click", function () {
            if (!choiceEl) return;
            if (o.ok) {
              SND.ok();
              b.classList.add("good");
              setTimeout(function () { closeChoice(); gameAuto = true; go(to); }, ms(350));
            } else {
              SND.bad();
              gameRun.faults++;
              b.classList.add("bad");
              b.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], { duration: ms(300) });
              choiceEl.querySelectorAll(".choice").forEach(function (c) { if (c !== b) c.classList.add("good"); });
              setTimeout(function () { closeChoice(); gameAuto = true; go(to); }, ms(1400));
            }
          });
          choiceEl.appendChild(b);
        });
        stageWrap.appendChild(choiceEl);
        choiceEl.querySelectorAll(".expr").forEach(function (e) { fitOneLine(e, e.parentNode); });
        choiceEl.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: ms(300) });
        return true;
      }

      function closeChoice() {
        if (choiceEl) { choiceEl.remove(); choiceEl = null; }
      }

      function prev() {
        closeChoice();
        if (DEMOS[demoIndex].custom === "pf") { pfUndo(); return; }
        if (DEMOS[demoIndex].custom === "fus") { fusStart(); return; }
        var demo = DEMOS[demoIndex];
        if (demo.custom) return;
        if (busy) return;
        if (cur === 0) {
          // Boucle vers la fin : voir le résultat, revenir au départ, sans
          // jamais rester coincé à une extrémité.
          go(demo.steps.length - 1);
        } else {
          go(cur - 1);
        }
      }

      function selectDemo(i) {
        if (busy) return;
        gameRun = { demo: DEMOS[i].title, faults: 0, counted: false };
        hideHome();
        if (i !== demoIndex) renew(DEMOS[i]);
        document.getElementById("title").textContent = tr(DEMOS[i].label || DEMOS[i].title);
        demoIndex = i;
        cur = 0;
        lastTopStep = null;
        tabsEl.querySelectorAll(".tab").forEach(function (t, k) {
          t.setAttribute("aria-selected", k === i ? "true" : "false");
        });
        closeChoice();
        try { localStorage.setItem("pasapas_demo", DEMOS[i].title); } catch (e) {}
        var custom = DEMOS[i].custom;
        sgEl.hidden = custom !== "sg";
        pfEl.hidden = custom !== "pf";
        ensEl.hidden = custom !== "ens";
        solEl.hidden = custom !== "sol";
        calcEl.hidden = custom !== "calc";
        fusEl.hidden = custom !== "fus";
        pasEl.hidden = custom !== "pas";
        if (custom !== "calc") calcRun++;
        stageWrap.hidden = !!custom;
        document.getElementById("controls").hidden = false;
        prevBtn.style.visibility = custom ? "hidden" : "";
        prevBtn.textContent = "←";
        if (custom === "sg") { sgStart(); return; }
        if (custom === "pf") { pfStart(); return; }
        if (custom === "ens") { ensStart(); return; }
        if (custom === "sol") { solStart(); return; }
        if (custom === "calc") { calcStart(); return; }
        if (custom === "fus") { fusStart(); return; }
        if (custom === "pas") { pasStart(); return; }
        buildDots(DEMOS[i]);
        build(DEMOS[i].steps[0]);
        refreshUi();
        syncTop(false);
      }

      DEMOS.forEach(function (d, i) {
        var b = document.createElement("button");
        b.className = "tab";
        b.setAttribute("role", "tab");
        b.textContent = tr(d.title);
        b.dataset.title = d.title;
        // Titre mathématique : pas de majuscules (a ≠ A)
        if (/[()²]/.test(d.title)) b.style.textTransform = "none";
        b.addEventListener("click", function () { selectDemo(i); });
        tabsEl.appendChild(b);
      });

      nextBtn.addEventListener("click", next);
      prevBtn.addEventListener("click", prev);

      document.addEventListener("keydown", function (e) {
        if (DEMOS[demoIndex].custom) {
          if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
          return;
        }
        if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
        if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      });

      // ---------- Badge « cadre de dix » ----------
      // Gagné dans le chapitre Singapour. Tant qu'on ne l'a pas, les
      // additions des autres démos se font sans jetons ; une fois gagné,
      // le cadre de dix réapparaît sous chaque addition pour rappeler
      // visuellement 7 + 5 = 5 + 2 + 5 = 10 + 2.

      var BADGE_KEY = "pasapas_badge_dix";
      var badgeChip = document.getElementById("badgeChip");

      function hasBadge() {
        try { return localStorage.getItem(BADGE_KEY) === "1"; } catch (e) { return false; }
      }

      function setBadge(on) {
        try {
          if (on) localStorage.setItem(BADGE_KEY, "1");
          else localStorage.removeItem(BADGE_KEY);
        } catch (e) {}
        badgeChip.hidden = !hasBadge();
      }

      document.getElementById("badgeReset").addEventListener("click", function () {
        closeMenu();
        setBadge(false);
        sgStreakN = 0;
        sgRenderStreak();
      });

      // ---------- Chapitre Singapour : défi « faire 10 » ----------
      // Programme MOE (P1) : addition dans 20 par « make ten » sur des
      // cadres de dix. Le premier nombre est déjà posé ; on glisse soi-même
      // les jetons du second. Règle : on remplit la dizaine avant d'en
      // commencer une autre — un jeton lâché dans le 2e cadre trop tôt
      // revient. 3 réussites de suite sans erreur = badge.

      var sgEl = document.getElementById("sg");
      var sgEq = document.getElementById("sgEq");
      var sgBoard = document.getElementById("sgBoard");
      var sgMsg = document.getElementById("sgMsg");
      var SG_CELL = 36; // recalculé à chaque manche selon la place disponible
      var sgStreakN = 0;
      var sgState = null;

      function sgRenderStreak() {
        var d = document.getElementById("sgStreak").children;
        for (var i = 0; i < d.length; i++) d[i].classList.toggle("on", i < sgStreakN);
      }

      function sgSlot(k) {
        var f = Math.floor(k / 10), r = Math.floor((k % 10) / 5), c = k % 5;
        var left = (sgBoard.clientWidth - 5 * SG_CELL) / 2;
        return { x: left + c * SG_CELL + SG_CELL / 2, y: 12 + f * (2 * SG_CELL + 14) + r * SG_CELL + SG_CELL / 2 };
      }

      function sgPlace(el, x, y, size) {
        var d = size || el._size || SG_CELL - 10;
        el.style.width = d + "px";
        el.style.height = d + "px";
        el.style.left = (x - d / 2) + "px";
        el.style.top = (y - d / 2) + "px";
      }

      // ---------- Défi : on « peint » avec le doigt ----------
      // Liberté totale : on peut retirer n'importe quel jeton, même ceux
      // posés au départ, et les ranger comme on veut. En glissant le doigt :
      // parti d'un jeton, on efface tout ce qu'on survole ; parti d'une case
      // vide, on remplit tout ce qu'on survole (avec les jetons de la
      // réserve). Un appui bref = une seule case. La manche se termine quand
      // le compte est bon ; le badge ne compte que les manches bien rangées
      // (la dizaine complétée d'abord), sans jamais rien bloquer.
      var sgRound = 0;
      function sgStart() {
        sgRound++;
        sgSetup(sgRound > 1 && sgRound % 2 === 0);
      }
      function sgStartSub() { sgSetup(true); }

      function range(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }

      function sgMove(dot, x, y, delay) {
        var r0 = dot.getBoundingClientRect();
        sgPlace(dot, x, y);
        var r1 = dot.getBoundingClientRect();
        var dx = r0.left + r0.width / 2 - (r1.left + r1.width / 2);
        var dy = r0.top + r0.height / 2 - (r1.top + r1.height / 2);
        var s0 = r0.width / (r1.width || 1);
        return done(dot.animate([
          { transform: "translate(" + dx + "px," + dy + "px) scale(" + s0 + ")" },
          { transform: "translate(0,0) scale(1)" }
        ], { duration: ms(420), delay: ms(delay || 0), easing: "cubic-bezier(.3,1.5,.5,1)", fill: "backwards" }));
      }

      function sgSetup(sub) {
        var a, b, u = 0;
        if (sub) { u = 1 + Math.floor(Math.random() * 7); a = 10 + u; b = u + 1 + Math.floor(Math.random() * (9 - u)); }
        else { a = 6 + Math.floor(Math.random() * 4); var bMin = 11 - a; b = bMin + Math.floor(Math.random() * (10 - bMin)); }
        sgState = { op: sub ? "-" : "+", a: a, b: b, u: u, cells: [], tray: [], done: false, mistake: false, auto: false };
        for (var i = 0; i < 20; i++) sgState.cells.push(null);
        sgBoard.innerHTML = "";
        SG_CELL = Math.max(20, Math.min(44, (sgBoard.clientHeight - 50) / 5, (sgBoard.clientWidth - 10) / 5));
        sgEq.textContent = a + (sub ? " − " : " + ") + b;
        sgMsg.textContent = "";
        nextBtn.disabled = true;
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
        sgRenderStreak();
        badgeChip.hidden = !hasBadge();
        for (var k = 0; k < 20; k++) {
          var sl = sgSlot(k), c = document.createElement("span");
          c.className = "sg-cell";
          c.style.left = (sl.x - SG_CELL / 2) + "px";
          c.style.top = (sl.y - SG_CELL / 2) + "px";
          c.style.width = SG_CELL + "px";
          c.style.height = SG_CELL + "px";
          sgBoard.appendChild(c);
        }
        function token() { var d = document.createElement("span"); d.className = "sg-dot"; sgBoard.appendChild(d); return d; }
        var start = sub ? range(10).concat(range(u).map(function (i) { return 10 + i; })) : range(a);
        start.forEach(function (k) { var d = token(); d.classList.add("given"); var sl = sgSlot(k); sgPlace(d, sl.x, sl.y); d.dataset.k = k; sgState.cells[k] = d; });
        if (!sub) for (var j = 0; j < b; j++) { var t = token(); t.classList.add("free"); sgState.tray.push(t); }
        sgLayoutTray(true);
      }

      // Réserve : rangée de jetons sous les cadres (addition : à poser ;
      // soustraction : ceux qu'on a retirés)
      function sgLayoutTray(instant) {
        var tr = sgState.tray, n = Math.max(tr.length, 1);
        var y = sgSlot(10).y + 2 * SG_CELL + 20;
        var gap = Math.min(SG_CELL, (sgBoard.clientWidth - 12) / Math.max(n, 5));
        var size = Math.min(SG_CELL - 10, gap - 5);
        var left = sgBoard.clientWidth / 2 - (tr.length - 1) * gap / 2;
        tr.forEach(function (d, j) {
          d._size = size;
          delete d.dataset.k;
          d.classList.toggle("out", sgState.op === "-");
          if (instant) sgPlace(d, left + j * gap, y); else sgMove(d, left + j * gap, y);
        });
      }

      function sgCellAt(x, y) {
        var best = -1, bd = SG_CELL * 0.62;
        for (var k = 0; k < 20; k++) {
          var sl = sgSlot(k), d = Math.hypot(sl.x - x, sl.y - y);
          if (d < bd) { bd = d; best = k; }
        }
        return best;
      }

      function sgErase(k) {
        var d = sgState.cells[k];
        if (!d) return false;
        sgState.cells[k] = null;
        sgState.tray.push(d);
        d.classList.remove("given");
        SND.tick();
        return true;
      }

      function sgFill(k) {
        if (sgState.cells[k] || !sgState.tray.length) return false;
        var d = sgState.tray.pop();
        sgState.cells[k] = d;
        d._size = 0;
        d.dataset.k = k;
        d.classList.remove("out");
        var sl = sgSlot(k);
        sgMove(d, sl.x, sl.y);
        SND.tick();
        return true;
      }

      function sgNextFree() {
        for (var k = 0; k < 20; k++) if (!sgState.cells[k]) return k;
        return -1;
      }

      // Peinture au doigt sur le plateau
      (function () {
        var mode = null, touched = {};
        sgBoard.addEventListener("pointerdown", function (e) {
          if (!sgState || sgState.done) return;
          e.preventDefault();
          try { sgBoard.setPointerCapture(e.pointerId); } catch (err) {}
          var r = sgBoard.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
          touched = {};
          var k = sgCellAt(x, y);
          if (k < 0) {
            // Appui sur la réserve : un jeton va dans la prochaine case libre
            if (y > sgSlot(19).y + SG_CELL / 2) { var f = sgNextFree(); if (f >= 0 && sgFill(f)) { sgLayoutTray(); } }
            mode = null;
            return;
          }
          mode = sgState.cells[k] ? "erase" : "fill";
          sgPaint(k);
        });
        sgBoard.addEventListener("pointermove", function (e) {
          if (!mode) return;
          var r = sgBoard.getBoundingClientRect();
          var k = sgCellAt(e.clientX - r.left, e.clientY - r.top);
          if (k >= 0) sgPaint(k);
        });
        function end() { if (mode !== null || true) { mode = null; sgCheck(); } }
        sgBoard.addEventListener("pointerup", end);
        sgBoard.addEventListener("pointercancel", end);
        function sgPaint(k) {
          if (touched[k]) return;
          touched[k] = true;
          var changed = mode === "erase" ? sgErase(k) : sgFill(k);
          if (changed) sgLayoutTray();
        }
      })();

      // La manche est finie quand le compte est bon
      function sgCheck() {
        if (!sgState || sgState.done) return;
        var inCells = sgState.cells.filter(Boolean).length;
        var f1 = sgState.cells.slice(0, 10).filter(Boolean).length, f2 = inCells - f1;
        if (sgState.op === "+") {
          if (sgState.tray.length) return;
          // Bien rangé : la 1re dizaine pleine avant la 2e
          sgState.mistake = !(f1 === Math.min(10, inCells));
          sgWin();
        } else {
          if (inCells !== sgState.a - sgState.b) return;
          // Bien fait : on a pris dans la dizaine, les jetons isolés restent
          sgState.mistake = f2 !== sgState.u;
          sgWinSub();
        }
      }

      function sgAutoFill() {
        if (!sgState || sgState.done) return;
        sgState.auto = true;
        var i = 0;
        (function step() {
          var f = sgNextFree();
          if (f < 0 || !sgState.tray.length) { sgLayoutTray(); setTimeout(sgCheck, ms(300)); return; }
          sgFill(f);
          sgLayoutTray();
          i++;
          setTimeout(step, ms(140));
        })();
      }

      function sgAutoRemove() {
        if (!sgState || sgState.done) return;
        sgState.auto = true;
        var left = (sgState.cells.filter(Boolean).length) - (sgState.a - sgState.b);
        var k = 9;
        (function step() {
          while (k >= 0 && !sgState.cells[k]) k--;
          if (left <= 0 || k < 0) { setTimeout(sgCheck, ms(300)); return; }
          sgErase(k);
          sgLayoutTray();
          left--;
          setTimeout(step, ms(140));
        })();
      }

      function sgWinSub() {
        sgState.done = true;
        var a = sgState.a, b = sgState.b, u = sgState.u;
        sgFinish(["10 − " + b + " + " + u, (10 - b) + " + " + u, a + " − " + b + " = " + (a - b)]);
      }

      // Boutons « Voir la solution » et « Règles », calés à gauche
      document.getElementById("sgSolve").addEventListener("click", function () {
        if (!sgState || sgState.done) return;
        if (sgState.op === "-") sgAutoRemove(); else sgAutoFill();
      });
      var sgRulesBox = document.getElementById("sgRulesBox");
      var SG_RULES = {
        fr: ["<b>Addition</b> — pose les jetons du 2e nombre dans les cases (appui bref ou glisser). Remplis d'abord la 1re dizaine, puis la 2e : c'est « faire 10 ».",
             "<b>Soustraction</b> — retire les jetons de la dizaine pleine, pas les jetons isolés : 13 − 5 = (10 − 5) + 3.",
             "Un jeton posé se retire d'un appui. 3 réussites de suite sans erreur : badge ✦ 10.",
             "<b>Voir la solution</b> : la manche est jouée pour toi et ne compte pas."],
        en: ["<b>Addition</b> — place the counters of the 2nd number in the boxes (tap or drag). Fill the first ten, then the second: “make 10”.",
             "<b>Subtraction</b> — take counters from the full ten, not the loose ones: 13 − 5 = (10 − 5) + 3.",
             "Tap a placed counter to remove it. 3 wins in a row without a mistake: ✦ 10 badge.",
             "<b>Show solution</b>: the round is played for you and does not count."]
      };
      document.getElementById("sgRules").addEventListener("click", function (e) {
        e.stopPropagation();
        if (!sgRulesBox.hidden) { sgRulesBox.hidden = true; return; }
        sgRulesBox.innerHTML = SG_RULES[LANG].map(function (t) { return "<p>" + t + "</p>"; }).join("");
        sgRulesBox.hidden = false;
      });
      document.addEventListener("pointerdown", function (e) {
        if (!sgRulesBox.hidden && !e.target.closest("#sgRulesBox, #sgRules")) sgRulesBox.hidden = true;
      });

      function sgWin() {
        sgState.done = true;
        var a = sgState.a, b = sgState.b, fill = 10 - a, rest = b - fill;
        var seq = [
          a + " + " + fill + " + " + rest,
          "10 + " + rest,
          a + " + " + b + " = " + (a + b)
        ];
        sgFinish(seq);
      }

      function sgFinish(seq) {
        var chain = wait(500);
        seq.forEach(function (txt) {
          chain = chain.then(function () {
            sgEq.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: ms(400) });
            sgEq.textContent = txt;
            return wait(1300);
          });
        });
        // Regroupement final : les jetons qui restent se tassent dans un
        // seul cadre, par colonnes de 2 — 4 forme un carré 2 × 2, 7 trois
        // paires et 1. Les jetons retirés et le cadre vide s'effacent.
        chain = chain.then(function () {
          var keep = [], gone = [];
          sgBoard.querySelectorAll(".sg-dot").forEach(function (d) {
            (d.classList.contains("out") ? gone : keep).push(d);
          });
          keep.sort(function (a, b) { return (Number(a.dataset.k) || 0) - (Number(b.dataset.k) || 0); });
          gone.forEach(function (d) {
            d.animate([{ opacity: 0.35 }, { opacity: 0, transform: "scale(0.4)" }], { duration: ms(500), fill: "forwards" });
          });
          var moves = keep.map(function (d, j) {
            var f = Math.floor(j / 10), r = j % 10;
            var k = f * 10 + (r % 2) * 5 + Math.floor(r / 2);
            var sl = sgSlot(k);
            d._size = 0;
            return sgMove(d, sl.x, sl.y, j * 60);
          });
          if (keep.length <= 10) {
            var cells = sgBoard.querySelectorAll(".sg-cell");
            for (var i = 10; i < cells.length; i++) {
              cells[i].animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(500), fill: "forwards" });
            }
          }
          return Promise.all(moves).then(function () { return wait(400); });
        });
        // Le résultat reste affiché : on voit ce qu'on a fait. La flèche
        // en bas à droite passe à la manche suivante.
        chain.then(function () {
          if (sgState.auto) { /* manche montrée : ni gagnée ni perdue */ }
          else if (!sgState.mistake) sgStreakN = Math.min(3, sgStreakN + 1);
          sgRenderStreak();
          if (sgStreakN >= 3) markDone("Singapour");
          if (sgStreakN >= 3 && !hasBadge()) {
            SND.badge();
            setBadge(true);
            sgMsg.textContent = "✦ 10";
            badgeChip.animate([{ transform: "scale(1.6)" }, { transform: "scale(1)" }], { duration: ms(700), easing: "ease-out" });
          }
          sgState.ready = true;
          nextBtn.disabled = false;
          nextBtn.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: ms(600) });
        });
      }

      badgeChip.hidden = !hasBadge();

      // ---------- Chapitre Premiers : arbre de facteurs ----------
      // On touche un nombre de l'arbre, puis un nombre premier : s'il le
      // divise, le nombre se sépare en deux branches (le premier et le
      // quotient). Les premiers sont entourés et s'arrêtent. À la fin, le
      // produit s'écrit — et il est le même quel que soit l'ordre choisi
      // (unicité de la décomposition).

      var pfEl = document.getElementById("pf");
      var pfEq = document.getElementById("pfEq");
      var pfBoard = document.getElementById("pfBoard");
      var pfPrimes = document.getElementById("pfPrimes");
      var PRIMES = [2, 3, 5, 7, 11, 13];
      var pfState = null;
      var PF_R = 19; // rayon d'un nœud (2.4rem / 2)

      function isPrime(n) {
        if (n < 2) return false;
        for (var d = 2; d * d <= n; d++) if (n % d === 0) return false;
        return true;
      }

      // Les diviseurs de 0 à 13. Les premiers sont vifs ; les autres sont
      // estompés, avec la raison : interdit (0), inutile (1), ou pas premier
      // (déjà un produit de premiers : 4 = 2 × 2…).
      var DIV_INFO = {
        0: "Interdit : on ne divise jamais par 0 dans ℕ, ℤ, ℚ, ℝ, ℂ. Possible seulement dans des ensembles prolongés : la droite projective ℝ ∪ {∞} ou la sphère de Riemann ℂ ∪ {∞}, où x ÷ 0 = ∞ pour x ≠ 0 (0 ÷ 0 reste indéfini).",
        1: "Inutile : n ÷ 1 = n.",
        2: "Se termine par un chiffre pair.",
        3: "Somme des chiffres dans la table de 3.",
        4: "Pas premier : 4 = 2 × 2.",
        5: "Se termine par 0 ou 5.",
        6: "Pas premier : 6 = 2 × 3.",
        7: "Reste − 2 × dernier chiffre dans la table de 7.",
        8: "Pas premier : 8 = 2 × 2 × 2.",
        9: "Pas premier : 9 = 3 × 3.",
        10: "Pas premier : 10 = 2 × 5.",
        11: "Somme alternée des chiffres (+ − + …) dans la table de 11.",
        12: "Pas premier : 12 = 2 × 2 × 3.",
        13: "Reste + 4 × dernier chiffre dans la table de 13."
      };
      var DIV_INFO_EN = {
        0: "Forbidden: never divide by 0 in ℕ, ℤ, ℚ, ℝ, ℂ. Only possible in extended sets: the projective line ℝ ∪ {∞} or the Riemann sphere ℂ ∪ {∞}, where x ÷ 0 = ∞ for x ≠ 0 (0 ÷ 0 stays undefined).",
        1: "Useless: n ÷ 1 = n.",
        2: "Ends in an even digit.",
        3: "Digit sum in the 3 times table.",
        4: "Not prime: 4 = 2 × 2.",
        5: "Ends in 0 or 5.",
        6: "Not prime: 6 = 2 × 3.",
        7: "Rest − 2 × last digit in the 7 times table.",
        8: "Not prime: 8 = 2 × 2 × 2.",
        9: "Not prime: 9 = 3 × 3.",
        10: "Not prime: 10 = 2 × 5.",
        11: "Alternating digit sum (+ − + …) in the 11 times table.",
        12: "Not prime: 12 = 2 × 2 × 3.",
        13: "Rest + 4 × last digit in the 13 times table."
      };
      var pfTip = document.getElementById("pfTip");
      function pfShowTip(d, btn, html) {
        if (html) pfTip.innerHTML = html;
        else pfTip.textContent = (LANG === "en" ? DIV_INFO_EN : DIV_INFO)[d];
        pfTip.hidden = false;
        var rb = btn.getBoundingClientRect(), rs = pfEl.getBoundingClientRect();
        pfTip.style.left = Math.max(4, Math.min(rs.width - pfTip.offsetWidth - 4, rb.left - rs.left + rb.width / 2 - pfTip.offsetWidth / 2)) + "px";
        // Au-dessus de toute la grille des diviseurs, jamais sur un bouton ;
        // s'il est grand, il remonte jusqu'en haut de l'écran
        var rg = pfPrimes.getBoundingClientRect();
        var headH = pfHead.getBoundingClientRect().height + 12;
        pfTip.style.top = Math.max(0, rg.top - rs.top - headH - pfTip.offsetHeight - 8) + "px";
        pfTip.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: ms(220), easing: "ease-out" });
      }
      function pfHideTip() { pfTip.hidden = true; }

      // Pourquoi n n'est pas divisible par p : la règle, faite sur n
      // La règle de divisibilité appliquée au nombre de l'exercice, avec
      // le verdict (✓ ou ✗) et, à la fin, la division écrite en entier.
      // La règle de divisibilité appliquée au nombre de l'exercice. Rendu
      // en trois parties séparées : la règle, puis l'exemple (une étape par
      // ligne), puis le verdict avec la division écrite en entier.
      function ruleOn(n, p) {
        var en = LANG === "en";
        var rule = (en ? DIV_INFO_EN : DIV_INFO)[p] || (en ? "Divide and look at the remainder." : "On divise et on regarde le reste.");
        var lines = [], ok = n % p === 0;
        function digits(x) { return String(Math.abs(x)).split("").map(Number); }
        function neg(v) { return String(v).replace("-", "−"); }
        if (p === 0 || p === 1) return pack(rule, [], "");
        if (!isPrime(p)) {
          var fs = [], m = p, dv = 2;
          while (m > 1) { while (m % dv === 0) { fs.push(dv); m /= dv; } dv++; }
          return pack(rule, [p + " = " + fs.join(" × "), en ? "Divide " + n + " by " + fs[0] + " instead." : "Divise plutôt " + n + " par " + fs[0] + "."], "");
        }
        if (p === 2 || p === 5) lines.push(n + (en ? " ends in " : " se termine par ") + (n % 10));
        else if (p === 3) {
          var x = n;
          while (x >= 10) { var d = digits(x), sm = d.reduce(function (a, c) { return a + c; }, 0); lines.push(d.join(" + ") + " = " + sm); x = sm; }
          lines.push(x + (x % 3 === 0 ? (en ? " is in the 3 times table" : " est dans la table de 3") : (en ? " is not in the 3 times table" : " n'est pas dans la table de 3")));
        } else if (p === 7 || p === 13) {
          var y = n, last = n;
          while (Math.abs(y) >= (p === 7 ? 70 : 130) || (lines.length === 0 && Math.abs(y) >= 10)) {
            var r = Math.floor(Math.abs(y) / 10), l = Math.abs(y) % 10;
            var v = p === 7 ? r - 2 * l : r + 4 * l;
            lines.push(Math.abs(y) + " → " + r + (p === 7 ? " − 2 × " : " + 4 × ") + l + " = " + neg(v));
            if (Math.abs(v) >= Math.abs(y)) break;
            y = v; last = v;
          }

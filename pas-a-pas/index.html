<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>Pas à Pas</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05100a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Oscilloscope / vieux moniteur — palette fixe, jamais d'ivoire ici
       (voir REGLES-JEUX.md : esthétique par défaut du catalogue) */
    :root {
      --bg: #05100a;
      --bg-soft: #0a1a12;
      --ink: #3be08a;
      --ink-soft: #2a8f5c;
      --hairline: #123322;
      --accent: #6dffb0;
      --accent-soft: rgba(61, 224, 138, 0.16);
      --sign: #ffd166;
    }

    * { box-sizing: border-box; }

    /* Comportement d'application : la page tient exactement dans l'écran,
       ne défile pas, ne rebondit pas, ne se tire pas vers le bas. */
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      margin: 0;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, var(--bg-soft), var(--bg) 60%);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: max(0.8rem, env(safe-area-inset-top)) 16px max(0.8rem, env(safe-area-inset-bottom));
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    main {
      width: 100%;
      max-width: 640px;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    header {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
      row-gap: 0.3rem;
    }

    .menu-btn {
      width: 2.1rem;
      height: 2.1rem;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      cursor: pointer;
    }

    .menu-btn:hover, .menu-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

    .menu-panel {
      position: absolute;
      top: 3rem;
      left: 0;
      z-index: 15;
      display: flex;
      flex-direction: column;
      min-width: 10rem;
      background: var(--bg);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      overflow: hidden;
    }

    .menu-item {
      display: block;
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: left;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--hairline);
      padding: 0.8rem 1rem;
      cursor: pointer;
    }

    .menu-item:last-child { border-bottom: none; }
    .menu-version { color: var(--ink-soft); font-size: 0.7rem; cursor: default; }

    /* Barre des ensembles, toujours visible : ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ */
    .univ {
      flex: none;
      display: flex;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }

    .univ button {
      flex: 1;
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.35rem 0;
      cursor: pointer;
    }

    .univ button.on { color: var(--ink); border-color: var(--ink-soft); background: var(--accent-soft); }
    .univ button.cur { color: var(--accent); border-color: var(--accent); }
    .menu-item:hover, .menu-item:focus-visible { color: var(--accent); }
    .menu-panel[hidden] { display: none; }

    .back {
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .back:hover { color: var(--accent); }

    .subline {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.3rem;
    }

    .hist-btn {
      font-family: inherit;
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .hist-btn:hover { color: var(--accent); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
      background: rgba(5, 16, 10, 0.95);
    }

    .overlay[hidden] { display: none; }

    .overlay .big {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 300;
      font-size: 1.8rem;
      color: var(--ink);
    }

    .hist-list {
      width: 100%;
      max-width: 22rem;
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
    }

    .hist-list li {
      padding: 0.7rem 0;
      border-top: 1px solid var(--hairline);
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--ink-soft);
    }

    .hist-list li:last-child { border-bottom: 1px solid var(--hairline); }

    .hist-list b {
      display: block;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 0.1rem;
    }

    .btn {
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
    }

    .btn:hover, .btn:focus-visible { background: var(--accent); color: var(--bg); }

    h1 {
      margin: 0;
      font-family: inherit;
      font-weight: 400;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      /* Sur la ligne des boutons ☰ ⌂ (… seulement si vraiment trop long) */
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0.7rem 0 0.2rem;
      flex: none;
    }

    .tab {
      font-family: inherit;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { border-color: var(--accent); color: var(--ink); }

    .stage-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: 0.6rem;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
    }

    .stage-top {
      position: relative;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex: none;
      min-height: 100px;
      padding: 1.4rem 0.5rem 0.6rem;
      overflow: hidden;
    }

    .stage-wrap.split .stage-top { display: flex; }

    .stage-divider {
      display: none;
      height: 1px;
      background: var(--hairline);
      margin: 0 1.2rem;
    }

    .stage-wrap.split .stage-divider { display: block; }

    /* Dernière étape : plus de séparateur entre les deux rangées — on
       montre directement départ = résultat, même objet, même fond. */
    .stage-wrap.final .stage-divider {
      background: none;
      height: auto;
      margin: 0.2rem 0;
      display: flex;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--accent);
    }
    .stage-wrap.final .stage-divider::after { content: attr(data-sign); }

    .stage-bottom {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.4rem 0.5rem;
      overflow: hidden;
    }

    .stage-wrap.split .stage {
      min-height: 130px;
      padding: 1.4rem 0.5rem 1.8rem;
    }

    .row-tag {
      position: absolute;
      top: 0.5rem;
      left: 0.7rem;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .stage-wrap.split .row-tag { opacity: 0.65; }

    .dots {
      display: none;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }

    .stage-wrap.split .dots { display: flex; }

    .dots span {
      width: 6px;
      height: 6px;
      border: 1px solid var(--hairline);
      background: transparent;
    }

    .dots span.done { background: var(--ink-soft); border-color: var(--ink-soft); }
    .dots span.now { background: var(--accent); border-color: var(--accent); }
    .dots span.anchor { border-color: var(--accent); }

    .magic {
      margin: 0;
      min-height: 2.4em;
      line-height: 1.35;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--ink-soft);
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .magic.show { opacity: 1; }

    .expr {
      display: flex;
      flex-wrap: nowrap;
      white-space: nowrap;
      align-items: center;
      justify-content: center;
      gap: 0.1em;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 3rem);
      line-height: 1;
      transform-origin: center center;
    }

    .tok {
      display: inline-block;
      padding: 0.08em 0.1em;
      border-radius: 0.2em;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .tok .in { display: inline-block; }
    .tok i { font-style: italic; }
    .tok.op { padding: 0.08em 0.22em; }
    .tok.par { font-weight: 300; }
    .tok.dot { padding: 0.08em 0.05em; }
    .tok.sup { font-size: 0.55em; align-self: flex-start; padding: 0; margin-left: -0.2em; }

    .tok.hl {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tok.sign-hl { color: var(--sign); }
    /* Même opération des deux côtés (balance) : un halo lumineux, gardé
       en examen — c'est l'opération elle-même, pas un indice */
    .tok.bal {
      color: var(--accent);
      text-shadow: 0 0 6px var(--accent), 0 0 14px rgba(255, 209, 102, 0.45);
      background: none;
    }

    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .frac .row {
      display: flex;
      align-items: center;
      gap: 0.05em;
      padding: 0.05em 0.2em;
    }

    .frac .bar {
      align-self: stretch;
      height: 2px;
      background: var(--ink);
      margin: 0.08em 0;
    }

    /* Soustraction posée : un terme au-dessus de son opposé, une barre,
       comme à l'école — avant de disparaître, on voit d'où vient le 0 */
    .cancel {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      margin: 0 0.12em;
    }

    .cancel .crow {
      display: flex;
      align-items: center;
      gap: 0.05em;
      padding: 0.02em 0.1em;
    }

    .cancel .ceq { margin-right: 0.3em; }

    .cancel .cbar {
      align-self: stretch;
      height: 2px;
      background: var(--ink);
      margin: 0.06em 0;
    }

    /* Droite des réels : une flèche de 0 vers la valeur. Multiplier par
       −1 la fait tourner d'un demi-tour autour de 0 (démo −×−). */
    .stage.has-line { align-items: flex-start; padding-top: 1rem; }

    .numsvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .nl-axis { stroke: var(--ink-soft); stroke-width: 1; }
    .nl-lab { fill: var(--ink-soft); font-size: 10px; text-anchor: middle; font-family: inherit; }
    .nl-deg { fill: var(--sign); font-size: 12px; text-anchor: middle; font-family: inherit; }
    .nl-trace { fill: none; stroke: var(--sign); stroke-width: 1.5; stroke-dasharray: 4 5; opacity: 0.55; }
    .nl-trace.live { opacity: 0.9; }
    .nl-vec line { stroke: var(--sign); stroke-width: 3; stroke-linecap: round; }
    .nl-vec path, .nl-vec circle { fill: var(--sign); }

    .numline {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 12px;
      height: 44px;
      pointer-events: none;
    }

    .numline .axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 14px;
      height: 1px;
      background: var(--ink-soft);
    }

    .numline .tick {
      position: absolute;
      top: 10px;
      width: 1px;
      height: 9px;
      background: var(--ink-soft);
    }

    .numline .lab {
      position: absolute;
      top: 24px;
      transform: translateX(-50%);
      font-size: 0.62rem;
      color: var(--ink-soft);
    }

    .numline .vec {
      position: absolute;
      left: 50%;
      top: 13px;
      height: 3px;
      background: var(--sign);
      transform-origin: 0 50%;
    }

    .numline .vec::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -5px;
      border-left: 9px solid var(--sign);
      border-top: 6.5px solid transparent;
      border-bottom: 6.5px solid transparent;
    }

    svg.arcs {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    svg.arcs path {
      fill: none;
      stroke: var(--sign);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .verify-warn {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 30;
      padding: 0.5rem 0.7rem;
      font-size: 0.7rem;
      color: #ff8a7a;
      border: 1px solid #ff8a7a;
      border-radius: 8px;
      background: rgba(20, 5, 5, 0.9);
    }

    /* Mode jeu : deux propositions pour l'étape suivante */
    .stage-wrap { position: relative; }

    .choices {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0.6rem;
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0 0.4rem;
    }

    .choice {
      display: flex;
      justify-content: center;
      overflow: hidden;
      padding: 0.5rem 0.4rem;
      background: var(--bg);
      border: 1px solid var(--ink-soft);
      border-radius: 12px;
      cursor: pointer;
      color: var(--ink);
    }

    .choice .expr { font-size: clamp(1.1rem, 5vw, 1.6rem); }
    .choice .frac { font-size: 0.8em; }
    .choice.good { border-color: var(--accent); background: var(--accent-soft); }
    .choice.bad { border-color: #ff8a7a; color: #ff8a7a; }

    .summary {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.35rem;
      transform-origin: center center;
    }

    .summary .expr { font-size: clamp(1.4rem, 6vw, 2.2rem); justify-content: flex-start; }
    .sum-row { display: flex; align-items: center; gap: 0.5rem; }

    .sum-eq {
      width: 1.2em;
      font-size: clamp(1.4rem, 6vw, 2.2rem);
      color: var(--accent);
      text-align: center;
    }

    .shape {
      width: 0.72em;
      height: 0.72em;
      vertical-align: -0.04em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
    }

    .ghost {
      position: absolute;
      margin: 0;
      pointer-events: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 3rem);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ghost.traveller { color: var(--sign); z-index: 3; }

    /* Méthode de Singapour : cadre de dix (2 × 5 cases), un jeton rond par unité.
       Tracé fin, jamais plein (charte oscilloscope). Négatif = jaune. */
    .cell {
      position: absolute;
      border: 1px solid var(--ink-soft);
      margin: 0 -1px -1px 0;
      pointer-events: none;
      z-index: 1;
    }

    .unit {
      position: absolute;
      border: 1.5px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .blocks-cap {
      position: absolute;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.95rem;
      color: var(--sign);
      pointer-events: none;
    }

    .blocks-dec { font-size: 0.8rem; color: var(--ink-soft); }

    .unit {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
    }

    .unit.neg { color: var(--sign); }
    .unit.neg {
      border-color: var(--sign);
      background: rgba(255, 209, 102, 0.12);
    }

    /* Deux lignes : les badges sur toute la largeur, les flèches dessous
       (plus de place pour les badges, qui passent à la ligne si besoin) */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      row-gap: 0.35rem;
      flex: none;
      margin-top: 0.4rem;
    }

    .arrow-btn {
      width: 3.2rem;
      height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease, opacity 0.25s ease;
    }

    .arrow-btn.text {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
    }

    .arrow-btn:hover:not(:disabled),
    .arrow-btn:focus-visible { border-color: var(--accent); color: var(--accent); }

    .arrow-btn:disabled { opacity: 0.3; cursor: default; }

    [hidden] { display: none !important; }

    /* Écrans bas (téléphone couché) : tout se resserre pour tenir */
    @media (max-height: 480px) {
      .stage-top { min-height: 0; padding: 0.9rem 0.5rem 0.2rem; gap: 0.2rem; }
      .stage-top .expr { font-size: 1.4rem; }
      .magic { min-height: 0; font-size: 0.75rem; }
      .stage, .stage-wrap.split .stage { min-height: 80px; padding: 0.8rem 0.5rem; }
      .expr, .ghost { font-size: clamp(1.3rem, 5vh, 2rem); }
      .controls { row-gap: 0.2rem; }
      .arrow-btn { width: 2.6rem; height: 2.6rem; }
    }

    .badge-shelf {
      order: -1;
      flex: 0 0 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem 0.5rem;
      min-height: 1.9rem;
    }
    .badge-shelf:not(:has(.badge:not([hidden]))) { visibility: hidden; }

    .badge {
      width: 1.9rem;
      height: 1.9rem;
      padding: 0;
      display: grid;
      place-items: center;
      background: none;
      cursor: pointer;
      touch-action: manipulation;
      border: 1px solid var(--ink-soft);
      border-radius: 50%;
    }
    /* Nom du badge qui monte au-dessus de lui quand il agit */
    .badge-float {
      position: fixed;
      z-index: 30;
      transform: translate(-50%, 0);
      white-space: nowrap;
      pointer-events: none;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      background: var(--bg, #050b08);
      transition: transform 1.2s ease-out, opacity 0.45s ease;
    }
    .badge-float.up { transform: translate(-50%, -26px); }
    .badge-float.no { color: var(--sign); border-color: var(--sign); white-space: normal; width: max-content; max-width: min(22rem, 86vw); text-align: center; border-radius: 1rem; }
    .badge-float.out { opacity: 0; }

    /* Badge utilisable à cette étape : il luit doucement */
    .badge.ready { border-color: var(--accent); box-shadow: 0 0 10px rgba(61, 224, 138, 0.45); }

    .badge svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.2;
      stroke-linecap: round;
    }

    /* Chapitre Singapour : défi « faire 10 » avec de vrais jetons à glisser */
    .sg {
      flex: 1;
      min-height: 0;
      margin-top: 0.6rem;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      padding: 1rem 0 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .sg-eq {
      min-height: 1.2em;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      line-height: 1.2;
      color: var(--ink);
    }

    .sg-board {
      position: relative;
      width: 100%;
      max-width: 360px;
      flex: 1;
      min-height: 0;
      touch-action: none;
    }

    .sg-cell {
      position: absolute;
      border: 1px solid var(--ink-soft);
      margin: 0 -1px -1px 0;
    }

    .sg-cell.warn { border-color: var(--sign); }

    .sg-dot {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--accent-soft);
      z-index: 2;
    }

    .sg-dot.given { border-color: var(--ink-soft); background: transparent; }
    .sg-dot.free { cursor: grab; touch-action: none; z-index: 3; }
    .sg-dot.drag { z-index: 5; transform: scale(1.15); }
    .sg-dot.out { opacity: 0.35; border-style: dashed; }

    .sg-actions { align-self: stretch; display: flex; gap: 0.5rem; justify-content: flex-start; }

    .sg-act {
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }

    .sg-act:hover { color: var(--accent); border-color: var(--accent); }

    .sg-rules {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 3rem;
      z-index: 12;
      padding: 0.8rem 1rem;
      font-size: 0.8rem;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
    }

    .sg-rules p { margin: 0.25rem 0; }
    #sg { position: relative; }

    .sg-streak { display: flex; gap: 0.4rem; }

    /* Accueil : les ensembles emboîtés, on touche une zone */
    .home {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    /* Les anneaux prennent toute la place libre et s'y centrent (autant de
       noir au-dessus qu'en dessous) ; les chapitres restent tout en bas */
    .home-map { width: 100%; max-width: 420px; flex: 1 1 0; min-height: 0; touch-action: none; }
    .home-map ellipse { fill: rgba(61, 224, 138, 0.04); stroke: var(--ink-soft); stroke-width: 1.2; cursor: pointer; }
    .home-map ellipse.sel { stroke: var(--accent); stroke-width: 2; fill: rgba(61, 224, 138, 0.1); }
    .home-map ellipse.lock { stroke-dasharray: 4 5; fill: transparent; }
    .home-map ellipse.done { stroke: var(--accent); }
    .home-map text { fill: var(--ink); font-family: inherit; font-size: 13px; pointer-events: none; text-anchor: middle; }
    .home-map text.lock { fill: var(--ink-soft); }
    .home-map text.big { font-size: 22px; }
    /* Zone du bas réservée, de hauteur fixe : quel que soit le texte ou le
       nombre de chapitres, les anneaux ne bougent pas */
    .home-info { margin: 0; font-size: 0.72rem; line-height: 1.4; color: var(--ink-soft); text-align: center; flex: none; height: 4.2em; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }

    .home-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      flex: none;
      width: 100%;
      height: 5.4rem;
      align-content: flex-start;
      overflow: hidden;
      padding-bottom: 0.4rem;
    }

    /* Chapitres : deux lignes au plus, les boutons se resserrent */
    .home-list button {
      flex: 1 1 28%;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: inherit;
      font-size: 0.66rem;
      letter-spacing: 0;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink-soft);
      border-radius: 999px;
      padding: 0.5rem 0.15rem;
      cursor: pointer;
    }

    .home-list button.done { border-color: var(--accent); color: var(--accent); }
    .home-list button:disabled { opacity: 0.35; cursor: default; }
    .home-list small { opacity: 0.7; margin-left: 0.35rem; }

    .power-unlock { z-index: 45; }
    .pu-title { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sign); }

    .pu-btn {
      font-family: inherit;
      font-size: 1.05rem;
      color: var(--sign);
      background: rgba(255, 209, 102, 0.08);
      border: 1.5px solid var(--sign);
      border-radius: 999px;
      padding: 0.9rem 1.4rem;
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.25);
      cursor: pointer;
    }

    .pu-desc { max-width: 20rem; margin: 0; font-size: 0.8rem; line-height: 1.55; color: var(--ink-soft); text-align: center; }

    /* Premiers : le nombre du haut se touche pour en saisir un autre */
    .pf-eq { cursor: pointer; }
    .pf-eq input {
      width: 6ch;
      font-family: inherit;
      font-size: max(16px, 1em);
      text-align: center;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--accent);
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(8.5rem + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 40;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      color: var(--bg);
      background: var(--accent);
      border-radius: 999px;
      pointer-events: none;
    }

    .univ button:disabled { opacity: 0.3; }
    .tabs { display: none !important; }

    /* Chapitre Pascal : triangle construit sous nos yeux, exploré au doigt */
    .pas-info { min-height: 5.4rem; display: flex; flex-direction: column; align-items: center; gap: 0.35rem; text-align: center; }
    .pas-info .l1 { font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    .pas-info .l2 { font-size: 0.85rem; color: var(--ink-soft); }
    .pas-info .l3 { font-size: 0.8rem; color: var(--ink-soft); }
    .pas-info .hot { color: var(--accent); }
    .pas-info .sym { color: var(--sign); }

    .binom { display: inline-flex; align-items: center; }
    .binom .par { font-size: 2.1em; font-weight: 300; line-height: 1; }
    .binom .stk { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; font-size: 0.85em; }

    .pas-board { position: relative; flex: 1; min-height: 0; width: 100%; touch-action: none; }

    .pas-cell {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1.5px solid var(--ink-soft);
      background: radial-gradient(circle at 35% 30%, rgba(109, 255, 176, 0.12), transparent 70%);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      pointer-events: none;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .pas-cell.sel { border-color: var(--accent); background: var(--accent); color: var(--bg); box-shadow: 0 0 14px rgba(109, 255, 176, 0.6); }
    .pas-cell.par { border-color: var(--accent); background: var(--accent-soft); }
    .pas-cell.sym { border-color: var(--sign); color: var(--sign); background: rgba(255, 209, 102, 0.1); }
    .pas-ghost { position: absolute; transform: translate(-50%, -50%); color: var(--accent); font-weight: 500; pointer-events: none; }

    /* Chapitre Fusion : on déplace des bulles, elles fusionnent */
    .fus-goal { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--ink-soft); text-align: center; }
    .fus-goal b { color: var(--ink); font-weight: 500; font-size: 1.1rem; letter-spacing: 0; }

    .fus-board {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      align-items: center;
      gap: 0.5rem 0.35rem;
      touch-action: none;
    }

    .fus-sep { font-size: 1.3rem; color: var(--ink-soft); }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.1em;
      padding: 0.45rem 0.85rem;
      font-size: clamp(1.2rem, 5.5vw, 1.6rem);
      font-weight: 500;
      color: var(--ink);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      background: radial-gradient(circle at 35% 30%, rgba(109, 255, 176, 0.22), rgba(61, 224, 138, 0.06) 70%);
      box-shadow: 0 0 12px rgba(61, 224, 138, 0.18);
      touch-action: none;
      cursor: grab;
    }

    .chip.sel { border-color: var(--sign); box-shadow: 0 0 14px rgba(255, 209, 102, 0.35); }
    .chip.drag { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) scale(1.12); }
    .chip.target { background: var(--accent-soft); transform: scale(1.08); }
    .chip.ghost-slot { opacity: 0.25; }
    .chip .fr {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.78em;
      line-height: 1.15;
    }

    .chip .fr > span:first-child { padding: 0 0.2em 0.05em; }
    .chip .fr > span:last-child { border-top: 2px solid currentColor; width: 100%; text-align: center; padding-top: 0.05em; }

    .fus-powers { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; min-height: 2.4rem; }

    .fus-powers button {
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--sign);
      background: transparent;
      border: 1px solid var(--sign);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
    }

    .fus-powers button:disabled { color: var(--ink-soft); border-color: var(--hairline); opacity: 0.6; }

    /* Chapitre Calcul : calcul mental animé en continu */
    .calc-eq {
      min-height: 1.3em;
      font-size: clamp(1.5rem, 7vw, 2.3rem);
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }

    .calc-scene { position: relative; width: 100%; max-width: 380px; flex: 1; min-height: 0; }

    .cm-rod {
      position: absolute;
      border: 1.5px solid var(--accent);
      border-radius: 3px;
      background:
        repeating-linear-gradient(180deg, transparent 0 calc(10% - 1px), var(--accent-soft) calc(10% - 1px) 10%);
    }

    .cm-dot {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      background: var(--accent-soft);
    }

    .cm-dot.b { border-color: var(--sign); background: rgba(255, 209, 102, 0.14); }
    .cm-dot.gone { opacity: 0; }

    /* Chapitre Solutions : la réponse dépend de l'ensemble choisi */
    #sol { justify-content: center; gap: 1.2rem; }
    .sol-q { font-size: clamp(1.8rem, 9vw, 2.8rem); font-weight: 500; }
    .sol-in { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
    .sol-a { font-size: clamp(1.6rem, 8vw, 2.4rem); color: var(--accent); min-height: 1.3em; text-align: center; }
    .sol-a.empty { color: var(--sign); }
    /* Chapitre Venn : deux cercles, une zone hachurée, son écriture */
    #venn { gap: 0.6rem; }
    .venn-q { margin: 0; font-size: 0.95rem; text-align: center; min-height: 2.6em; display: flex; align-items: center; justify-content: center; }
    .venn-q b { color: var(--accent); font-weight: 500; font-size: 1.6rem; margin-left: 0.4rem; }
    .venn-svg { width: 100%; max-width: 380px; flex: 1 1 0; min-height: 0; touch-action: manipulation; }
    .venn-svg .ring { fill: none; stroke: var(--ink); stroke-width: 1.4; }
    .venn-svg .univ-box { fill: none; stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 3 4; }
    .venn-svg text { fill: var(--ink); font-family: inherit; font-size: 15px; }
    .venn-svg text.u { fill: var(--ink-soft); font-size: 12px; }
    .venn-svg text.lab { font-size: 17px; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
    .venn-msg { min-height: 2.8em; margin: 0; }
    .venn-leg { margin: 0; min-height: 2.6em; font-size: 0.74rem; line-height: 1.35; color: var(--ink-soft); text-align: center; }
    .venn-opts { display: flex; flex-direction: column; gap: 0.45rem; width: 100%; min-height: 9rem; }
    .venn-opts button {
      font: inherit; font-size: 0.9rem; color: var(--ink); background: transparent; text-align: center;
      border: 1px solid var(--accent); border-radius: 999px; padding: 0.55rem 0.8rem; cursor: pointer; touch-action: manipulation;
    }
    .venn-opts button.good { background: var(--accent-soft); }
    .venn-opts button.bad { color: var(--sign); border-color: var(--sign); }

    /* Chapitre Regrouper : les termes se touchent, se glissent, se rangent */
    #reg { gap: 0.8rem; }
    .reg-row {
      flex: 1 1 0; min-height: 0; width: 100%;
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; align-content: center;
      gap: 0.15em; font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500;
      font-size: clamp(1.7rem, 8vw, 2.5rem);
    }
    /* Le signe voyage avec son terme mais reste hors du cadre : le cadre
       n'entoure que le terme ou la parenthèse */
    .rg-term { display: inline-flex; align-items: center; cursor: pointer; touch-action: none; }
    .rg-term .rg-sign { margin: 0 0.12em; }
    .rg-mark { margin: 0 0.05em; }
    .rg-box {
      display: inline-flex; align-items: center; gap: 0.06em; padding: 0.08em 0.14em;
      border: 1px solid transparent; border-radius: 0.3em;
    }
    .rg-term.sel .rg-box { border-color: var(--accent); background: var(--accent-soft); }
    .rg-term .rg-coef { padding: 0 0.04em; border-radius: 0.2em; }
    .rg-term .rg-coef.sel { background: var(--accent); color: var(--bg); }
    .rg-term.group .rg-box { border-color: var(--ink-soft); }
    .rg-term.group.sel .rg-box { border-color: var(--accent); }

    /* Chapitre Exp / ln : une expression, trois réponses, le geste */
    #expl { gap: 0.7rem; }
    .expl-f { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; text-align: center;
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: clamp(1.4rem, 7vw, 2.1rem); line-height: 1.5; }
    .expl-f sup, .venn-opts sup { font-size: 0.62em; }
    .expl-why { min-height: 4.2em; }

    /* Chapitre Structures : un cercle (E, loi), ses propriétés dedans */
    #str { gap: 0.5rem; }
    .str-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem; width: 100%; min-height: 6.4rem; align-content: flex-start; }
    .str-chips button {
      font: inherit; font-size: 0.8rem; color: var(--ink); background: transparent;
      border: 1px solid var(--ink-soft); border-radius: 999px; padding: 0.45rem 0.7rem; cursor: pointer; touch-action: manipulation;
    }
    .str-chips button.on { border-color: var(--accent); background: var(--accent-soft); }
    .str-chips button.go { border-color: var(--sign); color: var(--sign); flex-basis: 100%; }
    .str-chips button.good { border-color: var(--accent); background: var(--accent-soft); }
    .str-chips button.bad { color: var(--sign); border-color: var(--sign); }
    .venn-svg .prop { font-size: 12.5px; }
    .venn-svg .prop.no { fill: var(--sign); }

    .sol-ask { font-size: 0.95rem; color: var(--ink); text-align: center; }
    .sol-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; min-height: 2.8rem; }
    .sol-btns button {
      font: inherit; font-size: 1rem; color: var(--ink); background: transparent;
      border: 1px solid var(--accent); border-radius: 999px; padding: 0.5rem 1.1rem; min-width: 3.2rem;
      cursor: pointer; touch-action: manipulation;
    }
    .sol-btns button.good { background: var(--accent-soft); border-color: var(--accent); }
    .sol-btns button.bad { color: var(--sign); border-color: var(--sign); }

    /* Chapitre Ensembles : ranger un nombre dans un ensemble */
    #ens { position: relative; justify-content: space-between; }
    .ens-top { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }

    .ens-num {
      display: inline-block;
      padding: 0.4rem 1.1rem;
      font-size: clamp(1.8rem, 9vw, 2.8rem);
      font-weight: 500;
      color: var(--ink);
      border: 1px solid var(--accent);
      border-radius: 14px;
      background: var(--accent-soft);
      touch-action: none;
      cursor: grab;
    }

    .ens-num.drag { position: fixed; z-index: 20; transform: translate(-50%, -50%) scale(1.05); pointer-events: none; }
    .ens-rows { width: 100%; display: flex; flex-direction: column; gap: 0.45rem; }
    .ens-row { display: flex; gap: 0.35rem; justify-content: center; }

    .ens-box {
      flex: 1;
      max-width: 4.2rem;
      height: 3.2rem;
      font-family: inherit;
      font-size: 1.25rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink-soft);
      border-radius: 10px;
      cursor: pointer;
      touch-action: none;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    .ens-row + .ens-row .ens-box { font-size: 1rem; border-style: dashed; }
    .ens-box.hover { background: var(--accent-soft); }
    .ens-box sup, #ensMsg sup, #ensTip sup { font-size: 0.6em; vertical-align: super; margin-left: 0.05em; }
    .ens-box.in { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); border-style: solid; }
    .ens-box.bad { border-color: var(--sign); color: var(--sign); }
    .ens-score { font-size: 0.75rem; color: var(--ink-soft); letter-spacing: 0.1em; min-height: 1em; }

    /* Chapitre Premiers : arbre de facteurs */
    .pf-eq { font-size: clamp(1.4rem, 6.5vw, 2.2rem); text-align: center; }

    .pf-board svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pf-board line { stroke: var(--ink-soft); stroke-width: 1.5; }

    /* Chaque nombre de l'arbre est une bulle ronde, le nombre au centre */
    .pf-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 1.15rem;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      border: 1.5px solid var(--ink-soft);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(109, 255, 176, 0.14), transparent 70%);
      cursor: pointer;
    }

    .pf-node.split { opacity: 0.55; cursor: default; }
    .pf-node.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 12px rgba(61, 224, 138, 0.3); }
    .pf-node.prime { color: var(--sign); border-color: var(--sign); background: radial-gradient(circle at 35% 30%, rgba(255, 209, 102, 0.14), transparent 70%); cursor: default; }

    .pf-morph {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 3;
      white-space: nowrap;
      font-weight: 500;
      font-size: 1.15rem;
      color: var(--accent);
      pointer-events: none;
    }

    /* Au-dessus des diviseurs : le nombre en cours, écrit des trois façons
       (fraction, barre oblique, ÷), avec la case du diviseur qui respire */
    .pf-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      align-self: stretch;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .pf-wheel {
      display: flex;
      align-self: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-x;
      padding: 0.2rem 0;
    }

    .pf-wheel::-webkit-scrollbar { display: none; }

    .pf-item {
      flex: 0 0 46%;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;
      font-size: clamp(1.3rem, 6.2vw, 1.8rem);
      white-space: nowrap;
      transition: opacity 0.1s linear;
    }

    .pf-item:first-child { margin-left: 27%; }
    .pf-item:last-child { margin-right: 27%; }

    .potence { display: inline-flex; align-items: flex-start; }
    .potence .dvd { padding: 0.1em 0.4em 0.9em 0; }
    .potence .dvs { padding: 0.1em 0.2em 0.35em 0.4em; border-left: 2px solid var(--ink-soft); border-bottom: 2px solid var(--ink-soft); }

    .pf-dots { display: flex; justify-content: center; gap: 0.35rem; }
    .pf-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--hairline); }
    .pf-dots span.on { background: var(--accent); }
    .pf-head .n { display: inline-flex; align-items: center; gap: 0.2rem; }
    .pf-head .eqs { color: var(--ink-soft); margin: 0 0.1rem; }
    .pf-head.drop { outline: 1.5px dashed var(--accent); outline-offset: 6px; border-radius: 10px; }
    .pf-head sup { font-size: 0.65em; margin-left: -0.15rem; align-self: flex-start; }
    .pf-head .op { color: var(--ink-soft); }

    .pf-head .fracv { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; }
    .pf-head .fracv .bar { align-self: stretch; height: 2px; background: var(--ink-soft); }

    /* Case du diviseur : zone pleine qui luit comme un écran de phosphore,
       s'allume puis s'éteint lentement (rémanence) */
    .pf-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75em;
      height: 1.75em;
      padding: 0;
      font-size: 0.9em;
      font-weight: 500;
      border-radius: 50%;
      color: var(--bg);
      background: var(--ink);
      animation: phosphor 2.6s ease-out infinite;
    }

    .pf-slot.ok { color: var(--bg); background: var(--accent); box-shadow: 0 0 14px rgba(109, 255, 176, 0.7); animation: none; }
    .pf-slot.no { color: var(--bg); background: var(--sign); box-shadow: 0 0 14px rgba(255, 209, 102, 0.6); animation: none; }

    @keyframes phosphor {
      0% { opacity: 0.95; box-shadow: 0 0 16px rgba(61, 224, 138, 0.8); }
      12% { opacity: 1; box-shadow: 0 0 22px rgba(109, 255, 176, 0.9); }
      100% { opacity: 0.18; box-shadow: 0 0 2px rgba(61, 224, 138, 0.1); }
    }

    @media (prefers-reduced-motion: reduce) { .pf-slot { animation: none; } }

    .pf-primes {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.35rem;
      width: 100%;
      max-width: 400px;
    }

    #pf { position: relative; }

    .pf-tip {
      position: absolute;
      z-index: 10;
      max-width: min(20rem, 92%);
      padding: 0.6rem 0.8rem;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .pf-tip[hidden] { display: none; }

    /* Explication : grand panneau, écrit gros et aéré, qui peut couvrir
       l'arbre (il disparaît au prochain toucher) */
    #pfTip {
      left: 0 !important;
      right: 0;
      max-width: none;
      padding: 1.5rem 1.4rem;
      font-size: 1.02rem;
      border-radius: 16px;
      background: var(--bg);
    }
    .tip-rule { color: var(--ink); font-size: 1.08rem; line-height: 1.6; }
    .tip-ex {
      margin-top: 1.3rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--hairline);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      font-size: clamp(1.1rem, 5vw, 1.35rem);
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    .tip-v { margin-top: 1.3rem; font-size: clamp(1.2rem, 5.6vw, 1.5rem); font-weight: 500; }
    .tip-v.ok { color: var(--accent); }
    .tip-v.no { color: var(--sign); }

    .pf-primes button {
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hairline);
      /* Cercle parfait : même largeur et même hauteur */
      border-radius: 50%;
      width: min(100%, 2.8rem);
      aspect-ratio: 1 / 1;
      height: auto;
      justify-self: center;
      padding: 0;
      cursor: pointer;
      border-color: var(--accent);
      font-size: 0.85rem;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    .pf-primes button.can {
      color: var(--bg);
      background: var(--ink);
      border-color: var(--ink);
      font-weight: 500;
      box-shadow: 0 0 10px rgba(61, 224, 138, 0.35);
    }

    .pf-primes button.drag-clone { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) scale(1.15); width: 2.8rem; }

    .pf-isprime {
      align-self: stretch;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sign);
      background: transparent;
      border: 1.5px solid var(--sign);
      border-radius: 999px;
      padding: 0.55rem;
      cursor: pointer;
    }

    .pf-primes button.dim {
      color: var(--ink-soft);
      border-color: var(--hairline);
      opacity: 0.45;
    }

    .pf-primes button:disabled { opacity: 0.3; }

    /* Mode examen : plus aucune aide visible */
    /* Sous le titre, à gauche : le titre garde toute la première ligne */
    .exam-btn {
      flex: none;
      order: 10;
      margin-left: calc(2 * 2.1rem + 1.6rem);
      font: inherit;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--ink-soft);
      background: none;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.35rem 0.6rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      touch-action: manipulation;
    }
    .exam-btn.on { color: var(--sign); border-color: var(--sign); }
    .exam-btn.passed { color: var(--accent); border-color: var(--accent); }
    /* Examen : on ne montre plus quels premiers divisent ; mais 0, 1, 4,
       6… (pas premiers) restent grisés : ce n'est pas un indice */
    body.exam .pf-primes button.can {
      color: var(--ink); background: transparent; border-color: var(--accent);
      box-shadow: none; opacity: 1; font-weight: 400;
    }
    /* Les badges restent en examen : ce sont des capacités gagnées, pas
       des indices */

    .sg-streak span {
      width: 10px;
      height: 10px;
      border: 1px solid var(--hairline);
    }

    .sg-streak span.on { background: var(--accent); border-color: var(--accent); }

    .sg-msg {
      margin: 0;
      min-height: 1.4em;
      font-size: 0.8rem;
      text-align: center;
      color: var(--ink-soft);
    }
  </style>

  <script>
    (function () {
      // Réussites sans faute pour valider un chapitre (et gagner son badge)
      var WIN = 1;

      // ---------- Données ----------
      // Un jeton : { id, t: contenu HTML, k: classe, from: ids d'origine }
      // Une fraction : { frac: true, num: [jetons], den: [jetons] }
      // fx : animation jouée en arrivant sur l'étape (en avançant seulement)

      function T(id, t, k, from) { return { id: id, t: t, k: k || "", from: from || null }; }
      function F(num, den) { return { frac: true, num: num, den: den }; }
      function V(top, bottom, eq) { return { cancel: true, top: top, bottom: bottom, eq: eq || null }; }

      var X = "<i>x</i>";
      // ---------- Réflexes (feuille de route techniques-td.md) ----------
      var Y = "<i>y</i>";
      function op(id, t) { return T(id, t, "op"); }
      // Comparer A et B : on étudie B − A. x² + k² contre 2kx → (x − k)² ≥ 0
      function cmpDiff(k) {
        var A = (2 * k) + X, K2 = String(k * k);
        return [
          { top: true, expr: [T("A", A), op("q", "?"), T("B1", X + "²"), op("p", "+"), T("B2", K2)],
            magic: "« Comparer, c'est étudier le signe de la différence. »",
            note: "Qui est le plus grand : " + (2 * k) + "<i>x</i> ou <i>x</i>² + " + K2 + " ? Réflexe : on étudie B − A." },
          { fresh: true, expr: [T("B1", X + "²"), op("p", "+"), T("B2", K2), op("m", "−"), T("A", A)], hl: ["m", "A"],
            note: "B − A : tout d'un côté, on compare à 0." },
          { expr: [T("B1", X + "²"), op("m", "−"), T("A", A), op("p", "+"), T("B2", K2)], note: "On range par puissances de <i>x</i>." },
          { expr: [T("l", "(", "par"), T("x", X, "", ["B1"]), op("m", "−"), T("k", String(k), "", ["A", "B2"]), T("r", ")", "par"), T("sq", "2", "sup")],
            note: "Identité remarquable : <i>x</i>² − " + (2 * k) + "<i>x</i> + " + K2 + " = (<i>x</i> − " + k + ")²." },
          { expr: [T("l", "(", "par"), T("x", X), op("m", "−"), T("k", String(k)), T("r", ")", "par"), T("sq", "2", "sup"), op("ge", "≥"), T("z", "0")],
            hl: ["ge", "z"], note: "Un carré est toujours ≥ 0." },
          { top: true, expr: [T("B1", X + "²"), op("p", "+"), T("B2", K2), op("ge", "≥"), T("A", A)],
            note: "Donc <i>x</i>² + " + K2 + " ≥ " + (2 * k) + "<i>x</i> pour tout <i>x</i> — égalité seulement en <i>x</i> = " + k + "." }
        ];
      }
      // Deux positifs : on compare leurs carrés. √a + √b ? √c + √d, a + b = c + d
      function sqCmp(a, b, c, d) {
        var S = a + b, P1 = a * b, P2 = c * d, sg = P1 > P2 ? ">" : "<";
        var L = function (id, u, v) { return [T(id + "1", "√" + u), op(id + "p", "+"), T(id + "2", "√" + v)]; };
        return [
          { top: true, expr: L("a", a, b).concat([op("q", "?")], L("c", c, d)),
            magic: "« Deux positifs sont rangés comme leurs carrés. »", note: "Les deux côtés sont positifs : on peut comparer leurs carrés, l'ordre ne change pas." },
          { expr: [T("l1", "(", "par")].concat(L("a", a, b), [T("r1", ")", "par"), T("s1", "2", "sup"), op("q", "?"), T("l2", "(", "par")], L("c", c, d), [T("r2", ")", "par"), T("s2", "2", "sup")]),
            note: "On élève au carré de chaque côté." },
          { expr: [T("u", a + " + " + b), op("p1", "+"), T("w1", "2√" + P1), op("q", "?"), T("v", c + " + " + d), op("p2", "+"), T("w2", "2√" + P2)],
            note: "(√u + √v)² = u + v + 2√(uv)." },
          { expr: [T("u", String(S)), op("p1", "+"), T("w1", "2√" + P1), op("q", "?"), T("v", String(S)), op("p2", "+"), T("w2", "2√" + P2)], hl: ["u", "v"],
            note: a + " + " + b + " = " + c + " + " + d + " = " + S + " : la même chose des deux côtés." },
          { expr: [T("w1", "√" + P1), op("q", "?"), T("w2", "√" + P2)], note: "On retire " + S + " des deux côtés, puis on divise par 2 : l'ordre ne change pas." },
          { expr: [T("w1", String(P1)), op("q", sg), T("w2", String(P2))], hl: ["q"], note: P1 + (sg === ">" ? " > " : " < ") + P2 + ", et la racine garde l'ordre." },
          { top: true, expr: L("a", a, b).concat([op("q", sg)], L("c", c, d)), note: "En remontant : √" + a + " + √" + b + (sg === ">" ? " > " : " < ") + "√" + c + " + √" + d + "." }
        ];
      }
      // Inégalité avec x au dénominateur : tout d'un côté, même dénominateur, signes
      function signSide(p) {
        var P = String(p), P2 = String(2 * p);
        var xp = function (id) { return [T(id + "x", X), op(id + "m", "−"), T(id + "p", P)]; };

      // Passage courant de chaque chapitre (mémorisé) : on avance d'un cran

      // ---------- Vérification des calculs ----------

      function verifyDemos() {

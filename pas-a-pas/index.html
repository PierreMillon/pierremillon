      function pasGeom() {
        var W = pasBoard.clientWidth, H = pasBoard.clientHeight;
        var cell = Math.max(24, Math.min(46, W / (PAS_N + 1.4), (H - 10) / (PAS_N + 1) * 1.05));
        var dy = Math.min(cell * 1.02, (H - cell) / PAS_N);
        return { W: W, cell: cell, dy: dy, top: cell / 2 + 2 };
      }
      function pasPos(n, k, g) { return { x: g.W / 2 + (k - n / 2) * g.cell * 1.02, y: g.top + n * g.dy }; }
      function pasStart() {
        pas.run++;
        pas.built = false;
        pas.sel = null;
        pasBoard.innerHTML = "";
        pas.cells = [];
        nextBtn.disabled = true;
        prevBtn.style.visibility = "hidden";
        pasInfo.innerHTML = '<div class="l2">' + (LANG === "en" ? "Each number is the sum of the two above it." : "Chaque nombre est la somme des deux au-dessus.") + "</div>";
        var g = pasGeom(), run = pas.run;
        for (var n = 0; n <= PAS_N; n++) {
          pas.cells[n] = [];
          for (var k = 0; k <= n; k++) {
            var p = pasPos(n, k, g), e = document.createElement("div");
            e.className = "pas-cell";
            e.style.left = p.x + "px"; e.style.top = p.y + "px";
            e.style.width = e.style.height = g.cell * 0.92 + "px";
            e.style.fontSize = Math.max(10, g.cell * (C(n, k) > 9 ? 0.36 : 0.44)) + "px";
            e.textContent = C(n, k);
            e.style.opacity = 0;
            pasBoard.appendChild(e);
            pas.cells[n][k] = e;
          }
        }
        // Construction ligne par ligne
        var chain = wait(300);
        for (var nn = 0; nn <= PAS_N; nn++) (function (n) {
          chain = chain.then(function () {
            if (run !== pas.run) return;
            var anims = [];
            for (var k = 0; k <= n; k++) (function (k) {
              var e = pas.cells[n][k], p = pasPos(n, k, g);
              if (k === 0 || k === n) {
                e.style.opacity = 1;
                anims.push(done(e.animate([{ transform: "translate(-50%,-50%) scale(0.3)", opacity: 0 }, { transform: "translate(-50%,-50%) scale(1)", opacity: 1 }], { duration: ms(400), easing: "ease-out" })));
                return;
              }
              // Les deux parents envoient leur valeur, qui fusionne en bas
              [k - 1, k].forEach(function (pk) {
                var pp = pasPos(n - 1, pk, g), gh = document.createElement("span");
                gh.className = "pas-ghost";
                gh.textContent = C(n - 1, pk);
                gh.style.left = pp.x + "px"; gh.style.top = pp.y + "px";
                gh.style.fontSize = e.style.fontSize;
                pasBoard.appendChild(gh);
                anims.push(done(gh.animate([{ left: pp.x + "px", top: pp.y + "px", opacity: 1 }, { left: p.x + "px", top: p.y + "px", opacity: 0.2 }],
                  { duration: ms(700), easing: "cubic-bezier(.45,0,.3,1)", fill: "forwards" })).then(function () { gh.remove(); }));
              });
              setTimeout(function () {
                if (run !== pas.run) return;
                e.style.opacity = 1;
                e.animate([{ transform: "translate(-50%,-50%) scale(0.4)" }, { transform: "translate(-50%,-50%) scale(1.15)", offset: 0.7 }, { transform: "translate(-50%,-50%) scale(1)" }], { duration: ms(450), easing: "ease-out" });
              }, ms(620));
            })(k);
            SND.tick();
            return Promise.all(anims).then(function () { return wait(n < 3 ? 350 : 150); });
          });
        })(nn);
        chain.then(function () {
          if (run !== pas.run) return;
          pas.built = true;
          SND.ok();
          pasInfo.innerHTML = '<div class="l2">' + (LANG === "en" ? "Slide your finger over the triangle." : "Glisse le doigt sur le triangle.") + "</div>";
          nextBtn.disabled = false;
        });
      }
      function pasPick(ev) {
        if (!pas.built) return;
        var r = pasBoard.getBoundingClientRect(), g = pasGeom();
        var x = ev.clientX - r.left, y = ev.clientY - r.top;
        var n = Math.max(0, Math.min(PAS_N, Math.round((y - g.top) / g.dy)));
        var k = Math.max(0, Math.min(n, Math.round((x - g.W / 2) / (g.cell * 1.02) + n / 2)));
        if (pas.sel && pas.sel[0] === n && pas.sel[1] === k) return;
        pas.sel = [n, k];
        SND.tick();
        pasShow(n, k);
      }
      function pasShow(n, k) {
        pas.cells.forEach(function (row) { row.forEach(function (e) { e.classList.remove("sel", "par", "sym"); }); });
        pas.cells[n][k].classList.add("sel");
        if (n > 0 && k > 0) pas.cells[n - 1][k - 1].classList.add("par");
        if (n > 0 && k < n) pas.cells[n - 1][k].classList.add("par");
        if (n - k !== k) pas.cells[n][n - k].classList.add("sym");
        var v = C(n, k), en = LANG === "en";
        var l1 = binomHTML(n, k) + " = <span>" + n + "! / (" + k + "! · " + (n - k) + "!)</span> = <b class='hot'>" + v + "</b>";
        var l2 = (n > 0 && k > 0 && k < n ? '<span class="hot">' + C(n - 1, k - 1) + " + " + C(n - 1, k) + " = " + v + "</span> &nbsp; " : "") +
          (n - k !== k ? '<span class="sym">= ' + binomHTML(n, n - k) + (en ? " symmetry" : " symétrie") + "</span>" : '<span class="sym">' + (en ? "middle: its own mirror" : "au milieu : son propre symétrique") + "</span>");
        var l3 = "";
        if (n <= 4) {
          var terms = [];
          for (var j = 0; j <= n; j++) {
            var c = C(n, j), ea = n - j, eb = j;
            var t = (c > 1 ? c + "·" : "") + (ea ? "a" + (ea > 1 ? "<sup>" + ea + "</sup>" : "") : "") + (eb ? "b" + (eb > 1 ? "<sup>" + eb + "</sup>" : "") : "");
            terms.push(j === k ? '<b class="hot">' + t + "</b>" : t);
          }
          l3 = "(a + b)<sup>" + n + "</sup> = " + terms.join(" + ");
        } else {
          l3 = (en ? "Row sum: " : "Somme de la ligne : ") + "2<sup>" + n + "</sup> = " + Math.pow(2, n);
        }
        pasInfo.innerHTML = '<div class="l1">' + l1 + '</div><div class="l2">' + l2 + '</div><div class="l3">' + l3 + "</div>";
        pas.seen[n + "," + k] = true;
        if (Object.keys(pas.seen).length >= 8) markDone("Pascal");
      }
      pasBoard.addEventListener("pointerdown", function (ev) { ev.preventDefault(); pas.drag = true; try { pasBoard.setPointerCapture(ev.pointerId); } catch (e) {} pasPick(ev); });
      pasBoard.addEventListener("pointermove", function (ev) { if (pas.drag) pasPick(ev); });
      ["pointerup", "pointercancel"].forEach(function (t) { pasBoard.addEventListener(t, function () { pas.drag = false; }); });
      document.getElementById("pasBuild").addEventListener("click", pasStart);

      // ---------- Chapitre Fusion ----------
      // Les termes sont des bulles. On en lâche une sur une autre : si une
      // règle le permet, elles fusionnent en une forme plus simple.
      //   a + a → 2·a          (même lettre : on additionne les nombres)
      //   2·a + 2·b → 2·(a + b) (même nombre devant : on le met en facteur)
      //   3·x + (−3·x) → 0      (opposés : la bulle disparaît)
      //   p/c + q/c → (p + q)/c (même dénominateur)
      // Pouvoir « 1 → c/c » : une bulle nombre prend le dénominateur d'une
      // fraction voisine. Il se gagne en réussissant le chapitre Fraction.
      var fusEl = document.getElementById("fus");
      var fusBoard = document.getElementById("fusBoard");
      var fusUid = 0;
      function M(k, s) { return { t: "m", k: k, s: s || "", id: ++fusUid }; }
      // Ordre d'écriture : lettres dans l'ordre alphabétique, nombres à la fin
      function sortMonos(list) {
        return list.slice().sort(function (a, b) { return (a.s || "~") < (b.s || "~") ? -1 : (a.s || "~") > (b.s || "~") ? 1 : 0; });
      }
      function Fa(k, inner) { return { t: "f", k: k, inner: sortMonos(inner), id: ++fusUid }; }
      function Fr(num, den) { return { t: "q", num: sortMonos(num), den: den, id: ++fusUid }; }
      function Sq(base, n) { return { t: "p", base: base, n: n, id: ++fusUid }; }
      // Forme canonique d'une bulle, pour comparer au but sans tenir compte
      // de l'ordre des bulles (l'addition est commutative)
      function canon(c) {
        if (c.t === "m") return (c.k < 0 ? "-" : "+") + Math.abs(c.k) + "*" + c.s;
        if (c.t === "f") return "+" + c.k + "*(" + sortMonos(c.inner).map(canon).join("") + ")";
        if (c.t === "p") return "+(" + c.base + "+" + c.n + ")^2";
        return "+(" + sortMonos(c.num).map(canon).join("") + ")/" + c.den;
      }
      function boardKey(list) { return list.map(canon).sort().join("|"); }

      var FUS_LEVELS = [
        { chips: function () { return [M(1, "a"), M(1, "a")]; }, goal: "2·a", want: function () { return [M(2, "a")]; } },
        { chips: function () { return [M(1, "a"), M(1, "b"), M(1, "a"), M(1, "b")]; }, goal: "2·(a + b)", want: function () { return [Fa(2, [M(1, "a"), M(1, "b")])]; } },
        { chips: function () { return [M(3, "x"), M(5, "x"), M(-2, "x")]; }, goal: "6·x", want: function () { return [M(6, "x")]; } },
        { chips: function () { return [M(3, "x"), M(2), M(-3, "x"), M(5)]; }, goal: "7", want: function () { return [M(7)]; } },
        { chips: function () { return [M(2, "x"), M(3), M(4, "x"), M(1)]; }, goal: "6·x + 4", want: function () { return [M(6, "x"), M(4)]; } },
        { chips: function () { return [M(2, "a"), M(2, "b"), M(2, "c")]; }, goal: "2·(a + b + c)", want: function () { return [Fa(2, [M(1, "a"), M(1, "b"), M(1, "c")])]; } },
        { chips: function () { return [M(1), Fr([M(1)], "c")]; }, goal: "(c + 1)/c", want: function () { return [Fr([M(1, "c"), M(1)], "c")]; }, power: true },
        { chips: function () { return [M(12, "x"), M(18)]; }, goal: "6·(2·x + 3)", power: "pf", want: function () { return [Fa(6, [M(2, "x"), M(3)])]; } },
        { chips: function () { return [M(15, "a"), M(10, "b")]; }, goal: "5·(3·a + 2·b)", power: "pf", want: function () { return [Fa(5, [M(3, "a"), M(2, "b")])]; } },
        // Développer : l'inverse de factoriser (pouvoir gagné avec Distribuer)
        { chips: function () { return [Fa(3, [M(1, "x"), M(2)]), M(1, "x")]; }, goal: "4·x + 6", power: "dev", want: function () { return [M(4, "x"), M(6)]; } },
        // Découper un nombre pour faire apparaître un facteur (gagné avec Calcul)
        { chips: function () { return [M(5, "x"), M(7)]; }, goal: "5·(x + 1) + 2", power: "cut", want: function () { return [Fa(5, [M(1, "x"), M(1)]), M(2)]; } },
        // Compléter le carré : + 9 − 9 fait apparaître (x + 3)² (gagné avec (a+b)²)
        { chips: function () { return [M(1, "x²"), M(6, "x")]; }, goal: "(x + 3)² − 9", power: "sq", want: function () { return [Sq("x", 3), M(-9)]; } },
        // Puissances : 2ⁿ⁺¹ = 2·2ⁿ (gagné avec Pascal, où chaque ligne double)
        { chips: function () { return [M(1, "2ⁿ⁺¹"), M(1, "2ⁿ")]; }, goal: "3·2ⁿ", power: "pow", want: function () { return [M(3, "2ⁿ")]; } },
        // Quantité conjuguée : 1/(√2 − 1) = √2 + 1 (gagné avec (a+b)(a−b))
        { chips: function () { return [Fr([M(1)], "√2 − 1"), M(-1)]; }, goal: "√2", power: "conj", want: function () { return [M(1, "√2")]; } },
        // Télescopage : 1/(k·(k+1)) = 1/k − 1/(k+1) (gagné avec Piège, qui sépare une fraction)
        { chips: function () { return [Fr([M(1)], "1·2"), Fr([M(1)], "2·3"), Fr([M(1)], "3·4")]; }, goal: "1 − 1/4", power: "tel", want: function () { return [M(1), Fr([M(-1)], "4")]; } },
        { chips: function () { return [M(2), Fr([M(3)], "c"), Fr([M(1)], "c")]; }, goal: "(2·c + 4)/c", want: function () { return [Fr([M(2, "c"), M(4)], "c")]; }, power: true }
      ];
      var fus = { level: 0, chips: [], sel: null, won: false };
      try { fus.level = Math.min(FUS_LEVELS.length - 1, Number(localStorage.getItem("pasapas_fus")) || 0); } catch (e) {}

      function monoStr(m, lead) {
        var k = m.k, a = Math.abs(k), sgn = k < 0 ? (lead ? "−" : "− ") : (lead ? "" : "+ ");
        var body = m.s ? (a === 1 ? m.s : a + "·" + m.s) : String(a);
        return sgn + body;
      }
      function sumStr(list) {
        return list.map(function (m, i) { return monoStr(m, i === 0); }).join(" ");
      }
      function chipStr(c, lead) {
        if (c.t === "m") return monoStr(c, lead);
        var pre = lead ? "" : "+ ";
        if (c.t === "f") return pre + c.k + "·(" + sumStr(c.inner) + ")";
        if (c.t === "p") return pre + "(" + c.base + " + " + c.n + ")²";
        return pre + "(" + sumStr(c.num) + ")/" + c.den;
      }
      function boardStr() {
        return fus.chips.map(function (c, i) { return chipStr(c, i === 0); }).join(" ").replace(/^\(([^()]*)\)\//, function (m0, n) { return "(" + n + ")/"; });
      }
      // Réduit une somme de monômes (termes semblables regroupés)
      function reduce(list) {
        var out = [];
        list.forEach(function (m) {
          var same = out.find(function (o) { return o.s === m.s; });
          if (same) same.k += m.k; else out.push(M(m.k, m.s));
        });
        return out.filter(function (m) { return m.k !== 0; });
      }
      // Règles de fusion : A lâchée sur B. Renvoie la nouvelle bulle, ou
      // "zero" si elles s'annulent, ou null si aucune règle ne s'applique.
      function fuse(A, B) {
        if (A.t === "m" && B.t === "m") {
          // x² + 2n·x + n² → (x + n)² : la troisième bulle (x²) est prise au plateau
          var lin = A.s === "x" ? A : B.s === "x" ? B : null, cst = lin === A ? B : A;
          if (lin && !cst.s && cst.k > 0 && (lin.k / 2) * (lin.k / 2) === cst.k) {
            var x2 = fus.chips.find(function (z) { return z.t === "m" && z.s === "x²" && z.k === 1; });
            if (x2) { var sq = Sq("x", lin.k / 2); sq.also = [x2.id]; return sq; }
          }
          if (A.s === B.s) { var k = A.k + B.k; return k === 0 ? "zero" : M(k, A.s); }
          // Facteur commun : même nombre devant ; avec le pouvoir « premiers »,
          // le plus grand facteur commun (PGCD) des deux nombres
          var g = gcd(Math.abs(A.k), Math.abs(B.k));
          if (A.k === B.k && Math.abs(A.k) !== 1 && (A.s || B.s)) return Fa(A.k, [M(1, B.s), M(1, A.s)]);
          if (hasPower("Premiers") && g > 1 && (A.s || B.s) && A.k !== B.k) return Fa(g, [M(B.k / g, B.s), M(A.k / g, A.s)]);
          return null;
        }
        if (A.t === "m" && B.t === "f" && A.s && A.k === B.k) return Fa(B.k, B.inner.concat([M(1, A.s)]));
        if (A.t === "f" && B.t === "m" && B.s && A.k === B.k) return Fa(A.k, [M(1, B.s)].concat(A.inner));
        if (A.t === "q" && B.t === "q" && A.den === B.den) {
          var nu = reduce(B.num.concat(A.num));
          return nu.length ? Fr(nu, B.den) : "zero";
        }
        return null;
      }

      function gcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a; }
      function primeStr(n) {
        var out = [], d = 2, SUP = { 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
        n = Math.abs(n);
        while (n > 1) {
          var c = 0;
          while (n % d === 0) { n /= d; c++; }
          if (c) out.push(d + (c > 1 ? SUP[c] || "^" + c : ""));
          d++;
        }
        return out.join("·") || "1";
      }
      var fusPowers = document.getElementById("fusPowers");
      function powerOpen() { return hasPower("Fraction"); }

      function fusStart() {
        var L = FUS_LEVELS[fus.level];
        fus.chips = L.chips();
        fus.sel = null;
        fus.won = false;
        try { localStorage.setItem("pasapas_fus", String(fus.level)); } catch (e) {}
        document.getElementById("fusGoal").innerHTML = (LANG === "en" ? "Goal " : "But ") + (fus.level + 1) + "/" + FUS_LEVELS.length + " &nbsp; <b>" + L.goal + "</b>";
        document.getElementById("fusMsg").textContent = "";
        nextBtn.disabled = true;
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
        prevBtn.style.visibility = "";
        prevBtn.textContent = "↺";
        fusPowers.innerHTML = "";
        if (L.power === "pf") {
          var pp = document.createElement("button");
          pp.textContent = "n → 2·3·…";
          pp.disabled = !hasPower("Premiers");
          pp.addEventListener("click", function () {
            var c = fus.chips.find(function (x) { return x.id === fus.sel && x.t === "m"; });
            var msg = document.getElementById("fusMsg");
            if (!c) { SND.bad(); msg.textContent = LANG === "en" ? "Tap a bubble first." : "Touche d'abord une bulle."; return; }
            SND.ok();
            msg.textContent = Math.abs(c.k) + " = " + primeStr(c.k);
          });
          fusPowers.appendChild(pp);
          if (!hasPower("Premiers")) document.getElementById("fusMsg").textContent = LANG === "en" ? "Power locked: pass the Primes chapter." : "Pouvoir verrouillé : réussis le chapitre Premiers.";
        } else if (FUS_PW[L.power]) {
          var P = FUS_PW[L.power];
          var pd = document.createElement("button");
          pd.textContent = P.btn;
          pd.disabled = !hasPower(P.ch);
          pd.addEventListener("click", P.fn);
          fusPowers.appendChild(pd);
          if (!hasPower(P.ch)) document.getElementById("fusMsg").textContent = LANG === "en" ? "Power locked: pass the " + tr(P.ch) + " chapter." : "Pouvoir verrouillé : réussis le chapitre " + P.ch + ".";
        } else if (L.power) {
          var pb = document.createElement("button");
          pb.textContent = "1 → c/c";
          pb.disabled = !powerOpen();
          pb.title = LANG === "en" ? "Same denominator" : "Même dénominateur";
          pb.addEventListener("click", fusPower);
          fusPowers.appendChild(pb);
          if (!powerOpen()) document.getElementById("fusMsg").textContent = LANG === "en" ? "Power locked: pass the Fraction chapter." : "Pouvoir verrouillé : réussis le chapitre Fraction.";
        }
        fusRender(null);
      }

      function chipHTML(c, lead) {
        function sum(list) { return sumStr(list).replace(/([a-z])/g, "<i>$1</i>"); }
        if (c.t === "q") return (lead ? "" : "") + '<span class="fr"><span>' + sum(c.num) + "</span><span>" + c.den.replace(/([a-z])/g, "<i>$1</i>") + "</span></span>";
        return chipStr(c, true).replace(/([a-z])/g, "<i>$1</i>");
      }

      // Rendu avec animation FLIP : chaque bulle part de son ancienne place
      // (en arc si elle change beaucoup de place), les nouvelles éclosent.
      function isNeg(c) { return (c.t === "m" && c.k < 0) || (c.t === "q" && c.num.length === 1 && c.num[0].k < 0); }
      function fusRender(bornId) {
        var old = {};
        fusBoard.querySelectorAll(".chip").forEach(function (e) { old[e.dataset.id] = e.getBoundingClientRect(); });
        fusBoard.innerHTML = "";
        fus.chips.forEach(function (c, i) {
          if (i > 0) {
            var sp = document.createElement("span");
            sp.className = "fus-sep";
            sp.textContent = isNeg(c) ? "−" : "+";
            fusBoard.appendChild(sp);
          }
          var e = document.createElement("span");
          e.className = "chip" + (fus.sel === c.id ? " sel" : "");
          e.dataset.id = c.id;
          var cc = c;
          if (i > 0 && isNeg(c)) cc = c.t === "m" ? M(-c.k, c.s) : { t: "q", num: [M(-c.num[0].k, c.num[0].s)], den: c.den };
          e.innerHTML = chipHTML(cc, true);
          fusBoard.appendChild(e);
          fusDraggable(e, c);
        });
        fusBoard.querySelectorAll(".chip").forEach(function (e) {
          var r = e.getBoundingClientRect(), o = old[e.dataset.id];
          if (o && e.dataset.id !== String(bornId)) {
            var dx = o.left - r.left, dy = o.top - r.top;
            if (Math.abs(dx) + Math.abs(dy) < 1) return;
            var lift = Math.min(50, Math.abs(dx) * 0.35) * (dx < 0 ? -1 : 1), kf = [];
            for (var q = 0; q <= 8; q++) {
              var t = q / 8, sn = Math.sin(Math.PI * t);
              kf.push({ transform: "translate(" + dx * (1 - t) + "px," + (dy * (1 - t) + lift * sn) + "px)" });
            }
            e.animate(kf, { duration: ms(650), easing: "cubic-bezier(.45,0,.3,1)" });
          } else {
            e.animate([{ transform: "scale(0.3)", opacity: 0 }, { transform: "scale(1.18)", opacity: 1, offset: 0.7 }, { transform: "scale(1)" }],
              { duration: ms(520), easing: "ease-out" });
          }
        });
      }

      function fusDraggable(e, c) {
        var d = null;
        e.addEventListener("pointerdown", function (ev) {
          if (fus.won) return;
          ev.preventDefault();
          e.setPointerCapture(ev.pointerId);
          d = { x: ev.clientX, y: ev.clientY, moved: false, clone: null };
        });
        e.addEventListener("pointermove", function (ev) {
          if (!d) return;
          if (!d.moved && Math.hypot(ev.clientX - d.x, ev.clientY - d.y) < 8) return;
          if (!d.moved) {
            d.moved = true;
            d.clone = e.cloneNode(true);
            d.clone.classList.add("drag");
            document.body.appendChild(d.clone);
            e.classList.add("ghost-slot");
          }
          d.clone.style.left = ev.clientX + "px";
          d.clone.style.top = ev.clientY + "px";
          var over = chipAt(ev.clientX, ev.clientY, e);
          fusBoard.querySelectorAll(".chip").forEach(function (x) { x.classList.toggle("target", x === over); });
        });
        function up(ev) {
          if (!d) return;
          var dd = d;
          d = null;
          fusBoard.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("target"); });
          if (!dd.moved) {
            // Appui bref : sélection (pour un pouvoir)
            fus.sel = fus.sel === c.id ? null : c.id;
            SND.tick();
            fusBoard.querySelectorAll(".chip").forEach(function (x) { x.classList.toggle("sel", x.dataset.id === String(fus.sel)); });
            return;
          }
          var over = chipAt(ev.clientX, ev.clientY, e);
          var clone = dd.clone;
          e.classList.remove("ghost-slot");
          if (!over) { flyBack(clone, e); return; }
          var B = fus.chips.find(function (x) { return String(x.id) === over.dataset.id; });
          var res = fuse(c, B);
          if (!res) {
            SND.bad();
            flyBack(clone, e);
            over.animate([{ transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "none" }], { duration: ms(260) });
            return;
          }
          clone.remove();
          SND.meet();
          var iB = fus.chips.indexOf(B);
          fus.chips.splice(fus.chips.indexOf(c), 1);
          iB = fus.chips.indexOf(B);
          if (res === "zero") {
            fus.chips.splice(iB, 1);
            if (!fus.chips.length) fus.chips.push(M(0));
            over.animate([{ transform: "scale(1)", opacity: 1 }, { transform: "scale(0)", opacity: 0 }], { duration: ms(350), fill: "forwards" });
            setTimeout(function () { fusRender(null); fusCheck(); }, ms(330));
          } else {
            fus.chips.splice(iB, 1, res);
            if (res.also) fus.chips = fus.chips.filter(function (z) { return res.also.indexOf(z.id) < 0; });
            fusRender(res.id);
            fusCheck();
          }
        }
        e.addEventListener("pointerup", up);
        e.addEventListener("pointercancel", up);
      }

      function chipAt(x, y, self) {
        var found = null;
        fusBoard.querySelectorAll(".chip").forEach(function (b) {
          if (b === self) return;
          var r = b.getBoundingClientRect();
          if (x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8) found = b;
        });
        return found;
      }

      function flyBack(clone, e) {
        var r = e.getBoundingClientRect();
        var cr = clone.getBoundingClientRect();
        var a = clone.animate([
          { left: (cr.left + cr.width / 2) + "px", top: (cr.top + cr.height / 2) + "px" },
          { left: (r.left + r.width / 2) + "px", top: (r.top + r.height / 2) + "px" }
        ], { duration: ms(380), easing: "cubic-bezier(.3,1.3,.5,1)", fill: "forwards" });
        done(a).then(function () { clone.remove(); });
      }

      function fusPower() {
        if (!powerOpen()) return;
        var c = fus.chips.find(function (x) { return x.id === fus.sel; });
        var q = fus.chips.find(function (x) { return x.t === "q"; });
        if (!c || c.t !== "m" || !q) {
          SND.bad();
          document.getElementById("fusMsg").textContent = LANG === "en" ? "Tap a number bubble first." : "Touche d'abord une bulle nombre.";
          return;
        }
        // k = k·c/c : même valeur, mais maintenant avec le dénominateur c
        var i = fus.chips.indexOf(c);
        var nf = Fr([M(c.k, c.s ? c.s + "·" + q.den : q.den)], q.den);
        nf.id = c.id;
        fus.chips.splice(i, 1, nf);
        fus.sel = null;
        SND.ok();
        document.getElementById("fusMsg").textContent = "";
        fusRender(null);
        var el = fusBoard.querySelector('.chip[data-id="' + nf.id + '"]');
        if (el) el.animate([{ transform: "rotateY(90deg)" }, { transform: "none" }], { duration: ms(500) });
      }

      function fusSelected(test, fr, en) {
        var c = fus.chips.find(function (x) { return x.id === fus.sel && test(x); });
        if (!c) { SND.bad(); document.getElementById("fusMsg").textContent = LANG === "en" ? en : fr; }
        return c;
      }
      function fusReplace(c, list) {
        fus.chips.splice.apply(fus.chips, [fus.chips.indexOf(c), 1].concat(list));
        fus.sel = null;
        SND.ok();
        document.getElementById("fusMsg").textContent = "";
        fusRender(null);
        fusCheck();
      }
      // Compléter le carré : devant 2n·x, on ajoute n² et on le retranche
      function fusSquare() {
        if (!hasPower("(a+b)²")) return;
        var c = fusSelected(function (x) { return x.t === "m" && x.s === "x" && x.k % 2 === 0 && x.k > 0; }, "Touche d'abord la bulle 2n·x.", "Tap the 2n·x bubble first.");
        if (!c) return;
        var n = c.k / 2;
        fusReplace(c, [c, M(n * n), M(-n * n)]);
        document.getElementById("fusMsg").textContent = "+ " + (n * n) + " − " + (n * n) + " = 0 : " + (LANG === "en" ? "same value" : "même valeur");
      }
      // Puissances : aⁿ⁺¹ = a·aⁿ
      function fusPow() {
        if (!hasPower("Pascal")) return;
        var c = fusSelected(function (x) { return x.t === "m" && /ⁿ⁺¹$/.test(x.s); }, "Touche d'abord la bulle aⁿ⁺¹.", "Tap the aⁿ⁺¹ bubble first.");
        if (!c) return;
        var a = Number(c.s.replace("ⁿ⁺¹", "")), r = M(c.k * a, a + "ⁿ");
        r.id = c.id;
        fusReplace(c, [r]);
        document.getElementById("fusMsg").textContent = a + "ⁿ⁺¹ = " + a + "·" + a + "ⁿ";
      }
      // Quantité conjuguée : 1/(√a − b) · (√a + b)/(√a + b)
      function fusConj() {
        if (!hasPower("(a+b)(a−b)")) return;
        var c = fusSelected(function (x) { return x.t === "q" && /^√\d+ − \d+$/.test(x.den); }, "Touche d'abord la fraction.", "Tap the fraction first.");
        if (!c) return;
        var m = /^√(\d+) − (\d+)$/.exec(c.den), a = Number(m[1]), b = Number(m[2]), d = a - b * b;
        if (d !== 1 || c.num.length !== 1 || c.num[0].s) { SND.bad(); return; }
        var k = c.num[0].k;
        fusReplace(c, [M(k, "√" + a), M(k * b)]);
        document.getElementById("fusMsg").textContent = "(√" + a + " − " + b + ")(√" + a + " + " + b + ") = " + a + " − " + (b * b) + " = 1";
      }
      // Télescopage : 1/(k·(k+1)) = 1/k − 1/(k+1)
      function fusTel() {
        if (!hasPower("Piège")) return;
        var c = fusSelected(function (x) { return x.t === "q" && /^\d+·\d+$/.test(x.den); }, "Touche d'abord une fraction 1/(k·(k + 1)).", "Tap a 1/(k·(k + 1)) fraction first.");
        if (!c) return;
        var ab = c.den.split("·").map(Number), k = ab[0];
        if (ab[1] !== k + 1 || c.num.length !== 1 || c.num[0].s || c.num[0].k !== 1) { SND.bad(); return; }
        var first = k === 1 ? M(1) : Fr([M(1)], String(k));
        first.id = c.id;
        fusReplace(c, [first, Fr([M(-1)], String(k + 1))]);
        document.getElementById("fusMsg").textContent = "1/(" + k + "·" + (k + 1) + ") = 1/" + k + " − 1/" + (k + 1);
      }
      // Développer : k·(a + b) → k·a + k·b
      function fusDevelop() {
        if (!hasPower("Distribuer")) return;
        var c = fusSelected(function (x) { return x.t === "f"; }, "Touche d'abord une bulle k·( … ).", "Tap a k·( … ) bubble first.");
        if (!c) return;
        fusReplace(c, c.inner.map(function (m) { return M(c.k * m.k, m.s); }));
      }
      // Découper un nombre : 7 → 5 + 2, pour faire apparaître le nombre
      // d'une bulle voisine (le plus grand qui rentre)
      function fusCut() {
        if (!hasPower("Calcul")) return;
        var c = fusSelected(function (x) { return x.t === "m" && !x.s && x.k > 1; }, "Touche d'abord une bulle nombre.", "Tap a number bubble first.");
        if (!c) return;
        var k = 0;
        fus.chips.forEach(function (x) {
          var v = x.t === "m" ? Math.abs(x.k) : x.t === "f" ? x.k : 0;
          if (x !== c && v > 1 && v < c.k && v > k) k = v;
        });
        if (!k) { SND.bad(); document.getElementById("fusMsg").textContent = LANG === "en" ? "No smaller number next to it to reveal." : "Aucun nombre plus petit à faire apparaître à côté."; return; }
        var a = M(k), b = M(c.k - k);
        a.id = c.id;
        fusReplace(c, [a, b]);
        document.getElementById("fusMsg").textContent = c.k + " = " + k + " + " + (c.k - k);
      }

      var FUS_PW = {
        dev: { ch: "Distribuer", btn: "k·(a + b) → k·a + k·b", fn: fusDevelop },
        cut: { ch: "Calcul", btn: "n → a + b", fn: fusCut },
        sq: { ch: "(a+b)²", btn: "+ c − c", fn: fusSquare },
        pow: { ch: "Pascal", btn: "aⁿ⁺¹ → a·aⁿ", fn: fusPow },
        conj: { ch: "(a+b)(a−b)", btn: "× (√a + b)/(√a + b)", fn: fusConj },
        tel: { ch: "Piège", btn: "1/(k(k+1)) → 1/k − 1/(k+1)", fn: fusTel }
      };

      function fusCheck() {
        if (boardKey(fus.chips) !== boardKey(FUS_LEVELS[fus.level].want())) return;
        fus.won = true;
        SND.badge();
        document.getElementById("fusMsg").textContent = "✓";
        nextBtn.disabled = false;
        nextBtn.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: ms(600) });
        if (fus.level === FUS_LEVELS.length - 1) markDone("Fusion");
      }

      // ---------- Chapitre Calcul : calcul mental en continu ----------
      // Pas de clics : l'animation se déroule seule, comme un raisonnement
      // qu'on regarderait au ralenti. Dizaines = barres de 10, unités =
      // jetons rangés par 5 (le cadre de dix = 2 rangées de 5).
      //   16 + 27 → 10 + 6 + 20 + 7 → 6 = 5 + 1, 7 = 5 + 2
      //   → 5 + 5 = 10 : une dizaine de plus → 40 + 3 → 43
      // Si un seul des deux dépasse 5, on « fait 10 » (complément à 10).
      var calcEl = document.getElementById("calc");
      var calcEq = document.getElementById("calcEq");
      var calcScene = document.getElementById("calcScene");
      var calcRun = 0, calcSeen = 0, calcHold = null;
      var calcMsg = document.getElementById("calcMsg");
      // Chaque étape s'arrête et s'explique ; la flèche passe à la suivante
      function calcPause(text) {
        calcMsg.textContent = text;
        calcMsg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms(400) });
        nextBtn.disabled = false;
        nextBtn.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: ms(500) });
        return new Promise(function (r) { calcHold = r; });
      }

      function calcPick() {
        var r = Math.random(), t1 = 1 + Math.floor(Math.random() * 3), t2 = 1 + Math.floor(Math.random() * 3);
        var u1, u2;
        if (r < 0.6) { u1 = 5 + Math.floor(Math.random() * 5); u2 = 5 + Math.floor(Math.random() * 5); }
        else if (r < 0.85) { u1 = 6 + Math.floor(Math.random() * 4); u2 = 11 - u1 + Math.floor(Math.random() * (u1 - 6 + 1)); if (u2 >= 5) u2 = 4; if (u1 + u2 < 10) u2 = 10 - u1 + 0; }
        else { u1 = 1 + Math.floor(Math.random() * 4); u2 = 1 + Math.floor(Math.random() * (8 - u1)); }
        return { t1: t1, u1: u1, t2: t2, u2: u2 };
      }

      function cmEl(cls, x, y, w, h) {
        var e = document.createElement("div");
        e.className = cls;
        e.style.left = x + "px"; e.style.top = y + "px";
        e.style.width = w + "px"; e.style.height = h + "px";
        e._x = x; e._y = y;
        calcScene.appendChild(e);
        return e;
      }

      function cmMove(e, x, y, dur, delay) {
        var dx = e._x - x, dy = e._y - y;
        e.style.left = x + "px"; e.style.top = y + "px";
        e._x = x; e._y = y;
        return done(e.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }],
          { duration: ms(dur || 1100), delay: ms(delay || 0), easing: "cubic-bezier(.45,0,.25,1)", fill: "backwards" }));
      }

      // Somme écrite sans les termes nuls (pas de « 5 + 0 »)
      function sumOf(list) { return list.filter(function (v) { return v !== 0; }).join(" + "); }

      function cmText(t) {
        calcEq.animate([{ opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }], { duration: ms(700) });
        setTimeout(function () { calcEq.textContent = t; }, ms(300));
      }

      function calcStart() {
        var run = ++calcRun;
        calcHold = null;
        calcMsg.textContent = "";
        var p = calcPick();
        var a = 10 * p.t1 + p.u1, b = 10 * p.t2 + p.u2;
        calcScene.innerHTML = "";
        calcEq.textContent = a + " + " + b;
        nextBtn.disabled = true; // la flèche attend la fin de chaque geste
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
        var W = calcScene.clientWidth, H = calcScene.clientHeight;
        var c = Math.max(12, Math.min(22, H / 14, W / 16));   // taille d'un jeton
        var g = c * 0.25, rodW = c, rodH = c * 10 * 0.62;
        var rodY = 8, dotY = rodY + rodH + c * 0.8;
        var gx = [W * 0.27, W * 0.73];

        function rodsAt(n, cx) { var w = n * rodW + (n - 1) * g; return function (k) { return cx - w / 2 + k * (rodW + g); }; }
        function dotPos(cx, k, row) { return { x: cx - (5 * c + 4 * g) / 2 + (k % 5) * (c + g), y: dotY + (row + Math.floor(k / 5)) * (c + g) }; }

        var rods = [], dots = [[], []];
        [[p.t1, p.u1], [p.t2, p.u2]].forEach(function (tu, side) {
          var rx = rodsAt(tu[0], gx[side]);
          for (var k = 0; k < tu[0]; k++) rods.push(cmEl("cm-rod", rx(k), rodY, rodW, rodH));
          for (var j = 0; j < tu[1]; j++) {
            var q = dotPos(gx[side], j, 0);
            dots[side].push(cmEl("cm-dot" + (side ? " b" : ""), q.x, q.y, c, c));
          }
        });
        calcScene.querySelectorAll("div").forEach(function (e, i) {
          e.animate([{ opacity: 0, transform: "scale(0.6)" }, { opacity: 1, transform: "none" }], { duration: ms(500), delay: ms(i * 30), fill: "backwards" });
        });

        function alive() { return run === calcRun && DEMOS[demoIndex].custom === "calc"; }
        var u1 = p.u1, u2 = p.u2, T1 = 10 * p.t1, T2 = 10 * p.t2;
        var en = LANG === "en";
        var chain = wait(800).then(function () {
          if (!alive()) return;
          return calcPause(en ? "Barres = tens, counters = ones." : "Une barre = une dizaine, un jeton = une unité.");
        }).then(function () {
          if (!alive()) return;
          cmText(T1 + " + " + u1 + " + " + T2 + " + " + u2);
          return wait(700).then(function () {
            return calcPause(a + " = " + T1 + " + " + u1 + ", " + b + " = " + T2 + " + " + u2 + (en ? " : tens and ones apart." : " : les dizaines d'un côté, les unités de l'autre."));
          });
        });

        // Toutes les dizaines se regroupent à gauche
        function gatherRods(extra) {
          var n = rods.length;
          var rx = rodsAt(n, W * 0.3);
          return Promise.all(rods.map(function (r, k) { return cmMove(r, rx(k), rodY, 1200, k * 80); }));
        }

        // Une dizaine faite de jetons devient une barre
        function tenToRod(tenDots) {
          // Assemblée au milieu, sous les barres (place libre), puis la
          // barre de 10 naît juste au-dessus
          var cx = W / 2, y0 = dotY + 2 * (c + g) + c * 0.4;
          var moves = tenDots.map(function (d, k) {
            return cmMove(d, cx - (5 * c + 4 * g) / 2 + (k % 5) * (c + g), y0 + Math.floor(k / 5) * (c + g), 1200, k * 60);
          });
          return Promise.all(moves).then(function () { return wait(900); }).then(function () {
            if (!alive()) return;
            var rod = cmEl("cm-rod", cx - rodW / 2, rodY, rodW, rodH);
            rod.animate([{ opacity: 0, transform: "scaleY(0.2)" }, { opacity: 1, transform: "none" }], { duration: ms(700), easing: "ease-out" });
            tenDots.forEach(function (d) {
              d.animate([{ opacity: 1 }, { opacity: 0, transform: "scale(0.3)" }], { duration: ms(600), fill: "forwards" });
            });
            rods.push(rod);
            return wait(900);
          });
        }

        var left = [];
        if (u1 >= 5 && u2 >= 5) {
          chain = chain.then(function () {
            if (!alive()) return;
            cmText(sumOf([T1, T2, 5, u1 - 5, 5, u2 - 5]));
            // Les rangées de 5 s'allument
            dots[0].slice(0, 5).concat(dots[1].slice(0, 5)).forEach(function (d) {
              d.animate([{ transform: "scale(1)" }, { transform: "scale(1.25)" }, { transform: "scale(1)" }], { duration: ms(800) });
            });
            var parts = [u1, u2].filter(function (u) { return u > 5; }).map(function (u) { return u + " = 5 + " + (u - 5); });
            return calcPause((parts.length ? parts.join(en ? " and " : " et ") + " : " : "") + (en ? "two rows of 5." : "deux rangées de 5."));
          }).then(function () {
            if (!alive()) return;
            cmText(sumOf([T1, T2, 10, u1 - 5, u2 - 5]));
            left = dots[0].slice(5).concat(dots[1].slice(5));
            return tenToRod(dots[0].slice(0, 5).concat(dots[1].slice(0, 5))).then(function () {
              if (alive()) return calcPause(en ? "5 + 5 = 10: one more ten." : "5 + 5 = 10 : une dizaine de plus.");
            });
          });
        } else if (u1 + u2 >= 10) {
          var big = u1 >= u2 ? 0 : 1, small = 1 - big, need = 10 - Math.max(u1, u2);
          chain = chain.then(function () {
            if (!alive()) return;
            var ub = Math.max(u1, u2), us = Math.min(u1, u2);
            cmText(T1 + " + " + T2 + " + " + ub + " + " + need + " + " + (us - need));
            return calcPause(en ? ub + " needs " + need + " to make 10: take it from " + us + "." : "Pour faire 10 avec " + ub + ", il manque " + need + " : on le prend au " + us + ".");
          }).then(function () {
            if (!alive()) return;
            // Complément à 10 : on prend juste ce qu'il faut à l'autre nombre
            var give = dots[small].slice(0, need);
            var gxb = gx[big];
            return Promise.all(give.map(function (d, k) {
              var q = dotPos(gxb, dots[big].length + k, 0);
              return cmMove(d, q.x, q.y, 1300, k * 150);
            })).then(function () { return wait(1200); }).then(function () {
              if (!alive()) return;
              cmText(T1 + " + " + T2 + " + 10 + " + (us - need));
              left = dots[small].slice(need);
              return tenToRod(dots[big].concat(give)).then(function () {
                if (alive()) return calcPause(Math.max(u1, u2) + " + " + need + " = 10" + (en ? ": one more ten, " : " : une dizaine de plus, il reste ") + (Math.min(u1, u2) - need) + ".");
              });
            });
          });
        }
        chain = chain.then(function () {
          if (!alive()) return;
          if (!left.length && u1 + u2 < 10) left = dots[0].concat(dots[1]);
          return gatherRods();
        }).then(function () {
          if (!alive()) return;
          var tens = rods.length * 10, units = (a + b) % 10;
          cmText(tens + " + " + units);
          var lx = rodsAt(rods.length, W * 0.3)(rods.length - 1) + rodW + c * 1.2;
          return Promise.all(left.map(function (d, k) {
            return cmMove(d, lx + (k % 5) * (c + g), rodY + rodH - c - Math.floor(k / 5) * (c + g), 1200, k * 80);
          })).then(function () {
            if (alive()) return calcPause(en ? "Tidy up: " + rods.length + " tens and " + units + " ones." : "On range : " + rods.length + " dizaines et " + units + " unités.");
          });
        }).then(function () {
          if (!alive()) return;
          cmText(a + " + " + b + " = " + (a + b));
          calcSeen++;
          if (calcSeen >= WIN) markDone("Calcul");
          // La flèche lance un autre calcul (plus rien ne part tout seul)
          calcMsg.textContent = (en ? "Result: " : "Résultat : ") + (a + b) + (en ? ". Arrow: another one." : ". La flèche : un autre calcul.");
          nextBtn.disabled = false;
        });
      }

      // ---------- Chapitre Regrouper (à la main) ----------
      // Chaque terme, avec son signe, se touche :
      //   toucher un terme puis un terme semblable (ou glisser l'un sur
      //   l'autre) : ils se rapprochent, la ligne se réarrange
      //   côte à côte, 3x puis 2x : (3 + 2)·x — de même 5 puis 7 : (5 + 7)
      //   toucher le groupe puis le badge 10 (ou retoucher le groupe) :
      //   le calcul se fait, 5x
      // Fini quand il ne reste qu'un terme en x, puis un nombre.
      var regEl = document.getElementById("reg"), regRow = document.getElementById("regRow");
      var REG_EX = [
        { need: "N", t: [[3, "x"], [5, ""], [2, "x"], [7, ""]] },
        { need: "N", t: [[2, "x"], [4, ""], [1, "x"], [6, ""]] },
        { need: "N", t: [[4, ""], [3, "x"], [6, ""], [1, "x"]] },
        { need: "N", t: [[6, "x"], [1, ""], [3, "x"], [8, ""]] },
        { need: "Z", t: [[-2, "x"], [3, ""], [-1, "x"]] },
        { need: "Z", t: [[5, "x"], [-4, ""], [-2, "x"], [9, ""]] }
      ];
      // Chaque terme a un contenant : "in" (dans la parenthèse (−1)·( … ),
      // mode « à ta façon » des chapitres à étapes) ou "out". Les gestes ne
      // se font qu'entre termes d'un même contenant.
      var reg = null, regUid = 0, regLast = -1;
      function regActive() { return !!reg && (reg.free || DEMOS[demoIndex].custom === "reg"); }
      function regCh() { return reg && reg.free ? DEMOS[demoIndex].title : "Regrouper"; }
      function regStart() {
        var pool = REG_EX.map(function (e, i) { return i; }).filter(function (i) { return sets[REG_EX[i].need] && i !== regLast; });
        var i = pool[Math.floor(Math.random() * pool.length)];
        regLast = i;
        reg = { terms: REG_EX[i].t.map(function (t) { return { id: ++regUid, k: t[0], s: t[1], c: "out" }; }), sel: null, mistake: false, done: false };

        { q: "x² − x − 1 = 0", a: { N: "∅", R: "{ (1 − √5)/2 ; (1 + √5)/2 }" } },
        { q: "x² = −1", a: { N: "∅", C: "{ −i ; i }" } },
        { q: "x² = −4", a: { N: "∅", C: "{ −2i ; 2i }" } },
        { q: "x³ = 8", a: { N: "{ 2 }", C: "{ 2 ; −1 − i√3 ; −1 + i√3 }" } },
        { q: "x² + 2x + 5 = 0", a: { N: "∅", C: "{ −1 − 2i ; −1 + 2i }" } }
      ];
      var solIndex = 0, solShown = "";
      var SYM = { N: "ℕ", Z: "ℤ", Q: "ℚ", R: "ℝ", C: "ℂ" };

      function solAnswer(p) {
        // La réponse valable dans le plus grand ensemble ≤ univers
        var ans = "∅";
        UNIV.forEach(function (k) { if (sets[k] && p.a[k]) ans = p.a[k]; });
        return ans;
      }

      function solStart() { solRender(false); }

      // Deux questions, sans changer d'ensemble : y a-t-il une solution
      // dans l'ensemble actuel ? puis quel est le plus petit ensemble qui
      // en contient une ? La réponse s'affiche après.
      function solButtons(labels, good, onDone) {
        var box = document.getElementById("solBtns");
        box.innerHTML = "";
        labels.forEach(function (lab) {
          var b = document.createElement("button");
          b.textContent = lab;
          b.addEventListener("click", function () {
            if (box.dataset.done) return;
            box.dataset.done = "1";
            var ok = lab === good;
            box.dataset.ok = ok ? "1" : "";
            examHit(ok, "Solutions");
            if (ok) SND.ok(); else SND.bad();
            box.querySelectorAll("button").forEach(function (x) { if (x.textContent === good) x.classList.add("good"); });
            if (!ok) b.classList.add("bad");
            setTimeout(onDone, ms(ok ? 600 : 1200));
          });
          box.appendChild(b);
        });
        delete box.dataset.done;
      }
      function solRender(animate) {
        var p = SOL[solIndex];
        var qEl = document.getElementById("solQ"), aEl = document.getElementById("solA");
        var first = UNIV.find(function (k) { return p.a[k] && p.a[k] !== "∅"; });
        var has = solAnswer(p) !== "∅", msg = document.getElementById("solMsg");
        qEl.textContent = p.q;
        document.getElementById("solIn").textContent = (LANG === "en" ? "in " : "dans ") + SYM[universe];
        aEl.textContent = "";
        aEl.classList.remove("empty");
        nextBtn.disabled = true;
        msg.className = "sg-msg sol-ask";
        msg.textContent = LANG === "en" ? "A solution in " + SYM[universe] + "?" : "Une solution dans " + SYM[universe] + " ?";
        if (!animate) qEl.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: ms(400) });
        var yes = LANG === "en" ? "Yes" : "Oui", no = LANG === "en" ? "No" : "Non";
        solButtons([yes, no], has ? yes : no, function () {
          aEl.textContent = "S = " + solAnswer(p);
          aEl.classList.toggle("empty", !has);
          aEl.animate([{ transform: "rotateX(90deg)", opacity: 0.2 }, { transform: "none", opacity: 1 }], { duration: ms(500), easing: "ease-out" });
          msg.textContent = LANG === "en" ? "The smallest set with a solution?" : "Le plus petit ensemble avec une solution ?";
          solButtons(UNIV.map(function (k) { return SYM[k]; }), SYM[first], function () {
            document.getElementById("solBtns").innerHTML = "";
            var okLast = !!document.getElementById("solBtns").dataset.ok;
            msg.textContent = (LANG === "en" ? "First solution in " : "Première solution dans ") + SYM[first] + " : S = " + p.a[first];
            nextBtn.disabled = false;
            if (okLast) quickNext("sol", function () { next(); }, 1300);
            nextBtn.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: ms(600) });
          });
        });
        nextBtn.textContent = "→";
        nextBtn.classList.remove("text");
      }

      // ---------- Chapitre Ensembles ----------
      // Un nombre s'affiche ; on le glisse dans un ensemble (ou on touche la
      // case). Toute case qui le contient est juste : 3 est dans ℤ, mais
      // aussi dans ℂ. La réponse allume toutes les cases qui le contiennent
      // — on voit les inclusions. Appui long sur une case : sa définition.

      var ensEl = document.getElementById("ens");
      var ensNum = document.getElementById("ensNum");
      var ensMsg = document.getElementById("ensMsg");
      var ensTip = document.getElementById("ensTip");
      var ensScoreEl = document.getElementById("ensScore");
      var ensState = null, ensScore = { ok: 0, n: 0 }, ensStreak = 0;

      // Chaque case : symbole, ensemble de base (pour les cases à cocher du
      // menu), appartenance, définition.
      var ENS = [
        { id: "Ns", sym: "ℕ<sup>*</sup>", base: "N", row: 1, has: function (z) { return z.real && z.kind === "int" && z.re > 0; },
          def: "ℕ<sup>*</sup> : les entiers naturels non nuls, 1, 2, 3…", defEn: "ℕ<sup>*</sup>: non-zero natural numbers 1, 2, 3…" },
        { id: "N", sym: "ℕ", base: "N", row: 1, has: function (z) { return z.real && z.kind === "int" && z.re >= 0; },
          def: "ℕ : les entiers naturels 0, 1, 2, 3…", defEn: "ℕ: natural numbers 0, 1, 2, 3…" },
        { id: "Z", sym: "ℤ", base: "Z", row: 1, has: function (z) { return z.real && z.kind === "int"; },
          def: "ℤ : les entiers relatifs … −2, −1, 0, 1, 2…", defEn: "ℤ: integers … −2, −1, 0, 1, 2…" },
        { id: "Q", sym: "ℚ", base: "Q", row: 1, has: function (z) { return z.real && z.kind !== "irr"; },
          def: "ℚ : les rationnels, quotients p/q d'entiers (q ≠ 0).", defEn: "ℚ: rationals, quotients p/q of integers (q ≠ 0)." },
        { id: "R", sym: "ℝ", base: "R", row: 1, has: function (z) { return z.real; },
          def: "ℝ : les réels, tous les points de la droite graduée.", defEn: "ℝ: reals, every point of the number line." },
        { id: "C", sym: "ℂ", base: "C", row: 1, has: function () { return true; },
          def: "ℂ : les complexes a + ib, avec i² = −1. Contient tous les autres.", defEn: "ℂ: complex numbers a + ib, with i² = −1. Contains all the others." },
        { id: "D", sym: "𝔻", base: "Q", row: 2, has: function (z) { return z.real && (z.kind === "int" || z.kind === "dec"); },
          def: "𝔻 : les décimaux, un nombre fini de chiffres après la virgule (a/10ⁿ).", defEn: "𝔻: decimals, finitely many digits after the point (a/10ⁿ)." },
        { id: "RQ", sym: "ℝ∖ℚ", base: "R", row: 2, has: function (z) { return z.real && z.kind === "irr"; },
          def: "ℝ∖ℚ : les irrationnels, réels qui ne sont pas un quotient d'entiers (√2, π…).", defEn: "ℝ∖ℚ: irrationals, reals that are not a quotient of integers (√2, π…)." },
        { id: "Rp", sym: "ℝ₊", base: "R", row: 2, has: function (z) { return z.real && z.re >= 0; },
          def: "ℝ₊ : les réels positifs ou nuls.", defEn: "ℝ₊: non-negative reals." },
        { id: "iR", sym: "iℝ", base: "C", row: 2, has: function (z) { return Math.abs(z.re) < 1e-12; },
          def: "iℝ : les imaginaires purs ib (partie réelle nulle). 0 en fait partie.", defEn: "iℝ: pure imaginary numbers ib (zero real part). 0 belongs to it." },
        { id: "U", sym: "𝕌", base: "C", row: 2, has: function (z) { return Math.abs(Math.hypot(z.re, z.im) - 1) < 1e-9; },
          def: "𝕌 : les complexes de module 1, sur le cercle unité (e^(iθ)).", defEn: "𝕌: complex numbers of modulus 1, on the unit circle (e^(iθ))." }
      ];

      // Nombres : valeur (re, im) et nature de la partie réelle (entier,
      // décimal, rationnel, irrationnel). Quelques pièges : √9, −7/2, i².
      var R2 = Math.SQRT2;
      var NUMS = [
        { t: "3", re: 3, im: 0, kind: "int" }, { t: "0", re: 0, im: 0, kind: "int" }, { t: "−4", re: -4, im: 0, kind: "int" },

        { t: "1/3", re: 1 / 3, im: 0, kind: "rat" }, { t: "22/7", re: 22 / 7, im: 0, kind: "rat" }, { t: "−2/3", re: -2 / 3, im: 0, kind: "rat" },
        { t: "√2", re: R2, im: 0, kind: "irr" }, { t: "π", re: Math.PI, im: 0, kind: "irr" }, { t: "−√2", re: -R2, im: 0, kind: "irr" },
        { t: "3i", re: 0, im: 3, kind: "int" }, { t: "i", re: 0, im: 1, kind: "int" }, { t: "i²", re: -1, im: 0, kind: "int" },
        { t: "2 + i", re: 2, im: 1, kind: "int" }, { t: "e^(iπ/3)", re: 0.5, im: Math.sqrt(3) / 2, kind: "dec" },
        { t: "(1 + i)/√2", re: 1 / R2, im: 1 / R2, kind: "irr" }, { t: "−i", re: 0, im: -1, kind: "int" },
        // Écrits avec une fonction : il faut d'abord la calculer
        { t: "ln 1", re: 0, im: 0, kind: "int" }, { t: "e⁰", re: 1, im: 0, kind: "int" }, { t: "cos π", re: -1, im: 0, kind: "int" },
        { t: "√16", re: 4, im: 0, kind: "int" }, { t: "|−5|", re: 5, im: 0, kind: "int" }, { t: "ln e²", re: 2, im: 0, kind: "int" },
        { t: "sin(π/6)", re: 0.5, im: 0, kind: "dec" }, { t: "2⁻¹", re: 0.5, im: 0, kind: "dec" }, { t: "√(1/9)", re: 1 / 3, im: 0, kind: "rat" },
        { t: "cos(π/4)", re: R2 / 2, im: 0, kind: "irr" }, { t: "ln 2", re: Math.LN2, im: 0, kind: "irr" }, { t: "e", re: Math.E, im: 0, kind: "irr" },
        { t: "√(−9)", re: 0, im: 3, kind: "int" }
      ];
      NUMS.forEach(function (z) { z.real = Math.abs(z.im) < 1e-12; });

      function smallestBase(z) {
        if (!z.real) return "C";
        if (z.kind === "irr") return "R";
        if (z.kind === "rat" || z.kind === "dec") return "Q";
        return z.re >= 0 ? "N" : "Z";
      }

      var ensBoxes = [];
      ENS.forEach(function (e) {
        var b = document.createElement("button");
        b.className = "ens-box";
        b.innerHTML = e.sym; // l'étoile de ℕ* en exposant, en haut à droite
        b._e = e;
        var timer = null, longDone = false;
        b.addEventListener("pointerdown", function (ev) {
          ev.preventDefault();
          longDone = false;
          ensTip.hidden = true;
          timer = setTimeout(function () { longDone = true; ensShowTip(e, b); }, 450);
        });
        b.addEventListener("pointerup", function () {
          if (timer) { clearTimeout(timer); timer = null; }
          if (!longDone) ensAnswer(b);
        });
        b.addEventListener("pointerleave", function () { if (timer) { clearTimeout(timer); timer = null; } });
        b.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
        document.getElementById(e.row === 1 ? "ensRow1" : "ensRow2").appendChild(b);
        ensBoxes.push(b);
      });

      function ensShowTip(e, b) {
        if (exam) return;

        ensTip.style.top = (rows.top - rs.top - ensTip.offsetHeight - 8) + "px";

      document.addEventListener("pointerdown", function (ev) {

      });

      function ensStart() {
        // Seuls les nombres et les cases des ensembles cochés dans le menu
        ensBoxes.forEach(function (b) {
          b.hidden = !sets[b._e.base];
          b.classList.remove("in", "bad", "hover");
        });
        var pool = NUMS.filter(function (z) { return sets[smallestBase(z)]; });
        if (!pool.length) pool = NUMS.filter(function (z) { return smallestBase(z) === "N"; });
        var z = pool[Math.floor(Math.random() * pool.length)];
        if (ensState && ensState.z === z && pool.length > 1) z = pool[(pool.indexOf(z) + 1) % pool.length];
        // Deux questions qui alternent : un ensemble qui le contient, ou le
        // plus petit de la chaîne ℕ* ⊂ ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ
        var small = Math.random() < 0.5;
        ensState = { z: z, ready: false, small: small };

        ensNum.classList.remove("drag");
        ensNum.style.left = ensNum.style.top = "";
        ensMsg.textContent = small ? (LANG === "en" ? "The smallest set that contains it?" : "Le plus petit ensemble qui le contient ?")
                                   : (LANG === "en" ? "A set that contains it?" : "Un ensemble qui le contient ?");

      function ensAnswer(b) {

          (ensState.small && smallest ? (LANG === "en" ? " — smallest: " : " — le plus petit : ") + smallest._e.sym : "");

        if (ok) quickNext("ens", ensStart, 1100);
      }

      // Glisser le nombre sur une case
      (function () {
        var drag = null;

          if (!ensState || ensState.ready) return;

          ensNum.style.top = e.clientY + "px";

        }
        ensNum.addEventListener("pointerup", up);
        ensNum.addEventListener("pointercancel", up);
      })();

      // Aucun glissement de page, aucun zoom (iOS ignore user-scalable=no

      document.addEventListener("touchmove", function (e) {

      window.addEventListener("resize", function () {

      // ---------- Historique ----------

      // (le numéro de version affiché dans le menu est la première entrée)
      var VERSIONS = [

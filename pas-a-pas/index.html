<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>Pas à Pas</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Oscilloscope / vieux moniteur — palette fixe, jamais d'ivoire ici
       (voir REGLES-JEUX.md : esthétique par défaut du catalogue) */
    :root {
      --bg: #05100a;
      --bg-soft: #0a1a12;
      --ink: #3be08a;
      --ink-soft: #2a8f5c;
      --hairline: #123322;
      --accent: #6dffb0;
      --accent-soft: rgba(61, 224, 138, 0.16);
      --sign: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, var(--bg-soft), var(--bg) 60%);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 1.4rem 16px 2rem;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    main {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .menu-btn {
      width: 2.1rem;
      height: 2.1rem;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      cursor: pointer;
    }

    .menu-btn:hover, .menu-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

    .menu-panel {
      position: absolute;
      top: 3rem;
      left: 0;
      z-index: 15;
      display: flex;
      flex-direction: column;
      min-width: 10rem;
      background: var(--bg);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      overflow: hidden;
    }

    .menu-item {
      display: block;
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: left;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--hairline);
      padding: 0.8rem 1rem;
      cursor: pointer;
    }

    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover, .menu-item:focus-visible { color: var(--accent); }
    .menu-panel[hidden] { display: none; }

    .back {
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .back:hover { color: var(--accent); }

    .subline {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.3rem;
    }

    .hist-btn {
      font-family: inherit;
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .hist-btn:hover { color: var(--accent); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
      background: rgba(5, 16, 10, 0.95);
    }

    .overlay[hidden] { display: none; }

    .overlay .big {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 300;
      font-size: 1.8rem;
      color: var(--ink);
    }

    .hist-list {
      width: 100%;
      max-width: 22rem;
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
    }

    .hist-list li {
      padding: 0.7rem 0;
      border-top: 1px solid var(--hairline);
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--ink-soft);
    }

    .hist-list li:last-child { border-bottom: 1px solid var(--hairline); }

    .hist-list b {
      display: block;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 0.1rem;
    }

    .btn {
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
    }

    .btn:hover, .btn:focus-visible { background: var(--accent); color: var(--bg); }

    h1 {
      margin: 0;
      font-family: inherit;
      font-weight: 400;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1.2rem 0 0.4rem;
    }

    .tab {
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.55rem 1rem;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { border-color: var(--accent); color: var(--ink); }

    .stage-wrap {
      margin-top: 0.9rem;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
    }

    .stage-top {
      position: relative;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 120px;
      padding: 1.6rem 0.5rem 0.8rem;
      overflow: hidden;
    }

    .stage-wrap.split .stage-top { display: flex; }

    .stage-divider {
      display: none;
      height: 1px;
      background: var(--hairline);
      margin: 0 1.2rem;
    }

    .stage-wrap.split .stage-divider { display: block; }

    /* Dernière étape : plus de séparateur entre les deux rangées — on
       montre directement départ = résultat, même objet, même fond. */
    .stage-wrap.final .stage-divider {
      background: none;
      height: auto;
      margin: 0.2rem 0;
      display: flex;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--accent);
    }
    .stage-wrap.final .stage-divider::after { content: attr(data-sign); }

    .stage-bottom { position: relative; }

    .stage {
      position: relative;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.4rem 0.5rem;
      overflow: hidden;
    }

    .stage-wrap.split .stage {
      min-height: 190px;
      padding: 1.4rem 0.5rem 1.8rem;
    }

    .row-tag {
      position: absolute;
      top: 0.5rem;
      left: 0.7rem;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .stage-wrap.split .row-tag { opacity: 0.65; }

    .dots {
      display: none;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }

    .stage-wrap.split .dots { display: flex; }

    .dots span {
      width: 6px;
      height: 6px;
      border: 1px solid var(--hairline);
      background: transparent;
    }

    .dots span.done { background: var(--ink-soft); border-color: var(--ink-soft); }
    .dots span.now { background: var(--accent); border-color: var(--accent); }
    .dots span.anchor { border-color: var(--accent); }

    .magic {
      margin: 0;
      min-height: 2.4em;
      line-height: 1.35;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--ink-soft);
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .magic.show { opacity: 1; }

    .expr {
      display: flex;
      flex-wrap: nowrap;
      white-space: nowrap;
      align-items: center;
      justify-content: center;
      gap: 0.1em;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 3rem);
      line-height: 1;
      transform-origin: center center;
    }

    .tok {
      display: inline-block;
      padding: 0.08em 0.1em;
      border-radius: 0.2em;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .tok .in { display: inline-block; }
    .tok i { font-style: italic; }
    .tok.op { padding: 0.08em 0.22em; }
    .tok.par { font-weight: 300; }
    .tok.dot { padding: 0.08em 0.05em; }

    .tok.hl {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tok.sign-hl { color: var(--sign); }

    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .frac .row {
      display: flex;
      align-items: center;
      gap: 0.05em;
      padding: 0.05em 0.2em;
    }

    .frac .bar {
      align-self: stretch;
      height: 2px;
      background: var(--ink);
      margin: 0.08em 0;
    }

    /* Soustraction posée : un terme au-dessus de son opposé, une barre,
       comme à l'école — avant de disparaître, on voit d'où vient le 0 */
    .cancel {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      margin: 0 0.12em;
    }

    .cancel .crow {
      display: flex;
      align-items: center;
      gap: 0.05em;
      padding: 0.02em 0.1em;
    }

    .cancel .cbar {
      align-self: stretch;
      height: 2px;
      background: var(--ink);
      margin: 0.06em 0;
    }

    /* Droite des réels : une flèche de 0 vers la valeur. Multiplier par
       −1 la fait tourner d'un demi-tour autour de 0 (démo −×−). */
    .numline {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 12px;
      height: 44px;
      pointer-events: none;
    }

    .numline .axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 14px;
      height: 1px;
      background: var(--ink-soft);
    }

    .numline .tick {
      position: absolute;
      top: 10px;
      width: 1px;
      height: 9px;
      background: var(--ink-soft);
    }

    .numline .lab {
      position: absolute;
      top: 24px;
      transform: translateX(-50%);
      font-size: 0.62rem;
      color: var(--ink-soft);
    }

    .numline .vec {
      position: absolute;
      left: 50%;
      top: 13px;
      height: 3px;
      background: var(--sign);
      transform-origin: 0 50%;
    }

    .numline .vec::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -5px;
      border-left: 9px solid var(--sign);
      border-top: 6.5px solid transparent;
      border-bottom: 6.5px solid transparent;
    }

    .shape {
      width: 0.72em;
      height: 0.72em;
      vertical-align: -0.04em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
    }

    .ghost {
      position: absolute;
      margin: 0;
      pointer-events: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 3rem);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ghost.traveller { color: var(--sign); z-index: 3; }

    /* Méthode de Singapour : cadre de dix (2 × 5 cases), un jeton rond par unité.
       Tracé fin, jamais plein (charte oscilloscope). Négatif = jaune. */
    .cell {
      position: absolute;
      border: 1px solid var(--ink-soft);
      margin: 0 -1px -1px 0;
      pointer-events: none;
      z-index: 1;
    }

    .unit {
      position: absolute;
      border: 1.5px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .unit.neg {
      border-color: var(--sign);
      background: rgba(255, 209, 102, 0.12);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 3.6rem;
      margin-top: 0.4rem;
    }

    .arrow-btn {
      width: 3.2rem;
      height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease, opacity 0.25s ease;
    }

    .arrow-btn.text {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
    }

    .arrow-btn:hover:not(:disabled),
    .arrow-btn:focus-visible { border-color: var(--accent); color: var(--accent); }

    .arrow-btn:disabled { opacity: 0.3; cursor: default; }

    [hidden] { display: none !important; }

    .badge {
      margin-left: auto;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
    }

    /* Chapitre Singapour : défi « faire 10 » avec de vrais jetons à glisser */
    .sg {
      margin-top: 0.9rem;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      padding: 1rem 0 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .sg-eq {
      min-height: 1.2em;
      font-weight: 500;
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      line-height: 1.2;
      color: var(--ink);
    }

    .sg-board {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 260px;
      touch-action: none;
    }

    .sg-cell {
      position: absolute;
      border: 1px solid var(--ink-soft);
      margin: 0 -1px -1px 0;
    }

    .sg-cell.warn { border-color: var(--sign); }

    .sg-dot {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--accent-soft);
      z-index: 2;
    }

    .sg-dot.given { border-color: var(--ink-soft); background: transparent; }
    .sg-dot.free { cursor: grab; touch-action: none; z-index: 3; }
    .sg-dot.drag { z-index: 5; transform: scale(1.15); }

    .sg-streak { display: flex; gap: 0.4rem; }

    .sg-streak span {
      width: 10px;
      height: 10px;
      border: 1px solid var(--hairline);
    }

    .sg-streak span.on { background: var(--accent); border-color: var(--accent); }

    .sg-msg {
      margin: 0;
      min-height: 1.4em;
      font-size: 0.8rem;
      text-align: center;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
      <h1>Pas à Pas</h1>
      <span class="badge" id="badgeChip" title="Badge cadre de dix" hidden>✦ 10</span>
    </header>

    <div class="menu-panel" id="menuPanel" hidden>
      <a class="menu-item" href="../">← Portfolio</a>
      <button class="menu-item" id="histBtn">Historique</button>
      <button class="menu-item" id="badgeReset">Effacer le badge</button>
    </div>

    <div class="overlay" id="histOverlay" hidden>
      <div class="big">Historique</div>
      <ul class="hist-list" id="histList"></ul>
      <button class="btn" id="histClose">Fermer</button>
    </div>

    <div class="tabs" role="tablist" id="tabs"></div>

    <section class="sg" id="sg" hidden>
      <div class="sg-eq" id="sgEq"></div>
      <div class="sg-board" id="sgBoard"></div>
      <div class="sg-streak" id="sgStreak"><span></span><span></span><span></span></div>
      <p class="sg-msg" id="sgMsg"></p>
    </section>

    <div class="stage-wrap" id="stageWrap">
      <div class="stage-top" id="stageTop">
        <span class="row-tag">sauter des étapes</span>
        <p class="magic" id="magic"></p>
        <div class="dots" id="dotsTop"></div>
      </div>
      <div class="stage-divider"></div>
      <div class="stage-bottom">
        <span class="row-tag">pas à pas</span>
        <div class="stage" id="stage"></div>
        <div class="dots" id="dotsBottom"></div>
      </div>
    </div>

    <div class="controls" id="controls">
      <button class="arrow-btn" id="prevBtn" aria-label="Retour">←</button>
      <button class="arrow-btn" id="nextBtn" aria-label="Suivant">→</button>
    </div>
  </main>

  <script>
    (function () {
      // ---------- Données ----------
      // Un jeton : { id, t: contenu HTML, k: classe, from: ids d'origine }
      // Une fraction : { frac: true, num: [jetons], den: [jetons] }
      // fx : animation jouée en arrivant sur l'étape (en avançant seulement)

      function T(id, t, k, from) { return { id: id, t: t, k: k || "", from: from || null }; }
      function F(num, den) { return { frac: true, num: num, den: den }; }
      function V(top, bottom, eq) { return { cancel: true, top: top, bottom: bottom, eq: eq || null }; }

      var X = "<i>x</i>";

      var DEMOS = [
        { title: "Singapour", custom: true, steps: [{ expr: [] }] },
        {
          title: "−( … )",
          split: true,
          steps: [
            {
              top: true,
              expr: [T("m", "−", "op"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              hl: ["m"],
              magic: "« On change les signes à l'intérieur de la parenthèse. »",
              note: "Point de départ, réduit à ce qui compte pour cet exercice : un signe <b>−</b> devant une parenthèse. C'est ici qu'on se trompe le plus souvent."
            },
            {
              expr: [T("m", "(−1)"), T("dot", "·", "op dot"), T("lp", "(", "par"), T("a", "2" + X), T("sb", "−", "op"), T("b", "3"), T("sc", "+", "op"), T("c", X), T("rp", ")", "par")],
              hl: ["m"],
              note: "Soustraire, c'est ajouter l'opposé : <b>− ( … )</b> veut dire <b>+ (−1) · ( … )</b>."
            },
            {
              fx: { type: "touch", src: "m", targets: ["a", "sb", "sc"] },
              instant: ["m2", "m3"],
              expr: [
                T("m", "(−1)"), T("d1", "·", "op dot"), T("lpA", "(", "par"), T("a", "2" + X), T("rpA", ")", "par"),
                T("q1", "+", "op"), T("m2", "(−1)"), T("d2", "·", "op dot"), T("lpB", "(", "par"), T("sb", "−", "op"), T("b", "3"), T("rpB", ")", "par"),
                T("q2", "+", "op"), T("m3", "(−1)"), T("d3", "·", "op dot"), T("lpC", "(", "par"), T("c", X), T("rpC", ")", "par")
              ],
              note: "Le (−1) touche chaque terme séparément : on écrit chaque produit en toutes lettres, sans encore le calculer. Ce n'est pas encore simplifié, juste réparti."
            },
            {
              top: true,
              expr: [T("sa", "−", "op", ["m"]), T("a", "2" + X), T("sb", "+", "op"), T("b", "3"), T("sc", "−", "op", ["m3"]), T("c", X)],
              hl: ["sa", "sb", "sc"],
              note: "Chaque produit se calcule : (−1)·2<i>x</i> = −2<i>x</i>, (−1)·(−3) = +3, (−1)·<i>x</i> = −<i>x</i>. C'est là que la phrase magique prend racine — vraie comme résultat, pas comme méthode."
            },
            {
              expr: [T("sa", "−", "op"), T("a", "2" + X), T("sc", "−", "op"), T("c", X), T("sb", "+", "op"), T("b", "3")],
              hl: ["sa", "a", "sc", "c"],
              note: "On regroupe les <i>x</i> ensemble. Chaque terme voyage <b>avec son signe</b>."
            },
            {
              expr: [T("sa", "−", "op"), T("a", "2" + X), T("sc", "−", "op"), T("c", "1" + X), T("sb", "+", "op"), T("b", "3")],
              hl: ["a", "c"],
              note: "<i>x</i> tout seul, c'est <b>1</b><i>x</i> : le facteur devant <i>x</i> est bien 1, même quand on ne l'écrit pas. Ce sont ces deux facteurs, 2 et 1, qu'on va combiner."
            },
            {
              expr: [T("lp2", "(", "par"), T("sa2", "−", "op"), T("n2", "2"), T("sc2", "−", "op"), T("n1", "1"), T("rp2", ")", "par"), T("xf", X, "", ["a", "c"]), T("sb", "+", "op"), T("b", "3")],
              hl: ["sa2", "n2", "sc2", "n1"],

      // ---------- Éléments ----------

      var stageWrap = document.getElementById("stageWrap");
      var stageTop = document.getElementById("stageTop");
      var stage = document.getElementById("stage");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      var tabsEl = document.getElementById("tabs");

      var demoIndex = 0;
      var cur = 0;
      var busy = false;
      var lastTopStep = null;
      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var SPEED = reduced ? 0.01 : 1;

      function ms(n) { return n * SPEED; }
      function wait(n) { return new Promise(function (r) { setTimeout(r, ms(n)); }); }
      function done(anim) { return anim.finished.catch(function () {}); }

      // ---------- Rendu ----------

      function tokenEl(tok, step) {
        var el = document.createElement("span");
        el.className = "tok " + tok.k;
        el.dataset.id = tok.id;
        if (tok.from) el.dataset.from = tok.from.join(",");
        if (step.hl && step.hl.indexOf(tok.id) >= 0) el.classList.add("hl");
        if (step.signs && step.signs.indexOf(tok.id) >= 0) el.classList.add("sign-hl");
        var inner = document.createElement("span");
        inner.className = "in";
        inner.innerHTML = tok.t;
        el.appendChild(inner);
        return el;
      }

      // plain = true : rendu simple sans surbrillance (utilisé en haut,
      // "écrit normalement" — l'accent visuel appartient au détail du bas)
      // Ne coupe jamais une expression sur deux lignes (illisible) : elle
      // reste sur une seule ligne et se rétrécit dynamiquement, mesurée
      // une fois posée dans la page, pour tenir exactement dans la largeur
      // disponible.
      function fitOneLine(expr, container) {
        expr.style.transform = "scale(1)";
        var avail = container.clientWidth - 16; // petite marge de sécurité
        var w = expr.scrollWidth;
        if (avail > 0 && w > avail) {
          var scale = Math.max(0.42, avail / w);
          expr.style.transform = "scale(" + scale.toFixed(3) + ")";
        }
      }

      function buildExprEl(step, plain) {
        var expr = document.createElement("div");
        expr.className = "expr";
        var forStep = plain ? {} : step;
        step.expr.forEach(function (item) {
          if (item.cancel) {
            var cv = document.createElement("span");
            cv.className = "cancel";
            var topRow = document.createElement("span");
            topRow.className = "crow";
            item.top.forEach(function (t) { topRow.appendChild(tokenEl(t, forStep)); });
            var cbar = document.createElement("span");
            cbar.className = "cbar";
            var botRow = document.createElement("span");
            botRow.className = "crow";
            item.bottom.forEach(function (t) { botRow.appendChild(tokenEl(t, forStep)); });
            cv.appendChild(topRow);
            cv.appendChild(cbar);
            cv.appendChild(botRow);
            expr.appendChild(cv);
            if (item.eq) item.eq.forEach(function (t) { expr.appendChild(tokenEl(t, forStep)); });
          } else if (item.frac) {
            var f = document.createElement("span");
            f.className = "frac";
            var num = document.createElement("span");
            num.className = "row";
            item.num.forEach(function (t) { num.appendChild(tokenEl(t, forStep)); });
            var bar = document.createElement("span");
            bar.className = "bar";
            var den = document.createElement("span");
            den.className = "row";
            item.den.forEach(function (t) { den.appendChild(tokenEl(t, forStep)); });
            f.appendChild(num);
            f.appendChild(bar);
            f.appendChild(den);
            expr.appendChild(f);
          } else {
            expr.appendChild(tokenEl(item, forStep));
          }
        });
        return expr;
      }

      function numLine(v) {
        var nl = document.createElement("div");
        nl.className = "numline";
        var axis = document.createElement("span");
        axis.className = "axis";
        nl.appendChild(axis);
        for (var k = -4; k <= 4; k++) {
          var left = (50 + k * 12.5) + "%";
          var t = document.createElement("span");
          t.className = "tick";
          t.style.left = left;
          nl.appendChild(t);
          if (k % 2 === 0 || Math.abs(k) === 3) {
            var l = document.createElement("span");
            l.className = "lab";
            l.style.left = left;
            l.textContent = k < 0 ? "−" + (-k) : String(k);
            nl.appendChild(l);
          }
        }
        var vec = document.createElement("span");
        vec.className = "vec";
        vec.style.width = (Math.abs(v) * 12.5) + "%";
        vec.style.transform = "rotate(" + (v < 0 ? 180 : 0) + "deg)";
        nl.appendChild(vec);
        return nl;
      }

      function build(step) {
        stage.innerHTML = "";
        var expr = buildExprEl(step, false);
        stage.appendChild(expr);
        fitOneLine(expr, stage);
        if (step.line !== undefined) stage.appendChild(numLine(step.line));
      }

      // Multiplier par −1 : la flèche tourne d'un demi-tour autour de 0,
      // lentement, dans le plan — elle ne « saute » pas de 3 à −3.
      function fxRotate(fx) {
        var vec = stage.querySelector(".numline .vec");
        if (!vec) return Promise.resolve();
        return wait(500).then(function () {
          return done(vec.animate([
            { transform: "rotate(" + fx.from + "deg)" },
            { transform: "rotate(" + fx.to + "deg)" }
          ], { duration: ms(2600), easing: "cubic-bezier(.45,0,.25,1)", fill: "forwards" }));
        }).then(function () { return wait(400); });
      }

      // ---------- Rangée du haut ("écrit normalement") ----------

      var magicEl = document.getElementById("magic");

      function renderTop(step, animate) {
        var old = stageTop.querySelector(".expr");
        var expr = buildExprEl(step, true);
        if (animate && old) {
          stageTop.insertBefore(expr, magicEl);
          fitOneLine(expr, stageTop);
          var target = expr.style.transform || "scale(1)";
          expr.style.opacity = "0";
          var outA = old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(200), easing: "ease-in", fill: "forwards" });
          done(outA).then(function () { old.remove(); });
          requestAnimationFrame(function () {
            done(expr.animate([
              { opacity: 0, transform: target + " translateY(6px)" },
              { opacity: 1, transform: target + " translateY(0)" }
            ], { duration: ms(380), delay: ms(160), easing: "ease-out", fill: "both" }));
          });
        } else {
          if (old) old.remove();
          stageTop.insertBefore(expr, magicEl);
          fitOneLine(expr, stageTop);
        }

        // La « phrase magique » : ce qu'on entend classiquement, pas
        // rigoureux, contrasté avec le détail sans raccourci en dessous.
        magicEl.classList.remove("show");
        setTimeout(function () {
          magicEl.innerHTML = step.magic || "";
          if (step.magic) magicEl.classList.add("show");
        }, animate ? ms(200) : 0);
      }

      function topAnchorStep(demo, to) {
        var anchor = demo.steps[0];
        for (var i = 0; i <= to && i < demo.steps.length; i++) {
          if (demo.steps[i].top) anchor = demo.steps[i];
        }
        return anchor;
      }

      var stageDivider = document.querySelector(".stage-divider");
      var stageTopTag = document.querySelector(".stage-top .row-tag");
      var stageBottomTag = document.querySelector(".stage-bottom .row-tag");

      function updateRowTags(isFinal) {
        if (stageTopTag) stageTopTag.textContent = isFinal ? "départ" : "sauter des étapes";
        if (stageBottomTag) stageBottomTag.textContent = isFinal ? "résultat" : "pas à pas";
      }

      // Aligne la rangée du haut sur l'étape-ancre la plus proche : elle ne
      // bouge qu'à certaines étapes, pendant que le bas détaille tout. À la
      // toute dernière étape, plus de séparateur : le haut revient montrer
      // la formule de départ, le bas montre le résultat — même objet.
      function syncTop(animate) {
        var demo = DEMOS[demoIndex];
        stageWrap.classList.toggle("split", !!demo.split);
        if (!demo.split) { stageWrap.classList.remove("final"); return; }
        var isFinal = cur === demo.steps.length - 1;
        stageWrap.classList.toggle("final", isFinal);
        // Une équation n'est pas égale à sa solution : elle lui est
        // équivalente (mêmes solutions), d'où ⇔ plutôt que =.
        stageDivider.dataset.sign = demo.finalSign || "=";
        updateRowTags(isFinal);
        var anchor = isFinal ? demo.steps[0] : topAnchorStep(demo, cur);
        if (anchor !== lastTopStep) {
          renderTop(anchor, animate);
          lastTopStep = anchor;
        }
      }

      function snapshot() {
        var base = stage.getBoundingClientRect();
        var map = {};
        stage.querySelectorAll(".tok").forEach(function (el) {
          var r = el.getBoundingClientRect();
          map[el.dataset.id] = {
            el: el,
            x: r.left - base.left,
            y: r.top - base.top,
            w: r.width,
            h: r.height,
            html: el.querySelector(".in").innerHTML
          };
        });
        return map;
      }

      function center(s) { return { x: s.x + s.w / 2, y: s.y + s.h / 2 }; }

      function ghostOf(s, extraClass) {
        var g = document.createElement("span");
        g.className = "ghost " + (extraClass || "");
        g.style.left = s.x + "px";
        g.style.top = s.y + "px";
        g.style.width = s.w + "px";
        g.style.height = s.h + "px";
        g.innerHTML = s.html;
        stage.appendChild(g);
        return g;
      }

      // ---------- Effets ----------

      // Le premier exemplaire du signe garde l'identifiant "m" : il migre
      // tout seul via le repositionnement normal (l'étape suivante le place
      // déjà au bon endroit, avec le temps que ça prend). On ne fait donc
      // voyager ici que les copies supplémentaires — une par une, chacune
      // restant posée à l'endroit où elle atterrit, pas de disparition.
      function fxTouch(fx) {
        var snap = snapshot();
        var src = snap[fx.src];
        if (!src) return Promise.resolve();

        // Très lent, volontairement : c'est la troisième fois que la
        // vitesse de cette animation est signalée trop rapide. Chaque −1
        // doit se voir clairement se développer et voyager, pas juste
        // clignoter d'un état à l'autre.
        var extraTargets = fx.targets.slice(1);
        var chain = wait(700);
        extraTargets.forEach(function (id) {
          var t = snap[id];
          if (!t) return;
          chain = chain.then(function () {
            var g = ghostOf(src, "traveller");
            g.innerHTML = "−1";
            var to = {
              x: center(t).x - center(src).x,
              y: t.y - src.y - src.h * 0.75
            };
            var mid = { x: to.x * 0.5, y: Math.min(0, to.y) - 44 };
            var a = g.animate([
              { transform: "translate(0,0) scale(0.7)" },
              { transform: "translate(" + mid.x + "px," + mid.y + "px) scale(0.7)" },
              { transform: "translate(" + to.x + "px," + to.y + "px) scale(0.7)" }
            ], { duration: ms(2200), easing: "ease-in-out", fill: "forwards" });
            // Le fantôme reste affiché, posé à l'arrivée — il ne s'efface
            // pas : c'est lui qui deviendra visuellement le jeton final.
            return done(a).then(function () {
              var hit = t.el.animate([
                { transform: "scale(1)", color: "var(--ink)" },
                { transform: "scale(1.3)", color: "var(--sign)" },
                { transform: "scale(1)", color: "var(--sign)" }
              ], { duration: ms(700), easing: "ease-out", fill: "forwards" });
              return done(hit);
            }).then(function () { return wait(800); });
          });
        });

        return chain.then(function () { return wait(250); });
      }

      // Méthode de Singapour (programme MOE, P1) : addition par le « cadre
      // de dix » — deux rangées de 5 cases. Chaque nombre part de son jeton
      // en jetons ronds qui remplissent les cases, dans l'ordre ; le second
      // nombre vient compléter les cases vides (« faire 10 » quand ça
      // déborde, cadre suivant). La structure 5 + 5 se lit sans compter.
      // Ne gère que des nombres de même signe (pas d'annulation ici).
      function fxBlocks(blocks, snap, cx, units) {
        var cell = 22, dot = 14, apart = 12;
        var rows = blocks.map(function (b) { return { b: b, p: snap[b.id] }; })
          .filter(function (r) { return r.p; });
        if (!rows.length) return Promise.resolve();

        var total = 0;
        rows.forEach(function (r) { total += Math.abs(r.b.n); });
        var frames = Math.max(1, Math.ceil(total / 10));
        var fw = cell * 5;
        var left0 = cx - (frames * fw + (frames - 1) * apart) / 2;
        var y0 = 0;
        rows.forEach(function (r) { y0 = Math.max(y0, r.p.y + r.p.h); });
        var top = y0 + 18;

        function slot(k) {
          var f = Math.floor(k / 10), r = Math.floor((k % 10) / 5), c = k % 5;
          return { x: left0 + f * (fw + apart) + c * cell + cell / 2, y: top + r * cell + cell / 2 };
        }

        // 1. Le cadre apparaît, vide
        var appear = [];
        for (var k = 0; k < frames * 10; k++) {
          var s = slot(k);
          var c = document.createElement("span");
          c.className = "cell";
          c.style.left = (s.x - cell / 2) + "px";
          c.style.top = (s.y - cell / 2) + "px";
          c.style.width = cell + "px";
          c.style.height = cell + "px";
          stage.appendChild(c);
          units.push({ el: c, x: s.x, y: s.y, at: "translate(0,0)" });
          appear.push(done(c.animate([{ opacity: 0 }, { opacity: 1 }],
            { duration: ms(500), easing: "ease-out", fill: "backwards" })));
        }

        // 2. Chaque nombre part de son jeton et remplit les cases suivantes
        var next = 0;
        var chain = Promise.all(appear).then(function () { return wait(300); });
        rows.forEach(function (r) {
          var n = Math.abs(r.b.n);
          var first = next;
          next += n;
          chain = chain.then(function () {
            var from = center(r.p);
            var flights = [];
            for (var i = 0; i < n; i++) {
              var s = slot(first + i);
              var el = document.createElement("span");
              el.className = "unit" + (r.b.n < 0 ? " neg" : "");
              el.style.left = (s.x - dot / 2) + "px";
              el.style.top = (s.y - dot / 2) + "px";
              el.style.width = dot + "px";
              el.style.height = dot + "px";
              stage.appendChild(el);
              units.push({ el: el, x: s.x, y: s.y, at: "translate(0,0)" });
              flights.push(done(el.animate([
                { transform: "translate(" + (from.x - s.x) + "px," + (from.y - s.y) + "px) scale(0.3)", opacity: 0 },
                { transform: "translate(0,0) scale(1)", opacity: 1 }
              ], { duration: ms(700), delay: ms(320 * i), easing: "cubic-bezier(.3,1.2,.5,1)", fill: "backwards" })));
            }
            return Promise.all(flights).then(function () { return wait(600); });
          });
        });

        return chain.then(function () { return wait(900); });
      }

      function fxMeet(fx, vanished) {
        var snap = snapshot();
        var parts = fx.ids.map(function (id) { return snap[id]; }).filter(Boolean);
        if (!parts.length) return Promise.resolve();
        var cx = 0, cy = 0;
        parts.forEach(function (p) { var c = center(p); cx += c.x; cy += c.y; });
        cx /= parts.length; cy /= parts.length;

        parts.forEach(function (p) { p.el.classList.add("hl"); });

        var units = [];
        var pre = wait(350);
        if (fx.blocks && hasBadge()) pre = pre.then(function () { return fxBlocks(fx.blocks, snap, cx, units); });

        return pre.then(function () {
          // Les carrés rejoignent le point de fusion en même temps que les
          // jetons : c'est de là que sort le résultat.
          units.forEach(function (u) {
            var a = u.el.animate([
              { transform: u.at, opacity: 1 },
              { transform: "translate(" + (cx - u.x) + "px," + (cy - u.y) + "px) scale(0.2)", opacity: 0 }
            ], { duration: ms(650), easing: "ease-in", fill: "forwards" });
            done(a).then(function () { u.el.remove(); });
          });
          var anims = parts.map(function (p) {
            var c = center(p);
            vanished[p.el.dataset.id] = true;
            return done(p.el.animate([
              { transform: "translate(0,0) scale(1)", opacity: 1 },
              { transform: "translate(" + (cx - c.x) * 0.85 + "px," + (cy - c.y) * 0.85 + "px) scale(0.9)", opacity: 1, offset: 0.7 },
              { transform: "translate(" + (cx - c.x) + "px," + (cy - c.y) + "px) scale(0.3)", opacity: 0 }
            ], { duration: ms(650), easing: "ease-in", fill: "forwards" }));
          });
          return Promise.all(anims);
        });
      }

      // ---------- Transition entre deux étapes ----------

      function transition(to, forward) {
        var demo = DEMOS[demoIndex];
        var step = demo.steps[to];
        var vanished = {};
        var pre = Promise.resolve();

        if (forward && step.fx) {
          if (step.fx.type === "touch") pre = fxTouch(step.fx);
          if (step.fx.type === "meet") pre = fxMeet(step.fx, vanished);
          if (step.fx.type === "rotate") pre = fxRotate(step.fx);
        }

        return pre.then(function () {
          var old = snapshot();
          build(step);
          // Les fantômes du glissement du signe restent posés jusqu'ici :
          // le vrai jeton est maintenant en place au même endroit, donc on
          // les retire sans qu'aucune image double soit jamais visible.
          stage.querySelectorAll(".ghost.traveller").forEach(function (g) { g.remove(); });
          var neu = snapshot();
          var anims = [];

          Object.keys(neu).forEach(function (id) {
            var n = neu[id];
            var o = old[id];
            if (o && !vanished[id]) {
              var dx = o.x - n.x, dy = o.y - n.y;
              if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                anims.push(done(n.el.animate([
                  { transform: "translate(" + dx + "px," + dy + "px)" },
                  { transform: "translate(0,0)" }
                ], { duration: ms(650), easing: "cubic-bezier(.5,0,.2,1)" })));
              }
              if (o.html !== n.html) {
                anims.push(done(n.el.querySelector(".in").animate([
                  { transform: "rotateX(90deg)", opacity: 0.2 },
                  { transform: "rotateX(0deg)", opacity: 1 }
                ], { duration: ms(450), easing: "ease-out" })));
              }
            } else if (step.instant && step.instant.indexOf(id) >= 0) {
              // Déjà amené en place par le glissement du signe (ghost) :
              // apparaît directement, sans reprendre une deuxième animation.
            } else {
              var from = forward && n.el.dataset.from
                ? n.el.dataset.from.split(",").map(function (f) { return old[f]; }).filter(Boolean)
                : [];
              if (from.length) {
                var fx = 0, fy = 0;
                from.forEach(function (f) { var c = center(f); fx += c.x; fy += c.y; });
                fx /= from.length; fy /= from.length;
                var c = center(n);
                anims.push(done(n.el.animate([
                  { transform: "translate(" + (fx - c.x) + "px," + (fy - c.y) + "px) scale(0.4)", opacity: 0 },
                  { transform: "translate(0,0) scale(1)", opacity: 1 }
                ], { duration: ms(600), easing: "cubic-bezier(.3,1.4,.5,1)" })));
              } else {
                anims.push(done(n.el.animate([
                  { transform: "scale(0.5)", opacity: 0 },
                  { transform: "scale(1)", opacity: 1 }
                ], { duration: ms(450), delay: ms(200), easing: "ease-out", fill: "backwards" })));
              }
            }
          });

          // Jetons qui disparaissent sans effet : fondu sur place
          Object.keys(old).forEach(function (id) {
            if (neu[id] || vanished[id]) return;
            var g = ghostOf(old[id]);
            anims.push(done(g.animate([
              { transform: "scale(1)", opacity: 1 },
              { transform: "scale(0.6)", opacity: 0 }
            ], { duration: ms(400), easing: "ease-in", fill: "forwards" })).then(function () { g.remove(); }));
          });

          return Promise.all(anims);
        });
      }

      // ---------- Navigation ----------

      var dotsTopEl = document.getElementById("dotsTop");
      var dotsBottomEl = document.getElementById("dotsBottom");

      function buildDots(demo) {
        dotsBottomEl.innerHTML = "";
        demo.steps.forEach(function (s) {
          var d = document.createElement("span");
          if (s.top) d.classList.add("anchor");
          dotsBottomEl.appendChild(d);
        });
        dotsTopEl.innerHTML = "";
        demo.steps.forEach(function (s) {
          if (!s.top) return;
          dotsTopEl.appendChild(document.createElement("span"));
        });
      }

      function updateDots(demo, to) {
        var bDots = dotsBottomEl.children;
        for (var i = 0; i < bDots.length; i++) {
          bDots[i].classList.toggle("done", i < to);
          bDots[i].classList.toggle("now", i === to);
        }
        var anchorIdx = -1, seen = 0;
        for (var j = 0; j <= to && j < demo.steps.length; j++) {
          if (demo.steps[j].top) { anchorIdx = seen; seen++; }
        }
        var tDots = dotsTopEl.children;
        for (var k = 0; k < tDots.length; k++) {
          tDots[k].classList.toggle("done", k < anchorIdx);
          tDots[k].classList.toggle("now", k === anchorIdx);
        }
      }

      function refreshUi() {
        var demo = DEMOS[demoIndex];
        var last = demo.steps.length - 1;
        // Jamais désactivées : ← au tout début boucle vers la fin, → à la
        // fin boucle vers le début — de quoi comparer départ/résultat en
        // aller-retour sans rester bloqué à un bout.
        prevBtn.disabled = busy;
        nextBtn.disabled = busy;
        nextBtn.textContent = cur === last ? "FIN" : "→";
        nextBtn.classList.toggle("text", cur === last);
        nextBtn.setAttribute("aria-label", cur === last ? "Revenir au début" : "Suivant");
        if (demo.split) updateDots(demo, cur);
      }

      function go(to) {
        var demo = DEMOS[demoIndex];
        if (busy || to < 0 || to >= demo.steps.length || to === cur) return;
        var forward = to === cur + 1;
        busy = true;
        cur = to;
        refreshUi();
        syncTop(true);
        transition(to, forward).then(function () {
          busy = false;
          refreshUi();
        });
      }

      function next() {
        var last = DEMOS[demoIndex].steps.length - 1;
        if (cur === last) {
          if (busy) return;
          cur = 0;
          build(DEMOS[demoIndex].steps[0]);
          refreshUi();
          syncTop(true);
        } else {
          go(cur + 1);
        }
      }

      function prev() {
        var demo = DEMOS[demoIndex];
        if (busy) return;
        if (cur === 0) {
          // Boucle vers la fin : voir le résultat, revenir au départ, sans
          // jamais rester coincé à une extrémité.
          go(demo.steps.length - 1);
        } else {
          go(cur - 1);
        }
      }

      function selectDemo(i) {
        if (busy) return;
        demoIndex = i;
        cur = 0;
        lastTopStep = null;
        tabsEl.querySelectorAll(".tab").forEach(function (t, k) {
          t.setAttribute("aria-selected", k === i ? "true" : "false");
        });
        var custom = !!DEMOS[i].custom;
        sgEl.hidden = !custom;
        stageWrap.hidden = custom;
        document.getElementById("controls").hidden = custom;
        if (custom) { sgStart(); return; }
        buildDots(DEMOS[i]);
        build(DEMOS[i].steps[0]);
        refreshUi();
        syncTop(false);
      }

      DEMOS.forEach(function (d, i) {
        var b = document.createElement("button");
        b.className = "tab";
        b.setAttribute("role", "tab");
        b.textContent = d.title;
        b.addEventListener("click", function () { selectDemo(i); });
        tabsEl.appendChild(b);
      });

      nextBtn.addEventListener("click", next);
      prevBtn.addEventListener("click", prev);

      document.addEventListener("keydown", function (e) {
        if (DEMOS[demoIndex].custom) return;
        if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
        if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
      });

      // ---------- Badge « cadre de dix » ----------
      // Gagné dans le chapitre Singapour. Tant qu'on ne l'a pas, les
      // additions des autres démos se font sans jetons ; une fois gagné,
      // le cadre de dix réapparaît sous chaque addition pour rappeler
      // visuellement 7 + 5 = 5 + 2 + 5 = 10 + 2.

      var BADGE_KEY = "pasapas_badge_dix";
      var badgeChip = document.getElementById("badgeChip");

      function hasBadge() {
        try { return localStorage.getItem(BADGE_KEY) === "1"; } catch (e) { return false; }
      }

      function setBadge(on) {
        try {
          if (on) localStorage.setItem(BADGE_KEY, "1");
          else localStorage.removeItem(BADGE_KEY);
        } catch (e) {}
        badgeChip.hidden = !hasBadge();
      }

      document.getElementById("badgeReset").addEventListener("click", function () {
        closeMenu();
        setBadge(false);
        sgStreakN = 0;
        sgRenderStreak();
      });

      // ---------- Chapitre Singapour : défi « faire 10 » ----------
      // Programme MOE (P1) : addition dans 20 par « make ten » sur des
      // cadres de dix. Le premier nombre est déjà posé ; on glisse soi-même
      // les jetons du second. Règle : on remplit la dizaine avant d'en
      // commencer une autre — un jeton lâché dans le 2e cadre trop tôt
      // revient. 3 réussites de suite sans erreur = badge.

      var sgEl = document.getElementById("sg");
      var sgEq = document.getElementById("sgEq");
      var sgBoard = document.getElementById("sgBoard");
      var sgMsg = document.getElementById("sgMsg");
      var SG_CELL = 36;
      var sgStreakN = 0;
      var sgState = null;

      function sgRenderStreak() {
        var d = document.getElementById("sgStreak").children;
        for (var i = 0; i < d.length; i++) d[i].classList.toggle("on", i < sgStreakN);
      }

      function sgSlot(k) {
        var f = Math.floor(k / 10), r = Math.floor((k % 10) / 5), c = k % 5;
        var left = (sgBoard.clientWidth - 5 * SG_CELL) / 2;
        return { x: left + c * SG_CELL + SG_CELL / 2, y: 12 + f * (2 * SG_CELL + 14) + r * SG_CELL + SG_CELL / 2 };
      }

      function sgPlace(el, x, y) {
        var d = SG_CELL - 10;
        el.style.width = d + "px";
        el.style.height = d + "px";
        el.style.left = (x - d / 2) + "px";
        el.style.top = (y - d / 2) + "px";
      }

      function sgStart() {
        var a = 6 + Math.floor(Math.random() * 4);           // 6..9
        var bMin = 11 - a;                                     // dépasse 10
        var b = bMin + Math.floor(Math.random() * (10 - bMin)); // ..9
        sgState = { a: a, b: b, filled: {}, placed: 0, mistake: false, done: false };
        sgBoard.innerHTML = "";
        sgEq.textContent = a + " + " + b;
        sgMsg.textContent = "";
        sgRenderStreak();
        badgeChip.hidden = !hasBadge();

        for (var k = 0; k < 20; k++) {
          var s = sgSlot(k);
          var c = document.createElement("span");
          c.className = "sg-cell";
          c.dataset.k = k;
          c.style.left = (s.x - SG_CELL / 2) + "px";
          c.style.top = (s.y - SG_CELL / 2) + "px";
          c.style.width = SG_CELL + "px";
          c.style.height = SG_CELL + "px";
          sgBoard.appendChild(c);
        }
        for (var i = 0; i < a; i++) {
          var g = document.createElement("span");
          g.className = "sg-dot given";
          var gs = sgSlot(i);
          sgPlace(g, gs.x, gs.y);
          sgBoard.appendChild(g);
          sgState.filled[i] = true;
        }
        // Le second nombre attend dans la réserve, sous les cadres
        var trayY = sgSlot(10).y + 2 * SG_CELL + 20;
        var gap = Math.min(SG_CELL, (sgBoard.clientWidth - 20) / b);
        var trayLeft = sgBoard.clientWidth / 2 - (b - 1) * gap / 2;
        for (var j = 0; j < b; j++) {
          var dot = document.createElement("span");
          dot.className = "sg-dot free";
          var home = { x: trayLeft + j * gap, y: trayY };
          sgPlace(dot, home.x, home.y);
          sgBoard.appendChild(dot);
          sgDraggable(dot, home);
        }
      }

      function sgDraggable(dot, home) {
        var start = null;
        dot.addEventListener("pointerdown", function (e) {
          if (!sgState || sgState.done || dot.dataset.k) return;
          e.preventDefault();
          dot.setPointerCapture(e.pointerId);
          dot.classList.add("drag");
          var r = sgBoard.getBoundingClientRect();
          start = { ox: r.left, oy: r.top };
        });
        dot.addEventListener("pointermove", function (e) {
          if (!start) return;
          sgPlace(dot, e.clientX - start.ox, e.clientY - start.oy);
        });
        function drop(e) {
          if (!start) return;
          var x = e.clientX - start.ox, y = e.clientY - start.oy;
          start = null;
          dot.classList.remove("drag");
          var best = -1, bestD = SG_CELL * 0.8;
          for (var k = 0; k < 20; k++) {
            if (sgState.filled[k]) continue;
            var s = sgSlot(k);
            var d = Math.hypot(s.x - x, s.y - y);
            if (d < bestD) { bestD = d; best = k; }
          }
          var firstFull = true;
          for (var i = 0; i < 10; i++) if (!sgState.filled[i]) firstFull = false;
          if (best < 0 || (best >= 10 && !firstFull)) {
            if (best >= 10) sgWrong();
            sgPlace(dot, home.x, home.y);
            dot.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }],
              { duration: ms(260) });
            return;
          }
          var s = sgSlot(best);
          sgPlace(dot, s.x, s.y);
          dot.dataset.k = best;
          dot.classList.remove("free");
          sgState.filled[best] = true;
          sgState.placed++;
          if (sgState.placed === sgState.b) sgWin();
        }
        dot.addEventListener("pointerup", drop);
        dot.addEventListener("pointercancel", drop);
      }

      // Jeton lâché dans la 2e dizaine alors que la 1re n'est pas pleine :
      // la 1re s'allume en jaune, le jeton revient, la série repart de 0.
      function sgWrong() {
        sgState.mistake = true;
        sgStreakN = 0;
        sgRenderStreak();
        var cells = sgBoard.querySelectorAll(".sg-cell");
        for (var i = 0; i < 10; i++) cells[i].classList.add("warn");
        setTimeout(function () {
          for (var i = 0; i < 10; i++) cells[i].classList.remove("warn");
        }, ms(900));
      }

      function sgWin() {
        sgState.done = true;
        var a = sgState.a, b = sgState.b, fill = 10 - a, rest = b - fill;
        var seq = [
          a + " + " + fill + " + " + rest,
          "10 + " + rest,
          String(a + b)
        ];
        var chain = wait(500);
        seq.forEach(function (txt) {
          chain = chain.then(function () {
            sgEq.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: ms(400) });
            sgEq.textContent = txt;
            return wait(1300);
          });
        });
        chain.then(function () {
          if (!sgState.mistake) sgStreakN = Math.min(3, sgStreakN + 1);
          sgRenderStreak();
          if (sgStreakN >= 3 && !hasBadge()) {
            setBadge(true);
            sgMsg.textContent = "✦ 10";
            badgeChip.animate([{ transform: "scale(1.6)" }, { transform: "scale(1)" }], { duration: ms(700), easing: "ease-out" });
            return wait(1800);
          }
          return wait(600);
        }).then(function () {
          if (DEMOS[demoIndex].custom) sgStart();
        });
      }

      badgeChip.hidden = !hasBadge();

      // ---------- Historique ----------

      var VERSIONS = [
        { v: "v8", text: "Chapitre Singapour : défi « faire 10 » — on glisse soi-même les jetons dans des cadres de dix, la première dizaine avant la seconde. 3 réussites de suite débloquent le badge ✦ 10, qui fait apparaître le cadre de dix sous les additions des autres démos (7 + 5 = 10 + 2 dans Opposés)." },
        { v: "v7", text: "Nouvelles démos : Piège ((x + 3)/3 ≠ x), −×− (multiplier par −1 = demi-tour sur la droite des réels), Distribuer / Factoriser avec des formes (rond, carré) sans texte, Équation (le même geste des deux côtés)." },
        { v: "v6", text: "Méthode de Singapour : au moment où deux nombres fusionnent (2 + 5, (−2) + (−1)), un cadre de dix (2 rangées de 5, comme à Singapour) apparaît et chaque nombre vient le remplir de jetons, puis tout se referme sur le résultat. Jetons jaunes = négatifs." },
        { v: "v5", text: "Distribution du −1 terme par terme, écrite en toutes lettres (−1)·(terme), avant de la simplifier. Phrases magiques sur la ligne du haut. Contrôles réduits à deux flèches." },
        { v: "v4", text: "Écran scindé écrit / détail sur la démo −( … ) : le haut montre la formule telle qu'on l'écrit à la main, le bas ne saute aucune étape. Retrait des commentaires sous l'animation." },
        { v: "v3", text: "Ajout au menu du portfolio." },
        { v: "v2", text: "Trois démos : −( … ), Opposés, Fraction." },
        { v: "v1", text: "Page d'essai créée." }
      ];

      var histBtn = document.getElementById("histBtn");
      var histOverlay = document.getElementById("histOverlay");
      var histList = document.getElementById("histList");
      var histClose = document.getElementById("histClose");

      VERSIONS.forEach(function (entry) {
        var li = document.createElement("li");
        var b = document.createElement("b");
        b.textContent = entry.v;
        li.appendChild(b);
        li.appendChild(document.createTextNode(entry.text));
        histList.appendChild(li);
      });

      histBtn.addEventListener("click", function () {
        closeMenu();
        histOverlay.hidden = false;
      });
      histClose.addEventListener("click", function () { histOverlay.hidden = true; });

      // ---------- Menu (☰) ----------

      var menuBtn = document.getElementById("menuBtn");
      var menuPanel = document.getElementById("menuPanel");

      function closeMenu() {
        menuPanel.hidden = true;
        menuBtn.setAttribute("aria-expanded", "false");
      }

      menuBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = menuPanel.hidden;
        menuPanel.hidden = !open;
        menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
      });

      document.addEventListener("click", function (e) {
        if (!menuPanel.hidden && !menuPanel.contains(e.target) && e.target !== menuBtn) closeMenu();
      });

      selectDemo(0);
    })();
  </script>

  <script>
    // Mise à jour automatique (même principe que la page d'accueil du
    // portfolio) : aucune progression n'est encore sauvegardée ici, donc
    // rien à perdre en rechargeant dès qu'une nouvelle version est en ligne.
    // Le paramètre anti-cache dans l'URL de vérification est nécessaire :
    // un simple `cache: 'no-store'` n'empêche que la mise en cache locale
    // du navigateur, pas celle du CDN devant GitHub Pages, qui peut renvoyer
    // une réponse périmée même à une requête "no-store".
    (function () {
      var PAGE = "pas-a-pas";
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return; // évite les rafales de clics
        lastCheck = now0;
        try {
          var url = (location.pathname || "index.html") + "?_cb=" + now0;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          var tag = res.headers.get("etag") || res.headers.get("last-modified");
          if (!tag) return;
          var key = "pm_pageVersion_" + PAGE;
          var stored = localStorage.getItem(key);
          if (stored === null) { localStorage.setItem(key, tag); return; }
          if (tag !== stored) {
            var now = Date.now();
            var guard = "pm_lastUpdateReload_" + PAGE;
            var lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem(guard)) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try {
              localStorage.setItem(key, tag);
              sessionStorage.setItem(guard, String(now));
            } catch (e) {}
            location.replace(location.pathname + "?_r=" + now);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>

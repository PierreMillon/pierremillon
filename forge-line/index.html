<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forge Line — prototype</title>
<style>
  :root{ --topbar-h:52px; --bottombar-h:64px; }
  html,body{margin:0;height:100%;background:#e8dfc8;color:#3a3529;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}

  #topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;background:#00000012;z-index:6}
  #menu-btn{margin-left:10px;width:38px;height:38px;border-radius:8px;border:1px solid #00000030;background:#00000010;color:#3a3529;font-size:18px;line-height:1;cursor:pointer}

  #bottombar{position:fixed;bottom:0;left:0;right:0;height:var(--bottombar-h);display:flex;align-items:center;justify-content:center;background:#00000012;z-index:6}
  #hud{font-size:14px;line-height:1.4;text-align:center}

  #stage{position:fixed;top:var(--topbar-h);bottom:var(--bottombar-h);left:0;right:0;overflow:hidden;background:#e8dfc8}
  canvas{display:block;touch-action:none;background:#e8dfc8}

  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000000cc;color:#f3efe2;font-size:28px;z-index:9}

  /* contrôles tactiles */
  #touchpad{display:none}
  .btn{position:fixed;width:66px;height:66px;border-radius:50%;background:#00000022;border:1px solid #00000033;color:#3a3529;font-size:24px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;z-index:7}
  .btn:active{background:#00000044}
  #act-repair{right:22px;bottom:calc(var(--bottombar-h) + 20px)}

  #joyzone{display:none;position:fixed;left:0;top:var(--topbar-h);bottom:var(--bottombar-h);width:55%;z-index:3;touch-action:none}
  #joy-base,#joy-knob{display:none;position:fixed;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:4}
  #joy-base{width:88px;height:88px;background:#00000018;border:1px solid #00000030}
  #joy-knob{width:40px;height:40px;background:#00000040}

  @media (hover:none) and (pointer:coarse){
    #touchpad{display:block}
    #joyzone{display:block}
  }
</style>
</head>
<body>

<div id="topbar">
  <button id="menu-btn" aria-label="Menu">☰</button>
</div>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="joyzone"></div>
  <div id="joy-base"></div>
  <div id="joy-knob"></div>
  <div id="touchpad">
    <div class="btn" id="act-repair">🔧</div>
  </div>
  <div id="over"><div id="overText"></div></div>
</div>

<div id="bottombar">
  <div id="hud">
    Or : <span id="gold">0</span> —
    Vague : <span id="wave">1</span> —
    Brèches : <span id="breach">0</span>/10
  </div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const GX = 10, GY = 9; // grille logique servant au placement (tours/joueur), jamais dessinée

// tout le jeu tourne en pixels écran (CSS px) ; la grille isométrique ne sert
// qu'à ancrer visuellement les objets posés (tours, joueur) — les ennemis et
// projectiles se déplacent directement dans cet espace-là.
let TW = 64, TH = 32, originX = 0, originY = 24;
let STAGE_W = 0, STAGE_H = 0;
let PLAYER_RANGE_PX, TOWER_RANGE_PX, CONTACT_RANGE_PX, ATTACKER_STOP_PX, SHOT_SPEED_PX;

function toScreen(gx, gy){
  return { x: originX + (gx-gy)*TW/2, y: originY + (gx+gy)*TH/2 };
}
// point au sol (front) d'une case, où un objet posé "touche" le sol
function groundPoint(gx, gy){
  const p = toScreen(gx, gy);
  return { x: p.x, y: p.y + TH };
}
function screenToGrid(x, y){
  const a = (x - originX) / (TW/2);
  const b = (y - originY) / (TH/2);
  return { gx: Math.round((a+b)/2), gy: Math.round((b-a)/2) };
}
function clientToStage(clientX, clientY){
  const rect = cv.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const rect = stage.getBoundingClientRect();
  STAGE_W = rect.width; STAGE_H = rect.height;
  cv.width = Math.round(STAGE_W * dpr);
  cv.height = Math.round(STAGE_H * dpr);
  cv.style.width = STAGE_W + 'px';
  cv.style.height = STAGE_H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // on dessine ensuite en pixels CSS

  const marginX = 30;
  const fitTW = (STAGE_W - marginX*2) / (GX + GY - 2) * 2;
  TW = Math.max(20, Math.min(64, isFinite(fitTW) ? fitTW : 64));
  TH = TW / 2;
  originX = STAGE_W / 2;
  originY = 24;

  PLAYER_RANGE_PX = TW * 3.5;
  TOWER_RANGE_PX = TW * 2.5;
  CONTACT_RANGE_PX = TW * 0.5;
  ATTACKER_STOP_PX = TW * 0.55;
  SHOT_SPEED_PX = TW * 0.14;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const grid = {}; // "x,y" -> {type:'tower', hp, maxHp, lastShotAt}
function key(x,y){ return x+','+y; }

const player = { gx: Math.floor(GX/2), gy: GY-1, moveCooldown: 0 };
let gold = 0, wave = 1, breaches = 0, gameOver = false;
let enemies = [];
let projectiles = [];
let spawnTimer = 0, spawnInterval = 90, enemiesThisWave = 5, spawned = 0;
let goldTimer = 0;
let lastShotAt = 0;
const SHOT_INTERVAL_MS = 1000;
const PLAYER_DMG = 12;
const BASE_ENEMY_HP = 12;
const WAVE_GROWTH = 1.2; // chaque vague est 20% plus forte que la précédente

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function isControl(el){ return el && el.closest && el.closest('.btn, #topbar, #bottombar'); }

function tryBuildAt(gx, gy){
  if (gx < 0 || gx >= GX || gy < 0 || gy >= GY) return;
  const k = key(gx, gy);
  if (grid[k]) return;
  if (gold < 10) return;
  gold -= 10;
  grid[k] = { type:'tower', hp:30, maxHp:30, lastShotAt:0 };
}
function tryRepair(){
  const t = grid[key(player.gx, player.gy)];
  if (t && t.hp < t.maxHp) t.hp = Math.min(t.maxHp, t.hp + 0.4);
}

// construire : double-clic (souris) ou double-tap (tactile), n'importe où sur la carte
document.addEventListener('dblclick', e => {
  if (isControl(e.target)) return;
  const s = clientToStage(e.clientX, e.clientY);
  const { gx, gy } = screenToGrid(s.x, s.y);
  tryBuildAt(gx, gy);
});
let lastTap = { time: 0, x: 0, y: 0 };
document.addEventListener('touchend', e => {
  if (isControl(e.target)) return;
  const t = e.changedTouches[0];
  const now = Date.now();
  const dt = now - lastTap.time;
  const dist = Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y);
  if (dt < 300 && dist < 30){
    const s = clientToStage(t.clientX, t.clientY);
    const { gx, gy } = screenToGrid(s.x, s.y);
    tryBuildAt(gx, gy);
    lastTap = { time: 0, x: 0, y: 0 };
  } else {
    lastTap = { time: now, x: t.clientX, y: t.clientY };
  }
}, { passive:true });

window.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'b') tryBuildAt(player.gx, player.gy); });

document.getElementById('act-repair').addEventListener('touchstart', ev => { ev.preventDefault(); keys['r'] = true; });
document.getElementById('act-repair').addEventListener('touchend', ev => { ev.preventDefault(); keys['r'] = false; });
document.getElementById('act-repair').addEventListener('touchcancel', ev => { ev.preventDefault(); keys['r'] = false; });

// menu : réservé pour plus tard (pause, options...)
document.getElementById('menu-btn').addEventListener('click', () => {});

// joystick tactile transparent : apparaît là où le doigt touche la zone gauche
const joyzone = document.getElementById('joyzone');
const joyBase = document.getElementById('joy-base');
const joyKnob = document.getElementById('joy-knob');
let joyActive = false, joyOriginX = 0, joyOriginY = 0;
const JOY_RADIUS = 40, JOY_DEADZONE = 12;

function joyStart(x, y){
  joyActive = true; joyOriginX = x; joyOriginY = y;
  joyBase.style.left = x+'px'; joyBase.style.top = y+'px'; joyBase.style.display = 'block';
  joyKnob.style.left = x+'px'; joyKnob.style.top = y+'px'; joyKnob.style.display = 'block';
}
function joyMove(x, y){
  if (!joyActive) return;
  const dx = x-joyOriginX, dy = y-joyOriginY;
  const dist = Math.hypot(dx, dy);
  const clamped = Math.min(dist, JOY_RADIUS);
  const angle = Math.atan2(dy, dx);
  joyKnob.style.left = (joyOriginX + Math.cos(angle)*clamped)+'px';
  joyKnob.style.top = (joyOriginY + Math.sin(angle)*clamped)+'px';

  keys['arrowup'] = keys['arrowdown'] = keys['arrowleft'] = keys['arrowright'] = false;
  if (dist > JOY_DEADZONE){
    const deg = angle*180/Math.PI;
    if (deg > -45 && deg <= 45) keys['arrowright'] = true;
    else if (deg > 45 && deg <= 135) keys['arrowdown'] = true;
    else if (deg > -135 && deg <= -45) keys['arrowup'] = true;
    else keys['arrowleft'] = true;
  }
}
function joyEnd(){
  joyActive = false;
  joyBase.style.display = 'none';
  joyKnob.style.display = 'none';
  keys['arrowup'] = keys['arrowdown'] = keys['arrowleft'] = keys['arrowright'] = false;
}
joyzone.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; joyStart(t.clientX, t.clientY); });
joyzone.addEventListener('touchmove', e => { e.preventDefault(); const t = e.changedTouches[0]; joyMove(t.clientX, t.clientY); });
joyzone.addEventListener('touchend', e => { e.preventDefault(); joyEnd(); });
joyzone.addEventListener('touchcancel', e => { e.preventDefault(); joyEnd(); });

function pickNearestTowerKey(x, y){
  let bestK = null, bestD = Infinity;
  for (const k in grid){
    const [tx, ty] = k.split(',').map(Number);
    const gp = groundPoint(tx, ty);
    const d = Math.hypot(gp.x-x, gp.y-y);
    if (d < bestD){ bestD = d; bestK = k; }
  }
  return bestK;
}

// certains ennemis (attackers) foncent droit sur une tour pour l'occuper et
// la détruire ; les autres (rushers) descendent l'écran verticalement avec
// une ondulation gauche-droite aléatoire — l'illusion d'une foule, pas de
// tanks alignés sur la grille isométrique
function spawnEnemy(){
  const hp = Math.round(BASE_ENEMY_HP * Math.pow(WAVE_GROWTH, wave-1));
  const margin = 30;
  const baseX = margin + Math.random() * Math.max(1, STAGE_W - margin*2);
  const isAttacker = Math.random() < 0.3;
  const speed = (0.9 + wave*0.12) * (TW/64);
  const e = {
    x: baseX, y: 6, baseX,
    driftPhase: Math.random()*Math.PI*2,
    driftAmp: 16 + Math.random()*24,
    driftFreq: 0.01 + Math.random()*0.01,
    hp, maxHp: hp, speed,
    role: isAttacker ? 'attacker' : 'rusher',
    targetKey: null
  };
  if (isAttacker) e.targetKey = pickNearestTowerKey(baseX, 0);
  enemies.push(e);
}

function playerShoot(now){
  if (now - lastShotAt < SHOT_INTERVAL_MS) return;
  const pp = groundPoint(player.gx, player.gy);
  let target = null, best = PLAYER_RANGE_PX;
  for (const e of enemies){
    const d = Math.hypot(e.x-pp.x, e.y-pp.y);
    if (d < best){ best = d; target = e; }
  }
  if (!target) return;
  lastShotAt = now;
  projectiles.push({ x: pp.x, y: pp.y, target, speed: SHOT_SPEED_PX, dmg: PLAYER_DMG });
}

function update(now){
  if (gameOver) return;

  if (player.moveCooldown > 0) player.moveCooldown--;
  else {
    let dx=0, dy=0;
    if (keys['arrowup']||keys['z']||keys['w']) dy=-1;
    else if (keys['arrowdown']||keys['s']) dy=1;
    else if (keys['arrowleft']||keys['q']||keys['a']) dx=-1;
    else if (keys['arrowright']||keys['d']) dx=1;
    if (dx||dy){
      player.gx = Math.max(0, Math.min(GX-1, player.gx+dx));
      player.gy = Math.max(0, Math.min(GY-1, player.gy+dy));
      player.moveCooldown = 7;
    }
  }
  if (keys['r']) tryRepair();

  playerShoot(now);

  // tours : mêmes projectiles que le joueur, au même rythme (1 tir/s)
  for (const k in grid){
    const t = grid[k];
    if (t.type !== 'tower') continue;
    const [tx, ty] = k.split(',').map(Number);
    const gp = groundPoint(tx, ty);
    if (t.lastShotAt === undefined) t.lastShotAt = 0;
    if (now - t.lastShotAt >= SHOT_INTERVAL_MS){
      let target = null, best = TOWER_RANGE_PX;
      for (const e of enemies){
        const d = Math.hypot(e.x-gp.x, e.y-gp.y);
        if (d < best){ best = d; target = e; }
      }
      if (target){
        t.lastShotAt = now;
        projectiles.push({ x: gp.x, y: gp.y, target, speed: SHOT_SPEED_PX, dmg: PLAYER_DMG });
      }
    }
    for (const e of enemies){
      if (Math.hypot(e.x-gp.x, e.y-gp.y) < CONTACT_RANGE_PX) t.hp -= (e.role === 'attacker' ? 0.4 : 0.15);
    }
  }
  for (const k in grid) if (grid[k].hp <= 0) delete grid[k];

  for (const pr of projectiles){
    if (!enemies.includes(pr.target) || pr.target.hp <= 0){ pr.dead = true; continue; }
    const dx = pr.target.x-pr.x, dy = pr.target.y-pr.y, d = Math.hypot(dx, dy);
    if (d < 6){ pr.target.hp -= pr.dmg; pr.dead = true; }
    else { pr.x += dx/d*pr.speed; pr.y += dy/d*pr.speed; }
  }
  projectiles = projectiles.filter(p => !p.dead);

  goldTimer++;
  if (goldTimer > 60){ gold++; goldTimer = 0; }

  if (spawned < enemiesThisWave){
    spawnTimer++;
    if (spawnTimer > spawnInterval){ spawnEnemy(); spawned++; spawnTimer = 0; }
  } else if (enemies.length === 0){
    wave++;
    spawned = 0;
    enemiesThisWave += 3;
    spawnInterval = Math.max(30, spawnInterval - 5);
  }

  for (const e of enemies){
    if (e.role === 'attacker'){
      if (!e.targetKey || !grid[e.targetKey]) e.targetKey = pickNearestTowerKey(e.x, e.y);
      if (e.targetKey){
        const [tx, ty] = e.targetKey.split(',').map(Number);
        const gp = groundPoint(tx, ty);
        const dx = gp.x-e.x, dy = gp.y-e.y, d = Math.hypot(dx, dy);
        if (d > ATTACKER_STOP_PX){ e.x += dx/d*e.speed; e.y += dy/d*e.speed; }
      } else {
        e.y += e.speed;
        e.x = e.baseX + Math.sin(e.y*e.driftFreq + e.driftPhase)*e.driftAmp;
      }
    } else {
      e.y += e.speed;
      e.x = e.baseX + Math.sin(e.y*e.driftFreq + e.driftPhase)*e.driftAmp;
    }
    e.x = Math.max(16, Math.min(STAGE_W-16, e.x));
    if (e.y >= STAGE_H - 16){ e.dead = true; breaches++; }
    if (e.hp <= 0) e.dead = true;
  }
  enemies = enemies.filter(e => !e.dead);

  if (breaches >= 10){
    gameOver = true;
    document.getElementById('over').style.display = 'flex';
    document.getElementById('overText').textContent = `Ligne percée — vague ${wave}`;
  }

  document.getElementById('gold').textContent = gold;
  document.getElementById('wave').textContent = wave;
  document.getElementById('breach').textContent = breaches;
}

// dessine un petit pavé isométrique (3 faces) posé au point (cx, cyBase)
function drawIsoBox(cx, cyBase, hw, hh, sh, colTop, colLeft, colRight, stacked){
  const cyTop = cyBase - sh - 2*hh;
  const N = { x: cx,    y: cyTop };
  const E = { x: cx+hw, y: cyTop+hh };
  const S = { x: cx,    y: cyTop+2*hh };
  const W = { x: cx-hw, y: cyTop+hh };

  ctx.fillStyle = colTop;
  ctx.beginPath(); ctx.moveTo(N.x,N.y); ctx.lineTo(E.x,E.y); ctx.lineTo(S.x,S.y); ctx.lineTo(W.x,W.y); ctx.closePath(); ctx.fill();

  ctx.fillStyle = colLeft;
  ctx.beginPath(); ctx.moveTo(W.x,W.y); ctx.lineTo(S.x,S.y); ctx.lineTo(S.x,S.y+sh); ctx.lineTo(W.x,W.y+sh); ctx.closePath(); ctx.fill();

  ctx.fillStyle = colRight;
  ctx.beginPath(); ctx.moveTo(S.x,S.y); ctx.lineTo(E.x,E.y); ctx.lineTo(E.x,E.y+sh); ctx.lineTo(S.x,S.y+sh); ctx.closePath(); ctx.fill();

  if (stacked){
    ctx.strokeStyle = '#00000030';
    ctx.beginPath();
    ctx.moveTo(W.x, W.y+sh/2); ctx.lineTo(S.x, S.y+sh/2); ctx.lineTo(E.x, E.y+sh/2);
    ctx.stroke();
  }
}

function draw(){
  ctx.clearRect(0, 0, STAGE_W, STAGE_H); // fond beige uni (posé par le CSS du canvas), aucune ligne de sol

  for (const k in grid){
    const [tx,ty] = k.split(',').map(Number);
    const t = grid[k];
    const gp = groundPoint(tx,ty);
    drawIsoBox(gp.x, gp.y, 10, 5, 28, '#8fb3e8', '#5b8dd9', '#3f66a8', true);
    ctx.fillStyle = '#000';
    ctx.fillRect(gp.x-12, gp.y-50, 24, 4);
    ctx.fillStyle = t.hp/t.maxHp > 0.4 ? '#6cd66c' : '#d96c6c';
    ctx.fillRect(gp.x-12, gp.y-50, 24*(t.hp/t.maxHp), 4);
  }

  // ennemis : boules
  for (const e of enemies){
    const grad = ctx.createRadialGradient(e.x-3, e.y-11, 1, e.x, e.y-8, 9);
    grad.addColorStop(0, '#f2a3a3');
    grad.addColorStop(1, '#c33f3f');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(e.x, e.y-8, 8, 0, Math.PI*2); ctx.fill();
  }

  // projectiles (joueur et tours) : petites sphères noires
  for (const pr of projectiles){
    const grad = ctx.createRadialGradient(pr.x-1.5, pr.y-1.5, 0.5, pr.x, pr.y, 4);
    grad.addColorStop(0, '#4a4a4a');
    grad.addColorStop(1, '#000000');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, 4, 0, Math.PI*2); ctx.fill();
  }

  const pgp = groundPoint(player.gx, player.gy);
  drawIsoBox(pgp.x, pgp.y, 9, 5, 14, '#f7d67a', '#e0b04e', '#b98a34');
}

function loop(ts){
  update(ts || 0);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forge Line — prototype</title>
<style>
  :root{ --topbar-h:52px; --bottombar-h:64px; }
  html,body{margin:0;height:100%;background:#e8dfc8;color:#3a3529;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}

  #topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;background:#00000012;z-index:6}
  #menu-btn{margin-left:10px;width:38px;height:38px;border-radius:8px;border:1px solid #00000030;background:#00000010;color:#3a3529;font-size:18px;line-height:1;cursor:pointer}
  #menu-panel{display:none;position:fixed;top:calc(var(--topbar-h) + 6px);left:10px;background:#faf6ea;border:1px solid #00000025;border-radius:10px;box-shadow:0 6px 18px #00000022;min-width:170px;z-index:10;overflow:hidden}
  #menu-panel a, #menu-panel .disabled{display:block;padding:10px 14px;font-size:14px;color:#3a3529;text-decoration:none}
  #menu-panel a:hover{background:#00000010}
  #menu-panel .disabled{opacity:.45;cursor:default}

  #version-btn{margin-left:auto;margin-right:12px;padding:6px 10px;border-radius:8px;border:1px solid #00000030;background:#00000010;color:#3a3529;font-size:13px;font-family:inherit;cursor:pointer}
  #version-panel{display:none;position:fixed;top:calc(var(--topbar-h) + 6px);right:10px;background:#faf6ea;border:1px solid #00000025;border-radius:10px;box-shadow:0 6px 18px #00000022;min-width:230px;max-width:280px;z-index:10;padding:10px 14px;font-size:13px;line-height:1.7}
  #version-panel .v{font-weight:600;margin-right:4px}
  #version-panel .row:not(:last-child){border-bottom:1px solid #00000012;padding-bottom:4px;margin-bottom:4px}

  #bottombar{position:fixed;bottom:0;left:0;right:0;height:var(--bottombar-h);display:flex;align-items:center;justify-content:center;background:#00000012;z-index:6}
  #hud{font-size:14px;line-height:1.4;text-align:center}

  #stage{position:fixed;top:var(--topbar-h);bottom:var(--bottombar-h);left:0;right:0;overflow:hidden;background:#e8dfc8}
  canvas{display:block;touch-action:none;background:#e8dfc8}

  /* écran de défaite : une petite carte centrée, pas un voile plein écran —
     le jeu reste visible (figé) derrière */
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;pointer-events:none}
  #over-card{pointer-events:auto;background:#faf6ea;border:1px solid #00000025;border-radius:14px;box-shadow:0 10px 30px #00000040;padding:22px 26px;text-align:center;max-width:260px}
  #over-card h2{margin:0 0 6px;font-size:19px;color:#3a3529}
  #over-card p{margin:0 0 16px;font-size:13px;color:#3a3529;opacity:.7}
  #over-card .btns{display:flex;flex-direction:column;gap:8px}
  #continue-btn{padding:10px 14px;border-radius:8px;border:none;background:#5b8dd9;color:#fff;font-size:13.5px;cursor:pointer}
  #continue-btn:active{background:#4a78bd}
  #restart-btn{padding:9px 14px;border-radius:8px;border:1px solid #00000030;background:transparent;color:#3a3529;font-size:13px;cursor:pointer}
  #restart-btn:active{background:#00000010}

  #joyzone{display:none;position:fixed;left:0;right:0;top:var(--topbar-h);bottom:var(--bottombar-h);z-index:3;touch-action:none}
  #joy-base,#joy-knob{display:none;position:fixed;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:4}
  #joy-base{width:88px;height:88px;background:#00000018;border:1px solid #00000030}
  #joy-knob{width:40px;height:40px;background:#00000040}

  @media (hover:none) and (pointer:coarse){
    #joyzone{display:block}
  }
</style>
</head>
<body>

<div id="topbar">
  <button id="menu-btn" aria-label="Menu">☰</button>
  <div id="menu-panel">
    <a href="../bastion-orbit/">Bastion Orbit</a>
  </div>
  <button id="version-btn" aria-label="Historique des versions"></button>
  <div id="version-panel"></div>
</div>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="joyzone"></div>
  <div id="joy-base"></div>
  <div id="joy-knob"></div>
  <div id="over">
    <div id="over-card">
      <h2>Tu as perdu</h2>
      <p id="over-wave"></p>
      <div class="btns">
        <button id="continue-btn">🎬 Regarder une pub (30s) pour continuer</button>
        <button id="restart-btn">Recommencer au tout début</button>
      </div>
    </div>
  </div>
</div>

<div id="bottombar">
  <div id="hud">
    Or : <span id="gold">0</span> —
    Vague : <span id="wave">1</span> —
    Brèches : <span id="breach">0</span>/10
  </div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');

// tout le jeu vit en pixels écran (CSS px) — joueur, tours, ennemis et
// projectiles se déplacent librement sur toute la carte. L'isométrique
// n'est plus qu'un style de dessin (drawIsoBox), pas une grille de
// placement : ça garde le tout simple et léger.
let STAGE_W = 0, STAGE_H = 0;
const MARGIN = 22;

const PLAYER_SPEED = 4;      // px/frame
const PLAYER_RANGE_PX = 200;
const TOWER_RANGE_PX = 160;
const SHOT_SPEED_PX = 8;     // px/frame
const BUILD_OFFSET = 36;     // distance à laquelle la tour apparaît devant le joueur
const TOWER_MAX_SH = 28, TOWER_HW = 10, TOWER_HH = 5;
const PLAYER_HW = 9, PLAYER_HH = 5, PLAYER_SH = 14;

// le pied de la tour est un obstacle solide : personne ne peut marcher
// dessus (joueur comme ennemis), et c'est cette limite qui compte pour
// le contact/les dégâts — pas une zone floue plus large
const TOWER_SOLID_RADIUS = 20;
const ATTACKER_STOP_PX = TOWER_SOLID_RADIUS;
const CONTACT_RANGE_PX = TOWER_SOLID_RADIUS + 6;
const TOWER_FLASH_MS = 160; // durée du flash translucide quand une tour encaisse

const player = { x: 0, y: 0 };
let playerPlaced = false;

function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const rect = stage.getBoundingClientRect();
  STAGE_W = rect.width; STAGE_H = rect.height;
  cv.width = Math.round(STAGE_W * dpr);
  cv.height = Math.round(STAGE_H * dpr);
  cv.style.width = STAGE_W + 'px';
  cv.style.height = STAGE_H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // on dessine ensuite en pixels CSS

  if (!playerPlaced){
    player.x = STAGE_W/2; player.y = STAGE_H - 70;
    playerPlaced = true;
  } else {
    player.x = Math.min(player.x, STAGE_W-MARGIN);
    player.y = Math.min(player.y, STAGE_H-MARGIN);
  }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let towers = []; // {x, y, hp, maxHp, lastShotAt, flashUntil, lastHitSoundAt}
let gold = 0, wave = 1, breaches = 0, gameOver = false;
let enemies = [];
let projectiles = [];
function pickNextSpawnDelay(){ return Math.max(18, 65 - wave*3) + Math.random()*55; }
let spawnTimer = 0, spawnInterval = pickNextSpawnDelay(), enemiesThisWave = 5, spawned = 0;
let lastShotAt = 0;
const SHOT_INTERVAL_MS = 1000;
const PLAYER_DMG = 12;
const BASE_ENEMY_HP = 12;
const WAVE_GROWTH = 1.2; // chaque vague est 20% plus forte que la précédente
const KILL_REWARD = 4;   // or gagné en tuant un ennemi (rien s'il atteint la ligne)

// --- petits bruitages synthétisés (aucun fichier audio, tout est généré) ---
let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone({ freq=440, freqEnd=null, duration=0.05, type='sine', gain=0.15 }){
  const ac = getAudioCtx(), t0 = ac.currentTime;
  const osc = ac.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + duration);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(g); g.connect(ac.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playNoiseBurst({ duration=0.03, gain=0.15, filterFreq=2000, filterType='bandpass', filterQ=2 }){
  const ac = getAudioCtx(), t0 = ac.currentTime;
  const n = Math.max(1, Math.floor(ac.sampleRate * duration));
  const buffer = ac.createBuffer(1, n, ac.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random()*2-1) * (1 - i/n);
  const src = ac.createBufferSource();
  src.buffer = buffer;
  const f = ac.createBiquadFilter();
  f.type = filterType; f.frequency.value = filterFreq; f.Q.value = filterQ;
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t0);
}
// tir : un déclic sec, comme un grain de riz qui casse
function sfxShoot(){ playNoiseBurst({ duration: 0.02, gain: 0.12, filterFreq: 3200, filterType: 'bandpass', filterQ: 4 }); }
// impact sur un ennemi : le même déclic, un peu plus aigu et plus sourd
function sfxHit(){ playNoiseBurst({ duration: 0.03, gain: 0.14, filterFreq: 4200, filterType: 'bandpass', filterQ: 2.2 }); }
// construction : clank métallique, clinquant mais pas aigu
function sfxBuild(){
  playTone({ freq: 520, freqEnd: 300, duration: 0.12, type: 'triangle', gain: 0.14 });
  playTone({ freq: 780, freqEnd: 500, duration: 0.08, type: 'square', gain: 0.06 });
  playNoiseBurst({ duration: 0.05, gain: 0.08, filterFreq: 2500, filterType: 'bandpass', filterQ: 3 });
}
// une tour encaisse : coup de marteau sur bois sec, court et grave
function sfxTowerHit(){
  playTone({ freq: 160, freqEnd: 90, duration: 0.05, type: 'sine', gain: 0.16 });
  playNoiseBurst({ duration: 0.02, gain: 0.06, filterFreq: 700, filterType: 'lowpass' });
}

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function isControl(el){ return el && el.closest && el.closest('#topbar, #bottombar'); }

// la tour apparaît collée au joueur, côté haut de l'écran (face aux ennemis)
function tryBuild(){
  if (gold < 10) return;
  const bx = player.x, by = player.y - BUILD_OFFSET;
  for (const t of towers) if (Math.hypot(t.x-bx, t.y-by) < 20) return; // évite l'empilement au même endroit
  gold -= 10;
  towers.push({ x: bx, y: by, hp: 30, maxHp: 30, lastShotAt: 0, flashUntil: 0, lastHitSoundAt: 0 });
  sfxBuild();
}
function tryRepair(){
  const t = pickNearestTower(player.x, player.y);
  if (t && t.hp < t.maxHp && Math.hypot(t.x-player.x, t.y-player.y) < CONTACT_RANGE_PX){
    t.hp = Math.min(t.maxHp, t.hp + 0.4);
  }
}
// une tour posée est un obstacle solide : personne (joueur ni ennemis) ne
// peut marcher dedans — elle sert aussi de mur pour la ligne de défense
function resolveTowerCollision(pos, radius){
  for (const t of towers){
    const dx = pos.x-t.x, dy = pos.y-t.y;
    const d = Math.hypot(dx, dy);
    if (d < radius){
      if (d > 0.001){ pos.x = t.x + dx/d*radius; pos.y = t.y + dy/d*radius; }
      else { pos.x = t.x + radius; pos.y = t.y; }
    }
  }
}

// construire : double-clic (souris) ou double-tap (tactile), n'importe où
document.addEventListener('dblclick', e => {
  if (isControl(e.target)) return;
  tryBuild();
});
let lastTap = { time: 0, x: 0, y: 0 };
document.addEventListener('touchend', e => {
  if (isControl(e.target)) return;
  const t = e.changedTouches[0];
  const now = Date.now();
  const dt = now - lastTap.time;
  const dist = Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y);
  if (dt < 300 && dist < 30){
    tryBuild();
    lastTap = { time: 0, x: 0, y: 0 };
  } else {
    lastTap = { time: now, x: t.clientX, y: t.clientY };
  }
}, { passive:true });

window.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'b') tryBuild(); });

// menu en haut à gauche : pour l'instant juste la liste des jeux (Bastion
// Orbit arrivera ici une fois publié)
const menuBtn = document.getElementById('menu-btn');
const menuPanel = document.getElementById('menu-panel');
menuBtn.addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('version-panel').style.display = 'none';
  menuPanel.style.display = menuPanel.style.display === 'block' ? 'none' : 'block';
});
document.addEventListener('click', e => {
  if (menuPanel.style.display === 'block' && !menuPanel.contains(e.target) && e.target !== menuBtn){
    menuPanel.style.display = 'none';
  }
});

// numéro de version : résumé en un coup d'œil de ce qui a changé au
// dernier push. Chaque nouvelle version pousse une entrée en tête ici.
const CHANGELOG = [
  { v: 9, text: "Vagues organiques (salves, hésitations), tours = murs solides qui flashent quand touchées, or au kill seulement, bruitages, écran de défaite repensé (continuer/recommencer)" },
  { v: 8, text: "Menu : retiré le lien vers soi-même, ne reste que Bastion Orbit" },
  { v: 7, text: "Correctif : le jeu se figeait dès le 1er ennemi (bug bloquant) ; joystick actif sur tout l'écran" },
  { v: 6, text: "Numéro de version cliquable (ce mini-historique) ; le menu pointe vers Bastion Orbit" },
  { v: 5, text: "Déplacement libre sur tout l'écran ; tours sans barre de vie (leur hauteur = leur vie)" },
  { v: 4, text: "Tri des calques par profondeur, pour un recouvrement visuel correct" },
  { v: 3, text: "Carte plein écran, mouvement organique des ennemis, projectiles en sphères" },
  { v: 2, text: "Contrôles tactiles (joystick, double-tap), style isométrique beige" },
  { v: 1, text: "Prototype initial : ingénieur, tours, vagues d'ennemis" },
];
const versionBtn = document.getElementById('version-btn');
const versionPanel = document.getElementById('version-panel');
versionBtn.textContent = 'v' + CHANGELOG[0].v;
versionPanel.innerHTML = CHANGELOG.map(c =>
  `<div class="row"><span class="v">v${c.v}</span>${c.text}</div>`
).join('');
versionBtn.addEventListener('click', e => {
  e.stopPropagation();
  menuPanel.style.display = 'none';
  versionPanel.style.display = versionPanel.style.display === 'block' ? 'none' : 'block';
});
document.addEventListener('click', e => {
  if (versionPanel.style.display === 'block' && !versionPanel.contains(e.target) && e.target !== versionBtn){
    versionPanel.style.display = 'none';
  }
});

// joystick tactile transparent : apparaît là où le doigt touche la zone gauche
const joyzone = document.getElementById('joyzone');
const joyBase = document.getElementById('joy-base');
const joyKnob = document.getElementById('joy-knob');
let joyActive = false, joyOriginX = 0, joyOriginY = 0;
let joyDX = 0, joyDY = 0; // vecteur de direction continu (mouvement fluide, pas 4 directions figées)
const JOY_RADIUS = 40, JOY_DEADZONE = 12;

function joyStart(x, y){
  joyActive = true; joyOriginX = x; joyOriginY = y;
  joyBase.style.left = x+'px'; joyBase.style.top = y+'px'; joyBase.style.display = 'block';
  joyKnob.style.left = x+'px'; joyKnob.style.top = y+'px'; joyKnob.style.display = 'block';
}
function joyMove(x, y){
  if (!joyActive) return;
  const dx = x-joyOriginX, dy = y-joyOriginY;
  const dist = Math.hypot(dx, dy);
  const clamped = Math.min(dist, JOY_RADIUS);
  const angle = Math.atan2(dy, dx);
  joyKnob.style.left = (joyOriginX + Math.cos(angle)*clamped)+'px';
  joyKnob.style.top = (joyOriginY + Math.sin(angle)*clamped)+'px';

  if (dist > JOY_DEADZONE){ joyDX = Math.cos(angle); joyDY = Math.sin(angle); }
  else { joyDX = 0; joyDY = 0; }
}
function joyEnd(){
  joyActive = false;
  joyBase.style.display = 'none';
  joyKnob.style.display = 'none';
  joyDX = 0; joyDY = 0;
}
joyzone.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; joyStart(t.clientX, t.clientY); });
joyzone.addEventListener('touchmove', e => { e.preventDefault(); const t = e.changedTouches[0]; joyMove(t.clientX, t.clientY); });
joyzone.addEventListener('touchend', e => { e.preventDefault(); joyEnd(); });
joyzone.addEventListener('touchcancel', e => { e.preventDefault(); joyEnd(); });

function pickNearestTower(x, y){
  let best = null, bestD = Infinity;
  for (const t of towers){
    const d = Math.hypot(t.x-x, t.y-y);
    if (d < bestD){ bestD = d; best = t; }
  }
  return best;
}

// certains ennemis (attackers) foncent droit sur une tour pour l'occuper et
// la détruire ; les autres (rushers) descendent l'écran verticalement avec
// une ondulation gauche-droite aléatoire — l'illusion d'une foule, pas de
// tanks alignés sur la grille isométrique
function spawnEnemy(){
  const hp = Math.round(BASE_ENEMY_HP * Math.pow(WAVE_GROWTH, wave-1));
  const margin = 30;
  const baseX = margin + Math.random() * Math.max(1, STAGE_W - margin*2);
  const isAttacker = Math.random() < 0.3;
  const speed = 0.9 + wave*0.12;
  const e = {
    x: baseX, y: 6, baseX,
    driftPhase: Math.random()*Math.PI*2,
    driftAmp: 16 + Math.random()*24,
    driftFreq: 0.01 + Math.random()*0.01,
    hp, maxHp: hp, speed,
    role: isAttacker ? 'attacker' : 'rusher',
    target: null,
    // certains hésitent avant de s'avancer — l'impression qu'ils attendent
    // une occasion plutôt que de foncer tous en rang
    waitFrames: Math.random() < 0.4 ? Math.floor(20 + Math.random()*70) : 0
  };
  if (isAttacker) e.target = pickNearestTower(baseX, 0);
  enemies.push(e);
}

function playerShoot(now){
  if (now - lastShotAt < SHOT_INTERVAL_MS) return;
  let target = null, best = PLAYER_RANGE_PX;
  for (const e of enemies){
    const d = Math.hypot(e.x-player.x, e.y-player.y);
    if (d < best){ best = d; target = e; }
  }
  if (!target) return;
  lastShotAt = now;
  projectiles.push({ x: player.x, y: player.y, target, speed: SHOT_SPEED_PX, dmg: PLAYER_DMG });
  sfxShoot();
}

function update(now){
  if (gameOver) return;

  // déplacement fluide (clavier 8 directions ou joystick continu)
  let dx = 0, dy = 0;
  if (joyActive){
    dx = joyDX; dy = joyDY;
  } else {
    if (keys['arrowup']||keys['z']||keys['w']) dy -= 1;
    if (keys['arrowdown']||keys['s']) dy += 1;
    if (keys['arrowleft']||keys['q']||keys['a']) dx -= 1;
    if (keys['arrowright']||keys['d']) dx += 1;
  }
  if (dx || dy){
    const len = Math.hypot(dx, dy) || 1;
    player.x += dx/len*PLAYER_SPEED;
    player.y += dy/len*PLAYER_SPEED;
  }
  resolveTowerCollision(player, TOWER_SOLID_RADIUS); // une tour, c'est aussi un mur
  player.x = Math.max(MARGIN, Math.min(STAGE_W-MARGIN, player.x));
  player.y = Math.max(MARGIN, Math.min(STAGE_H-MARGIN, player.y));

  tryRepair(); // automatique dès qu'on est collé à une tour endommagée

  playerShoot(now);

  // tours : mêmes projectiles que le joueur, au même rythme (1 tir/s) ;
  // pas de barre de vie séparée — leur hauteur EST leur vie (voir draw())
  for (const t of towers){
    if (t.lastShotAt === undefined) t.lastShotAt = 0;
    if (now - t.lastShotAt >= SHOT_INTERVAL_MS){
      let target = null, best = TOWER_RANGE_PX;
      for (const e of enemies){
        const d = Math.hypot(e.x-t.x, e.y-t.y);
        if (d < best){ best = d; target = e; }
      }
      if (target){
        t.lastShotAt = now;
        projectiles.push({ x: t.x, y: t.y, target, speed: SHOT_SPEED_PX, dmg: PLAYER_DMG });
        sfxShoot();
      }
    }
    let underAttack = false;
    for (const e of enemies){
      if (Math.hypot(e.x-t.x, e.y-t.y) < CONTACT_RANGE_PX){
        t.hp -= (e.role === 'attacker' ? 0.4 : 0.15);
        underAttack = true;
      }
    }
    if (underAttack){
      t.flashUntil = now + TOWER_FLASH_MS; // brièvement translucide pendant qu'elle encaisse
      if (now - (t.lastHitSoundAt||0) > 350){ sfxTowerHit(); t.lastHitSoundAt = now; }
    }
  }
  towers = towers.filter(t => t.hp > 0); // à 0, la tour a "coulé" jusqu'au sol, sans bruit

  for (const pr of projectiles){
    if (!enemies.includes(pr.target) || pr.target.hp <= 0){ pr.dead = true; continue; }
    const dx = pr.target.x-pr.x, dy = pr.target.y-pr.y, d = Math.hypot(dx, dy);
    if (d < 6){ pr.target.hp -= pr.dmg; pr.dead = true; sfxHit(); }
    else { pr.x += dx/d*pr.speed; pr.y += dy/d*pr.speed; }
  }
  projectiles = projectiles.filter(p => !p.dead);

  // vagues organiques : par à-coups (1, parfois 2-3 d'un coup), avec un
  // délai irrégulier entre chaque décision plutôt qu'un tapis roulant régulier
  if (spawned < enemiesThisWave){
    spawnTimer++;
    if (spawnTimer > spawnInterval){
      const remaining = enemiesThisWave - spawned;
      let burst = 1;
      if (remaining > 1 && Math.random() < 0.35) burst = 2;
      if (remaining > 2 && Math.random() < 0.12) burst = 3;
      burst = Math.min(burst, remaining);
      for (let i = 0; i < burst; i++) spawnEnemy();
      spawned += burst;
      spawnTimer = 0;
      spawnInterval = pickNextSpawnDelay();
    }
  } else if (enemies.length === 0){
    wave++;
    spawned = 0;
    enemiesThisWave += 3;
    spawnInterval = pickNextSpawnDelay();
  }

  for (const e of enemies){
    if (e.waitFrames > 0){
      e.waitFrames--; // hésite/se planque un instant avant de s'avancer
    } else if (e.role === 'attacker'){
      if (!e.target || !towers.includes(e.target)) e.target = pickNearestTower(e.x, e.y);
      if (e.target){
        const dx = e.target.x-e.x, dy = e.target.y-e.y, d = Math.hypot(dx, dy);
        if (d > ATTACKER_STOP_PX){ e.x += dx/d*e.speed; e.y += dy/d*e.speed; }
      } else {
        e.y += e.speed;
        e.x = e.baseX + Math.sin(e.y*e.driftFreq + e.driftPhase)*e.driftAmp;
      }
    } else {
      e.y += e.speed;
      e.x = e.baseX + Math.sin(e.y*e.driftFreq + e.driftPhase)*e.driftAmp;
    }
    resolveTowerCollision(e, TOWER_SOLID_RADIUS); // ne peut pas traverser une tour
    e.x = Math.max(16, Math.min(STAGE_W-16, e.x));
    if (e.hp <= 0){
      if (!e.dead) gold += KILL_REWARD; // l'or vient de la mise à mort, pas de l'arrivée sur la carte
      e.dead = true;
    } else if (e.y >= STAGE_H - 16){
      e.dead = true; breaches++;
    }
  }
  enemies = enemies.filter(e => !e.dead);

  if (breaches >= 10){
    gameOver = true;
    document.getElementById('over').style.display = 'flex';
    document.getElementById('over-wave').textContent = `Tu as tenu jusqu'à la vague ${wave}`;
  }

  document.getElementById('gold').textContent = gold;
  document.getElementById('wave').textContent = wave;
  document.getElementById('breach').textContent = breaches;
}

// dessine un petit pavé isométrique (3 faces) posé au point (cx, cyBase)
function drawIsoBox(cx, cyBase, hw, hh, sh, colTop, colLeft, colRight, stacked){
  const cyTop = cyBase - sh - 2*hh;
  const N = { x: cx,    y: cyTop };
  const E = { x: cx+hw, y: cyTop+hh };
  const S = { x: cx,    y: cyTop+2*hh };
  const W = { x: cx-hw, y: cyTop+hh };

  ctx.fillStyle = colTop;
  ctx.beginPath(); ctx.moveTo(N.x,N.y); ctx.lineTo(E.x,E.y); ctx.lineTo(S.x,S.y); ctx.lineTo(W.x,W.y); ctx.closePath(); ctx.fill();

  ctx.fillStyle = colLeft;
  ctx.beginPath(); ctx.moveTo(W.x,W.y); ctx.lineTo(S.x,S.y); ctx.lineTo(S.x,S.y+sh); ctx.lineTo(W.x,W.y+sh); ctx.closePath(); ctx.fill();

  ctx.fillStyle = colRight;
  ctx.beginPath(); ctx.moveTo(S.x,S.y); ctx.lineTo(E.x,E.y); ctx.lineTo(E.x,E.y+sh); ctx.lineTo(S.x,S.y+sh); ctx.closePath(); ctx.fill();

  if (stacked){
    ctx.strokeStyle = '#00000030';
    ctx.beginPath();
    ctx.moveTo(W.x, W.y+sh/2); ctx.lineTo(S.x, S.y+sh/2); ctx.lineTo(E.x, E.y+sh/2);
    ctx.stroke();
  }
}

// l'illusion de 3D tient uniquement à l'ordre de dessin : ce qui est plus
// bas à l'écran (donc plus "proche") est redessiné par-dessus le reste —
// pas de vraie profondeur, juste des calques bien triés
function draw(now){
  ctx.clearRect(0, 0, STAGE_W, STAGE_H); // fond beige uni (posé par le CSS du canvas), aucune ligne de sol

  const layers = [];

  // pas de barre de vie : la hauteur du pavé EST sa vie — une tour qui
  // encaisse rétrécit vers le sol, et disparaît une fois "coulée". Elle
  // devient brièvement translucide pendant qu'elle se fait attaquer.
  for (const t of towers){
    const sh = TOWER_MAX_SH * Math.max(0, t.hp/t.maxHp);
    const flashing = now < (t.flashUntil || 0);
    layers.push({ y: t.y, draw: () => {
      if (flashing) ctx.globalAlpha = 0.45;
      drawIsoBox(t.x, t.y, TOWER_HW, TOWER_HH, sh, '#8fb3e8', '#5b8dd9', '#3f66a8', true);
      if (flashing) ctx.globalAlpha = 1;
    }});
  }

  for (const e of enemies){
    layers.push({ y: e.y, draw: () => {
      const grad = ctx.createRadialGradient(e.x-3, e.y-11, 1, e.x, e.y-8, 9);
      grad.addColorStop(0, '#f2a3a3');
      grad.addColorStop(1, '#c33f3f');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(e.x, e.y-8, 8, 0, Math.PI*2); ctx.fill();
    }});
  }

  for (const pr of projectiles){
    layers.push({ y: pr.y, draw: () => {
      const grad = ctx.createRadialGradient(pr.x-1.5, pr.y-1.5, 0.5, pr.x, pr.y, 4);
      grad.addColorStop(0, '#4a4a4a');
      grad.addColorStop(1, '#000000');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, 4, 0, Math.PI*2); ctx.fill();
    }});
  }

  layers.push({ y: player.y, draw: () => {
    drawIsoBox(player.x, player.y, PLAYER_HW, PLAYER_HH, PLAYER_SH, '#f7d67a', '#e0b04e', '#b98a34');
  }});

  layers.sort((a, b) => a.y - b.y);
  for (const l of layers) l.draw();
}

// écran de défaite : « continuer » pardonne juste les brèches (comme une
// pub récompensée — pas encore branchée, mais le bouton fonctionne déjà) ;
// « recommencer » repart entièrement de zéro
document.getElementById('continue-btn').addEventListener('click', () => {
  breaches = 0;
  gameOver = false;
  document.getElementById('over').style.display = 'none';
});
document.getElementById('restart-btn').addEventListener('click', () => {
  towers = []; enemies = []; projectiles = [];
  gold = 0; wave = 1; breaches = 0; gameOver = false;
  spawned = 0; enemiesThisWave = 5; spawnTimer = 0; spawnInterval = pickNextSpawnDelay();
  player.x = STAGE_W/2; player.y = STAGE_H - 70;
  document.getElementById('over').style.display = 'none';
});

function loop(ts){
  update(ts || 0);
  draw(ts || 0);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

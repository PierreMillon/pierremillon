<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forge Line — prototype</title>
<style>
  html,body{margin:0;height:100%;background:#e8dfc8;color:#3a3529;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  #hud{position:fixed;top:10px;left:10px;font-size:14px;line-height:1.6;background:#00000066;color:#f3efe2;padding:8px 12px;border-radius:6px;z-index:2}
  #help{position:fixed;bottom:10px;left:10px;font-size:12px;opacity:.7;z-index:2}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000000cc;color:#f3efe2;font-size:28px;z-index:5}
  canvas{display:block;margin:0 auto;background:#e8dfc8;max-width:100vw;height:auto;touch-action:none}

  /* contrôles tactiles */
  #touchpad{display:none}
  .btn{position:fixed;width:66px;height:66px;border-radius:50%;background:#00000022;border:1px solid #00000033;color:#3a3529;font-size:24px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;z-index:3}
  .btn:active{background:#00000044}
  #act-repair{right:24px;bottom:100px}

  /* joystick tactile : apparaît là où le doigt touche la zone gauche */
  #joyzone{display:none;position:fixed;left:0;top:0;width:55%;height:100%;z-index:3;touch-action:none}
  #joy-base,#joy-knob{display:none;position:fixed;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:4}
  #joy-base{width:88px;height:88px;background:#00000018;border:1px solid #00000030}
  #joy-knob{width:40px;height:40px;background:#00000040}

  @media (hover:none) and (pointer:coarse){
    #touchpad{display:block}
    #joyzone{display:block}
    #help{display:none}
  }
</style>
</head>
<body>
<div id="hud">
  Or : <span id="gold">0</span> —
  Vague : <span id="wave">1</span> —
  Brèches : <span id="breach">0</span>/10
</div>
<div id="help">Flèches/WASD : déplacer — double-clic : construire (10 or) — R : réparer (maintenir) — tir auto 1×/s</div>
<div id="over"><div id="overText"></div></div>
<canvas id="c" width="900" height="620"></canvas>

<div id="joyzone"></div>
<div id="joy-base"></div>
<div id="joy-knob"></div>
<div id="touchpad">
  <div class="btn" id="act-repair">🔧</div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const TW = 64, TH = 32; // largeur/hauteur tuile isométrique
const GX = 10, GY = 9;  // taille grille
const originX = cv.width/2, originY = 40;

function toScreen(gx, gy){
  return { x: originX + (gx-gy)*TW/2, y: originY + (gx+gy)*TH/2 };
}
// point au sol (front) d'une case, où un objet "pose" visuellement
function groundPoint(gx, gy){
  const p = toScreen(gx, gy);
  return { x: p.x, y: p.y + TH };
}
// inverse de toScreen : position écran (coords canvas) -> case de grille
function screenToGrid(canvasX, canvasY){
  const a = (canvasX - originX) / (TW/2);
  const b = (canvasY - originY) / (TH/2);
  return { gx: Math.round((a+b)/2), gy: Math.round((b-a)/2) };
}
function clientToCanvas(clientX, clientY){
  const rect = cv.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (cv.width / rect.width),
    y: (clientY - rect.top) * (cv.height / rect.height)
  };
}

const grid = {}; // "x,y" -> {type:'tower', hp, maxHp, cooldown}
function key(x,y){ return x+','+y; }

const player = { gx: Math.floor(GX/2), gy: GY-1, moveCooldown: 0 };
let gold = 0, wave = 1, breaches = 0, gameOver = false;
let enemies = [];
let projectiles = [];
let spawnTimer = 0, spawnInterval = 90, enemiesThisWave = 5, spawned = 0;
let goldTimer = 0;
let lastShotAt = 0;
const SHOT_INTERVAL_MS = 1000;
const PLAYER_RANGE = 3.5;
const PLAYER_DMG = 12;
const TOWER_RANGE = 2.5;
const BASE_ENEMY_HP = 12;
const WAVE_GROWTH = 1.2; // chaque vague est 20% plus forte que la précédente

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function isControl(el){ return el && el.closest && el.closest('.btn'); }

function tryBuildAt(gx, gy){
  if (gx < 0 || gx >= GX || gy < 0 || gy >= GY) return;
  const k = key(gx, gy);
  if (grid[k]) return;
  if (gold < 10) return;
  gold -= 10;
  grid[k] = { type:'tower', hp:30, maxHp:30, cooldown:0 };
}
function tryRepair(){
  const t = grid[key(player.gx, player.gy)];
  if (t && t.hp < t.maxHp) t.hp = Math.min(t.maxHp, t.hp + 0.4);
}

// construire : double-clic (souris) ou double-tap (tactile), n'importe où sur la carte
document.addEventListener('dblclick', e => {
  if (isControl(e.target)) return;
  const c = clientToCanvas(e.clientX, e.clientY);
  const { gx, gy } = screenToGrid(c.x, c.y);
  tryBuildAt(gx, gy);
});
let lastTap = { time: 0, x: 0, y: 0 };
document.addEventListener('touchend', e => {
  if (isControl(e.target)) return;
  const t = e.changedTouches[0];
  const now = Date.now();
  const dt = now - lastTap.time;
  const dist = Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y);
  if (dt < 300 && dist < 30){
    const c = clientToCanvas(t.clientX, t.clientY);
    const { gx, gy } = screenToGrid(c.x, c.y);
    tryBuildAt(gx, gy);
    lastTap = { time: 0, x: 0, y: 0 };
  } else {
    lastTap = { time: now, x: t.clientX, y: t.clientY };
  }
}, { passive:true });

// touche B au clavier : construit sur la case du joueur
window.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'b') tryBuildAt(player.gx, player.gy); });

// bouton réparer (tactile, maintenu)
document.getElementById('act-repair').addEventListener('touchstart', ev => { ev.preventDefault(); keys['r'] = true; });
document.getElementById('act-repair').addEventListener('touchend', ev => { ev.preventDefault(); keys['r'] = false; });
document.getElementById('act-repair').addEventListener('touchcancel', ev => { ev.preventDefault(); keys['r'] = false; });

// joystick tactile transparent : apparaît là où le doigt touche la zone gauche
const joyzone = document.getElementById('joyzone');
const joyBase = document.getElementById('joy-base');
const joyKnob = document.getElementById('joy-knob');
let joyActive = false, joyOriginX = 0, joyOriginY = 0;
const JOY_RADIUS = 40, JOY_DEADZONE = 12;

function joyStart(x, y){
  joyActive = true; joyOriginX = x; joyOriginY = y;
  joyBase.style.left = x+'px'; joyBase.style.top = y+'px'; joyBase.style.display = 'block';
  joyKnob.style.left = x+'px'; joyKnob.style.top = y+'px'; joyKnob.style.display = 'block';
}
function joyMove(x, y){
  if (!joyActive) return;
  const dx = x-joyOriginX, dy = y-joyOriginY;
  const dist = Math.hypot(dx, dy);
  const clamped = Math.min(dist, JOY_RADIUS);
  const angle = Math.atan2(dy, dx);
  joyKnob.style.left = (joyOriginX + Math.cos(angle)*clamped)+'px';
  joyKnob.style.top = (joyOriginY + Math.sin(angle)*clamped)+'px';

  keys['arrowup'] = keys['arrowdown'] = keys['arrowleft'] = keys['arrowright'] = false;
  if (dist > JOY_DEADZONE){
    const deg = angle*180/Math.PI;
    if (deg > -45 && deg <= 45) keys['arrowright'] = true;
    else if (deg > 45 && deg <= 135) keys['arrowdown'] = true;
    else if (deg > -135 && deg <= -45) keys['arrowup'] = true;
    else keys['arrowleft'] = true;
  }
}
function joyEnd(){
  joyActive = false;
  joyBase.style.display = 'none';
  joyKnob.style.display = 'none';
  keys['arrowup'] = keys['arrowdown'] = keys['arrowleft'] = keys['arrowright'] = false;
}
joyzone.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; joyStart(t.clientX, t.clientY); });
joyzone.addEventListener('touchmove', e => { e.preventDefault(); const t = e.changedTouches[0]; joyMove(t.clientX, t.clientY); });
joyzone.addEventListener('touchend', e => { e.preventDefault(); joyEnd(); });
joyzone.addEventListener('touchcancel', e => { e.preventDefault(); joyEnd(); });

// redimensionne le canvas à la largeur de l'écran (résolution interne inchangée)
function fitCanvas(){
  const margin = 20;
  const scale = Math.min(1, (window.innerWidth - margin) / cv.width);
  cv.style.width = (cv.width * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

function pickNearestTowerKey(x, y){
  let bestK = null, bestD = Infinity;
  for (const k in grid){
    const [tx, ty] = k.split(',').map(Number);
    const d = Math.hypot(tx-x, ty-y);
    if (d < bestD){ bestD = d; bestK = k; }
  }
  return bestK;
}

// certains ennemis foncent vers le bas (rusher), d'autres visent une tour
// pour l'occuper et la détruire (attacker) — décidé une fois à l'apparition
function spawnEnemy(){
  const x = Math.floor(Math.random()*GX);
  const hp = Math.round(BASE_ENEMY_HP * Math.pow(WAVE_GROWTH, wave-1));
  const isAttacker = Math.random() < 0.3;
  const e = { x, y: 0, hp, maxHp: hp, speed: 0.015 + wave*0.0015, role: isAttacker ? 'attacker' : 'rusher', targetKey: null };
  if (isAttacker) e.targetKey = pickNearestTowerKey(x, 0);
  enemies.push(e);
}

function playerShoot(now){
  if (now - lastShotAt < SHOT_INTERVAL_MS) return;
  let target = null, best = PLAYER_RANGE;
  for (const e of enemies){
    const d = Math.hypot(e.x-player.gx, e.y-player.gy);
    if (d < best){ best = d; target = e; }
  }
  if (!target) return;
  lastShotAt = now;
  projectiles.push({ x: player.gx, y: player.gy, target, speed: 0.12, dmg: PLAYER_DMG });
}

function update(now){
  if (gameOver) return;

  // mouvement joueur (pas par pas avec cooldown)
  if (player.moveCooldown > 0) player.moveCooldown--;
  else {
    let dx=0, dy=0;
    if (keys['arrowup']||keys['z']||keys['w']) dy=-1;
    else if (keys['arrowdown']||keys['s']) dy=1;
    else if (keys['arrowleft']||keys['q']||keys['a']) dx=-1;
    else if (keys['arrowright']||keys['d']) dx=1;
    if (dx||dy){
      player.gx = Math.max(0, Math.min(GX-1, player.gx+dx));
      player.gy = Math.max(0, Math.min(GY-1, player.gy+dy));
      player.moveCooldown = 7;
    }
  }
  if (keys['r']) tryRepair();

  playerShoot(now);
  for (const pr of projectiles){
    if (!enemies.includes(pr.target) || pr.target.hp <= 0){ pr.dead = true; continue; }
    const dx = pr.target.x-pr.x, dy = pr.target.y-pr.y;
    const d = Math.hypot(dx, dy);
    if (d < 0.15){ pr.target.hp -= pr.dmg; pr.dead = true; }
    else { pr.x += dx/d*pr.speed; pr.y += dy/d*pr.speed; }
  }
  projectiles = projectiles.filter(p => !p.dead);

  // or passif
  goldTimer++;
  if (goldTimer > 60){ gold++; goldTimer = 0; }

  // spawn vague (les ennemis apparaissent en haut, colonne aléatoire)
  if (spawned < enemiesThisWave){
    spawnTimer++;
    if (spawnTimer > spawnInterval){ spawnEnemy(); spawned++; spawnTimer = 0; }
  } else if (enemies.length === 0){
    wave++;
    spawned = 0;
    enemiesThisWave += 3;
    spawnInterval = Math.max(30, spawnInterval - 5);
  }

  // tours : mêmes projectiles que le joueur, au même rythme (1 tir/s)
  for (const k in grid){
    const t = grid[k];
    if (t.type !== 'tower') continue;
    const [tx, ty] = k.split(',').map(Number);
    if (t.lastShotAt === undefined) t.lastShotAt = 0;
    if (now - t.lastShotAt >= SHOT_INTERVAL_MS){
      let target = null, best = TOWER_RANGE;
      for (const e of enemies){
        const d = Math.hypot(e.x-tx, e.y-ty);
        if (d < best){ best = d; target = e; }
      }
      if (target){
        t.lastShotAt = now;
        projectiles.push({ x: tx, y: ty, target, speed: 0.12, dmg: PLAYER_DMG, source: 'tower' });
      }
    }
    // dégâts subis au contact — plus lourds venant d'un ennemi qui s'acharne sur la tour
    for (const e of enemies){
      if (Math.hypot(e.x-tx, e.y-ty) < 0.4) t.hp -= (e.role === 'attacker' ? 0.4 : 0.15);
    }
  }
  for (const k in grid) if (grid[k].hp <= 0) delete grid[k];

  // avancée ennemis : les "attackers" foncent vers une tour pour l'occuper,
  // les "rushers" filent droit vers le bas pour percer la ligne
  for (const e of enemies){
    if (e.role === 'attacker'){
      if (!e.targetKey || !grid[e.targetKey]) e.targetKey = pickNearestTowerKey(e.x, e.y);
      if (e.targetKey){
        const [tx, ty] = e.targetKey.split(',').map(Number);
        const dx = tx-e.x, dy = ty-e.y, d = Math.hypot(dx, dy);
        if (d > 0.5){ e.x += dx/d*e.speed; e.y += dy/d*e.speed; }
        // sinon : reste au contact, les dégâts se règlent dans la boucle des tours
      } else {
        e.y += e.speed; // plus aucune tour : fonce vers le bas comme un rusher
      }
    } else {
      e.y += e.speed;
    }
    if (e.y >= GY-1){ e.dead = true; breaches++; }
    if (e.hp <= 0) e.dead = true;
  }
  enemies = enemies.filter(e => !e.dead);

  if (breaches >= 10){
    gameOver = true;
    document.getElementById('over').style.display = 'flex';
    document.getElementById('overText').textContent = `Ligne percée — vague ${wave}`;
  }

  document.getElementById('gold').textContent = gold;
  document.getElementById('wave').textContent = wave;
  document.getElementById('breach').textContent = breaches;
}

function drawTile(gx, gy, fill){
  const p = toScreen(gx, gy);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x+TW/2, p.y+TH/2);
  ctx.lineTo(p.x, p.y+TH);
  ctx.lineTo(p.x-TW/2, p.y+TH/2);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = '#00000022';
  ctx.stroke();
}

// dessine un petit cube/pavé isométrique (3 faces) posé au point (cx, cyBase)
function drawIsoBox(cx, cyBase, hw, hh, sh, colTop, colLeft, colRight, stacked){
  const cyTop = cyBase - sh - 2*hh;
  const N = { x: cx,    y: cyTop };
  const E = { x: cx+hw, y: cyTop+hh };
  const S = { x: cx,    y: cyTop+2*hh };
  const W = { x: cx-hw, y: cyTop+hh };

  ctx.fillStyle = colTop;
  ctx.beginPath(); ctx.moveTo(N.x,N.y); ctx.lineTo(E.x,E.y); ctx.lineTo(S.x,S.y); ctx.lineTo(W.x,W.y); ctx.closePath(); ctx.fill();

  ctx.fillStyle = colLeft;
  ctx.beginPath(); ctx.moveTo(W.x,W.y); ctx.lineTo(S.x,S.y); ctx.lineTo(S.x,S.y+sh); ctx.lineTo(W.x,W.y+sh); ctx.closePath(); ctx.fill();

  ctx.fillStyle = colRight;
  ctx.beginPath(); ctx.moveTo(S.x,S.y); ctx.lineTo(E.x,E.y); ctx.lineTo(E.x,E.y+sh); ctx.lineTo(S.x,S.y+sh); ctx.closePath(); ctx.fill();

  if (stacked){
    ctx.strokeStyle = '#00000030';
    ctx.beginPath();
    ctx.moveTo(W.x, W.y+sh/2); ctx.lineTo(S.x, S.y+sh/2); ctx.lineTo(E.x, E.y+sh/2);
    ctx.stroke();
  }
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);

  for (let gy=0; gy<GY; gy++)
    for (let gx=0; gx<GX; gx++){
      let fill = '#cbb98e';
      if (gy === 0) fill = '#b99a6a';        // ligne d'apparition des ennemis
      else if (gy === GY-1) fill = '#c98f6a'; // ligne de défense
      drawTile(gx, gy, fill);
    }

  // tours : pavé de la hauteur de deux cubes empilés
  for (const k in grid){
    const [tx,ty] = k.split(',').map(Number);
    const t = grid[k];
    const gp = groundPoint(tx,ty);
    drawIsoBox(gp.x, gp.y, 10, 5, 28, '#8fb3e8', '#5b8dd9', '#3f66a8', true);
    ctx.fillStyle = '#000';
    ctx.fillRect(gp.x-12, gp.y-50, 24, 4);
    ctx.fillStyle = t.hp/t.maxHp > 0.4 ? '#6cd66c' : '#d96c6c';
    ctx.fillRect(gp.x-12, gp.y-50, 24*(t.hp/t.maxHp), 4);
  }

  // ennemis : boules
  for (const e of enemies){
    const gp = groundPoint(e.x, e.y);
    const grad = ctx.createRadialGradient(gp.x-3, gp.y-11, 1, gp.x, gp.y-8, 9);
    grad.addColorStop(0, '#f2a3a3');
    grad.addColorStop(1, '#c33f3f');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(gp.x, gp.y-8, 8, 0, Math.PI*2); ctx.fill();
  }

  // projectiles du joueur : mini cubes
  for (const pr of projectiles){
    const gp = groundPoint(pr.x, pr.y);
    drawIsoBox(gp.x, gp.y-10, 3, 2, 4, '#fff3c4', '#f2c14e', '#c99a2e');
  }

  // joueur : cube
  const pgp = groundPoint(player.gx, player.gy);
  drawIsoBox(pgp.x, pgp.y, 9, 5, 14, '#f7d67a', '#e0b04e', '#b98a34');
}

function loop(ts){
  update(ts || 0);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

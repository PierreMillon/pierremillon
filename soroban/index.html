<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>Soroban</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Oscilloscope / vieux moniteur — palette fixe, jamais d'ivoire ici
       (voir REGLES-JEUX.md : esthétique par défaut du catalogue) */
    :root {
      --bg: #05100a;
      --bg-soft: #0a1a12;
      --ink: #3be08a;
      --ink-soft: #2a8f5c;
      --hairline: #123322;
      --accent: #6dffb0;
      --accent-soft: rgba(61, 224, 138, 0.16);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    .topbar {
      padding: 1rem 16px 0;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .back {
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover { color: var(--accent); }

    h1 {
      margin: 0;
      font-weight: 300;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      letter-spacing: 0.06em;
    }

    .subline {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.3rem;
    }

    .hist-btn {
      font-family: inherit;
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .hist-btn:hover { color: var(--accent); }

    /* Lecture : le nombre formé, puis la décomposition du dernier chiffre
       touché par rapport à 5 (7 = 5 + 2) — c'est tout le principe du
       boulier, et celui des compléments à 5 (voir VISION.md) */
    .readout {
      text-align: center;
      margin-top: 0.6rem;
    }
    .value {
      font-size: clamp(2.4rem, 12vw, 3.4rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(61, 224, 138, 0.45);
      font-variant-numeric: tabular-nums;
    }
    .split {
      min-height: 1.4em;
      font-size: 0.95rem;
      color: var(--ink-soft);
      letter-spacing: 0.06em;
    }
    .split b {
      font-weight: 500;
      color: var(--ink);
    }

    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 16px;
      touch-action: none; /* le glissé sur les perles ne fait pas défiler */
    }

    svg.soroban {
      width: 100%;
      height: 100%;
      max-width: 520px;
      overflow: visible;
    }

    .frame, .beam, .rod {
      fill: none;
      stroke: var(--ink-soft);
      stroke-width: 2;
    }
    .rod { stroke-width: 1.5; opacity: 0.7; }
    .beam { stroke: var(--ink); }
    .dot { fill: var(--accent); }

    .bead {
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(.3, 1.35, .5, 1);
    }
    .bead polygon {
      fill: rgba(0, 0, 0, 0); /* peint, donc cliquable, mais invisible */
      stroke: var(--ink-soft);
      stroke-width: 2;
      stroke-linejoin: round;
      transition: stroke 0.16s ease, fill 0.16s ease;
    }
    .bead.on polygon {
      stroke: var(--accent);
      fill: var(--accent-soft);
      filter: url(#glow);
    }
    .digit {
      fill: var(--ink-soft);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 30px;
      text-anchor: middle;
    }
    .digit.on { fill: var(--ink); }

    .bottombar {
      display: flex;
      justify-content: center;
      padding: 0 16px calc(1.2rem + env(safe-area-inset-bottom));
    }

    .btn {
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.8rem 1.8rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:active { background: var(--accent-soft); }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem 16px;
      text-align: center;
      background: rgba(5, 16, 10, 0.94);
      z-index: 6;
    }
    .overlay[hidden] { display: none; }
    .overlay .big {
      font-weight: 300;
      font-size: 1.8rem;
      color: var(--ink);
    }
    .hist-list {
      width: 100%;
      max-width: 22rem;
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
    }
    .hist-list li {
      padding: 0.7rem 0;
      border-top: 1px solid var(--hairline);
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--ink-soft);
    }
    .hist-list li:last-child { border-bottom: 1px solid var(--hairline); }
    .hist-list b {
      display: block;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 0.1rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .bead, .bead polygon { transition: none; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <header>
      <a class="back" href="../">← Portfolio</a>
      <h1>Soroban</h1>
    </header>
    <div class="subline">
      <button class="hist-btn" id="histBtn">Historique</button>
    </div>
  </div>

  <div class="readout" aria-live="polite">
    <div class="value" id="value">0</div>
    <div class="split" id="split"></div>
  </div>

  <div class="stage">
    <svg class="soroban" id="soroban" role="group" aria-label="Boulier"></svg>
  </div>

  <div class="bottombar">
    <button class="btn" id="resetBtn">Remettre à zéro</button>
  </div>

  <div class="overlay" id="histOverlay" hidden>
    <div class="big">Historique</div>
    <ul class="hist-list" id="histList"></ul>
    <button class="btn" id="histClose">Fermer</button>
  </div>

  <script>
    (function () {
      // Un soroban : chaque tige porte une perle du haut (vaut 5) et quatre
      // perles du bas (valent 1 chacune). Une perle compte quand elle touche
      // la barre du milieu. Une seule mécanique : toucher une perle la fait
      // glisser vers la barre (ou l'en éloigne), avec celles qui la séparent
      // de la barre — exactement comme les doigts sur un vrai boulier.

      // ---------- Réglages ----------

      var RODS = 5;              // tiges : de 0 à 99 999
      var STORE_KEY = "soroban-state";
      var SWIPE_PX = 10;         // au-delà, un appui devient un glissé
      var SVGNS = "http://www.w3.org/2000/svg";

      // Géométrie (unités du viewBox). Une tige tous les 100.
      var COL = 100;
      var BEAD_H = 40;           // hauteur d'une perle
      var PAD = 8;               // marge perle / cadre ou barre
      var TOP = 0;               // haut du cadre
      var BEAM = 120;            // barre du milieu
      var BOTTOM = 364;          // bas du cadre
      var LABEL_Y = 410;         // chiffre sous chaque tige

      // Centre vertical de chaque perle, position repos / position active
      var HEAVEN_OFF = TOP + PAD + BEAD_H / 2;
      var HEAVEN_ON = BEAM - PAD - BEAD_H / 2;
      function earthOn(i) { return BEAM + PAD + BEAD_H / 2 + i * (BEAD_H + 2); }
      function earthOff(i) { return BOTTOM - PAD - BEAD_H / 2 - (3 - i) * (BEAD_H + 2); }

      // Perle vue de profil : un losange aplati aux pointes coupées
      var BEAD_POINTS = "-42,0 -15,-20 15,-20 42,0 15,20 -15,20";

      // ---------- État ----------
      // Un chiffre par tige, de gauche (grands ordres) à droite (unités).

      var digits = loadDigits();
      var lastRod = -1;

      function loadDigits() {
        var d = [];
        for (var i = 0; i < RODS; i++) d.push(0);
        try {
          var raw = localStorage.getItem(STORE_KEY);
          if (!raw) return d;
          // Jamais interprété comme du code : on n'accepte qu'une chaîne de
          // RODS chiffres, rien d'autre (voir REGLES-JEUX.md, Sécurité).
          if (!/^[0-9]+$/.test(raw) || raw.length !== RODS) return d;
          for (var j = 0; j < RODS; j++) d[j] = raw.charCodeAt(j) - 48;
        } catch (e) {}
        return d;
      }

      function saveDigits() {
        try { localStorage.setItem(STORE_KEY, digits.join("")); } catch (e) {}
      }

      // ---------- Dessin ----------

      var svg = document.getElementById("soroban");
      var W = COL * RODS;
      svg.setAttribute("viewBox", "-6 -6 " + (W + 12) + " " + (LABEL_Y + 22));

      function el(name, attrs, parent) {
        var n = document.createElementNS(SVGNS, name);
        for (var k in attrs) n.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(n);
        return n;
      }

      // Halo phosphore des perles actives (filtre SVG plutôt que CSS : plus
      // fiable sur Safari iOS pour des éléments SVG)
      var defs = el("defs", {}, svg);
      var filter = el("filter", { id: "glow", x: "-30%", y: "-60%", width: "160%", height: "220%" }, defs);
      el("feGaussianBlur", { stdDeviation: "3", result: "b" }, filter);
      var merge = el("feMerge", {}, filter);
      el("feMergeNode", { "in": "b" }, merge);
      el("feMergeNode", { "in": "SourceGraphic" }, merge);

      for (var r = 0; r < RODS; r++) {
        var cx = COL * r + COL / 2;
        el("line", { "class": "rod", x1: cx, y1: TOP, x2: cx, y2: BOTTOM }, svg);
      }
      el("rect", { "class": "frame", x: 0, y: TOP, width: W, height: BOTTOM - TOP, rx: 6 }, svg);
      el("line", { "class": "beam", x1: 0, y1: BEAM, x2: W, y2: BEAM }, svg);

      // Point de repère sur la barre : tige des unités, puis tous les trois
      // rangs (milliers…), comme sur un vrai soroban
      for (var p = 0; p < RODS; p++) {
        var rank = RODS - 1 - p;
        if (rank % 3 === 0) el("circle", { "class": "dot", cx: COL * p + COL / 2, cy: BEAM, r: 3.5 }, svg);
      }

      // beads[r] = { heaven: <g>, earth: [<g> ×4], label: <text> }
      var beads = [];
      for (var rr = 0; rr < RODS; rr++) {
        var x = COL * rr + COL / 2;
        var rodBeads = { heaven: null, earth: [], label: null };

        rodBeads.heaven = makeBead(x, rr, "h", 0);
        for (var i = 0; i < 4; i++) rodBeads.earth.push(makeBead(x, rr, "e", i));

        rodBeads.label = el("text", { "class": "digit", x: x, y: LABEL_Y }, svg);
        beads.push(rodBeads);
      }

      function makeBead(x, rod, kind, idx) {
        var g = el("g", { "class": "bead" }, svg);
        g.dataset.x = x;
        el("polygon", { points: BEAD_POINTS }, g);
        // Deux gestes : un toucher bref bascule la perle ; un glissé
        // vertical la pousse dans la direction du doigt (vers le haut ou
        // le bas), comme le pouce et l'index sur un vrai soroban.
        var startY = null;
        var swiped = false;
        g.addEventListener("pointerdown", function (ev) {
          ev.preventDefault();
          startY = ev.clientY;
          swiped = false;
          try { g.setPointerCapture(ev.pointerId); } catch (e) {}
        });
        g.addEventListener("pointermove", function (ev) {
          if (startY === null || swiped) return;
          var dy = ev.clientY - startY;
          if (Math.abs(dy) < SWIPE_PX) return;
          swiped = true;
          pushBead(rod, kind, idx, dy < 0 ? "up" : "down");
        });
        g.addEventListener("pointerup", function () {
          if (startY !== null && !swiped) touchBead(rod, kind, idx);
          startY = null;
        });
        g.addEventListener("pointercancel", function () { startY = null; });
        return g;
      }

      function place(g, y, on) {
        g.style.transform = "translate(" + g.dataset.x + "px," + y + "px)";
        g.setAttribute("class", on ? "bead on" : "bead");
      }

      function render() {
        for (var r = 0; r < RODS; r++) {
          var d = digits[r];
          var five = d >= 5;
          var ones = d % 5;
          place(beads[r].heaven, five ? HEAVEN_ON : HEAVEN_OFF, five);
          for (var i = 0; i < 4; i++) {
            var on = i < ones;
            place(beads[r].earth[i], on ? earthOn(i) : earthOff(i), on);
          }
          beads[r].label.textContent = d;
          beads[r].label.setAttribute("class", d ? "digit on" : "digit");
        }

        var n = 0;
        for (var j = 0; j < RODS; j++) n = n * 10 + digits[j];
        document.getElementById("value").textContent = n.toLocaleString("fr-FR");

        var split = document.getElementById("split");
        split.textContent = "";
        if (lastRod >= 0) {
          var dd = digits[lastRod];
          var b = document.createElement("b");
          b.textContent = dd;
          split.appendChild(b);
          split.appendChild(document.createTextNode(
            dd >= 5 ? " = 5 + " + (dd - 5) : (dd === 0 ? " — tige vide" : dd === 1 ? "" : " = " + ones1(dd))
          ));
        }
      }

      // 3 → « 1 + 1 + 1 » : en dessous de 5, on compte les perles une à une
      function ones1(k) {
        var parts = [];
        for (var i = 0; i < k; i++) parts.push("1");
        return parts.join(" + ");
      }

      // ---------- Geste ----------

      function touchBead(rod, kind, idx) {
        var d = digits[rod];
        var five = d >= 5 ? 5 : 0;
        var ones = d % 5;

        if (kind === "h") {
          five = five ? 0 : 5;
          clack(true);
        } else {
          // Perle du bas n° idx (0 = la plus proche de la barre). Si elle est
          // déjà contre la barre, on la redescend avec toutes celles qui sont
          // sous elle ; sinon on la monte avec toutes celles au-dessus.
          ones = idx < ones ? idx : idx + 1;
          clack(false);
        }

        setDigit(rod, five + ones);
      }

      function pushBead(rod, kind, idx, dir) {
        var d = digits[rod];
        var five = d >= 5 ? 5 : 0;
        var ones = d % 5;
        if (kind === "h") {
          five = dir === "down" ? 5 : 0;         // vers la barre = compte
        } else if (dir === "up") {
          ones = Math.max(ones, idx + 1);        // monte avec celles au-dessus
        } else {
          ones = Math.min(ones, idx);            // descend avec celles en dessous
        }
        if (five + ones === d) return;           // rien ne bouge : pas de son
        clack(kind === "h");
        setDigit(rod, five + ones);
      }

      function setDigit(rod, value) {
        digits[rod] = value;
        lastRod = rod;
        saveDigits();
        render();
      }

      document.getElementById("resetBtn").addEventListener("click", function () {
        var any = false;
        for (var i = 0; i < RODS; i++) { if (digits[i]) any = true; digits[i] = 0; }
        lastRod = -1;
        saveDigits();
        render();
        if (any) { clack(false); setTimeout(function () { clack(true); }, 60); }
      });

      // ---------- Son ----------
      // Web Audio, débloqué au premier geste. Un « tac » bref : bruit filtré
      // très court, un peu plus grave pour la perle du haut.

      var actx = null;
      function clack(heavy) {
        try {
          if (!actx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            actx = new AC();
          }
          if (actx.state === "suspended") actx.resume();
          var t = actx.currentTime;
          var len = Math.floor(actx.sampleRate * 0.05);
          var buf = actx.createBuffer(1, len, actx.sampleRate);
          var data = buf.getChannelData(0);
          for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
          var src = actx.createBufferSource();
          src.buffer = buf;
          var bp = actx.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = heavy ? 1300 : 2100;
          bp.Q.value = 6;
          var gain = actx.createGain();
          gain.gain.setValueAtTime(0.9, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          src.connect(bp); bp.connect(gain); gain.connect(actx.destination);
          src.start(t);
        } catch (e) {}
      }

      // ---------- Historique ----------

      var VERSIONS = [
        { v: "v1", text: "Premier boulier : 5 tiges (jusqu'à 99 999), une perle du haut qui vaut 5, quatre du bas qui valent 1. Deux gestes : toucher une perle la fait basculer (vers la barre ou loin d'elle), la glisser au doigt la pousse dans le sens du geste. Le nombre s'affiche au-dessus, avec la décomposition du dernier chiffre touché par rapport à 5 (7 = 5 + 2). Son de perle, état gardé d'une visite à l'autre, bouton de remise à zéro." }
      ];

      var histOverlay = document.getElementById("histOverlay");
      var histList = document.getElementById("histList");
      VERSIONS.forEach(function (entry) {
        var li = document.createElement("li");
        var bEl = document.createElement("b");
        bEl.textContent = entry.v;
        li.appendChild(bEl);
        li.appendChild(document.createTextNode(entry.text));
        histList.appendChild(li);
      });
      document.getElementById("histBtn").addEventListener("click", function () { histOverlay.hidden = false; });
      document.getElementById("histClose").addEventListener("click", function () { histOverlay.hidden = true; });

      // ---------- Démarrage ----------
      // Premier placement sans animation (sinon toutes les perles
      // « tombent » depuis le coin au chargement)

      svg.style.visibility = "hidden";
      var all = svg.querySelectorAll(".bead");
      for (var a = 0; a < all.length; a++) all[a].style.transition = "none";
      render();
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          for (var a = 0; a < all.length; a++) all[a].style.transition = "";
          svg.style.visibility = "";
        });
      });
    })();
  </script>

  <script>
    // Mise à jour automatique (même principe que la page d'accueil du
    // portfolio). Le seul état — la position des perles — est dans
    // localStorage et survit au rechargement, donc rien à perdre à
    // recharger dès qu'une nouvelle version est en ligne. Le paramètre
    // anti-cache dans l'URL de vérification est nécessaire : un simple
    // `cache: 'no-store'` n'empêche que la mise en cache locale du
    // navigateur, pas celle du CDN devant GitHub Pages.
    (function () {
      var PAGE = "soroban";
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return; // évite les rafales de clics
        lastCheck = now0;
        try {
          var url = (location.pathname || "index.html") + "?_cb=" + now0;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          var tag = res.headers.get("etag") || res.headers.get("last-modified");
          if (!tag) return;
          var key = "pm_pageVersion_" + PAGE;
          var stored = localStorage.getItem(key);
          if (stored === null) { localStorage.setItem(key, tag); return; }
          if (tag !== stored) {
            var now = Date.now();
            var guard = "pm_lastUpdateReload_" + PAGE;
            var lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem(guard)) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try {
              localStorage.setItem(key, tag);
              sessionStorage.setItem(guard, String(now));
            } catch (e) {}
            location.replace(location.pathname + "?_r=" + now);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
  <title>Soroban</title>
  <meta name="theme-color" content="#05100a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soroban">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Oscilloscope / vieux moniteur — palette fixe, jamais d'ivoire ici
       (voir REGLES-JEUX.md : esthétique par défaut du catalogue) */
    :root {
      --bg: #05100a;
      --bg-soft: #0a1a12;
      --ink: #3be08a;
      --ink-soft: #2a8f5c;
      --hairline: #123322;
      --accent: #6dffb0;
      --accent-soft: rgba(61, 224, 138, 0.16);
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    /* Comportement d'application : la page tient dans l'écran, ne défile
       pas, ne rebondit pas, ne se tire pas vers le bas, ne zoome pas. */
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    .topbar { padding: 1rem 16px 0; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .back, .link-btn {
      font-family: inherit;
      color: var(--ink-soft);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    .back:hover, .link-btn:hover { color: var(--accent); }

    h1 {
      margin: 0;
      font-weight: 300;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      letter-spacing: 0.06em;
    }

    .subline {
      display: flex;
      justify-content: flex-end;
      gap: 1.2rem;
      margin-top: 0.3rem;
    }

    .levels {
      display: flex;
      gap: 0.4rem;
      padding: 0 16px;
    }
    .levels { margin-top: 0.5rem; flex-wrap: wrap; justify-content: center; }
    /* Même en mode Libre, les niveaux gardent leur place (invisibles) :
       le boulier a la même taille dans les deux modes */
    .levels[hidden] { display: flex; visibility: hidden; }

    .chip {
      flex: 1;
      font-family: inherit;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.5rem 0.3rem;
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease;
    }
    .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); }
    .levels .chip {
      flex: 0 0 auto;
      padding: 0.35rem 0.6rem;
      text-transform: none;
      letter-spacing: 0.04em;
      font-size: 0.7rem;
    }
    .levels .chip.earned::after { content: " ✓"; color: var(--accent); }
    .levels .chip.mix { border-color: var(--ink-soft); color: var(--accent); }
    .levels .chip.locked { visibility: hidden; }
    .levels .chip.mix[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

    /* Lecture : le nombre formé, puis une ligne d'explication — la
       décomposition par rapport à 5 en libre (7 = 5 + 2), la légende de
       chaque geste pendant une démo au ralenti */
    .readout {
      text-align: center;
      margin-top: 0.5rem;
      padding: 0 16px;
    }
    .task {
      min-height: 1.5em;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      color: var(--ink);
    }
    /* Toutes les zones de texte ont une hauteur fixe (2 lignes au plus) :
       sinon, quand une légende passe de 1 à 2 lignes, la place laissée au
       boulier change et il se met à grossir / rétrécir tout seul */
    .task {
      height: 2.7em;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .task[hidden] { display: -webkit-box; visibility: hidden; }
    .task .step { color: var(--ink-soft); font-size: 0.85rem; }
    .value {
      font-size: clamp(2.2rem, 11vw, 3.2rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      line-height: 1.15;
      white-space: nowrap;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(61, 224, 138, 0.45);
      font-variant-numeric: tabular-nums;
    }
    .split {
      height: 2.8em;
      line-height: 1.4;
      overflow: hidden;
      font-size: 0.9rem;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
    }
    .split b { font-weight: 500; color: var(--ink); }
    .split.good { color: var(--accent); }

    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.4rem 16px;
    }

    svg.soroban {
      width: 100%;
      height: 100%;
      max-width: 520px;
      overflow: visible;
      touch-action: none; /* le glissé sur les perles ne fait ni défiler ni zoomer */
    }
    svg.soroban * { touch-action: none; }

    .frame, .beam, .rod {
      fill: none;
      stroke: var(--ink-soft);
      stroke-width: 2;
    }
    .rod { stroke-width: 1.5; opacity: 0.7; }
    .beam { stroke: var(--ink); }
    .dot { fill: var(--accent); }

    .bead { cursor: grab; outline: none; }
    .bead polygon {
      fill: rgba(0, 0, 0, 0); /* peint, donc touchable, mais invisible */
      stroke: var(--ink-soft);
      stroke-width: 2;
      stroke-linejoin: round;
      transition: stroke 0.2s ease, fill 0.2s ease;
    }
    .bead.on polygon {
      stroke: var(--accent);
      fill: var(--accent-soft);
      filter: url(#glow);
    }
    /* Perle à bouger pour l'étape suivante : elle clignote (allumée /
       éteinte, basculé en JS — une animation CSS était coupée par
       « Réduire les animations » sur iPhone, et Pierre veut le clignotement) */
    .bead.hint polygon {
      stroke: #f2fff8;
      stroke-width: 3.4;
      fill: rgba(234, 255, 243, 0.28);
    }
    svg.blink-off .bead.hint polygon {
      stroke: var(--ink-soft);
      stroke-width: 2;
      fill: rgba(0, 0, 0, 0);
    }
    .bead:focus-visible polygon { stroke: var(--accent); stroke-dasharray: 5 4; }
    .digit {
      fill: var(--ink-soft);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 30px;
      text-anchor: middle;
    }
    .digit.on { fill: var(--ink); }

    /* Badges gagnés = outils. Hauteur fixe, même vide ou en mode Libre,
       pour que le boulier ne change jamais de taille */
    .badgebar {
      display: flex;
      justify-content: center;
      gap: 0.3rem;
      height: 2.6rem;
      padding: 0 16px 0.4rem;
      overflow: hidden;
    }
    .badgebar[hidden] { display: flex; visibility: hidden; }
    .bchip {
      flex: 0 1 auto;
      min-width: 0;
      height: 2.2rem;
      padding: 0 0.55rem;
      font-family: inherit;
      font-size: 0.72rem;
      white-space: nowrap;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: 999px;
      cursor: pointer;
    }
    .bchip:active { background: rgba(61, 224, 138, 0.35); }
    .bchip:disabled { opacity: 0.35; cursor: default; }

    .bottombar {
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 0.4rem;
      padding: 0 16px 1rem;
    }

    .btn {
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.75rem 1.2rem;
      cursor: pointer;
    }
    .btn:active { background: var(--accent-soft); }
    /* Un bouton masqué garde sa place : la barre du bas ne change jamais
       de hauteur, donc le boulier non plus */
    .btn[hidden] { display: block; visibility: hidden; }
    .bottombar .btn {
      flex: 1 1 0;
      min-width: 0;
      height: 2.9rem;
      padding: 0 0.4rem;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      line-height: 1.2;
    }
    .btn.quiet { border-color: var(--hairline); color: var(--ink-soft); }

    body.busy .bead { cursor: default; }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem 16px;
      text-align: center;
      background: rgba(5, 16, 10, 0.95);
      z-index: 6;
    }
    .overlay[hidden] { display: none; }
    .overlay .big { font-weight: 300; font-size: 1.8rem; color: var(--ink); }
    .overlay p {
      margin: 0;
      max-width: 22rem;
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--ink-soft);
    }
    .hist-list {
      width: 100%;
      max-width: 22rem;
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
      touch-action: pan-y;
    }
    .hist-list li {
      padding: 0.7rem 0;
      border-top: 1px solid var(--hairline);
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--ink-soft);
    }
    .hist-list li:last-child { border-bottom: 1px solid var(--hairline); }
    .hist-list b {
      display: block;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 0.1rem;
    }

    /* Réussite : un bandeau en haut, pas un écran entier — le boulier
       reste visible en dessous, avec le résultat posé dessus */
    .overlay.win {
      bottom: auto;
      justify-content: flex-start;
      gap: 0.35rem;
      padding: calc(0.8rem + env(safe-area-inset-top)) 16px 0.9rem;
      background: rgba(5, 16, 10, 0.97);
      border-bottom: 1px solid var(--accent);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
    }
    .win p { font-size: 0.78rem; line-height: 1.45; }
    .win p:empty { display: none; }
    .win .btn { margin-top: 0.3rem; padding: 0.6rem 1.8rem; }
    .win .answer {
      font-size: 1.4rem;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(61, 224, 138, 0.45);
      font-variant-numeric: tabular-nums;
    }
    .win .big { font-size: 1.6rem; color: var(--accent); }
    .win.show .big { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1) both; }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .menu-list {
      width: 100%;
      max-width: 20rem;
      display: flex;
      flex-direction: column;
    }
    .menu-item {
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      background: none;
      border: none;
      border-top: 1px solid var(--hairline);
      padding: 0.95rem 0.2rem;
      text-align: left;
      cursor: pointer;
    }
    .menu-item:last-child { border-bottom: 1px solid var(--hairline); }
    .menu-item:active { background: var(--accent-soft); }
    .menu-item.danger { color: var(--ink-soft); }
    .menu-item.armed { color: var(--accent); }
    .counter { font-variant-numeric: tabular-nums; }
    .counter b { color: var(--accent); font-weight: 500; }

    /* Téléphone couché : deux colonnes — textes et boutons à gauche, le
       boulier (avec plus de tiges) à droite, sur toute la hauteur */
    @media (orientation: landscape) and (max-height: 600px) {
      body {
        display: grid;
        grid-template-columns: minmax(250px, 40%) 1fr;
        grid-template-rows: auto auto auto 1fr auto auto;
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      .topbar, .levels, .readout, .badgebar, .bottombar { grid-column: 1; }
      .topbar { grid-row: 1; padding-top: 0.5rem; }
      .levels { grid-row: 2; margin-top: 0.3rem; }
      .readout { grid-row: 3; margin-top: 0.2rem; }
      .badgebar { grid-row: 5; }
      .bottombar { grid-row: 6; padding-bottom: 0.5rem; }
      .stage { grid-column: 2; grid-row: 1 / -1; padding: 0.5rem 16px; }
      h1 { font-size: 1.4rem; }
      .levels .chip { font-size: 0.6rem; padding: 0.2rem 0.45rem; }
      .value { font-size: 2rem; }
      .task { font-size: 0.9rem; }
      .split { font-size: 0.78rem; }
      .badgebar { flex-wrap: wrap; height: auto; max-height: 4.6rem; }
      /* Réussite : dans la colonne de gauche, le boulier reste entier à droite */
      .overlay.win {
        inset: 0 auto 0 0;
        width: max(250px, 40%);
        justify-content: center;
        padding: 0.8rem 16px;
        border-bottom: none;
        border-right: 1px solid var(--accent);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bead polygon { transition: none; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <header>
      <a class="back" href="../" data-t="back">← Portfolio</a>
      <h1>Soroban</h1>
    </header>
    <div class="subline">
      <button class="link-btn" id="menuBtn" aria-label="Menu">☰ Menu</button>
    </div>
  </div>
  <div class="levels" id="levels" hidden></div>

  <div class="readout" aria-live="polite">
    <div class="task" id="task" hidden></div>
    <div class="value" id="value">0</div>
    <div class="split" id="split"></div>
  </div>

  <div class="stage">
    <svg class="soroban" id="soroban" role="group" aria-label="Soroban"></svg>
  </div>

  <div class="badgebar" id="badgeBar" hidden></div>

  <div class="bottombar">
    <button class="btn quiet" id="slowBtn" data-t="slow" hidden>Voir au ralenti</button>
    <button class="btn quiet" id="resetBtn" data-t="reset">Remettre à zéro</button>
  </div>

  <div class="overlay win" id="winOverlay" hidden>
    <div class="big" id="winTitle"></div>
    <div class="answer" id="winAnswer"></div>
    <p id="winUsed"></p>
    <p id="winBadge"></p>
    <button class="btn" id="nextBtn" data-t="next">Suivant</button>
  </div>

  <!-- Menu ☰ : tout ce qui n'est pas le boulier lui-même -->
  <div class="overlay" id="menuOverlay" hidden>
    <div class="big">Menu</div>
    <div class="menu-list">
      <button class="menu-item" id="mSandbox"></button>
      <button class="menu-item" id="mLang"></button>
      <button class="menu-item" id="mHist" data-t="hist">Historique</button>
      <button class="menu-item danger" id="mErase" data-t="erase">Réinitialiser la progression</button>
    </div>
    <p class="counter" id="mCounter"></p>
    <button class="btn" id="menuClose" data-t="close">Fermer</button>
  </div>

  <div class="overlay" id="histOverlay" hidden>
    <div class="big" data-t="hist">Historique</div>
    <p data-t="install"></p>
    <ul class="hist-list" id="histList"></ul>
    <button class="btn" id="histClose" data-t="close">Fermer</button>
  </div>

  <script>
    (function () {
      // Un soroban : chaque tige porte une perle du haut (vaut 5) et quatre
      // perles du bas (valent 1 chacune). Une perle compte quand elle touche
      // la barre du milieu. Une seule mécanique : pousser des perles.
      //
      // Les perles sont des ressorts, pas des animations CSS : elles
      // résistent un peu sous le doigt, basculent d'un coup passé un seuil
      // (comme un cran), et reviennent en rebondissant si on les lâche
      // avant. Tout est recalculé image par image, seulement tant que
      // quelque chose bouge (batterie).

      // ---------- Réglages ----------

      var RODS = 5;              // tiges : 5 en portrait, plus en paysage (voir fitRods)
      var MIN_ROD_PX = 56;       // en paysage, jamais une tige plus étroite que ça
      var MAX_RODS = 13;
      var STORE = "soroban-";    // préfixe localStorage
      var SVGNS = "http://www.w3.org/2000/svg";

      var TAP_PX = 6;            // en deçà, un appui reste un toucher
      var STICK = 9;             // unités à vaincre avant que la perle suive
      var STICK_GIVE = 0.12;     // elle ne bouge presque pas tant qu'elle colle
      // Ressort plus lent qu'avant : on doit voir la perle glisser d'un
      // bout à l'autre (≈ 0,3 s), jamais un saut d'une place à l'autre
      var SPRING_K = 150;        // raideur du ressort
      var SPRING_C = 19;         // amortissement (< 24,5 : léger rebond)
      var DEMO_STEP_MS = 850;    // un geste de la démo au ralenti

      // Géométrie (unités du viewBox). Une tige tous les 100.
      var COL = 100;
      var BEAD_H = 40;
      var PAD = 8;
      var TOP = 0;
      var BEAM = 120;
      var BOTTOM = 364;
      var LABEL_Y = 410;

      var HEAVEN_OFF = TOP + PAD + BEAD_H / 2;
      var HEAVEN_ON = BEAM - PAD - BEAD_H / 2;
      function earthOn(i) { return BEAM + PAD + BEAD_H / 2 + i * (BEAD_H + 2); }
      function earthOff(i) { return BOTTOM - PAD - BEAD_H / 2 - (3 - i) * (BEAD_H + 2); }

      // Perle vue de profil : un losange aplati aux pointes coupées
      var BEAD_POINTS = "-42,0 -15,-20 15,-20 42,0 15,20 -15,20";

      // « Réduire les animations » (iOS) : la perle glisse quand même —
      // un mouvement continu, sans rebond — au lieu de sauter à sa place
      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion) SPRING_C = 2 * Math.sqrt(SPRING_K);

      // ---------- Stockage (toujours en try/catch, jamais interprété) ----------

      function load(key) { try { return localStorage.getItem(STORE + key); } catch (e) { return null; } }
      function save(key, v) { try { localStorage.setItem(STORE + key, v); } catch (e) {} }

      // ---------- Langue ----------

      var TXT = {
        fr: {
          back: "← Portfolio", hist: "Historique", free: "Libre", ops: "Opérations",
          sandboxOn: "Bac à sable", sandboxOff: "Retour aux opérations", sandbox: "Bac à sable : bouge les perles librement.",
          langItem: "English", erase: "Réinitialiser la progression", eraseSure: "Sûr ? Appuie encore pour tout remettre à zéro", erased: "Progression remise à zéro.",
          moved: "Perles déplacées depuis le début : {n}",
          reset: "Remettre à zéro", slow: "Voir au ralenti",
          next: "Suivant", close: "Fermer", empty: " — tige vide",
          install: "Pour l'avoir comme une appli : Partager → « Sur l'écran d'accueil ». Si tu n'entends rien, monte le volume.",
          yourTurn: "À toi : suis les perles qui clignotent.",
          follow: "Bouge les perles qui clignotent.",
          oops: "Pas celle-là : remets-la, puis suis les perles qui clignotent.",
          cheers: ["Bravo !", "Bien joué !", "C'est compris !", "Parfait !", "Superbe !"],
          used: "Tu as utilisé : {list}.",
          badge: "Badge gagné : {b}. Il apparaît en bas : appuie dessus et il fait ces gestes tout seul.",
          badgeCant: "Le badge {b} ne sait pas faire ce geste : à toi !",
          badgeDone: "Le badge {b} a fait sa part. À toi :",
          levels: { direct: "+ direct", c5: "+ avec 5", c10: "+ avec 10", sdirect: "− direct", s5: "− avec 5", s10: "− avec 10", mul: "×", div: "÷", pow: "puissance", sqrt: "√", mix: "∞ entraînement libre" },
          mixEmpty: "Gagne d'abord un badge pour t'entraîner librement.",
          techs: { direct: "l'ajout direct", c5: "le complément à 5", c10: "le complément à 10 (retenue)", sdirect: "le retrait direct", s5: "le complément à 5 en retirant", s10: "le complément à 10 (emprunt)" },
          blk: {
            pose: "pose {n}", add: "ajoute {n}", sub: "retire {n}",
            mul: "{d} × {b} = {p} → ajoute {p}",
            div: "{b} × {m} = {v} → retire {v}",
            pow: "× {a} : ajoute {k} × {v}",
            sqrt1: "{t}² = {q} → retire {q}",
            sqrt2: "({d} + {u}) × {u} = {x} → retire {x}",
            sqrtPose: "pose {m} (= {n},00 : un chiffre après la virgule)"
          },
          rest: "reste {r}", pasapas: "Même idée que le badge ✦ 10 de Pas à Pas (faire 10).",
          cap: {
            zero: "on remet à zéro", pose: "",
            direct: "+{a} : direct", c5: "+{a} = +5 − {b}", c10: "+{a} = +10 − {b}", carry: "retenue : +1 à gauche",
            sdirect: "−{a} : direct", s5: "−{a} = −5 + {b}", s10: "−{a} = −10 + {b}", borrow: "emprunt : −1 à gauche"
          }
        },
        en: {
          back: "← Portfolio", hist: "History", free: "Free", ops: "Operations",
          sandboxOn: "Sandbox", sandboxOff: "Back to operations", sandbox: "Sandbox: move the beads freely.",
          langItem: "Français", erase: "Reset progress", eraseSure: "Sure? Tap again to reset everything", erased: "Progress reset.",
          moved: "Beads moved since the start: {n}",
          reset: "Clear", slow: "Show slowly",
          next: "Next", close: "Close", empty: " — empty rod",
          install: "To use it like an app: Share → “Add to Home Screen”. If you hear nothing, turn the volume up.",
          yourTurn: "Your turn: follow the blinking beads.",
          follow: "Move the blinking beads.",
          oops: "Not that one: put it back, then follow the blinking beads.",
          cheers: ["Well done!", "Nice!", "You got it!", "Perfect!", "Superb!"],
          used: "You used: {list}.",
          badge: "Badge earned: {b}. It shows up at the bottom: tap it and it does these moves by itself.",
          badgeCant: "The {b} badge can't do this move: your turn!",
          badgeDone: "The {b} badge did its part. Your turn:",
          levels: { direct: "+ direct", c5: "+ with 5", c10: "+ with 10", sdirect: "− direct", s5: "− with 5", s10: "− with 10", mul: "×", div: "÷", pow: "power", sqrt: "√", mix: "∞ free practice" },
          mixEmpty: "Earn a badge first to practise freely.",
          techs: { direct: "direct adding", c5: "the 5-complement", c10: "the 10-complement (carry)", sdirect: "direct taking away", s5: "the 5-complement when taking away", s10: "the 10-complement (borrow)" },
          blk: {
            pose: "set {n}", add: "add {n}", sub: "take away {n}",
            mul: "{d} × {b} = {p} → add {p}",
            div: "{b} × {m} = {v} → take away {v}",
            pow: "× {a}: add {k} × {v}",
            sqrt1: "{t}² = {q} → take away {q}",
            sqrt2: "({d} + {u}) × {u} = {x} → take away {x}",
            sqrtPose: "set {m} (= {n}.00: one digit after the point)"
          },
          rest: "remainder {r}", pasapas: "Same idea as the ✦ 10 badge in Pas à Pas (making ten).",
          cap: {
            zero: "clearing the board", pose: "",
            direct: "+{a}: direct", c5: "+{a} = +5 − {b}", c10: "+{a} = +10 − {b}", carry: "carry: +1 on the left",
            sdirect: "−{a}: direct", s5: "−{a} = −5 + {b}", s10: "−{a} = −10 + {b}", borrow: "borrow: −1 on the left"
          }
        }
      };

      var lang = load("lang");
      if (lang !== "fr" && lang !== "en") lang = "fr"; // français par défaut, même sur un téléphone en anglais

      function fmt(s, o) {
        return s.replace(/\{(\w+)\}/g, function (m, k) { return o && k in o ? o[k] : m; });
      }
      function t(key, o) { return fmt(TXT[lang][key], o); }
      function numStr(n) { return n.toLocaleString(lang === "fr" ? "fr-FR" : "en-US"); }

      function applyLang() {
        document.documentElement.lang = lang;
        var els = document.querySelectorAll("[data-t]");
        for (var i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute("data-t"));
        refreshMenu();
        buildLevels();
        showTask();
        render();
      }

      // ---------- État ----------
      // Un chiffre par tige, de gauche (grands ordres) à droite (unités).

      // Sauvegarde : seulement une chaîne de 1 à MAX_RODS chiffres
      // (REGLES-JEUX.md, Sécurité) — relue comme un nombre, puis étalée
      // sur le nombre de tiges du moment
      var savedValue = (function () {
        var raw = load("state");
        if (raw && /^[0-9]{1,13}$/.test(raw)) return Number(raw);
        return 0;
      })();
      var digits = [];
      var lastRod = -1;
      var busy = false;          // démo en cours : le doigt n'agit plus
      var caption = null;        // légende de démo, sinon décomposition

      function value() {
        var n = 0;
        for (var j = 0; j < RODS; j++) n = n * 10 + digits[j];
        return n;
      }

      // ---------- Dessin ----------

      var svg = document.getElementById("soroban");
      var rods = [];
      var allBeads = [];

      function el(name, attrs, parent) {
        var n = document.createElementNS(SVGNS, name);
        for (var k in attrs) n.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(n);
        return n;
      }

      // (Re)construit le boulier avec n tiges, en gardant le nombre posé
      function buildBoard(n, keepValue) {
        RODS = n;
        drag = null;
        digits = digitsOf(keepValue >= Math.pow(10, n) ? 0 : keepValue);
        lastRod = -1;
        svg.textContent = "";
        rods = [];
        allBeads = [];
        var W = COL * RODS;
        svg.setAttribute("viewBox", "-6 -6 " + (W + 12) + " " + (LABEL_Y + 22));

        // Halo phosphore des perles actives (filtre SVG : plus fiable sur
        // Safari iOS qu'un filtre CSS sur des éléments SVG)
        var defs = el("defs", {}, svg);
        var filter = el("filter", { id: "glow", x: "-30%", y: "-60%", width: "160%", height: "220%" }, defs);
        el("feGaussianBlur", { stdDeviation: "3", result: "b" }, filter);
        var merge = el("feMerge", {}, filter);
        el("feMergeNode", { "in": "b" }, merge);
        el("feMergeNode", { "in": "SourceGraphic" }, merge);

        for (var r0 = 0; r0 < RODS; r0++) {
          var cx0 = COL * r0 + COL / 2;
          el("line", { "class": "rod", x1: cx0, y1: TOP, x2: cx0, y2: BOTTOM }, svg);
        }
        el("rect", { "class": "frame", x: 0, y: TOP, width: W, height: BOTTOM - TOP, rx: 6 }, svg);
        el("line", { "class": "beam", x1: 0, y1: BEAM, x2: W, y2: BEAM }, svg);
        // Repère sur la barre : unités, puis tous les trois rangs
        for (var p0 = 0; p0 < RODS; p0++) {
          if ((RODS - 1 - p0) % 3 === 0) el("circle", { "class": "dot", cx: COL * p0 + COL / 2, cy: BEAM, r: 3.5 }, svg);
        }

        // Une perle = un petit objet physique
        // { g, rod, kind, idx, x, y, v, target, held, base }
        for (var r1 = 0; r1 < RODS; r1++) {
          var x1 = COL * r1 + COL / 2;
          var rodObj = { heaven: makeBead(x1, r1, "h", 0), earth: [], label: null };
          for (var i1 = 0; i1 < 4; i1++) rodObj.earth.push(makeBead(x1, r1, "e", i1));
          rodObj.label = el("text", { "class": "digit", x: x1, y: LABEL_Y }, svg);
          rods.push(rodObj);
        }
        render(true);
      }

      // Combien de tiges : 5 en portrait ; en paysage, autant que la
      // largeur le permet sans que les perles deviennent trop petites
      function fitRods() {
        var stage = document.querySelector(".stage");
        var w = stage.clientWidth - 32, h = stage.clientHeight - 12;
        if (window.innerHeight >= window.innerWidth || w <= 0 || h <= 0) return 5;
        var n = 5;
        while (n < MAX_RODS) {
          var scale = Math.min(w / (COL * (n + 1) + 12), h / (LABEL_Y + 22));
          if (COL * scale < MIN_ROD_PX) break;
          n++;
        }
        return n;
      }

      function makeBead(x, rod, kind, idx) {
        var g = el("g", { "class": "bead", tabindex: "0" }, svg);
        el("polygon", { points: BEAD_POINTS }, g);
        var b = { g: g, rod: rod, kind: kind, idx: idx, x: x, y: 0, v: 0, target: 0, held: false, base: 0, on: false, hint: false };
        allBeads.push(b);
        g.addEventListener("pointerdown", function (ev) { onDown(b, ev); });
        g.addEventListener("keydown", function (ev) {
          if (busy) return;
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggleBead(b); }
          else if (ev.key === "ArrowUp") { ev.preventDefault(); pushBead(b, -1); }
          else if (ev.key === "ArrowDown") { ev.preventDefault(); pushBead(b, 1); }
        });
        return b;
      }

      // « on » : la perle compte ; « hint » : c'est elle qu'il faut bouger
      function applyCls(b) {
        b.g.setAttribute("class", "bead" + (b.on ? " on" : "") + (b.hint ? " hint" : ""));
      }

      function draw(b) {
        // Léger écrasement selon la vitesse : la perle a de la matière
        var s = Math.min(0.14, Math.abs(b.v) / 3500);
        b.g.setAttribute("transform",
          "translate(" + b.x + "," + b.y.toFixed(2) + ") scale(" + (1 + s * 0.6).toFixed(3) + "," + (1 - s).toFixed(3) + ")");
      }

      // Cibles et classes d'après l'état ; la physique fait le reste
      function render(instant) {
        for (var r = 0; r < RODS; r++) {
          var d = digits[r];
          var five = d >= 5, ones = d % 5;
          setTarget(rods[r].heaven, five ? HEAVEN_ON : HEAVEN_OFF, five, instant);
          for (var i = 0; i < 4; i++) {
            var on = i < ones;
            setTarget(rods[r].earth[i], on ? earthOn(i) : earthOff(i), on, instant);
          }
          rods[r].label.textContent = d;
          rods[r].label.setAttribute("class", d ? "digit on" : "digit");
        }
        document.getElementById("value").textContent = numStr(value());
        renderSplit();
        kick();
      }

      function setTarget(b, y, on, instant) {
        b.target = y;
        b.on = on;
        applyCls(b);
        if (instant) { b.y = y; b.v = 0; draw(b); }
      }

      function renderSplit() {
        var split = document.getElementById("split");
        split.textContent = "";
        split.className = "split";
        if (caption) {
          split.textContent = caption.text;
          if (caption.good) split.className = "split good";
          return;
        }
        if (lastRod < 0) return;
        var dd = digits[lastRod];
        var bEl = document.createElement("b");
        bEl.textContent = dd;
        split.appendChild(bEl);
        var rest;
        if (dd >= 5) rest = " = 5 + " + (dd - 5);
        else if (dd === 0) rest = t("empty");
        else if (dd === 1) rest = "";
        else rest = " = " + new Array(dd + 1).join("1 + ").slice(0, -3);
        split.appendChild(document.createTextNode(rest));
      }

      // ---------- Physique ----------

      var running = false, lastT = 0;
      function kick() {
        if (running) return;
        running = true;
        lastT = performance.now();
        requestAnimationFrame(step);
      }
      function step(now) {
        var dt = Math.min(1 / 30, (now - lastT) / 1000);
        lastT = now;
        var moving = false;
        for (var i = 0; i < allBeads.length; i++) {
          var b = allBeads[i];
          if (b.held) { moving = true; continue; }
          var a = SPRING_K * (b.target - b.y) - SPRING_C * b.v;
          b.v += a * dt;
          b.y += b.v * dt;
          if (Math.abs(b.target - b.y) < 0.05 && Math.abs(b.v) < 0.5) { b.y = b.target; b.v = 0; }
          else moving = true;
          draw(b);
        }
        if (moving) requestAnimationFrame(step);
        else running = false;
      }

      // ---------- Geste ----------
      // Tant que le doigt reste posé, la perle le suit, vers le haut comme
      // vers le bas (après un petit cran de résistance au départ). Elle
      // pousse les perles qu'elle rencontre ; celles qu'elle a poussées
      // pendant ce geste reviennent avec elle si le doigt repart dans
      // l'autre sens, jusqu'à leur place de départ. Le chiffre change en
      // direct quand une perle passe le milieu de sa course ; au lâcher,
      // chaque perle se range à la place la plus proche.

      var drag = null;
      var PITCH = BEAD_H + 2;    // écart entre deux perles du bas qui se touchent

      function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

      function onDown(b, ev) {
        ev.preventDefault();
        if (busy || drag) return;
        unlockAudio();
        var ctm = svg.getScreenCTM();
        var rod = rods[b.rod];
        var members = [rod.heaven].concat(rod.earth);
        drag = {
          b: b, pid: ev.pointerId, startY: ev.clientY, moved: false,
          unstuck: false, shift: 0, unitsPerPx: ctm ? 1 / ctm.d : 1, members: members
        };
        members.forEach(function (x) { x.held = true; x.base = x.y; x.v = 0; });
        try { b.g.setPointerCapture(ev.pointerId); } catch (e) {}
        kick();
      }

      function onMove(ev) {
        if (!drag || ev.pointerId !== drag.pid) return;
        var dyPx = ev.clientY - drag.startY;
        if (Math.abs(dyPx) > TAP_PX) drag.moved = true;
        var d = dyPx * drag.unitsPerPx, off;
        if (!drag.unstuck && Math.abs(d) < STICK) off = d * STICK_GIVE;   // collée : elle résiste
        else {
          if (!drag.unstuck) { drag.unstuck = true; drag.shift = (d > 0 ? 1 : -1) * STICK * (1 - STICK_GIVE); }
          off = d - drag.shift;                                            // décollée : sous le doigt
        }
        var b = drag.b, rod = rods[b.rod];
        if (b.kind === "h") {
          b.y = clamp(b.base + off, HEAVEN_OFF, HEAVEN_ON);
          draw(b);
        } else {
          var i = b.idx;
          var yi = clamp(b.base + off, earthOn(i), earthOff(i));
          for (var k = 0; k < 4; k++) {
            var x = rod.earth[k], y;
            if (k === i) y = yi;
            else if (k < i) y = Math.min(x.base, yi - (i - k) * PITCH);   // au-dessus : poussées vers la barre
            else y = Math.max(x.base, yi + (k - i) * PITCH);              // en dessous : poussées vers le bas
            x.y = clamp(y, earthOn(k), earthOff(k));
            draw(x);
          }
        }
        // Le chiffre d'après les positions : une perle compte dès qu'elle a
        // passé le milieu de sa course vers la barre
        var five = rod.heaven.y > (HEAVEN_OFF + HEAVEN_ON) / 2 ? 5 : 0, ones = 0;
        for (var e = 0; e < 4; e++) if (rod.earth[e].y < (earthOn(e) + earthOff(e)) / 2) ones++;
        var nd = five + ones;
        if (nd !== digits[b.rod]) userSet(b.rod, nd, (nd >= 5) !== (digits[b.rod] >= 5));
      }

      function endDrag(tap) {
        if (!drag) return;
        var d = drag;
        drag = null;
        d.members.forEach(function (x) { x.held = false; x.v = 0; });
        if (tap) toggleBead(d.b);
        kick();
      }

      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", function (ev) {
        if (drag && ev.pointerId === drag.pid) endDrag(!drag.moved);
      });
      window.addEventListener("pointercancel", function (ev) {
        if (drag && ev.pointerId === drag.pid) endDrag(false);
      });

      // Toucher : la perle bascule avec celles qui la séparent de la barre
      function toggleBead(b) {
        var d = digits[b.rod], five = d >= 5 ? 5 : 0, ones = d % 5;
        if (b.kind === "h") five = five ? 0 : 5;
        else ones = b.idx < ones ? b.idx : b.idx + 1;
        userSet(b.rod, five + ones, b.kind === "h");
      }

      // Glissé (ou flèches) : la perle va dans le sens du geste, sinon rien
      function pushBead(b, dir) {
        var d = digits[b.rod], five = d >= 5 ? 5 : 0, ones = d % 5;
        if (b.kind === "h") five = dir > 0 ? 5 : 0;
        else if (dir < 0) ones = Math.max(ones, b.idx + 1);
        else ones = Math.min(ones, b.idx);
        if (five + ones === d) return;
        userSet(b.rod, five + ones, b.kind === "h");
      }

      // Compteur de perles déplacées (tout : mes gestes, badges, ralenti)
      var moved = (function () {
        var raw = load("moved");
        return raw && /^[0-9]{1,15}$/.test(raw) ? Number(raw) : 0;
      })();
      function beadDelta(a, b) { return ((a >= 5) !== (b >= 5) ? 1 : 0) + Math.abs(a % 5 - b % 5); }
      function countMove(a, b) {
        var d = beadDelta(a, b);
        if (!d) return;
        moved += d;
        save("moved", String(moved));
      }

      function setDigit(rod, v) {
        countMove(digits[rod], v);
        digits[rod] = v;
        lastRod = rod;
        save("state", String(value()));
      }

      function userSet(rod, v, heavy) {
        toc(heavy, 1);
        buzz(8);
        caption = null;
        setDigit(rod, v);
        render();
        guideCheck();
      }

      // ---------- Son ----------
      // Web Audio. Trois pièges sur iPhone, tous parés ici :
      // - le son ne se débloque qu'à la fin d'un toucher (touchend / click),
      //   pas au moment où le doigt se pose ;
      // - avec l'interrupteur « silencieux », Web Audio se tait, sauf si la
      //   page se déclare en lecture (navigator.audioSession, iOS 17+) ;
      // - le petit haut-parleur ne rend presque rien sous ~500 Hz : le
      //   « toc » de bois est donc placé plus haut, doux par l'enveloppe
      //   (attaque arrondie, extinction rapide), pas par des graves.

      var actx = null, unlocked = false, master = null, stale = false;
      // Retour sur la page (autre appli, menu, retour arrière…) : iOS laisse
      // souvent le contexte audio « interrompu », parfois muet même s'il se
      // dit « running ». On le jette et on en recrée un neuf au geste suivant.
      document.addEventListener("visibilitychange", function () { if (!document.hidden) stale = true; });
      window.addEventListener("pageshow", function (e) { if (e.persisted) stale = true; });
      function unlockAudio() {
        if (stale && actx) {
          try { actx.close(); } catch (e) {}
          actx = null;
          unlocked = false;
        }
        stale = false;
        try {
          if (navigator.audioSession && navigator.audioSession.type !== "playback") {
            navigator.audioSession.type = "playback";
          }
        } catch (e) {}
        try {
          if (!actx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            actx = new AC();
            master = actx.createGain();
            master.gain.value = 0.9;
            var lp = actx.createBiquadFilter();
            lp.type = "lowpass";
            lp.frequency.value = 5200;
            master.connect(lp);
            lp.connect(actx.destination);
          }
          if (actx.state !== "running") actx.resume();
          if (!unlocked) {
            // Un échantillon muet joué dans le geste : c'est ce qui
            // « ouvre » réellement le son sur Safari iOS
            var buf = actx.createBuffer(1, 1, 22050);
            var src = actx.createBufferSource();
            src.buffer = buf;
            src.connect(actx.destination);
            src.start(0);
            unlocked = true;
          }
        } catch (e) {}
      }
      ["touchend", "click", "keydown", "pointerdown"].forEach(function (ty) {
        document.addEventListener(ty, unlockAudio, { capture: true, passive: true });
      });

      function tone(f0, f1, peak, decay, when, type) {
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(f0, when);
        o.frequency.exponentialRampToValueAtTime(f1, when + decay * 0.6);
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, when + decay);
        o.connect(g);
        g.connect(master);
        o.start(when);
        o.stop(when + decay + 0.03);
      }

      function toc(heavy, vol) {
        try {
          unlockAudio();
          if (!actx) return;
          var w = actx.currentTime + 0.01;
          // Grave, comme une perle de bois épaisse : le corps est bas, et
          // c'est l'onde triangle (ses harmoniques) plus un petit claquement
          // qui le rendent audible sur le haut-parleur d'un téléphone
          var f = (heavy ? 105 : 140) * (0.97 + Math.random() * 0.06);
          tone(f, f * 0.8, 0.6 * vol, 0.16, w, "triangle");      // corps de la perle
          tone(f * 3.1, f * 2.8, 0.07 * vol, 0.03, w);           // petit claquement boisé
        } catch (e) {}
      }

      function chime() {
        try {
          unlockAudio();
          if (!actx) return;
          var w = actx.currentTime + 0.02;
          [392, 494, 587, 784].forEach(function (f, i) {
            tone(f, f, 0.16, 1.1, w + i * 0.11);
          });
        } catch (e) {}
      }

      function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

      // ---------- Méthode du soroban ----------
      // Pour un chiffre à ajouter ou retirer sur une tige, la suite exacte
      // des gestes : direct, complément à 5, ou complément à 10 (avec
      // retenue / emprunt sur la tige de gauche). Chaque geste = une tige
      // qui change de valeur, avec sa légende (cap) et l'étape du calcul à
      // laquelle il appartient (blk). Sert à guider, à jouer la démo au
      // ralenti et à dire quelles techniques un exercice demande.

      function planner(start) {
        // Chaque geste porte aussi sa technique (tech : celle du niveau
        // qui l'enseigne — les gestes internes d'un complément à 10 restent
        // « c10 ») et l'opération dont il fait partie (op : ×, ÷… ou rien).
        // C'est ce qui dit quel badge sait le faire tout seul.
        var D = start.slice(), moves = [], tech = {}, blk = "", op = null;
        function cap(k, o) { return fmt(TXT[lang].cap[k], o); }
        function set(r, v, c, tg) {
          if (r < 0) throw new Error("overflow");
          D[r] = v;
          moves.push({ rod: r, to: v, cap: c, blk: blk, tech: tg || "direct", op: op });
        }
        function add(r, a, ctx, tg) {
          if (!a) return;
          if (r < 0) throw new Error("overflow");
          var d = D[r], five = d >= 5, ones = d % 5;
          if (a < 5 && ones + a <= 4) { tech.direct = 1; set(r, d + a, ctx || cap("direct", { a: a }), tg || "direct"); }
          else if (a < 5 && !five) {
            tech.c5 = 1;
            var c = ctx || cap("c5", { a: a, b: 5 - a });
            set(r, d + 5, c, tg || "c5");
            set(r, d + a, c, tg || "c5");
          }
          else if (a >= 5 && !five && d + a <= 9) { tech.direct = 1; set(r, d + a, ctx || cap("direct", { a: a }), tg || "direct"); }
          else {
            tech.c10 = 1;
            var c2 = ctx || cap("c10", { a: a, b: 10 - a });
            sub(r, 10 - a, c2, tg || "c10");
            add(r - 1, 1, c2 + " · " + cap("carry"), tg || "c10");
          }
        }
        function sub(r, a, ctx, tg) {
          if (!a) return;
          if (r < 0) throw new Error("overflow");
          var d = D[r], five = d >= 5, ones = d % 5;
          if (a < 5 && ones >= a) { tech.sdirect = 1; set(r, d - a, ctx || cap("sdirect", { a: a }), tg || "sdirect"); }
          else if (a < 5 && five) {
            tech.s5 = 1;
            var c = ctx || cap("s5", { a: a, b: 5 - a });
            set(r, d - 5, c, tg || "s5");
            set(r, d - a, c, tg || "s5");
          }
          else if (a >= 5 && d >= a) { tech.sdirect = 1; set(r, d - a, ctx || cap("sdirect", { a: a }), tg || "sdirect"); }
          else {
            tech.s10 = 1;
            var c2 = ctx || cap("s10", { a: a, b: 10 - a });
            sub(r - 1, 1, c2 + " · " + cap("borrow"), tg || "s10");
            add(r, 10 - a, c2, tg || "s10");
          }
        }
        // Un nombre entier, chiffre par chiffre, de gauche à droite comme
        // sur un vrai soroban. shift = décalage vers la gauche (dizaines…)
        function number(n, fn, shift) {
          var s = String(n);
          for (var i = 0; i < s.length; i++) {
            var place = s.length - 1 - i + (shift || 0);
            fn(RODS - 1 - place, s.charCodeAt(i) - 48);
          }
        }
        return {
          D: D, moves: moves, tech: tech, cap: cap, set: set,
          block: function (text, o) { blk = text; op = o || null; },
          addN: function (n, shift) { number(n, add, shift); },
          subN: function (n, shift) { number(n, sub, shift); },
          pose: function (n) {
            var d = digitsOf(n);
            for (var r = 0; r < RODS; r++) if (d[r] !== D[r]) set(r, d[r], cap("pose"), "direct");
          }
        };
      }

      function digitsOf(n) {
        var d = [];
        for (var i = RODS - 1; i >= 0; i--) { d[i] = n % 10; n = Math.floor(n / 10); }
        return d;
      }
      function valueOf(D) { var n = 0; for (var j = 0; j < RODS; j++) n = n * 10 + D[j]; return n; }

      // ---------- Opérations ----------
      // Chaque exercice = une suite de gestes calculée d'avance, du boulier
      // vide au résultat. On guide geste par geste : les perles à bouger
      // clignotent, la ligne du haut dit l'étape du calcul, celle du bas la
      // technique (complément à 5, à 10…).

      var LEVELS = ["direct", "c5", "c10", "sdirect", "s5", "s10", "mul", "div", "pow", "sqrt"];
      var SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
      function sup(n) { return String(n).replace(/\d/g, function (c) { return SUP.charAt(+c); }); }

      var badges = (function () {
        var o = {};
        var raw = load("badges") || "";
        // Seulement des noms de niveaux connus, séparés par des virgules
        raw.split(",").forEach(function (k) { if (LEVELS.indexOf(k) >= 0) o[k] = 1; });
        return o;
      })();
      function saveBadges() {
        save("badges", Object.keys(badges).join(","));
        // Registre commun aux projets (voir ../VISION.md, « Badges partagés ») :
        // chaque projet publie ses badges sous pm_badges_<projet>
        try { localStorage.setItem("pm_badges_soroban", Object.keys(badges).join(",")); } catch (e) {}
      }
      // Badge ✦ 10 de Pas à Pas (« faire 10 ») : même geste que le
      // complément à 10 du soroban — on le montre sur ce niveau
      function pasapasTen() {
        try { return localStorage.getItem("pasapas_badge_dix") === "1"; } catch (e) { return false; }
      }

      var mode = load("mode") === "ops" ? "ops" : "free";
      // "mix" = entraînement libre : des questions tirées au hasard parmi les
      // niveaux dont on a le badge ; on les fait avec les badges-outils, et
      // à la main quand aucun badge ne couvre un geste
      var level = LEVELS.indexOf(load("level")) >= 0 || load("level") === "mix" ? load("level") : "direct";
      function earnedLevels() { return LEVELS.filter(function (lv) { return badges[lv]; }); }
      var ex = null;

      function rnd(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }

      // Le plan complet d'un exercice, du boulier vide jusqu'au bout
      function buildPlan(e) {
        var B = TXT[lang].blk;
        var p = planner(digitsOf(0));
        if (e.op === "√" && e.approx) {
          p.block(fmt(B.sqrtPose, { m: numStr(e.a), n: numStr(e.n) }));
          p.pose(e.a);
        } else if (e.op !== "×") {
          p.block(fmt(B.pose, { n: numStr(e.a) }));
          p.pose(e.a);
        }
        if (e.op === "+") { p.block(fmt(B.add, { n: numStr(e.b) })); p.addN(e.b); }
        else if (e.op === "−") { p.block(fmt(B.sub, { n: numStr(e.b) })); p.subN(e.b); }
        else if (e.op === "×") {
          // Un produit partiel par chiffre, ajouté au bon rang
          var s = String(e.a);
          for (var i = 0; i < s.length; i++) {
            var place = s.length - 1 - i;
            var d = (s.charCodeAt(i) - 48) * Math.pow(10, place);
            if (!d) continue;
            p.block(fmt(B.mul, { d: numStr(d), b: e.b, p: numStr(d * e.b) }), "mul");
            p.addN((s.charCodeAt(i) - 48) * e.b, place);
          }
        }
        else if (e.op === "÷") {
          // On retire le diviseur par paquets : un chiffre du quotient à la fois
          var q = String(e.result);
          for (var j = 0; j < q.length; j++) {
            var pl = q.length - 1 - j, qd = q.charCodeAt(j) - 48;
            if (!qd) continue;
            var m = qd * Math.pow(10, pl);
            p.block(fmt(B.div, { b: e.b, m: numStr(m), v: numStr(m * e.b) }), "div");
            p.subN(qd * e.b, pl);
          }
        }
        else if (e.op === "^") {
          // a × a × … : multiplier v par a, c'est ajouter (a − 1) fois v
          var v = e.a;
          for (var k = 2; k <= e.b; k++) {
            p.block(fmt(B.pow, { a: e.a, k: e.a - 1, v: numStr(v) }), "pow");
            var sv = String(v);
            for (var i2 = 0; i2 < sv.length; i2++) {
              var part = (sv.charCodeAt(i2) - 48) * (e.a - 1);
              if (part) p.addN(part, sv.length - 1 - i2);
            }
            v *= e.a;
          }
        }
        else if (e.op === "√") {
          // Racine à deux chiffres (10t + u)² = 100t² + (20t + u)·u :
          // on retire d'abord (10t)², puis (20t + u) × u — il reste 0
          var r = e.result, tt = Math.floor(r / 10), u = r % 10;
          if (tt) {
            p.block(fmt(B.sqrt1, { t: numStr(tt * 10), q: numStr(tt * tt * 100) }), "sqrt");
            p.subN(tt * tt, 2);
          }
          if (u && !tt) {
            p.block(fmt(B.sqrt1, { t: u, q: numStr(u * u) }), "sqrt");
            p.subN(u * u);
          } else if (u) {
            p.block(fmt(B.sqrt2, { d: numStr(20 * tt), u: u, x: numStr((20 * tt + u) * u) }), "sqrt");
            p.subN((20 * tt + u) * u);
          }
        }
        // États successifs du boulier : states[0] = vide, states[i+1] = après le geste i
        var states = [digitsOf(0)], cur = digitsOf(0);
        p.moves.forEach(function (mv) { cur = cur.slice(); cur[mv.rod] = mv.to; states.push(cur); });
        e.moves = p.moves;
        e.states = states;
        e.tech = p.tech;
      }

      function exprOf(e) {
        if (e.op === "^") return numStr(e.a) + sup(e.b);
        if (e.op === "√") return "√" + numStr(e.approx ? e.n : e.a);
        return numStr(e.a) + " " + e.op + " " + numStr(e.b);
      }

      // Le résultat tel qu'on l'écrit : reste de la division, virgule de
      // la racine approchée (√2 ≈ 1,4 : on a calculé √200 ≈ 14)
      function answerOf(e) {
        if (e.op === "÷" && e.rem) return "= " + numStr(e.result) + ", " + t("rest", { r: e.rem });
        if (e.op === "√" && e.approx) return "≈ " + (e.result / 10).toLocaleString(lang === "fr" ? "fr-FR" : "en-US", { minimumFractionDigits: 1 });
        return "= " + numStr(e.result);
      }

      function fits(lv, tech) {
        var k = Object.keys(tech);
        // la pose du premier nombre compte comme « direct » : on l'ignore
        switch (lv) {
          case "direct": return k.length === 1 && tech.direct;
          case "c5": return tech.c5 && !tech.c10 && !tech.sdirect && !tech.s5 && !tech.s10;
          case "c10": return tech.c10 && !tech.s10;
          case "sdirect": return k.length === 1 && tech.sdirect;
          case "s5": return tech.s5 && !tech.s10 && !tech.c5 && !tech.c10;
          case "s10": return !!tech.s10 && !tech.c10;
        }
        return true;
      }

      // Petits nombres d'abord : le palier (0, 1, 2) monte avec le nombre
      // de réussites sur ce niveau — 3 réussites → 2 chiffres, 6 → 3 chiffres
      var wins = (function () {
        var o = {};
        (load("wins") || "").split(",").forEach(function (pair) {
          var m = /^([a-z0-9]+):([0-9]{1,6})$/.exec(pair);
          if (m && LEVELS.indexOf(m[1]) >= 0) o[m[1]] = Number(m[2]);
        });
        return o;
      })();
      function saveWins() {
        save("wins", Object.keys(wins).map(function (k) { return k + ":" + wins[k]; }).join(","));
      }
      function tierOf(lv) { var w = wins[lv] || 0; return w < 3 ? 0 : (w < 6 ? 1 : 2); }

      function candidate(lv, tries) {
        var tier = tierOf(lv);
        // si aucun exercice ne convient à ce palier (ex. un emprunt demande
        // au moins 2 chiffres), on autorise un chiffre de plus
        var hi = [9, 99, 999][Math.min(2, tier + Math.floor(tries / 300))];
        switch (lv) {
          case "mul":
            var m = tier === 0 ? rnd(2, 9) : (tier === 1 ? rnd(12, 99) : rnd(101, 999)), k = rnd(2, 9);
            return { op: "×", a: m, b: k, result: m * k };
          case "div":
            // À partir du 2e palier, une fois sur deux la division ne tombe
            // pas juste : il reste sur le boulier ce qu'on ne peut plus retirer
            var b = rnd(2, 9), rem = tier > 0 && Math.random() < 0.5 ? rnd(1, b - 1) : 0;
            // palier 0 : table (≤ 81) ; 1 : dividende ≤ 99 ; 2 : ≤ 999
            var q = tier === 0 ? rnd(2, 9) : (tier === 1 ? rnd(2, Math.floor((99 - rem) / b)) : rnd(11, Math.floor((999 - rem) / b)));
            return { op: "÷", a: b * q + rem, b: b, result: q, rem: rem };
          case "pow":
            var base = rnd(2, tier === 0 ? 5 : 9);
            var n = tier === 0 ? 2 : (base <= 3 ? rnd(2, 5) : (base <= 6 ? rnd(2, 3) : 2));
            return { op: "^", a: base, b: n, result: Math.pow(base, n) };
          case "sqrt":
            if (tier === 0) { var r0 = rnd(2, 9); return { op: "√", a: r0 * r0, b: 0, result: r0 }; }
            if (tier === 2 && tries % 2 === 0) {
              // Racine approchée à un chiffre après la virgule : √N ≈ √(N × 100) / 10
              var N = rnd(2, 99);
              if (Math.sqrt(N) % 1 === 0) N++;
              var M = N * 100;
              return { op: "√", a: M, n: N, b: 0, result: Math.floor(Math.sqrt(M)), approx: true };
            }
            var rt = rnd(11, 99);
            return { op: "√", a: rt * rt, b: 0, result: rt };
        }
        var a = rnd(1, hi), c = rnd(1, hi), op = lv.charAt(0) === "s" ? "−" : "+";
        if (op === "−" && c > a) { var tmp = a; a = c; c = tmp; }
        return { op: op, a: a, b: c, result: op === "+" ? a + c : a - c };
      }

      // Techniques utilisées par l'opération seule (sans la pose)
      function opTech(e) {
        try {
          var p = planner(digitsOf(e.a));
          if (e.op === "+") p.addN(e.b); else p.subN(e.b);
          return p.tech;
        } catch (er) { return null; }
      }

      function makeExercise(lv) {
        for (var tries = 0; tries < 900; tries++) {
          var e = candidate(lv, tries);
          if (e.op === "−" && e.a === e.b) continue;
          if (e.op === "+" || e.op === "−") {
            var tc = opTech(e);
            if (!tc || !fits(lv, tc)) continue;
          }
          try { buildPlan(e); } catch (er) { continue; }
          return e;
        }
        var f = { op: "+", a: 1, b: 1, result: 2 };
        buildPlan(f);
        return f;
      }

      function newExercise() {
        clampLevel();
        var lv = level;
        if (lv === "mix") {
          var pool = earnedLevels();
          if (!pool.length) { level = lv = "direct"; save("level", lv); buildLevels(); }
          else lv = pool[Math.floor(Math.random() * pool.length)];
        }
        ex = makeExercise(lv);
        ex.lv = lv;
        ex.k = 0;
        ex.watched = false;
        ex.solved = false;
        caption = { text: t("follow") };
        clearBoard();
        guideShow();
      }

      function stateOn(D, b) {
        var d = D[b.rod];
        return b.kind === "h" ? d >= 5 : b.idx < d % 5;
      }

      // Surbrillance : chaque perle dont la position diffère de l'état visé
      function setHints(targetD) {
        var any = false;
        allBeads.forEach(function (b) {
          var h = !!targetD && stateOn(targetD, b) !== stateOn(digits, b);
          if (h) any = true;
          if (h !== b.hint) { b.hint = h; applyCls(b); }
        });
        blink(any);
      }

      // Clignotement : un minuteur seulement tant qu'une perle est à bouger
      var blinkT = 0;
      function blink(on) {
        if (on && !blinkT) {
          svg.classList.remove("blink-off");
          blinkT = setInterval(function () { svg.classList.toggle("blink-off"); }, 420);
        } else if (!on && blinkT) {
          clearInterval(blinkT);
          blinkT = 0;
          svg.classList.remove("blink-off");
        }
      }

      function guideShow() {
        showTask();
        updateButtons();
        if (mode !== "ops" || !ex || ex.solved || busy) { setHints(null); renderSplit(); return; }
        var mv = ex.moves[ex.k];
        var prev = ex.states[ex.k], next = ex.states[ex.k + 1];
        // Une perle bougée qui n'appartient ni à l'état d'avant ni à celui
        // visé : on le dit gentiment, et la surbrillance montre la réparation
        var wrong = allBeads.some(function (b) {
          var now = stateOn(digits, b);
          return now !== stateOn(prev, b) && now !== stateOn(next, b);
        });
        caption = { text: wrong ? t("oops") : mv.cap };
        setHints(next);
        renderSplit();
      }

      function guideCheck() {
        if (mode !== "ops" || !ex || ex.solved || busy) return;
        var cur = digits.join("");
        for (var j = ex.k + 1; j < ex.states.length; j++) {
          if (ex.states[j].join("") === cur) { ex.k = j; break; }
        }
        if (ex.k >= ex.states.length - 1) finish(true);
        else guideShow();
      }

      function showTask() {
        var task = document.getElementById("task");
        if (mode !== "ops" || !ex) {
          // Bac à sable : une seule ligne pour dire où on est
          task.hidden = mode === "ops";
          task.textContent = mode === "ops" ? "" : t("sandbox");
          return;
        }
        task.hidden = false;
        task.textContent = "";
        task.appendChild(document.createTextNode(exprOf(ex)));
        var span = document.createElement("span");
        span.className = "step";
        if (ex.solved) span.textContent = "  " + answerOf(ex);
        else if (ex.moves[ex.k]) span.textContent = "  → " + ex.moves[ex.k].blk;
        task.appendChild(span);
      }

      function finish(byHand) {
        ex.solved = true;
        setHints(null);
        caption = null;
        showTask();
        updateButtons();
        renderSplit();
        var earned = false;
        wins[ex.lv] = (wins[ex.lv] || 0) + 1;
        saveWins();
        // Une réussite suffit, même après avoir regardé l'exemple au
        // ralenti (choix de Pierre) : on gagne le badge du niveau en cours
        if (!badges[ex.lv]) {
          badges[ex.lv] = 1;
          saveBadges();
          buildLevels();
          earned = true;
        }
        // Une petite seconde pour voir le boulier juste, puis les félicitations,
        // qui restent jusqu'à « Suivant »
        setTimeout(function () {
          var cheers = TXT[lang].cheers;
          document.getElementById("winTitle").textContent = cheers[Math.floor(Math.random() * cheers.length)];
          document.getElementById("winAnswer").textContent = exprOf(ex) + " " + answerOf(ex);
          var names = Object.keys(ex.tech).map(function (k) { return TXT[lang].techs[k]; });
          document.getElementById("winUsed").textContent = names.length ? t("used", { list: names.join(", ") }) : "";
          var badgeLine = earned ? t("badge", { b: TXT[lang].levels[ex.lv] }) : "";
          if (ex.tech.c10 && pasapasTen()) badgeLine = (badgeLine ? badgeLine + " " : "") + t("pasapas");
          document.getElementById("winBadge").textContent = badgeLine;
          var win = document.getElementById("winOverlay");
          win.hidden = false;
          win.classList.remove("show");
          void win.offsetWidth;
          win.classList.add("show");
          chime();
          buzz(30);
        }, byHand ? 900 : 400);
      }

      function updateButtons() {
        var ops = mode === "ops" && ex;
        document.getElementById("slowBtn").hidden = !ops || ex.solved;
        buildBadgeBar();
      }

      function clearBoard() {
        for (var i = 0; i < RODS; i++) { countMove(digits[i], 0); digits[i] = 0; }
        lastRod = -1;
        save("state", "0");
        render();
      }

      // ---------- Démo au ralenti ----------

      function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

      // Joue une suite de gestes sur le boulier, un toutes les `ms`
      function playSeq(moves, ms, vol) {
        var chain = Promise.resolve();
        moves.forEach(function (m) {
          chain = chain.then(function () {
            if (digits[m.rod] === m.to) return;
            var heavy = (digits[m.rod] >= 5) !== (m.to >= 5);
            toc(heavy, vol);
            caption = { text: m.cap };
            var task = document.getElementById("task");
            if (task.lastChild && m.blk) task.lastChild.textContent = "  → " + m.blk;
            setDigit(m.rod, m.to);
            render();
            return wait(ms);
          });
        });
        return chain;
      }

      function setBusy(on) {
        busy = on;
        document.body.classList.toggle("busy", on);
        buildBadgeBar();
      }

      // « Voir au ralenti » : l'exemple complet, geste par geste, puis la
      // main revient pour le refaire soi-même
      function demo() {
        if (busy || !ex) return;
        setBusy(true);
        ex.watched = true;
        setHints(null);
        var zero = planner(digits);
        zero.pose(0);
        var moves = zero.moves.map(function (m) { m.cap = zero.cap("zero"); m.blk = ""; return m; }).concat(ex.moves);
        playSeq(moves, DEMO_STEP_MS, 0.8).then(function () { return wait(1000); }).then(function () {
          setBusy(false);
          ex.k = 0;
          clearBoard();
          guideShow();
          caption = { text: t("yourTurn") };
          renderSplit();
        });
      }

      // ---------- Badges-outils ----------
      // Un badge gagné devient un bouton : il fait tout seul, en accéléré,
      // les gestes qu'il connaît, et s'arrête au premier geste qu'il ne
      // connaît pas — c'est alors à toi. Chaque badge inclut ceux d'avant :
      // le badge × fait aussi toutes les additions et soustractions.

      var TECH_ORDER = ["direct", "c5", "c10", "sdirect", "s5", "s10"];
      var BADGE_STEP_MS = 260;
      var SHORT = { direct: "+", c5: "+5", c10: "+10", sdirect: "−", s5: "−5", s10: "−10", mul: "×", div: "÷", pow: "xⁿ", sqrt: "√" };

      // Un badge ne fait que des techniques déjà gagnées (choix de Pierre) ;
      // comme les niveaux se débloquent dans l'ordre, ça revient à dire
      // qu'il inclut tous les badges d'avant
      function covers(lv, mv) {
        var i = LEVELS.indexOf(lv);
        if (TECH_ORDER.indexOf(mv.tech) > Math.min(i, TECH_ORDER.length - 1)) return false;
        if (!badges[mv.tech]) return false;
        return !mv.op || (LEVELS.indexOf(mv.op) <= i && !!badges[mv.op]);
      }

      function buildBadgeBar() {
        var bar = document.getElementById("badgeBar");
        bar.textContent = "";
        bar.hidden = mode !== "ops";
        LEVELS.forEach(function (lv) {
          if (!badges[lv]) return;
          var b = document.createElement("button");
          b.className = "bchip";
          b.textContent = "✦ " + SHORT[lv];
          b.title = TXT[lang].levels[lv];
          b.disabled = busy || !ex || ex.solved;
          b.addEventListener("click", function () { useBadge(lv); });
          bar.appendChild(b);
        });
      }

      function useBadge(lv) {
        if (busy || !ex || ex.solved || !badges[lv]) return;
        var name = TXT[lang].levels[lv];
        // D'abord, remettre en place une perle bougée par erreur
        var S = ex.states[ex.k], moves = [];
        for (var r = 0; r < RODS; r++) {
          if (digits[r] !== S[r]) moves.push({ rod: r, to: S[r], cap: "", blk: "" });
        }
        var k = ex.k;
        while (k < ex.moves.length && covers(lv, ex.moves[k])) { moves.push(ex.moves[k]); k++; }
        if (k === ex.k) {
          // Ce badge ne sait pas faire le prochain geste
          caption = { text: t("badgeCant", { b: name }) };
          renderSplit();
          return;
        }
        setBusy(true);
        setHints(null);
        playSeq(moves, BADGE_STEP_MS, 0.6).then(function () {
          setBusy(false);
          ex.k = k;
          if (ex.k >= ex.states.length - 1) { finish(false); return; }
          guideShow();
          caption = { text: t("badgeDone", { b: name }) + " " + ex.moves[ex.k].cap };
          renderSplit();
        });
      }

      // ---------- Interface ----------

      // Un seul chemin : les niveaux se débloquent dans l'ordre. On voit
      // ceux déjà gagnés et le prochain à gagner ; les suivants gardent leur
      // place mais restent invisibles (le boulier ne change pas de taille
      // quand un niveau apparaît)
      function frontier() {
        for (var i = 0; i < LEVELS.length; i++) if (!badges[LEVELS[i]]) return i;
        return LEVELS.length - 1;
      }
      function clampLevel() {
        if (level === "mix") return;
        if (LEVELS.indexOf(level) > frontier()) { level = LEVELS[frontier()]; save("level", level); }
      }

      function buildLevels() {
        clampLevel();
        var box = document.getElementById("levels");
        box.textContent = "";
        box.hidden = mode !== "ops";
        // Entraînement libre en tête : dès le premier badge
        var m = document.createElement("button");
        m.className = "chip mix" + (earnedLevels().length ? "" : " locked");
        m.textContent = TXT[lang].levels.mix;
        m.setAttribute("aria-pressed", level === "mix" ? "true" : "false");
        m.addEventListener("click", function () {
          if (busy || !earnedLevels().length) return;
          level = "mix";
          save("level", level);
          buildLevels();
          newExercise();
        });
        box.appendChild(m);
        var fr = frontier();
        LEVELS.forEach(function (lv, idx) {
          var b = document.createElement("button");
          b.className = "chip" + (badges[lv] ? " earned" : "") + (idx > fr ? " locked" : "");
          if (idx > fr) b.setAttribute("aria-hidden", "true");
          b.textContent = TXT[lang].levels[lv] + (lv === "c10" && pasapasTen() ? " ✦" : "");
          b.setAttribute("aria-pressed", lv === level ? "true" : "false");
          b.addEventListener("click", function () {
            if (busy || LEVELS.indexOf(lv) > frontier()) return;
            level = lv;
            save("level", lv);
            buildLevels();
            newExercise();
          });
          box.appendChild(b);
        });
      }

      function setMode(m) {
        if (busy) return;
        mode = m;
        save("mode", m);
        buildLevels();
        refreshMenu();
        caption = null;
        if (m === "ops") newExercise();
        else { ex = null; guideShow(); render(); }
      }

      // ---------- Menu ☰ ----------

      var menuOverlay = document.getElementById("menuOverlay");
      var eraseArmed = 0;
      function refreshMenu() {
        document.getElementById("mSandbox").textContent = mode === "ops" ? t("sandboxOn") : t("sandboxOff");
        document.getElementById("mLang").textContent = t("langItem");
        var er = document.getElementById("mErase");
        er.textContent = eraseArmed ? t("eraseSure") : t("erase");
        er.className = "menu-item danger" + (eraseArmed ? " armed" : "");
        var c = document.getElementById("mCounter");
        c.textContent = "";
        var parts = t("moved", { n: "\u0000" }).split("\u0000");
        c.appendChild(document.createTextNode(parts[0]));
        var bEl = document.createElement("b");
        bEl.textContent = numStr(moved);
        c.appendChild(bEl);
        c.appendChild(document.createTextNode(parts[1] || ""));
      }
      document.getElementById("menuBtn").addEventListener("click", function () {
        if (busy) return;
        eraseArmed = 0;
        refreshMenu();
        menuOverlay.hidden = false;
      });
      document.getElementById("menuClose").addEventListener("click", function () { menuOverlay.hidden = true; });
      document.getElementById("mSandbox").addEventListener("click", function () {
        menuOverlay.hidden = true;
        setMode(mode === "ops" ? "free" : "ops");
      });
      document.getElementById("mHist").addEventListener("click", function () {
        menuOverlay.hidden = true;
        histOverlay.hidden = false;
      });
      document.getElementById("mErase").addEventListener("click", function () {
        // Deux appuis pour effacer : pas de fausse manœuvre
        if (!eraseArmed) {
          eraseArmed = setTimeout(function () { eraseArmed = 0; refreshMenu(); }, 3500);
          refreshMenu();
          return;
        }
        clearTimeout(eraseArmed);
        eraseArmed = 0;
        // Toute la progression : badges, paliers de difficulté et compteur
        badges = {};
        wins = {};
        moved = 0;
        saveBadges();
        saveWins();
        save("moved", "0");
        level = "direct";
        save("level", level);
        refreshMenu();
        document.getElementById("mErase").textContent = t("erased");
        buildLevels();
        if (mode === "ops") newExercise();
      });
      document.getElementById("slowBtn").addEventListener("click", demo);
      document.getElementById("nextBtn").addEventListener("click", function () {
        document.getElementById("winOverlay").hidden = true;
        // Badge tout juste gagné : on passe au niveau suivant pas encore acquis
        if (level !== "mix" && badges[level]) {
          for (var i = LEVELS.indexOf(level) + 1; i < LEVELS.length; i++) {
            if (!badges[LEVELS[i]]) { level = LEVELS[i]; save("level", level); buildLevels(); break; }
          }
        }
        newExercise();
      });
      document.getElementById("resetBtn").addEventListener("click", function () {
        if (busy) return;
        var any = value() !== 0;
        caption = null;
        clearBoard();
        if (ex && !ex.solved) { ex.k = 0; guideShow(); }
        if (any) { toc(false, 0.7); setTimeout(function () { toc(true, 0.7); }, 70); }
      });
      document.getElementById("mLang").addEventListener("click", function () {
        if (busy) return;
        lang = lang === "fr" ? "en" : "fr";
        save("lang", lang);
        caption = null;
        if (ex && !ex.solved) { var k = ex.k; buildPlan(ex); ex.k = k; }
        applyLang();
        guideShow();
      });

      // ---------- Écran figé ----------
      // iOS ignore user-scalable=no : on bloque aussi le glissement de
      // page, le pincement (événements « gesture ») et le double-tap.

      document.addEventListener("touchmove", function (e) {
        if (e.target.closest && e.target.closest(".hist-list")) return;
        e.preventDefault();
      }, { passive: false });
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (ty) {
        document.addEventListener(ty, function (e) { e.preventDefault(); }, { passive: false });
      });
      var lastTouchEnd = 0;
      document.addEventListener("touchend", function (e) {
        var now = Date.now();
        if (now - lastTouchEnd < 350) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });

      // ---------- Historique ----------

      var VERSIONS = [
        { v: "v10", text: "Un seul chemin : les niveaux se débloquent dans l'ordre. On ne voit que les niveaux gagnés et le prochain à gagner ; les suivants apparaissent un par un. Un badge ne fait que des techniques déjà gagnées. L'entraînement libre passe en tête des niveaux." },
        { v: "v9", text: "Entraînement libre (∞, à la fin des niveaux, dès le premier badge) : des questions sans fin tirées au hasard parmi les niveaux dont tu as le badge ; on les fait en appuyant sur les badges, et à la main quand aucun badge ne couvre un geste (les perles clignotent)." },
        { v: "v8", text: "La perle tenue suit le doigt dans les deux sens tant qu'on ne la lâche pas (après le petit cran de départ). Elle pousse les perles qu'elle rencontre, et celles-ci reviennent avec elle si on repart dans l'autre sens pendant le même geste. Le chiffre change en direct quand une perle passe le milieu ; au lâcher, tout se range à la place la plus proche. Le son ne se coupe plus après un passage par le menu ou une autre appli. Menu : « Réinitialiser la progression » remet aussi le compteur de perles à zéro. Les perles à bouger clignotent vraiment (même avec « Réduire les animations »)." },
        { v: "v7", text: "Menu ☰ : bac à sable (manipuler librement), langue, historique, effacer les badges (deux appuis), et le compteur de perles déplacées depuis le début. Petits nombres d'abord : ils grandissent avec les réussites (3 → deux chiffres, 6 → trois). Son encore plus grave. Téléphone couché : deux colonnes et autant de tiges que possible sans perles trop petites." },
        { v: "v6", text: "Les badges deviennent des outils : chaque badge gagné apparaît en bas ; appuyer dessus fait tout seul, en accéléré, les gestes qu'il connaît, et s'arrête au premier geste qu'il ne connaît pas — c'est alors à toi. Chaque badge inclut ceux d'avant (le badge × fait aussi les additions). Remplace le bouton « D'un coup ». « Voir au ralenti » reste : l'exemple complet, pour savoir quoi faire. Un badge se gagne en réussissant une fois, même après avoir regardé le ralenti. Le message de réussite s'affiche en bandeau en haut : le boulier reste visible avec le résultat." },
        { v: "v5", text: "Le boulier garde toujours la même taille : les lignes de texte, les niveaux et les boutons ont une place fixe, il ne zoome plus ni ne dézoome tout seul pendant une opération. Sons beaucoup plus graves. Une perle touchée glisse toujours jusqu'à sa place, plus lentement, sans jamais se téléporter (même avec « Réduire les animations »). Légende « chiffre par chiffre » retirée. Français par défaut." },
        { v: "v4", text: "Division avec reste (ce qu'on ne peut plus retirer reste sur le boulier : 351 ÷ 4 = 87, reste 3). Racines approchées à un chiffre après la virgule (√2 ≈ 1,4 : on pose 200 et on calcule √200 ≈ 14). Le badge ✦ 10 de Pas à Pas s'affiche sur « + avec 10 » (même geste : faire 10). Utilisable hors ligne une fois ouvert (police comprise)." },
        { v: "v3", text: "Son réparé sur iPhone (débloqué à la fin du toucher, joue même en mode silencieux, placé dans des fréquences que le haut-parleur rend) et plus doux. Guidage pas à pas : les perles à bouger clignotent, la ligne du haut dit l'étape du calcul, celle du bas la technique ; une perle bougée par erreur est signalée. Réussite : une seconde de pause, puis un écran de félicitations qui reste jusqu'à « Suivant », avec les techniques utilisées. Nouvelles opérations : division (on retire le diviseur par paquets), puissances (multiplier = ajouter plusieurs fois), racines carrées (on retire (10t)², puis (20t + u) × u)." },
        { v: "v2", text: "Perles souples : elles résistent un peu sous le doigt, basculent d'un coup passé un cran, reviennent en rebondissant si on les lâche trop tôt, s'écrasent légèrement en arrivant. Son de bois plus doux, petite vibration (Android). Zoom et double-tap vraiment bloqués. Mode Opérations : poser un nombre puis ajouter, retirer ou multiplier ; « Voir au ralenti » montre chaque geste (compléments à 5 et à 10, retenues) ; un exercice réussi à la main sans avoir regardé gagne un badge qui débloque « D'un coup ». Français / anglais, installable sur l'écran d'accueil, perles utilisables au clavier." },
        { v: "v1", text: "Premier boulier : 5 tiges (jusqu'à 99 999), une perle du haut qui vaut 5, quatre du bas qui valent 1. Deux gestes : toucher une perle la fait basculer, la glisser au doigt la pousse dans le sens du geste. Nombre affiché avec la décomposition du dernier chiffre par rapport à 5 (7 = 5 + 2). Son de perle, état gardé d'une visite à l'autre, bouton de remise à zéro." }
      ];

      var histOverlay = document.getElementById("histOverlay");
      var histList = document.getElementById("histList");
      VERSIONS.forEach(function (entry) {
        var li = document.createElement("li");
        var bEl = document.createElement("b");
        bEl.textContent = entry.v;
        li.appendChild(bEl);
        li.appendChild(document.createTextNode(entry.text));
        histList.appendChild(li);
      });
      document.getElementById("histClose").addEventListener("click", function () { histOverlay.hidden = true; });

      // ---------- Démarrage ----------

      buildBoard(fitRods(), savedValue);
      applyLang();
      setMode(mode);

      // Téléphone tourné : on recompte les tiges, on garde le nombre posé
      // et, en plein exercice, l'étape où on en était
      var resizeT = 0;
      window.addEventListener("resize", function () {
        clearTimeout(resizeT);
        resizeT = setTimeout(function () {
          var n = fitRods();
          if (n === RODS || busy) return;
          buildBoard(n, value());
          if (ex && !ex.solved) {
            buildPlan(ex);
            var cur = digits.join(""), k = 0;
            for (var j = 0; j < ex.states.length; j++) if (ex.states[j].join("") === cur) k = j;
            ex.k = Math.min(k, ex.states.length - 2);
            guideShow();
          }
          renderSplit();
        }, 150);
      });

      // Installable et utilisable hors ligne : service worker « réseau
      // d'abord », comme Pas à Pas — toujours la version en ligne si
      // possible (la mise à jour automatique reste maître), la dernière
      // copie connue sinon
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
    })();
  </script>

  <script>
    // Mise à jour automatique (même principe que la page d'accueil du
    // portfolio). L'état — perles, badges, niveau, langue — est dans
    // localStorage et survit au rechargement, donc rien à perdre à
    // recharger dès qu'une nouvelle version est en ligne. Le paramètre
    // anti-cache dans l'URL de vérification est nécessaire : un simple
    // `cache: 'no-store'` n'empêche que la mise en cache locale du
    // navigateur, pas celle du CDN devant GitHub Pages.
    (function () {
      var PAGE = "soroban";
      var lastCheck = 0;
      async function checkForUpdate() {
        var now0 = Date.now();
        if (now0 - lastCheck < 1500) return; // évite les rafales de clics
        lastCheck = now0;
        try {
          var url = (location.pathname || "index.html") + "?_cb=" + now0;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) return;
          var tag = res.headers.get("etag") || res.headers.get("last-modified");
          if (!tag) return;
          var key = "pm_pageVersion_" + PAGE;
          var stored = localStorage.getItem(key);
          if (stored === null) { localStorage.setItem(key, tag); return; }
          if (tag !== stored) {
            var now = Date.now();
            var guard = "pm_lastUpdateReload_" + PAGE;
            var lastReload = 0;
            try { lastReload = Number(sessionStorage.getItem(guard)) || 0; } catch (e) {}
            if (now - lastReload < 10000) return;
            try {
              localStorage.setItem(key, tag);
              sessionStorage.setItem(guard, String(now));
            } catch (e) {}
            location.replace(location.pathname + "?_r=" + now);
          }
        } catch (e) {}
      }
      checkForUpdate();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) checkForUpdate(); });
      document.addEventListener("pointerdown", checkForUpdate, { passive: true });
    })();
  </script>
